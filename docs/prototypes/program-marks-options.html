s=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"surfacing program\"><title>surfacing program</title><desc>A gem cut as a hexagon, seen from above: its table and six facets apart by clean gaps, with three rays over it: a stone brought up into the light.</desc><mask id=\"hg\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"32\" height=\"32\"><rect width=\"32\" height=\"32\" fill=\"#fff\"/><path d=\"M16 12.23 L22.04 15.71 L22.04 22.69 L16 26.17 L9.96 22.69 L9.96 15.71Z\" fill=\"#000\"/><path d=\"M16 14.73 L19.87 16.96 L19.87 21.44 L16 23.67 L12.13 21.44 L12.13 16.96Z\" fill=\"#fff\"/><path d=\"M17.25 14.73 L17.25 6.8 L14.75 6.8 L14.75 14.73Z\" fill=\"#000\"/><path d=\"M20.5 18.05 L27.36 14.08 L26.11 11.92 L19.25 15.88Z\" fill=\"#000\"/><path d=\"M19.25 22.52 L26.11 26.48 L27.36 24.32 L20.5 20.35Z\" fill=\"#000\"/><path d=\"M14.75 23.67 L14.75 31.6 L17.25 31.6 L17.25 23.67Z\" fill=\"#000\"/><path d=\"M11.5 20.35 L4.64 24.32 L5.89 26.48 L12.75 22.52Z\" fill=\"#000\"/><path d=\"M12.75 15.88 L5.89 11.92 L4.64 14.08 L11.5 18.05Z\" fill=\"#000\"/></mask><g fill=\"#0891b2\"><path mask=\"url(#hg)\" d=\"M16 8.8 L25.01 14 L25.01 24.4 L16 29.6 L6.99 24.4 L6.99 14Z\"/><rect x=\"-1.25\" y=\"-1.8\" width=\"2.5\" height=\"3.6\" rx=\"1.25\" transform=\"translate(16 4.2) rotate(0)\"/><rect x=\"-1.25\" y=\"-1.8\" width=\"2.5\" height=\"3.6\" rx=\"1.25\" transform=\"translate(8.9 6.4) rotate(-52)\"/><rect x=\"-1.25\" y=\"-1.8\" width=\"2.5\" height=\"3.6\" rx=\"1.25\" transform=\"translate(23.1 6.4) rotate(52)\"/></g></svg>", "testing": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"testing program\"><title>testing program</title><desc>A spirit level: the bubble centred between two marks drawn as &gt; and &lt;, so the vial reads as a level that is true and as code pointing at its centre.</desc><mask id=\"lv\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"32\" height=\"32\"><rect width=\"32\" height=\"32\" fill=\"#fff\"/><g fill=\"#000\"><circle cx=\"16\" cy=\"16\" r=\"3.2\"/><path d=\"M6.8 12.5L10.3 16L6.8 19.5L5.3 18L7.3 16L5.3 14Z\"/><path d=\"M25.2 12.5L21.7 16L25.2 19.5L26.7 18L24.7 16L26.7 14Z\"/></g></mask><path fill=\"#d97706\" mask=\"url(#lv)\" d=\"M9 9H23A7 7 0 0 1 23 23H9A7 7 0 0 1 9 9Z\"/></svg>"}}, {"k": "h", "name": "H \u00b7 Level \u00b7 Hex cut", "icons": {"surfacing": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"surfacing program\"><title>surfacing program</title><desc>A gem cut as a hexagon, seen from above: its table and six facets apart by clean gaps, a cousin of the hub\u2019s hex nut.</desc><mask id=\"hg\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"32\" height=\"32\"><rect width=\"32\" height=\"32\" fill=\"#fff\"/><path d=\"M16 7.91 L23.01 11.96 L23.01 20.04 L16 24.09 L8.99 20.04 L8.99 11.95Z\" fill=\"#000\"/><path d=\"M16 10.41 L20.84 13.21 L20.84 18.79 L16 21.59 L11.16 18.79 L11.16 13.21Z\" fill=\"#fff\"/><path d=\"M17.25 10.41 L17.25 1 L14.75 1 L14.75 10.41Z\" fill=\"#000\"/><path d=\"M21.47 14.29 L29.62 9.58 L28.37 7.42 L20.22 12.12Z\" fill=\"#000\"/><path d=\"M20.22 19.88 L28.37 24.58 L29.62 22.42 L21.47 17.71Z\" fill=\"#000\"/><path d=\"M14.75 21.59 L14.75 31 L17.25 31 L17.25 21.59Z\" fill=\"#000\"/><path d=\"M10.53 17.71 L2.38 22.42 L3.63 24.58 L11.78 19.88Z\" fill=\"#000\"/><path d=\"M11.78 12.12 L3.63 7.42 L2.38 9.58 L10.53 14.29Z\" fill=\"#000\"/></mask><g fill=\"#0891b2\"><path mask=\"url(#hg)\" d=\"M16 3 L27.26 9.5 L27.26 22.5 L16 29 L4.74 22.5 L4.74 9.5Z\"/></g></svg>", "testing": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"testing program\"><title>testing program</title><desc>A spirit level: the bubble centred between two marks drawn as &gt; and &lt;, so the vial reads as a level that is true and as code pointing at its centre.</desc><mask id=\"lv\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"32\" height=\"32\"><rect width=\"32\" height=\"32\" fill=\"#fff\"/><g fill=\"#000\"><circle cx=\"16\" cy=\"16\" r=\"3.2\"/><path d=\"M6.8 12.5L10.3 16L6.8 19.5L5.3 18L7.3 16L5.3 14Z\"/><path d=\"M25.2 12.5L21.7 16L25.2 19.5L26.7 18L24.7 16L26.7 14Z\"/></g></mask><path fill=\"#d97706\" mask=\"url(#lv)\" d=\"M9 9H23A7 7 0 0 1 23 23H9A7 7 0 0 1 9 9Z\"/></svg>"}}];
  const PROGRAMS = [['surfacing', 'Surfacing'], ['testing', 'Testing']];
  const SIZES = [16, 20, 24, 32, 48];
  const uri = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Home's project icons, through the viewer's stored token.
  let PROJECTS = [];
  try {
    const gh = new window.GH({ repo: 'mehrlander/home' });
    const m = JSON.parse((await gh.get('.web-tools.json')).text);
    PROJECTS = (await Promise.all((m.projects || []).filter(p => /\.svg$/.test(p.icon || '')).map(async p => {
      try { return { name: (p.label || p.name || p.path || '').split('/').pop(), svg: (await gh.get(p.icon)).text }; }
      catch { return null; }
    }))).filter(Boolean);
  } catch {}

  const S = { v: new URLSearchParams(location.hash.slice(1)).get('v') || 'now' };

  // One program's icon at a size: a drawn SVG, or for Now's Testing the
  // Phosphor glyph the declaration names.
  const mark = (o, prog, px) => o.icons[prog]
    ? `<img src="${uri(o.icons[prog])}" alt="" width="${px}" height="${px}" class="block shrink-0 size-[${px}px]">`
    : `<i class="ph ph-flask block shrink-0 text-base-content/60 leading-none text-[${px}px]"></i>`;

  function tabRows(o) {
    return PROGRAMS.map(([p, n]) => `
      <div class="flex items-center gap-2.5 border-b border-base-200 px-2 py-2.5">
        ${mark(o, p, 20)}
        <div class="min-w-0"><div class="font-medium">${n}</div>
        <div class="font-mono text-xs text-base-content/50">web-tools</div></div>
      </div>`).join('');
  }

  function sizes(o) {
    return PROGRAMS.map(([p, n]) => `
      <div class="flex items-end gap-5">
        ${SIZES.map(s => `<div class="flex flex-col items-center gap-1.5">${mark(o, p, s)}
          <span class="font-mono text-xs text-base-content/40">${s}</span></div>`).join('')}
      </div>`).join('');
  }

  // Programs placed among the projects, not first or last, so the eye finds
  // them by the cue alone.
  function among(o) {
    const items = PROJECTS.map(x => ({ name: x.name, html: `<img src="${uri(x.svg)}" alt="" class="block size-6">` }));
    const at = [Math.min(2, items.length), Math.min(6, items.length + 1)];
    PROGRAMS.forEach(([p, n], i) => items.splice(at[i], 0, { name: n, html: mark(o, p, 24) }));
    return `<div class="flex flex-wrap gap-x-6 gap-y-4">${items.map(x => `
      <div class="flex w-16 flex-col items-center gap-1.5">${x.html}
        <span class="max-w-full truncate text-xs text-base-content/60">${esc(x.name)}</span></div>`).join('')}</div>`;
  }

  const panel = (theme, body) => `<div data-theme="${theme}" class="rounded-box bg-base-100 p-5 flex flex-col gap-5">${body}</div>`;
  const label = t => `<h2 class="text-xs font-semibold uppercase tracking-wide text-base-content/50">${t}</h2>`;

  function render() {
    const o = OPTIONS.find(x => x.k === S.v) || OPTIONS[0];
    document.getElementById('strip').innerHTML = `
      <span class="shrink-0 text-sm font-semibold text-base-content/70">Program marks</span>
      ${OPTIONS.map(x => `<a href="#v=${x.k}" class="btn btn-xs shrink-0 ${x.k === o.k ? 'btn-neutral' : 'btn-ghost'}">${esc(x.name)}</a>`).join('')}`;
    document.getElementById('view').innerHTML = `
      <section class="flex flex-col gap-3">${label('Programs tab')}
        <div class="rounded-box border border-base-200">${tabRows(o)}</div></section>
      <section class="flex flex-col gap-3">${label('Sizes')}
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">${panel('winter', sizes(o))}${panel('dark', sizes(o))}</div></section>
      ${PROJECTS.length ? `<section class="flex flex-col gap-3">${label('Among home’s projects')}
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">${panel('winter', among(o))}${panel('dark', among(o))}</div></section>` : ''}`;
  }
  addEventListener('hashchange', () => { S.v = new URLSearchParams(location.hash.slice(1)).get('v') || 'now'; render(); });
  render();
</script>
</head>
<body class="min-h-dvh bg-base-200/40">
  <nav id="strip" class="sticky top-0 z-10 flex items-center gap-1.5 overflow-x-auto border-b border-amber-200 bg-amber-50 px-4 py-1.5"></nav>
  <main id="view" class="flex flex-col gap-8 p-4 sm:p-6"></main>
</body>
