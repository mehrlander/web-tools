<!-- Design sprint, round 5 (skills/design-sprint): the five stages as data in
     this page, each with its affordances and markers of quality, drawn as a
     staircase or a pyramid; each stage's figure, column and panel-tip are
     linked by hover and tap. Not app code. -->
<script>
  const MATURITY = {"levels": [{"name": "Summary", "lines": ["Summary"], "fmt": "MD", "kind": "Prose, usually Markdown", "affords": ["Quick to write", "Readable as plain text", "Renders on GitHub", "Diffs cleanly", "Suits argument and qualification"], "marks": ["Opens with its premise", "Introduces before referring", "Uses standard terms", "Qualifies noun phrases", "Links to sources rather than restating them"], "ref": "docs/QUALIFIED-WRITING.md", "refname": "Qualified writing", "n": 1, "color": "#c7e9b4", "on": "#1f2937", "href": "https://github.com/mehrlander/web-tools/blob/main/docs/QUALIFIED-WRITING.md"}, {"name": "Rich page", "lines": ["Rich", "page"], "fmt": "HTML", "kind": "HTML", "affords": ["Layout beyond one column", "Styling", "Drawn diagrams", "Interaction such as tabs and controls"], "marks": ["Usually built around a comparison", "Structure, labels and controls carry the meaning, not explanatory prose", "Layout follows the content", "Type at reading size", "One accent, and it means something"], "ref": "skills/html-style/SKILL.md", "refname": "html-style", "n": 2, "color": "#7fcdbb", "on": "#1f2937", "href": "https://github.com/mehrlander/web-tools/blob/main/skills/html-style/SKILL.md"}, {"name": "Modeled page", "lines": ["Modeled", "page"], "fmt": "HTML", "kind": "HTML read from a model of its content", "affords": ["Each fact has one source", "Rebuilt from the model and checked against it", "The model can feed other views"], "marks": ["One name per entity", "Each fact sits with the entity it describes; other places refer to it, copying only what a label needs", "Claims stay with whoever makes them", "Nothing in the source is lost"], "ref": "research/minimal-progressive-structure/theory.md", "refname": "Minimal progressive structure", "n": 3, "color": "#41b6c4", "on": "#1f2937", "href": "https://github.com/mehrlander/web-tools/blob/main/research/minimal-progressive-structure/theory.md"}, {"name": "Disclosed page", "lines": ["Disclosed", "page"], "fmt": "HTML", "kind": "The model shown for a reader's question", "affords": ["The reader starts at their question and goes as deep as they choose", "A term opens to its detail where it is used"], "marks": ["The answer is on the first screen", "The subject in full, its neighbors as labels that identify them", "Controls name what they reveal", "Each fact in full once", "Depth only as far as the content needs"], "ref": "research/minimal-progressive-structure/README.md", "refname": "Minimal progressive structure", "n": 4, "color": "#2c7fb8", "on": "#fff", "href": "https://github.com/mehrlander/web-tools/blob/main/research/minimal-progressive-structure/README.md"}, {"name": "In the app", "lines": ["In the", "app"], "fmt": "APP", "kind": "A view inside the shared app", "affords": ["Found through the app's navigation and search", "Its entities can link to their views elsewhere in the app"], "marks": ["Each subject has one view", "Content stays with its owner", "Needs no explanation of itself", "Uses the app's existing patterns"], "ref": "docs/APP.md", "refname": "The Web Tools app", "n": 5, "color": "#253494", "on": "#fff", "href": "https://github.com/mehrlander/web-tools/blob/main/docs/APP.md"}], "rows": [{"k": "affords", "label": "Affordances", "icon": "ph-hand-pointing"}, {"k": "marks", "label": "Markers of quality", "icon": "ph-seal-check"}]};
  document.addEventListener('alpine:init', () => Alpine.data('maturity', () => ({
    ...MATURITY, view: 'stair', hover: null, pinned: null, tip: null, closeX: '', _t: 0,
    get act() { return this.pinned ?? this.hover; },
    dim(i) { return this.act === null || this.act === i ? 1 : 0.3; },
    col(i) { return this.act === i ? 'bg-base-200' : (this.act === null ? '' : 'opacity-40'); },
    levelAt(ev) { const g = ev.target.closest('[data-level]'); return g ? { i: +g.dataset.level, el: g } : null; },
    overFig(ev) { const h = this.levelAt(ev); if (!h || this.pinned !== null) return;
      clearTimeout(this._t); this.hover = h.i; this.open(h.i, h.el, false); },
    outFig(ev) { if (this.pinned !== null) return; this.later(); },
    tapFig(ev) { const h = this.levelAt(ev); if (!h) return;
      if (this.pinned === h.i) return this.close(); this.pinned = h.i; this.open(h.i, h.el, true); },
    later() { clearTimeout(this._t); this._t = setTimeout(() => { if (this.pinned === null) { this.hover = null; this.tip = null; } }, 280); },
    keep() { clearTimeout(this._t); },
    open(i, el, pinned) {
      const r = el.getBoundingClientRect(), w = Math.min(360, innerWidth - 16);
      const x = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2));
      this.closeX = window.PanelTip ? window.PanelTip.closeHTML(pinned) : '';
      this.tip = { i, x, y: r.bottom + 8, w, r };
      this.$nextTick(() => { const el2 = this.$refs.tip; if (!el2 || !this.tip) return;
        const h = el2.offsetHeight; if (this.tip.y + h > innerHeight - 8) this.tip.y = Math.max(8, r.top - h - 8); });
    },
    close() { this.pinned = null; this.hover = null; this.tip = null; },
    init() { if (window.PanelTip) window.PanelTip.wire(this.$refs.tip, { onClose: () => this.close(), except: ['[data-level]'], label: 'stage' }); },
  })));
</script>

  <!-- The grid: a column per stage, linked to the figure by hover. -->
  <div class="hidden sm:block overflow-x-auto">
    <table class="table table-fixed text-base">
      <thead><tr><th class="w-40"></th>
        <template x-for="(l, i) in levels" :key="l.n">
          <th class="align-top cursor-pointer transition-colors" :class="col(i)" @mouseenter="hover = i" @mouseleave="hover = null" @click="pinned = pinned === i ? null : i">
            <span class="flex items-center gap-2"><span class="inline-grid place-items-center size-7 shrink-0 rounded-full text-sm font-bold" :style="`background:${l.color};color:${l.on}`" x-text="l.n"></span><span class="text-base font-semibold text-base-content text-balance" x-text="l.name"></span></span>
            <span class="block mt-1 text-sm font-normal text-base-content/60 text-balance" x-text="l.kind"></span>
          </th>
        </template></tr></thead>
      <tbody>
        <template x-for="r in rows" :key="r.k">
          <tr>
            <th class="align-top text-sm font-medium text-base-content/60"><i class="ph text-base mr-1.5" :class="r.icon"></i><span x-text="r.label"></span></th>
            <template x-for="(l, i) in levels" :key="l.n">
              <td class="align-top transition-colors" :class="col(i)" @mouseenter="hover = i" @mouseleave="hover = null"><ul class="flex flex-col gap-1.5 list-disc pl-4 marker:text-base-content/30"><template x-for="item in l[r.k]" :key="item"><li class="text-pretty" x-text="item"></li></template></ul></td>
            </template>
          </tr>
        </template>
        <tr>
          <th></th>
          <template x-for="(l, i) in levels" :key="l.n">
            <td class="align-top transition-colors text-sm" :class="col(i)" @mouseenter="hover = i" @mouseleave="hover = null"><a :href="l.href" target="_blank" rel="noopener" class="link link-hover text-base-content/60"><span x-text="l.refname"></span> ↗</a></td>
          </template>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- On a phone, a block per stage; a tap on the figure marks its block. -->
  <div class="sm:hidden flex flex-col gap-5">
    <template x-for="(l, i) in levels" :key="l.n">
      <div class="flex flex-col gap-3 rounded-box p-3 -mx-3 transition-colors" :class="act === i ? 'bg-base-200' : ''" @click="pinned = pinned === i ? null : i">
        <div class="flex items-center gap-2"><span class="inline-grid place-items-center size-7 shrink-0 rounded-full text-sm font-bold" :style="`background:${l.color};color:${l.on}`" x-text="l.n"></span><span class="text-lg font-semibold" x-text="l.name"></span><span class="text-sm text-base-content/60 text-balance" x-text="l.kind"></span></div>
        <template x-for="r in rows" :key="r.k">
          <div class="flex flex-col gap-1.5">
            <div class="text-sm font-medium text-base-content/60"><i class="ph mr-1.5" :class="r.icon"></i><span x-text="r.label"></span></div>
            <ul class="flex flex-col gap-1.5 list-disc pl-4 marker:text-base-content/30"><template x-for="item in l[r.k]" :key="item"><li class="text-pretty" x-text="item"></li></template></ul>
          </div>
        </template>
        <a :href="l.href" target="_blank" rel="noopener" class="link link-hover text-sm text-base-content/60"><span x-text="l.refname"></span> ↗</a>
      </div>
    </template>
  </div>

  <!-- The panel-tip: one stage's affordances and markers of quality. Hover
       opens it with grace; a tap pins it, and panel-tip.js owns the ways out. -->
  <div x-ref="tip" x-show="tip" x-cloak role="dialog" aria-label="Stage"
       class="[&[x-cloak]]:hidden fixed z-50 rounded-xl border border-base-300 bg-base-100 shadow-lg p-4 text-base leading-6"
       :style="tip ? `left:${tip.x}px;top:${tip.y}px;width:${tip.w}px` : ''" @mouseenter="keep()" @mouseleave="pinned === null && later()">
    <div x-html="closeX"></div>
    <template x-if="tip">
      <div class="flex flex-col gap-3 pr-5" x-data="{ get l() { return levels[tip.i]; } }">
        <div class="flex items-center gap-2">
          <span class="inline-grid place-items-center size-8 shrink-0 rounded-full font-bold" :style="`background:${l.color};color:${l.on}`" x-text="l.n"></span>
          <span class="flex flex-col"><span class="text-lg font-semibold" x-text="l.name"></span><span class="text-sm text-base-content/60" x-text="l.kind"></span></span>
        </div>
        <template x-for="r in rows" :key="r.k">
          <div class="flex flex-col gap-1.5">
            <div class="text-sm font-medium text-base-content/60"><i class="ph mr-1.5" :class="r.icon"></i><span x-text="r.label"></span></div>
            <ul class="flex flex-col gap-1.5 list-disc pl-4 marker:text-base-content/30"><template x-for="item in l[r.k]" :key="item"><li class="text-pretty" x-text="item"></li></template></ul>
          </div>
        </template>
        <a :href="l.href" target="_blank" rel="noopener" class="link link-hover text-sm text-base-content/60 border-t border-base-200 pt-2"><span x-text="l.refname"></span> ↗</a>
      </div>
    </template>
  </div>
</main>
