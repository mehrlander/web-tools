<!-- Design sprint, round 4 (skills/design-sprint): the five levels as data in
     this page, drawn as a staircase or a pyramid, each level's figure, column
     and panel-tip linked by hover and tap. Not app code. -->
<script>
  const MATURITY = {"levels": [{"name": "Notes", "fmt": "MD", "prop": "written", "facts": "In sentences, in Markdown files", "catches": "A person rereading it", "reach": "Opening the file, if they know it exists", "cost": "Nothing mechanical; it goes stale silently", "entry": "The facts exist only in prose", "good": "Qualified writing: each noun phrase says which one", "ref": "docs/QUALIFIED-WRITING.md", "n": 1, "color": "#c7e9b4", "on": "#1f2937", "href": "https://github.com/mehrlander/web-tools/blob/main/docs/QUALIFIED-WRITING.md"}, {"name": "Rows", "fmt": "CSV", "prop": "structured", "facts": "One per cell, in CSV or JSON with named columns", "catches": "Nothing yet, though rows can now be scanned and compared", "reach": "A table viewer, such as the Map's Data tab", "cost": "Keeping columns and values consistent", "entry": "A script can read the facts without parsing prose", "good": "Declared columns, one name per concept, one result per table", "ref": "docs/registries.md", "n": 2, "color": "#7fcdbb", "on": "#1f2937", "href": "https://github.com/mehrlander/web-tools/blob/main/docs/registries.md"}, {"name": "Checked", "fmt": "CSV", "prop": "checked", "facts": "The same rows", "catches": "A committed check in the suite: a schema, quotes found in sources, a payload rebuilt and compared", "reach": "As at Rows", "cost": "A builder and a check that must pass", "entry": "The suite fails if the rows, or anything built from them, go wrong", "good": "The check tests the claims that matter; a gold set scores whether they're right", "ref": "skills/gold-set/SKILL.md", "n": 3, "color": "#41b6c4", "on": "#1f2937", "href": "https://github.com/mehrlander/web-tools/blob/main/skills/gold-set/SKILL.md"}, {"name": "Page", "fmt": "HTML", "prop": "shown", "facts": "The checked rows, read by an HTML page", "catches": "The check, and a reader seeing facts side by side", "reach": "One link, to a view made for comparing or exploring", "cost": "The page and its payload", "entry": "The page reads the checked rows, not prose or copied numbers", "good": "Built for a comparison; it projects what matters", "ref": "skills/html-style/SKILL.md", "n": 4, "color": "#2c7fb8", "on": "#fff", "href": "https://github.com/mehrlander/web-tools/blob/main/skills/html-style/SKILL.md"}, {"name": "App", "fmt": "APP", "prop": "connected", "facts": "The checked rows, read by a view in the app", "catches": "The app's own tests as well", "reach": "Where related work is read: navigation, search, links between views", "cost": "App wiring, tests and registrations", "entry": "An app view reads the rows and the app's tests cover it", "good": "One thing in one place, reached from the app's own navigation", "ref": "docs/APP.md", "n": 5, "color": "#253494", "on": "#fff", "href": "https://github.com/mehrlander/web-tools/blob/main/docs/APP.md"}], "questions": [{"k": "facts", "label": "Where the facts live", "icon": "ph-map-pin"}, {"k": "catches", "label": "What catches a wrong fact", "icon": "ph-shield-check"}, {"k": "reach", "label": "How a reader gets there", "icon": "ph-door-open"}, {"k": "cost", "label": "What it costs to keep", "icon": "ph-wrench"}, {"k": "entry", "label": "Entry test", "icon": "ph-check-square"}, {"k": "good", "label": "What good looks like here", "icon": "ph-sparkle"}]};
  document.addEventListener('alpine:init', () => Alpine.data('maturity', () => ({
    ...MATURITY, view: 'stair', hover: null, pinned: null, tip: null, closeX: '', _t: 0,
    get act() { return this.pinned ?? this.hover; },
    dim(i) { return this.act === null || this.act === i ? 1 : 0.3; },
    col(i) { return this.act === i ? 'bg-base-200' : (this.act === null ? '' : 'opacity-40'); },
    levelAt(ev) { const g = ev.target.closest('[data-level]'); return g ? { i: +g.dataset.level, el: g } : null; },
    overFig(ev) { const h = this.levelAt(ev); if (!h || this.pinned !== null) return;
      clearTimeout(this._t); this.hover = h.i; this.open(h.i, h.el, false); },
    outFig(ev) { if (this.pinned !== null) return; this.later(); },
    tapFig(ev) { const h = this.levelAt(ev); if (!h) return;
      if (this.pinned === h.i) return this.close(); this.pinned = h.i; this.open(h.i, h.el, true); },
    later() { clearTimeout(this._t); this._t = setTimeout(() => { if (this.pinned === null) { this.hover = null; this.tip = null; } }, 280); },
    keep() { clearTimeout(this._t); },
    open(i, el, pinned) {
      const r = el.getBoundingClientRect(), w = Math.min(340, innerWidth - 16);
      const x = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2));
      this.closeX = window.PanelTip ? window.PanelTip.closeHTML(pinned) : '';
      this.tip = { i, x, y: r.bottom + 8, w, r };
      this.$nextTick(() => { const el2 = this.$refs.tip; if (!el2 || !this.tip) return;

    close() { this.pinned = null; this.hover = null; this.tip = null; },
    init() { if (window.PanelTip) window.PanelTip.wire(this.$refs.tip, { onClose: () => this.close(), except: ['[data-level]'], label: 'level' }); },
    here(s) { return 'Here when ' + s.charAt(0).toLowerCase() + s.slice(1) + '.'; },
  })));
</script>

  <!-- The grid: a column per level, linked to the figure by hover. -->
  <div class="hidden sm:block overflow-x-auto">
    <table class="table table-fixed text-base">
      <thead><tr><th class="w-44"></th>
        <template x-for="(l, i) in levels" :key="l.n">
          <th class="align-bottom cursor-pointer transition-colors rounded-t-lg" :class="col(i)" @mouseenter="hover = i" @mouseleave="hover = null" @click="pinned = pinned === i ? null : i">
            <span class="inline-flex items-center gap-2"><span class="inline-grid place-items-center size-7 rounded-full text-sm font-bold" :style="`background:${l.color};color:${l.on}`" x-text="l.n"></span><span class="text-base font-semibold text-base-content" x-text="l.name"></span></span>
          </th>
        </template></tr></thead>
      <tbody>
        <template x-for="q in questions" :key="q.k">
          <tr>
            <th class="align-top text-sm font-medium text-base-content/60"><i class="ph text-base mr-1.5" :class="q.icon"></i><span x-text="q.label"></span></th>
            <template x-for="(l, i) in levels" :key="l.n">
              <td class="align-top transition-colors" :class="[col(i), q.k === 'entry' ? 'font-medium' : '']" @mouseenter="hover = i" @mouseleave="hover = null">
                <span x-text="l[q.k]"></span>
                <a x-show="q.k === 'good'" :href="l.href" target="_blank" rel="noopener" class="link link-hover text-sm text-base-content/60 whitespace-nowrap"> ↗</a>
              </td>
            </template>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- On a phone, a block per level; a tap on the figure marks its block. -->
  <div class="sm:hidden flex flex-col gap-5">
    <template x-for="(l, i) in levels" :key="l.n">
      <div class="flex flex-col gap-2 rounded-box p-3 -mx-3 transition-colors" :class="act === i ? 'bg-base-200' : ''" @click="pinned = pinned === i ? null : i">
        <div class="flex items-center gap-2"><span class="inline-grid place-items-center size-7 rounded-full text-sm font-bold" :style="`background:${l.color};color:${l.on}`" x-text="l.n"></span><span class="text-lg font-semibold" x-text="l.name"></span><span class="text-sm text-base-content/60" x-text="'+ ' + l.prop"></span></div>
        <p class="text-base font-medium" x-text="here(l.entry)"></p>
        <template x-for="q in questions.slice(0, 4)" :key="q.k">
          <div class="flex gap-2 text-base"><i class="ph text-lg text-base-content/50 mt-0.5" :class="q.icon" :aria-label="q.label"></i><span x-text="l[q.k]"></span></div>
        </template>
        <div class="flex gap-2 text-sm text-base-content/70"><i class="ph ph-sparkle text-lg mt-0.5"></i><span><span x-text="l.good"></span> <a :href="l.href" target="_blank" rel="noopener" class="link link-hover">↗</a></span></div>
      </div>
    </template>
  </div>

  <ul class="flex flex-col gap-2 text-base">
    <li><span class="font-semibold">A page on notes is still level 1.</span> The Landscape explorer indexes excerpts of Markdown pages.</li>
    <li><span class="font-semibold">Content can move back down.</span> The CORE throughline view went back to a Markdown file once its use faded.</li>
  </ul>

  <!-- The panel-tip: one level's characteristics, composed for that level
       rather than as label and value. Hover opens it with grace; a tap pins it,
       and panel-tip.js owns the ways out. -->
  <div x-ref="tip" x-show="tip" x-cloak role="dialog" aria-label="Level"
       class="fixed z-50 rounded-xl border border-base-300 bg-base-100 shadow-lg p-4 text-base leading-6"
       :style="tip ? `left:${tip.x}px;top:${tip.y}px;width:${tip.w}px` : ''" @mouseenter="keep()" @mouseleave="pinned === null && later()">
    <div x-html="closeX"></div>
    <template x-if="tip">
      <div class="flex flex-col gap-3 pr-5" x-data="{ get l() { return levels[tip.i]; } }">
        <div class="flex items-center gap-2">
          <span class="inline-grid place-items-center size-8 rounded-full font-bold" :style="`background:${l.color};color:${l.on}`" x-text="l.n"></span>
          <span class="text-lg font-semibold" x-text="l.name"></span>
          <span class="badge badge-sm badge-ghost" x-text="'+ ' + l.prop"></span>
        </div>
        <p class="font-medium text-pretty" x-text="here(l.entry)"></p>
        <div class="flex flex-col gap-1.5">
          <template x-for="q in questions.slice(0, 3)" :key="q.k">
            <div class="flex gap-2"><i class="ph text-lg text-base-content/45 mt-0.5" :class="q.icon" :aria-label="q.label"></i><span class="text-pretty" x-text="l[q.k]"></span></div>
          </template>
        </div>
        <div class="flex items-center gap-2 text-sm text-base-content/70">
          <span class="flex gap-0.5" aria-hidden="true"><template x-for="k in 5" :key="k"><span class="w-3 h-2 rounded-sm" :style="`background:${k <= l.n ? l.color : 'var(--color-base-300)'}`"></span></template></span>
          <span x-text="l.cost"></span>
        </div>
        <div class="flex gap-2 text-sm text-base-content/70 border-t border-base-200 pt-2"><i class="ph ph-sparkle text-base mt-0.5"></i><span><span x-text="l.good"></span> <a :href="l.href" target="_blank" rel="noopener" class="link link-hover">↗</a></span></div>
      </div>
    </template>
  </div>
</main>
<style>[x-cloak]{display:none!important}</style>
