<!-- Design sprint, round 6 (skills/design-sprint): the four stages as data in
     this page. The figure selects a stage, and the area below it shows that
     stage's affordances and markers of quality. Not app code. -->
<script>
  const MATURITY = {"levels": [{"name": "Summary", "lines": ["Summary"], "fmt": "MD", "kind": "Prose, usually Markdown", "affords": "A Markdown summary organizes ideas and establishes a narrative. It is quick to write, renders on GitHub, and diffs cleanly.", "marks": ["Opens with its premise", "Introduces before referring", "Uses standard terms", "Qualifies noun phrases", "Links to sources rather than restating them"], "ref": "docs/QUALIFIED-WRITING.md", "refname": "Qualified writing", "n": 1, "color": "#c7e9b4", "on": "#1f2937", "href": "https://github.com/mehrlander/web-tools/blob/main/docs/QUALIFIED-WRITING.md"}, {"name": "Rich page", "lines": ["Rich", "page"], "fmt": "HTML", "kind": "HTML", "affords": "An HTML page can set content side by side, style it, and draw diagrams. Tabs and controls let the reader act on what it shows.", "marks": ["Facilitates comparison", "Structure, labels and controls carry the meaning, not explanatory prose", "Layout follows the content (beyond boilerplate)", "Uses color to communicate"], "ref": "skills/html-style/SKILL.md", "refname": "html-style", "n": 2, "color": "#7fcdbb", "on": "#1f2937", "href": "https://github.com/mehrlander/web-tools/blob/main/skills/html-style/SKILL.md"}, {"name": "Modeled page", "lines": ["Modeled", "page"], "fmt": "HTML", "kind": "HTML read from a model of its content", "affords": "A modeled page reads each fact from one source, so the page can be rebuilt from that source and checked against it. The same model can feed other views.", "marks": ["Aligned naming of entities", "Each fact sits with the entity it describes; other places refer to it, copying only what a label needs", "Claims stay with whoever makes them"], "ref": "research/minimal-progressive-structure/theory.md", "refname": "Minimal progressive structure", "n": 3, "color": "#41b6c4", "on": "#1f2937", "href": "https://github.com/mehrlander/web-tools/blob/main/research/minimal-progressive-structure/theory.md"}, {"name": "Designed page", "lines": ["Designed", "page"], "fmt": "HTML", "kind": "The model shown for a reader's question", "affords": "A designed page lets the reader start at their question and go as deep as they choose. Each term opens to its detail where it is used.", "marks": ["The answer is on the first screen", "The subject in full, its neighbors as labels that identify them", "Controls name what they reveal", "Each fact in full once", "Depth only as far as the content needs"], "ref": "research/minimal-progressive-structure/README.md", "refname": "Minimal progressive structure", "n": 4, "color": "#2c7fb8", "on": "#fff", "href": "https://github.com/mehrlander/web-tools/blob/main/research/minimal-progressive-structure/README.md"}]};
  document.addEventListener('alpine:init', () => Alpine.data('maturity', () => ({
    ...MATURITY, view: 'stair', sel: 0, hover: null,
    get l() { return this.levels[this.sel]; },
    at(ev) { const g = ev.target.closest('[data-level]'); return g ? +g.dataset.level : null; },
    hoverAt(ev) { this.hover = this.at(ev); },
    pick(ev) { const i = this.at(ev); if (i !== null) this.sel = i; },
    step(d) { this.sel = Math.max(0, Math.min(this.levels.length - 1, this.sel + d)); },
    key(ev) { if (ev.target.closest('input, textarea, select')) return;
      if (ev.key === 'ArrowRight') { ev.preventDefault(); this.step(1); }
      if (ev.key === 'ArrowLeft') { ev.preventDefault(); this.step(-1); } },
  })));
</script>
