  const PROGRAMS = [['surfacing', 'Surfacing'], ['testing', 'Testing']];
  const SIZES = [16, 20, 24, 32, 48];
  const uri = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Home's project icons, through the viewer's stored token.
  let PROJECTS = [];
  try {
    const gh = new window.GH({ repo: 'mehrlander/home' });
    const m = JSON.parse((await gh.get('.web-tools.json')).text);
    PROJECTS = (await Promise.all((m.projects || []).filter(p => /\.svg$/.test(p.icon || '')).map(async p => {
      try { return { name: (p.label || p.name || p.path || '').split('/').pop(), svg: (await gh.get(p.icon)).text }; }
      catch { return null; }
    }))).filter(Boolean);
  } catch {}

  const S = { v: new URLSearchParams(location.hash.slice(1)).get('v') || 'now' };

  // One program's icon at a size: a drawn SVG, or for Now's Testing the
  // Phosphor glyph the declaration names.
  const mark = (o, prog, px) => o.icons[prog]
    ? `<img src="${uri(o.icons[prog])}" alt="" width="${px}" height="${px}" class="block shrink-0 size-[${px}px]">`
    : `<i class="ph ph-flask block shrink-0 text-base-content/60 leading-none text-[${px}px]"></i>`;

  function tabRows(o) {
    return PROGRAMS.map(([p, n]) => `
      <div class="flex items-center gap-2.5 border-b border-base-200 px-2 py-2.5">
        ${mark(o, p, 20)}
        <div class="min-w-0"><div class="font-medium">${n}</div>
        <div class="font-mono text-xs text-base-content/50">web-tools</div></div>
      </div>`).join('');
  }

  function sizes(o) {
    return PROGRAMS.map(([p, n]) => `
      <div class="flex items-end gap-5">
        ${SIZES.map(s => `<div class="flex flex-col items-center gap-1.5">${mark(o, p, s)}
          <span class="font-mono text-xs text-base-content/40">${s}</span></div>`).join('')}
      </div>`).join('');
  }

  // Programs placed among the projects, not first or last, so the eye finds
  // them by the cue alone.
  function among(o) {
    const items = PROJECTS.map(x => ({ name: x.name, html: `<img src="${uri(x.svg)}" alt="" class="block size-6">` }));
    const at = [Math.min(2, items.length), Math.min(6, items.length + 1)];
    PROGRAMS.forEach(([p, n], i) => items.splice(at[i], 0, { name: n, html: mark(o, p, 24) }));
    return `<div class="flex flex-wrap gap-x-6 gap-y-4">${items.map(x => `
      <div class="flex w-16 flex-col items-center gap-1.5">${x.html}
        <span class="max-w-full truncate text-xs text-base-content/60">${esc(x.name)}</span></div>`).join('')}</div>`;
  }

  const panel = (theme, body) => `<div data-theme="${theme}" class="rounded-box bg-base-100 p-5 flex flex-col gap-5">${body}</div>`;
  const label = t => `<h2 class="text-xs font-semibold uppercase tracking-wide text-base-content/50">${t}</h2>`;

  function render() {
    const o = OPTIONS.find(x => x.k === S.v) || OPTIONS[0];
    document.getElementById('strip').innerHTML = `
      <span class="shrink-0 text-sm font-semibold text-base-content/70">Program icons</span>
      ${OPTIONS.map(x => `<a href="#v=${x.k}" class="btn btn-xs shrink-0 ${x.k === o.k ? 'btn-neutral' : 'btn-ghost'}">${esc(x.name)}</a>`).join('')}`;
    document.getElementById('view').innerHTML = `
      <section class="flex flex-col gap-3">${label('Programs tab')}
        <div class="rounded-box border border-base-200">${tabRows(o)}</div></section>
      <section class="flex flex-col gap-3">${label('Sizes')}
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">${panel('winter', sizes(o))}${panel('dark', sizes(o))}</div></section>
      ${PROJECTS.length ? `<section class="flex flex-col gap-3">${label('Among home’s projects')}
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">${panel('winter', among(o))}${panel('dark', among(o))}</div></section>` : ''}`;
  }
  addEventListener('hashchange', () => { S.v = new URLSearchParams(location.hash.slice(1)).get('v') || 'now'; render(); });
  render();
</script>
</head>
<body class="min-h-dvh bg-base-200/40">
  <nav id="strip" class="sticky top-0 z-10 flex items-center gap-1.5 overflow-x-auto border-b border-amber-200 bg-amber-50 px-4 py-1.5"></nav>
  <main id="view" class="flex flex-col gap-8 p-4 sm:p-6"></main>
</body>
