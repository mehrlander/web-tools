<!doctype html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model, with its markers</title>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
</head>
<body class="min-h-dvh bg-base-100 text-base-content">
<!-- A mock of the Map's Browser, Model tab (lib/alpineComponents/map.js,
     modelTreeSvg and modelKindsSvg), built 2026-11-10. Not app code. It redraws
     the tab's first figure in the names the codebook and the tables use
     (data/ui-units/codebook.md), draws each region in the colour of the
     attribute that marks it in a page's markup, and replaces the second
     figure's catalogue with the fifteen body codes of data/ui-units/codes.csv.
     The figure is built by the same three helpers the tab uses (t, box, svg),
     so it can move into map.js as it stands. Hovering a row or a region marks
     its counterparts. -->
<div class="p-4 lg:p-6 grid gap-6 xl:grid-cols-[minmax(0,44rem)_minmax(0,1fr)] xl:items-start">
  <div class="overflow-x-auto min-w-0"><div id="tree" class="min-w-[40rem]"></div></div>
  <div class="overflow-x-auto min-w-0">
    <table class="table">
      <thead><tr><th>Drawn</th><th>In the tables</th><th>In the markup</th><th>instances.csv</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="overflow-x-auto min-w-0 xl:col-span-2">
    <table class="table">
      <thead><tr id="codes-head"></tr></thead>
      <tbody id="codes"></tbody>
    </table>
  </div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// One colour per attribute: what marks the region in a page's markup.
const C = {
  none:  { box: 'fill-slate-100 stroke-slate-300', ink: 'fill-slate-600', tag: 'fill-white stroke-slate-300', dot: 'bg-slate-300' },
  unit:  { box: 'fill-white stroke-slate-700',        ink: 'fill-slate-800',       tag: 'fill-slate-100 stroke-slate-500',     dot: 'bg-slate-600' },
  slot:  { box: 'fill-amber-100 stroke-amber-700',       ink: 'fill-amber-800',       tag: 'fill-amber-50 stroke-amber-600',      dot: 'bg-amber-600' },
  pat:   { box: 'fill-blue-50 stroke-blue-600',          ink: 'fill-blue-700',        tag: 'fill-blue-50 stroke-blue-500',        dot: 'bg-blue-600' },
  part:  { box: 'fill-violet-100 stroke-violet-600',     ink: 'fill-violet-700',      tag: 'fill-violet-50 stroke-violet-500',    dot: 'bg-violet-600' },
  aria:  { box: 'fill-violet-100 stroke-emerald-600',    ink: 'fill-emerald-700',     tag: 'fill-emerald-50 stroke-emerald-600',  dot: 'bg-emerald-600' },
};

// map.js's svgKit, with a key on every mark so a region and its row light together.
const svgKit = () => {
  const out = [];
  let key = '';
  const k = (name, draw) => { key = name; out.push(`<g data-k="${name}" class="transition-opacity">`); draw(); out.push('</g>'); key = ''; };
  const t = (x, y, s, cls = 'fill-slate-500', o = {}) => out.push(`<text x="${x}" y="${y}" font-size="${o.size || 14}" class="${cls}"`
    + (o.bold ? ' font-weight="700"' : '') + (o.anchor ? ` text-anchor="${o.anchor}"` : '') + (o.mono ? ' font-family="ui-monospace, SFMono-Regular, Menlo, monospace"' : '') + `>${esc(s)}</text>`);
  const box = (x, y, w, h, cls, o = {}) => out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r ?? 8}" stroke-width="${o.sw || 1.5}" class="${cls}"`
    + (o.dash ? ' stroke-dasharray="5 3"' : '') + '/>');
  // The attribute as written, right-aligned at x: a mono label in a pill.
  const tag = (x, y, s, c) => { const w = s.length * 7.3 + 14; box(x - w, y - 15, w, 21, c.tag, { r: 10, sw: 1 }); t(x - w + 7, y, s, c.ink, { size: 12, mono: true }); };
  const svg = (w, h, label) => `<svg viewBox="0 0 ${w} ${h}" class="block w-full h-auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="${label}">${out.join('')}</svg>`;
  return { t, box, tag, k, svg };
};

const treeSvg = () => {
  const { t, box, tag, k, svg } = svgKit();
  k('shell', () => {
    box(4, 4, 696, 600, C.none.box, { r: 12 });
    t(16, 27, 'Shell', C.none.ink, { bold: true, size: 15 }); t(64, 27, 'bars and buttons around every page');
  });
  k('page', () => {
    box(14, 38, 676, 482, C.unit.box, { r: 10, sw: 2 });
    t(26, 62, 'Page', C.unit.ink, { bold: true, size: 15 }); t(70, 62, 'a view, a tab or a page');
    tag(678, 62, 'unit: a row of units.csv', C.unit);
  });
  k('frame', () => {
    box(26, 74, 652, 66, C.slot.box, { r: 6 });
    t(38, 96, 'Frame', C.slot.ink, { bold: true, size: 15 }); t(90, 96, 'how the reader chooses what the body shows');
    [['Tabs', 38, 62], ['Search box', 108, 96], ['Count chips', 212, 100]].forEach(([n, x, w]) => {
      box(x, 106, w, 24, 'fill-white stroke-amber-700', { r: 5, sw: 1.2 }); t(x + 9, 123, n, C.slot.ink, { size: 13 });
    });
    tag(666, 123, 'data-slot="frame:tabs"', C.slot);
  });
  k('body', () => {
    box(26, 150, 652, 358, C.pat.box, { dash: true });
    t(38, 173, 'Body', C.pat.ink, { bold: true, size: 15 }); t(82, 173, 'the main region, arranged in one pattern');
    tag(666, 173, 'data-pattern="list-detail"', C.pat);
  });
  k('list', () => {
    box(38, 186, 340, 310, 'fill-white stroke-violet-600', { r: 8 });
    t(50, 208, 'List', C.part.ink, { bold: true }); t(82, 208, 'holds the items');
    tag(366, 208, 'data-part="list"', C.part);
  });
  k('group', () => {
    t(50, 236, 'Group', C.part.ink, { bold: true }); t(96, 236, 'heads a run of items');
    tag(366, 236, 'group', C.part);
    out_line(50, 244, 366);
  });
  k('item', () => {
    box(50, 254, 316, 132, C.aria.box, { r: 7, sw: 2.5 });
    t(62, 275, 'Item', C.part.ink, { bold: true }); t(96, 275, 'one entry');
    tag(354, 275, 'item', C.part);
    [404, 450].forEach(y => box(50, y, 316, 36, C.part.box, { r: 7, sw: 1.2 }));
    t(62, 427, 'Item', C.part.ink, { bold: true });
    t(62, 473, 'Item', C.part.ink, { bold: true });
  });
  k('selected', () => { tag(292, 275, 'aria-current', C.aria); });
  k('anatomy', () => {
    [['title', 62, 286, 92], ['meta', 160, 286, 92], ['summary', 258, 286, 96],
     ['body', 62, 318, 92], ['links', 160, 318, 92], ['actions', 258, 318, 96]].forEach(([n, x, y, w]) => {
      box(x, y, w, 24, 'fill-white stroke-violet-500', { r: 4, sw: 1 }); t(x + 8, y + 17, n, C.part.ink, { size: 12, mono: true });
    });
    t(62, 368, "an item's anatomy, each a", 'fill-slate-500', { size: 13 }); t(230, 368, 'data-part', C.part.ink, { size: 12, mono: true });
  });
  k('nested', () => {
    box(232, 410, 124, 24, C.pat.box, { r: 4, sw: 1.2, dash: true });
    t(240, 427, 'its own pattern', C.pat.ink, { size: 13 });
  });
  k('detail', () => {
    box(390, 186, 276, 310, C.part.box, { r: 8 });
    t(402, 208, 'Detail', C.part.ink, { bold: true }); t(450, 208, 'the picked item in full');
    tag(654, 236, 'data-part="detail"', C.part);
    [[252, 150], [272, 240], [292, 210], [312, 232]].forEach(([y, w]) => box(402, y, w, 9, 'fill-violet-300 stroke-transparent', { r: 3, sw: 0 }));
    box(402, 336, 252, 96, 'fill-white stroke-violet-500', { r: 5, sw: 1 });
    [456, 472].forEach((y, i) => box(402, y, i ? 96 : 140, 9, 'fill-violet-300 stroke-transparent', { r: 3, sw: 0 }));
  });
  k('selected', () => {
    out_arrow(366, 320, 390, 320);
  });
  k('overlay', () => {
    box(266, 536, 420, 54, 'fill-slate-200 stroke-transparent', { r: 8 });
    box(260, 530, 420, 54, 'fill-white stroke-slate-500', { dash: true });
    t(272, 562, 'Overlay', 'fill-slate-900', { bold: true, size: 15 }); t(338, 562, 'a deck over the page');
    tag(668, 562, 'no marker', C.none);
  });
  return svg(704, 608, 'A page, what it holds, and the attribute that marks each region');
  function out_line(x1, y, x2) { box(x1, y, x2 - x1, 1.5, 'fill-violet-300 stroke-transparent', { r: 0, sw: 0 }); }
  function out_arrow(x1, y, x2) { box(x1, y - 1.5, x2 - x1 - 5, 3, 'fill-emerald-600 stroke-transparent', { r: 0, sw: 0 }); box(x2 - 8, y - 5, 8, 10, 'fill-emerald-600 stroke-transparent', { r: 2, sw: 0 }); }
};

// One row per drawn region: its name in the tables, its mark in the markup,
// and the column of instances.csv that reports on it.
const ROWS = [
  ['shell', 'none', 'Shell', 'body code host', '', ''],
  ['page', 'unit', 'Page', 'unit', 'region main or body', ''],
  ['frame', 'slot', 'Frame', 'frame code, any of 11', 'data-slot="frame:tabs"', 'slots'],
  ['body', 'pat', 'Body', 'body code, one of 15', 'data-pattern="list"', 'declared, contract'],
  ['list', 'part', 'List', 'part', 'data-part="list"', 'parts, missing'],
  ['group', 'part', 'Group', 'part', 'data-part="group"', 'parts'],
  ['item', 'part', 'Item', 'part', 'data-part="item"', 'parts, missing'],
  ['anatomy', 'part', 'Anatomy', 'part, six of them', 'data-part="title"', 'parts'],
  ['detail', 'part', 'Detail', 'part', 'data-part="detail"', 'parts, missing'],
  ['selected', 'aria', 'Picked item', '', 'aria-current="true"', 'contract'],
  ['nested', 'pat', 'Pattern in an item', 'body code', 'data-pattern="list"', 'contract: contains'],
  ['overlay', 'none', 'Overlay', 'phone code takeover', '', ''],
];

// The fifteen body codes of codes.csv, grouped by what the body holds. The
// grouping is this mock's; the parts and kits cells are the file's.
const CODES = [
  ['One object', [['Figure'], ['Document'], ['Fields'], ['Tool']]],
  ['A collection', [['List', 1], ['Card grid', 1], ['Grid', 0, 'tabulator'], ['Deck page', 0, 'swipe-deck']]],
  ['Regions tied together', [['List and detail', 1], ['Linked list and swiper', 0, 'swipe-deck (core)'], ['Header over swiper', 0, 'swipe-deck (core)'],
                              ['Source beside claim', 0, 'dock-split'], ['Stacked lists']]],
  ['Other pages, whole', [['App split'], ['Host']]],
];

const none = '<span class="text-base-content/30">none</span>';
const mono = s => s ? `<code class="font-mono text-sm">${esc(s)}</code>` : none;
document.getElementById('tree').innerHTML = treeSvg();
document.getElementById('rows').innerHTML = ROWS.map(([key, c, drawn, table, mark, check]) =>
  `<tr data-k="${key}" class="transition-opacity"><td class="font-semibold whitespace-nowrap"><span class="inline-block size-2.5 rounded-full mr-2 ${C[c].dot}"></span>${esc(drawn)}</td>`
  + `<td>${table ? esc(table) : none}</td><td class="whitespace-nowrap">${mono(mark)}</td><td class="whitespace-nowrap">${mono(check)}</td></tr>`).join('');
// Four columns, one per kind of body, so the kinds are compared side by side.
const cell = c => c ? `<td>${esc(c[0])}${c[1] ? ' <span class="badge badge-sm badge-outline text-violet-700 ml-1">parts</span>' : ''}`
  + `${c[2] ? ` <code class="font-mono text-sm text-base-content/60 ml-1">${esc(c[2])}</code>` : ''}</td>` : '<td></td>';
document.getElementById('codes-head').innerHTML = CODES.map(([g, codes]) => `<th>${esc(g)} <span class="font-normal tabular-nums">${codes.length}</span></th>`).join('');
document.getElementById('codes').innerHTML = Array.from({ length: Math.max(...CODES.map(g => g[1].length)) }, (_, i) =>
  `<tr>${CODES.map(g => cell(g[1][i])).join('')}</tr>`).join('');

// A region and its row mark each other: the rest steps back.
const marks = [...document.querySelectorAll('[data-k]')];
const light = key => marks.forEach(el => el.classList.toggle('opacity-30', !!key && el.dataset.k !== key));
document.addEventListener('pointerover', e => light(e.target.closest?.('[data-k]')?.dataset.k || ''));
document.addEventListener('pointerleave', () => light(''));
</script>
</body>
</html>
