<!-- Every idea drawn or gathered for the programs' marks, the ideas of the
     program chosen in the lineup: one card per idea, under a strip of the picked idea's
     variations that stays at the top of the column, and a lineup that sets the estate's repository
     marks beside the pick from each of the five programs. Sessions' pile opens on
     ideas drawn and gathered for Sessions (2026-11-07), led by its current
     mark, two speech bubbles (programs/sessions/icon.svg), then Surfacing's
     cube studies, drawn on 2026-11-02, when the cube with its top face in
     outline and Testing's shield with a check were chosen; the shield is
     programs/testing/icon.svg. Organization,
     Content and Discovery (2026-11-07) each open on their drawn marks, led by
     the current marks (apps cells, a bold leaf and mountains, each its
     program's icon.svg), then blends of the owner's favorites, then references gathered by idea from open icon sets through
     Iconify: an item with an `icon` is an Iconify id, fetched from
     api.iconify.design when the page opens, and `sources` names each set and
     its licence. An item's `added` marks the round it came
     in, and the latest round's are badged New. A star on a mark makes it a
     favorite: each program's favorites sit numbered above its strip, in an
     order set by dragging them (a tapped one shows its name and Remove), and
     the first leads in the lineup; a program with none sends the mark its
     lineup shows, when that is not the mark the page opens on. They stay in this browser until sent:
     opened on a pick call (#user-call=owner/repo[@ref]:path), Send records
     them as the call's answer beside it and comments them on its pull
     request; without one, Copy puts them on the clipboard. #program=<name>
     opens the page on that program. The Program as control redraws every mark as a program icon
     (bare, on a tinted tile, knocked out of a solid tile, or under a gauge
     arc); the wrap scales the mark, so a mark picked this way is redrawn at
     tile size before it ships. Testing's pile includes the test-concept
     library of PR #1196 by its themes. The data is the JSON below. -->

: tools), split down the middle to pop the &lt; &gt;.<\/desc>\n  <mask id=\"slot\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"32\" height=\"32\">\n    <rect width=\"32\" height=\"32\" fill=\"#fff\"/>\n    <rect x=\"14.6\" y=\"4\" width=\"2.8\" height=\"24\" fill=\"#000\"/>\n    <circle cx=\"16\" cy=\"16\" r=\"4.5\" fill=\"#000\"/>\n  <\/mask>\n  <path fill=\"#2563eb\" mask=\"url(#slot)\" d=\"M10.5 6.474 L21.5 6.474 L27 16 L21.5 25.526 L10.5 25.526 L5 16 Z\"/>\n<\/svg>"}, {"name": "web-tools-private", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"web-tools-private\">\n  <title>web-tools-private<\/title>\n  <desc>The hub's hexagon with a keyhole for its bore: the private sister that holds what the public page must not. Drawn on the budget-drs app icon's box and rules in one colour, indigo-600 (#4f46e5): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <g fill=\"#4f46e5\">\n    <path fill-rule=\"evenodd\" d=\"M9 4.12 L23 4.12 L30 16.25 L23 28.37 L9 28.37 L2 16.25 Z M14.6 16.92 A3.6 3.6 0 1 1 17.4 16.92 L18.6 23 L13.4 23 Z\"/>\n  <\/g>\n<\/svg>"}, {"name": "home", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"home\">\n  <title>home<\/title>\n  <desc>A house whose roof stands clear of its walls, a door cut out of them: the private base and slow-memory layer. Drawn on the budget-drs app icon's box and rules in one colour, slate-600 (#475569): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <g fill=\"#475569\">\n    <path d=\"M16 2.5 L30.25 14 L28.25 16.5 L16 6.6 L3.75 16.5 L1.75 14 Z\"/>\n    <path d=\"M16 10.9 L25.5 18.6 V29 H18.5 V22 H13.5 V29 H6.5 V18.6 Z\"/>\n  <\/g>\n<\/svg>"}, {"name": "fun", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"fun\">\n  <title>fun<\/title>\n  <desc>A sprout, two leaves on a stem: personal projects and experiments. Drawn on the budget-drs app icon's box and rules in one colour, lime-600 (#65a30d): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <g fill=\"#65a30d\">\n    <rect x=\"14.5\" y=\"12.5\" width=\"3\" height=\"16.5\" rx=\"1\"/>\n    <path d=\"M14.5 18.5 A10 10 0 0 1 2.5 8.5 A10 10 0 0 1 14.5 18.5 Z\"/>\n    <path d=\"M17.5 14.5 A10.5 10.5 0 0 0 29.5 3.5 A10.5 10.5 0 0 0 17.5 14.5 Z\"/>\n  <\/g>\n<\/svg>"}, {"name": "chat-histories", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"chat-histories\">\n  <title>chat-histories<\/title>\n  <desc>Two speech bubbles, the nearer one cut clear of the other: the archive of conversations. Drawn on the budget-drs app icon's box and rules in one colour, sky-600 (#0284c7): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <mask id=\"clear\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"32\" height=\"32\">\n    <rect width=\"32\" height=\"32\" fill=\"#fff\"/>\n    <rect x=\"-0.5\" y=\"8\" width=\"24\" height=\"18.5\" rx=\"6\" fill=\"#000\"/>\n  <\/mask>\n  <g fill=\"#0284c7\">\n    <path mask=\"url(#clear)\" d=\"M14.5 3 H26.5 A3.5 3.5 0 0 1 30 6.5 V13 A3.5 3.5 0 0 1 26.5 16.5 H26 V20 L22.5 16.5 H14.5 A3.5 3.5 0 0 1 11 13 V6.5 A3.5 3.5 0 0 1 14.5 3 Z\"/>\n    <path d=\"M5.5 10.5 H17.5 A3.5 3.5 0 0 1 21 14 V20.5 A3.5 3.5 0 0 1 17.5 24 H10.5 L5.5 29 V24 A3.5 3.5 0 0 1 2 20.5 V14 A3.5 3.5 0 0 1 5.5 10.5 Z\"/>\n  <\/g>\n<\/svg>"}, {"name": "shortcut-tools", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"shortcut-tools\">\n  <title>shortcut-tools<\/title>\n  <desc>Two wide rounded diamonds, the upper one cut clear of the lower, in the Shortcuts icon's colours as iOS draws it, pink over violet: the app's own stacked layers. Drawn on the budget-drs app icon's box and <script>
  const INK = { sessions: '#0891b2', testing: '#d97706', organization: '#2563eb', content: '#9333ea', discovery: '#16a34a' };
  const TINT = { sessions: '#cffafe', testing: '#fef3c7', organization: '#dbeafe', content: '#f3e8ff', discovery: '#dcfce7' };
  // Recolour a mark's fills, leaving any mask it carries alone.
  const recolour = (body, ink) => body.split(/(<mask[\s\S]*?<\/mask>)/).map(part =>
    part.startsWith('<mask') ? part : part.replace(/fill="(?!none)[^"]*"/g, `fill="${ink}"`).replace(/stroke="(?!none)[^"]*"/g, `stroke="${ink}"`).replace(/currentColor/g, ink)).join('');
  function asProgram(svg, prog, cue) {
    if (cue === 'mark') return svg;
    const vb = (svg.match(/viewBox="([^"]+)"/) || [, '0 0 32 32'])[1];
    const inner = svg.replace(/^[\s\S]*?<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '').replace(/<title>[\s\S]*?<\/title>|<desc>[\s\S]*?<\/desc>/g, '');
    const nest = (body, at, size) => `<svg x="${at}" y="${at + 0.25}" width="${size}" height="${size}" viewBox="${vb}">${body}</svg>`;
    const tile = '<rect x="2" y="2.25" width="28" height="28" rx="7"/>';
    let body;
    if (cue === 'tint') body = `<g fill="${TINT[prog]}">${tile}</g>` + nest(inner, 6.5, 19);
    else if (cue === 'solid') body = `<g fill="${INK[prog]}">${tile}</g>` + nest(recolour(inner, '#fff'), 6.5, 19);
    else body = `<path fill="${INK[prog]}" d="M5.82 26.43A14.4 14.4 0 1 1 26.18 26.43L24.48 24.73A12 12 0 1 0 7.52 24.73Z"/>` + nest(inner, 7.4, 17.2);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.75 29 29">${body}</svg>`;
  }
  const BLANK = (prog) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.75 29 29"><rect x="2" y="2.25" width="28" height="28" rx="7" fill="${TINT[prog]}"/></svg>`;
  // Fill each Iconify item's svg from api.iconify.design, a set at a time, in
  // the program's ink.
  async function fetchIcons(data) {
    const want = {};
    for (const [prog, groups] of Object.entries(data)) if (Array.isArray(groups) && prog !== 'repos')
      for (const g of groups) for (const it of g.items) if (it.icon && !it.svg) (want[it.icon.split(':')[0]] ??= []).push([prog, it]);
    await Promise.all(Object.entries(want).map(async ([set, list]) => {
      const names = [...new Set(list.map(([, it]) => it.icon.split(':')[1]))];
      for (let i = 0; i < names.length; i += 60) {
        try {
          const r = await fetch(`https://api.iconify.design/${set}.json?icons=${names.slice(i, i + 60).join(',')}`);
          const j = await r.json();
          for (const [prog, it] of list) {
            const v = j.icons?.[it.icon.split(':')[1]];
            if (v) it.svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${v.width || j.width || 16} ${v.height || j.height || 16}"><title>${it.icon}</title><g color="${INK[prog]}">${v.body}</g></svg>`;
          }
        } catch (e) { /* the item keeps its blank tile */ }
      }
    }));
  }

  // Favorites go back as a pick call's answer, the line user-call-form.js's
  // postAnswer appends beside the call, and its comment on the call's PR.
  // Inlined here because the page runs on CDN Alpine without the web-tools
  // bundle, which starts an Alpine of its own. The token is the one the app
  // stores in this browser.
  const GH = {
    token() { try { const t = localStorage.getItem('ghToken'); return t && !t.includes('🎟') ? t.trim() : ''; } catch { return ''; } },
    async req(url, opt = {}) {
      const h = { Accept: 'application/vnd.github+json', ...(opt.headers || {}) }; const t = GH.token(); if (t) h.Authorization = 'Bearer ' + t;
      const r = await fetch('https://api.github.com/' + url, { ...opt, headers: h });
      if (!r.ok) { const e = new Error(r.status + ' ' + (await r.text()).slice(0, 160)); e.status = r.status; throw e; }
      const body = await r.text(); try { return body ? JSON.parse(body) : null } catch { throw new Error('GitHub sent an unreadable answer') }
    },
    async file(at, path) {
      const d = await GH.req(`repos/${at.repo}/contents/${path}` + (at.ref ? '?ref=' + encodeURIComponent(at.ref) : ''));
      if (!d || !d.content && d.content !== '') { const e = new Error('no file at ' + path); e.status = 404; throw e; }
      return { sha: d.sha, text: new TextDecoder().decode(Uint8Array.from(atob(d.content.replace(/\s/g, '')), c => c.charCodeAt(0))) };
    },
    async append(at, path, entry) {
      let cur = { text: '', sha: null };
      try { cur = await GH.file(at, path); } catch (e) { if (e.status !== 404) throw e; }
      const text = (cur.text && !cur.text.endsWith('\n') ? cur.text + '\n' : cur.text) + JSON.stringify(entry) + '\n';
      const bytes = new TextEncoder().encode(text); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
      const put = { message: 'answer: ' + path.split('/').pop() + ' = ' + entry.answer, content: btoa(bin), ...(at.ref ? { branch: at.ref } : {}), ...(cur.sha ? { sha: cur.sha } : {}) };
      await GH.req(`repos/${at.repo}/contents/${path}`, { method: 'PUT', body: JSON.stringify(put) });
    },
  };
</script>

      this.at = hash.get('user-call') ? window.RepoAddress.parse(hash.get('user-call')) : null;
      if (this.data[hash.get('program')] && this.progs.some(([q]) => q === hash.get('program'))) this.cur = hash.get('program');
      try { Object.assign(this.favs, JSON.parse(localStorage.getItem(this.store) || '{}')) } catch {}
      try { this.reps = JSON.parse(localStorage.getItem('program-mark-ideas:reps') || '{}') } catch {}
      try { for (const [p, n] of Object.entries(JSON.parse(localStorage.getItem('program-mark-ideas:ideas') || '{}'))) { const gi = (this.data[p] || []).findIndex(g => g.name === n); if (gi >= 0) this.sel[p] = [gi, this.rep(p, gi)] } } catch {}
      fetchIcons(this.data);
      if (!this.at) return;
      try {
        this.call = JSON.parse((await GH.file(this.at, this.at.path)).text);
        try {
          const lines = (await GH.file(this.at, this.at.path.replace(/\.json$/, '.answers.jsonl'))).text.split('\n').filter(l => l.trim());
          const last = lines.length ? JSON.parse(lines[lines.length - 1]) : null;
          if (last) { this.sent = last; this.note = last.note || ''; if (!localStorage.getItem(this.store)) this.favs = this.fromPicks(last.picks || []) }
        } catch (e) { if (e.status !== 404) this.err = 'Could not read the answers: ' + e.message }
      } catch (e) { this.err = 'Could not read the call: ' + e.message + (GH.token() ? '' : '. It needs your GitHub token, set in the app.') }
    },
    // One program at a time, chosen from the lineup.
    get shown() { return this.progs.filter(([p]) => p === this.cur) },
    open(p) { this.cur = p; try { localStorage.setItem('program-mark-ideas:program', p) } catch {} },
    uri(s) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s) },
    show(p, it) { return this.uri(it && it.svg ? asProgram(it.svg, p, this.cue) : BLANK(p)) },
    // Each idea keeps the mark chosen in it, and its card shows that mark.
    // Kept by the mark's name, since each round adds marks at a group's head;
    // an index, kept before, is ignored.
    rep(p, g) { const n = this.reps[p + ':' + this.data[p][g].name]; return typeof n === 'string' ? Math.max(0, this.data[p][g].items.findIndex(it => it.name === n)) : 0 },
    choose(p, ii) { const g = this.sel[p][0]; this.reps = { ...this.reps, [p + ':' + this.data[p][g].name]: this.data[p][g].items[ii].name }; this.sel[p] = [g, ii]; try { localStorage.setItem('program-mark-ideas:reps', JSON.stringify(this.reps)) } catch {} },
    // The idea in view per program, kept by name: the lineup and Send read it.
    keep() { try { localStorage.setItem('program-mark-ideas:ideas', JSON.stringify(Object.fromEntries(this.progs.map(([p]) => [p, this.data[p][this.sel[p][0]].name])))) } catch {} },
    pick(p) { const g = this.sel[p][0]; return this.data[p][g].items[this.rep(p, g)] || this.data[p][g].items[0] },
    source(it) { const s = it && it.icon && this.data.sources[it.icon.split(':')[0]]; return s ? s.name + ', ' + s.license : '' },
    card(p, gi) { if (this.sel[p][0] !== gi) { this.sel[p] = [gi, this.rep(p, gi)]; this.keep(); this.$nextTick(() => { const el = document.querySelector(`[data-strip=${p}]`), b = el && el.querySelectorAll(':scope > div')[this.rep(p, gi)]; if (el) el.scrollLeft = b ? Math.max(0, b.offsetLeft - el.offsetLeft - 8) : 0 }) } },
    // A mark's key names its source: an Iconify id, or the drawn mark's name.
    // The latest round's additions are badged New.
    get latest() { let m = ''; for (const [k, v] of Object.entries(this.data)) if (Array.isArray(v) && k !== 'repos') for (const g of v) for (const it of g.items) if (it.added && it.added > m) m = it.added; return m },
    isNew(it) { return !!(it && it.added) && it.added === this.latest },
    groupNew(g) { return g.items.some(it => this.isNew(it)) },
    progNew(p) { return this.data[p].some(g => this.groupNew(g)) },
    keyOf(p, it) { return it.icon ? 'iconify ' + it.icon : 'drawn ' + p + ':' + it.name },
    itemOf(p, k) { for (const g of this.data[p]) for (const it of g.items) if (this.keyOf(p, it) === k) return it; return null },
    label(p, k) { const it = this.itemOf(p, k); return it ? it.name : k },
    isFav(p, it) { return this.favs[p].includes(this.keyOf(p, it)) },
    star(p, it) { const k = this.keyOf(p, it); this.favs[p] = this.isFav(p, it) ? this.favs[p].filter(x => x !== k) : [...this.favs[p], k]; this.moving = { p: '', i: -1 }; this.save() },
    save() { this.copied = false; try { localStorage.setItem(this.store, JSON.stringify(this.favs)) } catch {} },
    unstar(p, i) { this.favs[p] = this.favs[p].filter((_, x) => x !== i); this.moving = { p: '', i: -1 }; this.save() },
    // Drag a favorite by pointer, mouse or finger; a press that does not move
    // selects it for the arrow buttons instead.
    // On an iPhone sheet, touch-action alone loses the drag to the sheet; the
    // favorites also cancel their touch events (docs/ios-sheet-drags.md).
    // A drag lifts a copy of the favorite that follows the pointer, and leaves
    // a faint placeholder where the favorite will land.
    grab(e, p, i) { const r = e.currentTarget.getBoundingClientRect(); this.drag = { p, i, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, moved: false }; try { e.target.setPointerCapture(e.pointerId) } catch {} },
    over(e) {
      const d = this.drag; if (!d) return;
      if (!d.moved && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return; d.moved = true; d.x = e.clientX; d.y = e.clientY;
      const el = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.dataset && n.dataset.fav && n.dataset.fav.startsWith(d.p + ':'));
      const j = el ? +el.dataset.fav.split(':')[1] : -1;
      if (j >= 0 && j !== d.i) { const f = [...this.favs[d.p]]; f.splice(j, 0, f.splice(d.i, 1)[0]); this.favs[d.p] = f; d.i = j }
    },
    drop() { const d = this.drag; if (!d) return; this.drag = null; if (d.moved) { this.moving = { p: '', i: -1 }; this.save() } else this.moving = this.moving.p === d.p && this.moving.i === d.i ? { p: '', i: -1 } : { p: d.p, i: d.i } },
    // The lineup shows each program's first favorite, or the mark in view.
    lead(p) { return this.favs[p].length ? this.itemOf(p, this.favs[p][0]) : this.pick(p) },
    total() { return this.progs.reduce((n, [p]) => n + this.favs[p].length, 0) },
    href(k) { const m = k.match(/^iconify ([^:]+):(.+)$/); return m ? `https://api.iconify.design/${m[1]}/${m[2]}.svg` : '' },
    // A program with no favorites sends the mark its lineup entry shows, when
    // that is not the mark the page opens on: a choice made by tapping.
    home: { sessions: [0, 0], testing: [5, 0], organization: [0, 0], content: [0, 0], discovery: [0, 0] },
    picks() { return this.progs.flatMap(([p, n]) => {
      if (this.favs[p].length) return this.favs[p].map((k, i) => ({ id: `${n} ${i + 1}: ${k}`, href: this.href(k), program: p, rank: i + 1 }));
      const it = this.pick(p), [g, i] = this.home[p];
      if (!it || it === this.data[p][g].items[i]) return [];
      const k = this.keyOf(p, it); return [{ id: `${n} lineup: ${k}`, href: this.href(k), program: p, rank: 0, lineup: true }];
    }) },
    fromPicks(list) { const f = { sessions: [], testing: [], organization: [], content: [], discovery: [] }; for (const x of [...list].filter(x => !x.lineup).sort((a, b) => (a.rank || 0) - (b.rank || 0))) if (f[x.program]) f[x.program].push(String(x.id).replace(/^[^:]+: /, '')); return f },
    text() { return this.picks().map(x => x.id + (x.href ? '  ' + x.href : '')).join('\n') + (this.note.trim() ? '\n\n' + this.note.trim() : '') },
    sentNow() { return this.sent && JSON.stringify((this.sent.picks || []).map(x => x.id)) === JSON.stringify(this.picks().map(x => x.id)) && (this.sent.note || '') === this.note.trim() },
    closed() { return !!this.call && (this.call.status === 'closed' || !!this.call.closed) },
    canSend() { return this.call && this.picks().length && !this.sending && !this.sentNow() && !this.closed() },
    sendLabel() { return this.sending ? 'Sending' : this.sentNow() ? 'Sent' : this.sent ? 'Send again' : 'Send' },
    ago(iso) { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago' },
    async send() {
      this.sending = true; this.err = '';
      try {
        const entry = { answer: 'Picked', picks: this.picks(), note: this.note.trim(), at: new Date().toISOString() };
        try { entry.by = (await GH.req('user')).login } catch {}
        const m = String(this.call.pr || '').match(/^([^/]+\/[^#]+)#(\d+)$/);
        if (m) {
          const id = this.call.id || this.at.path.split('/').pop().replace(/\.json$/, '');
          const body = `**User call: ${this.call.question}**\n\nAnswer: **Picked**, ${entry.picks.length}\n\n`
            + entry.picks.map(x => '- ' + (x.href ? `[${x.id}](${x.href})` : x.id)).join('\n')
            + (entry.note ? '\n\n> ' + entry.note : '') + `\n\n_${id}, sent from the program mark ideas page._`;
          entry.comment = (await GH.req(`repos/${m[1]}/issues/${m[2]}/comments`, { method: 'POST', body: JSON.stringify({ body }) })).html_url;
        }
        await GH.append(this.at, this.at.path.replace(/\.json$/, '.answers.jsonl'), entry);
        this.sent = entry;
      } catch (e) { this.err = 'Not sent: ' + e.message }
      this.sending = false;
    },
    async copy() { try { await navigator.clipboard.writeText(this.text()); this.copied = true } catch (e) { this.err = 'Not copied: ' + e.message } },
    }" @pointermove.window="over($event)" @pointerup.window="drop()" @pointercancel.window="drop()">
  <header class="border-b border-[var(--color-base-300)] bg-base-200 px-4 pt-3 pb-2 mb-3">
    <h1 class="text-xl font-semibold">Program marks</h1>
    <div class="mt-2 flex items-center gap-1 overflow-x-auto whitespace-nowrap">
      <span class="mr-1 text-xs text-base-content/60">Program as</span>
      <template x-for="[k, n] in [['mark', 'Mark'], ['tint', 'Tinted tile'], ['solid', 'Solid tile'], ['gauge', 'Gauge arc']]" :key="k">
        <button class="btn btn-xs h-7 rounded-full px-2.5 font-medium" :class="cue === k ? 'btn-neutral' : 'btn-ghost'" @click="cue = k" x-text="n"></button>
      </template>
    </div>
    <!-- The lineup: each program's lead, which opens that program's ideas
         below, then the repository marks it has to sit beside, smaller, since
         those are settled. -->
    <div class="mt-2 rounded-box bg-base-100 px-2 py-2">
      <div class="flex flex-wrap items-center gap-1" role="radiogroup" aria-label="Program">
        <template x-for="[p, n] in progs" :key="p">
          <button type="button" role="radio" :aria-checked="String(cur === p)" @click="open(p)"
            class="flex min-w-0 items-center gap-1.5 rounded-box px-1.5 py-1 text-left" :class="cur === p ? 'bg-base-200 ring-2 ring-[var(--color-primary)]' : 'hover:bg-base-200'">
            <img :src="show(p, lead(p))" :alt="n" class="block size-8 shrink-0">
            <div class="min-w-0 leading-tight"><div class="flex items-center gap-1 text-xs font-medium"><span x-text="n"></span><span x-show="progNew(p)" class="size-1.5 rounded-full bg-primary" title="New marks"></span></div>
              <div class="max-w-[9rem] truncate text-xs text-base-content/60" x-text="(favs[p].length ? '1. ' : '') + (lead(p) ? lead(p).name : '')"></div></div></button>
        </template>
      </div>
      <div class="mx-1.5 mt-2 flex items-center gap-2 overflow-x-auto border-t border-[var(--color-base-200)] pt-2">
        <template x-for="r in data.repos" :key="r.name"><img :src="uri(r.svg)" :alt="r.name" class="block size-5 shrink-0"></template>
      </div>
    </div>
  </header>
  <main class="px-3 pb-3 lg:px-4 lg:pb-4">
    <template x-for="[p, n] in shown" :key="p">
      <section class="min-w-0">
        <!-- The program's favorites and the strip of the picked idea ride at
             the top of its column while the column's ideas scroll under them. -->
        <div class="sticky top-0 z-10 bg-base-200 pb-2">
          <div class="rounded-box bg-base-100 px-2 pt-1.5 pb-1 shadow-sm">
            <div class="flex items-baseline gap-2 px-1 text-xs text-base-content/60"><span class="font-semibold text-base-content" x-text="n"></span><span x-text="favs[p].length ? 'Favorites' : 'No favorites yet'"></span></div>
            <div x-show="favs[p].length" class="flex flex-wrap gap-1.5 px-1 pt-1.5">
              <template x-for="(k, i) in favs[p]" :key="p + '-' + k">
                <button type="button" :data-fav="p + ':' + i" @pointerdown.prevent="grab($event, p, i)" @touchstart.prevent @touchmove.prevent :aria-label="(i + 1) + '. ' + label(p, k)"
                  class="relative cursor-grab touch-none select-none rounded-lg p-0.5 [-webkit-touch-callout:none]" :class="[moving.p === p && moving.i === i ? 'ring-2 ring-[var(--color-primary)]' : '', drag && drag.p === p && drag.i === i && drag.moved ? 'opacity-25 outline-2 outline-dashed outline-[var(--color-base-300)]' : '']">
                  <img :src="show(p, itemOf(p, k))" alt="" draggable="false" class="pointer-events-none block size-10">
                  <span class="pointer-events-none absolute -top-1 -left-1 flex size-4 items-center justify-center rounded-full bg-neutral text-[0.625rem] font-semibold text-neutral-content" x-text="i + 1"></span>
                </button>
              </template>
            </div>
            <div x-show="moving.p === p && favs[p][moving.i]" class="flex items-center gap-1 px-1 pt-1">
              <span class="min-w-0 flex-1 truncate text-xs text-base-content/70" x-text="favs[p][moving.i] ? (moving.i + 1) + '. ' + label(p, favs[p][moving.i]) : ''"></span>
              <button type="button" class="btn btn-xs btn-ghost" @click="unstar(p, moving.i)">Remove</button>
            </div>
            <div class="mt-1.5 truncate border-t border-[var(--color-base-200)] px-1 pt-1.5 text-xs text-base-content/60" x-text="data[p][sel[p][0]].name + ' · ' + data[p][sel[p][0]].items.length + (source(pick(p)) ? ' · ' + source(pick(p)) : '')"></div>
            <div class="flex gap-1 overflow-x-auto pt-1" :data-strip="p">
              <template x-for="(it, ii) in data[p][sel[p][0]].items" :key="p + sel[p][0] + '-' + ii">
                <div class="relative w-[4.25rem] shrink-0">
                  <button type="button" class="flex w-full flex-col items-center gap-1 rounded-box p-1"
                    :class="rep(p, sel[p][0]) === ii ? 'bg-[var(--color-base-200)]' : ''" @click="choose(p, ii)">
                    <img :src="show(p, it)" alt="" class="block size-9">
                    <span class="w-full truncate text-center text-xs text-base-content/70" x-text="it.name"></span>
                  </button>
                  <span x-show="isNew(it)" class="pointer-events-none absolute top-0 left-0 rounded-full bg-primary px-1 text-[0.625rem] font-semibold leading-4 text-primary-content">New</span>
                  <button type="button" class="absolute -top-0.5 right-0 flex size-6 items-center justify-center text-base leading-none"
                    :class="isFav(p, it) ? 'text-amber-500' : 'text-base-content/30'" @click="star(p, it)" :aria-pressed="isFav(p, it)" :aria-label="(isFav(p, it) ? 'Unstar ' : 'Star ') + it.name" x-text="isFav(p, it) ? '★' : '☆'"></button>
                </div>
              </template>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-[repeat(auto-fill,minmax(4.25rem,1fr))] gap-2 lg:grid-cols-[repeat(auto-fill,minmax(5.5rem,1fr))]">
          <template x-for="(g, gi) in data[p]" :key="p + gi">
            <button class="relative flex flex-col items-center gap-1 rounded-box border bg-base-100 p-1.5 text-center lg:gap-1.5 lg:p-2"
              :class="sel[p][0] === gi ? 'border-[var(--color-primary)]' : 'border-[var(--color-base-300)]'" @click="card(p, gi)">
              <img :src="show(p, g.items[rep(p, gi)] || g.items[0])" alt="" class="block size-10 lg:size-11">
              <span class="text-xs font-medium leading-tight text-balance" x-text="g.name"></span>
              <span class="font-mono text-xs text-base-content/50" x-text="g.items.length"></span>
              <span x-show="groupNew(g)" class="absolute top-1 left-1.5 rounded-full bg-primary px-1 text-[0.625rem] font-semibold leading-4 text-primary-content">New</span>
              <span x-show="g.items.some(it => isFav(p, it))" class="absolute top-1 right-1.5 text-xs text-amber-500" x-text="'★' + g.items.filter(it => isFav(p, it)).length"></span>
            </button>
          </template>
        </div>
      </section>
    </template>
  </main>
  <!-- The lifted copy of a favorite being dragged. -->
  <template x-if="drag && drag.moved">
    <div class="pointer-events-none fixed z-50 rotate-3 scale-110 rounded-lg bg-base-100 p-0.5 shadow-xl ring-2 ring-[var(--color-primary)]"
      :style="`left:${drag.x - drag.ox}px;top:${drag.y - drag.oy}px`">
      <div class="relative"><img :src="show(drag.p, itemOf(drag.p, favs[drag.p][drag.i]))" alt="" class="block size-10">
        <span class="absolute -top-1 -left-1 flex size-4 items-center justify-center rounded-full bg-neutral text-[0.625rem] font-semibold text-neutral-content" x-text="drag.i + 1"></span></div>
    </div>
  </template>
  <!-- The answer: each program's favorites in order, sent to the pick call the
       page was opened on (#user-call=owner/repo[@ref]:path), or copied as text. -->
  <footer x-show="picks().length || call || err" class="sticky bottom-0 z-20 border-t border-[var(--color-base-300)] bg-base-100 py-2 pl-4 pr-20">
    <div class="flex items-center gap-3">
      <div class="flex min-w-0 flex-1 items-center gap-3 overflow-x-auto whitespace-nowrap">
        <template x-for="[p, n] in progs" :key="'foot-' + p">
          <span x-show="picks().some(x => x.program === p)" class="flex shrink-0 items-center gap-1.5 text-sm"><img :src="show(p, lead(p))" :alt="n" class="block size-5"><span class="hidden sm:inline" x-text="n"></span><span class="font-mono text-xs opacity-60" x-text="favs[p].length || ''"></span></span>
        </template>
      </div>
      <span class="shrink-0 text-xs text-base-content/60" x-show="call" x-text="closed() ? 'Closed' : sent ? 'Sent ' + (sent.picks || []).length + ' · ' + ago(sent.at) : 'Not sent'"></span>
      <button x-show="call" type="button" class="btn btn-sm shrink-0 border-[color-mix(in_srgb,var(--color-primary)_45%,var(--color-base-100))] bg-primary/10 text-primary hover:bg-primary/15" :disabled="!canSend()" @click="send()" x-text="sendLabel()"></button>
      <button x-show="!call" type="button" class="btn btn-sm shrink-0" :disabled="!picks().length" @click="copy()" x-text="copied ? 'Copied' : 'Copy'"></button>
    </div>
    <input x-show="call && picks().length" x-model="note" type="text" placeholder="Note" class="input input-sm mt-2 w-full">
    <p x-show="err" class="mt-1 text-sm text-error" x-text="err"></p>
  </footer>
</body>
</html>
