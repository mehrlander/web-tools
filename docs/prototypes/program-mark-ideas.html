g\" aria-label=\"web-tools\">\n  <title>web-tools<\/title>\n  <desc>Slot-split hex nut: a hexagon (modular; its left/right points read as angle brackets) with a round bore (a nut: tools), split down the middle to pop the &lt; &gt;.<\/desc>\n  <mask id=\"slot\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"32\" height=\"32\">\n    <rect width=\"32\" height=\"32\" fill=\"#fff\"/>\n    <rect x=\"14.6\" y=\"4\" width=\"2.8\" height=\"24\" fill=\"#000\"/>\n    <circle cx=\"16\" cy=\"16\" r=\"4.5\" fill=\"#000\"/>\n  <\/mask>\n  <path fill=\"#2563eb\" mask=\"url(#slot)\" d=\"M10.5 6.474 L21.5 6.474 L27 16 L21.5 25.526 L10.5 25.526 L5 16 Z\"/>\n<\/svg>"}, {"name": "web-tools-private", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"web-tools-private\">\n  <title>web-tools-private<\/title>\n  <desc>The hub's hexagon with a keyhole for its bore: the private sister that holds what the public page must not. Drawn on the budget-drs app icon's box and rules in one colour, indigo-600 (#4f46e5): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <g fill=\"#4f46e5\">\n    <path fill-rule=\"evenodd\" d=\"M9 4.12 L23 4.12 L30 16.25 L23 28.37 L9 28.37 L2 16.25 Z M14.6 16.92 A3.6 3.6 0 1 1 17.4 16.92 L18.6 23 L13.4 23 Z\"/>\n  <\/g>\n<\/svg>"}, {"name": "home", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"home\">\n  <title>home<\/title>\n  <desc>A house whose roof stands clear of its walls, a door cut out of them: the private base and slow-memory layer. Drawn on the budget-drs app icon's box and rules in one colour, slate-600 (#475569): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <g fill=\"#475569\">\n    <path d=\"M16 2.5 L30.25 14 L28.25 16.5 L16 6.6 L3.75 16.5 L1.75 14 Z\"/>\n    <path d=\"M16 10.9 L25.5 18.6 V29 H18.5 V22 H13.5 V29 H6.5 V18.6 Z\"/>\n  <\/g>\n<\/svg>"}, {"name": "fun", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"fun\">\n  <title>fun<\/title>\n  <desc>A sprout, two leaves on a stem: personal projects and experiments. Drawn on the budget-drs app icon's box and rules in one colour, lime-600 (#65a30d): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <g fill=\"#65a30d\">\n    <rect x=\"14.5\" y=\"12.5\" width=\"3\" height=\"16.5\" rx=\"1\"/>\n    <path d=\"M14.5 18.5 A10 10 0 0 1 2.5 8.5 A10 10 0 0 1 14.5 18.5 Z\"/>\n    <path d=\"M17.5 14.5 A10.5 10.5 0 0 0 29.5 3.5 A10.5 10.5 0 0 0 17.5 14.5 Z\"/>\n  <\/g>\n<\/svg>"}, {"name": "chat-histories", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"chat-histories\">\n  <title>chat-histories<\/title>\n  <desc>Two speech bubbles, the nearer one cut clear of the other: the archive of conversations. Drawn on the budget-drs app icon's box and rules in one colour, sky-600 (#0284c7): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <mask id=\"clear\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"32\" height=\"32\">\n    <rect width=\"32\" height=\"32\" fill=\"#fff\"/>\n    <rect x=\"-0.5\" y=\"8\" width=\"24\" height=\"18.5\" rx=\"6\" fill=\"#000\"/>\n  <\/mask>\n  <g fill=\"#0284c7\">\n    <path mask=\"url(#clear)\" d=\"M14.5 3 H26.5 A3.5 3.5 0 0 1 30 6.5 V13 A3.5 3.5 0 0 1 26.5 16.5 H26 V20 L22.5 16.5 H14.5 A3.5 3.5 0 0 1 11 13 V6.5 A3.5 3.5 0 0 1 14.5 3 Z\"/>\n    <path d=\"M5.5 10.5 H17.5 A3.5 3.5 0 0 1 21 14 V20.5 A3.5 3.5 0 0 1 17.5 24 H10.5 L5.5 29 V24 A3.5 3.5 0 0 1 2 20.5 V14 A3.5 3.5 0 0 1 5.5 10.5 Z\"/>\n  <\/g>\n<\/svg>"}, {"name": "shortcut-tools", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"shortcut-tools\">\n  <title>shortcut-tools<\/title>\n  <desc>Two wide rounded diamonds, the upper one cut clear of the lower, in the Shortcuts icon's colours as iOS draws it, pink over violet: the app's own stacked layers. Drawn on the budget-drs app icon's box and rules, each layer a gradient of its own: solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16. It keeps its colours, so a tone does not apply.<\/desc>\n  <linearGradient id=\"top\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n    <stop offset=\"0\" stop-color=\"#f472b6\"/><stop offset=\"1\" stop-color=\"#d946ef\"/>\n  <\/linearGradient>\n  <linearGradient id=\"bottom\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n    <stop offset=\"0\" stop-color=\"#a78bfa\"/><stop offset=\"1\" stop-color=\"#7c3aed\"/>\n  <\/linearGradient>\n  <mask id=\"clear\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"32\" height=\"32\">\n    <rect width=\"32\" height=\"32\" fill=\"#fff\"/>\n    <rect x=\"6.78\" y=\"2.28\" width=\"18.43\" height=\"18.43\" rx=\"5\" transform=\"rotate(45 16 11.5)\" fill=\"#000\"/>\n  <\/mask>\n  <g transform=\"translate(16 0) scale(1.55 1) translate(-16 0)\">\n    <rect fill=\"url(#top)\" x=\"9.28\" y=\"4.78\" width=\"13.43\" height=\"13.43\" rx=\"2.5\" transform=\"rotate(45 16 11.5)\"/>\n    <g mask=\"url(#clear)\"><rect fill=\"url(#bottom)\" x=\"9.28\" y=\"14.03\" width=\"13.43\" height=\"13.43\" rx=\"2.5\" transform=\"rotate(45 16 20.75)\"/><\/g>\n  <\/g>\n<\/svg>"}, {"name": "budget-wa", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"budget-wa\">\n  <title>budget-wa<\/title>\n  <desc>An open ledger: the Washington budget record, kept by the source that published each part. It stands on the detached base bar that marks the public-record stores. Drawn on the budget-drs app icon's box and rules in one colour, emerald-600 (#059669): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <g fill=\"#059669\">\n    <path d=\"M2.5 5.5 L14.75 7.5 L14.75 21.9 L2.5 19.9 Z\"/>\n    <path d=\"M17.25 7.5 L29.5 5.5 L29.5 19.9 L17.25 21.9 Z\"/>\n    <rect x=\"2\" y=\"24.4\" width=\"28\" height=\"4.6\"/>\n  <\/g>\n<\/svg>"}, {"name": "spend-wa", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"spend-wa\">\n  <title>spend-wa<\/title>\n  <desc>A banknote, its portrait and corner marks cut out: what Washington spends and whom it pays. It stands on the detached base bar that marks the public-record stores. Drawn on the budget-drs app icon's box and rules in one colour, yellow-600 (#ca8a04): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <g fill=\"#ca8a04\">\n    <path fill-rule=\"evenodd\" d=\"M2 7.5 H30 V21.9 H2 Z M16 10.2 A4.5 4.5 0 1 0 16 19.2 A4.5 4.5 0 1 0 16 10.2 Z M6.25 13.45 A1.25 1.25 0 1 0 6.25 15.95 A1.25 1.25 0 1 0 6.25 13.45 Z M25.75 13.45 A1.25 1.25 0 1 0 25.75 15.95 A1.25 1.25 0 1 0 25.75 13.45 Z\"/>\n    <rect x=\"2\" y=\"24.4\" width=\"28\" height=\"4.6\"/>\n  <\/g>\n<\/svg>"}, {"name": "fn-data", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"fn-data\">\n  <title>fn-data<\/title>\n  <desc>A rising line with an arrowhead: fiscal notes, what a bill would cost. It stands on the detached base bar that marks the public-record stores. Drawn on the budget-drs app icon's box and rules in one colour, violet-600 (#7c3aed): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <g fill=\"#7c3aed\">\n    <path d=\"M4.13 21.13 L11.63 13.63 L9.37 11.37 L1.87 18.87 Z\"/>\n    <path d=\"M9.49 13.74 L14.99 18.24 L17.01 15.76 L11.51 11.26 Z\"/>\n    <path d=\"M17.13 18.13 L25.13 10.13 L22.87 7.87 L14.87 15.87 Z\"/>\n    <circle cx=\"3\" cy=\"20\" r=\"1.6\"/>\n    <circle cx=\"10.5\" cy=\"12.5\" r=\"1.6\"/>\n    <circle cx=\"16\" cy=\"17\" r=\"1.6\"/>\n    <path d=\"M27.89 5.11 L26.19 13.31 L19.69 6.81 Z\"/>\n    <rect x=\"2\" y=\"24.4\" width=\"28\" height=\"4.6\"/>\n  <\/g>\n<\/svg>"}, {"name": "wa-bills", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"wa-bills\">\n  <title>wa-bills<\/title>\n  <desc>Two bill texts, the nearer cut clear of the one behind it, lines of text cut out: Washington legislation as a corpus. It stands on the detached base bar that marks the public-record stores. Drawn on the budget-drs app icon's box and rules in one colour, cyan-600 (#0891b2): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <mask id=\"clear\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"32\" height=\"32\">\n    <rect width=\"32\" height=\"32\" fill=\"#fff\"/>\n    <rect x=\"2.5\" y=\"5.5\" width=\"22\" height=\"19\" fill=\"#000\"/>\n  <\/mask>\n  <g fill=\"#0891b2\">\n    <rect mask=\"url(#clear)\" x=\"11\" y=\"2.5\" width=\"18\" height=\"17\"/>\n    <path fill-rule=\"evenodd\" d=\"M5 8 H22 V21.9 H5 Z M8.5 11.5 V14 H18.5 V11.5 Z M8.5 16.5 V19 H15.5 V16.5 Z\"/>\n    <rect x=\"2\" y=\"24.4\" width=\"28\" height=\"4.6\"/>\n  <\/g>\n<\/svg>"}, {"name": "legal-data", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"1.5 1.75 29 29\" role=\"img\" aria-label=\"legal-data\">\n  <title>legal-data<\/title>\n  <desc>Scales on a post: opinions, determinations and regulations, the record a legal question is answered from. It stands on the detached base bar that marks the public-record stores. Drawn on the budget-drs app icon's box and rules in one colour, amber-700 (#b45309): solid, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16.<\/desc>\n  <g fill=\"#b45309\">\n    <circle cx=\"16\" cy=\"4.6\" r=\"2.4\"/>\n    <rect x=\"14.5\" y=\"6\" width=\"3\" height=\"15.9\"/>\n    <rect x=\"3.5\" y=\"7\" width=\"25\" height=\"2.6\"/>\n    <path d=\"M6.5 8 L2 17.5 L11 17.5 Z\"/>\n    <path d=\"M25.5 8 L21 17.5 L30 17.5 Z\"/>\n    <rect x=\"2\" y=\"24.4\" width=\"28\" height=\"4.6\"/>\n  <\/g>\n<\/svg>"}]}</script>
<script>
  const INK = { surfacing: '#0891b2', testing: '#d97706' }, TINT = { surfacing: '#cffafe', testing: '#fef3c7' };
  // Recolour a mark's fills, leaving any mask it carries alone.
  const recolour = (body, ink) => body.split(/(<mask[\s\S]*?<\/mask>)/).map(part =>
    part.startsWith('<mask') ? part : part.replace(/fill="(?!none)[^"]*"/g, `fill="${ink}"`).replace(/currentColor/g, ink)).join('');
  function asProgram(svg, prog, cue) {
    if (cue === 'mark') return svg;
    const vb = (svg.match(/viewBox="([^"]+)"/) || [, '0 0 32 32'])[1];
    const inner = svg.replace(/^[\s\S]*?<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '').replace(/<title>[\s\S]*?<\/title>|<desc>[\s\S]*?<\/desc>/g, '');
    const nest = (body, at, size) => `<svg x="${at}" y="${at + 0.25}" width="${size}" height="${size}" viewBox="${vb}">${body}</svg>`;
    const tile = '<rect x="2" y="2.25" width="28" height="28" rx="7"/>';
    let body;
    if (cue === 'tint') body = `<g fill="${TINT[prog]}">${tile}</g>` + nest(inner, 6.5, 19);
    else if (cue === 'solid') body = `<g fill="${INK[prog]}">${tile}</g>` + nest(recolour(inner, '#fff'), 6.5, 19);
    else body = `<path fill="${INK[prog]}" d="M5.82 26.43A14.4 14.4 0 1 1 26.18 26.43L24.48 24.73A12 12 0 1 0 7.52 24.73Z"/>` + nest(inner, 7.4, 17.2);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.75 29 29">${body}</svg>`;
  }
</script>
</head>
<body class="min-h-dvh bg-base-200" x-data="{
    data: JSON.parse(document.getElementById('pile').textContent),
    cue: 'solid', open: { surfacing: null, testing: null }, sel: { surfacing: [0, 0], testing: [0, 0] },
    progs: [['surfacing', 'Surfacing'], ['testing', 'Testing']],
    uri(s) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s) },
    show(p, s) { return this.uri(asProgram(s, p, this.cue)) },
    pick(p) { const [g, i] = this.sel[p]; return this.data[p][g].items[i] },
    card(p, gi) { this.open[p] = this.open[p] === gi ? null : gi; if (this.open[p] === gi && this.sel[p][0] !== gi) this.sel[p] = [gi, 0] },
    isSel(p, gi, ii) { return this.sel[p][0] === gi && this.sel[p][1] === ii } }">
  <header class="sticky top-0 z-10 border-b border-[var(--color-base-300)] bg-base-200/95 px-4 pt-3 pb-2 backdrop-blur">
    <div class="flex flex-wrap items-baseline gap-x-3">
      <h1 class="text-xl font-semibold">Program mark ideas</h1>
      <span class="font-mono text-xs text-base-content/60">Surfacing 14 ideas · 123 marks · Testing 24 ideas · 125 marks</span>
    </div>
    <div class="mt-2 flex items-center gap-2 overflow-x-auto whitespace-nowrap">
      <span class="text-xs text-base-content/60">Program as</span>
      <template x-for="[k, n] in [['mark', 'Mark'], ['tint', 'Tinted tile'], ['solid', 'Solid tile'], ['gauge', 'Gauge arc']]" :key="k">
        <button class="btn btn-sm rounded-full" :class="cue === k ? 'btn-neutral' : 'btn-ghost'" @click="cue = k" x-text="n"></button>
      </template>
    </div>
    <div class="mt-2 flex flex-wrap items-center gap-2.5 rounded-box bg-base-100 px-3 py-2">
      <template x-for="r in data.repos" :key="r.name"><img :src="uri(r.svg)" :alt="r.name" class="block size-6 shrink-0 lg:size-7"></template>
      <span class="mx-1 h-7 w-px shrink-0 bg-[var(--color-base-300)]"></span>
      <template x-for="[p, n] in progs" :key="p">
        <div class="flex items-center gap-1.5"><img :src="show(p, pick(p).svg)" :alt="n" class="block size-7 shrink-0">
          <span class="text-xs text-base-content/70" x-text="n + ': ' + pick(p).name"></span></div>
      </template>
    </div>
  </header>
  <main class="grid grid-cols-2 gap-3 p-3 lg:gap-4 lg:p-4">
    <template x-for="[p, n] in progs" :key="p">
      <section class="min-w-0">
        <h2 class="pb-2 text-xs font-semibold uppercase tracking-wide text-base-content/50" x-text="n + ' · ' + data[p].length + ' ideas'"></h2>
        <div class="grid grid-cols-[repeat(auto-fill,minmax(4.25rem,1fr))] gap-2 lg:grid-cols-[repeat(auto-fill,minmax(5.5rem,1fr))]">
          <template x-for="(g, gi) in data[p]" :key="p + gi">
            <div class="contents">
              <button class="flex flex-col items-center gap-1 rounded-box border bg-base-100 p-1.5 text-center lg:gap-1.5 lg:p-2"
                :class="open[p] === gi ? 'border-[var(--color-primary)]' : 'border-[var(--color-base-300)]'" @click="card(p, gi)">
                <img :src="show(p, (sel[p][0] === gi ? g.items[sel[p][1]] : g.items[0]).svg)" alt="" class="block size-10 lg:size-11">
                <span class="text-xs font-medium leading-tight text-balance" x-text="g.name"></span>
                <span class="font-mono text-xs text-base-content/50" x-text="g.items.length"></span>
              </button>
              <div class="col-span-full rounded-box border border-[var(--color-base-300)] bg-base-100 p-2" x-show="open[p] === gi">
                <div class="grid grid-cols-[repeat(auto-fill,minmax(4.5rem,1fr))] gap-2">
                  <template x-for="(it, ii) in g.items" :key="it.name">
                    <button class="flex flex-col items-center gap-1 rounded-box p-1.5 text-center"
                      :class="isSel(p, gi, ii) ? 'bg-[var(--color-base-200)]' : ''" @click="sel[p] = [gi, ii]">
                      <img :src="show(p, it.svg)" alt="" class="block size-10">
                      <span class="text-xs leading-tight text-base-content/70 text-balance" x-text="it.name"></span>
                    </button>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
      </section>
    </template>
  </main>
</body>
</html>
