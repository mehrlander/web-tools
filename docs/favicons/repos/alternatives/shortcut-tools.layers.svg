<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.75 29 29" role="img" aria-label="shortcut-tools: layers">
  <title>shortcut-tools: layers</title>
  <desc>The mark's stacked layers in one ink, for the page to paint in its text colour and the repository's tone.</desc>
  <mask id="clear" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"/>
    <rect x="6.78" y="2.28" width="18.43" height="18.43" rx="5" transform="rotate(45 16 11.5)" fill="#000"/>
  </mask>
  <g fill="currentColor" transform="translate(16 0) scale(1.55 1) translate(-16 0)">
    <rect x="9.28" y="4.78" width="13.43" height="13.43" rx="2.5" transform="rotate(45 16 11.5)"/>
    <g mask="url(#clear)"><rect x="9.28" y="14.03" width="13.43" height="13.43" rx="2.5" transform="rotate(45 16 20.75)"/></g>
  </g>
</svg>
