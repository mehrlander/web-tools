<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.75 29 29" role="img" aria-label="shortcut-tools: layers in colour">
  <title>shortcut-tools: layers in colour</title>
  <desc>The mark's two stacked layers in the Shortcuts icon's current colours, pink over violet, each a gradient; drawn in its own colours, so a tone does not apply.</desc>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#d946ef"/>
  </linearGradient>
  <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <mask id="clear" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"/>
    <rect x="6.78" y="2.28" width="18.43" height="18.43" rx="5" transform="rotate(45 16 11.5)" fill="#000"/>
  </mask>
  <g transform="translate(16 0) scale(1.55 1) translate(-16 0)">
    <rect fill="url(#top)" x="9.28" y="4.78" width="13.43" height="13.43" rx="2.5" transform="rotate(45 16 11.5)"/>
    <g mask="url(#clear)"><rect fill="url(#bottom)" x="9.28" y="14.03" width="13.43" height="13.43" rx="2.5" transform="rotate(45 16 20.75)"/></g>
  </g>
</svg>
