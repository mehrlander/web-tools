<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Qualified writing: clarity and precision</title>
  <rect width="960" height="640" fill="#ffffff"/>
  <circle cx="350" cy="350" r="255" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="3"/>
  <circle cx="610" cy="350" r="255" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="3"/>
  <text x="250" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">Clarity</text>
  <text x="250" y="92" text-anchor="middle" font-size="19" fill="#334155">Can the reader follow?</text>
  <text x="710" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#92400e">Precision</text>
  <text x="710" y="92" text-anchor="middle" font-size="19" fill="#334155">Is the claim exact?</text>
  <g text-anchor="middle">
    <text x="228" y="268" font-size="28" font-weight="700" fill="#1e3a8a">Perspective</text>
    <text x="228" y="292" font-size="15" fill="#475569">what the reader lacks</text>
    <text x="228" y="345" font-size="21" font-weight="600" fill="#0f172a">Reference</text>
    <text x="228" y="366" font-size="14" fill="#64748b">rule 1</text>
    <text x="228" y="408" font-size="21" font-weight="600" fill="#0f172a">Terms</text>
    <text x="228" y="429" font-size="14" fill="#64748b">rule 2</text>
    <text x="228" y="471" font-size="21" font-weight="600" fill="#0f172a">Flow</text>
    <text x="228" y="492" font-size="14" fill="#64748b">rule 3</text>
  </g>
  <g text-anchor="middle">
    <text x="480" y="335" font-size="26" font-weight="700" fill="#0f172a">Qualifiers</text>
    <text x="480" y="360" font-size="15" fill="#475569">which one, whose,</text>
    <text x="480" y="380" font-size="15" fill="#475569">how many</text>
    <text x="480" y="402" font-size="14" fill="#64748b">rule 4</text>
  </g>
  <g text-anchor="middle">
    <text x="735" y="300" font-size="28" font-weight="700" fill="#92400e">Accuracy</text>
    <text x="735" y="324" font-size="15" fill="#475569">within the evidence</text>
    <text x="735" y="377" font-size="21" font-weight="600" fill="#0f172a">Scope</text>
    <text x="735" y="398" font-size="14" fill="#64748b">rule 5</text>
    <text x="735" y="440" font-size="21" font-weight="600" fill="#0f172a">Verdicts</text>
    <text x="735" y="461" font-size="14" fill="#64748b">rule 6</text>
  </g>
</svg>
