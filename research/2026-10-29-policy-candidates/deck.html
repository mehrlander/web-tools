<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy candidates</title>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
<script type="module">
  await import('https://mehrlander.github.io/web-tools/lib/entry.js');
  await gh.load('kits/swipe-deck.js');
  const esc = window.esc;

  const BLOB = 'https://github.com/mehrlander/web-tools/blob/main/';
  const VERDICT = {
    create: { label: 'Create', cls: 'badge-primary' },
    borderline: { label: 'Borderline', cls: 'badge-primary badge-outline' },
    leave: { label: 'Leave', cls: 'badge-ghost' },
    covered: { label: 'Covered', cls: 'badge-ghost' },
    change: { label: 'Change', cls: 'badge-primary badge-outline' },
  };

  // One candidate per slide; every field sits at the same place on every card.
  const C = [
  { title: 'No em dashes', area: 'From the retired survey: no em dashes', verdict: 'create',
    short: 'New entry in the Writing group',
    reason: 'You asked for it, it applies to all prose a session writes, and the name states the preference.',
    names: [
      { text: 'No em dashes · `/h:dash`, `/h:emdash`', pick: true },
      { text: 'Plain punctuation · `/h:punct`' } ],
    draft: [
      '### No em dashes · `/h:dash`, `/h:emdash`',
      'Join ideas with a colon, a comma, a semicolon, parentheses or a new sentence, not a dash.',
      '- Em dashes may have been fine once, but they are now an easy button for AI, and we would rather stick to standard professional writing.',
      '**Covers:** all prose a session writes, including text drafted for the owner to send.',
      '**Detail:** [QUALIFIED-WRITING.md](https://github.com/mehrlander/web-tools/blob/main/docs/QUALIFIED-WRITING.md), its opening paragraph.',
      '**See also:** [peeves](https://github.com/mehrlander/web-tools/blob/main/skills/peeves/peeves.csv) P64, percussive negation and contrast.' ],
    evidence: [
      'Your words, 2026-10-29, asking for this assessment: "it\'s so clear that it deserves a place and it\'s kind of its own thing."',
      'Your profile text, 2026-09-26: "Avoid the em dash, a noxious weed in AI output." Earliest found: 2026-07-30.',
      'QUALIFIED-WRITING.md, opening: "No em dashes: use colons, commas, semicolons, parentheses, or new sentences."',
      'Peeve P07 covers en dashes and double hyphens used to join ideas; the Detail link reaches the same rule.' ] },
  { title: 'Edit the source', area: 'From the retired survey: commit discipline, and derived artifacts', verdict: 'create',
    short: 'Merges two survey areas into one judgment, in the Code placement group',
    reason: 'The survey\'s commit-discipline and derived-artifact rows state one judgment: a session edits and commits the source, and a generator owns its output. That judgment holds in web-tools and home alike, and your own words say it. The case against: in web-tools a test already fails a hand-edited output, so the entry earns its place mainly in repos without one.',
    names: [
      { text: 'Edit the source · `/h:source`', pick: true },
      { text: 'Source is the record · `/h:record`' },
      { text: 'Generated stays generated · `/h:generated`' } ],
    draft: [
      '### Edit the source · `/h:source`',
      'Change a generated file by changing its source and running its generator.',
      '**Covers:** every file a generator writes, in any repo: bundles, boards, catalogs and payloads.',
      '**Detail:** [CONSTELLATION.md](https://github.com/mehrlander/web-tools/blob/main/docs/CONSTELLATION.md), principle 1; web-tools [CLAUDE.md](https://github.com/mehrlander/web-tools/blob/main/CLAUDE.md), "The pre-build & the build-on-commit hook"; [registries.md](https://github.com/mehrlander/web-tools/blob/main/docs/registries.md) on recorded and computed values.' ],
    evidence: [
      'Your words, 2026-09-20: "if it is generated, then presumably we don\'t need to actually store it."',
      'Your words, 2026-08-29: "But wouldn\'t just hand edit the standoff."',
      'web-tools CLAUDE.md: "Don\'t hand-edit a file the hook writes; edit the source and let the hook refresh it."',
      'home CLAUDE.md: "commit the builder and its small source, not the generated output."',
      'The web-tools test is `node/test/derived-artifacts.test.mjs`.' ] },
  { title: 'Merged means closed', area: 'From the retired survey: branches and merges', verdict: 'borderline',
    short: 'One judgment from the branches area, in the Handover group',
    reason: 'Of the branch and merge rows, one states a judgment: once a branch merges, it is finished. You have said so repeatedly, and the rule holds in every repo. The case against an entry: [CONVERSATION.md](https://github.com/mehrlander/web-tools/blob/main/docs/CONVERSATION.md) and the Claude Code platform prompt already state the rule.',
    names: [
      { text: 'Merged means closed · `/h:merged`', pick: true },
      { text: 'Merge means merge · `/h:merge`, your phrase' },
      { text: 'Fresh branch after merge · `/h:fresh`' } ],
    draft: [
      '### Merged means closed · `/h:merged`',
      'A merged branch takes no further commits; follow-up work starts a new branch from the current tip of the target branch and opens a new pull request.',
      '**Covers:** every branch a session pushes, in any repo.',
      '**Detail:** [post-merge-branch-mutation.md](https://github.com/mehrlander/web-tools/blob/main/docs/github/post-merge-branch-mutation.md); [CONVERSATION.md](https://github.com/mehrlander/web-tools/blob/main/docs/CONVERSATION.md), the 🟣 Merged state.' ],
    evidence: [
      'Your words: "Merge means merge" (2026-08-05); a new branch "is always my preference" (2026-09-27). In July you preferred the same branch.',
      'post-merge-branch-mutation.md: "Merged means closed." "Closed" there means the branch, not the pull request state.',
      'The other branch rows are procedure (draft PRs, branch prefixes, `npm run preflight`, PR subscription) and stay in [AGENTS.md](https://github.com/mehrlander/web-tools/blob/main/AGENTS.md) and CONVERSATION.md.' ] },
  { title: 'Say a thing once', area: 'From the retired survey: registries', verdict: 'covered',
    short: 'Already in What earns space; registry mechanics stay in registries.md',
    reason: 'The judgment under the registry rules is that each statement has one owner and is linked from elsewhere. What earns space (`/h:crit`) already says it for documents, and [registries.md](https://github.com/mehrlander/web-tools/blob/main/docs/registries.md) applies it to CSVs, with a test that refuses two registries describing one property of one target.',
    evidence: [
      'Peeve P08, Say a thing once: "one owner per statement, linked from elsewhere, never restated in a second file."',
      '`/h:crit`: "check whether code derives the fact, a test enforces it, or another document owns it, and link instead."',
      'Your words, 2026-10-11: "I think now we have registries and streams." The one-registry rule appears only in quotes of registries.md.',
      'As an entry of its own it would be Say a thing once · `/h:once`, widening `/h:crit`\'s third bullet to data and code; I recommend against, since the peeve and `/h:crit` already reach it.' ] },
  { title: 'The owner names each task', area: 'From the retired survey: tracker filing', verdict: 'covered',
    short: 'Already in Who decides; the assessment-records rule folds into Stay current',
    reason: 'Who decides (`/h:who`) already says "The owner decides … new tracker tasks." The tasks skill keeps the procedure: file only what a later session would have to rediscover, and one task per outcome. The survey\'s rule that assessment records are historical and never regenerated folds into Stay current once its wording is approved (`/h:current`, drafted in [web-tools #1157](https://github.com/mehrlander/web-tools/pull/1157)): living text says what is true now, and history goes to the records built to hold it.',
    evidence: [
      'Your words, 2026-09-16: "Filing a task needs the user to name it. A general go-ahead is not sufficient."',
      'Peeve P32, No unrequested tasks: "Do not file a tracker task unless the owner asks for one."',
      '[TRACKER.md](https://github.com/mehrlander/web-tools/blob/main/docs/TRACKER.md): task ids an assessment names "may close, rename, or change meaning after it is written, and that is aging, not error".' ] },
  { title: 'Split at visibility', area: 'From the retired survey: repo boundaries and delivery', verdict: 'leave',
    short: 'Stays in CONSTELLATION.md and MARKETPLACE.md',
    reason: 'A session applies this judgment only when proposing a new repo or a new delivery channel, and that decision is yours under Who decides (`/h:who`, "architectural direction").',
    evidence: [
      'CONSTELLATION.md, principle 2: "a repo boundary exists where a visibility boundary exists, and otherwise usually does not."',
      'Your words: "generally all the skills should be available in the plugin" (2026-09-24). The visibility rule appears only in CONSTELLATION.md.' ] },
  { title: 'Name the situation', area: 'From the retired survey: skill authoring', verdict: 'leave',
    short: 'Stays in the skill-prefs skill',
    reason: 'The sharpest judgment here is that a skill\'s description names the situation that calls for the skill. It applies only to skill descriptions, and skill-prefs loads whenever a skill is written.',
    evidence: [
      '[skill-prefs](https://github.com/mehrlander/web-tools/blob/main/skills/skill-prefs/SKILL.md): "The trigger should name the situation that summons the skill, never the material it produces."',
      'Your words, 2026-07-30: "we need a short description that triggers appropriately."' ] },
  { title: 'Name the preference', area: 'The /h:policy entry, its naming line', verdict: 'change', namesLabel: 'Wording',
    short: 'Proposed change to /h:policy\'s line on shortcuts',
    reason: 'You agreed on 2026-10-29 that an entry is named for the preference it states, as Stay current is, and not for its topic. The `/h:policy` line now allows either. By my reading, 16 of the 22 existing names are topics or activities (Links, Checking, Kits, Scripts); six come closer to a preference (Look first, Who decides). I recommend changing the line now; renaming the 16 changes approved wording, so that waits on your word.',
    names: [
      { text: 'Current: "A shortcut names a preference or a bounded topic."' },
      { text: 'Proposed: "An entry and its shortcut are named for the preference the entry states, as Look first is; a topic alone is not an entry."', pick: true } ],
    evidence: [
      'Your words, 2026-10-29, on #1157: "comment is not a policy and that\'s a tension. The policy would be like h:current."',
      'Same thread: "They\'re kind of like judgments ultimately."',
      'The seven names on the earlier slides were written to the proposed line.' ] }
];

  const md = s => esc(s)
    .replace(/`([^`]+)`/g, '<code class="font-mono text-[0.9em]">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a class="link" href="$2">$1</a>');

  const label = t => `<p class="text-xs font-semibold uppercase tracking-widest text-base-content/50">${t}</p>`;
  const badge = v => `<span class="badge ${VERDICT[v].cls}">${VERDICT[v].label}</span>`;

  const glance = slide => {
    slide.innerHTML = `<article class="space-y-5">
      <h2 class="text-3xl font-semibold text-balance">Eight survey areas, seven named judgments</h2>
      <ol class="divide-y divide-base-300 border-y border-base-300">${C.map((c, i) => `
        <li class="flex cursor-pointer gap-3 py-3 hover:bg-base-200" data-go="${i + 1}">
          <span class="w-5 shrink-0 pt-1 font-mono text-sm text-base-content/50">${i + 1}</span>
          <div class="min-w-0 space-y-1">
            <p class="flex flex-wrap items-center gap-2 text-xl font-medium">${esc(c.title)} ${badge(c.verdict)}</p>
            <p class="text-lg text-base-content/70 text-pretty">${md(c.short)}</p></div></li>`).join('')}
      </ol></article>`;
    slide.querySelectorAll('[data-go]').forEach(r =>
      r.addEventListener('click', () => deck.deck.go(+r.dataset.go)));
  };

  const card = (c, slide) => {
    slide.innerHTML = `<article class="space-y-6">
      <div class="flex flex-wrap items-baseline gap-3">
        <h2 class="text-3xl font-semibold text-balance">${esc(c.title)}</h2>${badge(c.verdict)}
      </div>
      <p class="text-sm text-base-content/50">${md(c.area)}</p>
      <p class="text-xl leading-8 text-pretty">${md(c.reason)}</p>
      ${c.names ? `<section class="space-y-2">${label(c.namesLabel || 'Names')}
        <ul class="space-y-1 text-xl leading-8">${c.names.map(n => `<li>${n.pick ? '<i class="ph ph-check text-primary"></i> ' : '<span class="inline-block w-5"></span>'}${md(n.text)}</li>`).join('')}</ul></section>` : ''}
      ${c.draft ? `<section class="space-y-2">${label('Draft entry')}
        <div class="space-y-3 border-l-4 border-primary/40 pl-4 text-xl leading-8">${c.draft.map((p, k) => !k ? `<h3 class="font-semibold">${md(p.replace(/^### /, ''))}</h3>`
          : p.startsWith('- ') ? `<p class="text-pretty pl-5 -indent-5">•&nbsp; ${md(p.slice(2))}</p>`
          : `<p class="text-pretty">${md(p)}</p>`).join('')}</div></section>` : ''}
      <section class="space-y-2">${label('Evidence')}
        <ul class="list-disc space-y-1 pl-6 text-xl leading-8">${c.evidence.map(e => `<li class="text-pretty">${md(e)}</li>`).join('')}</ul></section>
    </article>`;
  };

  const open = () => window.swipeDeck.open({
    count: C.length + 1,
    render: (i, slide) => i ? card(C[i - 1], slide) : glance(slide),
    title: 'Policy candidates',
    subtitle: 'For docs/house-policies.md',
    icon: 'ph-scales',
    innerClass: 'w-full',
    link: { href: BLOB + 'docs/house-policies.md', title: 'House policies', icon: 'ph-github-logo' },
    index: i => i ? { title: C[i - 1].title, subtitle: VERDICT[C[i - 1].verdict].label } : { title: 'At a glance' },
  });
  let deck = open();
  document.getElementById('reopen').addEventListener('click', () => { deck = open(); });
  document.body.dataset.ready = '1';
</script>
</head>
<body class="bg-base-100 text-base-content">
<main class="px-4 py-8"><button id="reopen" class="btn"><i class="ph ph-cards"></i> Policy candidates</button></main>
</body>
</html>
