<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Object maps: requests and results</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root { color-scheme:light; --ink:#20242b; --muted:#626a74; --line:#dfe2e5; --accent:#1d4ed8; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html,body { height:100%; margin:0; background:#fff; color:var(--ink); font-family:ui-sans-serif,system-ui,sans-serif; }
    button,select { font:inherit; }
    button,a,select { touch-action:manipulation; }
    button { cursor:pointer; }
    button:focus-visible,a:focus-visible,select:focus-visible,[role=button]:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    a { color:var(--accent); text-decoration:underline; }
    .app { height:calc(100dvh - var(--dock-height,0px)); display:grid; grid-template-rows:auto minmax(0,1fr); }
    header { border-bottom:1px solid var(--line); padding:.95rem 1rem 0; font-size:15px; }
    .picker { display:flex; align-items:center; gap:.8rem; }
    .picker label { font-weight:650; white-space:nowrap; }
    select { flex:1; min-width:0; max-width:100%; border:0; border-bottom:1px solid var(--line); border-radius:0; background:white; padding:.35rem .15rem; font-weight:600; }
    .muted { color:var(--muted); }
    .tabs { display:flex; gap:1.3rem; overflow:auto; }
    .tabs button { flex:0 0 auto; padding:.5rem 0 .4rem; border:0; border-bottom:2px solid transparent; background:transparent; }
    .tabs button[aria-selected=true] { color:var(--accent); border-color:var(--accent); font-weight:650; }
    .panes { min-width:0; min-height:0; position:relative; }
    .pane { height:100%; overflow:auto; padding:.8rem 1rem 1.5rem; font-size:18px; line-height:1.5; overflow-wrap:anywhere; }
    h2,h3 { font-size:18px; font-weight:650; margin:0 0 .4rem; text-wrap:balance; }
    p { margin:0 0 .6rem; text-wrap:pretty; }
    .idea { margin:0; flex:1; }
    .toolbar { display:flex; align-items:center; gap:1rem; margin:0 0 .7rem; font-size:15px; }
    .toolbar .spacer { flex:1; }
    .plain { background:none; border:0; border-bottom:1px solid transparent; border-radius:0; padding:.25rem 0; color:var(--accent); white-space:nowrap; font-size:15px; }
    .plain:hover { border-bottom-color:currentColor; }
    .plain[aria-pressed=true] { border-color:var(--accent); font-weight:650; }
    .map-grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:1.5rem; align-items:start; margin:.4rem 0 1rem; }
    .object-sheet { min-width:0; padding:.5rem 0 .5rem 1.25rem; border-left:1px solid var(--line); }
    .object-sheet .toolbar { margin:0 0 .3rem; }
    .object-sheet h2 { margin:0; }
    .graphic { width:100%; display:block; }
    .link-graphic { height:340px; }
    .graphic path,.graphic line { stroke:#8b9aaf; stroke-width:1.5; fill:none; }
    .graphic marker path { fill:#8b9aaf; stroke:none; }
    .graphic rect { fill:#fff; stroke:#91a2b9; stroke-width:1.5; }
    .graphic .entity:hover rect,.graphic .entity:focus rect { stroke:var(--accent); }
    .graphic .entity[aria-pressed=true] rect { fill:#eff6ff; stroke:var(--accent); }
    .graphic text { font-family:ui-sans-serif,system-ui,sans-serif; fill:var(--ink); font-size:18px; }
    .graphic .edge-label { fill:var(--muted); font-size:15px; paint-order:stroke; stroke:#fff; stroke-width:6px; stroke-linejoin:round; }
    .graphic .entity text { font-size:18px; font-weight:600; fill:var(--accent); }
    .fields { margin:0; }
    .row { display:grid; grid-template-columns:minmax(7rem,22%) minmax(0,1fr); gap:.35rem 1rem; margin:0; padding:.4rem 0; border-top:1px solid var(--line); }
    .row:first-child { border-top:0; }
    .key { color:var(--muted); font-size:15px; padding-top:.15rem; }
    dd { margin:0; min-width:0; }
    .value { min-width:0; white-space:normal; text-wrap:pretty; }
    .values-list { margin:0 0 0 1.15rem; padding:0; list-style:disc; }
    .values-list li { margin:0 0 .25rem; }
    .record { padding:.6rem 0; border-top:1px solid var(--line); }
    .record:first-child { border-top:0; padding-top:0; }
    .field-group { margin:0 0 .7rem; }
    .field-group > h3 { color:var(--muted); font-size:15px; font-weight:500; margin:0 0 .2rem; }
    .field-group .field-group { margin-top:.4rem; }
    .decision { display:grid; grid-template-columns:minmax(0,28%) minmax(0,1fr); gap:.5rem 1.5rem; border-top:1px solid var(--line); padding:.65rem 0; }
    .decision h3 { margin:0; }
    .decision p:last-child { margin-bottom:0; }
    .decision .qualification { color:var(--muted); }
    .pointer { display:block; color:var(--muted); font:13px/1.5 ui-monospace,monospace; margin:.3rem 0 .8rem; overflow-wrap:anywhere; }
    .subnav,.example-tabs { display:flex; gap:1.2rem; overflow:auto; margin:0 0 .8rem; font-size:15px; }
    .subnav button,.example-tabs button { flex:0 0 auto; }
    .subnav button { color:var(--muted); }
    .subnav button[aria-pressed=true] { color:var(--accent); }
    .compare-pair { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1.5rem; align-items:start; }
    .compare-pair > section { min-width:0; }
    .compare-pair > section+section { padding-left:1.5rem; border-left:1px solid var(--line); }
    .compare-head { margin-bottom:.7rem; }
    .compare-label { margin-top:.6rem; }
    .compare-label h3 { color:var(--muted); font-size:15px; font-weight:500; margin:0; }
    .compare-pair + .compare-pair:not(.compare-label) { border-top:1px solid var(--line); }
    .example-columns .row { grid-template-columns:minmax(6rem,24%) minmax(0,1fr); }
    .example-tabs { display:none; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:.5rem 0; tab-size:2; }
    .raw { font:16px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .request { font:inherit; white-space:pre-wrap; }
    .inspector { background:white; position:absolute; inset:0; z-index:2; }
    .inspector h2 { font-size:20px; }
    .error { padding:1rem; }
    @media(max-width:850px) {
      .map-grid { grid-template-columns:minmax(0,1fr); gap:.4rem; }
      .object-sheet { padding:.6rem 0; border-left:0; border-top:1px solid var(--line); }
      .compare-pair { display:block; }
      .compare-pair > section+section { padding:0; border:0; }
      .compare-pair > section[data-selected=false],.compare-head { display:none; }
      .example-tabs { display:flex; }
    }
    @media(max-width:600px) {
      header { padding:.95rem .75rem 0; }
      .picker { gap:.6rem; }
      .picker label { display:none; }
      .pane { padding:.75rem .75rem 1.5rem; }
      .tabs { gap:1.1rem; }
      .toolbar { gap:.7rem; }
      .map-grid { margin-bottom:.5rem; }
      .decision { grid-template-columns:minmax(0,1fr); gap:.25rem; }
      .row,.example-columns .row { grid-template-columns:minmax(0,1fr); gap:0; }
      .row .row { grid-template-columns:minmax(6rem,30%) minmax(0,1fr); gap:.5rem; }
      .graphic .edge-label { font-size:15px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="picker"><label for="case">Object maps</label><select id="case" aria-label="Object map" data-at="current"></select></div>
      <div class="tabs" role="tablist" aria-label="Map view">
        <button id="tab-structure" role="tab" aria-controls="structure" aria-selected="true">Map</button>
        <button id="tab-logic" role="tab" aria-controls="logic" aria-selected="false" tabindex="-1">Logic</button>
        <button id="tab-examples" role="tab" aria-controls="examples" aria-selected="false" tabindex="-1">Examples</button>
        <button id="tab-json" role="tab" aria-controls="json" aria-selected="false" tabindex="-1">JSON</button>
        <button id="tab-request" role="tab" aria-controls="request" aria-selected="false" tabindex="-1">Prompt</button>
      </div>
    </header>
    <div class="panes">
      <section id="structure" class="pane" role="tabpanel" aria-labelledby="tab-structure" tabindex="0">
        <div class="toolbar"><span>WA Legislature</span><span class="spacer"></span><button id="relationships" class="plain">Relationships ↗</button><button id="download-svg" class="plain" aria-label="Download SVG">SVG ↓</button></div>
        <div id="cross-link"></div>
        <div class="map-grid">
          <div id="graphic" data-at="objects"></div>
          <section class="object-sheet" aria-live="polite">
            <div class="toolbar"><h2 id="object-heading"></h2><span class="spacer"></span><button id="object-json" class="plain">JSON ↗</button></div>
            <div id="object-content"></div>
          </section>
        </div>
      </section>
      <section id="logic" class="pane" role="tabpanel" aria-labelledby="tab-logic" tabindex="0" hidden>
        <p id="idea" class="idea"></p>
        <div id="distinctions" data-at="distinctions" data-at-open="tab-logic"></div>
        <div id="decisions"></div>
      </section>
      <section id="examples" class="pane" role="tabpanel" aria-labelledby="tab-examples" tabindex="0" hidden>
        <div id="example-picks" class="example-tabs" aria-label="Illustrative example"></div>
        <div id="example-views" class="subnav" aria-label="Example view"></div>
        <div id="example-body"></div>
        <div id="coverage" hidden></div>
      </section>
      <section id="json" class="pane" role="tabpanel" aria-labelledby="tab-json" tabindex="0" hidden>
        <div class="toolbar"><span id="json-name"></span><span class="spacer"></span><button id="download-json" class="plain">Download original JSON</button></div>
        <pre id="json-text" class="raw"></pre>
      </section>
      <section id="request" class="pane" role="tabpanel" aria-labelledby="tab-request" tabindex="0" hidden>
        <div id="request-views" class="subnav" aria-label="Prompt or source">
          <button id="show-prompt" class="plain" aria-pressed="true">Exact prompt</button>
          <button id="show-source" class="plain" aria-pressed="false">Shared source</button>
        </div>
        <div id="context" class="pointer"></div>
        <div id="requests"></div>
        <pre id="source" class="request" hidden></pre>
      </section>
      <section id="inspector" class="pane inspector" aria-label="Selected JSON field" hidden>
        <div class="toolbar"><button id="back" class="plain">← Back</button><h2 id="inspect-heading"></h2><span class="spacer"></span><button id="inspect-mode" class="plain">JSON</button></div>
        <span id="inspect-pointer" class="pointer"></span>
        <div id="inspect-content"></div>
        <pre id="inspect-raw" class="raw" hidden></pre>
      </section>
    </div>
  </main>
  <script type="application/json" id="trial-data">{"cases": [{"key": "conceptual-1", "label": "Conceptual sketch", "brief": "Create a concise conceptual object map for this material, in the spirit of Sophia Prater's object mapping and Hugh Dubberly's concept mapping. The reader wants to understand and compare the legislative races in the article.\n\nDiscover the meaningful objects, their attributes and relationships, and the few organizing distinctions that make the subject understandable. Prioritize what matters to the reader. Design your own JSON schema.\n\nTreat the result as a design sketch for discussion. Populate just two representative examples that demonstrate different relationships or distinctions, with only the values needed to show how the model works. Briefly state the examples' coverage.\n\nUse only the supplied source as reported at its publication date. Keep reported facts, your interpretations, and unknowns distinguishable. Return readable, indented JSON with no commentary outside the JSON. No HTML.\n", "result_text": "{\n  \"purpose\": \"A discussion sketch for comparing Washington legislative contests, using a race for one seat as the main unit.\",\n  \"source\": {\n    \"publisher\": \"Washington State Standard\",\n    \"title\": \"Legislative races to watch as Washington’s election season revs up\",\n    \"publication_date\": \"2026-05-08\",\n    \"url\": \"https://washingtonstatestandard.com/2026/05/08/a-dozen-legislative-races-to-watch-as-washingtons-election-season-revs-up/\",\n    \"boundary\": \"Only the supplied article, as reported on its publication date.\"\n  },\n  \"evidence_convention\": {\n    \"reported\": \"Facts or characterizations explicitly reported in the article, including attributed positions.\",\n    \"interpretation\": \"Organizing choices and comparisons proposed by this map, rather than conclusions stated by the article.\",\n    \"unknown\": \"Information the article does not establish. Omitted attributes are outside the sketch, rather than evidence that a feature is absent.\"\n  },\n  \"model\": {\n    \"status\": \"interpretation\",\n    \"objects\": {\n      \"district\": {\n        \"attributes\": [\"number\", \"reported geography\", \"reported partisan landscape\"],\n        \"relationships\": [\"contains legislative seats\"]\n      },\n      \"seat\": {\n        \"attributes\": [\"chamber\", \"position number if reported\", \"current holder\", \"current holder’s party\"],\n        \"relationships\": [\"belongs to one district\", \"is contested through a race in an election cycle\", \"is currently held by a person\"]\n      },\n      \"race\": {\n        \"attributes\": [\"election year\", \"incumbent seeking reelection or open seat\", \"reason for an opening\"],\n        \"relationships\": [\"contests one seat\", \"contains candidacies\", \"proceeds through the shared primary and general election stages\"]\n      },\n      \"person\": {\n        \"attributes\": [\"name\", \"selected reported background\"],\n        \"relationships\": [\"may hold a seat\", \"may enter a race through a candidacy\"]\n      },\n      \"candidacy\": {\n        \"attributes\": [\"reported party affiliation\", \"incumbent or challenger role\", \"selected reported positions or ideological characterization\"],\n        \"relationships\": [\"joins one person to one race\", \"competes with the other candidacies in that race\"]\n      }\n    },\n    \"organizing_distinctions\": [\n      {\n        \"distinction\": \"District versus seat versus race\",\n        \"meaning\": \"A district supplies geographic and political context. A seat is a particular legislative position. A race is the contest for that seat in one election year. Several races in the same district should remain separate.\"\n      },\n      {\n        \"distinction\": \"Incumbent contest versus open seat\",\n        \"meaning\": \"A sitting member seeking reelection creates a different comparison from candidates competing to succeed a departing member. Appointment history can also matter when describing the incumbent’s electoral experience.\"\n      },\n      {\n        \"distinction\": \"Party control versus competition within a party\",\n        \"meaning\": \"A race can involve both a possible change in the seat’s party and challengers from the incumbent’s party. Same-party competition alone does not establish an ideological divide.\"\n      },\n      {\n        \"distinction\": \"District context versus election forecast\",\n        \"meaning\": \"Reported labels such as battleground or Republican target describe the article’s context. Those labels do not provide candidate win probabilities.\"\n      }\n    ]\n  },\n  \"shared_reported_context\": {\n    \"election_year\": 2026,\n    \"jurisdiction\": \"Washington state Legislature\",\n    \"primary_date\": \"2026-08-04\",\n    \"general_election_date\": \"2026-11-03\",\n    \"advancement_rule\": \"The top two primary candidates advance to the general election.\",\n    \"current_house_control\": {\n      \"Democratic_seats\": 59,\n      \"Republican_seats\": 39\n    }\n  },\n  \"race_examples\": [\n    {\n      \"sketch_id\": \"hall_house_race\",\n      \"reported\": {\n        \"district\": {\n          \"number\": 5,\n          \"geography\": \"Includes parts of Issaquah, Black Diamond, Covington and Snoqualmie.\",\n          \"partisan_context\": \"Republicans have eyed the district for gains, while Democrats currently hold all three legislative seats.\"\n        },\n        \"seat\": {\n          \"chamber\": \"House\",\n          \"current_holder\": {\n            \"name\": \"Zach Hall\",\n            \"party\": \"Democratic\"\n          }\n        },\n        \"race\": {\n          \"seat_status\": \"Incumbent seeking reelection\",\n          \"incumbent_history\": \"Hall was appointed in June 2025 to replace Victoria Hunt after Hunt moved to the Senate. Because Hall’s appointment followed the 2025 filing deadline, Hall did not have to run in 2025.\"\n        },\n        \"candidacies\": [\n          {\n            \"person\": {\"name\": \"Zach Hall\"},\n            \"party\": \"Democratic\",\n            \"role\": \"Incumbent\",\n            \"selected_position\": \"Voted for the new income tax on millionaire earners.\"\n          },\n          {\n            \"person\": {\"name\": \"Michelle Bennett\"},\n            \"party\": \"Republican\",\n            \"role\": \"Challenger\",\n            \"selected_position\": \"Highlights opposition to an income tax as a top priority.\"\n          },\n          {\n            \"person\": {\"name\": \"Aimee Warmerdam\"},\n            \"party\": \"Democratic\",\n            \"role\": \"Challenger\",\n            \"article_characterization\": \"Progressive challenger\",\n            \"selected_positions\": [\"Universal health care\", \"$26 minimum wage\", \"32-hour standard workweek\", \"New payroll tax on large companies\"]\n          },\n          {\n            \"person\": {\"name\": \"Topher Leritz\"},\n            \"party\": \"No party affiliation\",\n            \"role\": \"Challenger\"\n          }\n        ]\n      },\n      \"interpretation\": {\n        \"party_control_question\": \"Can a Republican take a seat currently held by a Democrat?\",\n        \"within_party_question\": \"Can a reported progressive challenger displace the Democratic incumbent?\",\n        \"relationship_demonstrated\": \"Hall simultaneously holds the seat and participates in its race. Hall faces both a same-party challenger and candidates outside the Democratic Party.\",\n        \"process_implication\": \"All four candidates enter the same top-two primary. Party affiliation does not guarantee either party a place in the general election.\"\n      },\n      \"unknown\": [\n        \"The House position number is not supplied.\",\n        \"Hall’s earlier appointment does not establish the outcome of Hall’s first subsequent election.\",\n        \"The article supplies no polling or primary results establishing which candidates will advance.\"\n      ]\n    },\n    {\n      \"sketch_id\": \"valdez_open_house_race\",\n      \"reported\": {\n        \"district\": {\n          \"number\": 26,\n          \"geography\": \"Spans parts of Pierce and Kitsap counties.\",\n          \"partisan_context\": \"Described as one of the state’s few remaining legislative battleground districts.\"\n        },\n        \"seat\": {\n          \"chamber\": \"House\",\n          \"current_holder\": {\n            \"name\": \"Michelle Valdez\",\n            \"party\": \"Republican\"\n          }\n        },\n        \"race\": {\n          \"seat_status\": \"Open seat\",\n          \"opening_reason\": \"Valdez is not seeking reelection after six terms.\"\n        },\n        \"candidacies\": [\n          {\n            \"person\": {\"name\": \"Renee Hernandez Greenfield\"},\n            \"party\": \"Democratic\"\n          },\n          {\n            \"person\": {\"name\": \"Tedd Wetherbee\"},\n            \"party\": \"Democratic\"\n          },\n          {\n            \"person\": {\"name\": \"Katy Cornell\"},\n            \"party\": \"Republican\"\n          },\n          {\n            \"person\": {\"name\": \"Randy Phillips\"},\n            \"party\": \"No party affiliation\"\n          }\n        ]\n      },\n      \"interpretation\": {\n        \"party_control_question\": \"Can Democrats take a Republican-held open seat, or can a Republican successor retain the seat for that party?\",\n        \"within_party_question\": \"How will the two Democratic candidacies compete for advancement?\",\n        \"relationship_demonstrated\": \"Valdez holds the seat at publication but has no candidacy in the succession race. The two Democratic candidates compete for the same seat without challenging a Democratic incumbent.\",\n        \"comparison_with_first_example\": \"The two examples have the same party composition among four candidates, but differ in incumbent participation, the current holder’s party and the source of same-party competition.\"\n      },\n      \"unknown\": [\n        \"The House position number is not supplied. The seat should not be confused with the district’s separate House race involving Adison Richards.\",\n        \"The article does not establish an ideological divide between Greenfield and Wetherbee.\",\n        \"The article supplies no polling or primary results establishing which candidates will advance.\"\n      ]\n    }\n  ],\n  \"examples_coverage\": {\n    \"demonstrated\": \"Two House races show an appointed incumbent facing a progressive same-party challenge and an open Republican-held seat with two Democratic contenders. Both examples also show cross-party competition and a candidate without a party affiliation.\",\n    \"not_populated\": \"Senate races, special-election partial terms, representative moves between chambers, endorsements and the remaining district races. The sketch is illustrative rather than a complete election inventory.\"\n  }\n}"}, {"key": "question-led-1", "label": "Reader questions first", "brief": "Discover a concise information model that would help a general reader understand and compare the legislative races in the supplied article.\n\nBegin from three consequential reader questions. Choose the objects, attributes, relationships and distinctions needed to answer those questions. Find the organizing idea that connects the parts. Examine whether your first organization conflates different things, repeats the same thing, or introduces distinctions with no reader benefit; revise where useful.\n\nDesign your own JSON schema to communicate the model as a conceptual sketch. Populate just two representative examples that exercise different modeling decisions, with only the source values needed to demonstrate those decisions. Briefly state the examples' coverage. Keep the proposed structure open to revision.\n\nUse only the supplied source as reported at its publication date. Keep reported facts, your interpretations, and unknowns distinguishable. Return readable, indented JSON with no commentary outside the JSON. No HTML.\n", "result_text": "{\n  \"model\": {\n    \"name\": \"Compare individual legislative seat contests\",\n    \"status\": \"Provisional conceptual sketch\",\n    \"organizing_idea\": \"A district contains separate seat contests. Each contest combines a succession situation, a candidate field and several possible kinds of change.\",\n    \"reader_questions\": [\n      {\n        \"question\": \"Which seat is being contested, who is running and is the sitting member seeking reelection?\",\n        \"requires\": [\"District\", \"Seat contest\", \"Candidacies\", \"Seat-holder situation\"]\n      },\n      {\n        \"question\": \"Could the election change the officeholder, the seat's party representation or policy direction within a party?\",\n        \"requires\": [\"Current representation\", \"Candidate affiliations\", \"Reported ideological characterizations\", \"Separate assessments of each kind of change\"]\n      },\n      {\n        \"question\": \"What reported evidence distinguishes candidates, and what remains unknown?\",\n        \"requires\": [\"Selected policy actions, positions and support\", \"Evidence provenance\", \"Explicit unknowns\"]\n      }\n    ]\n  },\n  \"source\": {\n    \"title\": \"Legislative races to watch as Washington’s election season revs up\",\n    \"publisher\": \"Washington State Standard\",\n    \"publication_date\": \"2026-05-08\",\n    \"url\": \"https://washingtonstatestandard.com/2026/05/08/a-dozen-legislative-races-to-watch-as-washingtons-election-season-revs-up/\",\n    \"scope\": \"Only the supplied article as reported at publication. The article is an initial installment, not a statewide inventory.\",\n    \"reported_election_rules\": {\n      \"primary_date\": \"2026-08-04\",\n      \"advancement\": \"The top two candidates advance to the general election.\",\n      \"general_election_date\": \"2026-11-03\"\n    }\n  },\n  \"schema_sketch\": {\n    \"district\": {\n      \"identity\": \"District number\",\n      \"attributes\": [\"Reported geography\", \"Reported partisan context\"],\n      \"relationship\": \"One district may contain several House and Senate contests.\"\n    },\n    \"seat_contest\": {\n      \"identity\": \"District number + chamber + source seat locator\",\n      \"attributes\": [\"Current holder and party\", \"Holder seeking reelection\", \"Departure or appointment circumstances\", \"Candidacies\"],\n      \"seat_locator_rule\": \"Use the holder's name when the article omits a House position number; do not invent a position number.\"\n    },\n    \"candidacy\": {\n      \"identity\": \"Candidate name within a contest\",\n      \"attributes\": [\"Reported affiliation\", \"Incumbent or other contender\", \"Selected reported candidate evidence\"],\n      \"affiliation_values\": [\"Democratic\", \"Republican\", \"No affiliation declared\", \"Unreported\"],\n      \"relationship\": \"Each candidacy belongs to a particular seat contest. Endorsers and supporters attach to a candidacy, not to the candidate field.\"\n    },\n    \"evidence_convention\": {\n      \"reported\": \"Facts or characterizations attributed to the supplied article. A reported characterization remains the article's assessment.\",\n      \"interpretations\": \"The modeler's conclusions, accompanied by their reported basis.\",\n      \"unknowns\": \"Information absent from the article or outcomes not established at publication.\",\n      \"selection\": \"Example evidence is deliberately selective; an omitted detail need not be absent from the article.\"\n    }\n  },\n  \"distinctions\": [\n    {\n      \"distinction\": \"District context versus contest conditions\",\n      \"benefit\": \"A district's partisan description does not establish the competitiveness of every seat.\"\n    },\n    {\n      \"distinction\": \"Officeholder change, party change and ideological change\",\n      \"benefit\": \"An open seat guarantees a different holder, but need not change parties. Several kinds of change can coexist.\"\n    },\n    {\n      \"distinction\": \"Same-party competition versus a reported ideological challenge\",\n      \"benefit\": \"Two Democratic candidates do not, by themselves, establish a progressive-versus-moderate contest.\"\n    },\n    {\n      \"distinction\": \"No affiliation declared versus affiliation unreported\",\n      \"benefit\": \"A stated absence of party preference is information; an omitted preference is a gap.\"\n    },\n    {\n      \"distinction\": \"Policy action versus policy position\",\n      \"benefit\": \"A legislative vote and a campaign priority are different evidence. Preserve each policy's stated scope.\"\n    }\n  ],\n  \"organization_review\": [\n    {\n      \"initial_risk\": \"Treat each district heading as one race.\",\n      \"revision\": \"Make the seat contest the comparison unit and retain district context separately.\"\n    },\n    {\n      \"initial_risk\": \"Assign one exclusive label such as battleground or progressive challenge.\",\n      \"revision\": \"Assess succession, party representation and ideology separately.\"\n    },\n    {\n      \"initial_risk\": \"Repeat election rules for each candidate or create separate objects for every biographical detail.\",\n      \"revision\": \"Store common rules once and keep selected evidence within candidacies. Add reusable person records only if reuse warrants the complexity.\"\n    }\n  ],\n  \"examples\": [\n    {\n      \"id\": \"district-5-house-hall\",\n      \"reported\": {\n        \"district\": {\n          \"number\": 5,\n          \"partisan_context\": \"Republicans have eyed the district for gains; Democrats currently hold all three legislative seats.\"\n        },\n        \"seat\": {\n          \"chamber\": \"House\",\n          \"source_locator\": \"The seat held by Zach Hall\",\n          \"holder\": \"Zach Hal \"Cindy Ryu\", \"party_preference\": \"Democratic\"},\n            {\"person\": \"Ira McBee\", \"party_preference\": \"Republican\"}\n          ]\n        }\n      },\n      \"interpretation\": {\n        \"officeholding\": \"Incumbent seeking reelection: Salomon is both the current Senate holder and a candidate for the same seat. Ryu is an incumbent House member challenging for a different seat.\",\n        \"party_competition\": \"The field combines a Democrat challenging another Democrat with competition from a Republican.\",\n        \"partisan_stakes\": \"The reported field could return Salomon, replace Salomon with another Democrat, or change the seat to Republican representation.\",\n        \"reader_takeaway\": \"Calling Ryu an incumbent is insufficient to explain the contest. Her incumbency belongs to the House seat; her Senate candidacy challenges the holder of another office.\"\n      },\n      \"unknowns\": [\n        \"The article does not establish an ideological or policy contrast between Ryu and Salomon.\",\n        \"The article does not establish which candidates will advance or win.\"\n      ]\n    }\n  ],\n  \"cross_race_links\": [\n    {\n      \"person_id\": \"cindy-ryu\",\n      \"reported_relationships\": {\n        \"currently_holds_seat\": \"32-house-ryu-seat\",\n        \"seeks_seat\": \"32-senate-salomon-seat\"\n      },\n      \"interpretation\": {\n        \"connects_races\": [\"2026-32-house-ryu-seat\", \"2026-32-senate-salomon-seat\"],\n        \"meaning\": \"Ryu’s move connects an open House succession contest with a Senate incumbent’s reelection contest. The House needs a successor whether Ryu wins or loses the Senate race.\"\n      }\n    }\n  ],\n  \"example_coverage\": {\n    \"demonstrated\": \"Two races in the same district show why geography, seat identity, current officeholding, and candidacy must remain distinct. The examples contrast succession with incumbent reelection while showing that within-party and between-party competition can occur together.\",\n    \"not_demonstrated\": \"The examples do not show a Republican-held seat, a battleground district, a same-party-only field, an appointed incumbent, or an unaffiliated candidate. Those distinctions appear elsewhere in the article but are outside the two populated examples.\"\n  },\n  \"source_caution\": \"The article gives conflicting Senate majority counts: 30-19 in the introduction and 29-20 in the 42nd District section. The sketch preserves the shared claim of Democratic control without choosing between those counts.\"\n}\n", "initial_brief": "Create a concise conceptual object map for this material, in the spirit of Sophia Prater's object mapping and Hugh Dubberly's concept mapping. The reader wants to understand and compare the legislative races in the article.\n\nDiscover the meaningful objects, their attributes and relationships, and the few organizing distinctions that make the subject understandable. Prioritize what matters to the reader. Design your own JSON schema.\n\nTreat the result as a design sketch for discussion. Populate just two representative examples that demonstrate different relationships or distinctions, with only the values needed to show how the model works. Briefly state the examples' coverage.\n\nUse only the supplied source as reported at its publication date. Keep reported facts, your interpretations, and unknowns distinguishable. Return readable, indented JSON with no commentary outside the JSON. No HTML.\n"}], "source_text": "# Legislative races to watch as Washington’s election season revs up\n\nSource: Washington State Standard, May 8, 2026. https://washingtonstatestandard.com/2026/05/08/a-dozen-legislative-races-to-watch-as-washingtons-election-season-revs-up/\nLicense: CC BY-NC-ND 4.0, republished unedited with attribution\n\n---\n\nWith candidate filing closed, here’s an early look at some of the districts that might flip and where progressives are challenging other Democrats from the left.\n\nThis is the first of two installments providing an initial look at this year’s legislative races.\n\nWith Friday’s 5 p.m. candidate filing deadline, the field is coming into focus for the 2026 Washington state primaries.\n\nThis year’s midterms are significant for state government, as all 98 seats in the state House and 24 of 49 state Senate seats are up for grabs. Progressives are trying to unseat more moderate Democrats. Other Democrats are trying to wrest positions from Republican hands to increase their majorities. And Republicans are trying to claw back any seats that they can.\n\nMeanwhile, many new faces will arrive in Olympia next January with a slew of retirements.\n\nDemocrats currently hold a 59-39 majority in the state House and 30-19 in the Senate.\n\nAcross the state, over 1,000 candidates are running for 600-plus federal, state and local offices.\n\nThis year’s primary is Aug. 4, with the top two candidates advancing to the general election. Election Day is Nov. 3. Here’s a look at some of the notable legislative races taking shape.\n\n3rd District\n\nThe retirement of Rep. Timm Ormsby, the chief budget writer in the state House, opens up a vacancy to represent Spokane in Olympia. The district is reliably Democratic. Ormsby won in 2024 unopposed.\n\nThree Democrats are running to replace him. Luc Jasmin III, who has done regional outreach in eastern Washington for Govs. Bob Ferguson and Jay Inslee, has the support of Ormsby’s seatmate, Rep. Natasha Hill, D-Spokane, and former Senate Majority Leader Andy Billig. Jasmin created a statewide organization advocating for early learning centers and chaired Spokane’s police oversight office.\n\nPhysician Pam Kohlmeier brings a focus on expanding access to healthcare, specifically behavioral health and addiction services.\n\nDonovan Arnold DeLeon also filed to run as a Democrat.\n\nNatalie Poulson is the Republican candidate. She ran against Ormsby in 2022.\n\n5th District\n\nState Rep. Zach Hall, D-Issaquah, was appointed to a 5th District House seat last June. The district, which includes parts of Issaquah, Black Diamond, Covington, and part of Snoqualmie, is one that Republicans have eyed as territory where they might make gains in recent years, but Democrats currently hold all three legislative seats there.\n\nHall replaced now-Sen. Victoria Hunt, who moved to represent the district in the Senate after Sen. Bill Ramos died unexpectedly at the end of the 2025 session. Because Hall was appointed after last year’s candidate filing deadline, he didn’t have to run in 2025. He served six years on the Issaquah City Council and also chaired the Eastside Fire and Rescue Board of Directors.\n\nHe faces competition from Michelle Bennett, a Republican with a long career in law enforcement. Bennett is currently Mercer Island’s police chief and has worked in various law enforcement roles in western Washington dating back to 1990. Bennett is highlighting opposition to an income tax as one of her top priorities. (Hall voted this year for the new income tax on millionaire earners.)\n\nThere’s also a progressive challenger in the race. Aimee Warmerdam, a Democrat, backs policies such as universal health care, a $26 minimum wage, reducing the standard workweek to 32 hours and imposing a new payroll tax on large companies.\n\nA fourth candidate, Topher Leritz, who does not have any party affiliation, also filed Friday to run for the seat.\n\n11th District\n\nRep. David Hackney, D-Renton, was first elected to represent the 11th District in 2020. This year, he’s drawn a challenger from within his own party.\n\nDemocrat Ashley Fedan is a nurse and Navy veteran who started a business as a certified registered nurse anesthetist. She’s also active in the Democratic Party’s grassroots, serving as a precinct committee officer in the 11th District and previously as chair of the 28th District Democrats. The 11th covers Tukwila, Renton and parts of Kent.\n\nHackney, an attorney, is vice chair of the Consumer Protection and Business Committee and sits on the Environment and Energy, Transportation, and Legislative Ethics Committees.\n\nA Republican, Christian Rombough, has also filed to run for Hackney’s seat.\n\n26th District\n\nIt’s one of the few legislative districts in the state still considered a battleground and it’s seeing some action this year. In 2025, the 26th, which spans parts of Pierce and Kitsap counties, was the site of a hotly contested race between Sen. Deb Krishnadasan, D-Gig Harbor, and state Rep. Michelle Valdez, R-Gig Harbor.\n\nKrishnadasan won and is on the ballot again because she secured a partial term in a special election. She was appointed to the seat after it was vacated when Emily Randall was elected to Congress. Gary Parker, a restaurant owner and philanthropist, is running against Krishnadasan.\n\nMeanwhile, Valdez, whose last name was previously Caldier, isn’t seeking reelection in the House after six terms. Into that void have stepped four contenders — two Democrats, a Republican and a candidate without a party affiliation.\n\nOne Democrat is Renee Hernandez Greenfield, who is a speech and language trainer working with children and families. She’s also worked as a child protective services investigator for the Suquamish Tribe. Randall and the Kitsap County Democrats have endorsed Greenfield.\n\nThe other Democrat is Tedd Wetherbee, an entrepreneur who highlights his experience in international development. Local officials like Pierce County Executive Ryan Mello and Tacoma Mayor Anders Ibsen have lined up behind him.\n\nThe Republican is Katy Cornell, a pastor who co-leads a nonprofit that has focused on projects involving clean water, healthcare and other development issues in West Africa.\n\nAnother candidate, Randy Phillips, who lists an address in Gig Harbor, is also running, but without a party affiliation.\n\nBut wait, there’s more.\n\nRep. Adison Richards, D-Gig Harbor, an attorney who has worked on housing law issues and one of the handful of Democrats who voted against the income tax on millionaire earners this year, is facing primary competition from a fellow Democrat. Natalie Bornfleth is an Air Force veteran who is now a public school teacher involved in union leadership.\n\nAlso in the mix for Richards’ seat: Republican David Olson, vice president of the Peninsula School District, who ran unsuccessfully to be state superintendent of public instruction in 2024.\n\n29th District\n\nRep. Sharlett Mena, D-Tacoma, is running to replace longtime Sen. Steve Conway, who is retiring. That opens up a spot in the House that has attracted four Democratic hopefuls and two Republicans.\n\nThe Democrats include: Patrick Stickney, a senior policy and legislative affairs advisor at the state’s Office of Equity; Joe Bushnell, who’s deputy mayor of Tacoma; Erin Chapman-Smith, the executive director of ROOTS Young Adult Shelter in Seattle; and Natasha Laitila, who has worked as a legislative assistant for Rep. Jamila Taylor and Sen. Bob Hasegawa and took part in in efforts to unionize legislative staff.\n\nDarek Blum and Sheri Hayes are the Republicans in the race.\n\nThe district votes reliably Democratic and Mena ran for the House seat last time unopposed.\n\nMeanwhile, Rep. Melanie Morgan, D-Spanaway, faces a Democratic challenger as she seeks reelection. Krista Perez has been involved in a number of business and nonprofit ventures and is an author of a book on how marginalized groups can implement transformative and healing practices in their communities.\n\nMorgan, is an Army veteran, former school board director and has worked in various housing-related roles. She serves as vice chair of the Agriculture and Natural Resources Committee.\n\nBrett Johnson, a Republican who lost to Morgan in 2022, is running again.\n\n32nd District\n\nA crowded race of Democrats has formed in this deep blue district representing north King County and south Snohomish County, with state Rep. Cindy Ryu, D-Shoreline, choosing to challenge fellow Democrat Jesse Salomon for his Senate seat.\n\nFive Democrats and one Republican have filed for Ryu’s seat. They are Edmonds City Councilmembers Jenna Nand and Will Chen, Shoreline City Councilmember Keith Scully, consumer protection attorney Danica Noble and Chris Bloomquist, who runs an environmental- and technology-focused recruiting firm. Noble leads the early fundraising race. Republican Lisa Rezac, who lost to Ryu in 2024, is running again.\n\nRep. Lauren Davis, D-Seattle, also faces a Democrat-on-Democrat clash, against Imraan Siddiqi, the executive director of the Washington chapter of the Council on American-Islamic Relations. They’re the only two candidates running.\n\nRyu and Salomon are joined by Republican Ira McBee in the Senate race.\n\n42nd District\n\nThis Whatcom County district features one of the few open Senate seats, and a rare opportunity for Republicans, as they held this seat as recently as 2021. Four candidates are seeking the position vacated by Sen. Sharon Shewmake, D-Bellingham.\n\nShewmake is supporting Bellingham port commissioner Michael Shepard to replace her. He also has Senate Majority Leader Jamie Pedersen’s backing. Republican Erika Creydt, a psychologist, hopes to turn the district red, cutting into the Democrats’ 29-20 majority in the Senate.\n\nEamonn Collins, a teacher and former U.S. Senate adviser who leads a community land trust, is also running as a Democrat. Ryan Bowman filed to run without listing a party preference.\n"}</script>

      renderExamples();
      $('examples').scrollTop=0; remember();
    }
    function remember() {
      const params=new URLSearchParams(location.hash.slice(1));
      params.set('walkthrough','object-maps'); params.set('stop',String(index+1)); params.set('tab',tab); params.set('example',String(selectedExample+1));
      history.replaceState(null,'','#'+params.toString());
    }
    function selectTab(name, focus=false) {
      closeInspector(false); tab=tabs.includes(name)?name:'structure';
      for(const id of tabs) {
        const active=id===tab; $('tab-'+id).setAttribute('aria-selected',String(active)); $('tab-'+id).tabIndex=active?0:-1; $(id).hidden=!active;
      }
      if(tab==='structure') makeDiagram();
      if(focus) $('tab-'+tab).focus(); remember();
    }
    function showRun(i) {
      const next=Math.max(0,Math.min(data.cases.length-1,Number(i)||0));
      const keepExample=next===index?selectedExample:0; index=next;
      closeInspector(false); model=JSON.parse(data.cases[index].result_text); diagram=adaptation(); selectedObject=0;
      $('case').value=String(index);
      renderStructure(); $('structure').scrollTop=0;
      $('example-picks').replaceChildren(...examples().map((example,j)=>{
        const button=dom('button',exampleName(example,j),'plain'); button.addEventListener('click',()=>showExample(j)); return button;
      }));
      $('coverage').replaceChildren(); render(model.example_coverage || model.examples_coverage,$('coverage'));
      showExample(keepExample);
      $('json-name').textContent=data.cases[index].key+'.json'; $('json-text').textContent=data.cases[index].result_text;
      $('context').textContent=data.cases[index].initial_brief?'Follow-up to the agent’s own draft':'Fresh agent context';
      $('requests').replaceChildren();
      const briefs=data.cases[index].initial_brief?[['Initial request',data.cases[index].initial_brief],['Revision request',data.cases[index].brief]]:[['Request',data.cases[index].brief]];
      for(const [title,text] of briefs) { const section=dom('section'); section.append(dom('h2',title),dom('pre',text,'request')); $('requests').append(section); }
      $('request').scrollTop=0; $('json').scrollTop=0; remember();
    }
    function download(text,name,type) {
      const url=URL.createObjectURL(new Blob([text],{type})), a=dom('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    $('case').replaceChildren(...data.cases.map((item,i)=>{ const option=dom('option',`${i+1}. ${item.label}`); option.value=String(i); return option; }));
    $('source').textContent=data.source_text;
    $('show-prompt').addEventListener('click',()=>showSource(false));
    $('show-source').addEventListener('click',()=>showSource(true));
    function showSource(source) {
      $('source').hidden=!source; $('requests').hidden=source; $('context').hidden=source;
      $('show-prompt').setAttribute('aria-pressed',String(!source)); $('show-source').setAttribute('aria-pressed',String(source));
      $('request').scrollTop=0;
    }
    $('example-views').replaceChildren(...[['reported','Facts'],['interpretation','Interpretation'],['unknown','Gaps'],['coverage','Coverage']].map(([view,title])=>{
      const button=dom('button',title,'plain'); button.dataset.view=view;
      button.addEventListener('click',()=>{ exampleView=view; renderExamples(); $('examples').scrollTop=0; }); return button;
    }));
    $('object-json').addEventListener('click',()=>{ const [,title,pointer]=diagram.nodes[selectedObject]; inspect(title,pointer,true); });
    $('relationships').addEventListener('click',()=>inspect('Relationships',diagram.relationships));
    $('inspect-mode').addEventListener('click',()=>inspectorMode($('inspect-raw').hidden));
    $('case').addEventListener('change',()=>{ const next=Number($('case').value); showRun(next); Look.go(next); });
    $('back').addEventListener('click',closeInspector);
    addEventListener('keydown',event=>{ if(event.key==='Escape'&&!$('inspector').hidden) { event.preventDefault(); event.stopImmediatePropagation(); closeInspector(); } });
    $('download-json').addEventListener('click',()=>download(data.cases[index].result_text,data.cases[index].key+'.json','application/json'));
    $('download-svg').addEventListener('click',()=>{
      const copy=currentSvg.cloneNode(true); copy.setAttribute('xmlns',svgNS);
      const style=svg('style',{},'.entity rect{fill:white;stroke:#91a2b9;stroke-width:1.5}.entity[aria-pressed=true] rect{fill:#eff6ff;stroke:#1d4ed8}path{stroke:#8b9aaf;stroke-width:1.5;fill:none}marker path{fill:#8b9aaf;stroke:none}text{font-family:system-ui,sans-serif;fill:#20242b;font-size:18px}.entity text{font-size:18px;font-weight:600;fill:#1d4ed8}.edge-label{font-size:15px;fill:#626a74;paint-order:stroke;stroke:white;stroke-width:6px}');
      copy.prepend(style); download(new XMLSerializer().serializeToString(copy),data.cases[index].key+'.svg','image/svg+xml');
    });
    for(const name of tabs) {
      $('tab-'+name).addEventListener('click',()=>selectTab(name));
      $('tab-'+name).addEventListener('keydown',event=>{
        if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
        event.preventDefault(); event.stopPropagation(); const i=tabs.indexOf(tab);
        selectTab(event.key==='Home'?tabs[0]:event.key==='End'?tabs.at(-1):tabs[(i+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length],true);
      });
    }
    addEventListener('look:step',event=>{ if(event.detail.n===data.cases.length) showRun(event.detail.i); });
    let dock;
    const resizeDock=new ResizeObserver(()=>document.documentElement.style.setProperty('--dock-height',`${dock?Math.ceil(dock.getBoundingClientRect().height)+24:0}px`));
    const reserve=()=>{ const next=document.querySelector('[role=region][aria-label="Look marker"]'); if(next===dock)return; resizeDock.disconnect(); dock=next; if(dock)resizeDock.observe(dock); else document.documentElement.style.setProperty('--dock-height','0px'); };
    new MutationObserver(reserve).observe(document.documentElement,{childList:true});
    let lastWidth;
    new ResizeObserver(entries=>{ const width=entries[0].contentRect.width; if(width>0&&width!==lastWidth) {lastWidth=width;makeDiagram();} }).observe($('graphic'));
    const initial=new URLSearchParams(location.hash.slice(1)), initialExample=Number(initial.get('example')||1)-1;
    tab=tabs.includes(initial.get('tab'))?initial.get('tab'):'structure';
    showRun(Number(initial.get('stop')||1)-1); selectTab(tab); if(initialExample===1)showExample(1);
    addEventListener('DOMContentLoaded',()=>{ if(!Look.fromHash()) {Look.start(walks);Look.go(index);} });
  })();
  </script>
</body>
</html>
