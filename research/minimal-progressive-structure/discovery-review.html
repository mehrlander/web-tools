  <script type="application/json" id="trial-data">{"sources": {"election": {"text": "# Legislative races to watch as Washington’s election season revs up\n\nSource: Washington State Standard, May 8, 2026. https://washingtonstatestandard.com/2026/05/08/a-dozen-legislative-races-to-watch-as-washingtons-election-season-revs-up/\nLicense: CC BY-NC-ND 4.0, republished unedited with attribution\n\n---\n\nWith candidate filing closed, here’s an early look at some of the districts that might flip and where progressives are challenging other Democrats from the left.\n\nThis is the first of two installments providing an initial look at this year’s legislative races.\n\nWith Friday’s 5 p.m. candidate filing deadline, the field is coming into focus for the 2026 Washington state primaries.\n\nThis year’s midterms are significant for state government, as all 98 seats in the state House and 24 of 49 state Senate seats are up for grabs. Progressives are trying to unseat more moderate Democrats. Other Democrats are trying to wrest positions from Republican hands to increase their majorities. And Republicans are trying to claw back any seats that they can.\n\nMeanwhile, many new faces will arrive in Olympia next January with a slew of retirements.\n\nDemocrats currently hold a 59-39 majority in the state House and 30-19 in the Senate.\n\nAcross the state, over 1,000 candidates are running for 600-plus federal, state and local offices.\n\nThis year’s primary is Aug. 4, with the top two candidates advancing to the general election. Election Day is Nov. 3. Here’s a look at some of the notable legislative races taking shape.\n\n3rd District\n\nThe retirement of Rep. Timm Ormsby, the chief budget writer in the state House, opens up a vacancy to represent Spokane in Olympia. The district is reliably Democratic. Ormsby won in 2024 unopposed.\n\nThree Democrats are running to replace him. Luc Jasmin III, who has done regional outreach in eastern Washington for Govs. Bob Ferguson and Jay Inslee, has the support of Ormsby’s seatmate, Rep. Natasha Hill, D-Spokane, and former Senate Majority Leader Andy Billig. Jasmin created a statewide organization advocating for early learning centers and chaired Spokane’s police oversight office.\n\nPhysician Pam Kohlmeier brings a focus on expanding access to healthcare, specifically behavioral health and addiction services.\n\nDonovan Arnold DeLeon also filed to run as a Democrat.\n\nNatalie Poulson is the Republican candidate. She ran against Ormsby in 2022.\n\n5th District\n\nState Rep. Zach Hall, D-Issaquah, was appointed to a 5th District House seat last June. The district, which includes parts of Issaquah, Black Diamond, Covington, and part of Snoqualmie, is one that Republicans have eyed as territory where they might make gains in recent years, but Democrats currently hold all three legislative seats there.\n\nHall replaced now-Sen. Victoria Hunt, who moved to represent the district in the Senate after Sen. Bill Ramos died unexpectedly at the end of the 2025 session. Because Hall was appointed after last year’s candidate filing deadline, he didn’t have to run in 2025. He served six years on the Issaquah City Council and also chaired the Eastside Fire and Rescue Board of Directors.\n\nHe faces competition from Michelle Bennett, a Republican with a long career in law enforcement. Bennett is currently Mercer Island’s police chief and has worked in various law enforcement roles in western Washington dating back to 1990. Bennett is highlighting opposition to an income tax as one of her top priorities. (Hall voted this year for the new income tax on millionaire earners.)\n\nThere’s also a progressive challenger in the race. Aimee Warmerdam, a Democrat, backs policies such as universal health care, a $26 minimum wage, reducing the standard workweek to 32 hours and imposing a new payroll tax on large companies.\n\nA fourth candidate, Topher Leritz, who does not have any party affiliation, also filed Friday to run for the seat.\n\n11th District\n\nRep. David Hackney, D-Renton, was first elected to represent the 11th District in 2020. This year, he’s drawn a challenger from within his own party.\n\nDemocrat Ashley Fedan is a nurse and Navy veteran who started a business as a certified registered nurse anesthetist. She’s also active in the Democratic Party’s grassroots, serving as a precinct committee officer in the 11th District and previously as chair of the 28th District Democrats. The 11th covers Tukwila, Renton and parts of Kent.\n\nHackney, an attorney, is vice chair of the Consumer Protection and Business Committee and sits on the Environment and Energy, Transportation, and Legislative Ethics Committees.\n\nA Republican, Christian Rombough, has also filed to run for Hackney’s seat.\n\n26th District\n\nIt’s one of the few legislative districts in the state still considered a battleground and it’s seeing some action this year. In 2025, the 26th, which spans parts of Pierce and Kitsap counties, was the site of a hotly contested race between Sen. Deb Krishnadasan, D-Gig Harbor, and state Rep. Michelle Valdez, R-Gig Harbor.\n\nKrishnadasan won and is on the ballot again because she secured a partial term in a special election. She was appointed to the seat after it was vacated when Emily Randall was elected to Congress. Gary Parker, a restaurant owner and philanthropist, is running against Krishnadasan.\n\nMeanwhile, Valdez, whose last name was previously Caldier, isn’t seeking reelection in the House after six terms. Into that void have stepped four contenders — two Democrats, a Republican and a candidate without a party affiliation.\n\nOne Democrat is Renee Hernandez Greenfield, who is a speech and language trainer working with children and families. She’s also worked as a child protective services investigator for the Suquamish Tribe. Randall and the Kitsap County Democrats have endorsed Greenfield.\n\nThe other Democrat is Tedd Wetherbee, an entrepreneur who highlights his experience in international development. Local officials like Pierce County Executive Ryan Mello and Tacoma Mayor Anders Ibsen have lined up behind him.\n\nThe Republican is Katy Cornell, a pastor who co-leads a nonprofit that has focused on projects involving clean water, healthcare and other development issues in West Africa.\n\nAnother candidate, Randy Phillips, who lists an address in Gig Harbor, is also running, but without a party affiliation.\n\nBut wait, there’s more.\n\nRep. Adison Richards, D-Gig Harbor, an attorney who has worked on housing law issues and one of the handful of Democrats who voted against the income tax on millionaire earners this year, is facing primary competition from a fellow Democrat. Natalie Bornfleth is an Air Force veteran who is now a public school teacher involved in union leadership.\n\nAlso in the mix for Richards’ seat: Republican David Olson, vice president of the Peninsula School District, who ran unsuccessfully to be state superintendent of public instruction in 2024.\n\n29th District\n\nRep. Sharlett Mena, D-Tacoma, is running to replace longtime Sen. Steve Conway, who is retiring. That opens up a spot in the House that has attracted four Democratic hopefuls and two Republicans.\n\nThe Democrats include: Patrick Stickney, a senior policy and legislative affairs advisor at the state’s Office of Equity; Joe Bushnell, who’s deputy mayor of Tacoma; Erin Chapman-Smith, the executive director of ROOTS Young Adult Shelter in Seattle; and Natasha Laitila, who has worked as a legislative assistant for Rep. Jamila Taylor and Sen. Bob Hasegawa and took part in in efforts to unionize legislative staff.\n\nDarek Blum and Sheri Hayes are the Republicans in the race.\n\nThe district votes reliably Democratic and Mena ran for the House seat last time unopposed.\n\nMeanwhile, Rep. Melanie Morgan, D-Spanaway, faces a Democratic challenger as she seeks reelection. Krista Perez has been involved in a number of business and nonprofit ventures and is an author of a book on how marginalized groups can implement transformative and healing practices in their communities.\n\nMorgan, is an Army veteran, former school board director and has worked in various housing-related roles. She serves as vice chair of the Agriculture and Natural Resources Committee.\n\nBrett Johnson, a Republican who lost to Morgan in 2022, is running again.\n\n32nd District\n\nA crowded race of Democrats has formed in this deep blue district representing north King County and south Snohomish County, with state Rep. Cindy Ryu, D-Shoreline, choosing to challenge fellow Democrat Jesse Salomon for his Senate seat.\n\nFive Democrats and one Republican have filed for Ryu’s seat. They are Edmonds City Councilmembers Jenna Nand and Will Chen, Shoreline City Councilmember Keith Scully, consumer protection attorney Danica Noble and Chris Bloomquist, who runs an environmental- and technology-focused recruiting firm. Noble leads the early fundraising race. Republican Lisa Rezac, who lost to Ryu in 2024, is running again.\n\nRep. Lauren Davis, D-Seattle, also faces a Democrat-on-Democrat clash, against Imraan Siddiqi, the executive director of the Washington chapter of the Council on American-Islamic Relations. They’re the only two candidates running.\n\nRyu and Salomon are joined by Republican Ira McBee in the Senate race.\n\n42nd District\n\nThis Whatcom County district features one of the few open Senate seats, and a rare opportunity for Republicans, as they held this seat as recently as 2021. Four candidates are seeking the position vacated by Sen. Sharon Shewmake, D-Bellingham.\n\nShewmake is supporting Bellingham port commissioner Michael Shepard to replace her. He also has Senate Majority Leader Jamie Pedersen’s backing. Republican Erika Creydt, a psychologist, hopes to turn the district red, cutting into the Democrats’ 29-20 majority in the Senate.\n\nEamonn Collins, a teacher and former U.S. Senate adviser who leads a community land trust, is also running as a Democrat. Ryan Bowman filed to run without listing a party preference.\n", "sha256": "eb4722e8090bb8752efe638f592c94bdac2b23fc6a3241370e0de05e995e52ad"}, "aviation": {"text": "# Aviation Investigation Preliminary Report: DCA25MA108, midair collision near Ronald Reagan Washington National Airport, January 29, 2025\n\nSource: National Transportation Safety Board. https://www.ntsb.gov/investigations/Documents/DCA25MA108%20Prelim.pdf\nLicense: US federal government work, public domain; text extracted from the PDF, page headers removed, figures omitted\n\n---\n\nAviation Investigation Preliminary Report\nLocation:\n\nWashington, DC\n\nAccident Number:\n\nDCA25MA108\n\nDate & Time:\n\nJanuary 29, 2025, 20:48 Local\n\nRegistration:\n\nN709PS (A1); UNREG\n(A2)\n\nAircraft:\n\nBOMBARDIER INC CL-600-2C10\n(A1); Sikorsky UH60 (A2)\n\nInjuries:\n\n64 Fatal (A1); 3 Fatal\n(A2)\n\nFlight Conducted Under:\n\nPart 121: Air carrier - Scheduled (A1); Armed Forces (A2)\n\nOn January 29, 2025, about 2048 eastern standard time (EST), a Sikorsky UH-60L, operated by\nthe US Army under the callsign PAT25, and an MHI (Mitsubishi Heavy Industries) RJ Aviation\n(formerly Bombardier) CL-600-2C10 (CRJ700), N709PS, operated by PSA Airlines as flight\n5342, collided in flight approximately 0.5 miles southeast of Ronald Reagan Washington\nNational Airport (DCA), Arlington, Virginia, and impacted the Potomac River in southwest\nWashington, District of Columbia.\nThe 2 pilots, 2 flight attendants, and 60 passengers aboard the airplane and all 3 crew\nmembers aboard the helicopter were fatally injured. Both aircraft were destroyed as a result of\nthe accident. Flight 5342 was operating under the provisions of Title 14 Code of Federal\nRegulations (CFR) Part 121 as a scheduled domestic passenger flight from Wichita Dwight D.\nEisenhower National Airport (ICT), Wichita, Kansas, to DCA. PAT25 originated from Davison\nArmy Airfield (DAA), Fort Belvoir, Virginia, for the purpose of the pilot’s annual standardization\nevaluation with the use of night vision goggles (NVGs). Night visual meteorological conditions\nprevailed in the area of DCA at the time of the accident. Figure 1 below shows preliminary\nradar flight track information for PAT25 and preliminary automatic dependent surveillancebroadcast (ADS-B) information for flight 5342.\n\nFigure 1. Google Earth image with preliminary ADS-B data for flight 5342 (blue line) and radar\ndata for PAT25 (orange line).\nThe NTSB traveled to the accident site to start the investigation and supervised water recovery\noperations. As part of the investigative process, the NTSB invited qualified parties to\nparticipate in the investigation. These included PSA Airlines, GE Aerospace, Sikorsky, Federal\nAviation Administration (FAA), the US Army, National Air Traffic Controllers Association, Air\nLine Pilots Association, Association of Flight Attendants, International Association of\nMachinists and Aerospace Workers, Collins Aerospace, and the Metropolitan Washington\nAirports Authority. The Transportation Safety Board of Canada provided an accredited\nrepresentative and Transport Canada and MHI RJ Aviation are their technical advisors.\nThe parties were formed into specialized investigative groups led by NTSB group chairs in the\nareas of Air Carrier Operations and Human Performance, Airplane Structures, Airplane\nSystems, Powerplants, Helicopter Operations and Human Performance, Air Traffic Control\n\n(ATC) and Human Performance, Helicopter Airworthiness, Aircraft Performance, Survival\nFactors, and Flight Recorders (consisting of subgroups for airplane flight data recorder [FDR],\nairplane cockpit voice recorder [CVR], helicopter FDR, and helicopter CVR. All NTSB Board\nmembers visited the accident location, with Member Inman acting as the Member on-scene.\nCrew Experience\nFlight 5342\nBoth flight crewmembers of flight 5342 held airline transport pilot certificates with type ratings\nfor the CL-65 (which includes the CRJ-200, CRJ-700, and CRJ-900 airplanes). The captain had\naccumulated about 3,950 total hours of flight experience, of which about 3,024 hours were in\nthe accident airplane make and model. The captain held an FAA first-class medical certificate\nissued on January 10, 2025.\nThe first officer (FO) had accumulated about 2,469 total hours of flight experience, of which\nabout 966 hours were in the accident airplane make and model. The FO held an FAA first-class\nmedical certificate issued on October 31, 2024. The captain was the pilot flying, and the FO\nwas the pilot monitoring for the entirety of the accident flight.\nPAT25\nThe flight crew of PAT25 consisted of an instructor pilot (IP), pilot, and a crew chief. According\nto information provided by the US Army, both pilots were current and qualified in the accident\nhelicopter. The IP held the rank of Chief Warrant Officer 2 and had accumulated about 968\ntotal hours of flight experience, of which about 300 hours were in the accident helicopter make\nand model. The pilot held the rank of Captain and had accumulated about 450 total hours of\nflight experience, of which about 326 hours were in the accident helicopter make and model.\nThe crew chief held the rank of Staff Sargeant and had accumulated about 1,149 total flight\nhours, all of which was in UH-60 helicopters.\nHistory of Flight\nThe following is preliminary information derived from both aircraft’s flight data recorders\n(FDRs) and cockpit voice recorders (CVRs) as well as ATC radar data and communications.\nFlight 5342 departed ICT at 1839 EST on an instrument flight rules flight plan. The helicopter\nflight crew filed a visual flight rules flight plan with DAA base operations and departed at 1845\nwith the IP in the right seat and the pilot in the left seat.\nAbout 2015, flight 5342 started its initial descent.\nAbout 2030, PAT25 began travelling generally southbound after maneuvering near Laytonsville,\nMaryland. CVR audio from the helicopter indicated the IP was the pilot flying and the pilot was\nthe pilot monitoring and transmitting on the radio at this time.\n\nPAT25 first checked in with the DCA tower controller at 2032. The controller issued the\naltimeter setting of 29.89 inches of mercury, and the PAT25 crew acknowledged by correctly\nreading back the altimeter setting. Following this initial contact with DCA tower, the crew\nconducted a change of control; the pilot became the pilot flying and the IP became the pilot\nmonitoring and transmitting on the radio for the remainder of the flight.\nAt 2033:41, the PAT25 crew requested Helicopter Route 1 to Route 4 to DAA, which the tower\ncontroller approved. At 2038:39, the helicopter reached the intersection of the DC Beltway and\nthe Potomac River near Carderock, Maryland. After briefly turning westbound, PAT25 turned\nback to the east and began descending as it picked up Helicopter Route 1 over the Potomac\nRiver southeast toward downtown Washington, DC.\nAt 2039:10, Potomac Approach cleared the crew of flight 5342, which was inbound to DCA\nfrom the south, for the Mount Vernon Visual Runway 1 approach. At 2040:46, the airplane\nrolled out of a left turn established on the instrument landing system localizer for runway 1, at\napproximately 4,000 ft pressure altitude, 170 knots (kts), with the landing gear up and flaps\nextended to 20º.\nAt 2043:06, the flight 5342 crew made initial contact with DCA tower. At this time, the airplane\nwas about 10.5 nautical miles (nm) from DCA. The tower controller asked if the crew could\nswitch to runway 33. The crew agreed, and the controller subsequently cleared flight 5342 for\nlanding on runway 33. The crew acknowledged and read back the clearance.\nAt 2043:48, PAT25 was about 1.1 nm west of the Key Bridge. According to the helicopter’s\nCVR, the pilot indicated that they were at 300 ft. The IP indicated they were at 400 ft. Neither\npilot made a comment discussing an altitude discrepancy. At 2044:27, as the helicopter\napproached Key Bridge, the IP indicated that the helicopter was at 300 ft descending to 200 ft.\nThe flight 5342 FDR indicated that, between 2044:41 and 2044:45, the crew selected 30º of\nflaps and then 45º of flaps. At 2044:49, the airplane’s landing gear were down and locked. The\nairplane was fully configured for landing about 6.2 nm south of the airport. At 2045:27, the\nautopilot was disconnected and flight 5342 began a shallow right turn off of the runway 1\nlocalizer at a radio altitude of approximately 1,700 ft and an airspeed of 134 kts. This occurred\napproximately 5 nm south of the airport.\nAt 2045:14, the crew of PAT25 advised the controller of their position over the Memorial\nBridge. At 2045:30, PAT25 passed over the Memorial Bridge. CVR data revealed that the IP told\nthe pilot that they were at 300 ft and needed to descend. The pilot said that they would\ndescend to 200 ft. At 2045:58, the helicopter crossed over the Washington Tidal Basin and\nfollowed the Washington Channel consistent with Helicopter Route 1.\n\nAt 2046:02, a radio transmission from the tower was audible on flight 5342’s CVR informing\nPAT25 that traffic just south of the Wilson Bridge was a CRJ (flight 5342) at 1,200 ft circling to\nrunway 33.\nCVR data from the helicopter indicated that the portion of the transmission stating the CRJ\nwas “circling” may not have been received by the crew of PAT25. The word “circling” is heard\nin ATC communications as well as the airplane’s CVR, but not on the helicopter’s CVR.\nAt 2046:08, the PAT25 crew reported that they had the traffic in sight and requested to\nmaintain visual separation. The controller approved the request. At this time, the distance\nbetween the two aircraft was about 6.5 nm. Figure 2 shows each aircraft’s approximate\nposition at 2046:02, when the controller first advised the crew of PAT25 of flight 5342.\n\nFigure 2. Google Earth image with airplane and helicopter preliminary flight tracks overlaid,\nand each aircraft’s approximate position shown at 2046:02.\n\nAt 2046:29, the flight 5342 CVR data indicated that the crew received a 1,000-ft automated\ncallout.\nAt 2046:48, DCA tower cleared other jet traffic on runway 1 for immediate departure with no\ndelay.\nAt 2047:27, or 32 seconds before impact, PAT25 passed the southern tip of Hains Point.\nAbout one second later, flight 5342 began a left roll to turn to final on runway 33. The airplane\nwas at a radio altitude of 516 ft and 133 kts. At 2047:29, the crew of flight 5342 received a\n500-ft automated callout.\nAt 2047:39, or 20 seconds before impact, a radio transmission from the tower was audible on\nboth CVRs asking the PAT25 crew if the CRJ was in sight. A conflict alert was audible in the\nbackground of the ATC radio transmission.\nAt 2047:40, the crew of flight 5342 received an automated traffic advisory from the airplane’s\ntraffic alert and collision avoidance system (TCAS) system stating, “Traffic, Traffic.” At this\ntime, the aircraft were about 0.95 nm apart, as shown in Figure 3.\n\nFigure 3. Google Earth image showing the approximate positions of both aircraft at 2047:40.\nAt 2047:42, or 17 seconds before impact, a radio transmission from the tower was audible on\nboth CVRs directing PAT25 to pass behind the CRJ. CVR data from the helicopter indicated\nthat the portion of the transmission that stated “pass behind the” may not have been received\nby the PAT25 crew, as the transmission was stepped on by a 0.8-second mic key from PAT25.\nIn response, at 2047:44, the crew of PAT25 indicated that traffic was in sight and requested\nvisual separation, which was approved by DCA tower. CVR data indicated that, following this\ntransmission, the IP told the pilot they believed ATC was asking for the helicopter to move left\ntoward the east bank of the Potomac.\nAt 2047:52, or 7 seconds before impact, flight 5342 rolled out on final approach for runway 33.\nThe airplane was at a radio altitude of 344 ft and 143 kts.\n\nAt 2047:58, or 1 second before impact, flight 5342 began to increase its pitch. FDR data\nshowed the airplane’s elevators were deflected near their maximum nose up travel.\nAt 2047:58, the controller issued a landing clearance to another airplane. During this\ntransmission, audible reactions could be heard from the other tower controllers as they\nobserved the collision, which occurred about 2047:59 while flight 5342 was over the Potomac\nRiver and on final approach for runway 33.\nThe flight 5342 FDR indicated that the airplane’s last recorded radio altitude was 313 ft, 2\nseconds before the collision. The airplane’s pitch at the time of the collision was 9º nose up\nand roll was 11º left wing down. The airplane was descending at 448 ft per minute.\nThe PAT25 FDR indicated that the radio altitude of the helicopter at the time of the collision\nwas 278 ft and had been steady for the previous 5 seconds. The helicopter’s pitch at the time\nof the collision was about 0.5º nose up with a left roll of 1.6º.\nThe NTSB obtained video recordings from several sources that showed the collision between\nthe aircraft and their descent to the water. A preliminary review of the videos revealed that the\nairplane's left- and right-wing navigation lights, left-wing, right-wing, and tail anticollision\n(strobe) lights, nose, right-wing, and left-wing landing lights, as well as the upper and lower\nbeacon lights, were all illuminated before the collision. Further, the helicopter's lower fuselage\nand aft pylon anticollision (strobe) lights, along with the left, right, and tail pylon position lights,\nwere also illuminated before the collision. None of the airplane’s lights used LED technology.\nVideo showed that, immediately after the collision, the outboard left wing of the airplane\nseparated, and the airplane rolled about 450°, impacting the water in an approximate 45° noselow attitude with a left roll about 90°.\nRecorders\nBoth the FDR and CVR aboard flight 5342 were L3-Harris Communications FA2100 solid-state\nmemory digital recorders. The FDR and CVR from flight 5342 were recovered by a Federal\nBureau of Investigation (FBI) dive team and immediately provided to engineers at the NTSB\nVehicle Recorder Laboratory. Data from both the CVR and FDR were downloaded successfully.\nThe CVR contained about 2 hours and 4 minutes of good to excellent quality audio that started\nmid-flight due to the CVR’s 2-hour recording capability. The FDR captured the entirety of the\naccident flight and contained about 400 parameters.\nPAT25 was equipped with a Goodrich Integrated Vehicle Health Management Unit (IVHMU),\nwhich incorporated a Penny & Giles Multi-Purpose Flight Recorder (MPFR) cockpit voice and\nflight data recorder. The combined recorder was recovered by the Metropolitan Police\nDepartment of the District of Columbia and transported to the NTSB Vehicle Recorder\nLaboratory. The cockpit voice recording contained about 2 hours of excellent quality audio.\n\nThe MPFR captured the entirety of the accident flight and contained about 70 flight data\nparameters. By design, the MPFR portion of the IVHMU does not record date information, time\ninformation, or helicopter position information (GPS position). A review of the MPFR dataset\nrevealed that the air data source for a parameter listed in provided documentation as\n“barometric altitude” was actually a recording of pressure altitude. Review of the recorded\npressure altitude values revealed that they were inconsistent with other available data, and the\npressure altitude parameter was declared invalid. Further work will determine if the invalid data\nfor pressure altitude was limited to only what was recorded on the MPFR, and whether it may\nhave affected other helicopter systems that used pressure altitude as a data source.\nOperator and Aircraft Information\nPSA Airlines is a wholly owned subsidiary of American Airlines based in Dayton, Ohio, and\nholds a 14 CFR 119 operating certificate for operations under 14 CFR Part 121. The company\noperates an all-jet fleet of MHI regional jet aircraft, including 61 MHI RJ CRJ700 and 80 MHI RJ\nCRJ900 airplanes. As part of standard FAA requirements for Part 121 operations, the CRJ was\nequipped with ADS-B out and a TCAS.\nAccording to the FAA, ADS-B uses GPS satellite signals to provide air traffic controllers and\npilots with accurate information to help keep aircraft safely separated in the sky and on\nrunways. Aircraft transceivers receive GPS signals and use them to determine the aircraft’s\nprecise position, which is combined with other data and broadcast to other aircraft and ATC\nfacilities.\nAccording to FAA publication “Introduction to TCAS II Version 7.1,” TCAS is a family of\nairborne devices that functions independently of the ground-based ATC system and provides\ncollision avoidance protection for a broad spectrum of aircraft types. All TCAS systems\nprovide some degree of collision threat alerting and a traffic display. TCAS II is mandated in\nthe United States by the FAA for commercial aircraft, including regional airline aircraft with\nmore than 30 seats or a maximum takeoff weight of more than 33,000 lbs. TCAS II provides\ntraffic advisories (TAs) and resolution advisories (RAs), that is, recommended escape\nmaneuvers, in the vertical dimension to either increase or maintain the existing vertical\nseparation between aircraft. On descent below 900 ft above ground level (agl), TCAS inhibits\nRAs. Below 900 ft agl on descent, TCAS issues a TA when the intruding aircraft is about 20\nseconds from the closest point of approach, or 0.3 nm, whichever occurs first. As the aircraft\ndescends below 400 ft agl on arrival, the aural annunciation associated with the TA is\ninhibited.\nAccording to the MHI RJ Flight Crew Operating Manual, the TCAS transceiver transmits\ninterrogations and receives replies from other aircraft transponders. The signals are processed\nto produce information on range, azimuth, and altitude of aircraft in the vicinity. The TCAS\nprovides both a visual display on the instrument panel as well as aural warnings to the flight\ncrew when the computer predicts a conflict. A TA voice warning is announced as, “TRAFFIC -\n\nTRAFFIC.” RA voice warning instructions include, but are not limited to, annunciations such as,\n“CLIMB, CLIMB,” “DESCEND, DESCEND,” or “LEVEL OFF, LEVEL OFF.”\nThe US Army 12th Aviation Battalion’s Bravo Company operates out of Davison Army Airfield\nat Fort Belvoir, Virginia, and has mission responsibility for priority air transport (PAT) and\ncontinuity of government operations. The accident helicopter was equipped with a transponder\ncapable of transmitting ADS-B out. The helicopter was not equipped with an autopilot.\nAir Traffic Control\nThe DCA control tower cab faces east looking across the Potomac River and, at the time of the\naccident, was handling traffic in a “North Operation,” meaning aircraft were landing and\ndeparting runway 1, with intermittent arrivals and departures to/from runway 33. The tower\nwas staffed with five controllers at the time of the accident, working five open positions:\nassistant local control, ground control, clearance delivery, local control, and operations\nsupervisor. The helicopter control and local control positions were combined at 1540 on the\nday of the accident, and the flight data and clearance delivery positions were combined. Flight\n5342 was communicating with the DCA tower controller via the published control tower\nfrequency of 119.1 MHz; PAT25 was communicating with the tower controller via the\npublished helicopter frequency of 134.35 MHz. Both frequencies utilized the very high\nfrequency range. Because the aircraft were on different frequencies, the crews of flight 5342\nand PAT25 were not able to hear each other’s transmissions to the controller, but the\ncontroller’s transmissions to each aircraft would be audible to both flight crews.\nHelicopter Routes\nAccording to FAA Order 7210.3EE, Facility Operation and Administration, FAA Helicopter Route\nCharts are graphic portrayals of discrete and/or common helicopter routes or operating zones\ndesigned to facilitate helicopter access into, egress from, and operation within high density\ntraffic areas. They generally include associated altitude or flight ceiling information to facilitate\ntraffic avoidance and pilot adherence to minimum safe altitude requirements. The charts\nprovide expanded and, in some cases, unique ground reference symbology to improve visual\nnavigation.\nThe Baltimore-Washington Helicopter Route Chart contains the helicopter routes for the\nWashington, DC area; the area immediately surrounding DCA is excerpted below (see figure 4).\nPAT25’s route on the night of the accident included Route 1, which begins in Cabin John,\nMaryland, and follows the western shore of the Potomac River southeast toward Washington,\nDC. After crossing Key Bridge, the route follows the eastern shore of the Potomac with the\nKennedy Center and Lincoln Memorial to the east and Roosevelt Island to the west, crossing\nMemorial Bridge (a compulsory reporting point). After Memorial Bridge, the maximum\nallowable altitude on Route 1 is 200 ft above mean sea level (msl).\n\nFigure 4. Excerpt of FAA Baltimore-Washington Helicopter Chart showing the area surrounding\nDCA. (Source: FAA.)\nRoute 1 then continues south of the Washington Monument, crossing West Potomac Park and\nthe Tidal Basin before following the Washington Channel along East Potomac Park. Hains\nPoint, the southernmost tip of East Potomac Park and located at the confluence of the\nPotomac and Anacostia rivers, is identified as a non-compulsory reporting point and the area\nwhere Route 4 intercepts Route 1. Route 4 continues south to the Woodrow Wilson Bridge\n\nalong the Potomac River’s eastern shore, with DCA to the west. South of Wilson Bridge, the\nmaximum allowable altitude along Route 4 increases from 200 ft msl to 300 feet msl.\nAccording to postaccident information obtained from FAA aeronautical information\nspecialists, helicopter routes have no defined lateral boundaries and are drawn to depict linear\npaths along defined surface features in a manner legible to flight crews. Any applicable\naltitude and lateral distance restrictions are typically documented in the chart specifications or\nin warning boxes displayed on the chart.\nAirport Information and Emergency Response\nDCA, located in Arlington, Virginia, is operated by the Metropolitan Washington Airports\nAuthority (MWAA) and is the 24th busiest airport in the United States. Due to noise regulations,\naircraft flight patterns follow the Potomac or Anacostia rivers.\nDCA maintains three operational runways; runway 1/19 is the runway most commonly used for\narriving and departing traffic and is 7,169 ft long with a width of 150 ft. Runway 15/33 is the\nsecond most commonly used runway and is 5,204 ft long and 150 ft wide. Runway 33 is\nequipped with a four-light precision approach path indicator (PAPI) that provides a 3° visual\napproach path indication to the runway touchdown zone. The runway 33 PAPI was operational\nat the time of the accident.\nMWAA Aircraft Rescue and Firefighting (ARFF) was notified of the accident about 2048 when\nthe air traffic control tower activated the alert phone. At 2050, the tower confirmed the location\nof the accident was in the water at the approach end of runway 33, and runway 15/33 was\nsubsequently closed. ARFF rescue boats launched at 2053, and the first victim was located in\nthe water at 2059.\nRecovery of human remains was conducted by divers from the FBI’s Evidence Response Team,\nDC Fire & EMS Department, Metropolitan Police Department, Maryland State Police, Baltimore\nCity and County Police and Fire, Randive, Inc. (under contract to the US Navy Supervisor of\nSalvage and Diving Operations [SUPSALV]), Prince George’s County Police divers, Maryland\nNatural Resources divers, Maryland State Fire Marshal divers, Anne Arundel County Fire\nDepartment divers and Maryland Transportation Authority Police Marine Division (surface\nsupport). The District of Columbia Office of the Chief Medical Examiner conducted autopsies\nof the civilian crew and toxicology samples were sent to FAA’s Forensic Sciences Laboratory,\nCivil Aerospace Medical Institute (CAMI) for analysis, as is standard practice. Civilian\npassengers were examined by the DC medical examiner. The Armed Forces Medical Examiner\nconducted autopsies and toxicology testing of the military crew.\nRecovery Operations and Aircraft Examinations\nThe wreckage of both aircraft was located in the Potomac River in depths ranging between 1\nand 8 ft depending on tidal conditions. The helicopter wreckage was about 3,730 ft southeast\nof the approach end of runway 33 and included most of the major structure. The airplane was\n\nfragmented into several pieces centered about 2,345 ft southeast of the approach end of\nrunway 33. The outboard left wing was recovered away from the main airplane wreckage,\nabout 2,790 ft southeast of the approach end of runway 33. The Army Corps of Engineers and\nthe US Navy SUPSALV surveyed the accident site using sonar and divers with helmet cameras.\nSUPSALV was assigned responsibility for aircraft recovery operations, which the NTSB\nsupervised. The wreckage was recovered to a secured hangar at DCA.\nAirplane\nThe airplane sustained extensive water impact damage to most of its structure. The fuselage\nwas recovered in 13 major sections comprising the entire length of the airplane, from the\nradome in the nose to the aft fuselage and tail cone. Two areas of damage were noted to the\nlower right side aft fuselage wing-to-body fairing. There was a puncture in the right side of the\nfairing about 10 inches (in) by 8 in, and a slash through the lower surface of the fairing, internal\nstructure, and lavatory access door about 29 in long by 2 in wide. An approximate 2-ft-long\nsection of one of the helicopter’s tail rotor blades was embedded in the slash (see figure 5).\n\nFigure 5. Damage to aft fuselage with tail rotor blade.\nThe vertical stabilizer and rudder remained attached to the aft fuselage and tail cone. The\nhorizontal stabilizer and attached elevators separated from the top of the vertical stabilizer.\nThe right wing was largely intact and remained attached to a portion of the right center\nfuselage. The right slats and flaps were in the fully extended position. The right landing gear\nremained attached and was in the extended position.\nThe inboard left wing between the airplane’s centerline and wing station (WS) 178 was\nsignificantly fragmented. The upper portion of the left main landing gear remained attached to\nthe left wing and the lower portion was separated; the outboard tire displayed a diagonal slash\nthrough all its layers. The outboard left wing from WS 178 to the wingtip was separated and\nrecovered in the debris field. The inboard end of the left center slat displayed a linear slash\nmark about 52 inches long (see figure 6). The slat skin aft of the leading edge of the slash was\n\ngouged and abraded linearly aftward. The left wing forward spar aft of the slat was also cut\nalong the same diagonal line, and the interior wing structure was damaged and deformed aft\nand inboard. There was some black paint transfer on the interior wing structure.\nTwo other sections of the inboard left slat displayed impact/denting and associated black\npaint transfer (see figure 7). Various pieces of fibrous materials were found in multiple\nsections of the airplane, including the left wing and vertical stabilizer. Samples of the fibrous\nmaterial were collected for documentation and identification at the NTSB Materials\nLaboratory.\n\nFigure 6. Close up view of slash mark displayed on left outboard slat.\n\nFigure 7. Close up view of impact mark on left inboard slat.\nThe left (No. 1) engine was recovered separated from its pylon with the core mostly intact.\nBoth fan core cowls were separated during the accident. The nacelle displayed no evidence of\nfire or uncontainment. All fan blades were bent aft and their leading edges exhibited dents,\ngouges, and missing material. The right (No. 2) engine was recovered mostly intact with its\npylon attached. The nacelle displayed no evidence of fire or uncontainment. The fan blades\nwere all full length and bent opposite the direction of rotation except for one blade that was\nfractured and separated about midspan. The leading edges of blade Nos. 10, 12, 14, 16, 19,\nand 22 displayed localized deformation near their tips. A section of the fan case rub strip was\nrubbed away from the 8 to 11 o’clock locations.\nThe airplane’s TCAS transmitter receiver, communication management unit, transponder, air\ndata computers, and exterior light bulbs were retained for additional examination.\nHelicopter\nThe helicopter came to rest inverted with the tail structure separated from the fuselage around\nthe tail transition section. The main fuselage had fractured into multiple pieces and was\nprimarily held together during recovery by cabling, hoses, and remnant structure. The two\ninternal crash-resistant fuel tanks (CFT) were present in their normally installed location; the\nright internal CFT was partially detached and the left internal CFT remained attached to the\nairframe.\nThe tail boom was intact and exhibited damage limited to wrinkled skin. The vertical fin was\nmostly intact, except for its upper end, which was fractured and deformed to the right. The\nstabilator was intact and exhibited impact deformation in the forward direction about the\nmiddle and aft end of the stabilator.\n\nThe main gearbox (MGB) remained attached to the structural roof beams, which had\nseparated from the main fuselage. The MGB housing was whole, and the main rotor shaft\nremained installed. The main rotor hub remained installed on the main rotor shaft. All four\nmain rotor blades were fractured near the hub.\nThe tail rotor hub inboard and outboard retention plates were recovered as an assembly and\nremained installed on the tail rotor gearbox output shaft. One of the four tail rotor blades\nremained mostly intact but exhibited damage to its tip and trailing edge. Remnants of the other\nthree tail rotor blades remained in the retention plate assembly.\nThe cockpit area was heavily fragmented. The left seat pilot’s barometric altimeter and\nhorizontal situation indicator were found separate from the cockpit area. The left barometric\naltimeter Kollsman window read between 29.88 and 29.89 inches of mercury (inHg).\nA portion of the right seat pilot’s instrument cluster was found separated from the cockpit\nstructure but remained connected via hoses and cables. The right barometric altimeter\nKollsman window was set to 29.87 inHg. Both left and right barometric altimeters, as well as\nthe left and right radar altimeters and their antennae, were retained for additional examination.\nThe electronic standby instrument system (ESIS) was found partially separated and remained\nattached via wiring. The glass cover was fractured, but the screen was not cracked. The ESIS\nwas retained for additional examination.\nThe pitot-static system was highly fragmented, with fractured pieces found in the cockpit area\nof the main wreckage. One whole pitot-static probe and one partial pitot-static probe were\nrecovered, both of which were separated from the helicopter fuselage. The pitot and static\nlines from the left and right side pitot probes were traced along the airframe and exhibited\nfractures in multiple locations. The fittings at the unions along these lines were checked for\nsecurity and confirmed to be tight. The fittings on the fractured pieces of the pitot-static\nsystem were confirmed to be tight except for one fitting for a pitot outlet line found near the\ncockpit nose wreckage. This line and the two pitot-static probes were retained for further\nexamination.\nThe aft portion of the No. 1 (left) engine from the diffuser and midframe assembly to the tail\ncone was recovered intact with no evidence of external fire or uncontainment. Additional\npieces recovered by dive teams included the accessory gearbox, one compressor case half,\nthe compressor stage 2 bladed disk, the power takeoff shaft bevel gear, two pieces of the main\nframe, and the swirl frame. The output drive assembly was separated from the engine but\nremained attached to a portion of the helicopter torque tube. The aft side of the output drive\nassembly contained the fractured end of the power turbine drive shaft. The helicopter drive\nshaft was fractured in front of the engine's output drive assembly.\nThe No. 2 (right) engine appeared intact with no evidence of external fire or uncontainment.\nHand rotation of the output drive shaft resulted in corresponding smooth and continuous\nrotation of the power turbine.\n\nReview of helicopter maintenance records indicated, and examination of the recovered\nhelicopter wreckage confirmed, that the helicopter was equipped with a transponder. The\ntransponder and its remote control unit were retained for additional examination.\nTwo iPad minis were recovered separate from the helicopter main wreckage and retained for\nadditional examination.\nNear Midair Collision Events at DCA\nReview of information gathered from voluntary safety reporting programs along with FAA data\nregarding encounters between helicopters and commercial aircraft near DCA from 2011\nthrough 2024 indicated that a vast majority of the reported events occurred on approach to\nlanding. Initial analysis found that at least one TCAS resolution advisory (RA) was triggered per\nmonth due to proximity to a helicopter. In over half of these instances, the helicopter may have\nbeen above the route altitude restriction. Two-thirds of the events occurred at night.\nA review of commercial operations (instrument flight rules departures or arrivals) at DCA\nbetween October 2021 and December 2024 indicated a total of 944,179 operations. During\nthat time, there were 15,214 occurrences between commercial airplanes and helicopters in\nwhich there was a lateral separation distance of less than 1 nm and vertical separation of less\nthan 400 ft. There were 85 recorded events that involved a lateral separation less than 1,500 ft\nand vertical separation less than 200 ft.\nThe data indicated that, between 2018 and 2024, runway 1 accounted for about 57% of\narrivals, runway 19 accounted for about 38% of arrivals, runway 33 accounted for about 4% of\narrivals, and runway 15 accounted for less than 1 percent of arrivals at DCA. Runway 15\naccounted for about 5% of departures from DCA.\nSafety Actions\nOn January 31, 2025, the FAA issued a Notice to Airmen (NOTAM) prohibiting helicopter traffic\nfrom operating over the Potomac River near DCA from the surface up to and including 17,999\nft msl with exceptions for lifesaving medical, active law enforcement, air defense, or\npresidential transport missions. If such missions are required, civilian aircraft will not be\nallowed in the area. The most recent version of the NOTAM, 5/4379, was issued on February\n19, 2025, with updated dimensions for the temporary flight restriction. The NOTAM is in effect\nthrough March 31, 2025, at 2359 UTC.\nOn March 11, 2025, the NTSB issued two urgent safety recommendations to the FAA\nconcerning the helicopter routes near DCA.\nThe NTSB’s investigation is ongoing.\n\nAircraft and Owner/Operator Information (A1)\nAircraft Make:\n\nBOMBARDIER INC\n\nRegistration:\n\nN709PS\n\nModel/Series:\n\nCL-600-2C10\n\nAircraft Category:\n\nAirplane\n\nPSA Airlines\n\nOperating Certificate(s)\nHeld:\n\nFlag carrier (121)\n\nAmateur Built:\nOperator:\nOperator Designator Code:\n\nAircraft and Owner/Operator Information (A2)\nAircraft Make:\n\nSikorsky\n\nRegistration:\n\nUNREG\n\nModel/Series:\n\nUH60 L\n\nAircraft Category:\n\nHelicopter\n\nArmy Department of Defe Canada\nDavid Fisher; Mitsubishi Heavy Industries\nIan Sturgeon; Transport Canada\nShelley Ford; Collins Aerospace\n\nInvestigation Class:\n\nClass 1\n\nNote:\n\nThe NTSB traveled to the scene of this accident.\n\n", "sha256": "7773de7bc5f431e995d362fb7707c8eb8ef1f09df9fc34284bc5ec620f6c38c8"}}, "cases": [{"key": "election-draft", "source": "election", "stage": "draft", "label": "Election · Draft", "subtitle": "Discovery pilot · 2026 legislative contests", "result_text": "{\n  \"model_name\": \"How Washington legislative contests can change representation\",\n  \"scope\": {\n    \"status\": \"model_design\",\n    \"proposal\": \"Explain the different routes to changed representation in the 2026 legislative contests described by the supplied article: a change of party, replacement within a party, and succession after an officeholder leaves or seeks another seat.\",\n    \"specific_reader_job\": \"Given a district profile, identify which seat is being contested, what kind of change is possible, and how that contest connects to other seats or officeholders.\",\n    \"benefit\": \"A reader can distinguish several simultaneous contests in one district and understand that partisan competition, an incumbent challenge, and an open seat are separate dimensions that can overlap.\",\n    \"consequential_alternative\": {\n      \"scope\": \"Build a candidate comparison guide for deciding whom to support.\",\n      \"benefit\": \"Such a guide would connect candidate backgrounds and policy positions directly to a reader's preferences.\",\n      \"tradeoff\": \"The article supplies uneven biographies and policy information. Using those details as a balanced voter guide would risk treating missing coverage as a missing position. The chosen scope instead explains contest structure without ranking candidates.\"\n    },\n    \"inquiry_vs_material_coverage\": {\n      \"inquiry\": \"The mechanisms by which the described elections could change legislative representation, including connections between contests.\",\n      \"supplied_coverage\": \"One early article dated May 8, 2026, described as the first of two installments. It discusses selected contests in districts 3, 5, 11, 26, 29, 32, and 42, with different levels of detail.\",\n      \"boundary\": \"The article is not a statewide inventory, a uniform platform survey, or evidence of subsequent election outcomes. Being included does not establish that a race is more competitive than an omitted race.\"\n    },\n    \"reconsideration_after_exploration\": \"Use the election for a particular seat as the basic unit, group contests by district, and connect contests through officeholder movements. A single district-level race record would collapse distinct House and Senate contests, particularly in districts 26, 29, and 32.\"\n  },\n  \"source\": {\n    \"id\": \"article\",\n    \"publisher\": \"Washington State Standard\",\n    \"title_as_supplied\": \"Legislative races to watch as Washington’s election season revs up\",\n    \"date\": \"2026-05-08\",\n    \"url\": \"https://washingtonstatestandard.com/2026/05/08/a-dozen-legislative-races-to-watch-as-washingtons-election-season-revs-up/\",\n    \"license_as_supplied\": \"CC BY-NC-ND 4.0\",\n    \"use\": \"All populated factual claims below come exclusively from the supplied article. Source locations refer to its introductory text or named district sections.\"\n  },\n  \"evidence_rules\": {\n    \"supported_fact\": \"An assertion reported in the supplied material, with its reporting date and location retained. This status does not imply independent verification.\",\n    \"interpretation\": \"An explanation or comparison derived from stated facts, kept outside the factual records.\",\n    \"proposed_extension\": \"A potentially useful structure whose factual population requires more information.\",\n    \"unknown\": \"Information absent, incomplete, or internally inconsistent in the supplied material. Null means unknown, not none.\",\n    \"inheritance\": \"A facts block's status and source location apply to every populated factual value in that block. Example identifiers and descriptive seat keys are local model identifiers, not official seat numbers.\"\n  },\n  \"structure\": {\n    \"status\": \"model_design\",\n    \"things\": [\n      {\n        \"type\": \"District\",\n        \"purpose\": \"Groups distinct legislative seats and supplies reported geographic or political context. District context is not itself an election forecast.\"\n      },\n      {\n        \"type\": \"Seat\",\n        \"identity\": \"District, chamber, and official position number when known.\",\n        \"purpose\": \"Distinguishes the office from its current holder. When the House position number is missing, use a provisional key referring to the named holder.\"\n      },\n      {\n        \"type\": \"Contest\",\n        \"identity\": \"A seat and election cycle.\",\n        \"purpose\": \"Holds the dated candidate field, incumbent status, open-seat circumstances, and any special-term context. Primary and general elections are stages of the same contest.\"\n      },\n      {\n        \"type\": \"Person and candidacy\",\n        \"purpose\": \"Separates a person, their current office, and the seat they seek. Party preference and any reported ideological characterization belong to the candidacy's dated evidence.\"\n      },\n      {\n        \"type\": \"Change or event\",\n        \"purpose\": \"Records retirement, appointment, a run for another office, or an election outcome. Distinguishes an announced departure or candidacy from completed succession.\"\n      }\n    ],\n    \"relationships\": [\n      \"A district contains several seats; a seat has a contest in an election cycle.\",\n      \"A person holds a seat and may separately seek that seat or another seat.\",\n      \"A reported departure or run for another office can explain why another contest is open.\",\n      \"Candidates compete within one field; same-party and different-party competition can coexist.\",\n      \"A claim about a person, contest, district, or event retains its source location and reporting date.\"\n    ],\n    \"comparison_dimensions\": {\n      \"officeholder_continuity\": [\"incumbent running\", \"open seat\", \"unknown\"],\n      \"field_composition\": [\"same-party competition\", \"different-party competition\", \"reported absence of party affiliation\", \"unspecified party preference\"],\n      \"reported_change_drivers\": [\"retirement\", \"seeking another office\", \"appointment history\", \"special-election or partial-term context\"],\n      \"guardrail\": \"These are overlapping dimensions, not exclusive race categories. A Democrat challenging a Democrat is not automatically a progressive challenger, and an unspecified party is not automatically an unaffiliated candidacy.\"\n    }\n  },\n  \"shared_context\": {\n    \"facts\": {\n      \"status\": \"supported_fact\",\n      \"source_location\": \"article introduction\",\n      \"reporting_date\": \"2026-05-08\",\n      \"house_seats_up\": 98,\n      \"senate_seats_up\": 24,\n      \"senate_seats_total\": 49,\n      \"primary_date\": \"2026-08-04\",\n      \"primary_advancement\": \"The top two candidates advance to the general election.\",\n      \"general_election_date\": \"2026-11-03\",\n      \"reported_house_composition\": {\"Democrats\": 59, \"Republicans\": 39}\n    },\n    \"source_conflict\": {\n      \"status\": \"unknown\",\n      \"subject\": \"Current Senate party composition\",\n      \"reported_values\": [\n        {\"source_location\": \"article introduction\", \"Democrats\": 30, \"Republicans\": 19},\n        {\"source_location\": \"42nd District section\", \"Democrats\": 29, \"Republicans\": 20}\n      ],\n      \"handling\": \"Preserve both reported values. The supplied material does not resolve the discrepancy, so do not calculate a definitive statewide seat-change scenario from either value.\"\n    }\n  },\n  \"examples\": [\n    {\n      \"id\": \"five_house\",\n      \"structural_choice\": \"One contest with overlapping kinds of competition\",\n      \"facts\": {\n        \"status\": \"supported_fact\",\n        \"source_location\": \"5th District section\",\n        \"reporting_date\": \"2026-05-08\",\n        \"district\": 5,\n        \"seat\": {\"chamber\": \"House\", \"provisional_key\": \"Hall seat\", \"official_position_number\": null},\n        \"incumbent\": \"Zach Hall\",\n        \"incumbent_entry\": \"Appointed the previous June to replace Victoria Hunt after Hunt moved to the district's Senate seat.\",\n        \"prior_election_context\": \"Hall did not have to run in 2025 because his appointment followed that year's candidate filing deadline.\",\n        \"named_field\": [\n          {\"person\": \"Zach Hall\", \"party\": \"Democrat\", \"role\": \"incumbent\"},\n          {\"person\": \"Michelle Bennett\", \"party\": \"Republican\", \"role\": \"challenger\"},\n          {\"person\": \"Aimee Warmerdam\", \"party\": \"Democrat\", \"role\": \"challenger\", \"reported_characterization\": \"progressive challenger\"},\n          {\"person\": \"Topher Leritz\", \"party_description\": \"does not have any party affiliation\", \"role\": \"challenger\"}\n        ],\n        \"reported_district_context\": \"Democrats hold all three legislative seats; Republicans have eyed the district as possible territory for gains.\"\n      },\n      \"interpretations\": [\n        {\n          \"status\": \"interpretation\",\n          \"claim\": \"This contest simultaneously tests an appointed incumbent, includes competition within the Democratic field, and offers a Republican route to changing the seat's party representation. None of those structural observations establishes the likely winner.\"\n        }\n      ],\n      \"unknowns\": [\n        {\"status\": \"unknown\", \"item\": \"Official House position number\"},\n        {\"status\": \"unknown\", \"item\": \"Relative candidate strength, primary qualifiers, and general-election result\"}\n      ]\n    },\n    {\n      \"id\": \"twenty_nine_succession\",\n      \"structural_choice\": \"Two contests connected by an officeholder's move\",\n      \"facts\": {\n        \"status\": \"supported_fact\",\n        \"source_location\": \"29th District section\",\n        \"reporting_date\": \"2026-05-08\",\n        \"district\": 29,\n        \"reported_district_context\": \"The district votes reliably Democratic.\",\n        \"contests\": [\n          {\n            \"seat\": {\"chamber\": \"Senate\", \"provisional_key\": \"Conway seat\"},\n            \"opening\": \"Steve Conway is retiring.\",\n            \"named_candidates_in_this_example\": [\n              {\"person\": \"Sharlett Mena\", \"party\": \"Democrat\", \"current_office\": \"state representative\"}\n            ],\n            \"field_coverage\": \"The article identifies Mena's Senate candidacy but does not supply a complete Senate field.\"\n          },\n          {\n            \"seat\": {\"chamber\": \"House\", \"provisional_key\": \"Mena seat\", \"official_position_number\": null},\n            \"opening\": \"Mena's Senate run opens her House seat.\",\n            \"named_field\": [\n              {\"person\": \"Patrick Stickney\", \"party\": \"Democrat\"},\n              {\"person\": \"Joe Bushnell\", \"party\": \"Democrat\"},\n              {\"person\": \"Erin Chapman-Smith\", \"party\": \"Democrat\"},\n              {\"person\": \"Natasha Laitila\", \"party\": \"Democrat\"},\n              {\"person\": \"Darek Blum\", \"party\": \"Republican\"},\n              {\"person\": \"Sheri Hayes\", \"party\": \"Republican\"}\n            ]\n          }\n        ],\n        \"connections\": [\n          {\"from\": \"Conway retirement\", \"relationship\": \"creates opening in\", \"to\": \"Senate contest\"},\n          {\"from\": \"Mena\", \"relationship\": \"seeks\", \"to\": \"Senate seat\"},\n          {\"from\": \"Mena Senate run\", \"relationship\": \"opens\", \"to\": \"Mena House seat\"}\n        ]\n      },\n      \"interpretations\": [\n        {\n          \"status\": \"interpretation\",\n          \"claim\": \"The connected contests show how one retirement can accompany a wider reshuffling of officeholders. Mena's candidacy links the contests; the model does not record Mena as Conway's successor because no outcome is supplied.\"\n        }\n      ],\n      \"unknowns\": [\n        {\"status\": \"unknown\", \"item\": \"Complete Senate candidate field and eventual successors\"},\n        {\"status\": \"unknown\", \"item\": \"Conway's party affiliation, which this supplied section does not state\"},\n        {\"status\": \"unknown\", \"item\": \"Official position number for Mena's House seat\"}\n      ],\n      \"example_selection\": \"The separate Morgan House contest described in the article is outside this small example; omission does not mean the district has only these two contests.\"\n    }\n  ],\n  \"consequential_comparison\": {\n    \"status\": \"interpretation\",\n    \"claim\": \"A change of officeholder and a change of party control are distinct outcomes. Hall's contest could retain the incumbent, replace him with another Democrat, or produce a different party outcome. The Mena House contest requires a new holder because the seat is opening, but a new holder would not by itself imply a party change. Tracking seat, person, and party separately makes that distinction visible.\",\n    \"primary_implication\": \"Because the reported rule advances two candidates, candidate party labels should not be treated as a promise that one nominee from each party will reach the general election.\"\n  },\n  \"what_the_examples_leave_untested\": [\n    \"A special-election winner running again after securing a partial term, as described for Deb Krishnadasan in the 26th District.\",\n    \"Two officeholders competing for one seat, as with Cindy Ryu and Jesse Salomon in the 32nd District Senate race.\",\n    \"A field containing only two candidates, as described for Lauren Davis and Imraan Siddiqi in the 32nd District.\",\n    \"How endorsements, policy differences, fundraising, or previous results explain electoral strength; the examples do not establish those causal relationships.\",\n    \"Post-primary field changes, completed succession, and statewide effects on party control.\"\n  ],\n  \"extensions_requiring_more_information\": [\n    {\n      \"status\": \"proposed_extension\",\n      \"structure\": \"Verified seat registry and dated candidate-field snapshots\",\n      \"information_needed\": \"Official position identifiers, complete filings, withdrawals, and subsequent updates.\",\n      \"benefit\": \"Connect the same seat across time without relying on a former holder's name.\"\n    },\n    {\n      \"status\": \"proposed_extension\",\n      \"structure\": \"Comparable issue-position and support relationships\",\n      \"information_needed\": \"Consistent candidate statements, issue definitions, endorsement dates, and comparable fundraising periods.\",\n      \"benefit\": \"Support a fairer candidate comparison while preserving the distinction between a recorded stance, an endorsement, and evidence of electoral strength.\"\n    },\n    {\n      \"status\": \"proposed_extension\",\n      \"structure\": \"Election results and chamber-composition changes\",\n      \"information_needed\": \"Verified results and a reconciled baseline for Senate membership.\",\n      \"benefit\": \"Explain which possible changes occurred and how those outcomes affected the legislature.\"\n    }\n  ]\n}", "result_sha256": "2043d0f10a3176a80c3f1669747e638a822bcb3bb76ab8526c3ae1e754e0f183", "requests": [{"title": "Initial request", "text": "Develop a concise information model that would help the intended reader\nunderstand this subject. Choose your own JSON schema.\n\nFirst propose a useful scope and explain its benefit to the reader. Consider\none consequential alternative. Distinguish the scope of the andidates.\"\r\n    },\r\n    \"inquiry_vs_material_coverage\": {\r\n      \"inquiry\": \"The mechanisms by which the described elections could renew or change legislative representation, including connections between contests and the reported circumstances of an incumbent tenure.\",\r\n      \"supplied_coverage\": \"One early article dated May 8, 2026, described as the first of two installments. It discusses selected contests in districts 3, 5, 11, 26, 29, 32, and 42, with different levels of detail.\",\r\n      \"boundary\": \"The article is not a statewide inventory, a uniform platform survey, or evidence of subsequent election outcomes. Being included does not establish that a race is more competitive than an omitted race.\"\r\n    },\r\n    \"reconsideration_after_exploration\": \"Use the election for a particular seat as the basic unit, group contests by district, and connect contests through officeholder movements. A single district-level race record would collapse distinct House and Senate contests, particularly in districts 26, 29, and 32. On review, also distinguish an incumbent tenure from the appointment or election events supporting that tenure: a partial-term victory can be followed by another contest for the same officeholder.\"\r\n  },\r\n  \"source\": {\r\n    \"id\": \"article\",\r\n    \"publisher\": \"Washington State Standard\",\r\n    \"title_as_supplied\": \"Legislative races to watch as Washington’s election season revs up\",\r\n    \"date\": \"2026-05-08\",\r\n    \"url\": \"https://washingtonstatestandard.com/2026/05/08/a-dozen-legislative-races-to-watch-as-washingtons-election-season-revs-up/\",\r\n    \"license_as_supplied\": \"CC BY-NC-ND 4.0\",\r\n    \"use\": \"All populated factual claims below come exclusively from the supplied article. Source locations refer to its introductory text or named district sections.\"\r\n  },\r\n  \"evidence_rules\": {\r\n    \"supported_fact\": \"An assertion reported in the supplied material, with its reporting date and location retained. This status does not imply independent verification.\",\r\n    \"interpretation\": \"An explanation or comparison derived from stated facts, kept outside the factual records.\",\r\n    \"proposed_extension\": \"A potentially useful structure whose factual population requires more information.\",\r\n    \"unknown\": \"Information absent, incomplete, or internally inconsistent in the supplied material. Null means unknown, not none.\",\r\n    \"inheritance\": \"A facts block's status and source location apply to every populated factual value in that block. Example identifiers and descriptive seat keys are local model identifiers, not official seat numbers.\"\r\n  },\r\n  \"structure\": {\r\n    \"status\": \"model_design\",\r\n    \"things\": [\r\n      {\r\n        \"type\": \"District\",\r\n        \"purpose\": \"Groups distinct legislative seats and supplies reported geographic or political context. District context is not itself an election forecast.\"\r\n      },\r\n      {\r\n        \"type\": \"Seat\",\r\n        \"identity\": \"District, chamber, and official position number when known.\",\r\n        \"purpose\": \"Distinguishes the office from its current holder. When the House position number is missing, use a provisional key referring to the named holder.\"\r\n      },\r\n      {\r\n        \"type\": \"Contest\",\r\n        \"identity\": \"A seat and election cycle.\",\r\n        \"purpose\": \"Holds the dated candidate field, incumbent status, open-seat circumstances, and any special-term context. Primary and general elections are stages of the same contest.\"\r\n      },\r\n      {\r\n        \"type\": \"Person and candidacy\",\r\n        \"purpose\": \"Separates a person, their current office, and the seat they seek. Party preference and any reported ideological characterization belong to the candidacy's dated evidence.\"\r\n      },\r\n      {\r\n        \"type\": \"Change or event\",\r\n        \"purpose\": \"Records retirement, appointment, a run for another office, or an election outcome. Distinguishes an announced departure or candidacy from completed succession.\"\r\n      },\r\n      {\r\n        \"type\": \"Incumbent tenure context\",\r\n        \"purpose\": \"Connect a person occupying a seat to the reported appointment and election events supporting that occupancy. Preserve the stated kind of term, such as partial term, separately from the fact of winning. Do not invent start dates, end dates, or the length of the next term.\"\r\n      }\r\n    ],\r\n    \"relationships\": [\r\n      \"A district contains several seats; a seat has a contest in an election cycle.\",\r\n      \"A person holds a seat and may separately seek that seat or another seat.\",\r\n      \"A reported departure or run for another office can explain why another contest is open.\",\r\n      \"Candidates compete within one field; same-party and different-party competition can coexist.\",\r\n      \"A claim about a person, contest, district, or event retains its source location and reporting date.\",\r\n      \"An incumbent tenure can have both an appointment and a later election in its reported history; incumbent is not a synonym for previously elected to a full term.\",\r\n      \"A past contest and a current contest can concern the same continuing officeholder. A reported partial-term election can explain why another contest follows.\"\r\n    ],\r\n    \"comparison_dimensions\": {\r\n      \"officeholder_continuity\": [\r\n        \"incumbent running\",\r\n        \"open seat\",\r\n        \"unknown\"\r\n      ],\r\n      \"field_composition\": [\r\n        \"same-party competition\",\r\n        \"different-party competition\",\r\n        \"reported absence of party affiliation\",\r\n        \"unspecified party preference\"\r\n      ],\r\n      \"reported_change_drivers\": [\r\n        \"retirement\",\r\n        \"seeking another office\",\r\n        \"appointment history\",\r\n        \"special-election or partial-term context\"\r\n      ],\r\n      \"guardrail\": \"These are overlapping dimensions, not exclusive race categories. A Democrat challenging a Democrat is not automatically a progressive challenger, and an unspecified party is not automatically an unaffiliated candidacy. Record appointment and election evidence separately when both are reported; neither a past victory nor incumbent status supplies an unstated term end.\",\r\n      \"tenure_evidence\": [\r\n        \"appointment reported\",\r\n        \"partial-term election reported\",\r\n        \"other term information reported\",\r\n        \"term information unknown\"\r\n      ]\r\n    }\r\n  },\r\n  \"shared_context\": {\r\n    \"facts\": {\r\n      \"status\": \"supported_fact\",\r\n      \"source_location\": \"article introduction\",\r\n      \"reporting_date\": \"2026-05-08\",\r\n      \"house_seats_up\": 98,\r\n      \"senate_seats_up\": 24,\r\n      \"senate_seats_total\": 49,\r\n      \"primary_date\": \"2026-08-04\",\r\n      \"primary_advancement\": \"The top two candidates advance to the general election.\",\r\n      \"general_election_date\": \"2026-11-03\",\r\n      \"reported_house_composition\": {\r\n        \"Democrats\": 59,\r\n        \"Republicans\": 39\r\n      }\r\n    },\r\n    \"source_conflict\": {\r\n      \"status\": \"unknown\",\r\n      \"subject\": \"Current Senate party composition\",\r\n      \"reported_values\": [\r\n        {\r\n          \"source_location\": \"article introduction\",\r\n          \"Democrats\": 30,\r\n          \"Republicans\": 19\r\n        },\r\n        {\r\n          \"source_location\": \"42nd District section\",\r\n          \"Democrats\": 29,\r\n          \"Republicans\": 20\r\n        }\r\n      ],\r\n      \"handling\": \"Preserve both reported values. The supplied material does not resolve the discrepancy, so do not calculate a definitive statewide seat-change scenario from either value.\"\r\n    }\r\n  },\r\n  \"examples\": [\r\n    {\r\n      \"id\": \"five_house\",\r\n      \"structural_choice\": \"One contest with overlapping kinds of competition\",\r\n      \"facts\": {\r\n        \"status\": \"supported_fact\",\r\n        \"source_location\": \"5th District section\",\r\n        \"reporting_date\": \"2026-05-08\",\r\n        \"district\": 5,\r\n        \"seat\": {\r\n          \"chamber\": \"House\",\r\n          \"provisional_key\": \"Hall seat\",\r\n          \"official_position_number\": null\r\n        },\r\n        \"incumbent\": \"Zach Hall\",\r\n        \"incumbent_entry\": \"Appointed the previous June to replace Victoria Hunt after Hunt moved to the district's Senate seat.\",\r\n        \"prior_election_context\": \"Hall did not have to run in 2025 because his appointment followed that year's candidate filing deadline.\",\r\n        \"named_field\": [\r\n          {\r\n            \"person\": \"Zach Hall\",\r\n            \"party\": \"Democrat\",\r\n            \"role\": \"incumbent\"\r\n          },\r\n          {\r\n            \"person\": \"Michelle Bennett\",\r\n            \"party\": \"Republican\",\r\n            \"role\": \"challenger\"\r\n          },\r\n          {\r\n            \"person\": \"Aimee Warmerdam\",\r\n            \"party\": \"Democrat\",\r\n            \"role\": \"challenger\",\r\n            \"reported_characterization\": \"progressive challenger\"\r\n          },\r\n          {\r\n            \"person\": \"Topher Leritz\",\r\n            \"party_description\": \"does not have any party affiliation\",\r\n            \"role\": \"challenger\"\r\n          }\r\n        ],\r\n        \"reported_district_context\": \"Democrats hold all three legislative seats; Republicans have eyed the district as possible territory for gains.\"\r\n      },\r\n      \"interpretations\": [\r\n        {\r\n          \"status\": \"interpretation\",\r\n          \"claim\": \"This contest simultaneously tests an appointed incumbent, includes competition within the Democratic field, and offers a Republican route to changing the seat's party representation. None of those structural observations establishes the likely winner.\"\r\n        }\r\n      ],\r\n      \"unknowns\": [\r\n        {\r\n          \"status\": \"unknown\",\r\n          \"item\": \"Official House position number\"\r\n        },\r\n        {\r\n          \"status\": \"unknown\",\r\n          \"item\": \"Relative candidate strength, primary qualifiers, and general-election result\"\r\n        }\r\n      ]\r\n    },\r\n    {\r\n      \"id\": \"twenty_nine_succession\",\r\n      \"structural_choice\": \"Two contests connected by an officeholder's move\",\r\n      \"facts\": {\r\n        \"status\": \"supported_fact\",\r\n        \"source_location\": \"29th District section\",\r\n        \"reporting_date\": \"2026-05-08\",\r\n        \"district\": 29,\r\n        \"reported_district_context\": \"The district votes reliably Democratic.\",\r\n        \"contests\": [\r\n          {\r\n            \"seat\": {\r\n              \"chamber\": \"Senate\",\r\n              \"provisional_key\": \"Conway seat\"\r\n            },\r\n            \"opening\": \"Steve Conway is retiring.\",\r\n            \"named_candidates_in_this_example\": [\r\n              {\r\n                \"person\": \"Sharlett Mena\",\r\n                \"party\": \"Democrat\",\r\n                \"current_office\": \"state representative\"\r\n              }\r\n            ],\r\n            \"field_coverage\": \"The article identifies Mena's Senate candidacy but does not supply a complete Senate field.\"\r\n          },\r\n          {\r\n            \"seat\": {\r\n              \"chamber\": \"House\",\r\n              \"provisional_key\": \"Mena seat\",\r\n              \"official_position_number\": null\r\n            },\r\n            \"opening\": \"Mena's Senate run opens her House seat.\",\r\n            \"named_field\": [\r\n              {\r\n                \"person\": \"Patrick Stickney\",\r\n                \"party\": \"Democrat\"\r\n              },\r\n              {\r\n                \"person\": \"Joe Bushnell\",\r\n                \"party\": \"Democrat\"\r\n              },\r\n              {\r\n                \"person\": \"Erin Chapman-Smith\",\r\n                \"party\": \"Democrat\"\r\n              },\r\n              {\r\n                \"person\": \"Natasha Laitila\",\r\n                \"party\": \"Democrat\"\r\n              },\r\n              {\r\n                \"person\": \"Darek Blum\",\r\n                \"party\": \"Republican\"\r\n              },\r\n              {\r\n                \"person\": \"Sheri Hayes\",\r\n                \"party\": \"Republican\"\r\n              }\r\n            ]\r\n          }\r\n        ],\r\n        \"connections\": [\r\n          {\r\n            \"from\": \"Conway retirement\",\r\n            \"relationship\": \"creates opening in\",\r\n            \"to\": \"Senate contest\"\r\n          },\r\n          {\r\n            \"from\": \"Mena\",\r\n            \"relationship\": \"seeks\",\r\n            \"to\": \"Senate seat\"\r\n          },\r\n          {\r\n            \"from\": \"Mena Senate run\",\r\n            \"relationship\": \"opens\",\r\n            \"to\": \"Mena House seat\"\r\n          }\r\n        ]\r\n      },\r\n      \"interpretations\": [\r\n        {\r\n          \"status\": \"interpretation\",\r\n          \"claim\": \"The connected contests show how one retirement can accompany a wider reshuffling of officeholders. Mena's candidacy links the contests; the model does not record Mena as Conway's successor because no outcome is supplied.\"\r\n        }\r\n      ],\r\n      \"unknowns\": [\r\n        {\r\n          \"status\": \"unknown\",\r\n          \"item\": \"Complete Senate candidate field and eventual successors\"\r\n        },\r\n        {\r\n          \"status\": \"unknown\",\r\n          \"item\": \"Conway's party affiliation, which this supplied section does not state\"\r\n        },\r\n        {\r\n          \"status\": \"unknown\",\r\n          \"item\": \"Official position number for Mena's House seat\"\r\n        }\r\n      ],\r\n      \"example_selection\": \"The separate Morgan House contest described in the article is outside this small example; omission does not mean the district has only these two contests.\"\r\n    }\r\n  ],\r\n  \"consequential_comparison\": {\r\n    \"status\": \"interpretation\",\r\n    \"claim\": \"A change of officeholder and a change of party control are distinct outcomes. Hall's contest could retain the incumbent, replace him with another Democrat, or produce a different party outcome. The Mena House contest requires a new holder because the seat is opening, but a new holder would not by itself imply a party change. Tracking seat, person, and party separately makes that distinction visible.\",\r\n    \"primary_implication\": \"Because the reported rule advances two candidates, candidate party labels should not be treated as a promise that one nominee from each party will reach the general election.\"\r\n  },\r\n  \"what_the_examples_leave_untested\": [\r\n    \"Two officeholders competing for one seat, as with Cindy Ryu and Jesse Salomon in the 32nd District Senate race.\",\r\n    \"A field containing only two candidates, as described for Lauren Davis and Imraan Siddiqi in the 32nd District.\",\r\n    \"How endorsements, policy differences, fundraising, or previous results explain electoral strength; the examples do not establish those causal relationships.\",\r\n    \"Post-primary field changes, completed succession, and statewide effects on party control.\",\r\n    \"Exact term boundaries and changes across multiple completed elections. The challenge case tests the reported partial-term relationship but does not supply a full legal or chronological account of Senate terms.\"\r\n  ],\r\n  \"extensions_requiring_more_information\": [\r\n    {\r\n      \"status\": \"proposed_extension\",\r\n      \"structure\": \"Verified
