ludes electoral renewal for continuing officeholders. An incumbent tenure context connects reported appointment and election events to the stated kind of term, and connects that history to the current contest.\",\r\n    \"reader_benefit\": \"The reader can explain why another election occurs without assuming an earlier victory secured a full term, that an incumbent has left office, or that a new vacancy must have arisen.\",\r\n    \"revision_limit\": \"The two original examples and their factual contents are retained. Candidate-field comparisons, vacancy links, and the original evidence distinctions remain usable. One brief challenge case exercises the added structure.\",\r\n    \"example_roles\": [\r\n      \"The 5th District example still demonstrates overlapping competition within one field. Its existing appointment evidence now also supplies a tenure context without implying Hall previously won that seat.\",\r\n      \"The 29th District example still demonstrates connected open contests. A retirement and a run for another office explain prospective succession, while the model avoids recording an unreported successor.\",\r\n      \"The added 26th District case demonstrates electoral renewal after a partial-term victory, a relationship the original two examples did not exercise.\"\r\n    ]\r\n  },\r\n  \"challenge_case\": {\r\n    \"id\": \"twenty_six_senate_partial_term\",\r\n    \"structural_choice\": \"A continuing incumbent linked to distinct appointment, past-election, and current-contest records\",\r\n    \"facts\": {\r\n      \"status\": \"supported_fact\",\r\n      \"source_location\": \"26th District section\",\r\n      \"reporting_date\": \"2026-05-08\",\r\n      \"district\": 26,\r\n      \"seat\": {\r\n        \"chamber\": \"Senate\",\r\n        \"provisional_key\": \"Krishnadasan seat\"\r\n      },\r\n      \"incumbent\": {\r\n        \"person\": \"Deb Krishnadasan\",\r\n        \"party\": \"Democrat\"\r\n      },\r\n      \"reported_events\": [\r\n        {\r\n          \"event\": \"appointment\",\r\n          \"description\": \"Krishnadasan was appointed after Emily Randall vacated the seat when elected to Congress.\"\r\n        },\r\n        {\r\n          \"event\": \"special-election victory\",\r\n          \"year\": 2025,\r\n          \"winner\": \"Deb Krishnadasan\",\r\n          \"term_description\": \"partial term\"\r\n        },\r\n        {\r\n          \"event\": \"another candidacy for the same seat\",\r\n          \"year\": 2026,\r\n          \"candidate\": \"Deb Krishnadasan\"\r\n        }\r\n      ],\r\n      \"explicit_connection\": \"The article says Krishnadasan is on the ballot again because the special-election victory secured a partial term.\",\r\n      \"named_opponent_in_2026\": \"Gary Parker\"\r\n    },\r\n    \"interpretation\": {\r\n      \"status\": \"interpretation\",\r\n      \"claim\": \"The 2025 victory and 2026 contest are compatible parts of one incumbent history. A contest renews electoral authorization without necessarily producing a different representative. The partial-term relationship explains the repeat contest; no turnover or new vacancy is needed to explain that relationship.\"\r\n    },\r\n    \"unknowns\": [\r\n      {\r\n        \"status\": \"unknown\",\r\n        \"item\": \"Exact appointment date and calendar boundaries of the partial term\"\r\n      },\r\n      {\r\n        \"status\": \"unknown\",\r\n        \"item\": \"Length of the term offered by the 2026 contest\"\r\n      },\r\n      {\r\n        \"status\": \"unknown\",\r\n        \"item\": \"Gary Parker party affiliation, which the supplied section does not state\"\r\n      },\r\n      {\r\n        \"status\": \"unknown\",\r\n        \"item\": \"Subsequent qualifiers, election results, and any resulting change of officeholder\"\r\n      }\r\n    ]\r\n  }\r\n}", "result_sha256": "99832a9ef28c49cc535071697742f09e21cc29cb6d0f966da5a54746c991b629", "requests": [{"title": "Initial request", "text": "Develop a concise information model that would help the intended reader\nunderstand this subject. Choose your own JSON schema.\n\nFirst propose a useful scope and explain its benefit to the reader. Consider\none consequential alternative. Distinguish the scope of the inquiry from the\ncoverage of the supplied material.\n\nExplore the internal structure of the chosen subject. Look for meaningful\nthings, groupings, activities, events, changes, recurring patterns, and other\nrelationships where they matter. Let the material and reader purpose determine\nwhich structures earn a place. Reconsider the scope if the exploration reveals\na more useful organization.\n\nPopulate two small examples that exercise different structural choices. Explain\none consequential relationship or comparison the model makes understandable,\nand identify what the examples leave untested.\n\nKeep source-supported facts, interpretations, proposed structures needing more\ninformation, and unknowns distinguishable. Use only the supplied material for\npopulated factual claims. Return readable, indented JSON, with no HTML or prose\noutside the JSON.\n\nReader purpose:\nHelp a general reader understand the subject described by the material and\nthe consequential connections within it. Explain what more specific reader\njob your chosen scope serves."}, {"title": "Source supplied after the request", "text": "election/source.txt · SHA-256 eb4722e8090bb8752efe638f592c94bdac2b23fc6a3241370e0de05e995e52ad\nThe Source tab preserves the complete text."}, {"title": "Follow-up in the same agent context", "text": "Review your model using the original source and reader purpose. Find one\nconsequential weakness in its scope or internal structure. Use a concrete case\nto explain the weakness, and revise only where the change offers a reader\nbenefit. Retain the original two examples; you may add one brief challenge case.\nExplain what changed, what the examples demonstrate, and what remains uncertain.\nChoose your own JSON , "label": "Aviation · Draft", "subtitle": "Discovery pilot · DCA25MA108 preliminary report", "result_text": "{\n  \"subject\": \"Aircraft separation near DCA in the preliminary account of collision DCA25MA108\",\n  \"scope_proposal\": {\n    \"inquiry\": \"How two flights came to occupy a shared arrival environment, what separation arrangements and information were available, and how the accident relates to reported earlier encounters.\",\n    \"specific_reader_job\": \"Help a general reader follow the interaction between flight paths, traffic instructions, onboard alerts and evidence limitations without mistaking a preliminary sequence for an established cause.\",\n    \"benefit\": \"Connects the account across aircraft, air traffic control and historical encounters. A simple list of aircraft specifications or a single combined timeline would obscure who received which information and which comparisons the evidence permits.\",\n    \"consequential_alternative\": {\n      \"scope\": \"A complete accident and investigation inventory, including crew qualifications, wreckage, recovery, medical examinations and investigative organizations.\",\n      \"benefit\": \"Would better serve a reader tracking investigative completeness or physical reconstruction.\",\n      \"tradeoff\": \"Would give substantially more space to recovery and examination detail while making the operational interaction harder to follow. Physical findings remain eligible when they clarify an interaction or an evidence limitation.\"\n    },\n    \"scope_after_exploration\": \"Retain the separation inquiry, organized around operational interactions rather than aircraft chapters. Add historical encounter groups as context, with their distinct observation windows and definitions preserved.\",\n    \"coverage_of_supplied_material\": {\n      \"source\": \"S1\",\n      \"includes\": [\n        \"A preliminary flight sequence, communications, recorder observations and aircraft equipment descriptions.\",\n   <script>
  // Each view is an explicit adapter of a saved model; the JSON remains the artifact.
  (() => {
    'use strict';
    const data=JSON.parse(document.getElementById('trial-data').textContent);
    if(!data.cases)return;
    const tabNames={scope:'Scope',model:'Model',examples:'Examples',review:'Review',json:'JSON',request:'Prompt'};
    const tabs=Object.keys(tabNames), svgNS='http://www.w3.org/2000/svg';
    const initial=new URLSearchParams(location.hash.slice(1));

    let tab=tabs.includes(initial.get('tab'))?initial.get('tab'):'scope';
    let exampleView=['examples','insight','coverage','challenge'].includes(initial.get('view'))?initial.get('view'):'examples';
    let scopeView=initial.get('scope')==='boundary'?'boundary':'choice';
    let modelView=initial.get('model')==='map'?'map':'fields';
    let promptView=['prompt','source','dispatch'].includes(initial.get('prompt'))?initial.get('prompt'):'prompt';
    let handle, releaseKeys=()=>{};
    const views=new Map(), states=data.cases.map(()=>({example:0,object:0}));
    states[active].example=initial.get('example')==='2'?1:0;
    const tabBar=document.getElementById('view-tabs');
    const label=value=>String(value).replace(/_/g,' ').replace(/^\w/,c=>c.toUpperCase());
    const dom=(tag,text,className)=>{const el=document.createElement(tag);if(text!=null)el.textContent=text;if(className)el.className=className;return el;};
    const svg=(tag,attrs={},text)=>{const el=document.createElementNS(svgNS,tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!=null)el.textContent=text;return el;};
    function render(value,host) {
      if(value==null||typeof value!=='object'){host.append(dom('div',value==null?'Not supplied':String(value),'value'));return;}
      if(Array.isArray(value)&&value.every(v=>v==null||typeof v!=='object')) {const list=dom('ul');for(const item of value)list.append(dom('li',item==null?'Not supplied':String(item)));host.append(list);return;}
      if(Array.isArray(value)){for(const item of value){const record=dom('div',null,'record');render(item,record);host.append(record);}return;}
      const fields=dom('div',null,'fields');
      for(const [key,item]of Object.entries(value)) {
        if(item&&typeof item==='object'&&!(Array.isArray(item)&&item.every(v=>v==null||typeof v!=='object'))) {const group=dom('section',null,'field-group');group.append(dom('h3',label(key)));render(item,group);fields.append(group);continue;}
        const row=dom('dl',null,'row'),body=dom('dd');row.append(dom('dt',label(key),'key'),body);render(item,body);fields.append(row);
      }
      host.append(fields);
    }
    function remember(){const p=new URLSearchParams(location.hash.slice(1));p.set('map',String(active+1));p.set('tab',tab);p.set('view',exampleView);p.set('scope',scopeView);p.set('model',modelView);p.set('prompt',promptView);p.set('example',String(states[active].example+1));history.replaceState(history.state,'','#'+p.toString());}
    function selectTab(name,focus=false){tab=name;for(const key of tabs){const b=document.getElementById('tab-'+key),yes=key===name;b.setAttribute('aria-selected',String(yes));b.tabIndex=yes?0:-1;}for(const view of views.values())view.applyTab();if(focus)document.getElementById('tab-'+name).focus();remember();}
    function selectExampleView(name){exampleView=name;for(const view of views.values())view.renderExamples();remember();}
    function selectPromptView(name){promptView=name;for(const view of views.values())view.renderPrompt();remember();}
    function selectScopeView(name){scopeView=name;for(const view of views.values())view.renderScope();remember();}
    function selectModelView(name){modelView=name;for(const view of views.values())view.renderModel();remember();}
    for(const key of tabs){const b=dom('button',tabNames[key]);b.id='tab-'+key;b.setAttribute('role','tab');b.setAttribute('aria-selected',String(key===tab));b.tabIndex=key===tab?0:-1;b.addEventListener('click',()=>selectTab(key));b.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();e.stopPropagation();const i=tabs.indexOf(tab);selectTab(e.key==='Home'?tabs[0]:e.key==='End'?tabs.at(-1):tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length],true);});tabBar.append(b);}
    function mount(index,slide) {
      const entry=data.cases[index], model=JSON.parse(entry.result_text), state=states[index];
      const root=document.getElementById('model-template').content.firstElementChild.cloneNode(true);root.dataset.map=String(index+1);slide.append(root);
      const refs=Object.fromEntries([...root.querySelectorAll('[id]')].map(el=>[el.id,el]));for(const [id,el]of Object.entries(refs))el.id=`map-${index+1}-${id}`;
      const $=id=>refs[id], field=p=>p===''?model:p.split('/').slice(1).reduce((v,k)=>v[k.replace(/~1/g,'/').replace(/~0/g,'~')],model);
      function sections(items,host){host.replaceChildren();for(const item of items){const s=dom('section',null,'section');s.append(dom('h2',item.title));if(item.pointer!=null){s.append(dom('span',item.pointer||'/','pointer'));render(field(item.pointer),s);}else render(item.value,s);host.append(s);}}
      function renderScope(){for(const b of $('scope-views').children)b.setAttribute('aria-pressed',String(b.dataset.view===scopeView));const host=$('scope-body');host.replaceChildren();if(scopeView==='boundary'){sections(entry.boundary,host);return;}const grid=dom('div',null,'scope-grid'),chosen=dom('section'),alternative=dom('section');sections(entry.choice,chosen);sections(entry.alternative,alternative);grid.append(chosen,alternative);host.append(grid);}
      for(const [name,title]of [['choice','Choice'],['boundary','Boundary & evidence']]){const b=dom('button',title,'plain');b.dataset.view=name;b.addEventListener('click',()=>{selectScopeView(name);$('scope').scrollTop=0;});$('scope-views').append(b);}
      sections(entry.review,$('review-body'));
      function selectObject(i){state.object=i;const node=entry.nodes[i];$('object-heading').textContent=node.label.replaceAll('|',' ');$('object-pointer').textContent=node.pointer;$('object-content').replaceChildren();render(field(node.pointer),$('object-content'));for(const [j,g]of [...$('graphic').querySelectorAll('.entity')].entries())g.setAttribute('aria-pressed',String(j===i));for(const [j,b]of [...$('type-picks').children].entries())b.setAttribute('aria-pressed',String(j===i));for(const b of $('relations').children)b.setAttribute('aria-pressed','false');}
      let currentSvg;
      function diagram(){
        const width=Math.max(280,$('graphic').clientWidth), half=Math.min(115,width*.23), gap=100, height=70+gap*Math.ceil(entry.nodes.length/2), positions={};
        for(const [i,node]of entry.nodes.entries())positions[node.key]=[width*(i%2?.75:.25),45+Math.floor(i/2)*gap];
        const graph=svg('svg',{viewBox:`0 0 ${width} ${height}`,class:'graphic',role:'group','aria-label':'Model types and selected relationships'}),defs=svg('defs'),arrow=`arrow-${index+1}`,marker=svg('marker',{id:arrow,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z'}));defs.append(marker);graph.append(defs);
        for(const edge of entry.edges){const a=positions[edge.from],b=positions[edge.to];if(!a||!b)continue;const same=a[1]===b[1],dir=same?Math.sign(b[0]-a[0]):Math.sign(b[1]-a[1]);const d=same?`M ${a[0]+half*dir} ${a[1]} H ${b[0]-half*dir}`:`M ${a[0]} ${a[1]+23*dir} L ${b[0]} ${b[1]-23*dir}`;graph.append(svg('path',{d,'marker-end':`url(#${arrow})`}));if(edge.short)graph.append(svg('text',{x:(a[0]+b[0])/2,y:(a[1]+b[1])/2+(same?-28:0),'text-anchor':'middle',class:'edge-label'},edge.short));}
        for(const [i,node]of entry.nodes.entries()){const [x,y]=positions[node.key],g=svg('g',{class:'entity',role:'button',tabindex:0,'aria-label':'Inspect '+node.label,'aria-pressed':String(state.object===i)});g.append(svg('rect',{x:x-half,y:y-23,width:half*2,height:46,rx:2}));const lines=node.label.split('|');for(const [j,line]of lines.entries())g.append(svg('text',{x,y:y+6+(j-(lines.length-1)/2)*20,'text-anchor':'middle'},line));g.addEventListener('click',()=>selectObject(i));g.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();e.stopPropagation();selectObject(i);}});graph.append(g);}
        $('graphic').replaceChildren(graph);currentSvg=graph;
      }
      function renderModel(){$('model-grid').dataset.view=modelView;$('model-fields').setAttribute('aria-pressed',String(modelView==='fields'));$('model-map').setAttribute('aria-pressed',String(modelView==='map'));if(modelView==='map')diagram();}
      $('model-fields').addEventListener('click',()=>selectModelView('fields'));$('model-map').addEventListener('click',()=>selectModelView('map'));
      entry.nodes.forEach((node,i)=>{const b=dom('button',node.label.replaceAll('|',' '),'plain');b.addEventListener('click',()=>selectObject(i));$('type-picks').append(b);});
      $('relations').replaceChildren(...entry.relationships.map(item=>{const b=dom('button',item.title,'plain');b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{ $('object-heading').textContent=item.title;$('object-pointer').textContent=item.pointer;$('object-content').replaceChildren();render(field(item.pointer),$('object-content'));for(const g of $('graphic').querySelectorAll('.entity'))g.setAttribute('aria-pressed','false');for(const pick of $('type-picks').children)pick.setAttribute('aria-pressed','false');for(const pick of $('relations').children)pick.setAttribute('aria-pressed',String(pick===b));$('model').scrollTop=0;});return b;}));
      function renderExamples(){
        for(const b of $('example-views').children)b.setAttribute('aria-pressed',String(b.dataset.view===exampleView));
        const paired=['examples','insight'].includes(exampleView);
        $('example-picks').hidden=!paired;$('example-body').replaceChildren();
        if(!paired){sections(exampleView==='coverage'?entry.coverage:entry.challenge,$('example-body'));return;}
        const values=(exampleView==='insight'?entry.insights:entry.examples).map(item=>field(item.pointer));
        function pair(className,fill){const row=dom('div',null,'compare-pair '+className);for(let i=0;i<2;i++){const cell=dom('section');cell.dataset.selected=String(i===state.example);fill(cell,i);row.append(cell);}$('example-body').append(row);}
        pair('compare-head',(cell,i)=>cell.append(dom('h2',entry.examples[i].title)));
        function compared(items,key){if(items.every(v=>v&&typeof v==='object'&&!Array.isArray(v))){if(key)pair('compare-label',cell=>cell.append(dom('h3',label(key))));const keys=[...new Set(items.flatMap(v=>Object.keys(v)))];for(const child of keys)compared(items.map(v=>v[child]),child);}else pair('',(cell,i)=>{if(items[i]!==undefined)render(key?{[key]:items[i]}:items[i],cell);});}
        compared(values);
      }
      for(const [name,title]of [['examples','Full examples'],['insight','Insight'],['coverage','Coverage'],['challenge','Challenge']]){const b=dom('button',title,'plain');b.dataset.view=name;b.addEventListener('click',()=>{selectExampleView(name);$('examples').scrollTop=0;});$('example-views').append(b);}
      entry.examples.forEach((item,i)=>{const b=dom('button',item.title,'plain');b.setAttribute('aria-pressed',String(i===state.example));b.addEventListener('click',()=>{state.example=i;for(const [j,button]of [...$('example-picks').children].entries())button.setAttribute('aria-pressed',String(i===j));renderExamples();$('examples').scrollTop=0;remember();});$('example-picks').append(b);});
      function renderPrompt(){for(const b of $('request-views').children)b.setAttribute('aria-pressed',String(b.dataset.view===promptView));const host=$('request-body');host.replaceChildren();if(promptView==='source'){host.append(dom('pre',data.sources[entry.source].text,'request'));return;}const items=promptView==='dispatch'?entry.dispatches:entry.requests;for(const item of items){const s=dom('section',null,'section');s.append(dom('h2',item.title),dom('pre',item.text,'request'));host.append(s);}}
      for(const [name,title]of [['prompt','Exact prompt'],['source','Source'],['dispatch','Dispatch']]){const b=dom('button',title,'plain');b.dataset.view=name;b.addEventListener('click',()=>{selectPromptView(name);$('request').scrollTop=0;});$('request-views').append(b);}
      $('json-name').textContent=entry.key+'.json';$('json-text').textContent=entry.result_text;
      function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=dom('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
      $('download-json').addEventListener('click',()=>download(entry.result_text,entry.key+'.json','application/json'));
      $('download-svg').addEventListener('click',()=>{const copy=currentSvg.cloneNode(true);copy.setAttribute('xmlns',svgNS);copy.prepend(svg('style',{},document.querySelector('style').textContent));download(new XMLSerializer().serializeToString(copy),entry.key+'.svg','image/svg+xml');});
      function applyTab(){for(const name of tabs)$(name).hidden=name!==tab;if(tab==='model')renderModel();}
      let lastWidth;const resize=new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(width>0&&width!==lastWidth){lastWidth=width;diagram();}});
      diagram();selectObject(state.object);renderScope();renderExamples();renderPrompt();applyTab();resize.observe($('graphic'));
      views.set(index,{root,applyTab,renderScope,renderModel,renderExamples,renderPrompt,dispose:()=>resize.disconnect()});
    }
    function slideChanged(i){if(!handle)return;active=i;handle.setTitle(data.cases[i].label);handle.setSubtitle(data.cases[i].subtitle);for(const name of tabs)document.getElementById('tab-'+name).setAttribute('aria-controls',`map-${i+1}-${name}`);for(const [j,slide]of [...handle.deck.track.children].entries()){slide.inert=j!==i;slide.setAttribute('aria-hidden',String(j!==i));}remember();}
    function openDeck(){if(handle)return;document.querySelector('.landing').inert=true;handle=swipeDeck.open({count:data.cases.length,render:mount,start:active,keep:data.cases.length,slideScroll:false,innerClass:'model-page',snapStop:true,behavior:'instant',title:data.cases[active].label,subtitle:data.cases[active].subtitle,icon:'ph-cards',subheader:tabBar,index:i=>({title:data.cases[i].label,group:data.cases[i].source}),onSlide:slideChanged,release:i=>{views.get(i)?.dispose();views.delete(i);},onClose:()=>{releaseKeys();handle=null;document.querySelector('.landing').inert=false;document.getElementById('open-deck').focus();}});const offDeck=swipeDeck.keys(handle.el,d=>handle.deck.go(handle.deck.active()+d),()=>data.cases.length),offTabs=swipeDeck.keys(tabBar,d=>selectTab(tabs[(tabs.indexOf(tab)+d+tabs.length)%tabs.length],true),()=>tabs.length);releaseKeys=()=>{offTabs();offDeck();};slideChanged(active);selectTab(tab);}
    document.getElementById('open-deck').addEventListener('click',openDeck);
    let dock;const resizeDock=new ResizeObserver(()=>{const height=dock?.getBoundingClientRect().height||0;document.documentElement.style.setProperty('--deck-bottom',`${height?Math.ceil(height)+24:0}px`);});const reserve=()=>{const next=document.querySelector('[role=region][aria-label="Look marker"]');if(next===dock)return;resizeDock.disconnect();dock=next;if(dock)resizeDock.observe(dock);else document.documentElement.style.setProperty('--deck-bottom','0px');};new MutationObserver(reserve).observe(document.documentElement,{childList:true});
    openDeck();
  })();
  </script>
