        ['Flight patterns', 'Follow the Potomac or Anacostia rivers, due to noise regulations'],
        ['Runway 33 approach aid', 'Four-light precision approach path indicator (PAPI) giving a 3° visual approach path to the touchdown zone; operational at the time']
      ]},
      { h: 'Runways (three operational)', kind: 'table', cols: ['Runway', 'Length × width', 'Use', 'End', 'Arrivals, 2018 to 2024', 'Departures, 2018 to 2024'], rows: [
        ['1/19', '7,169 × 150 ft', 'Most commonly used', '1', 'About 57%', ''],
        ['', '', '', '19', 'About 38%', ''],
        ['15/33', '5,204 × 150 ft', 'Second most commonly used', '33', 'About 4%', ''],
        ['', '', '', '15', 'Less than 1%', 'About 5%']
      ]}
    ]},
    tcas: { title: 'TCAS', sub: 'Traffic alert and collision avoidance system', blocks: [
      { kind: 'facts', items: [
        ['On descent, below 900 ft above ground', 'Resolution advisories are inhibited. A traffic advisory is issued when the intruder is about 20 s from the closest point of approach, or 0.3 nm, whichever comes first.'],
        ['On arrival, below 400 ft above ground', 'The traffic advisory’s aural annunciation is inhibited'],
        ['Advisories', 'Traffic advisories (TAs), and resolution advisories (RAs): recommended vertical escape maneuvers that increase or maintain vertical separation'],
        ['Voice', 'TA: “TRAFFIC - TRAFFIC.” RA examples: “CLIMB, CLIMB,” “DESCEND, DESCEND,” “LEVEL OFF, LEVEL OFF.”'],
        ['What it is', 'A family of airborne devices working independently of ground-based ATC, giving collision avoidance protection across many aircraft types; all give some collision threat alerting and a traffic display'],
        ['How, per the CRJ manual', 'The transceiver interrogates other aircraft’s transponders and processes the replies into range, azimuth and altitude; it gives a visual display and aural warnings when it predicts a conflict'],
        ['Required', 'TCAS II is mandated by the FAA for commercial aircraft, including regional airline aircraft with more than 30 seats or a maximum takeoff weight over 33,000 lb']
      ], basis: 'FAA publication “Introduction to TCAS II Version 7.1”; MHI RJ Flight Crew Operating Manual.' }
    ]},
    adsb: { title: 'ADS-B', sub: 'Automatic dependent surveillance-broadcast', blocks: [
      { kind: 'facts', items: [
        ['Purpose', 'Gives air traffic controllers and pilots accurate information to help keep aircraft safely separated in the sky and on runways'],
        ['How', 'Aircraft transceivers determine precise position from GPS satellite signals, combine it with other data, and broadcast it to other aircraft and ATC facilities']
      ], basis: 'the FAA, as cited in the report.' }
    ]}
  }
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
/* [[id|label]] is a reference label; {{words}} marks words PAT25 may not have received. */
function rich(s) {
  if (!s) return '';
  const re = /\[\[([a-z0-9:]+)\|([^\]]+)\]\]|\{\{([^}]+)\}\}/g;
  let out = '', last = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    out += m[1]
      ? '<button type="button" data-ref="' + esc(m[1]) + '" class="link inline text-left">' + esc(m[2]) + '</button>'
      : '<mark class="bg-warning/40 text-base-content rounded-sm px-0.5">' + esc(m[3]) + '</mark>';
    last = re.lastIndex;
  }
  return out + esc(s.slice(last));
}
function sepRow(i) { return i ? ' border-t border-base-200' : ''; }
function blockHTML(b) {
  let body = '';
  if (b.kind === 'facts') {
    body = b.items.map((it, i) => '<div class="grid grid-cols-1 sm:grid-cols-[minmax(0,11rem)_minmax(0,1fr)] gap-x-4 py-2' + sepRow(i) + '"><div class="text-xs text-base-content/60 sm:pt-1">' + esc(it[0]) + '</div><div class="min-w-0 text-pretty">' + rich(it[1]) + '</div></div>').join('');
  } else if (b.kind === 'list') {
    body = '<ul class="list-disc pl-5 space-y-1">' + b.items.map(x => '<li class="text-pretty">' + rich(x) + '</li>').join('') + '</ul>';
  } else if (b.kind === 'seq') {
    body = b.items.map((it, i) => '<div class="grid grid-cols-[6rem_minmax(0,1fr)] gap-x-4 py-2' + sepRow(i) + '"><div class="font-mono text-xs pt-1">' + esc(it[0]) + '</div><div class="min-w-0 text-pretty">' + rich(it[1]) + '</div></div>').join('');
  } else if (b.kind === 'table') {
    body = '<div class="overflow-x-auto"><table class="table text-base' + (b.cols.length > 3 ? ' min-w-[40rem]' : '') + '"><thead><tr>' + b.cols.map(c => '<th class="text-xs font-normal text-base-content/60">' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
      b.rows.map(r => '<tr>' + r.map(c => '<td class="align-top">' + rich(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  } else if (b.kind === 'route') {
    body = b.items.map((it, i) => '<div class="grid grid-cols-[minmax(0,1fr)_auto] gap-x-4 py-2' + sepRow(i) + '"><div class="min-w-0"><div class="text-xs text-base-content/60">' + esc(it.r) + '</div><div class="font-semibold">' + esc(it.at) + '</div><div class="text-pretty">' + esc(it.n) + '</div></div><div class="font-semibold text-right pt-4">' + esc(it.max || '') + '</div></div>').join('');
  }
  return '<section class="min-w-0' + (b.wide ? ' xl:col-span-2' : '') + '">' +
    (b.h ? '<h2 class="font-semibold text-balance mb-1">' + esc(b.h) + '</h2>' : '') +
    (b.lead ? '<p class="text-pretty mb-1">' + rich(b.lead) + '</p>' : '') + body +
    (b.basis ? '<p class="mt-2 text-xs text-base-content/60">Basis: ' + esc(b.basis) + '</p>' : '') + '</section>';
}
function blocksHTML(blocks) { return (blocks || []).map(blockHTML).join(''); }

function secs(t) { const p = t.split(':').map(Number); return p[0] * 3600 + p[1] * 60 + (p[2] || 0); }

function page() {
  return {
    M: MODEL,
    tab: 'timeline',
    refId: null,
    pendingTab: null,
    tabs: [['timeline', 'Timeline'], ['aircraft', 'Aircraft'], ['encounters', 'Encounters at DCA'], ['response', 'Response'], ['investigation', 'Investigation']],
    init() {
      const h = location.hash.slice(1);
      if (this.tabs.some(t => t[0] === h)) this.tab = h;
      window.addEventListener('popstate', () => {
        const d = this.$refs.dlg;
        if (d.open) d.close();
        if (this.pendingTab) { const t = this.pendingTab; this.pendingTab = null; this.setTab(t); }
      });
    },
    setTab(t) {
      this.tab = t;
      history.replaceState(history.state, '', '#' + t);
      window.scrollTo(0, 0);
    },
    moveTab(step) {
      const i = this.tabs.findIndex(t => t[0] === this.tab);
      const n = this.tabs[(i + step + this.tabs.length) % this.tabs.length][0];
      this.setTab(n);
      this.$nextTick(() => { const b = document.getElementById('tab-' + n); if (b) b.focus(); });
    },
    onClick(ev) {
      const el = ev.target.closest('[data-ref]');
      if (!el) return;
      ev.preventDefault();
      const r = el.dataset.ref;
      if (r.startsWith('tab:')) {
        const d = this.$refs.dlg;
        if (d.open && history.state && history.state.ref) { this.pendingTab = r.slice(4); history.back(); }
        else { if (d.open) d.close(); this.setTab(r.slice(4)); }
      } else this.openRef(r);
    },
    openRef(id) {
      if (!this.M.refs[id]) return;
      this.refId = id;
      const d = this.$refs.dlg;
      if (!d.open) { d.showModal(); history.pushState({ ref: id }, ''); }
      this.$nextTick(() => { const box = d.querySelector('.modal-box'); if (box) box.scrollTop = 0; });
    },
    onDlgClose() {
      if (history.state && history.state.ref && !this.pendingTab) history.back();
    },
    get view() {
      const r = this.M.refs[this.refId];
      return r ? { title: r.title, sub: r.sub, html: blocksHTML(r.blocks) } : { title: '', sub: '', html: '' };
    },
    lane(k) { return this.M.lanes[k]; },
    timeLabel(e) { return e.disp || ((e.approx ? '~' : '') + (e.t.endsWith(':00') && e.approx ? e.t.slice(0, 5) : e.t)); },
    gap(i) { return i ? secs(this.M.timeline[i].t) - secs(this.M.timeline[i - 1].t) : 0; },
    gapPx(i) { const g = this.gap(i); return g > 60 ? 0 : Math.round(4 + g * 1.5); },
    gapLabel(i) {
      const g = this.gap(i);
      if (g <= 60) return '';
      const m = Math.floor(g / 60), s = g % 60;
      if (g < 600) return '+' + m + ' min' + (s ? ' ' + s + ' s' : '');
      return '+' + Math.round(g / 60) + ' min';
    },
    rowCls(r, i) {
      return 'grid gap-x-4 py-2 ' + (r.long ? 'grid-cols-1' : 'grid-cols-2') + ' md:grid-cols-[11rem_minmax(0,1fr)_minmax(0,1fr)]' + (i ? ' border-t border-base-200' : '');
    },
    rich, blocksHTML
  };
}
</script>
<script defer src="https://unpkg.com/alpinejs"></script>
</head>
<body class="min-h-dvh bg-base-100 text-base-content" x-data="page()" @click="onClick($event)">

<header class="px-4 pt-4 pb-2">
  <h1 class="text-xl font-semibold text-balance" x-text="M.accident.title"></h1>
  <p class="text-xs text-base-content/70 mt-1 text-balance">
    <span x-text="M.accident.line"></span> ·
    <a class="link" :href="M.accident.source" target="_blank" rel="noopener">NTSB report ↗</a>
  </p>
</header>

<nav class="sticky top-0 z-20 bg-base-100 border-b border-base-300">
  <div role="tablist" class="tabs tabs-border flex-nowrap overflow-x-auto px-2" @keydown.arrow-right.prevent="moveTab(1)" @keydown.arrow-left.prevent="moveTab(-1)">
    <template x-for="t in tabs" :key="t[0]">
      <button type="button" role="tab" class="tab whitespace-nowrap" :id="'tab-' + t[0]" :class="tab === t[0] ? 'tab-active' : ''" :aria-selected="tab === t[0] ? 'true' : 'false'" :tabindex="tab === t[0] ? 0 : -1" @click="setTab(t[0])" x-text="t[1]"></button>
    </template>
  </div>
  <div x-show="tab === 'timeline'" class="grid grid-cols-3 md:grid-cols-[5rem_repeat(3,minmax(0,1fr))] gap-x-3 md:gap-x-4 px-4 py-2 border-t border-base-200">
    <div class="hidden md:block font-mono text-xs text-base-content/60 pt-1">EST</div>
    <template x-for="k in ['crj','twr','pat']" :key="k">
      <button type="button" class="text-left min-w-0" :data-ref="lane(k).ref">
        <span class="badge badge-sm" :class="lane(k).badge" x-text="lane(k).tag"></span>
        <span class="link font-semibold hidden md:inline ml-1" x-text="lane(k).name"></span>
        <span class="hidden md:block text-xs text-base-content/70" x-text="lane(k).sub"></span>
      </button>
    </template>
  </div>
</nav>

<main class="px-4 py-4">

  <!-- Timeline: the answer -->
  <section x-show="tab === 'timeline'">
    <p class="text-pretty" x-html="rich(M.accident.lede)"></p>
    <p class="text-xs text-base-content/60 mt-2">Basis: <span x-text="M.accident.basis"></span></p>

    <div class="mt-4">
      <template x-for="(e, i) in M.timeline" :key="i">
        <div>
          <template x-if="gapLabel(i)">
            <div class="grid grid-cols-[4rem_minmax(0,1fr)] md:grid-cols-[5rem_minmax(0,1fr)] gap-x-3 md:gap-x-4 items-center my-3">
              <div class="font-mono text-xs text-base-content/60" x-text="gapLabel(i)"></div>
              <div class="border-t border-dashed border-base-300"></div>
            </div>
          </template>
          <div class="grid grid-cols-[4rem_minmax(0,1fr)] md:grid-cols-[5rem_repeat(3,minmax(0,1fr))] gap-x-3 md:gap-x-4" :style="'margin-top:' + gapPx(i) + 'px'">
            <div class="pt-2 font-mono text-xs leading-5">
              <div x-text="timeLabel(e)"></div>
              <template x-if="e.tm"><div class="font-semibold" x-text="'T−' + e.tm + ' s'"></div></template>
            </div>
            <div class="col-start-2 min-w-0 rounded-lg px-3 py-2 text-pretty" :class="lane(e.lane).col + ' ' + lane(e.lane).box">
              <span class="badge badge-sm md:hidden mr-1 align-middle" :class="lane(e.lane).badge" x-text="lane(e.lane).tag"></span>
              <template x-if="e.sep"><span class="font-semibold" x-text="e.sep + '. '"></span></template>
              <span x-html="rich(e.x)"></span>
            </div>
          </div>
        </div>
      </template>

      <div class="grid grid-cols-[4rem_minmax(0,1fr)] md:grid-cols-[5rem_repeat(3,minmax(0,1fr))] gap-x-3 md:gap-x-4 gap-y-2 mt-3">
        <div class="pt-2 font-mono text-xs" x-text="M.collision.t"></div>
        <div class="col-start-2 md:col-span-3 rounded-lg bg-base-content text-base-100 px-3 py-2 font-semibold text-balance" x-text="M.collision.x"></div>
        <div class="col-start-2 md:col-start-2 min-w-0 rounded-lg px-3 py-2 text-pretty" :class="lane('crj').box">
          <span class="badge badge-sm md:hidden mr-1 align-middle" :class="lane('crj').badge" x-text="lane('crj').tag"></span>
          <span x-text="M.collision.crj"></span>
        </div>
        <div class="col-start-2 md:col-start-4 min-w-0 rounded-lg px-3 py-2 text-pretty" :class="lane('pat').box">
          <span class="badge badge-sm md:hidden mr-1 align-middle" :class="lane('pat').badge" x-text="lane('pat').tag"></span>
          <span x-text="M.collision.pat"></span>
        </div>
      </div>

      <div class="grid grid-cols-[4rem_minmax(0,1fr)] md:grid-cols-[5rem_minmax(0,1fr)] gap-x-3 md:gap-x-4 mt-6">
        <div class="text-xs text-base-content/60 pt-1">Weather</div>
        <div class="text-pretty" x-text="M.accident.weather"></div>
      </div>
      <div class="grid grid-cols-[4rem_minmax(0,1fr)] md:grid-cols-[5rem_minmax(0,1fr)] gap-x-3 md:gap-x-4 mt-4">
        <div></div>
        <div><button type="button" class="link" data-ref="tab:response">Emergency response from 20:48 →</button></div>
      </div>
    </div>
  </section>

  <!-- Aircraft: the pair compared -->
  <section x-show="tab === 'aircraft'">
    <div class="grid grid-cols-2 md:grid-cols-[11rem_minmax(0,1fr)_minmax(0,1fr)] gap-x-4 pb-2 border-b border-base-300">
      <div class="hidden md:block"></div>
      <template x-for="k in ['crj','pat']" :key="k">
        <div class="min-w-0">
          <span class="badge badge-sm" :class="lane(k).badge" x-text="lane(k).tag"></span>
          <div class="font-semibold" x-text="lane(k).name"></div>
          <div class="text-xs text-base-content/70" x-text="lane(k).sub"></div>
        </div>
      </template>
    </div>

    <template x-for="s in M.compare" :key="s.h">
      <div class="mt-6">
        <h2 class="font-semibold" x-text="s.h"></h2>

        <template x-if="s.rows">
          <div>
            <template x-for="(r, i) in s.rows" :key="r.f">
              <div :class="rowCls(r, i)">
                <div class="text-xs text-base-content/60 md:pt-1" :class="r.long ? '' : 'col-span-2 md:col-span-1'" x-text="r.f"></div>
                <div class="min-w-0 text-pretty" :class="r.am ? 'text-base-content/50' : ''">
                  <span x-show="r.long" class="badge badge-sm md:hidden mr-1 align-middle" :class="lane('crj').badge">5342</span><span x-html="rich(r.a)"></span>
                </div>
                <div class="min-w-0 text-pretty">
                  <span x-show="r.long" class="badge badge-sm md:hidden mr-1 align-middle" :class="lane('pat').badge">PAT25</span><span x-html="rich(r.b)"></span>
                </div>
              </div>
            </template>
          </div>
        </template>

        <template x-if="s.crew">
          <div class="overflow-x-auto">
            <table class="table text-base min-w-[56rem]">
              <thead><tr><template x-for="c in M.crew.cols" :key="c"><th class="text-xs font-normal text-base-content/60" x-text="c"></th></template></tr></thead>
              <tbody>
                <template x-for="(r, i) in M.crew.rows" :key="i">
                  <tr>
                    <td class="align-top"><span class="badge badge-sm" :class="lane(r[0]).badge" x-text="lane(r[0]).tag"></span></td>
                    <template x-for="(c, j) in r.slice(1)" :key="j"><td class="align-top" :class="j === 3 || j === 4 ? 'text-right tabular-nums' : ''" x-text="c"></td></template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

        <template x-if="s.parts">
          <div>
            <div class="grid grid-cols-1 md:grid-cols-[11rem_minmax(0,1fr)_minmax(0,1fr)] gap-x-4 gap-y-3 py-2 border-t border-base-200">
              <div class="text-xs text-base-content/60 md:pt-1">Components</div>
              <template x-for="k in ['crj','pat']" :key="k">
                <div class="min-w-0">
                  <span class="badge badge-sm md:hidden mb-1" :class="lane(k).badge" x-text="lane(k).tag"></span>
                  <template x-for="c in M.parts[k]" :key="c.h">
                    <details class="border-b border-base-200 py-1">
                      <summary class="cursor-pointer font-medium py-1" x-text="c.h"></summary>
                      <ul class="list-disc pl-5 pb-2 space-y-1">
                        <template x-for="(it, j) in c.items" :key="j"><li class="text-pretty" x-text="it"></li></template>
                      </ul>
                    </details>
                  </template>
                </div>
              </template>
            </div>
            <template x-for="(r, i) in s.after" :key="r.f">
              <div :class="rowCls(r, 1)">
                <div class="text-xs text-base-content/60 md:pt-1" x-text="r.f"></div>
                <div class="min-w-0 text-pretty"><span class="badge badge-sm md:hidden mr-1 align-middle" :class="lane('crj').badge">5342</span><span x-text="r.a"></span></div>
                <div class="min-w-0 text-pretty"><span class="badge badge-sm md:hidden mr-1 align-middle" :class="lane('pat').badge">PAT25</span><span x-text="r.b"></span></div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </section>

  <!-- Encounters, Response, Investigation: parts of the accident -->
  <template x-for="k in ['encounters','response','investigation']" :key="k">
    <section x-show="tab === k" class="grid gap-8 xl:grid-cols-2" x-html="blocksHTML(M.tabs[k])"></section>
  </template>
</main>

<dialog x-ref="dlg" class="modal" @close="onDlgClose()">
  <div class="modal-box w-11/12 max-w-3xl p-0">
    <div class="sticky top-0 z-10 bg-base-100 border-b border-base-300 px-4 py-3 flex items-start gap-3">
      <div class="min-w-0 flex-1">
        <h2 class="text-lg font-semibold text-balance" x-text="view.title"></h2>
        <p class="text-xs text-base-content/70" x-text="view.sub"></p>
      </div>
      <form method="dialog"><button class="btn btn-sm btn-ghost btn-square" aria-label="Close">✕</button></form>
    </div>
    <div class="px-4 py-4 space-y-6" x-html="view.html"></div>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Close">close</button></form>
</dialog>

</body>
</html>
