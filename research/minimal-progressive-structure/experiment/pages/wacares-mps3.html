<script>
/* The page's data: the entity model from wacares-mps3.model.md.
   src values are article paragraph indexes (0 = the dek). */
const MODEL = {
  article: {
    headline: "Voters to decide if WA Cares tax dollars can be invested in stock market",
    author: "Jerry Cornfield",
    outlet: "Washington State Standard",
    date: "October 31, 2025",
    url: "https://washingtonstatestandard.com/2025/10/31/voters-to-decide-if-wa-cares-tax-dollars-can-be-invested-in-stock-market/",
    license: "CC BY-NC-ND 4.0",
    p: [
      "A proposed constitutional amendment would let assets be managed like the state’s pension funds. A similar attempt failed in 2020.",
      "The first item on every Washington voter’s ballot is a proposal to add a few lines to the state constitution that would change how billions of taxpayer dollars are managed.",
      "Senate Joint Resolution 8201 seeks to let the state make stock market investments with payroll taxes collected for its long-term care program, known as WA Cares. Any earnings would have to be used solely for the program’s beneficiaries.",
      "If approved Tuesday, the Washington State Investment Board would be legally able to handle the program’s assets in a similar manner as it does pension and retirement funds.",
      "This will allow for the tax dollars to be invested in a “safe and risk averse way” while producing greater returns for the program, said Heather Weiner of the Approve 8201 campaign in a recent debate at the University of Washington.",
      "She said that since 1992, annual returns for Washington’s pension funds have averaged 8.9%, which is several percentage points higher than investments in government bonds. In the long run that would translate to a lot more dollars for the program.",
      "“This doesn’t mean day trading, taking big risks on a stock market,” she said. “This means smart long-term [investing] so that in 50 years when people in this audience today will need long term care, that fund will be there for you.”",
      "State Sen. Bob Hasegawa, D-Tukwila, opposes the measure.",
      "“Our fiduciary responsibility is to the people,” he told the debate audience. “No one is going to know when the economy or stock market crashes. So, this vote is about whether we keep prudent fiscal management policies of our tax dollars and retain those constitutional protections.”",
      "The Legislature voted earlier this year to put the constitutional amendment on the ballot. It passed by margins of 86-9 in the House and 42-7 in the Senate and will become law if more than 50% of voters approve it on Tuesday.",
      "WA Cares, created by a 2019 law, is funded with a 0.58% tax on the paychecks of most workers in Washington. Beginning in July 2026, those who qualify can begin accessing the benefit, a lifetime amount of $36,500 — a sum that is set to rise in future years to account for inflation. A pilot program will start in January in a handful of counties.",
      "Collections of the payroll tax began in mid-2023 and more than $2.5 billion was banked in the Long Term Services and Supports Trust Account as of summer.",
      "The state constitution generally bars investing public money in the stock of private companies. That means state and local governments are limited to fixed-income securities like government bonds, treasury bills and certificates of deposit that are less risky but typically deliver lower rates of return. The WA Cares account is now subject to this limitation.",
      "If the constitutional amendment is approved, the long-term service account would be added to the list of funds exempt from that prohibition alongside the state’s pension and retirement funds. The state investment board could then decide if it wants to invest in private equity funds and buy stock of private companies, or not.",
      "In 2020, voters defeated a similar measure. It passed in only three Washington counties — King, Jefferson and Whatcom.",
      "Weiner said this year’s proposal, unlike the one in 2020, mandates money made from investments must go into the WA Cares Fund. The intent is to prevent lawmakers from tapping those dollars for other budget needs.",
      "Democratic Gov. Bob Ferguson and Senate Minority Leader John Braun, R-Centralia, back the ballot measure. So too do the Washington State Nurses Association, Washington State Council of Fire Fighters, AARP, and Washington Health Care Association.",
      "Service Employees International Union 775 is underwriting the campaign. The union, which represents 55,000 long-term care workers in Washington, Montana and Alaska, had reported raising and spending $2.5 million as of Friday. That is five times more than it spent in a losing effort in 2020.",
      "Hasegawa said there is no funded opposition campaign, just like the last ballot fight. He and three Republican state lawmakers penned the voters’ pamphlet statement opposing the measure.",
      "Statements from both sides, along with an explanation of the measure prepared by the attorney general’s office, can be found on the secretary of state website."
]
  },

  // Root: the measure
  measure: {
    label: "SJR 8201",
    name: "Senate Joint Resolution 8201",
    question: "What am I deciding when I vote on SJR 8201?",
    answer: { text: "A yes vote would let the state invest the payroll taxes collected for WA Cares in the stock market, changing how billions of taxpayer dollars are managed.", src: [1, 2] },
    earnings: { text: "Any earnings would have to be used solely for the program's beneficiaries.", src: [2] },
    ballot: [
      { field: "What it is", text: "A proposal to add a few lines to the state constitution", src: [0, 1] },
      { field: "Where", text: "The first item on every Washington voter's ballot", src: [1] },
      { field: "When", text: "Tuesday. The report is dated Friday, October 31, 2025.", src: [3, 9] },
      { field: "To pass", text: "More than 50% of voters must approve it", src: [9] },
      { field: "How it got here", text: "The Legislature voted earlier this year to put it on the ballot.", votes: [ { chamber: "House", yes: 86, no: 9 }, { chamber: "Senate", yes: 42, no: 7 } ], src: [9] }
    ],
    prior: { field: "Earlier attempt", text: "In 2020, voters defeated a similar measure. It passed in only three counties: King, Jefferson and Whatcom.", src: [0, 14] },
    official: { field: "Official voter materials", text: "Statements from both sides, along with an explanation of the measure prepared by the attorney general's office, are on the secretary of state website.", src: [19] }
  },

  // Comparison: the rules for the money, today and if approved
  regimes: {
    fields: [ { key: "status", label: "In the constitution" }, { key: "holdings", label: "What the money can be invested in" } ],
    members: [
      { id: "today", label: "Today",
        status: { text: "The state constitution generally bars investing public money in the stock of private companies. The WA Cares account is now subject to this limitation.", src: [12] },
        holdings: { text: "Fixed-income securities, such as government bonds, treasury bills and certificates of deposit: less risky, but typically lower returns.", src: [12] } },
      { id: "approved", label: "If approved",
        status: { text: "The long-term service account joins the list of funds exempt from that prohibition, alongside the state's pension and retirement funds.", src: [13] },
        holdings: { text: "The Washington State Investment Board could handle the program's assets as it does pension and retirement funds, and could decide whether to invest in private equity funds and buy stock of private companies, or not.", src: [3, 13] } }
    ]
  },

  // Reference: the program whose money is at stake
  wacares: {
    label: "WA Cares",
    qualifier: "The state's long-term care program",
    labelFact: "More than $2.5 billion banked as of summer",
    fields: [
      { field: "Paid for by", text: "A 0.58% tax on the paychecks of most workers in Washington", src: [10] },
      { field: "Benefit", text: "A lifetime amount of $36,500, set to rise in future years to account for inflation", src: [10] }
    ],
    timeline: [
      { when: "2019", text: "A state law creates WA Cares.", src: [10] },
      { when: "Mid-2023", text: "Collection of the payroll tax begins.", src: [11] },
      { when: "As of summer", text: "More than $2.5 billion is banked in the Long Term Services and Supports Trust Account.", src: [11] },
      { when: "Oct. 31, 2025", text: "Date of the report", marker: true },
      { when: "January", text: "A pilot program starts in a handful of counties.", src: [10] },
      { when: "July 2026", text: "Those who qualify can begin accessing the benefit.", src: [10] }
    ]
  },

  // Comparison: the two sides
  sides: {
    rowFields: [ { key: "voice", label: "Making the case at a recent University of Washington debate" }, { key: "gist", label: "In short" }, { key: "money", label: "Campaign money" } ],
    members: [
      { id: "for", label: "For", sub: "Approve 8201, a yes vote", tone: "primary",
        voice: { text: "Heather Weiner, of the Approve 8201 campaign", src: [4] },
        gist: { text: "Safe, long-term investing would earn the program more." },
        money: { text: "SEIU 775 is underwriting the campaign. As of Friday it had raised and spent $2.5 million, five times what it spent in a losing effort in 2020. The union represents 55,000 long-term care workers in Washington, Montana and Alaska.", src: [17] },
        claims: [
          { text: "The tax dollars would be invested in a “safe and risk averse way” while producing greater returns for the program.", ev: { label: "Her words", src: [4, 6] } },
          { text: "Since 1992, annual returns for Washington's pension funds have averaged 8.9%, several percentage points higher than government bonds. In the long run that would mean a lot more dollars for the program.", ev: { label: "As the article reports it", src: [5] } },
          { text: "Unlike the 2020 measure, this year's requires that money made from investments go into the WA Cares Fund. The intent is to keep lawmakers from tapping those dollars for other budget needs.", ev: { label: "As the article reports it", src: [15] } }
        ],
        allies: { list: [
          { name: "Bob Ferguson", role: "Democratic governor" },
          { name: "John Braun", role: "Senate Minority Leader, R-Centralia" },
          { name: "Washington State Nurses Association" },
          { name: "Washington State Council of Fire Fighters" },
          { name: "AARP" },
          { name: "Washington Health Care Association" }
        ], src: [16] } },
      { id: "against", label: "Against", sub: "A no vote", tone: "secondary",
        voice: { text: "State Sen. Bob Hasegawa, D-Tukwila", src: [7, 8] },
        gist: { text: "No one can know when the market will crash; keep the constitution's protections." },
        money: { text: "There is no funded opposition campaign, just like the last ballot fight in 2020, Hasegawa says.", src: [18] },
        claims: [
          { text: "The state's fiduciary responsibility is to the people, and no one can know when the economy or the stock market will crash. The vote is about keeping prudent fiscal management of tax dollars and retaining the constitution's protections.", ev: { label: "His words", src: [8] } }
        ],
        allies: { text: "Hasegawa and three Republican state lawmakers wrote the voters' pamphlet statement opposing the measure.", src: [18] } }
    ]
  }
};

// Sources per view, collected from the facts that view holds.
function collect(...items) {
  const s = new Set();
  items.flat().forEach(it => (it && it.src || []).forEach(i => s.add(i)));
  return [...s].sort((a, b) => a - b);
}
const M = MODEL;
const SOURCES = {
  answer: collect(M.measure.answer, M.measure.earnings),
  change: collect(...M.regimes.members.flatMap(r => M.regimes.fields.map(f => r[f.key]))),
  ballot: collect(M.measure.ballot),
  sides: collect(...M.sides.members.flatMap(s => [s.voice, s.money, s.allies])),
  background: collect(M.measure.prior, M.measure.official),
  wacares: collect({ src: [2] }, M.wacares.fields, M.wacares.timeline)
};

function page() {
  return {
    m: MODEL, S: SOURCES, full: false,
    para(i) { return MODEL.article.p[i]; },
    openWaCares() { this.$refs.wac.showModal(); }
  };
}
