 "paras": {
  "0": "With candidate filing closed, here’s an early look at some of the districts that might flip and where progressives are challenging other Democrats from the left.",
  "1": "This is the first of two installments providing an initial look at this year’s legislative races.",
  "2": "With Friday’s 5 p.m. candidate filing deadline, the field is coming into focus for the 2026 Washington state primaries.",
  "3": "This year’s midterms are significant for state government, as all 98 seats in the state House and 24 of 49 state Senate seats are up for grabs. Progressives are trying to unseat more moderate Democrats. Other Democrats are trying to wrest positions from Republican hands to increase their majorities. And Republicans are trying to claw back any seats that they can.",
  "4": "Meanwhile, many new faces will arrive in Olympia next January with a slew of retirements.",
  "5": "Democrats currently hold a 59-39 majority in the state House and 30-19 in the Senate.",
  "6": "Across the state, over 1,000 candidates are running for 600-plus federal, state and local offices.",
  "7": "This year’s primary is Aug. 4, with the top two candidates advancing to the general election. Election Day is Nov. 3. Here’s a look at some of the notable legislative races taking shape.",
  "9": "The retirement of Rep. Timm Ormsby, the chief budget writer in the state House, opens up a vacancy to represent Spokane in Olympia. The district is reliably Democratic. Ormsby won in 2024 unopposed.",
  "10": "Three Democrats are running to replace him. Luc Jasmin III, who has done regional outreach in eastern Washington for Govs. Bob Ferguson and Jay Inslee, has the support of Ormsby’s seatmate, Rep. Natasha Hill, D-Spokane, and former Senate Majority Leader Andy Billig. Jasmin created a statewide organization advocating for early learning centers and chaired Spokane’s police oversight office.",
  "11": "Physician Pam Kohlmeier brings a focus on expanding access to healthcare, specifically behavioral health and addiction services.",
  "12": "Donovan Arnold DeLeon also filed to run as a Democrat.",
  "13": "Natalie Poulson is the Republican candidate. She ran against Ormsby in 2022.",
  "15": "State Rep. Zach Hall, D-Issaquah, was appointed to a 5th District House seat last June. The district, which includes parts of Issaquah, Black Diamond, Covington, and part of Snoqualmie, is one that Republicans have eyed as territory where they might make gains in recent years, but Democrats currently hold all three legislative seats there.",
  "16": "Hall replaced now-Sen. Victoria Hunt, who moved to represent the district in the Senate after Sen. Bill Ramos died unexpectedly at the end of the 2025 session. Because Hall was appointed after last year’s candidate filing deadline, he didn’t have to run in 2025. He served six years on the Issaquah City Council and also chaired the Eastside Fire and Rescue Board of Directors.",
  "17": "He faces competition from Michelle Bennett, a Republican with a long career in law enforcement. Bennett is currently Mercer Island’s police chief and has worked in various law enforcement roles in western Washington dating back to 1990. Bennett is highlighting opposition to an income tax as one of her top priorities. (Hall voted this year for the new income tax on millionaire earners.)",
  "18": "There’s also a progressive challenger in the race. Aimee Warmerdam, a Democrat, backs policies such as universal health care, a $26 minimum wage, reducing the standard workweek to 32 hours and imposing a new payroll tax on large companies.",
  "19": "A fourth candidate, Topher Leritz, who does not have any party affiliation, also filed Friday to run for the seat.",
  "21": "Rep. David Hackney, D-Renton, was first elected to represent the 11th District in 2020. This year, he’s drawn a challenger from within his own party.",
  "22": "Democrat Ashley Fedan is a nurse and Navy veteran who started a business as a certified registered nurse anesthetist. She’s also active in the Democratic Party’s grassroots, serving as a precinct committee officer in the 11th District and previously as chair of the 28th District Democrats. The 11th covers Tukwila, Renton and parts of Kent.",
  "23": "Hackney, an attorney, is vice chair of the Consumer Protection and Business Committee and sits on the Environment and Energy, Transportation, and Legislative Ethics Committees.",
  "24": "A Republican, Christian Rombough, has also filed to run for Hackney’s seat.",
  "26": "It’s one of the few legislative districts in the state still considered a battleground and it’s seeing some action this year. In 2025, the 26th, which spans parts of Pierce and Kitsap counties, was the site of a hotly contested race between Sen. Deb Krishnadasan, D-Gig Harbor, and state Rep. Michelle Valdez, R-Gig Harbor.",
  "27": "Krishnadasan won and is on the ballot again because she secured a partial term in a special election. She was appointed to the seat after it was vacated when Emily Randall was elected to Congress. Gary Parker, a restaurant owner and philanthropist, is running against Krishnadasan.",
  "28": "Meanwhile, Valdez, whose last name was previously Caldier, isn’t seeking reelection in the House after six terms. Into that void have stepped four contenders — two Democrats, a Republican and a candidate without a party affiliation.",
  "29": "One Democrat is Renee Hernandez Greenfield, who is a speech and language trainer working with children and families. She’s also worked as a child protective services investigator for the Suquamish Tribe. Randall and the Kitsap County Democrats have endorsed Greenfield.",
  "30": "The other Democrat is Tedd Wetherbee, an entrepreneur who highlights his experience in international development. Local officials like Pierce County Executive Ryan Mello and Tacoma Mayor Anders Ibsen have lined up behind him.",
  "31": "The Republican is Katy Cornell, a pastor who co-leads a nonprofit that has focused on projects involving clean water, healthcare and other development issues in West Africa.",
  "32": "Another candidate, Randy Phillips, who lists an address in Gig Harbor, is also running, but without a party affiliation.",
  "34": "Rep. Adison Richards, D-Gig Harbor, an attorney who has worked on housing law issues and one of the handful of Democrats who voted against the income tax on millionaire earners this year, is facing primary competition from a fellow Democrat. Natalie Bornfleth is an Air Force veteran who is now a public school teacher involved in union leadership.",
  "35": "Also in the mix for Richards’ seat: Republican David Olson, vice president of the Peninsula School District, who ran unsuccessfully to be state superintendent of public instruction in 2024.",
  "37": "Rep. Sharlett Mena, D-Tacoma, is running to replace longtime Sen. Steve Conway, who is retiring. That opens up a spot in the House that has attracted four Democratic hopefuls and two Republicans.",
  "38": "The Democrats include: Patrick Stickney, a senior policy and legislative affairs advisor at the state’s Office of Equity; Joe Bushnell, who’s deputy mayor of Tacoma; Erin Chapman-Smith, the executive director of ROOTS Young Adult Shelter in Seattle; and Natasha Laitila, who has worked as a legislative assistant for Rep. Jamila Taylor and Sen. Bob Hasegawa and took part in in efforts to unionize legislative staff.",
  "39": "Darek Blum and Sheri Hayes are the Republicans in the race.",
  "40": "The district votes reliably Democratic and Mena ran for the House seat last time unopposed.",
  "41": "Meanwhile, Rep. Melanie Morgan, D-Spanaway, faces a Democratic challenger as she seeks reelection. Krista Perez has been involved in a number of business and nonprofit ventures and is an author of a book on how marginalized groups can implement transformative and healing practices in their communities.",
  "42": "Morgan, is an Army veteran, former school board director and has worked in various housing-related roles. She serves as vice chair of the Agriculture and Natural Resources Committee.",
  "43": "Brett Johnson, a Republican who lost to Morgan in 2022, is running again.",
  "45": "A crowded race of Democrats has formed in this deep blue district representing north King County and south Snohomish County, with state Rep. Cindy Ryu, D-Shoreline, choosing to challenge fellow Democrat Jesse Salomon for his Senate seat.",
  "46": "Five Democrats and one Republican have filed for Ryu’s seat. They are Edmonds City Councilmembers Jenna Nand and Will Chen, Shoreline City Councilmember Keith Scully, consumer protection attorney Danica Noble and Chris Bloomquist, who runs an environmental- and technology-focused recruiting firm. Noble leads the early fundraising race. Republican Lisa Rezac, who lost to Ryu in 2024, is running again.",
  "47": "Rep. Lauren Davis, D-Seattle, also faces a Democrat-on-Democrat clash, against Imraan Siddiqi, the executive director of the Washington chapter of the Council on American-Islamic Relations. They’re the only two candidates running.",
  "48": "Ryu and Salomon are joined by Republican Ira McBee in the Senate race.",
  "50": "This Whatcom County district features one of the few open Senate seats, and a rare opportunity for Republicans, as they held this seat as recently as 2021. Four candidates are seeking the position vacated by Sen. Sharon Shewmake, D-Bellingham.",
  "51": "Shewmake is supporting Bellingham port commissioner Michael Shepard to replace her. He also has Senate Majority Leader Jamie Pedersen’s backing. Republican Erika Creydt, a psychologist, hopes to turn the district red, cutting into the Democrats’ 29-20 majority in the Senate.",
  "52": "Eamonn Collins, a teacher and former U.S. Senate adviser who leads a community land trust, is also running as a Democrat. Ryan Bowman filed to run without listing a party preference."
 }
}</script>
<script>
function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function races(){
  const M = JSON.parse(document.getElementById('model').textContent);
  const dist = Object.fromEntries(M.districts.map(d => [d.id, d]));
  const races = M.races.map((r, i) => {
    const d = dist[r.d];
    const flip = !!d.flip || r.kinds.includes('flip');
    const counts = {};
    r.cands.forEach(c => { const k = (c.p === 'NP' || c.p === 'NPL') ? 'other' : c.p; counts[k] = (counts[k] || 0) + 1; });
    const mix = [['D','D'],['R','R'],['other','no party'],['?','party not stated']]
      .filter(([k]) => counts[k]).map(([k, w]) => counts[k] + ' ' + w).join(' · ');
    return Object.assign({}, r, {
      i, flip,
      who: r.leave ? r.leave.name.replace(/^(Rep\.|Sen\.) /, '').replace(/, [DR]-.*$/, '') : r.inc.replace(/^(Rep\.|Sen\.) /, '').replace(/, [DR]-.*$/, ''),
      whoParty: r.leave ? ((r.leave.name.match(/, ([DR])-/) || [])[1] || '') : r.cands.find(c => c.role === 'Incumbent').p,
      status: r.leave ? r.leave.status : 'incumbent',
      mix,
      label: d.name + ' · ' + r.ch + ' · ' + r.seat.replace(/^(Rep\.|Sen\.) /, ''),
      short: d.num + ' ' + r.ch + ' · ' + r.last,
    });
  });
  const idx = Object.fromEntries(races.map(r => [r.id, r.i]));
  const groups = M.districts.map(d => ({
    id: d.id, name: d.name,
    facts: [d.area, d.lean, d.held].filter(Boolean),
    races: races.filter(r => r.d === d.id),
  }));
  const kinds = M.kinds.map(k => Object.assign({}, k, { count: races.filter(r => r.kinds.includes(k.id)).length }));
  return {
    M, dist, races, idx, groups, kinds,
    mark: 'flip', sel: 0, deck: false, di: 0, _t: null, _dt: null,
    init(){
      window.addEventListener('popstate', () => { if (this.deck) this.closeDeck(true); });
    },
    kindLabel(id){ return this.kinds.find(k => k.id === id).label; },
    strip(){ return document.getElementById('strip'); },
    deckStrip(){ return document.getElementById('deck-strip'); },
    scrollTo(el, i, behavior){ if (el) el.scrollTo({ left: i * el.clientWidth, behavior }); },
    pick(i, focus){
      i = Math.max(0, Math.min(this.races.length - 1, i));
      this.sel = i;
      this.scrollTo(this.strip(), i, 'smooth');
      this.reveal(i, focus);
    },
    reveal(i, focus){
      const row = document.getElementById('row-' + this.races[i].id);
      if (!row) return;
      row.scrollIntoView({ block: 'nearest' });
      if (focus) row.focus({ preventScroll: true });
    },
    onStrip(){
      clearTimeout(this._t);
      this._t = setTimeout(() => {
        const el = this.strip();
        const i = Math.round(el.scrollLeft / el.clientWidth);
        if (i !== this.sel) { this.sel = i; this.reveal(i, false); }
      }, 90);
    },
    onDeck(){
      clearTimeout(this._dt);
      this._dt = setTimeout(() => {
        const el = this.deckStrip();
        if (!el) return;
        this.di = Math.round(el.scrollLeft / el.clientWidth);
      }, 90);
    },
    resnap(){
      const s = this.strip(); if (s) s.scrollLeft = this.sel * s.clientWidth;
      const d = this.deckStrip(); if (d) d.scrollLeft = this.di * d.clientWidth;
    },
    openDeck(){
      this.di = this.sel;
      this.deck = true;
      history.pushState({ deck: 1 }, '');
      const place = () => this.scrollTo(this.deckStrip(), this.di, 'instant');
      this.$nextTick(() => requestAnimationFrame(() => { place(); requestAnimationFrame(place); }));
    },
    closeDeck(fromPop){
      if (!this.deck) return;
      const i = this.di;
      this.deck = false;
      if (!fromPop && history.state && history.state.deck) history.back();
      this.sel = i;
      this.$nextTick(() => { this.scrollTo(this.strip(), i, 'instant'); this.reveal(i, true); });
    },
    deckGo(i){
      i = Math.max(0, Math.min(this.races.length - 1, i));
      this.di = i;
      this.scrollTo(this.deckStrip(), i, 'smooth');
    },
    go(e, where){
      const b = e.target.closest('[data-go]');
      if (!b) return;
      const i = this.idx[b.dataset.go];
      if (where === 'deck') this.deckGo(i); else this.pick(i, false);
    },
    key(e){
      if (document.getElementById('cycle').open) return;
      if (this.deck){
        if (e.key === 'ArrowRight') { this.deckGo(this.di + 1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { this.deckGo(this.di - 1); e.preventDefault(); }
        else if (e.key === 'Escape') { this.closeDeck(false); e.preventDefault(); }
        return;
      }
      const inList = !!(e.target.closest && e.target.closest('[data-list]'));
      if (inList && e.key === 'ArrowDown') { this.pick(this.sel + 1, true); e.preventDefault(); }
      else if (inList && e.key === 'ArrowUp') { this.pick(this.sel - 1, true); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { this.pick(this.sel + 1, inList); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { this.pick(this.sel - 1, inList); e.preventDefault(); }
    },
    card(r, big){
      const mark = this.mark;
      const d = this.dist[r.d];
      const chrome = big ? 'text-sm' : 'text-xs';
      const lab = chrome + ' uppercase tracking-wide text-base-content/60';
      const ul = items => items.length ? '<ul class="list-disc pl-5 flex flex-col gap-1">' + items.map(t => '<li class="text-pretty">' + esc(t) + '</li>').join('') + '</ul>' : '';
      const goBtn = (id, text) => '<button type="button" data-go="' + esc(id) + '" class="link mt-1 text-left inline-flex items-center gap-1">' + esc(text) + ' <i class="ph ph-arrow-right"></i></button>';
      const chips = r.kinds.map(k => '<span class="badge ' + (big ? 'badge-lg ' : '') + (k === mark ? 'badge-primary' : 'badge-ghost') + '">' + esc(this.kindLabel(k)) + '</span>').join('');
      const row = (dt, dd) => '<dt class="' + lab + ' @md:pt-1">' + dt + '</dt><dd class="min-w-0 mb-2 @md:mb-0">' + dd + '</dd>';
      let seat = '';
      if (r.leave) {
        seat += row('Leaving', '<div><span class="font-medium">' + esc(r.leave.name) + '</span> · ' + esc(r.leave.status) + '</div>' + ul(r.leave.facts) + (r.leave.go ? goBtn(r.leave.go, r.leave.golabel) : ''));
      } else {
        seat += row('Incumbent', '<div><span class="font-medium">' + esc(r.inc) + '</span> · on the ballot</div>');
      }
      seat += row('District', esc([d.name, d.area, d.short].filter(Boolean).join(' · ')));
      if (r.facts && r.facts.length) seat += row('Seat facts', ul(r.facts));
      const hasBack = r.cands.some(c => c.back && c.back.length);
      const cols = hasBack ? '@2xl:grid-cols-[minmax(0,13rem)_minmax(0,1fr)_minmax(0,16rem)]' : '@2xl:grid-cols-[minmax(0,13rem)_minmax(0,1fr)]';
      const head = '<div class="hidden @2xl:grid ' + cols + ' gap-x-6 pb-1 ' + lab + '"><span>Candidate</span><span>Background</span>' + (hasBack ? '<span>Backed by</span>' : '') + '</div>';
      const rows = r.cands.map((c, i) => {
        const meta = [this.M.party[c.p], c.role].filter(Boolean).join(' · ');
        const bg = ul(c.bg) + (c.go ? goBtn(c.go, c.golabel) : '');
        const back = hasBack ? '<div class="min-w-0">' + (c.back ? '<div class="' + lab + ' @2xl:hidden">Backed by</div>' + ul(c.back) : '') + '</div>' : '';
        return '<div class="grid grid-cols-[minmax(0,1fr)] ' + cols + ' gap-x-6 gap-y-1 py-3' + (i ? ' border-t border-base-300' : '') + '">'
          + '<div class="min-w-0"><div class="font-semibold">' + esc(c.n) + '</div><div class="' + chrome + ' text-base-content/70">' + esc(meta) + '</div></div>'
          + '<div class="min-w-0">' + bg + '</div>' + back + '</div>';
      }).join('');
      const ps = r.ps.map(p => '<p class="text-pretty">' + esc(this.M.paras[p]) + '</p>').join('');
      return '<div class="@container flex flex-col gap-6 ' + (big ? 'text-xl leading-8' : 'text-base leading-7') + '">'
        + '<div><div class="' + lab + '">' + esc(d.name + ' · ' + r.ch) + '</div>'
        + '<h2 class="font-semibold text-balance ' + (big ? 'text-3xl leading-tight' : 'text-xl') + '">' + esc(r.seat) + '</h2>'
        + '<div class="flex flex-wrap gap-1.5 mt-2">' + chips + '</div></div>'
        + '<dl class="grid grid-cols-[minmax(0,1fr)] @md:grid-cols-[minmax(0,8rem)_minmax(0,1fr)] gap-x-4 @md:gap-y-3">' + seat + '</dl>'
        + '<section><h3 class="' + lab + ' mb-1">Candidates · ' + r.cands.length + ' · ' + esc(r.mix) + '</h3>' + head + rows + '</section>'
        + '<details class="group border-t border-base-300 pt-2"><summary class="cursor-pointer list-none flex items-center gap-1.5 py-2 ' + lab + '">'
        + '<i class="ph ph-caret-right transition-transform group-open:rotate-90"></i>Article text for this race · ' + r.ps.length + (r.ps.length === 1 ? ' paragraph' : ' paragraphs') + '</summary>'
        + '<div class="flex flex-col gap-3 border-l-2 border-base-300 pl-4 mt-2 text-base-content/80">' + ps + '</div></details>'
        + '</div>';
    },
  };
}
</script>

<div x-data="races()" @keydown.window="key($event)" @resize.window="resnap()" class="fixed inset-0 grid grid-cols-[minmax(0,1fr)] grid-rows-[auto_auto_minmax(0,1fr)]">

  <header class="px-4 pt-3 pb-2 grid grid-cols-[minmax(0,1fr)_auto] items-start gap-x-3 gap-y-0.5 border-b border-base-300">
    <h1 class="text-lg leading-snug font-semibold text-balance pt-0.5">Legislative races to watch</h1>
    <button type="button" class="btn btn-ghost btn-sm" @click="document.getElementById('cycle').showModal()"><i class="ph ph-info"></i><span class="hidden sm:inline">2026</span> cycle &amp; source</button>
    <p class="col-span-2 text-xs text-base-content/70 text-pretty">Washington 2026 · House 59–39 D · Senate 30–19 D · Primary Aug 4 · Election Nov 3</p>
  </header>

  <div class="px-4 py-2 flex items-center gap-2 overflow-x-auto whitespace-nowrap border-b border-base-300 [scrollbar-width:none]">
    <span class="text-xs uppercase tracking-wide text-base-content/60 shrink-0 mr-1">Mark</span>
    <template x-for="k in kinds" :key="k.id">
      <button type="button" class="btn btn-sm rounded-full shrink-0 gap-1.5" :class="mark === k.id ? 'btn-primary' : 'btn-ghost border border-base-300'" :aria-pressed="mark === k.id ? 'true' : 'false'" @click="mark = k.id">
        <span x-text="k.label"></span><span class="text-xs opacity-70" x-text="k.count"></span>
      </button>
    </template>
  </div>

  <main class="min-h-0 grid grid-cols-[minmax(0,1fr)] grid-rows-[minmax(0,40%)_minmax(0,1fr)] lg:grid-rows-[minmax(0,1fr)] lg:grid-cols-[minmax(0,25rem)_minmax(0,1fr)]">

    <nav data-list aria-label="Races" class="min-h-0 overflow-y-auto border-b lg:border-b-0 lg:border-r border-base-300 pb-3">
      <template x-for="g in groups" :key="g.id">
        <section>
          <div class="px-4 pt-3 pb-1">
            <div class="font-semibold" x-text="g.name"></div>
            <div class="text-base-content/70 text-pretty" x-show="g.facts.length" x-text="g.facts.join(' · ')"></div>
          </div>
          <template x-for="r in g.races" :key="r.id">
            <button type="button" :id="'row-' + r.id" :tabindex="sel === r.i ? 0 : -1" :aria-current="sel === r.i ? 'true' : 'false'" @click="pick(r.i, true)"
              class="w-full text-left pl-3 pr-4 py-2 border-l-4 grid grid-cols-[3.5rem_minmax(0,1fr)] gap-x-2 gap-y-1 items-baseline outline-offset-[-2px]"
              :class="[r.kinds.includes(mark) ? 'border-primary' : 'border-transparent', sel === r.i ? 'bg-base-200' : '']">
              <span class="text-xs uppercase tracking-wide text-base-content/60" x-text="r.ch"></span>
              <span class="min-w-0"><span class="font-medium" x-text="r.who"></span><span class="text-base-content/70" x-text="(r.whoParty ? ' (' + r.whoParty + ')' : '') + ' · ' + r.status"></span></span>
              <span></span>
              <span class="flex flex-wrap items-center gap-1">
                <template x-for="k in r.kinds" :key="k">
                  <span class="badge badge-sm" :class="k === mark ? 'badge-primary' : 'badge-ghost'" x-text="kindLabel(k)"></span>
                </template>
                <span class="text-xs text-base-content/60 ml-auto pl-2" x-text="r.mix"></span>
              </span>
            </button>
          </template>
        </section>
      </template>
    </nav>

    <section class="min-h-0 grid grid-cols-[minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)]" aria-label="Selected race">
      <div class="px-4 py-1.5 flex items-center gap-2 border-b border-base-300">
        <span class="text-sm font-semibold truncate min-w-0 flex-1"><span class="sm:hidden" x-text="races[sel].short"></span><span class="hidden sm:inline" x-text="races[sel].label"></span></span>
        <span class="text-xs font-mono text-base-content/60 shrink-0" x-text="(sel + 1) + ' / ' + races.length"></span>
        <button type="button" class="btn btn-ghost btn-sm shrink-0" @click="openDeck()"><i class="ph ph-arrows-out-simple"></i>Full screen</button>
      </div>
      <div id="strip" @scroll="onStrip()" @click="go($event, 'strip')" class="min-h-0 flex overflow-x-auto overflow-y-hidden snap-x snap-mandatory [scrollbar-width:none]">
        <template x-for="r in races" :key="r.id">
          <article class="w-full shrink-0 snap-start snap-always h-full overflow-y-auto px-4 pt-4 pb-10" x-html="card(r, false)"></article>
        </template>
      </div>
    </section>
  </main>

  <template x-if="deck">
    <div class="fixed inset-0 z-40 grid grid-cols-[minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)_auto] bg-base-100" role="dialog" aria-modal="true" aria-label="Race, full screen">
      <header class="px-4 py-2 flex items-center gap-3 border-b border-base-300">
        <div class="min-w-0 flex-1">
          <div class="text-xs uppercase tracking-wide text-base-content/60">Legislative races to watch</div>
          <div class="text-lg font-semibold truncate"><span class="sm:hidden" x-text="races[di].short"></span><span class="hidden sm:inline" x-text="races[di].label"></span></div>
        </div>
        <span class="text-xs font-mono text-base-content/60 shrink-0" x-text="(di + 1) + ' / ' + races.length"></span>
        <button type="button" class="btn btn-ghost btn-sm shrink-0" @click="closeDeck(false)"><i class="ph ph-x"></i>Close</button>
      </header>
      <div id="deck-strip" @scroll="onDeck()" @click="go($event, 'deck')" class="min-h-0 flex overflow-x-auto overflow-y-hidden snap-x snap-mandatory [scrollbar-width:none]">
        <template x-for="r in races" :key="r.id">
          <article class="w-full shrink-0 snap-start snap-always h-full overflow-y-auto px-4 sm:px-8 lg:px-12 pt-6 pb-12" x-html="card(r, true)"></article>
        </template>
      </div>
      <footer class="px-4 py-2 flex flex-wrap items-center gap-x-3 gap-y-1 border-t border-base-300">
        <div class="order-first w-full sm:order-none sm:w-auto sm:flex-1 flex justify-center gap-1.5 py-1 sm:order-2">
          <template x-for="r in races" :key="r.id">
            <button type="button" class="w-2.5 h-2.5 rounded-full" :class="r.i === di ? 'bg-base-content' : 'bg-base-content/20'" :aria-label="r.label" @click="deckGo(r.i)"></button>
          </template>
        </div>
        <button type="button" class="btn btn-ghost btn-sm min-w-0 justify-start sm:order-1" :disabled="di === 0" @click="deckGo(di - 1)"><i class="ph ph-caret-left"></i><span class="truncate" x-text="di > 0 ? races[di - 1].short : 'First race'"></span></button>
        <button type="button" class="btn btn-ghost btn-sm min-w-0 justify-end ml-auto sm:ml-0 sm:order-3" :disabled="di === races.length - 1" @click="deckGo(di + 1)"><span class="truncate" x-text="di < races.length - 1 ? races[di + 1].short : 'Last race'"></span><i class="ph ph-caret-right"></i></button>
      </footer>
    </div>
  </template>

  <dialog id="cycle" class="modal">
    <div class="modal-box">
      <div class="flex items-start gap-3 mb-3">
        <h2 class="text-lg font-semibold flex-1 text-balance">2026 cycle &amp; source</h2>
        <form method="dialog"><button class="btn btn-ghost btn-sm"><i class="ph ph-x"></i>Close</button></form>
      </div>
      <dl class="grid grid-cols-[minmax(0,1fr)] sm:grid-cols-[minmax(0,7rem)_minmax(0,1fr)] gap-x-4 sm:gap-y-3 leading-7">
        <template x-for="f in M.cycle.facts" :key="f[0]">
          <div class="contents">
            <dt class="text-xs uppercase tracking-wide text-base-content/60 sm:pt-1.5" x-text="f[0]"></dt>
            <dd class="mb-2 sm:mb-0">
              <ul class="flex flex-col gap-1"><template x-for="t in f[1]" :key="t"><li class="text-pretty" x-text="t"></li></template></ul>
            </dd>
          </div>
        </template>
        <dt class="text-xs uppercase tracking-wide text-base-content/60 sm:pt-1.5">Source</dt>
        <dd><a class="link inline-flex items-center gap-1" :href="M.source.url" target="_blank" rel="noopener"><span x-text="M.source.name"></span><i class="ph ph-arrow-square-out"></i></a><div class="text-xs text-base-content/60" x-text="M.source.license"></div></dd>
      </dl>
      <details class="group border-t border-base-300 mt-4 pt-2">
        <summary class="cursor-pointer list-none flex items-center gap-1.5 py-2 text-xs uppercase tracking-wide text-base-content/60"><i class="ph ph-caret-right transition-transform group-open:rotate-90"></i><span x-text="'Article text: opening · ' + M.cycle.ps.length + ' paragraphs'"></span></summary>
        <div class="flex flex-col gap-3 border-l-2 border-base-300 pl-4 mt-2 text-base-content/80 leading-7">
          <template x-for="p in M.cycle.ps" :key="p"><p class="text-pretty" x-text="M.paras[p]"></p></template>
        </div>
      </details>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

</div>
</body>
</html>
