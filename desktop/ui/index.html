<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>On this laptop | Web Tools Desktop</title>
  <script src="vendor/tailwind.js"></script>
  <script src="laptop.js" defer></script>
</head>
<body class="m-0 bg-stone-50 font-sans text-stone-800 [&_button]:cursor-pointer [&_button:disabled]:cursor-default [&_button:disabled]:opacity-40 [&_button:focus-visible]:outline-2 [&_button:focus-visible]:outline-emerald-700 [&_button:focus-visible]:outline-offset-2">
  <main class="grid h-dvh grid-rows-[auto_auto_minmax(0,1fr)] gap-4 p-5">
    <header class="flex items-center justify-between gap-4">
      <div class="flex items-baseline gap-4"><h1 class="text-balance text-xl font-semibold">On this laptop</h1><span id="machine" class="text-xs text-stone-500">THIS COMPUTER</span></div>
      <div class="flex items-center gap-4"><span id="checked" class="text-xs text-stone-500" role="status">Checking</span><button data-action="refresh" class="rounded border border-stone-200 bg-white px-3 py-2 text-sm hover:bg-stone-100">Refresh ↻</button></div>
    </header>
    <div id="notice" role="status"></div>
    <div class="grid min-h-0 grid-cols-[minmax(0,1fr)_18rem] gap-5 max-[1000px]:grid-cols-[minmax(0,1fr)_15rem]">
      <section class="grid min-h-0 grid-rows-[auto_auto_minmax(0,2fr)_minmax(0,3fr)_auto] overflow-hidden rounded-lg border border-stone-200 bg-white" aria-labelledby="errands-title">
        <div class="flex items-center justify-between gap-3 px-4 py-3"><h2 id="errands-title" class="text-base font-semibold">Gemini errands</h2><button data-action="seen" id="seen" disabled class="text-sm text-emerald-800 hover:underline">Mark results seen</button></div>
        <div class="flex items-center justify-between gap-3 border-b border-stone-200 px-4 pb-3"><div class="filters flex min-w-0 gap-1 overflow-x-auto text-sm [&_button]:whitespace-nowrap [&_button]:rounded [&_button]:px-2 [&_button]:py-1 [&_button]:text-stone-600 [&_button:hover]:bg-stone-100 [&_button[aria-pressed=true]]:bg-emerald-50 [&_button[aria-pressed=true]]:text-emerald-900" role="group" aria-label="Filter errands"><button data-filter="all" aria-pressed="true">Recent</button><button data-filter="open" aria-pressed="false">In progress <span id="running">—</span></button><button data-filter="queued" aria-pressed="false">Queued <span id="queued">—</span></button><button data-filter="new" aria-pressed="false">New <span id="new-count">—</span></button></div><input id="search" type="search" aria-label="Find an errand" placeholder="Find an errand…" class="w-40 min-w-20 rounded border border-stone-200 bg-stone-50 px-2 py-1 text-sm focus:outline-emerald-700"></div>
        <div id="errands" class="min-h-0 overflow-y-auto" aria-live="polite"><div class="p-5 text-base text-stone-500">Reading activity records…</div></div>
        <section id="detail" class="min-h-0 overflow-y-auto border-t border-stone-200 bg-stone-50/60 p-4" aria-label="Selected errand"></section>
        <div id="record-note" class="border-t border-stone-200 px-4 py-2 text-xs text-stone-500">Checking the current activity records.</div>
      </section>
      <aside class="min-h-0 space-y-4 overflow-y-auto pb-2">
        <section class="rounded-lg border border-stone-200 bg-white p-4" aria-labelledby="worker-title"><div class="flex items-center justify-between gap-2"><h2 id="worker-title" class="text-base font-semibold">Gemini worker</h2><span id="worker-state" class="text-xs text-stone-500">Checking</span></div><dl class="mt-4 space-y-2 text-sm"><div class="flex justify-between gap-2"><dt class="text-stone-500">Last log write</dt><dd id="last-log">Checking</dd></div><div class="flex justify-between gap-2"><dt class="text-stone-500">Records</dt><dd id="connection">Checking</dd></div></dl><details class="mt-3 text-xs text-stone-500"><summary class="cursor-pointer">About the signal</summary><p id="worker-detail" class="mt-2 text-pretty leading-5"></p></details></section>
        <section class="rounded-lg border border-stone-200 bg-white p-4" aria-labelledby="apps-title"><h2 id="apps-title" class="text-base font-semibold">App processes</h2><div id="applications" class="mt-3 space-y-3"></div></section>
        <section class="rounded-lg border border-stone-200 bg-white p-4" aria-labelledby="places-title"><h2 id="places-title" class="text-base font-semibold">Places</h2><div id="places" class="mt-2 grid gap-1"></div></section>
        <details class="rounded-lg border border-stone-200 bg-white p-4"><summary id="downloads-title" class="cursor-pointer text-base font-semibold">Recent downloads</summary><div id="downloads" class="mt-3 space-y-3"></div><button class="mt-3 text-sm text-emerald-800 hover:underline" data-action="place" data-id="downloads">Open Downloads ↗</button></details>
      </aside>
    </div>
  </main>
</body>
</html>
