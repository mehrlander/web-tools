<style>

#78716c;font-size:10.5px;margin-top:5px;line-height:20px}.menu{position:absolute;top:36px;right:10px;width:186px;background:#fff;border:1px solid #e7e5e4;border-radius:10px;box-shadow:0 5px 18px #29252420;padding:4px;z-index:5}.menu button,.menu a{min-height:40px;width:100%;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;color:#276b57;border-radius:6px;text-align:left;font-size:13px;white-space:nowrap}.menu button:hover,.menu a:hover{background:#f5f5f4}.menu svg{width:14px;height:14px}.under-label{font-size:12px;color:#57534e;line-height:1.5;padding:10px 2px}.under-label strong{color:#292524}.back{height:34px;width:22px;padding:0;display:grid;place-items:center;flex-shrink:0;color:#356e59}.back svg{width:20px;height:20px}.context{padding:10px 12px 7px;background:white}.context strong{font-size:14px;font-weight:650}.context p{font-size:11px;color:#78716c;margin:3px 0 0;line-height:17px;overflow-wrap:anywhere}.segments{display:flex;gap:2px;background:#e7e5e4;border-radius:8px;padding:3px;margin:0 12px 9px}.segments button{flex:1;min-height:29px;border-radius:6px;color:#57534e;font-size:12px;white-space:nowrap;padding:0 6px}.segments [aria-pressed=true]{background:#fff;color:#292524;box-shadow:0 1px 3px #29252412;font-weight:550}.file-body{background:#fff;padding-top:9px}.file-group-title{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:11px;font-weight:550;color:#78716c;background:#f5f5f4;border-top:1px solid #e7e5e4;border-bottom:1px solid #e7e5e4}.file-group-title .total{font-weight:400}.file-row{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid #f0eeec;min-height:57px}.file-row>.icon{width:19px;height:19px;color:#5c8273}.file-row .file-name{font-size:13px;font-weight:500;margin:0;line-height:19px}.file-row .file-meta{font-size:11px;color:#78716c;margin:2px 0 0;line-height:16px}.file-row .description{min-width:0;flex:1}.file-row .amount{font-size:12px;color:#57534e;white-space:nowrap}.file-row .role{font-size:10px;font-weight:400;color:#78716c;margin-left:5px}.single{background:#f5f5f4}.single .gallery-heading,.single .under-label{display:none}.single .gallery{display:block;margin:0;padding:0;max-width:none}.single .option{display:none}.single .option.selected{display:block}.single .phone{max-width:390px;margin:auto;border:0;border-radius:0;box-shadow:none;min-height:760px}.single .gallery{width:100%}.preview-status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#292524;color:white;padding:8px 12px;border-radius:8px;font-size:12px;z-index:20;box-shadow:0 2px 8px #0002}@media(max-width:860px){.gallery{grid-template-columns:minmax(0,390px);justify-content:center}.gallery-heading{max-width:422px;margin-top:20px}.phone{min-height:720px}}
</style></head><body>
<div class="gallery-heading"><h1>Repository view options</h1><p>Same sample files, three placements. Standalone mockups; the installed app is unchanged.</p></div>
<main class="gallery" id="gallery"></main><div id="status" role="status" class="preview-status" hidden></div>
<script>
const icons={
 more:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>',
 external:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M14 4h6v6M20 4 10 14M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg>',
 remote:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21h8m-4-5v5m-5-11h10m-3-3 3 3-3 3"/></svg>',
 chevron:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg>',
 down:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" width="11" height="11" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>',
 folder:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h6l2 3h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></svg>',
 file:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8l-5-5ZM14 3v5h5M8 12h8M8 16h6"/></svg>'
};
const data={"reader_question": "What local material is outside Git in this checkout, and how much belongs in the overview?", "evidence_status": "Illustrative populated cases, not observations of ignored files on the laptop.", "checkout": {"repository": "web-tools", "folder": "web-tools-desktop", "branch": "codex/repository-freshness", "github_branch": {"ahead": 0, "behind": 0}, "github_main": {"ahead": 5, "behind": 4}}, "local_entries": [{"name": "exports/", "kind": "folder", "git_state": "ignored", "files": 12, "size": "34 MB", "updated": "18m ago"}, {"name": "recordings/", "kind": "folder", "git_state": "ignored", "files": 3, "size": "28 MB", "updated": "2h ago"}, {"name": "node_modules/", "kind": "folder", "git_state": "ignored", "files": 18400, "size": "240 MB", "updated": "6d ago", "role": "Dependencies"}, {"name": ".cache/", "kind": "folder", "git_state": "ignored", "files": 76, "size": "8 MB", "updated": "10m ago", "role": "Cache"}, {"name": "notes.md", "kind": "file", "git_state": "untracked", "size": "12 KB", "updated": "just now"}, {"name": "scratch.json", "kind": "file", "git_state": "untracked", "size": "4 KB", "updated": "35m ago"}], "relationships": ["Every local entry belongs to one checkout, not to every checkout of the repository.", "Ignored and untracked are separate Git states.", "Git state alone does not establish backup coverage.", "Simple actions operate on a repository; local-file navigation selects a checkout."], "alternatives": {"a": "Counts in the repository list, explicit link to detail.", "b": "Folder names and sizes directly below their checkout.", "c": "A dedicated local-files screen with text filters and grouped rows."}};
const titles={a:'Counts in the list',b:'Folders in the list',c:'Local files screen'};
function header(local=false){return `<header class="app-header">${local?`<a class="back" href="?view=a" aria-label="Back to Repositories">${icons.back}</a>`:'<img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjQuNSA0LjUgMjMgMjMiIHJvbGU9ImltZyIgYXJpYS1sYWJlbD0id2ViLXRvb2xzIj4KICA8dGl0bGU+d2ViLXRvb2xzPC90aXRsZT4KICA8ZGVzYz5TbG90LXNwbGl0IGhleCBudXQ6IGEgaGV4YWdvbiAobW9kdWxhcjsgaXRzIGxlZnQvcmlnaHQgcG9pbnRzIHJlYWQgYXMgYW5nbGUgYnJhY2tldHMpIHdpdGggYSByb3VuZCBib3JlIChhIG51dDogdG9vbHMpLCBzcGxpdCBkb3duIHRoZSBtaWRkbGUgdG8gcG9wIHRoZSAmbHQ7ICZndDsuPC9kZXNjPgogIDxtYXNrIGlkPSJzbG90IiBtYXNrVW5pdHM9InVzZXJTcGFjZU9uVXNlIiB4PSIwIiB5PSIwIiB3aWR0aD0iMzIiIGhlaWdodD0iMzIiPgogICAgPHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiBmaWxsPSIjZmZmIi8+CiAgICA8cmVjdCB4PSIxNC42IiB5PSI0IiB3aWR0aD0iMi44IiBoZWlnaHQ9IjI0IiBmaWxsPSIjMDAwIi8+CiAgICA8Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSI0LjUiIGZpbGw9IiMwMDAiLz4KICA8L21hc2s+CiAgPHBhdGggZmlsbD0iIzI1NjNlYiIgbWFzaz0idXJsKCNzbG90KSIgZD0iTTEwLjUgNi40NzQgTDIxLjUgNi40NzQgTDI3IDE2IEwyMS41IDI1LjUyNiBMMTAuNSAyNS41MjYgTDUgMTYgWiIvPgo8L3N2Zz4K" class="brand" alt="Web Tools">'}<div class="header-name"><h2>${local?'Local files':'Repositories'}${local?'':icons.down}</h2><p>T14MAY23</p></div><span class="live">Laptop live</span><button class="round" aria-label="Open Windows App" data-demo>${icons.remote}</button><button class="round" aria-label="Open Web Tools" data-demo>${icons.external}</button></header>`}
function menu(name){return `<button class="more" aria-label="Actions for ${name}" aria-haspopup="menu" aria-expanded="false">${icons.more}</button><div class="menu" role="menu" hidden><button role="menuitem" data-demo>Check GitHub now</button><button role="menuitem" data-demo>Open on GitHub ${icons.external}</button></div>`}
function compare(target,content){return `<div class="comparison"><span>${target}</span><span>${content}</span></div>`}
const sync='<span class="good">In sync</span>',main='<span class="ahead">↑ 5</span> · <span class="behind">↓ 4</span>';
function link(label,counts=''){return `<a class="local-link" href="?view=c"><span class="label">${label}</span><span class="counts">${counts}</span>${icons.chevron}</a>`}
function repo(name,body){return `<section class="repo"><div class="repo-heading"><h3>${name}</h3><span class="time">Checked 2m ago</span></div>${menu(name)}${body}</section>`}
function localInline(){return `<div class="subheading"><span>Ignored folders</span><span>310 MB</span></div><ul class="inline-files">${data.local_entries.filter(f=>f.kind==='folder').map(f=>`<li>${icons.folder}<span class="name">${f.name}${f.role?`<span class="role">${f.role}</span>`:''}</span><span class="size">${f.size}</span></li>`).join('')}</ul>${link('All local files','4 ignored · 2 untracked')}`}
function overview(key){return header()+`<div class="overview"><div class="overview-line"><span>13 repos · 28 checkouts</span><button class="check-all" data-demo>Check all repos</button></div><p class="legend">↑ Ahead · ↓ Behind GitHub, in commits</p></div>`+
 repo('web-tools',`<div class="checkout"><p class="branch"><strong>web-tools-desktop</strong> · codex/repository-freshness</p>${compare('GitHub branch',sync)}${compare('GitHub main',main)}${key==='a'?link('Local files','2 untracked · 4 ignored folders'):localInline()}</div><div class="checkout"><p class="branch"><strong>web-tools</strong> · main</p>${compare('GitHub main',sync)}</div>`)+
 repo('home',`<div class="checkout"><p class="branch">main</p>${compare('GitHub main',sync)}</div>`)+
 repo('art-of-memory',`<div class="checkout"><p class="branch">main</p>${compare('GitHub main',sync)}</div>`)+
 repo('budget-wa',`<div class="checkout"><p class="branch">gemini/agency-workbooks</p>${compare('GitHub branch',sync)}${compare('GitHub main','<span class="behind">↓ 61</span>')}</div>`)+
 repo('spend-wa',`<div class="checkout"><p class="branch">main</p>${compare('GitHub main','<span class="ahead">↑ 17</span> · <span class="behind">↓ 214</span>')}</div>`);}
function fileRow(f){return `<div class="file-row">${icons[f.kind==='folder'?'folder':'file']}<div class="description"><p class="file-name">${f.name}${f.role?`<span class="role">${f.role}</span>`:''}</p><p class="file-meta">${f.files?f.files.toLocaleString()+' files · ':''}${f.updated}</p></div><span class="amount">${f.size}</span></div>`}
function files(){return header(true)+`<div class="file-body"><div class="context"><strong>web-tools</strong><p>web-tools-desktop · codex/repository-freshness</p></div><nav class="segments" aria-label="Local file type"><button data-filter="all" aria-pressed="true">All 6</button><button data-filter="ignored" aria-pressed="false">Ignored 4</button><button data-filter="untracked" aria-pressed="false">Untracked 2</button></nav><section data-state="ignored"><div class="file-group-title"><span>Ignored folders</span><span class="total">310 MB</span></div>${data.local_entries.filter(f=>f.git_state==='ignored').map(fileRow).join('')}</section><section data-state="untracked"><div class="file-group-title"><span>Untracked files</span><span class="total">16 KB</span></div>${data.local_entries.filter(f=>f.git_state==='untracked').map(fileRow).join('')}</section></div>`}
document.getElementById('gallery').innerHTML=['a','b','c'].map(key=>`<article class="option" data-option="${key}"><div class="phone"><div class="mockup-note"><span>${key.toUpperCase()} · ${titles[key]}</span><span>Sample data</span></div>${key==='c'?files():overview(key)}</div><p class="under-label">${key==='a'?'<strong>Least added density.</strong> Counts stay visible; the link opens the local-files screen.':key==='b'?'<strong>Names on the surface.</strong> See ignored folders without leaving the repository list.':'<strong>Room for inspection.</strong> Browse folders and files with explicit Git-state filters.'}</p></article>`).join('');
const selection=new URLSearchParams(location.search).get('view');
if(selection&&titles[selection]){document.body.classList.add('single');document.querySelector('[data-option="'+selection+'"]').classList.add('selected');}
document.addEventListener('click',event=>{
 const localLink=event.target.closest('a[href^="?view="]');
 if(localLink){event.preventDefault();const key=new URLSearchParams(localLink.getAttribute('href').slice(1)).get('view');document.body.classList.add('single');document.querySelectorAll('.option').forEach(n=>n.classList.toggle('selected',n.dataset.option===key));scrollTo(0,0);return;}
 const more=event.target.closest('.more');
 if(more){const open=more.getAttribute('aria-expanded')==='true';document.querySelectorAll('.menu').forEach(n=>n.hidden=true);document.querySelectorAll('.more').forEach(n=>n.setAttribute('aria-expanded','false'));more.setAttribute('aria-expanded',String(!open));more.nextElementSibling.hidden=open;return;}
 if(!event.target.closest('.menu')){document.querySelectorAll('.menu').forEach(n=>n.hidden=true);document.querySelectorAll('.more').forEach(n=>n.setAttribute('aria-expanded','false'));}
 const filter=event.target.closest('[data-filter]');if(filter){const phone=filter.closest('.phone');phone.querySelectorAll('[data-filter]').forEach(n=>n.setAttribute('aria-pressed',String(n===filter)));phone.querySelectorAll('[data-state]').forEach(n=>n.hidden=filter.dataset.filter!=='all'&&n.dataset.state!==filter.dataset.filter);}
 if(event.target.closest('[data-demo]')){document.querySelectorAll('.menu').forEach(n=>n.hidden=true);document.querySelectorAll('.more').forEach(n=>n.setAttribute('aria-expanded','false'));const notice=document.getElementById('status');notice.textContent='Mockup only';notice.hidden=false;setTimeout(()=>notice.hidden=true,1500);}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){document.querySelectorAll('.menu').forEach(n=>n.hidden=true);document.querySelectorAll('.more').forEach(n=>n.setAttribute('aria-expanded','false'));}});
</script></body></html>
