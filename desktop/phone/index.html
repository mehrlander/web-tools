<!doctype html>
<html lang="en" class="h-full overflow-hidden [overflow-anchor:none] has-[#detail:not([hidden])]:h-auto has-[#detail:not([hidden])]:overflow-visible">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Now | Web Tools</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/phone-ui.css">
  <link rel="stylesheet" href="/phone-usage.css">
  <script src="/vendor/tailwind.js"></script>
  <script src="/vendor/claude-mark.js"></script>
  <script src="/vendor/assistant-mark.js"></script>
  <script src="/vendor/title-tip.js" defer></script>
  <script src="/vendor/panel-tip.js" defer></script>
  <script src="/phone-info.js" defer></script>
  <script src="/vendor/marked.js" defer></script>
  <script src="/vendor/purify.js" defer></script>
  <script src="/vendor/swipe-deck.js" defer></script>
  <script src="/now-shared.js" defer></script>
  <script src="/usage-view.js" defer></script>
  <script src="/recent-usage.js" defer></script>
  <script src="/phone-usage.js" defer></script>
  <script src="/reading.js" defer></script>
  <script src="/errands-view.js" defer></script>
  <script src="/computer.js" defer></script>
  <script src="/devices.js" defer></script>
  <script src="/local-files.js" defer></script>
  <script src="/repositories.js" defer></script>
  <script src="/views.js" defer></script>
  <script src="/phone.js" defer></script>
</head>
<body class="m-0 h-full min-h-dvh overflow-hidden has-[#detail:not([hidden])]:h-auto has-[#detail:not([hidden])]:overflow-visible bg-stone-100 font-sans text-stone-900 antialiased">
  <main id="overview" class="flex h-dvh min-h-0 flex-col overflow-hidden [&[hidden]]:hidden">
    <header class="sticky flex-none top-0 z-10 border-b border-stone-200 bg-stone-100">
      <div class="flex items-center justify-between gap-2 px-3 py-1">
        <div class="flex min-w-0 items-center gap-2"><button id="repository-back" hidden aria-label="Back to Repositories" class="flex size-7 shrink-0 items-center justify-center text-emerald-800"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><img id="app-mark" src="/icon.svg" class="size-6" alt=""><div class="min-w-0"><h1><button id="view-picker" aria-expanded="false" aria-controls="view-menu" class="flex min-h-7 max-w-full items-center gap-1 text-lg font-semibold"><span id="view-title" class="truncate">Now</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" class="size-3 text-stone-500" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button></h1><p id="machine" class="truncate text-[10px] text-stone-500">Your laptop</p></div></div>
        <div id="connection" role="status" class="ml-auto text-[10px] text-stone-500">Connecting…</div>
        <a id="remote-launch" href="shortcuts://run-shortcut?name=Open-Windows" aria-label="Open Windows App using Open-Windows" title="Open Windows App (Open-Windows)" class="flex size-9 shrink-0 items-center justify-center rounded-full border border-stone-200 bg-white text-sky-800"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="size-5" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21h8m-4-5v5m-5-11h10m-3-3 3 3-3 3"/></svg></a>
        <a id="web-tools-link" href="https://mehrlander.github.io/web-tools/app/?view=sessions" target="_blank" rel="noopener noreferrer" aria-label="Open sessions in Web Tools" class="flex size-9 shrink-0 items-center justify-center rounded-full border border-stone-200 bg-white text-stone-600"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="size-5" aria-hidden="true"><path d="M14 4h6v6M20 4 10 14M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1-1v-5"/></svg></a>
      </div>
      <nav id="view-menu" hidden role="menu" aria-label="Choose view" class="absolute left-3 top-12 z-20 w-44 rounded-xl border border-stone-200 bg-white p-1 shadow-lg"><button role="menuitemradio" data-view="now" aria-current="page" aria-checked="true" class="block min-h-11 w-full rounded-lg px-3 text-left text-sm">Now</button><button role="menuitemradio" data-view="usage" aria-checked="false" class="block min-h-11 w-full rounded-lg px-3 text-left text-sm">Usage</button><button role="menuitemradio" data-view="errands" aria-checked="false" class="block min-h-11 w-full rounded-lg px-3 text-left text-sm">Errands</button><button role="menuitemradio" data-view="computer" aria-checked="false" class="block min-h-11 w-full rounded-lg px-3 text-left text-sm">Computer</button><button role="menuitemradio" data-view="files" aria-checked="false" class="block min-h-11 w-full rounded-lg px-3 text-left text-sm">Files</button><button role="menuitem" data-sync-status="menu" class="block min-h-11 w-full rounded-lg px-3 text-left text-sm">Connection status</button><button role="menuitem" data-interface-refresh class="flex min-h-11 w-full items-center justify-between gap-3 rounded-lg px-3 text-left text-sm"><span>Refresh</span><span data-interface-version class="text-xs text-stone-400">v26.18</span></button></nav>
    </header>
    <div id="view-track" aria-label="Main views" class="flex min-h-0 min-w-0 flex-1 snap-x snap-mandatory overflow-x-auto overflow-y-hidden overscroll-x-contain [scrollbar-width:none] [&::-webkit-scrollbar]:hidden [&_pre]:overscroll-x-contain [&_[data-panel-scroll]]:overscroll-x-contain [&_[data-no-swipe]]:overscroll-x-contain">
      <section id="panel-now" data-slide="now" class="view-panel h-full w-full min-w-0 grow-0 shrink-0 basis-full snap-start snap-always overflow-x-hidden overflow-y-auto overscroll-y-contain [overflow-anchor:none]" aria-label="Now" aria-hidden="false">
        <nav id="assistants" aria-label="Filter by assistant" class="grid grid-cols-3 border-b border-stone-200"></nav>
        <div id="notice" class="empty:hidden border-b border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-900"></div>
        <div id="content" class="pb-8"><p class="p-4 text-base text-stone-500">Reading current activity…</p></div>
        <footer id="source-times" class="px-4 pb-8 text-xs leading-5 text-stone-500"></footer>
      </section>
      <section id="panel-usage" data-slide="usage" class="view-panel h-full w-full min-w-0 grow-0 shrink-0 basis-full snap-start snap-always overflow-x-hidden overflow-y-auto overscroll-y-contain [overflow-anchor:none]" aria-label="Usage" aria-hidden="true" inert>
        <div id="usage" class="pb-8"><p class="p-4 text-sm text-stone-500">Reading account usage…</p></div>
      </section>
      <section id="panel-errands" data-slide="errands" class="view-panel h-full w-full min-w-0 grow-0 shrink-0 basis-full snap-start snap-always overflow-x-hidden overflow-y-auto overscroll-y-contain [overflow-anchor:none]" aria-label="Errands" aria-hidden="true" inert><div id="errands" class="pb-8"></div></section>
      <section id="panel-computer" data-slide="computer" class="view-panel h-full w-full min-w-0 grow-0 shrink-0 basis-full snap-start snap-always overflow-x-hidden overflow-y-auto overscroll-y-contain [overflow-anchor:none]" aria-label="Computer" aria-hidden="true" inert>
        <section id="computer" aria-label="Computer" class="pb-4"></section>
        <section id="devices" aria-label="Devices" class="pb-8"></section>
      </section>
      <section id="panel-files" data-slide="files" class="view-panel h-full w-full min-w-0 grow-0 shrink-0 basis-full snap-start snap-always overflow-x-hidden overflow-y-auto overscroll-y-contain [overflow-anchor:none]" aria-label="Files" aria-hidden="true" inert><section id="repositories" aria-label="Files" class="pb-8"></section></section>
    </div>
  </main>
  <section id="detail" hidden class="min-h-dvh bg-white" aria-label="Selected activity"></section>
</body>
</html>
