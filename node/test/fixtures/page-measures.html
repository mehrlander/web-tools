<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page measures fixture</title>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
</head>
<body class="p-4">
<!--
  Known-bad page for node/test/page-measures.mjs: one planted defect per
  measure in node/render/measure.mjs, and beside each a near miss that must
  not fire. Loads its libraries the way the pages do, so the measures run
  against real Tailwind, daisyUI and Phosphor rather than a stand-in.
-->
<section class="flex flex-col gap-2">
  <div id="too-wide" class="w-[1400px] h-4 bg-base-300"></div>
  <i id="blank-icon" class="ph ph-not-a-real-glyph"></i>
  <table id="empty-table"><thead><tr><th>Name</th></tr></thead><tbody></tbody></table>
  <p id="unstyled" class="[font-family:initial]">Text the design system never reached.</p>
  <div id="flat-prose" class="prose !max-w-none"><h2>Heading</h2><p>Body text the same size.</p></div>
  <div id="stat-card" class="stats"><div class="stat"><div class="stat-value">42</div></div></div>
  <div id="daisy-tip" class="tooltip" data-tip="hint">hover</div>
</section>
<section class="flex flex-col gap-2">
  <div class="overflow-x-auto"><div id="scrolls-wide" class="w-[1400px] h-4 bg-base-200"></div></div>
  <i id="real-icon" class="ph ph-gear"></i>
  <table id="full-table"><thead><tr><th>Name</th></tr></thead><tbody><tr><td>row</td></tr></tbody></table>
  <span id="custom-stat" class="stat">a class that happens to be called stat</span>
  <div class="prose !max-w-none"><h2 class="text-2xl">Heading</h2><p>Sized on purpose.</p></div>
</section>
</body>
</html>
