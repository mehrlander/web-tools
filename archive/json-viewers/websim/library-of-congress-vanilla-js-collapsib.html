<title>Library of Congress Vanilla JS Collapsible Tree with Attributes</title>
<style>

  .tree-node::after {

<body>
<div id="header">
  <h1>Library of Congress Vanilla JS Collapsible Tree with Attributes</h1>
</div>
<div id="treeContainer"></div>

<script>
class TreeNode {
  constructor(name, attributes = {}, children = []) {
    this.name = name;
    this.attributes = attributes;
    this.children = children;
  }
}

function createTreeFromDOM(element, depth = 0) {
  if (depth > 5) return null; // Limit depth to prevent excessive nesting
  
  const attributes = {};
  Array.from(element.attributes).forEach(attr => {
    attributes[attr.name] = attr.value;
  });

  const node = new TreeNode(element.tagName.toLowerCase(), attributes);
  
  Array.from(element.children).forEach(child => {
    const childNode = createTreeFromDOM(child, depth + 1);
    if (childNode) node.children.push(childNode);
  });
  
  return node;
}

function renderTree(node, container, isCompact = false) {
  const nodeElement = document.createElement('div');
  nodeElement.className = 'tree-node' + (isCompact ? ' compact-child' : '');

  const contentElement = document.createElement('div');
  contentElement.className = 'tree-content';
  
  if (node.children.length > 1) {
    const toggleIcon = document.createElement('span');
    toggleIcon.className = 'toggle-icon';
    toggleIcon.textContent = '+';
    contentElement.appendChild(toggleIcon);
  }

  const nameSpan = document.createElement('span');
  nameSpan.textContent = node.name;
  contentElement.appendChild(nameSpan);

  Object.entries(node.attributes).forEach(([key, value]) => {
    const attrSpan = document.createElement('span');
    attrSpan.className = 'attribute';
    attrSpan.textContent = ` ${key}="${value}"`;
    contentElement.appendChild(attrSpan);
  });

  nodeElement.appendChild(contentElement);

  if (node.children.length > 0) {
    const childrenContainer = document.createElement('div');
    childrenContainer.className = 'tree-children';

    if (node.children.length === 1) {
      const onlyChild = node.children[0];
      contentElement.appendChild(document.createTextNode(' > '));
      renderTree(onlyChild, contentElement, true);
    } else {
      node.children.forEach(child => {
        renderTree(child, childrenContainer, false);
      });
      nodeElement.appendChild(childrenContainer);
    }

    if (node.children.length > 1) {
      contentElement.addEventListener('click', (e) => {
        if (e.target === contentElement || e.target.classList.contains('toggle-icon') || e.target === nameSpan) {
          nodeElement.classList.toggle('collapsed');
          const toggleIcon = contentElement.querySelector('.toggle-icon');
          if (toggleIcon) {
            toggleIcon.textContent = nodeElement.classList.contains('collapsed') ? '+' : '-';
          }
        }
      });
    }
  }

  container.appendChild(nodeElement);
}

function fetchAndRenderTree() {
  fetch('https://www.loc.gov/')
    .then(response => response.text())
    .then(html => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      
      const root = createTreeFromDOM(doc.body);
      const treeContainer = document.getElementById('treeContainer');
      renderTree(root, treeContainer);
    })
    .catch(error => console.error('Error fetching LOC website:', error));
}

fetchAndRenderTree();
</script>
</body>
