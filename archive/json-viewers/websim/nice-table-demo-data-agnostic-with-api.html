<title>Nice Table Demo - Data-Agnostic with API and Object Data Support</title>
<script>
class NiceTable extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.currentSort = { column: null, direction: 'asc' };
    this.data = [];
    this.columns = [];
  }

  async connectedCallback() {
    this.render();
  }

  async fetchDataFromAPI(url, searchTerm = '') {
    try {
      const apiUrl = `${url}${encodeURIComponent(searchTerm)}`;
      const response = await fetch(apiUrl);

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();
      this.setData(data.docs || data);
    } catch (error) {
      console.error("Error fetching or parsing data:", error);
      this.renderError(error);
    }
  }

  setDataFromObject(data) {
    this.setData(data);
  }

  setData(data) {
    if (!Array.isArray(data) || data.length === 0) {
      this.renderError(new Error("No data found or invalid data format"));
      return;
    }

    this.data = data;
    this.columns = Object.keys(this.data[0]);
    this.renderTable();
  }

  setColumns(columns) {
    this.columns = columns;
    this.renderTable();
  }

  render() {
    this.shadowRoot.innerHTML = `
      <style>
        :host {
          display: block;
          font-family: Arial, sans-serif;
        }
        table {
          border-collapse: separate;
          border-spacing: 0;
          width: 100%;
          margin-top: 20px;
        }
        th, td {
          border: 1px solid #ddd;
          padding: 8px;
          text-align: left;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        th {
          background-color: #f2f2f2;
          font-weight: bold;
          cursor: pointer;
          user-select: none;
          position: relative;
        }
        th::after {
          content: '↕';
          margin-left: 5px;
          opacity: 0.5;
        }
        th.sort-asc::after {
          content: '↑';
          opacity: 1;
        }
        th.sort-desc::after {
          content: '↓';
          opacity: 1;
        }
        tr:nth-child(even) {
          background-color: #f9f9f9;
        }
        tr:hover {
          background-color: #f5f5f5;
        }
        tr.selected {
          background-color: #e6f3ff;
        }
        .resize-handle {
          position: absolute;
          top: 0;
          right: -3px;
          bottom: 0;
          width: 6px;
          cursor: col-resize;
          user-select: none;
          background-color: transparent;
        }
        .resize-handle:hover {
          background-color: #0066cc;
        }
        #selectedRowData {
          margin-top: 20px;
          padding: 10px;
          background-color: #f0f0f0;
          border: 1px solid #ddd;
          border-radius: 4px;
          white-space: pre-wrap;
          font-family: monospace;
        }
      </style>
      <div id="tableContainer"></div>
      <div id="selectedRowData"></div>
    `;
  }

  renderTable() {
    if (!this.data.length) return;

    const tableHTML = `
      <table>
        <thead>
          <tr>${this.columns.map(header => `<th>${header}<div class="resize-handle"></div></th>`).join('')}</tr>
        </thead>
        <tbody>
          ${this.data.map((row, index) => `
            <tr data-index="${index}">
              ${this.columns.map(column => `<td>${row[column] || ''}</td>`).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;

    this.shadowRoot.getElementById('tableContainer').innerHTML = tableHTML;
    this.setupSorting();
    this.setupResizing();
    this.setupRowSelection();
  }

  setupSorting() {
    const ths = this.shadowRoot.querySelectorAll('th');
    ths.forEach((th, index) => {
      th.addEventListener('click', (e) => {
        if (e.target.classList.contains('resize-handle')) return;
        this.sortTable(index);
      });
    });
  }

  setupResizing() {
    const table = this.shadowRoot.querySelector('table');
    const cols = table.querySelectorAll('th');

    [].forEach.call(cols, (col) => {
      const resizer = col.querySelector('.resize-handle');
      this.createResizableColumn(col, resizer);
    });
  }

  setupRowSelection() {
    const tbody = this.shadowRoot.querySelector('tbody');
    tbody.addEventListener('click', (e) => {
      const tr = e.target.closest('tr');
      if (tr) {
        this.selectRow(tr);
      }
    });
  }

  selectRow(tr) {
    const selectedRows = this.shadowRoot.querySelectorAll('tr.selected');
    selectedRows.forEach(row => row.classList.remove('selected'));
    tr.classList.add('selected');

    const index = tr.dataset.index;
    const rowData = this.data[index];
    this.displayRowData(rowData);
  }

  displayRowData(rowData) {
    const selectedRowDataElement = this.shadowRoot.getElementById('selectedRowData');
    selectedRowDataElement.textContent = JSON.stringify(rowData, null, 2);
  }

  createResizableColumn(col, resizer) {
    let startX, startWidth;

    const doDrag = (e) => {
      col.style.width = `${startWidth + e.clientX - startX}px`;
    };

    const stopDrag = (e) => {
      document.documentElement.removeEventListener('mousemove', doDrag, false);
      document.documentElement.removeEventListener('mouseup', stopDrag, false);
    };

    const initDrag = (e) => {
      startX = e.clientX;
      startWidth = parseInt(document.defaultView.getComputedStyle(col).width, 10);
      document.documentElement.addEventListener('mousemove', doDrag, false);
      document.documentElement.addEventListener('mouseup', stopDrag, false);
    };

    resizer.addEventListener('mousedown', initDrag, false);
  }

  sortTable(columnIndex) {
    const table = this.shadowRoot.querySelector('table');
    const tbody = table.querySelector('tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    const ths = this.shadowRoot.querySelectorAll('th');

    if (this.currentSort.column === columnIndex) {
      this.currentSort.direction = this.currentSort.direction === 'asc' ? 'desc' : 'asc';
    } else {
      this.currentSort = { column: columnIndex, direction: 'asc' };
    }

    ths.forEach(th => th.classList.remove('sort-asc', 'sort-desc'));
    ths[columnIndex].classList.add(`sort-${this.currentSort.direction}`);

    const columnName = this.columns[columnIndex];

    this.data.sort((a, b) => {
      const aValue = a[columnName];
      const bValue = b[columnName];

      if (this.currentSort.direction === 'asc') {
        return this.compareValues(aValue, bValue);
      } else {
        return this.compareValues(bValue, aValue);
      }
    });

    this.renderTable();
  }

  compareValues(a, b) {
    if (typeof a === 'string' && typeof b === 'string') {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    }
    if (a < b) return -1;
    if (a > b) return 1;
    return 0;
  }

  renderError(error) {
    this.shadowRoot.getElementById('tableContainer').innerHTML = `
      <p style="color: red;">Error: ${error.message}</p>
    `;
  }
}

customElements.define('nice-table', NiceTable);
</script>
</head>
