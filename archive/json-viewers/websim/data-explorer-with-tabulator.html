<!-- WebSim (whitecloud export, home chron/2026/07/2026-07-06-websim-account-export.zip): Astronomical Data Explorer -->
<title>Astronomical Data Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet">
<script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
</head>
<body class="bg-white">

<div x-data="{ 
  loading: false,
  stats: {
    total: 0,
    filtered: 0
  }
}" class="container mx-auto px-4 py-4">
    
    <div class="mb-4">
        <h1 class="text-2xl font-serif">Astronomical Objects Database</h1>
        <p class="text-sm text-gray-600 font-serif">Exoplanet Archive Data</p>
    </div>

    <div class="flex gap-2 mb-4">
        <button @click="refreshData()" 
                class="px-3 py-1 border border-gray-300 text-sm hover:bg-gray-50">
            Refresh Data
        </button>
        <button @click="downloadCSV()" 
                class="px-3 py-1 border border-gray-300 text-sm hover:bg-gray-50">
            Export CSV
        </button>
    </div>

    <div x-show="loading" class="flex items-center space-x-2 my-2">
        <div class="animate-spin h-4 w-4 border-2 border-gray-500 rounded-full border-t-transparent"></div>
        <span class="text-sm text-gray-600">Loading data...</span>
    </div>

    <div class="border border-gray-200">
        <div id="data-table"></div>
    </div>

    <div class="mt-2 text-xs text-gray-500">
        Total Records: <span x-text="stats.total"></span> | 
        Filtered: <span x-text="stats.filtered"></span>
    </div>
</div>

<script>
let table;

document.addEventListener('DOMContentLoaded', function() {
    table = new Tabulator("#data-table", {
        height: "700px",
        layout: "fitColumns",
        pagination: "local",
        paginationSize: 50,
        columns: [
            {title: "Planet Name", field: "pl_name", sorter: "string"},
            {title: "Host Star", field: "hostname", sorter: "string"},
            {title: "Discovery Method", field: "disc_method", sorter: "string"},
            {title: "Discovery Year", field: "disc_year", sorter: "number"},
            {title: "Planet Mass (Jupiter)", field: "pl_bmassj", sorter: "number", formatter: "number", formatterParams: {precision: 3}},
            {title: "Orbital Period (days)", field: "pl_orbper", sorter: "number", formatter: "number", formatterParams: {precision: 2}},
            {title: "Distance (pc)", field: "sy_dist", sorter: "number", formatter: "number", formatterParams: {precision: 1}},
            {title: "Star Temperature (K)", field: "st_teff", sorter: "number", formatter: "number", formatterParams: {precision: 0}},
            {title: "Star Mass (Solar)", field: "st_mass", sorter: "number", formatter: "number", formatterParams: {precision: 2}}
        ],
        dataLoaded: function(data) {
            const alpine = document.querySelector('[x-data]').__x.$data;
            alpine.stats.total = data.length;
            alpine.stats.filtered = data.length;
        },
        dataFiltered: function(filters, rows) {
            const alpine = document.querySelector('[x-data]').__x.$data;
            alpine.stats.filtered = rows.length;
        }
    });

    loadData();
});

async function loadData() {
    const alpine = document.querySelector('[x-data]').__x.$data;
    try {
        alpine.loading = true;
        const response = await fetch('https://exoplanetarchive.ipac.caltech.edu/TAP/sync?query=select+pl_name,hostname,disc_method,disc_year,pl_bmassj,pl_orbper,sy_dist,st_teff,st_mass+from+ps&format=json');
        const data = await response.json();
        table.setData(data);
    } catch (error) {
        console.error('Error loading data:', error);
        alert('Error loading data. Please try again.');
    } finally {
        alpine.loading = false;
    }
}

function downloadCSV() {
    table.download("csv", "exoplanet_data.csv");
}

function refreshData() {
    loadData();
}
</script>

</body></html>
