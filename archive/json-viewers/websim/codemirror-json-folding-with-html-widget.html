<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMirror JSON Folding with HTML Widget Demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/fold/foldgutter.min.css">
<style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #editor { border: 1px solid #ccc; }
    .CodeMirror-foldmarker { color: blue; text-shadow: none; }
    .fold-widget { display: inline-flex; flex-wrap: wrap; gap: 4px; }
    .fold-widget-item { padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<h1>CodeMirror JSON Folding with HTML Widget Demo</h1>
<div id="editor"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/fold/brace-fold.min.js"></script>
<script>
    const jsonSample = `{
  "menu": {
    "id": "file",
    "value": "File",
    "popup": {
      "menuitem": [
        {"value": "New", "onclick": "CreateNewDoc()"},
        {"value": "Open", "onclick": "OpenDoc()"},
        {"value": "Close", "onclick": "CloseDoc()"}
      ]
    }
  },
  "examples": [
    {"name": "John", "age": 30},
    {"name": "Alice", "job": "Engineer"},
    {"name": "Bob", "hobby": "Reading"}
  ]
}`;

    function getRandomColor() {
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue}, 70%, 80%)`;
    }

    const editor = CodeMirror(document.getElementById("editor"), {
        value: jsonSample,
        mode: {name: "javascript", json: true},
        lineNumbers: true,
        lineWrapping: true,
        foldGutter: true,
        gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
        extraKeys: {"Ctrl-Q": function(cm){ cm.foldCode(cm.getCursor()); }},
        foldOptions: {
            widget: (from, to) => {
                let content;
                let startToken = '{', endToken = '}';
                const prevLine = editor.getLine(from.line);
                const isArray = prevLine.lastIndexOf('[') > prevLine.lastIndexOf('{');
                if (isArray) {
                    startToken = '[', endToken = ']';
                }
                const internal = editor.getRange(from, to);
                const toParse = startToken + internal + endToken;
                try {
                    const parsed = JSON.parse(toParse);
                    if (isArray && Array.isArray(parsed)) {
                        const properties = new Set();
                        parsed.forEach(item => {
                            if (typeof item === 'object' && item !== null) {
                                Object.keys(item).forEach(key => properties.add(key));
                            }
                        });
                        content = Array.from(properties);
                    } else if (typeof parsed === 'object' && parsed !== null) {
                        content = Object.keys(parsed);
                    } else {
                        return document.createTextNode('\u2194');
                    }
                    
                    const container = document.createElement('span');
                    container.className = 'fold-widget';
                    content.forEach(item => {
                        const itemElement = document.createElement('span');
                        itemElement.className = 'fold-widget-item';
                        itemElement.textContent = item;
                        itemElement.style.backgroundColor = getRandomColor();
                        container.appendChild(itemElement);
                    });
                    return container;
                } catch(e) {
                    return document.createTextNode('\u2194'); // fallback to double arrow if parsing fails
                }
            }
        }
    });

    // Fold all foldable sections on load
    editor.operation(() => {
        for (let i = 0; i < editor.lineCount(); i++) {
            editor.foldCode(CodeMirror.Pos(i, 0));
        }
    });
</script>
</body>
</html>
