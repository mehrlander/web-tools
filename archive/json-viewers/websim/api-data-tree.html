<!-- WebSim (whitecloud export, home chron/2026/07/2026-07-06-websim-account-export.zip): api-data-tree -->
  <!-- AlpineJS and Pico CSS for minimal styling -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@1/css/pico.min.css">
  
  <style>
    .tree-item {
      margin-left: 1.5rem;
      border-left: 1px solid #ccc;
      padding-left: 1rem;
      transition: all 0.3s ease;
    }
    
    .toggle-btn {
      cursor: pointer;
      user-select: none;
      padding: 0.2rem 0.5rem;
      margin: 0.2rem 0;
      border-radius: 4px;
    }
    
    .toggle-btn:hover {
      background: #f0f0f0;
    }
    
    .toggle-icon {
      display: inline-block;
      transition: transform 0.3s ease;
    }
    
    .rotate {
      transform: rotate(90deg);
    }
    
    [x-cloak] {
      display: none !important;
    }
    
    .loading {
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>API Data Tree</h1>
    
    <div x-data="treeData()" x-cloak>
      <!-- Loading state -->
      <div x-show="loading" class="loading">Loading data...</div>
      
      <!-- Error state -->
      <div x-show="error" class="error" style="color: red;">
        {{ error }}
      </div>
      
      <!-- Tree container -->
      <div x-show="!loading && !error">
        <template x-for="(item, index) in data" :key="index">
          <div class="tree-node">
            <div 
              class="toggle-btn"
              @click="toggleNode(item)"
              :class="{ 'has-children': item.children && item.children.length }">
              <span 
                x-show="item.children && item.children.length"
                class="toggle-icon"
                :class="{ 'rotate': item.isOpen }">
                ▶
              </span>
              <span x-text="item.name"></span>
            </div>
            
            <div 
              x-show="item.isOpen"
              x-transition
              class="tree-item">
              <template x-for="(child, childIndex) in item.children" :key="childIndex">
                <div>
                  <span x-text="child.name"></span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>

  <script>
    function treeData() {
      return {
        data: [],
        loading: true,
        error: null,
        
        async init() {
          try {
            // Example API call - replace with your actual API endpoint
            const response = await fetch('https://api.example.com/tree-data');
            if (!response.ok) throw new Error('Failed to fetch data');
            
            let rawData = await response.json();
            // Transform the data to include isOpen property
            this.data = this.processData(rawData);
            this.loading = false;
          } catch (err) {
            this.error = err.message;
            this.loading = false;
          }
        },
        
        processData(items) {
          return items.map(item => ({
            ...item,
            isOpen: false,
            children: item.children ? this.processData(item.children) : []
          }));
        },
        
        toggleNode(item) {
          if (item.children && item.children.length) {
            item.isOpen = !item.isOpen;
          }
        }
      }
    }
    
    // Sample data for demonstration (remove this when using real API)
    window.addEventListener('DOMContentLoaded', () => {
      // Mock API response
      window.fetch = async () => ({
        ok: true,
        json: async () => ([
          {
            name: "Root Item 1",
            children: [
              { name: "Child 1.1" },
              { name: "Child 1.2" },
              { 
                name: "Child 1.3",
                children: [
                  { name: "Grandchild 1.3.1" },
                  { name: "Grandchild 1.3.2" }
                ]
              }
            ]
          },
          {
            name: "Root Item 2",
            children: [
              { name: "Child 2.1" },
              { name: "Child 2.2" }
            ]
          }
        ])
      });
    });
  </script>
</body></html>
