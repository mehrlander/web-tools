  <script>
    async function pasteXML() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('xmlContent').textContent = text.trim();
        parseXML();
      } catch (err) {
        console.error('Failed to read clipboard:', err);
        alert('Please grant clipboard permission or paste manually');
      }
    }

    function parseXML() {
      const xmlString = document.getElementById('xmlContent').textContent.trim();
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
      
      const treeData = xmlToTreeData(xmlDoc.documentElement);
      
      $('#tree').fancytree({
        source: treeData,
        activate: function(event, data) {
          var node = data.node;
        },
        renderNode: function(event, data) {
        }
      });
    }

    function xmlToTreeData(node) {
      const result = {
        title: node.nodeName,
        children: []
      };

      if (node.attributes && node.attributes.length > 0) {
        for (let i = 0; i < node.attributes.length; i++) {
          const attr = node.attributes[i];
          result.children.push({
            title: `@${attr.name}: ${attr.value}`,
            icon: false
          });
        }
      }

      if (node.childNodes.length === 1 && node.childNodes[0].nodeType === Node.TEXT_NODE) {
        const trimmedText = node.textContent.trim();
        if (trimmedText) {
          result.title += ': ' + trimmedText;
        }
      } else {
        for (let i = 0; i < node.childNodes.length; i++) {
          const child = node.childNodes[i];
          if (child.nodeType === Node.ELEMENT_NODE) {
            result.children.push(xmlToTreeData(child));
          }
        }
      }

      return result;
    }
  </script>
