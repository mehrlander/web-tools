<!-- WebSim (whitecloud export, home chron/2026/07/2026-07-06-websim-account-export.zip): elegant-tree-view-component-3 -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .json-tree-view .nested {
    display: none;
  }
  .json-tree-view .active {
    display: block;
  }
  .json-tree-view .wrap-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .json-tree-view .collapsible {
    transition: background-color 0.3s ease;
    background-color: rgba(91, 127, 149, 0.05);
    border-radius: 2px;
    padding: 1px 2px;
    margin: 1px 0;
  }
  .json-tree-view .collapsible.expanded {
    background-color: rgba(91, 127, 149, 0.1);
  }
  .json-tree-view .ml-3 {
    margin-left: 0.5rem;
  }
  .json-tree-view .row {
    line-height: 1.2;
  }
  .json-tree-view .preview-container {
    overflow-x: auto;
    white-space: nowrap;
    margin-left: 1rem;
  }
  .json-tree-view .preview-cell {
    display: inline-block;
    padding: 0 4px;
    margin-right: 2px;
    border-radius: 2px;
    font-size: 0.75rem;
  }
</style>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'mckinsey-blue': '#003767',
        'mckinsey-light-blue': '#5B7F95',
        'mckinsey-gray': '#54565A',
      },
    },
  },
}
</script>
</head>
<body class="bg-gray-50 p-4">
  <h1 class="text-xl font-light mb-4 text-mckinsey-blue">Elegant Tree View Component</h1>
  <div id="github-tree" class="mb-4"></div>
  <div id="starwars-tree"></div>

<script>
class JsonTreeView {
  constructor(data, isRoot = true) {
    this.data = data;
    this.isRoot = isRoot;
    this.element = document.createElement('div');
    this.element.className = 'json-tree-view bg-white border border-gray-200 rounded-sm shadow-sm p-2';
    this.colorPalette = [
      'bg-red-200', 'bg-blue-200', 'bg-green-200', 'bg-yellow-200', 'bg-purple-200',
      'bg-pink-200', 'bg-indigo-200', 'bg-gray-200', 'bg-orange-200', 'bg-teal-200'
    ];
    this.render();
    this.addEventListeners();
  }

  render() {
    this.element.innerHTML = this.generateHtml(this.data, '', this.isRoot);
  }

  generateHtml(obj, key = '', isRoot = false) {
    if (Array.isArray(obj)) {
      return this.generateArrayHtml(obj, key, isRoot);
    } else if (typeof obj === 'object' && obj !== null) {
      return this.generateObjectHtml(obj, key, isRoot);
    } else {
      return this.generateLeafHtml(obj, key);
    }
  }

  generateArrayHtml(arr, key, isRoot) {
    let preview = this.generateArrayPreview(arr);
    let html = `<div class="${isRoot ? '' : 'ml-3'}">
      <div class="flex items-center cursor-pointer collapsible wrap-text row">
        <div class="w-2 h-2 mr-1 flex-shrink-0 transition-transform duration-200 transform rotate-0 text-mckinsey-light-blue">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
          </svg>
        </div>
        <div>
          <span class="font-semibold text-mckinsey-blue text-xs">${key}</span>
          <span class="text-mckinsey-gray text-xs">[</span>
        </div>
      </div>
      <div class="preview-container">${preview}</div>
      <div class="nested ${isRoot ? '' : 'ml-3'}">`;
    arr.forEach((item, index) => {
      html += this.generateHtml(item, index, false);
    });
    html += `</div></div>`;
    return html;
  }

  generateObjectHtml(obj, key, isRoot) {
    let preview = this.generateObjectPreview(obj);
    let html = `<div class="${isRoot ? '' : 'ml-3'}">
      <div class="flex items-center cursor-pointer collapsible wrap-text row">
        <div class="w-2 h-2 mr-1 flex-shrink-0 transition-transform duration-200 transform rotate-0 text-mckinsey-light-blue">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
          </svg>
        </div>
        <div>
          <span class="font-semibold text-mckinsey-blue text-xs">${key}</span>
          <span class="text-mckinsey-gray text-xs">{</span>
        </div>
      </div>
      <div class="preview-container">${preview}</div>
      <div class="nested ${isRoot ? '' : 'ml-3'}">`;
    for (let [k, v] of Object.entries(obj)) {
      html += this.generateHtml(v, k, false);
    }
    html += `</div></div>`;
    return html;
  }

  generateObjectPreview(obj) {
    let preview = '';
    let index = 0;
    for (let [k, v] of Object.entries(obj)) {
      let value = typeof v === 'object' ? (Array.isArray(v) ? '[ ... ]' : '{ ... }') : JSON.stringify(v);
      let colorClass = this.colorPalette[index % this.colorPalette.length];
      preview += `<span class="preview-cell ${colorClass}">${value}</span>`;
      index++;
    }
    return preview;
  }

  generateArrayPreview(arr) {
    let preview = '';
    arr.forEach((item, index) => {
      let value = typeof item === 'object' ? (Array.isArray(item) ? '[ ... ]' : '{ ... }') : JSON.stringify(item);
      let colorClass = this.colorPalette[index % this.colorPalette.length];
      preview += `<span class="preview-cell ${colorClass}">${value}</span>`;
    });
    return preview;
  }

  generateLeafHtml(value, key) {
    let type = typeof value;
    if (value === null) type = 'null';
    let valueClass = {
      'string': 'text-green-700',
      'number': 'text-purple-700',
      'boolean': 'text-red-700',
      'null': 'text-gray-500'
    }[type] || 'text-mckinsey-gray';
    return `<div class="wrap-text row"><span class="font-semibold text-mckinsey-blue text-xs">${key}:</span> <span class="${valueClass} text-xs">${JSON.stringify(value)}</span></div>`;
  }

  addEventListeners() {
    this.element.addEventListener('click', (event) => {
      if (event.target.closest('.collapsible')) {
        const collapsible = event.target.closest('.collapsible');
        const arrow = collapsible.querySelector('svg');
        const content = collapsible.nextElementSibling.nextElementSibling;
        const preview = collapsible.nextElementSibling;
        
        arrow.classList.toggle('rotate-90');
        content.classList.toggle('active');
        preview.classList.toggle('hidden');
        collapsible.classList.toggle('expanded');
      }
    });
  }
}

document.addEventListener('DOMContentLoaded', () => {
  fetch("https://api.github.com/repositories").then(async (response) => {
    const githubData = await response.json();
    document.getElementById('github-tree').appendChild(new JsonTreeView(githubData).element);
  });

  fetch("https://swapi.dev/api/people/").then(async (response) => {
    const starwarsData = await response.json();
    document.getElementById('starwars-tree').appendChild(new JsonTreeView(starwarsData).element);
  });
});
</script>
</body></html>
