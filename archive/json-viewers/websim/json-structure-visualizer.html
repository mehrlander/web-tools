        .link {
            fill: none;
        }
        .tp-dfwv {
            z-index: 1000 !important;
        }
        .text-left {
            padding-left: 1rem;
        }
    </style></head><body>
    <ion-app>
        <ion-header>
            <ion-toolbar>
                <ion-title>
                    <div class="text-left">
                        <h1 class="text-lg font-bold text-gray-800">JSON Structure</h1>
                        <h2 class="text-sm text-gray-600">D3 Visualization</h2>
                    </div>
                </ion-title>
            </ion-toolbar>
        </ion-header>

        <ion-content>
            <div id="diagram-container" class="h-full bg-white">
                <svg id="diagram-svg" class="w-full h-full"></svg>
            </div>
        </ion-content>

        <ion-footer>
            <ion-toolbar>
                <div class="p-4 h-32 overflow-y-auto">
                    <div class="flex items-center space-x-2 mb-2">
                        <div id="breadcrumb-path" class="text-sm text-gray-600 break-all flex-grow"></div>
                        <ion-button fill="clear" size="small" onclick="navigateSelection('prev')">
                            <ion-icon slot="icon-only" name="chevron-back"></ion-icon>
                        </ion-button>
                        <ion-button fill="clear" size="small" onclick="navigateSelection('next')">
                            <ion-icon slot="icon-only" name="chevron-forward"></ion-icon>
                        </ion-button>
                    </div>
                    <div id="node-info-text" class="text-sm text-gray-600 break-all"></div>
                </div>
            </ion-toolbar>
        </ion-footer>
    </ion-app>

    <script>
    let jsonData;
    let selectedNode = null;
    let params = {
        layout: 'curveHorizontal',
        separation: 1,
        nodeTypes: {
            object: { width: 10, height: 10, fill: false, color: '#4e79a7', alpha: 1, strokeWidth: 1, borderRadius: 2 },
            array: { width: 10, height: 10, fill: false, color: '#f28e2c', alpha: 1, strokeWidth: 1, borderRadius: 2 },
            string: { width: 6, height: 6, fill: true, color: '#e15759', alpha: 1, strokeWidth: 1, borderRadius: 2 },
            number: { width: 6, height: 6, fill: true, color: '#76b7b2', alpha: 1, strokeWidth: 1, borderRadius: 2 },
            boolean: { width: 6, height: 6, fill: true, color: '#59a14f', alpha: 1, strokeWidth: 1, borderRadius: 2 },
            null: { width: 6, height: 6, fill: true, color: '#edc949', alpha: 1, strokeWidth: 1, borderRadius: 2 }
        }
    };

    async function fetchAndVisualizeJSON() {
        try {
            const response = await fetch('https://api.artic.edu/api/v1/artworks/');
            jsonData = await response.json();
            visualizeJSON();
        } catch (error) {
            console.error('Error fetching JSON:', error);
        }
    }

    function visualizeJSON() {
        const layout = params.layout;

        d3.select("#diagram-svg").selectAll("*").remove();

        const width = document.getElementById('diagram-container').clientWidth;
        const height = document.getElementById('diagram-container').clientHeight;

        const svg = d3.select("#diagram-svg")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g");

        const root = d3.hierarchy(convertToTreeStructure(jsonData));

        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        if (layout === 'radial') {
            visualizeRadialTree(root, g, width, height);
        } else {
            visualizeHorizontalTree(root, g, width, height);
        }

        updateNodeAppearance();
    }

    function visualizeHorizontalTree(root, g, width, height) {
        const tree = d3.tree().size([height - 40, width - 160])
            .separation((a, b) => (a.parent == b.parent ? 1 : params.separation) / a.depth);

        const data = tree(root);

        const link = g.selectAll(".link")
            .data(data.links())
            .enter().append("path")
            .attr("class", "link")
            .attr("d", d => {
                const source = [d.source.y, d.source.x];
                const target = [d.target.y, d.target.x];
                const midX = (source[0] + target[0]) / 2;
                return `M${source[0]},${source[1]}
                        C${midX},${source[1]}
                         ${midX},${target[1]}
                         ${target[0]},${target[1]}`;
            })
            .style("stroke", d => getLinkColor(d))
            .style("stroke-width", getLinkStrokeWidth);

        const node = g.selectAll(".node")
            .data(data.descendants())
            .enter().append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.y},${d.x})`);

        appendNodeShape(node);
    }

    function visualizeRadialTree(root, g, width, height) {
        const radius = Math.min(width, height) / 2 - 40;

        g.attr("transform", `translate(${width/2},${height/2})`);

        const tree = d3.tree()
            .size([2 * Math.PI, radius])
            .separation((a, b) => (a.parent == b.parent ? 1 : params.separation) / a.depth);

        const data = tree(root);

        const link = g.selectAll(".link")
            .data(data.links())
            .enter().append("path")
            .attr("class", "link")
            .attr("d", d3.linkRadial()
                .angle(d => d.x)
                .radius(d => d.y))
            .style("stroke", d => getLinkColor(d))
            .style("stroke-width", getLinkStrokeWidth);

        const node = g.selectAll(".node")
            .data(data.descendants())
            .enter().append("g")
            .attr("class", "node")
            .attr("transform", d => `
                rotate(${d.x * 180 / Math.PI - 90})
                translate(${d.y},0)
            `);

        appendNodeShape(node);
    }

    function appendNodeShape(node) {
        node.each(function(d) {
            const nodeParams = params.nodeTypes[d.data.type];
            const width = nodeParams.width;
            const height = nodeParams.height;
            const color = d3.color(nodeParams.color).copy({opacity: nodeParams.alpha});

            const shapeElement = d3.select(this).append('rect')
                .attr("class", "node-shape")
                .attr("width", width)
                .attr("height", height)
                .attr("rx", nodeParams.borderRadius)
                .attr("ry", nodeParams.borderRadius)
                .style("fill", nodeParams.fill ? color : 'none')
                .style("stroke", color)
                .style("stroke-width", nodeParams.fill ? 0 : nodeParams.strokeWidth);

            d3.select(this).on("click", (event, d) => {
                event.stopPropagation();
                selectNode(this);
            });
        });
    }

    function selectNode(node) {
        if (selectedNode) {
            unselectNode();
        }
        selectedNode = node;
        updateNodeAppearance();
        updateFooter(node.__data__);
    }

    function unselectNode() {
        if (selectedNode) {
            selectedNode = null;
            updateNodeAppearance();
            updateFooter(null);
        }
    }

    function updateNodeAppearance() {
        d3.selectAll(".node-shape")
            .style("opacity", d => selectedNode && d === selectedNode.__data__ ? 1 : 0.5)
            .attr("transform", function(d) {
                const nodeParams = params.nodeTypes[d.data.type];
                const scale = selectedNode && d === selectedNode.__data__ ? 1.2 : 1;
                return `translate(${-nodeParams.width * scale / 2},${-nodeParams.height * scale / 2}) scale(${scale})`;
            });

        d3.selectAll(".link")
            .style("opacity", d => {
                if (selectedNode) {
                    return (d.source === selectedNode.__data__ || d.target === selectedNode.__data__) ? 1 : 0.3;
                }
                return 0.5;
            })
            .style("stroke-width", getLinkStrokeWidth);
    }

    function convertToTreeStructure(obj, name = "root", path = "") {
        const result = { name: name, path: path };
        if (Array.isArray(obj)) {
            result.type = "array";
            result.children = obj.map((value, index) => 
                convertToTreeStructure(value, `[${index}]`, `${path}[${index}]`)
            );
        } else if (typeof obj === "object" && obj !== null) {
            result.type = "object";
            result.children = Object.entries(obj).map(([key, value]) => 
                convertToTreeStructure(value, key, path ? `${path}.${key}` : key)
            );
        } else {
            result.type = typeof obj;
            if (obj === null) result.type = "null";
            result.value = obj;
        }
        return result;
    }

    function getNodeColor(type) {
        return params.nodeTypes[type].color;
    }

    function getLinkColor(d) {
        const nodeParams = params.nodeTypes[d.target.data.type];
        return d3.color(nodeParams.color).copy({opacity: nodeParams.alpha * 0.5});
    }

    function getLinkStrokeWidth(d) {
        const baseWidth = params.nodeTypes[d.target.data.type].strokeWidth;
        return selectedNode && (d.source === selectedNode.__data__ || d.target === selectedNode.__data__) ? baseWidth * 1.5 : baseWidth;
    }

    function updateFooter(d) {
        const footer = document.getElementById('node-info-text');
        const breadcrumb = document.getElementById('breadcrumb-path');
        if (d) {
            let ancestors = [];
            let current = d;
            while (current) {
                ancestors.unshift(current);
                current = current.parent;
            }
            let breadcrumbContent = ancestors.map((ancestor, index) => {
                const color = getNodeColor(ancestor.data.type);
                return `<span class="cursor-pointer hover:underline" style="color: ${color}" onclick="selectNodeByPath('${ancestor.data.path}')">${ancestor.data.name || 'root'}</span>`;
            }).join(' > ');
            breadcrumb.innerHTML = breadcrumbContent;

            let content = '';
            if (d.data.value !== undefined) {
                const color = getNodeColor(d.data.type);
                content += `<span style="color: ${color}">${d.data.value}</span>`;
            }
            footer.innerHTML = content;
        } else {
            breadcrumb.innerHTML = '';
            footer.innerHTML = 'Select a node to view information';
        }
    }

    function selectNodeByPath(path) {
        const node = d3.select("#diagram-svg")
            .selectAll(".node")
            .filter(d => d.data.path === path)
            .node();
        if (node) {
            selectNode(node);
        }
    }

    function navigateSelection(direction) {
        if (!selectedNode) return;

        const parent = selectedNode.__data__.parent;
        if (!parent) return;

        const siblings = parent.children;
        const currentIndex = siblings.indexOf(selectedNode.__data__);

        let newIndex;
        if (direction === 'prev') {
            newIndex = (currentIndex - 1 + siblings.length) % siblings.length;
        } else if (direction === 'next') {
            newIndex = (currentIndex + 1) % siblings.length;
        }

        const newNode = d3.select("#diagram-svg")
            .selectAll(".node")
            .filter(d => d === siblings[newIndex])
            .node();

        if (newNode) {
            selectNode(newNode);
        }
    }

    const pane = new Tweakpane.Pane({
        title: 'Visualization Options',
        expanded: false
    });

    const layoutFolder = pane.addFolder({ title: 'Layout', expanded: true });
    layoutFolder.addInput(params, 'layout', {
        options: {
            'Horizontal': 'curveHorizontal',
            'Radial': 'radial'
        }
    });
    layoutFolder.addInput(params, 'separation', { min: 0.5, max: 2, step: 0.1 });

    const nodeTypes = ['object', 'array', 'string', 'number', 'boolean', 'null'];
    nodeTypes.forEach(type => {
        const nodeFolder = pane.addFolder({ title: `${type.charAt(0).toUpperCase() + type.slice(1)} Node`, expanded: false });
        nodeFolder.addInput(params.nodeTypes[type], 'width', { min: 1, max: 20, step: 1 });
        nodeFolder.addInput(params.nodeTypes[type], 'height', { min: 1, max: 20, step: 1 });
        nodeFolder.addInput(params.nodeTypes[type], 'fill');
        nodeFolder.addInput(params.nodeTypes[type], 'color');
        nodeFolder.addInput(params.nodeTypes[type], 'alpha', { min: 0, max: 1, step: 0.1 });
        nodeFolder.addInput(params.nodeTypes[type], 'strokeWidth', { min: 0, max: 5, step: 0.1 });
        nodeFolder.addInput(params.nodeTypes[type], 'borderRadius', { min: 0, max: 10, step: 1 });
    });

    pane.on('change', () => visualizeJSON());

    const svg = d3.select("#diagram-svg");
    svg.on("click", (event) => {
        if (event.target.tagName === "svg") {
            unselectNode();
        }
    });

    fetchAndVisualizeJSON();
    </script>
</body></html>
