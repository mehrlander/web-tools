  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina DOM Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',sans-serif;font-size:14px;line-height:1.3}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
    .tree-node{padding:1px 0;margin:0;transition:all 0.15s;list-style-type:none}
    .tree-node:hover{background:#f9fafb}
    .node-content{display:flex;align-items:center;padding:2px;border-radius:3px;cursor:pointer}
    .tree-children{margin-left:5px;padding-left:13px;border-left:1px solid #f0f0f0}
    .active-node > .node-content{background-color:#edf5ff}
    .chevron{transition:transform 0.2s ease;display:inline-block}
    .chevron-open{transform:rotate(90deg)}
  </style>
</head>
<body class="bg-slate-50/70">
  <div x-data="treeViewer()" class="max-w-7xl mx-auto py-3 px-3">
    <div class="flex flex-col sm:flex-row items-center mb-3 gap-2">
      <h1 class="text-xl font-semibold bg-gradient-to-r from-slate-800 to-slate-600 bg-clip-text text-transparent">Lumina Explorer</h1>
      <div class="flex-1 flex items-center gap-2 w-full">
        <div class="relative flex-1">
          <input x-model="url" type="text" class="w-full pl-3 pr-7 py-1.5 text-sm border border-slate-300/80 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-slate-400/50" placeholder="https://example.com"/>
          <i class="ti ti-world absolute right-2 top-1/2 -translate-y-1/2 text-slate-400/80 text-sm"></i>
        </div>
        <button @click="fetchHtml()" class="px-3 py-1.5 bg-slate-800 text-white text-sm font-medium rounded-md shadow-sm">
          <i class="ti ti-subtask text-xs mr-1"></i>Analyze
        </button>
      </div>
    </div>
    <div id="treeContainer" class="bg-white/90 rounded-md shadow-md p-2 h-[85vh] overflow-auto border border-slate-200/50 text-xs"></div>
  </div>

  <script>
    function treeViewer(){
      return{
        url:'https://www.loc.gov',
        async fetchHtml(){
          try{
            const targetUrl=this.url.startsWith('http')?this.url:'https://'+this.url;
            const res=await fetch(targetUrl);
            const text=await res.text();
            const parser=new DOMParser();
            const doc=parser.parseFromString(text,'text/html');
            const tree=[buildTree(doc.documentElement)];
            renderTree(tree);
          }catch{
            document.getElementById('treeContainer').innerHTML='<div class="p-1 text-center text-rose-600 text-xs">Failed</div>';
          }
        }
      }
    }

    function buildTree(node){
      if(node.nodeType===Node.COMMENT_NODE)return null;
      if(node.nodeType===Node.TEXT_NODE){
        const text=node.textContent.trim();
        if(!text)return null;
        return{type:'text',label:`"${text.length>25?text.substring(0,22)+'...':text}"`,value:text};
      }
      const result={
        type:'element',
        label:node.tagName.toLowerCase(),
        value:{tag:node.tagName.toLowerCase(),attributes:{}},
        children:[]
      };
      if(node.attributes&&node.attributes.length>0){
        for(let i=0;i<node.attributes.length;i++){
          const attr=node.attributes[i];
          result.value.attributes[attr.name]=attr.value;
          if(attr.name==='id')result.label+=`#${attr.value}`;
          else if(attr.name==='class'){
            const classes=attr.value.split(' ').filter(c=>c.trim());
            if(classes.length){result.label+=`.${classes[0]}`;if(classes.length>1)result.label+='...';}
          }
        }
      }
      if(node.childNodes&&node.childNodes.length>0){
        for(let i=0;i<node.childNodes.length;i++){
          const childTree=buildTree(node.childNodes[i]);
          if(childTree)result.children.push(childTree);
        }
      }
      return result;
    }

    function renderNode(node){
      const nodeDiv = document.createElement('div');
      nodeDiv.className = "tree-node";
      const content = document.createElement('div');
      content.className = "node-content";
      
      let chevron = null;
      
      if(node.children?.length){
        const toggleSpan = document.createElement('span');
        toggleSpan.style.width = "10px";
        chevron = document.createElement('i');
        chevron.className = "ti ti-chevron-right text-slate-400 mr-1 chevron";
        chevron.style.fontSize = "10px";
        chevron.style.transform = "translateY(1px)";
        toggleSpan.appendChild(chevron);
        content.appendChild(toggleSpan);
      } else {
        content.style.paddingLeft = "10px";
      }
      
      const labelSpan = document.createElement('span');
      labelSpan.textContent = node.label;
      labelSpan.className = node.type === 'text' ? 'text-slate-500 italic' : 'text-slate-700 font-medium';
      content.appendChild(labelSpan);
      nodeDiv.appendChild(content);
      
      // Create children container if needed
      if(node.children?.length){
        const childrenContainer = document.createElement('div');
        childrenContainer.className = "tree-children";
        childrenContainer.style.display = "none"; // Start collapsed
        node.children.forEach(child => {
          childrenContainer.appendChild(renderNode(child));
        });
        nodeDiv.appendChild(childrenContainer);
        
        // Make the whole node header clickable
        content.addEventListener('click', (e) => {
          // Toggle active node
          document.querySelectorAll('.active-node').forEach(el => {
            el.classList.remove('active-node');
          });
          nodeDiv.classList.add('active-node');
          
          // Toggle node expansion
          const isOpen = chevron.classList.contains('chevron-open');
          if (isOpen) {
            chevron.classList.remove('chevron-open');
            childrenContainer.style.display = 'none';
          } else {
            chevron.classList.add('chevron-open');
            childrenContainer.style.display = 'block';
          }
        });
      } else {
        // For leaf nodes, just add the active class
        content.addEventListener('click', () => {
          document.querySelectorAll('.active-node').forEach(el => {
            el.classList.remove('active-node');
          });
          nodeDiv.classList.add('active-node');
        });
      }
      
      return nodeDiv;
    }

    function renderTree(treeData){
      const container=document.getElementById('treeContainer');
      container.innerHTML='';
      
      let elemCount=0, textCount=0;
      function countNodes(nodes){
        nodes.forEach(n=>{
          if(n.type==='element')elemCount++;
          else if(n.type==='text')textCount++;
          if(n.children)countNodes(n.children);
        });
      }
      countNodes(treeData);
      
      const statsBar=document.createElement('div');
      statsBar.className="flex justify-between items-center text-xs text-slate-500 mb-1 pb-1 border-b border-slate-100";
      statsBar.innerHTML=`
        <div class="flex gap-2">
          <span><b>${elemCount}</b> elements</span>
          <span><b>${textCount}</b> text nodes</span>
        </div>
        <div class="text-right text-xs text-slate-400">${new Date().toLocaleTimeString()}</div>
      `;
      container.appendChild(statsBar);
      
      const treeContainer=document.createElement('div');
      treeContainer.className="mt-1";
      
      treeData.forEach(node=>{
        if(node)treeContainer.appendChild(renderNode(node));
      });
      
      if(treeContainer.children.length===0){
        treeContainer.innerHTML='<div class="p-1 text-center text-slate-500">No elements found</div>';
      }
      
      container.appendChild(treeContainer);
    }
  </script>
</body>
</html>
