    <script id="rendered-js" >
let head = document.head;
let body = document.body;

// Append meta and title elements to the head
head.appendChild(createMetaElement('UTF-8'));
head.appendChild(createMetaElement('width=device-width, initial-scale=1.0', 'viewport'));
head.appendChild(createMetaElement('ie=edge', 'X-UA-Compatible'));
head.appendChild(createElement('title', {}, 'Your Page Title'));

// Function to create meta elements
function createMetaElement(content, name = 'charset') {
  let meta = document.createElement('meta');
  meta.setAttribute(name, content);
  return meta;
}

// Function to create general elements
function createElement(tag, attributes, content) {
  let element = document.createElement(tag);
  for (let key in attributes) {
    element.setAttribute(key, attributes[key]);
  }
  element.textContent = content;
  return element;
}

// Load external script
let scriptSrc = document.createElement('script');
scriptSrc.src = 'https://daweilv.github.io/treejs/dist/tree.min.js';

// Error handling for script loading
scriptSrc.onerror = function () {
  console.error('Failed to load the tree.js script');
};

// Create and append the container div
let container = createElement('div', { class: 'container' }, '');
body.appendChild(container);

// Append the main script only after the external script has loaded
scriptSrc.onload = function () {
  let mainScript = document.createElement('script');
  mainScript.textContent = `
