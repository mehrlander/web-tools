    <script id="rendered-js" >
document.addEventListener('DOMContentLoaded', () => {
  const getTreeItems = () => document.querySelectorAll('sl-tree-item, sl-tree');

  const toggleOutline = () => {
    const isChecked = document.querySelector('#toggleOutline').checked;
    getTreeItems().forEach(item => {
      item.classList.toggle('outline', isChecked);
    });
  };

  document.querySelector('#toggleOutline').addEventListener('sl-change', toggleOutline);
  toggleOutline(); // Initial call to set the outline based on the checkbox state

  const updateTreeItemHeight = height => {
    getTreeItems().forEach(item => {
      item.style.setProperty('--sl-tree-item-height', `${height}px`);
    });
  };

  document.getElementById('height-range').addEventListener('sl-input', event => {
    updateTreeItemHeight(event.target.value);
  });

  const updateSelectionMode = () => {
    const selectionModeValue = document.querySelector('#selection-mode').value;
    document.querySelectorAll('sl-tree').forEach(tree => {
      // Reset selection for each tree
      const treeItems = tree.querySelectorAll('sl-tree-item');
      treeItems.forEach(item => item.selected = false);
      // Apply the new selection mode
      tree.selection = selectionModeValue;
    });
  };

  document.querySelector('#selection-mode').addEventListener('sl-change', updateSelectionMode);
  updateSelectionMode(); // Initial call to set the selection mode based on the dropdown state
});
//# sourceURL=pen.js
  </script>
