<body translate="no">
  <!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>jsondiffpatch text diff — toggle example</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsondiffpatch@0.7.3/lib/formatters/styles/html.css" />

<style>
  body{font-family:system-ui;margin:16px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  textarea{width:100%;height:160px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;margin-top:10px}
  pre{white-space:pre-wrap;background:#00000008;padding:10px;border-radius:10px;margin-top:10px}
</style>

<div class="bar">
  <label><input type="radio" name="mode" value="minor" checked> minor change</label>
  <label><input type="radio" name="mode" value="more"> more changes</label>
  <button id="go">Diff</button>
</div>

<textarea id="a"></textarea>
<textarea id="b"></textarea>

<div id="visual" style="margin-top:12px"></div>
<pre id="delta"></pre>

<script type="module">
  import * as jsondiffpatch from "https://cdn.jsdelivr.net/npm/jsondiffpatch@0.7.3/lib/index.js";
  import * as htmlFormatter from "https://cdn.jsdelivr.net/npm/jsondiffpatch@0.7.3/lib/formatters/html.js";
  import { diff_match_patch } from "https://cdn.jsdelivr.net/npm/@dmsnell/diff-match-patch@1.1.0/index.js";

  const baseText =
`Dear Committee,

This memo summarizes the change request and its operational impact.
Please review the proposed language and reply with edits by Friday.

Thanks,
Mark`;

  const minorText =
`Dear Committee,

This memo summarizes the change request and its operational impact.
Please review the proposed language and reply with edits by Monday.

Thanks,
Mark`;

  const moreText =
`Hello Committee,

This memo summarizes the change request and its expected operational impact.
Please review the proposed language, add inline comments, and reply by Monday afternoon.

Thank you,
Mark`;

  const dp = jsondiffpatch.create({
    textDiff: { diffMatchPatch: diff_match_patch, minLength: 1 }
  });

  const setMode = (mode) => {
    const leftObj = { text: baseText };
    const rightObj = { text: mode === "more" ? moreText : minorText };
    a.value = JSON.stringify(leftObj, null, 2);
    b.value = JSON.stringify(rightObj, null, 2);
  };

  const currentMode = () => document.querySelector('input[name="mode"]:checked').value;

  go.onclick = () => {
    const left = JSON.parse(a.value), right = JSON.parse(b.value);
    const d = dp.diff(left, right);

    visual.innerHTML = d ? htmlFormatter.format(d, left) : "(no diff)";
    if (d) htmlFormatter.hideUnchanged(visual);

    delta.textContent = JSON.stringify(d ?? null, null, 2);
  };

  document.querySelectorAll('input[name="mode"]').forEach(r => r.onchange = () => { setMode(currentMode()); go.click(); });

  setMode(currentMode());
  go.click();
</script>
  
  
  
</body>
