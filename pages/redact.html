<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redact</title>
<!--
  redact.html — kits/redact.js on a page of its own: cover parts of an image
  with labelled boxes, crop it, prove the covered pixels are gone, copy the
  result. Paste, open or drop an image; a generated sample loads otherwise.

  The editor itself, and how it works, is the kit (lib/kits/redact.js). The
  Stage opens the same editor over a staged image from the reader's header.

  ?use=<branch|tag|sha> pins the lib chain to a ref for previewing edits.
-->
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
<script type="module">
  await import('https://mehrlander.github.io/web-tools/lib/entry.js');
  await gh.load('kits/redact.js');
  // Mounted before Alpine loads, so Alpine's own start initialises it.
  window.Redact.mount(document.getElementById('redact'), { sample: true });
  await gh.load('alpine-bundle.js');
</script>
</head>
<body class="bg-base-200 min-h-dvh">
<div id="redact"></div>
</body>
</html>
