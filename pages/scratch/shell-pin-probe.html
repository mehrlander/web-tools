<!doctype html>
<!--
  shell-pin-probe.html — experiment E1 of docs/showing-consolidation.md.

  THE QUESTION. On an iPhone, a toss shell whose own lib is pinned with ?use=
  and that hosts a frame loses Safari's web process on the first FAB tap
  (docs/SNAGS.md, shell-pin-kills-the-tab). That matrix ran on 2026-09-08,
  when the unpinned shell imported its modules from jsDelivr. Since 2026-09-26
  both routes read everything after gh-api.js through the contents API, so the
  delivery difference left is narrower: HOW gh-api.js arrives (native import
  from Pages, or blob import of raw's copy) and WHICH ref the shell's gh names.
  Each cell below changes one of those and nothing else, around the same frame
  toss-render mounts, so the cell that dies names the variable.

  WHY A REPLICA and not toss-render itself: a shell cannot be tossed to the top
  level, and a probe must not change the production shell's boot. The replica
  is only trustworthy if its positive control (cell D, the recorded crash
  shape) dies on the device. If D survives, the replica is not reproducing the
  failure and no other cell here means anything; cell G, the real toss-render
  in the shape the app's ref switcher mints, is there to say which.

  THE RETURN CHANNEL is the FAB's own: every cell carries ?case=<cell>, the FAB
  stamps it into its crash trail at tap time, and the next page to boot a FAB
  files the trail to web-tools-private logs/page/. This page also keeps its
  own tally in localStorage, and "File results" commits it through the same
  kit, so a run ends in one commit rather than a relayed screenshot. Each
  cell's instructions are in its own frame, where the reader is looking when
  the tap is due.

  Must be served from Pages at the top level, so it only runs once merged.
-->
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shell pin probe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧪</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
</head>
<body class="h-dvh m-0 bg-base-100">

<iframe id="frame" class="w-full h-full border-0 block bg-base-100 hidden"
        referrerpolicy="no-referrer" allow="fullscreen; picture-in-picture"></iframe>

<main id="matrix" class="hidden p-4 flex flex-col gap-4">
  <h1 class="text-xl font-semibold">Shell pin probe</h1>
  <div class="overflow-x-auto">
    <table class="table table-sm">
      <thead><tr><th>Cell</th><th>Loader</th><th>Frame</th><th>Result</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="flex gap-2 flex-wrap">
    <button id="file" class="btn btn-primary btn-sm"><i class="ph ph-upload-simple"></i>File results</button>
    <button id="reset" class="btn btn-ghost btn-sm"><i class="ph ph-arrow-counter-clockwise"></i>Reset</button>
  </div>
  <p id="note" class="text-sm font-mono text-base-content/60"></p>
</main>

<div x-data="fab()" data-path="pages/scratch/shell-pin-probe.html"></div>

<script type="module">
  const REPO = 'mehrlander/web-tools';
  const PAGES = 'https://mehrlander.github.io/web-tools/';
  const KEY = 'shellprobe:results';

  // One variable per cell. `load` is how gh-api.js arrives; `ref` is the ref
  // the shell's gh names (sha = main's current commit, so the CODE is main's in
  // every cell and only the route differs); `frame` is whether a same-origin
  // frame is mounted; `revoke` is whether the blob URL is revoked after import,
  // as entry.js does.
  const CELLS = {
    A: { load: 'native', ref: 'main', frame: true,  revoke: true,  what: 'Negative control: the toss shell as it boots today' },
    B: { load: 'blob',   ref: 'main', frame: true,  revoke: true,  what: 'Blob import alone, at main' },
    C: { load: 'native', ref: 'sha',  frame: true,  revoke: true,  what: 'Shell gh pinned to a sha, native import' },
    D: { load: 'blob',   ref: 'sha',  frame: true,  revoke: true,  what: 'Positive control: the recorded crash shape' },
    E: { load: 'blob',   ref: 'sha',  frame: false, revoke: true,  what: 'The crash shape without a frame' },
    F: { load: 'blob',   ref: 'sha',  frame: true,  revoke: false, what: 'The crash shape without revoking the blob URL' },
  };

  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
  const write = (r) => { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch {} };
  const mark = (cell, state, extra = {}) => { const r = read(); r[cell] = { state, at: new Date().toISOString(), ...extra }; write(r); };

  // A cell left 'armed' whose FAB trail is still in storage is a tap that never
  // finished. Read before the FAB boots, since the FAB clears the trail when it
  // files it. Safari reloads the page that died, so this usually runs on the
  // dead cell's own address, and that load must not re-arm it.
  const died = (() => {
    let trail = null;
    try { trail = JSON.parse(localStorage.getItem('fab:step') || 'null'); } catch {}
    const cell = trail?.where?.case;
    const r = read();
    if (!(cell && r[cell] && r[cell].state === 'armed')) return null;
    mark(cell, 'died', { stage: trail.steps?.at(-1)?.stage || null });
    return cell;
  })();

  async function mainSha() {
    const res = await fetch(`https://api.github.com/repos/${REPO}/commits/main`,
      { headers: { Accept: 'application/vnd.github.sha' }, cache: 'no-store' });
    if (!res.ok) throw new Error('could not resolve main: HTTP ' + res.status);
    return (await res.text()).trim();
  }

  // The two routes entry.js chooses between, taken apart so a cell can pick
  // either at either ref.
  async function bootLib({ load, ref, revoke }) {
    window.__ghBlobBoot = { repo: REPO, ref };
    if (load === 'native') { await import(PAGES + 'lib/gh-api.js'); return; }
    const res = await fetch(`https://raw.githubusercontent.com/${REPO}/${ref}/lib/gh-api.js`, { cache: 'no-store' });
    if (!res.ok) throw new Error('gh-api.js@' + ref + ' answered HTTP ' + res.status);
    const url = URL.createObjectURL(new Blob([await res.text()], { type: 'text/javascript' }));
    try { await import(url); } finally { if (revoke) URL.revokeObjectURL(url); }
  }

  // toss-render's mountFrame for an address-mode render: same sandbox, same
  // allow list, same blob: document. The subject is deliberately trivial,
  // since the 2026-09-08 matrix found a twenty-line page that loads nothing
  // dies as readily as a real one.
  function mountFrame(cell, spec) {
    const frame = document.getElementById('frame');
    const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>window.__fabHosted=true;<\/script></head>
<body><h1>Cell ${cell}</h1>
<p>${spec.what}. Loader: ${spec.load} import, shell ref ${spec.ref}${spec.revoke ? '' : ', blob URL kept'}.</p>
<p><b>Tap the floating button once.</b> If the drawer opens, this cell survived and is recorded. If the tab dies, it reports itself when Safari reloads.</p>
<p><button onclick="parent.__probeBack()">Back to the matrix</button></p></body></html>`;
    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms allow-modals allow-downloads');
    frame.src = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    frame.classList.remove('hidden');
    window.__tossSubject = { repo: REPO, ref: 'main', path: 'pages/scratch/shell-pin-probe.html' };
    window.__tossFrame = frame;
    window.dispatchEvent(new CustomEvent('toss-subject'));
  }

  // Survival is the drawer opening. Polled rather than hooked, so the probe
  // adds nothing to the FAB's own code path.
  function watchDrawer(cell) {
    const t = setInterval(() => {
      try {
        const el = document.querySelector('[x-data^="fab"]');
        if (el && window.Alpine && Alpine.$data(el).open) { mark(cell, 'survived'); clearInterval(t); }
      } catch {}
    }, 250);
  }

  function renderMatrix() {
    const r = read();
    const tone = { survived: 'text-success', died: 'text-error', armed: 'text-warning', opened: 'text-info' };
    const row = (id, loader, frame, href) => {
      const res = r[id];
      return `<tr><td><a class="link link-primary font-mono" href="${href}">${id}</a></td>
        <td>${loader}</td><td>${frame ? 'yes' : 'no'}</td>
        <td class="${tone[res?.state] || 'text-base-content/40'}">${res ? res.state + (res.stage ? ' at ' + res.stage : '') : 'not run'}</td></tr>`;
    };
    document.getElementById('rows').innerHTML =
      Object.entries(CELLS).map(([id, s]) =>
        row(id, `${s.load} @ ${s.ref}${s.revoke ? '' : ', kept'}`, s.frame, `?case=${id}`)).join('') +
      row('G', 'toss-render, ?use=sha', true, '#G');
    document.getElementById('matrix').classList.remove('hidden');
  }

  window.__probeBack = () => { location.href = location.pathname; };

  const cell = new URLSearchParams(location.search).get('case');
  const spec = cell !== died ? CELLS[cell] : null;

  if (spec) {
    mark(cell, 'armed');
    try {
      const ref = spec.ref === 'sha' ? await mainSha() : 'main';
      // No frame means no browsing context at all: an empty iframe element
      // still makes an about:blank one, which is the variable under test.
      if (spec.frame) mountFrame(cell, spec);
      else { document.getElementById('frame').remove(); renderMatrix(); }
      await bootLib({ ...spec, ref });
      await gh.load('alpineComponents/fab.js');
      await gh.load('alpine-bundle.js');
      watchDrawer(cell);
    } catch (e) {
      mark(cell, 'boot failed', { why: String(e && e.message || e) });
      renderMatrix();
    }
  } else {
    renderMatrix();
    // The real thing, in the shape lib/alpineComponents/ref-switch.js mints.
    // Its drawer cannot be watched from here, and a crash there is filed by
    // toss-render's own FAB, which clears the trail before this page could
    // read it. So G's row says only that it was opened, and its result is the
    // filed report carrying case G, or the absence of one.
    document.querySelector('a[href="#G"]').addEventListener('click', async (e) => {
      e.preventDefault();
      const sha = await mainSha();
      mark('G', 'opened');
      location.href = `${PAGES}pages/toss-render.html?use=${sha}&case=G#gh=${REPO}@${sha}:pages/diff-tool.html`;
    });
    document.getElementById('reset').onclick = () => { write({}); renderMatrix(); };
    document.getElementById('file').onclick = async () => {
      const note = document.getElementById('note');
      note.textContent = 'filing…';
      try {
        if (!window.PageReport) await gh.load('kits/page-report.js');
        const res = await window.PageReport.send({ reason: 'shell-pin matrix', results: read(),
          cells: CELLS, ua: navigator.userAgent });
        note.textContent = res.ok ? 'filed ' + res.path : 'not filed: ' + res.why;
      } catch (e) { note.textContent = 'not filed: ' + (e.message || e); }
    };
    await import(PAGES + 'lib/entry.js');
    await gh.load('alpineComponents/fab.js');
    await gh.load('alpine-bundle.js');
  }
</script>
</body>
</html>
