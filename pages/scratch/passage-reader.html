<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passage reader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📖</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  passage-reader.html — one passage-reading/1 file, read a sentence at a time.
  The format, its fields and what a viewer derives from them are in
  data/passage-reading/README.md; with no address the page reads the sample
  beside it, data/passage-reading/skill-prefs-description.json.

  The body is a linked swiper (data/ui-units codes.csv): the passage is the
  list, a strip of sentence cards is the swiper, and sync() keeps the lit
  sentence and the strip in step. Everything a card shows beyond the stored
  fields (new here, in play, carried in by reference, carried forward) is
  derived in index(), so the file states each fact once.

  The one accent means CONNECTED TO THE LIT SENTENCE: the spans at both ends
  of every link into or out of it, in the passage and on its card. A card row
  brightens its own pair. A claim's evidence span and an entity's mentions
  light in neutral grey, since neither is a connection.

  Addresses: #gh=owner/repo[@ref]:path reads a reading through the stored
  GitHub token; #gz=<base64url of gzipped JSON> carries one in the link; #s=<n>
  opens on sentence n. Both address keys also read from the query.

  Probe, stated 2026-10-14: this page, data/passage-reading/, and the skill
  still to be written graduate together (the page leaves pages/scratch/) or
  are deleted together, after the skill is tested on a passage it has not seen.
-->
<script>window.__depsReady = new Promise(r => { window.__depsDone = r; });</script>
<script type="module">
  const q = new URLSearchParams(location.search);
  const ref = q.get('use') || (q.getAll('refs').map(v => (String(v).match(/^mehrlander\/web-tools@([^:]+)$/) || [])[1]).find(Boolean));
  if (ref) {
    const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/dist/web-tools.js`, { cache: 'no-store' });
    if (!src.ok) throw new Error(`?use=${ref}: could not fetch the bundle (HTTP ${src.status})`);
    const url = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
    try { await import(url); } finally { URL.revokeObjectURL(url); }
  } else {
    await import('../../dist/web-tools.js');
  }
  try {
    await gh.load('kits/swipe-deck.js');
    await gh.load('kits/title-tip.js');
  } finally { window.__depsDone(); }
</script>
<script>
document.addEventListener('alpine:init', () => {
  const SAMPLE = { repo: 'mehrlander/web-tools', path: 'data/passage-reading/skill-prefs-description.json' };
  const ROLE = { definition: 'Definition', premise: 'Premise', claim: 'Claim', rule: 'Rule', evidence: 'Evidence', example: 'Example', exception: 'Exception' };
  const KIND = { refers: 'refers back', ellipsis: 'unstated', elaborates: 'elaborates', 'rests-on': 'rests on', narrows: 'narrows', contrasts: 'contrasts', supports: 'supports' };
  const BASIS = { general: 'general knowledge', passage: '' };
  const HOVER = matchMedia('(hover: hover) and (pointer: fine)');

  const tokenNow = () => {
    if (window.TOKEN) return window.TOKEN;
    try { return localStorage.getItem('ghToken') || ''; } catch (e) { return ''; }
  };
  const params = () => new URLSearchParams(location.hash.slice(1));
  const param = k => params().get(k) || new URLSearchParams(location.search).get(k);
  const blob = (repo, ref, path) => `https://github.com/${repo}/blob/${ref || 'main'}/${path}`;
  // Inline code keeps its backticks in the data, where quotes are matched, and
  // loses them on screen.
  const plain = s => String(s ?? '').replace(/`/g, '');
  const quote = s => `<span class="text-base-content/90">“${esc(plain(s))}”</span>`;

  // Everything a card shows that the file does not store. A mention marked
  // anaphor or ellipsis resolves to its entity's first named mention unless it
  // names `ante`; one resolving inside its own sentence is shown on the
  // mention and is not carried in.
  function index(R) {
    const S = R.sentences, by = {}, firstNamed = {}, firstAny = {};
    // Sentence numbers become keys and selectors, so a reading that carries a
    // non-integer one is renumbered by position rather than trusted.
    S.forEach((s, i) => { if (!Number.isInteger(s.n)) s.n = i + 1; });
    for (const s of S) {
      by[s.n] = s;
      s.mentions.forEach((m, i) => {
        if (!(m.e in firstAny)) firstAny[m.e] = s.n;
        if (!m.form && !(m.e in firstNamed)) firstNamed[m.e] = s.n;
      });
    }
    const rng = {}, inn = {}, fwd = {}, mentionKeys = {}, where = {}, missing = [];
    for (const s of S) { rng[s.n] = []; inn[s.n] = []; fwd[s.n] = []; }
    const add = (n, key, q, extra = {}) => {
      const a = by[n] && q ? by[n].text.indexOf(q) : -1;
      if (a < 0) { missing.push({ n, q }); return false; }
      rng[n].push({ key, a, b: a + q.length, ...extra });
      return true;
    };
    for (const s of S) {
      s.mentions.forEach((m, i) => {
        const key = `m${s.n}-${i}`;
        (mentionKeys[m.e] ||= []).push(key);
        if (!(where[m.e] ||= []).includes(s.n)) where[m.e].push(s.n);
        const ok = add(s.n, key, m.quote, { kind: 'm', m, fresh: firstAny[m.e] === s.n && mentionKeys[m.e].length === 1 });
        if (!m.form) return;
        const ante = m.ante || firstNamed[m.e];
        if (!ante || ante >= s.n) return;
        const t = by[ante].mentions.findIndex(x => x.e === m.e && !x.form);
        const item = { kind: m.form === 'ellipsis' ? 'ellipsis' : 'refers', from: s.n, to: ante, e: m.e,
          here: m.quote, fill: m.fill, there: t >= 0 ? by[ante].mentions[t].quote : '',
          keys: [key, ...(t >= 0 ? [`m${ante}-${t}`] : [])], note: m.note, ok };
        inn[s.n].push(item); fwd[ante].push(item);
      });
      s.links.forEach((l, j) => {
        const h = `l${s.n}-${j}h`, t = `l${s.n}-${j}t`;
        const ok = add(s.n, h, l.here, { kind: 'l' }) & add(l.to, t, l.there, { kind: 'l' });
        const item = { ...l, from: s.n, keys: [h, t], ok: !!ok };
        inn[s.n].push(item); if (fwd[l.to]) fwd[l.to].push(item);
      });
      s.atoms.forEach((a, k) => add(s.n, `a${s.n}-${k}`, a.quote, { kind: 'a' }));
      for (const c of s.text.matchAll(/`[^`]+`/g)) rng[s.n].push({ key: '', a: c.index, b: c.index + c[0].length, kind: 'code' });
    }
    const fresh = {};
    for (const [e, n] of Object.entries(firstAny)) (fresh[n] ||= []).push(e);
    return { by, rng, inn, fwd, fresh, mentionKeys, where, missing };
  }

  // Text cut at every range boundary, so overlapping ranges need no nesting:
  // each piece carries the keys of every range covering it.
  function pieces(text, ranges, inserts = {}) {
    const pts = [...new Set([0, text.length, ...ranges.flatMap(r => [r.a, r.b])])].sort((x, y) => x - y);
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      out.push({ text: text.slice(a, b), on: ranges.filter(r => r.a <= a && r.b >= b) });
      if (inserts[b]) out.push({ insert: inserts[b] });
    }
    return out;
  }

  // Scroll a passage pane, never the document: in an app frame,
  // scrollIntoView would move the shell around the frame as well.
  function reveal(box, el) {
    if (!box || !el) return;
    const b = box.getBoundingClientRect(), r = el.getBoundingClientRect();
    if (r.top >= b.top + 8 && r.bottom <= b.bottom - 8) return;
    box.scrollTop += r.top - b.top - Math.max(8, (b.height - Math.min(r.height, b.height)) / 3);
  }

  Alpine.data('passageReader', () => ({
    R: null, X: null, src: null, err: '', cur: 0, about: false, band: false, strip: null, hot: null,
    get N() { return this.R.sentences.length; },
    get s() { return this.R.sentences[this.cur]; },

    async init() {
      await window.__depsReady;
      try { this.R = await this.read(); this.X = index(this.R); }
      catch (e) { this.err = e.message; return; }
      if (this.X.missing.length) console.warn('passage-reader: quotes not found in their sentence', this.X.missing);
      const want = this.R.sentences.findIndex(s => String(s.n) === param('s'));
      this.cur = Math.max(0, want);
      this.$nextTick(() => {
        this.strip = swipeDeck.core(this.N, (i, el) => this.render(i, el), {
          innerClass: 'w-full', keys: this.$refs.main, behavior: 'instant', start: this.cur,
        });
        this.$refs.track.append(this.strip.track);
        this.strip.onSlide(i => i !== this.cur && this.sync(i, 'strip'));
        requestAnimationFrame(() => { this.strip.go(this.cur, 'instant'); this.revealLit(); });
        addEventListener('resize', () => this.revealLit());
      });
    },

    async read() {
      const gz = param('gz'), spec = param('gh');
      if (gz) {
        this.src = { kind: 'link' };
        const bin = Uint8Array.from(atob(gz.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
        return JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
      }
      if (spec) {
        const [at, ...rest] = spec.split(':');
        const [repo, ref] = at.split('@');
        this.src = { repo, ref, path: rest.join(':') };
        try { return JSON.parse((await new GH({ token: tokenNow(), repo, ...(ref ? { ref } : {}) }).get(this.src.path)).text); }
        catch (e) { throw new Error(`Could not read ${spec}${tokenNow() ? '' : ' without a stored GitHub token'}: ${e.message}`); }
      }
      this.src = { ...SAMPLE };
      const r = await fetch('../../' + SAMPLE.path);
      if (!r.ok) throw new Error('No reading. Address one with #gh=owner/repo@ref:path or #gz=…');
      return r.json();
    },
    get fileUrl() { return this.src && this.src.path ? blob(this.src.repo, this.src.ref, this.src.path) : ''; },
    role(r) { return ROLE[r] || r; },
    link(o) { return o && o.repo ? blob(o.repo, o.ref, o.path) : null; },
    get entityList() { return Object.entries(this.R.entities).map(([k, e]) => ({ k, ...e, where: (this.X.where[k] || []).join(', ') })); },

    // One move, from the passage, the strip or a card's link, reaches the others.
    sync(i, from) {
      this.cur = i;
      this.light(null);
      if (from !== 'strip' && this.strip && this.strip.active() !== i) this.strip.go(i, 'instant');
      try {
        const p = params(); p.set('s', this.s.n);
        history.replaceState(null, '', '#' + p.toString());
      } catch (e) {}
      this.$nextTick(() => this.revealLit());
    },
    step(d) { this.sync(Math.max(0, Math.min(this.N - 1, this.cur + d)), 'list'); },
    go(n) { const i = this.R.sentences.findIndex(s => s.n === n); if (i >= 0) this.sync(i, 'list'); },
    revealLit() { reveal(this.$refs.passage, this.$refs.passage?.querySelector(`[data-s="${this.s.n}"]`)); },
    pick(e) { const t = e.target.closest('[data-s]'); if (t) this.go(+t.dataset.s); },

    // Light every span carrying one of `keys`: data-on for a connection,
    // data-ev for evidence and mentions. One lit set at a time.
    light(keys, attr = 'data-on') {
      document.querySelectorAll('[data-on],[data-ev],[data-hot]').forEach(el => { el.removeAttribute('data-on'); el.removeAttribute('data-ev'); el.removeAttribute('data-hot'); });
      if (!keys) { this.hot = null; return; }
      for (const k of keys) document.querySelectorAll(`[data-k~="${k}"]`).forEach(el => el.setAttribute(attr, ''));
    },

    // The spans tied to sentence n by a link, at either end.
    connected(n) {
      const X = this.X;
      return new Set([...X.inn[n], ...X.fwd[n]].flatMap(it => it.keys));
    },

    // mode: 'card' (tips, new entities bold), 'lit' (the lit sentence in the
    // passage: mentions underlined), 'dim' (any other sentence: tints only).
    span(p, conn, mode) {
      if (p.insert) {
        const e = this.R.entities[p.insert.e] || {};
        return ` <span data-k="${p.insert.key}" class="text-base-content/50 underline decoration-dotted underline-offset-4 decoration-base-content/40 data-[on]:bg-primary/30 data-[ev]:bg-base-300"
          data-title-tip-lead="${esc(e.label || p.insert.e)}" data-title-tip="${esc(e.gloss || '')}">[${esc(p.insert.text)}]</span>`;
      }
      const keys = p.on.map(r => r.key).filter(Boolean).join(' ');
      const m = p.on.find(r => r.kind === 'm' && r.m.form !== 'ellipsis');
      const cls = ['data-[on]:bg-primary/30 data-[ev]:bg-base-300'];
      if (p.on.some(r => conn.has(r.key))) cls.push('bg-primary/10', mode === 'dim' ? 'text-base-content' : '');
      else if (p.on.some(r => r.kind === 'code')) cls.push('bg-base-200 rounded');
      let tip = '';
      if (m && mode !== 'dim') {
        cls.push('underline underline-offset-4', m.m.form === 'anaphor' ? 'decoration-dotted decoration-base-content/60' : 'decoration-base-content/30');
        if (mode === 'card') {
          if (m.fresh) cls.push('font-semibold');
          const e = this.R.entities[m.m.e] || {};
          tip = ` data-title-tip-lead="${esc(e.label || m.m.e)}" data-title-tip="${esc(m.m.note || e.gloss || '')}"`;
        }
      }
      const text = esc(p.on.some(r => r.kind === 'code') ? plain(p.text) : p.text);
      return keys || cls.length > 1 ? `<span data-k="${keys}" class="${cls.filter(Boolean).join(' ')}"${tip}>${text}</span>` : text;
    },

    // The passage: every sentence, the lit one boxed at full strength with its
    // mentions underlined, the rest dimmed, and the spans connected to the lit
    // sentence tinted wherever they sit.
    get passageHtml() {
      if (!this.R) return '';
      const lit = this.s.n, conn = this.connected(lit), X = this.X;
      const lead = this.R.lead ? `<span class="font-semibold">${esc(this.R.lead)}</span> ` : '';
      return lead + this.R.sentences.map(s => {
        const on = s.n === lit;
        const body = pieces(s.text, X.rng[s.n].filter(r => r.kind !== 'a')).map(p => this.span(p, conn, on ? 'lit' : 'dim')).join('');
        return `<span data-s="${esc(s.n)}" class="cursor-pointer box-decoration-clone rounded px-0.5 ${on ? 'bg-base-200' : 'text-base-content/60 hover:bg-base-200'}"><sup class="text-xs text-base-content/40 tabular-nums mr-1 select-none">${esc(s.n)}</sup>${body}</span>`;
      }).join(' ');
    },

    jump(n, arrow) {
      return `<button data-go="${esc(n)}" class="link link-hover tabular-nums text-left">${arrow} ${esc(n)}</button>`;
    },
    row(hl, mode, left, body) {
      return `<li tabindex="0" data-hl="${esc(hl.join(' '))}" data-mode="${mode}"
        class="grid sm:grid-cols-[6rem_minmax(0,1fr)] gap-x-3 px-2 -mx-2 py-2 rounded-box outline-none hover:bg-base-200 focus-visible:bg-base-200 data-[hot]:bg-base-200">
        <div class="flex flex-wrap gap-x-2 sm:grid sm:content-start text-sm text-base-content/60 leading-7">${left.filter(Boolean).join('')}</div>
        <div class="grid gap-1 content-start leading-7 min-w-0">${body.filter(Boolean).join('')}</div></li>`;
    },
    section(title, items) {
      return items.length ? `<section class="grid gap-1"><h3 class="text-sm font-semibold text-base-content/60">${title}</h3><ul class="grid">${items.join('')}</ul></section>` : '';
    },
    note(t, cls = 'text-base-content/70') { return t ? `<span class="text-pretty ${cls}">${esc(t)}</span>` : ''; },
    flag(it) { return it.ok === false ? '<span class="text-error">unanchored</span>' : ''; },

    render(i, el) {
      const s = this.R.sentences[i], n = s.n, X = this.X, E = this.R.entities;
      const conn = this.connected(n);
      const inserts = {};
      s.mentions.forEach((m, k) => {
        const a = s.text.indexOf(m.quote);
        if (m.form === 'ellipsis' && a >= 0) inserts[a + m.quote.length] = { key: `m${n}-${k}`, e: m.e, text: m.fill || (E[m.e] || {}).label || m.e };
      });
      const sentence = pieces(s.text, X.rng[n], inserts).map(p => this.span(p, conn, 'card')).join('');

      const inRows = X.inn[n].map(it => {
        const here = it.kind === 'ellipsis' ? `${quote(it.here)} <span class="text-base-content/50">[${esc(it.fill || (E[it.e] || {}).label || it.e)}]</span>` : quote(it.here);
        return this.row(it.keys, 'on',
          [this.jump(it.to, '←'), `<span>${KIND[it.kind] || esc(it.kind)}</span>`, it.implied ? '<span class="italic">implied</span>' : '', this.flag(it)],
          [`<span>${here} <i class="ph ph-arrow-right text-base-content/40"></i> ${quote(it.there)}</span>`, this.note(it.gloss, ''), this.note(it.note)]);
      });

      const fresh = (X.fresh[n] || []).map(k => {
        const e = E[k] || {}, ctx = (e.ctx || [])[0], doc = ctx && (this.R.context || []).find(c => c.id === ctx.doc);
        const where = ctx
          ? `<span class="text-sm text-base-content/60">${doc && doc.repo ? `<a class="link link-hover" target="_blank" rel="noopener" href="${esc(blob(doc.repo, doc.ref, doc.path))}">${esc(doc.path)} ↗</a>` : esc(ctx.doc)}</span>${quote(ctx.quote)}`
          : (BASIS[e.basis] ? `<span class="text-sm text-base-content/60">${BASIS[e.basis]}</span>` : '');
        return this.row(X.mentionKeys[k] || [], 'ev',
          [`<span class="font-semibold text-base-content">${esc(e.label || k)}</span>`],
          [this.note(e.gloss, ''), where]);
      });
      const playing = [...new Set(s.mentions.map(m => m.e))].filter(k => !(X.fresh[n] || []).includes(k));
      const inPlay = playing.length ? `<section class="grid gap-1"><h3 class="text-sm font-semibold text-base-content/60">In play</h3><p class="leading-7">${playing.map(k => {
        const e = E[k] || {};
        return `<span tabindex="0" data-hl="${(X.mentionKeys[k] || []).join(' ')}" data-mode="ev" class="underline decoration-dotted underline-offset-4 decoration-base-content/40 rounded outline-none focus-visible:bg-base-200" data-title-tip-lead="${esc(e.label || k)}" data-title-tip="${esc(e.gloss || '')}">${esc(e.label || k)}</span>`;
      }).join('<span class="text-base-content/40"> · </span>')}</p></section>` : '';

      const claims = s.atoms.map((a, k) => this.row([`a${n}-${k}`], 'ev',
        [`<span class="tabular-nums">${esc(n)}${esc(a.id)}</span>`, `<span>${esc((ROLE[a.role] || a.role || '').toLowerCase())}</span>`, a.implied ? '<span class="italic">implied</span>' : '', X.rng[n].some(r => r.key === `a${n}-${k}`) ? '' : '<span class="text-error">unanchored</span>'],
        [`<span class="text-pretty">${esc(a.claim)}</span>`, a.for ? `<span class="text-sm text-base-content/60">for ${esc(n)}${esc(a.for)}</span>` : '', this.note(a.note)]));

      const outRows = X.fwd[n].map(it => this.row(it.keys, 'on',
        [this.jump(it.from, '→'), `<span>${KIND[it.kind] || esc(it.kind)}</span>`, it.implied ? '<span class="italic">implied</span>' : '', this.flag(it)],
        [`<span>${quote(it.here)} <i class="ph ph-arrow-right text-base-content/40"></i> ${quote(it.there)}</span>`]));

      el.innerHTML = `<article class="grid gap-6 text-lg">
        <p class="leading-8 text-balance border-l-4 border-base-300 pl-4">${sentence}</p>
        ${this.section('Carried in', inRows)}
        ${this.section('New here', fresh)}
        ${inPlay}
        ${this.section('Claims', claims)}
        ${this.section('Carried forward', outRows)}
      </article>`;
      this.wire(el);
    },

    wire(el) {
      el.querySelectorAll('[data-go]').forEach(b => { b.onclick = e => { e.stopPropagation(); this.go(+b.dataset.go); }; });
      el.querySelectorAll('[data-hl]').forEach(r => {
        const keys = r.dataset.hl.split(' ').filter(Boolean), attr = r.dataset.mode === 'ev' ? 'data-ev' : 'data-on';
        const on = show => {
          this.light(keys, attr); r.setAttribute('data-hot', ''); this.hot = r;
          // A tap also brings the partner span into the passage pane, which on a
          // phone is a short band scrolled to the lit sentence.
          if (show) reveal(this.$refs.passage, [...this.$refs.passage.querySelectorAll('[data-on],[data-ev]')].find(x => !x.closest(`[data-s="${this.s.n}"]`)));
        };
        const off = () => this.light(null);
        r.addEventListener('pointerenter', () => HOVER.matches && on(false));
        r.addEventListener('pointerleave', () => HOVER.matches && off());
        // Keyboard focus only: a tap focuses the row too, and would light it
        // just before its own click turned it off again.
        r.addEventListener('focus', () => r.matches(':focus-visible') && on(false));
        r.addEventListener('blur', () => this.hot === r && !HOVER.matches ? null : off());
        r.addEventListener('click', () => HOVER.matches ? on(true) : this.hot === r ? off() : on(true));
      });
    },
  }));
});
</script>
<style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-base-100 text-base-content">
<div x-data="passageReader()" x-cloak class="h-dvh grid grid-cols-[minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)]">

  <header class="bg-base-100 border-b border-base-300 px-4 py-2 flex items-center gap-3">
    <i class="ph ph-book-open-text text-xl"></i>
    <div class="min-w-0">
      <h1 class="font-semibold text-lg truncate" x-text="R ? R.title : 'Passage reader'"></h1>
      <div class="text-xs text-base-content/60 truncate" x-text="R && R.source ? R.source.path : ''"></div>
    </div>
    <template x-if="R">
      <div class="ml-auto flex items-center gap-1">
        <template x-if="fileUrl">
          <a class="btn btn-ghost btn-sm btn-square" :href="fileUrl" target="_blank" rel="noopener" aria-label="The reading on GitHub" data-title-tip="The reading on GitHub"><i class="ph ph-github-logo text-lg"></i></a>
        </template>
        <button class="btn btn-ghost btn-sm btn-square" @click="about = true" aria-label="About this reading" data-title-tip="About this reading"><i class="ph ph-info text-lg"></i></button>
      </div>
    </template>
  </header>

  <div x-show="err" class="px-4 py-3 text-error" x-text="err"></div>

  <!-- The passage is the list; the strip of sentence cards moves with it -->
  <template x-if="R">
    <main x-ref="main" data-pattern="linked-swiper"
          class="grid grid-cols-[minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)] lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] lg:grid-rows-[minmax(0,1fr)] min-h-0 min-w-0">
      <section x-ref="passage" aria-label="Passage"
               class="overflow-y-auto border-b lg:border-b-0 lg:border-r border-base-300 px-4 py-4 sm:px-6 grid gap-4 content-start lg:max-h-none"
               :class="band ? 'max-h-[70dvh]' : 'max-h-[32dvh]'">
        <div x-show="R.gist" class="hidden lg:grid gap-1">
          <h2 class="text-sm font-semibold text-base-content/60">Gist</h2>
          <p class="text-lg leading-8 text-pretty" x-text="R.gist"></p>
        </div>
        <p class="text-lg leading-8 text-pretty" x-html="passageHtml" @click="pick($event)"></p>
      </section>

      <section class="grid grid-cols-[minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)] min-h-0 min-w-0">
        <div class="flex items-center gap-2 px-4 py-1.5 border-b border-base-200">
          <button class="btn btn-ghost btn-sm btn-square" @click="step(-1)" :disabled="cur === 0" aria-label="Previous sentence"><i class="ph ph-caret-left text-lg"></i></button>
          <span class="tabular-nums text-sm text-base-content/60" x-text="(cur + 1) + ' / ' + N"></span>
          <button class="btn btn-ghost btn-sm btn-square" @click="step(1)" :disabled="cur === N - 1" aria-label="Next sentence"><i class="ph ph-caret-right text-lg"></i></button>
          <span class="text-sm font-semibold text-base-content/70" x-text="role(s.role)"></span>
          <button class="btn btn-ghost btn-sm btn-square ml-auto lg:hidden" @click="band = !band" :aria-pressed="band ? 'true' : 'false'"
                  aria-label="Taller passage" data-title-tip="Taller passage"><i class="ph text-lg" :class="band ? 'ph-arrows-in-line-vertical' : 'ph-arrows-out-line-vertical'"></i></button>
        </div>
        <div x-ref="track" class="min-h-0 min-w-0 h-full"></div>
      </section>
    </main>
  </template>

  <dialog class="modal" :open="about" @keydown.escape.window="about = false">
    <div class="modal-box w-11/12 max-w-3xl grid gap-5" x-show="R">
      <div class="flex items-center">
        <h2 class="font-semibold text-lg">About this reading</h2>
        <button class="btn btn-sm btn-ghost btn-square ml-auto" @click="about = false" aria-label="Close"><i class="ph ph-x"></i></button>
      </div>
      <dl class="grid grid-cols-[6.5rem_minmax(0,1fr)] gap-x-4 gap-y-3">
        <dt class="text-sm text-base-content/60 pt-1">Source</dt>
        <dd class="grid gap-1">
          <a class="link link-hover" target="_blank" rel="noopener" :href="link(R?.source)" x-text="(R?.source?.path || '') + (R?.source?.repo ? ' ↗' : '')"></a>
          <span class="text-pretty text-base-content/70" x-text="R?.source?.note"></span>
        </dd>
        <dt class="text-sm text-base-content/60 pt-1">Gist</dt><dd class="text-pretty" x-text="R?.gist"></dd>
        <dt class="text-sm text-base-content/60 pt-1">Made</dt><dd x-text="R?.made"></dd>
        <dt class="text-sm text-base-content/60 pt-1">Context</dt>
        <dd class="grid gap-2">
          <template x-for="c in R?.context || []" :key="c.id">
            <span class="grid">
              <a class="link link-hover" target="_blank" rel="noopener" :href="link(c)" x-text="c.path + (c.ref ? ' at ' + c.ref : '') + (c.repo ? ' ↗' : '')"></a>
              <span class="text-pretty text-base-content/70" x-text="c.why"></span>
            </span>
          </template>
          <span x-show="!(R?.context || []).length" class="text-base-content/60">None supplied</span>
        </dd>
        <dt class="text-sm text-base-content/60 pt-1">Entities</dt>
        <dd class="grid gap-2">
          <template x-for="e in R ? entityList : []" :key="e.k">
            <span class="grid">
              <span><span class="font-semibold" x-text="e.label"></span> <span class="text-sm tabular-nums text-base-content/60" x-text="e.where"></span></span>
              <span class="text-pretty text-base-content/70" x-text="e.gloss"></span>
            </span>
          </template>
        </dd>
        <template x-if="X && X.missing.length">
          <dt class="text-sm text-error pt-1">Unanchored</dt>
        </template>
        <template x-if="X && X.missing.length">
          <dd class="grid gap-1"><template x-for="m in X.missing" :key="m.n + m.q"><span x-text="m.n + ': “' + m.q + '”'"></span></template></dd>
        </template>
        <dt class="text-sm text-base-content/60 pt-1">Format</dt>
        <dd><a class="link link-hover" target="_blank" rel="noopener" href="https://github.com/mehrlander/web-tools/blob/main/data/passage-reading/README.md">passage-reading/1 ↗</a></dd>
      </dl>
    </div>
    <div class="modal-backdrop" @click="about = false"></div>
  </dialog>
</div>
</body>
</html>
