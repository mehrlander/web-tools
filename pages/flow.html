<!doctype html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow</title>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5,npm/@tailwindcss/typography/dist/typography.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  flow.html — a process as a map and a strip of steps: who does each step, the
  scripts, skills and records it touches, and where the process branches or
  loops back. A process with a current and a proposed version shows both in
  one map as a change: the first version is the text the second changes, in
  the house's change colors, and an edited sentence sits in kits/md-diff.js's
  change container, swiped between before, the change, and after.

    flow/1  { schema, title, repo?,
              actors:   [{ id, label, icon }]           the map's columns, in order
              variants: [{ id, label }]?                 at most two: the versions compared
              steps:    [{ id, actor, label,
                           gloss,     what the step does, in a sentence; where the versions
                                      differ, a list of { v, gloss }, one per variant
                           change?:   { gloss }, what the change to this step does, in a
                                      sentence for a reader new to it; on a step one version
                                      lacks or whose sentence differs, and on such an exit
                           in?,       the variants the step belongs to; all when omitted
                           artifacts?: [{ kind, label, path, repo? }]
                                      kind: skill | script | agent | data | doc | record | page
                           exits?:    [{ to, label, when, in?, change? }],
                           end? }] }

  STEPS ARE LISTED IN MAIN-PATH ORDER, and that order is the swipe. A step
  leads to the next step listed that shares its variant, unless it is `end`.
  An exit is a branch the reader chooses on the step's card: one to an earlier
  step is a loop, drawn in the map's right gutter, and taking it counts a pass
  in the header; one to the step that follows anyway labels that edge. So the
  swipe never cycles, while every loop stays on the map and one tap away. An
  exit taken is a history entry, so Back returns along the path.

  Addresses, as pages/stepwise.html reads them: #gh=owner/repo[@ref]:path
  (read with the stored GitHub token), #gz=<gzipped base64url JSON>
  (kits/gz-payload.js), and with neither, pages/demos/flow-critic-review.json.
  &step=<id> opens at a step and follows the reader; &v=<variant> shows one
  version, and without it a two-version flow shows both. &o=v lays the lanes
  down as columns; without it they run across as rows, the steps left to right.

  Each step is one slide of a swipeDeck.core track (kits/swipe-deck.js); the
  map, the arrows, the keys and the dots drive the same track. The map sits
  over the step at every width, a list over its detail, so the page fits one
  takeover; the seam between them is kits/dock-split.js, its height kept in
  this browser and reset by a double-click.
-->
<script>window.__depsReady = new Promise(r => { window.__depsDone = r; });</script>
<script type="module">
  const q = new URLSearchParams(location.search);
  const ref = q.get('use') || (q.getAll('refs').map(v => (String(v).match(/^mehrlander\/web-tools@([^:]+)$/) || [])[1]).find(Boolean));
  if (ref) {
    const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/dist/web-tools.js`, { cache: 'no-store' });
    if (!src.ok) throw new Error(`?use=${ref}: could not fetch the bundle (HTTP ${src.status})`);
    const url = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
    try { await import(url); } finally { URL.revokeObjectURL(url); }
  } else {
    await import('../dist/web-tools.js');
  }
  try {
    await gh.load('kits/gz-payload.js');   // the #gz= codec
    await gh.load('kits/swipe-deck.js');   // the track
    await gh.load('kits/dock-split.js');   // the seam between map and step
    await gh.load('kits/md-diff.js');      // a changed sentence's change container
    await gh.load('kits/source-peek.js');  // a file's peek card, from its icon in a node or its link on a card
  } finally { window.__depsDone(); }
</script>
<script>
document.addEventListener('alpine:init', () => {
  const tokenNow = () => window.TOKEN || window.ghAuth?.resolve() || '';
  const hashParams = () => new URLSearchParams(location.hash.slice(1));
  const param = k => hashParams().get(k) || new URLSearchParams(location.search).get(k);
  const h = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const icon = (name, cls = '') => h('i', `ph ${name} ${cls}`);
  // Text with `code` spans, built as nodes so nothing in the payload is HTML.
  const inline = (el, text) => {
    String(text || '').split(/(`[^`]+`)/).forEach(part => {
      if (/^`[^`]+`$/.test(part)) el.append(h('code', 'font-mono text-[0.9em] bg-base-200 rounded px-1', part.slice(1, -1)));
      else if (part) el.append(document.createTextNode(part));
    });
    return el;
  };
  // Two versions are read as a change, the first as the text it changes and
  // the second as the change, in the house's change colors (kits/md-diff.js's
  // redline): what only the first has was removed, red, dashed and struck;
  // what only the second has was added, green; a step both have whose
  // sentence differs was edited, an amber bar. One treatment on every view.
  const HUE = [
    { kind: 'removed', node: 'border-error/70 border-dashed', tint: 'var(--color-error)', band: 'border-l-4 border-dashed border-error/70 bg-error/5 pl-3', strike: 'line-through decoration-error/60', badge: 'badge-error', stroke: 'color-mix(in oklab, var(--color-error) 75%, transparent)', ink: 'color-mix(in oklab, var(--color-error) 60%, black)', dash: '6 4' },
    { kind: 'added', node: 'border-success', tint: 'var(--color-success)', band: 'border-l-4 border-success bg-success/10 pl-3', strike: '', badge: 'badge-success', stroke: 'var(--color-success)', ink: 'color-mix(in oklab, var(--color-success) 55%, black)', dash: '' },
  ];
  // A kind of file: its glyph, its color, and its name.
  // The colors mark the kind wherever its icon appears, in a node and on a
  // card, and keep clear of the change colors.
  const KIND = {
    script: { icon: 'ph-code', color: 'text-emerald-600', name: 'Script' },
    skill: { icon: 'ph-book-open-text', color: 'text-violet-600', name: 'Skill' },
    agent: { icon: 'ph-robot', color: 'text-rose-600', name: 'Agent' },
    data: { icon: 'ph-table', color: 'text-teal-600', name: 'Data' },
    doc: { icon: 'ph-file-text', color: 'text-indigo-500', name: 'Document' },
    record: { icon: 'ph-archive', color: 'text-fuchsia-600', name: 'Record' },
    page: { icon: 'ph-browser', color: 'text-cyan-700', name: 'Page' },
  };
  const calm = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const kindOf = k => KIND[k] || { icon: 'ph-file', color: 'text-base-content/60', name: 'File' };

  Alpine.data('flow', () => ({
    LANE_BG: 'color-mix(in oklab, var(--color-base-200) 70%, var(--color-base-100))',
    o: 'h',   // lanes across (h, the default) or down (v)
    heading: null,   // the slide a smooth move is on its way to
    F: null, err: '', v: '', cur: 0, deck: null, passes: 0, repo: 'mehrlander/web-tools', ref: 'main', svg: '', mapH: 0,

    get variants() { return this.F?.variants || []; },
    get both() { return this.variants.length > 1 && !this.v; },
    get vis() { return this.F ? this.F.steps.filter(s => this.shows(s)) : []; },
    get n() { return this.vis.length; },
    get step() { return this.vis[this.cur]; },
    shows(s) { return !this.v || !s.in || s.in.includes(this.v); },
    inV(x, v) { return !v || !x.in || x.in.includes(v); },
    // The versions the reader is looking at: one, both, or none for a flow with none.
    active() { return this.v ? [this.v] : (this.variants.length ? this.variants.map(x => x.id) : [null]); },
    hue(vid) { return HUE[this.variants.findIndex(x => x.id === vid)] || null; },
    // Shared, changed, or one version's own; only drawn when both show.
    status(s) {
      if (!this.both) return { k: 'shared' };
      if (s.in && s.in.length < this.variants.length) return { k: 'only', vid: s.in[0], hue: this.hue(s.in[0]) };
      if (Array.isArray(s.gloss)) return { k: 'changed' };
      return { k: 'shared' };
    },
    // The files a step touches, one icon each in its node, in the order
    // listed. Hovering an icon peeks the file (kits/source-peek.js).
    files(s) {
      return (s.artifacts || []).map((x, k) => ({ ...kindOf(x.kind), k, addr: this.addr(x) }));
    },
    // A file's repo address, owner/repo@ref:path, for a peek; none for a URL.
    addr(x) {
      if (/^https?:/.test(x.path)) return null;
      const repo = x.repo || this.repo, ref = x.repo && x.repo !== this.repo ? 'main' : this.ref;
      return `${repo}@${ref}:${x.path}`;
    },
    // Seen as a change, the steps that changed, in order: a step one version
    // lacks, a step whose sentence differs, or a step with a branch one
    // version lacks. The card steps through them.
    get changes() {
      if (!this.both) return [];
      return this.vis.map((s, i) => i).filter(i => {
        const s = this.vis[i];
        return this.status(s).k !== 'shared' || (s.exits || []).some(x => x.in && x.in.length < this.variants.length);
      });
    },
    // What kind of change a step is, and the sentence that says what it does.
    change(s) {
      const st = this.status(s);
      if (st.k === 'only') return { kind: st.hue.kind, gloss: s.change?.gloss || '' };
      if (st.k === 'changed') return { kind: 'edited', gloss: s.change?.gloss || '' };
      return null;
    },
    actorOf(s) { return this.F.actors.find(a => a.id === s.actor) || { label: s.actor, icon: 'ph-circle' }; },
    col(s) { return Math.max(0, this.F.actors.findIndex(a => a.id === s.actor)) + 1; },
    count(vid) { return this.F ? this.F.steps.filter(s => !vid || !s.in || s.in.includes(vid)).length : 0; },
    nodeClass(i) {
      if (i === this.cur) return 'border-primary ring-2 ring-primary/30' + (this.status(this.vis[i]).k === 'changed' ? ' border-l-4 border-l-warning' : '');
      const st = this.status(this.vis[i]);
      if (st.k === 'changed') return 'border-base-300 border-l-4 border-l-warning bg-base-100 hover:bg-base-200';
      return st.k === 'only' ? st.hue.node : 'border-base-300 bg-base-100 hover:bg-base-200';
    },
    nodeStyle(i) {
      const st = this.status(this.vis[i]);
      const tint = i === this.cur ? 'var(--color-primary)' : st.k === 'only' ? st.hue.tint : '';
      return tint ? `background: color-mix(in oklab, ${tint} 12%, var(--color-base-100));` : '';
    },

    async init() {
      await window.__depsReady;
      try { this.F = await this.read(); } catch (e) { this.err = e.message; return; }
      if (this.F.repo) this.repo = this.F.repo;
      document.title = this.F.title || 'Flow';
      const v = param('v');
      this.v = this.variants.some(x => x.id === v) ? v : (this.variants.length === 1 ? this.variants[0].id : '');
      this.o = param('o') === 'v' ? 'v' : 'h';
      this.cur = this.indexOf(param('step'));
      this.$nextTick(() => this.build());
      window.addEventListener('keydown', e => {
        if (e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName || '')) return;
        // Up and Down step the map's selection while focus is in the map, and
        // focus follows the selected node; elsewhere they scroll as usual.
        const inMap = this.$refs.map.contains(document.activeElement);
        const to = { ArrowLeft: this.cur - 1, ArrowRight: this.cur + 1, Home: 0, End: this.n - 1,
          ...(inMap ? { ArrowUp: this.cur - 1, ArrowDown: this.cur + 1 } : {}) }[e.key];
        if (to == null) return;
        e.preventDefault();
        this.go(to);
        if (inMap) this.$nextTick(() => this.$refs.map.querySelector(`[data-step="${CSS.escape(this.step.id)}"]`)?.focus({ preventScroll: true }));
      });
      // Back after an exit taken: the address names the step to return to.
      window.addEventListener('popstate', () => {
        const i = this.indexOf(param('step'));
        if (i !== this.cur) this.go(i, { quiet: true });
      });
      new ResizeObserver(() => this.draw()).observe(this.$refs.map);
      this.seam();
    },

    // The map's height, dragged at the seam: at least two rows of the map and
    // of the step, kept in this browser on release; a double-click goes back
    // to the default, 40% of the space.
    seam() {
      const KEY = 'flow:map-h', main = this.$refs.main, el = this.$refs.seam;
      try { const v = +localStorage.getItem(KEY); if (v > 0) this.mapH = v; } catch (e) {}
      if (!window.dockSplit || !el) return;
      const r = () => main.getBoundingClientRect();
      const pct = px => px / Math.max(1, r().height) * 100;
      const split = window.dockSplit.attach(el, {
        axis: 'row', from: 'start', label: 'Height of the map',
        bounds: r,
        value: () => pct(this.$refs.map.getBoundingClientRect().height),
        min: () => pct(120), max: () => Math.max(pct(120), 100 - pct(200)),
        onChange: p => { this.mapH = Math.round(p * r().height / 100); },
        onCommit: () => { try { localStorage.setItem(KEY, String(this.mapH)); } catch (e) {} },
      });
      el.addEventListener('dblclick', () => { this.mapH = 0; try { localStorage.removeItem(KEY); } catch (e) {} split.refresh(); });
    },

    async read() {
      const gz = param('gz'), spec = param('gh');
      let F;
      if (gz) F = await window.GzPayload.decodeJson(gz);
      else if (spec) {
        const a = window.RepoAddress.parse(spec);
        if (!a) throw new Error('#gh= reads owner/repo[@ref]:path, and this is not one: ' + spec);
        this.repo = a.repo;
        if (a.ref) this.ref = a.ref;
        try { F = JSON.parse((await new GH({ token: tokenNow(), repo: a.repo, ...(a.ref ? { ref: a.ref } : {}) }).get(a.path)).text); }
        catch (e) { throw new Error(`Could not read ${spec}${tokenNow() ? '' : ' without a stored GitHub token'}: ${e.message}`); }
      } else {
        const r = await fetch('demos/flow-critic-review.json');
        if (!r.ok) throw new Error('No payload. Address one with #gh=owner/repo@ref:path or #gz=…');
        F = await r.json();
      }
      if (F?.schema !== 'flow/1') throw new Error('Not a flow payload (schema: ' + (F?.schema ?? 'none') + ')');
      if (!Array.isArray(F.steps) || !F.steps.length) throw new Error('The payload has no steps');
      if (!Array.isArray(F.actors) || !F.actors.length) throw new Error('The payload has no actors');
      const ids = new Set(F.steps.map(s => s.id));
      F.steps.forEach((s, i) => (s.exits || []).forEach(x => {
        if (!ids.has(x.to)) throw new Error(`Step ${i + 1} (${s.id}) exits to ${x.to}, which no step is`);
      }));
      return F;
    },

    indexOf(id) { return Math.max(0, this.vis.findIndex(s => s.id === id)); },

    // A new track for the steps showing; called again when the version changes.
    build() {
      this.$refs.track.replaceChildren();
      this.deck = swipeDeck.core(this.n, (i, el) => this.render(i, el), {
        start: this.cur, behavior: 'instant', innerClass: 'w-full', slidePad: 'px-4 pt-3 pb-24',
      });
      this.$refs.track.append(this.deck.track);
      // While a move this page made is under way, the track reports the
      // slides it passes, the one it is leaving first; only its arrival counts.
      this.deck.onSlide(i => {
        if (this.heading != null) { if (i === this.heading) this.heading = null; return; }
        if (i !== this.cur) { this.cur = i; this.mark(false); this.reveal(); }
      });
      requestAnimationFrame(() => { this.deck.go(this.cur, 'instant'); this.draw(); this.reveal(); });
      this.mark(false);
    },
    setO(o) {
      if (o === this.o) return;
      this.o = o;
      this.mark(false);
      this.$nextTick(() => { this.draw(); this.reveal(); });
    },
    // The map's layout, both ways: lanes as rows with the steps running
    // across, or lanes as columns with the steps running down.
    get gridStyle() {
      if (!this.F) return '';
      const L = this.F.actors.length;
      return this.o === 'h'
        ? `grid-template-columns: 5.5rem repeat(${this.n}, max-content); grid-template-rows: repeat(${L}, auto); margin-bottom: ${this.gutter ? this.gutter * 12 + 8 : 0}px`
        : `grid-template-columns: repeat(${L}, minmax(5rem, 1fr)); grid-template-rows: 1.25rem; max-width: ${L * 16}rem; margin-right: ${this.gutter ? this.gutter * 12 + 8 : 0}px`;
    },
    bandStyle(k) {
      return (this.o === 'h'
        ? `grid-row: ${k + 1}; grid-column: 2 / span ${this.n}; margin-right: -0.75rem;`
        : `grid-row: 2 / span ${this.n}; grid-column: ${k + 1}; margin-bottom: -0.75rem;`) + ` background: ${this.LANE_BG}`;
    },
    headStyle(k) { return this.o === 'h' ? `grid-row: ${k + 1}; grid-column: 1` : `grid-row: 1; grid-column: ${k + 1}`; },
    nodeAt(s, i) { return this.o === 'h' ? `grid-row: ${this.col(s)}; grid-column: ${i + 2}; ` : `grid-row: ${i + 2}; grid-column: ${this.col(s)}; `; },
    setV(v) {
      if (v === this.v) return;
      const id = this.step?.id;
      this.v = v;
      this.cur = this.vis.findIndex(s => s.id === id);
      if (this.cur < 0) this.cur = 0;
      this.$nextTick(() => this.build());
    },
    // Rewrites only step and v, so a #gz= or #gh= value keeps its own spelling.
    mark(push) {
      const p = location.hash.slice(1).split('&').filter(x => x && !/^(step|v|o)=/.test(x));
      if (this.v && this.variants.length > 1) p.push('v=' + encodeURIComponent(this.v));
      if (this.o === 'v') p.push('o=v');
      if (this.step) p.push('step=' + encodeURIComponent(this.step.id));
      try { history[push ? 'pushState' : 'replaceState'](history.state, '', '#' + p.join('&')); } catch (e) {}
    },
    // A step to a neighbour slides the card and scrolls the map smoothly; a jump cuts.
    go(i, o = {}) {
      const to = Math.max(0, Math.min(this.n - 1, i));
      if (!this.deck) return;
      const near = Math.abs(to - this.cur) === 1 && !calm();
      this.heading = near ? to : null;
      if (near) setTimeout(() => { if (this.heading === to) this.heading = null; }, 800);
      this.cur = to;
      if (!o.quiet) this.mark(!!o.push);
      this.deck.go(to, near ? 'smooth' : 'instant');
      this.reveal();
    },
    take(x) {
      const j = this.vis.findIndex(s => s.id === x.to);
      if (j < 0) return;
      if (j <= this.cur) this.passes++;
      this.go(j, { push: true });
    },
    // The selected node stays in view in the map; its scroll margin keeps a row
    // either side, and with lanes across it is centred so the steps on both sides show.
    reveal() {
      this.$nextTick(() => {
        this.$refs.map.querySelector(`[data-step="${CSS.escape(this.step?.id || '')}"]`)
          ?.scrollIntoView({ block: 'nearest', inline: this.o === 'h' ? 'center' : 'nearest', behavior: calm() ? 'auto' : 'smooth' });
      });
    },

    // Every edge the map draws: the path each version takes from step to step,
    // and each exit that is not that path.
    edges() {
      const vis = this.vis, out = new Map();
      const add = (i, j, vid, kind, label) => {
        const k = `${i}>${j}>${kind}>${kind === 'next' ? '' : label}`;
        const e = out.get(k) || { i, j, kind, vids: new Set(), labels: [] };
        e.vids.add(vid);
        if (label) e.labels.push({ label, vid });
        out.set(k, e);
      };
      const next = (i, vid) => {
        if (vis[i].end) return -1;
        for (let j = i + 1; j < vis.length; j++) if (this.inV(vis[j], vid)) return j;
        return -1;
      };
      vis.forEach((s, i) => this.active().forEach(vid => {
        if (!this.inV(s, vid)) return;
        const j = next(i, vid);
        if (j >= 0) add(i, j, vid, 'next');
        (s.exits || []).forEach(x => {
          if (!this.inV(x, vid)) return;
          const t = vis.findIndex(y => y.id === x.to);
          if (t < 0) return;
          if (t === j) add(i, j, vid, 'next', x.label);
          else add(i, t, vid, t <= i ? 'loop' : 'skip', x.label);
        });
      }));
      return [...out.values()];
    },
    // The edges as SVG over the map, from the nodes' laid-out boxes.
    draw() {
      const map = this.$refs.map;
      if (!this.F || !map) return;
      const box = id => { const el = map.querySelector(`[data-step="${CSS.escape(id)}"]`); return el && { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; };
      const grid = this.$refs.grid;
      const H_ = this.o === 'h';
      const gx0 = grid.offsetLeft + grid.offsetWidth + 10;   // lanes down: loops run in a gutter at the right
      const gy0 = grid.offsetTop + grid.offsetHeight + 10;   // lanes across: in a gutter below
      const all = this.active().filter(Boolean);
      const paint = e => {
        const one = all.length > 1 && e.vids.size === 1 ? this.hue([...e.vids][0]) : null;
        return { stroke: one ? one.stroke : 'color-mix(in oklab, var(--color-base-content) 45%, transparent)', dash: one ? one.dash : '' };
      };
      let s = '', lane = 0;
      const pills = [];
      // One arrowhead per line color, filled with that color: Safari draws a
      // marker's context-stroke as black.
      const heads = new Map();
      const arrow = c => { if (!heads.has(c)) heads.set(c, 'flow-arrow-' + heads.size); return heads.get(c); };
      const edges = this.edges();
      // Edges sharing a node fan out along its edge, so no two meet it at one
      // point: forward edges along its bottom and top, ordered by the other
      // end's x; loops along its right side.
      const fan = new Map();
      const slot = (key, e, order) => { if (!fan.has(key)) fan.set(key, []); fan.get(key).push({ e, order }); };
      edges.forEach(e => {
        const a = box(this.vis[e.i].id), b = box(this.vis[e.j].id);
        if (!a || !b) return;
        e.a = a; e.b = b;
        if (H_) {
          if (e.kind === 'loop') { slot('b' + e.i, e, -b.x); slot('b' + e.j, e, -a.x); }
          else { slot('r' + e.i, e, b.y + b.h / 2); slot('l' + e.j, e, a.y + a.h / 2); }
        } else if (e.kind === 'loop') { slot('r' + e.i, e, b.y); slot('r' + e.j, e, a.y); }
        else { slot('b' + e.i, e, b.x + b.w / 2); slot('t' + e.j, e, a.x + a.w / 2); }
      });
      const off = (key, e, gap) => {
        const list = (fan.get(key) || []).sort((p, q) => p.order - q.order);
        const k = list.findIndex(x => x.e === e);
        return k < 0 ? 0 : (k - (list.length - 1) / 2) * gap;
      };
      edges.forEach(e => {
        const a = e.a, b = e.b;
        if (!a || !b) return;
        const p = paint(e);
        let d, first = 0;
        if (H_ && e.kind === 'loop') {
          // Down from the source's foot to the gutter under the lanes, back along it, up into the target's foot.
          const gy = gy0 + lane++ * 12, r = 8;
          const x1 = a.x + a.w / 2 + off('b' + e.i, e, 10), y1 = a.y + a.h;
          const x2 = b.x + b.w / 2 + off('b' + e.j, e, 10), y2 = b.y + b.h + 2;
          const back = x2 < x1 ? -1 : 1;
          d = `M${x1} ${y1} V${gy - r} Q${x1} ${gy} ${x1 + back * r} ${gy} H${x2 - back * r} Q${x2} ${gy} ${x2} ${gy - r} V${y2}`;
          first = (gy - r - y1) + Math.abs(x2 - x1) / 2;   // a loop's label tries the middle of its run along the gutter
        } else if (H_) {
          // A curve from the source's right side to the target's left. Where a
          // step between them sits across its way, the edge dips to a channel
          // just under every such step, runs along it, and rises back.
          const x1 = a.x + a.w, y1 = a.y + a.h / 2 + off('r' + e.i, e, 8);
          const x2 = b.x - 2, y2 = b.y + b.h / 2 + off('l' + e.j, e, 8);
          const lo = Math.min(y1, y2) - 6, hi = Math.max(y1, y2) + 6;
          const block = this.vis.slice(e.i + 1, e.j).map(x => box(x.id)).filter(m => m && m.y < hi && m.y + m.h > lo);
          if (block.length) {
            const Y = Math.max(...block.map(m => m.y + m.h)) + 10;
            const xa = Math.min(...block.map(m => m.x)), xb = Math.max(...block.map(m => m.x + m.w));
            d = `M${x1} ${y1} C${(x1 + xa) / 2} ${y1} ${(x1 + xa) / 2} ${Y} ${xa} ${Y} H${xb} C${(xb + x2) / 2} ${Y} ${(xb + x2) / 2} ${y2} ${x2} ${y2}`;
          } else {
            const mx = (x1 + x2) / 2;
            d = `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
          }
        } else if (e.kind === 'loop') {
          // Out of the source's right side, up the gutter with rounded turns, into the target's right side.
          const gx = gx0 + lane++ * 12, r = 8;
          const o1 = off('r' + e.i, e, 6);
          const y1 = a.y + a.h / 2 + o1, y2 = b.y + b.h / 2 + off('r' + e.j, e, 6);
          const up = y2 < y1 ? -1 : 1;
          d = `M${a.x + a.w} ${y1} H${gx - r} Q${gx} ${y1} ${gx} ${y1 + up * r} V${y2 - up * r} Q${gx} ${y2} ${gx - r} ${y2} H${b.x + b.w + 2}`;
          first = (gx - r - a.x - a.w) / 2;   // a loop's label tries the stretch leaving its step first
        } else {
          // A curve from the source's foot to the target's head. Where a step
          // between them sits across its way, the edge curves out to a channel
          // just right of every such step, runs down it, and curves back in.
          const x1 = a.x + a.w / 2 + off('b' + e.i, e, 10), y1 = a.y + a.h;
          const x2 = b.x + b.w / 2 + off('t' + e.j, e, 10), y2 = b.y - 2;
          const lo = Math.min(x1, x2) - 6, hi = Math.max(x1, x2) + 6;
          const block = this.vis.slice(e.i + 1, e.j).map(x => box(x.id)).filter(m => m && m.x < hi && m.x + m.w > lo);
          if (block.length) {
            const X = Math.max(...block.map(m => m.x + m.w)) + 12 + Math.abs(off('b' + e.i, e, 6));
            const ya = Math.min(...block.map(m => m.y)), yb = Math.max(...block.map(m => m.y + m.h));
            d = `M${x1} ${y1} C${x1} ${(y1 + ya) / 2} ${X} ${(y1 + ya) / 2} ${X} ${ya} V${yb} C${X} ${(yb + y2) / 2} ${x2} ${(yb + y2) / 2} ${x2} ${y2}`;
          } else {
            const my = (y1 + y2) / 2;
            d = `M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}`;
          }
        }
        s += `<path d="${d}" fill="none" stroke="${p.stroke}" stroke-width="1.5"${p.dash ? ` stroke-dasharray="${p.dash}"` : ''} marker-end="url(#${arrow(p.stroke)})"/>`;
        e.labels.forEach(l => pills.push({ d, first, label: l.label, hue: all.length > 1 ? this.hue(l.vid) : null, stroke: p.stroke }));
      });
      s += this.bubbles(pills, this.vis.map(x => box(x.id)).filter(Boolean));
      // The loops' lanes widen the map's right margin, which moves the grid: draw again.
      if (lane !== this.gutter) { this.gutter = lane; this.$nextTick(() => this.draw()); }
      const W = H_ ? Math.max(map.clientWidth, grid.offsetLeft + grid.offsetWidth + 12) : Math.max(map.clientWidth, gx0 + lane * 12);
      const H = H_ ? Math.max(map.clientHeight, gy0 + lane * 12) : map.scrollHeight;
      const defs = [...heads].map(([c, id]) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${c}"/></marker>`).join('');
      this.svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="absolute left-0 top-0 pointer-events-none" aria-hidden="true"><defs>${defs}</defs>${s}</svg>`;
    },
    gutter: 0,

    // Each edge label as a bubble sitting on its own edge. A bubble tries points
    // along the edge, its preferred point first and then outward from the
    // middle, and at each point tries just over and under the line, then
    // slides along it in 12px steps; it takes the
    // first place that covers no step and no bubble already placed, else the
    // place that covers least, nearest its point.
    bubbles(pills, nodes) {
      if (!pills.length) return '';
      if (!this._ruler) {
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('style', 'position:absolute;width:0;height:0;visibility:hidden');
        this._path = svg.appendChild(document.createElementNS(NS, 'path'));
        document.body.append(svg);
        this._ruler = document.createElement('canvas').getContext('2d');
        this._ruler.font = '12px system-ui, sans-serif';
      }
      const H = 18, placed = [];
      const hit = (r, q) => r.x < q.x + q.w && q.x < r.x + r.w && r.y < q.y + q.h && q.y < r.y + r.h;
      const cover = r => nodes.filter(n => hit(r, { x: n.x - 1, y: n.y - 1, w: n.w + 2, h: n.h + 2 })).length * 2 + placed.filter(q => hit(r, q)).length * 3;
      return pills.map(pl => {
        this._path.setAttribute('d', pl.d);
        const L = this._path.getTotalLength();
        const W = Math.ceil(this._ruler.measureText(pl.label).width) + 16;
        const at = [pl.first, L / 2, L * 0.35, L * 0.65, L * 0.2, L * 0.8].filter(v => v > 0 && v < L);
        let best = null;
        for (const dist of at) {
          const c = this._path.getPointAtLength(dist);
          const slide = Array.from({ length: 24 }, (_, k) => (k >> 1) * 12 + 12).map((v, k) => [k % 2 ? -v : v, 0]);
          for (const [dx, dy] of [[0, 0], [0, -(H + 2)], [0, H + 2], ...slide, [0, -(2 * H + 4)], [0, 2 * H + 4]]) {
            const r = { x: c.x + dx - W / 2, y: c.y + dy - H / 2, w: W, h: H };
            const k = cover(r);
            if (!best || k < best.k) best = { r, k };
            if (!k) break;
          }
          if (!best.k) break;
        }
        const r = best.r;
        placed.push(r);
        const hue = pl.hue;
        const fill = hue ? `color-mix(in oklab, ${hue.tint} 14%, var(--color-base-100))` : 'var(--color-base-100)';
        return `<g><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${H / 2}" fill="${fill}" stroke="${pl.stroke}" stroke-width="1"${hue?.dash ? ` stroke-dasharray="4 3"` : ''}/>`
          + `<text x="${r.x + r.w / 2}" y="${r.y + H / 2 + 4}" text-anchor="middle" font-size="12" font-family="system-ui, sans-serif" fill="${hue ? hue.ink : 'var(--color-base-content)'}">${window.esc(pl.label)}</text></g>`;
      }).join('');
    },

    // A step's card holds only what the map does not show: the step's
    // sentence (each version's where they differ), its branches, and its
    // files as links. Its name, lane and version are on the map above.
    render(i, el) {
      el.replaceChildren();
      const s = this.vis[i];
      const root = h('article', 'grid gap-3 text-base leading-6');
      const ch = this.both ? this.change(s) : null;
      const CK = { edited: { name: 'Edited', badge: 'badge-warning', hue: 'warning', icon: 'ph-pencil-simple-line' },
                   added: { name: 'Added', badge: 'badge-success', hue: 'success', icon: 'ph-plus-circle' },
                   removed: { name: 'Removed', badge: 'badge-error', hue: 'error', icon: 'ph-minus-circle' } };

      // Seen as a change: where this step stands among the changes, and the
      // arrows that step from change to change past the steps that did not.
      const nav = () => {
        const list = this.changes;
        if (!list.length) return null;
        const k = list.indexOf(i), prev = [...list].reverse().find(j => j < i), next = list.find(j => j > i);
        const row = h('div', 'flex items-center gap-1 text-xs text-base-content/60 tabular-nums');
        const btn = (to, ic, label) => {
          const b = h('button', 'btn btn-ghost btn-xs btn-square');
          b.type = 'button'; b.disabled = to == null; b.setAttribute('aria-label', label);
          b.append(icon(ic));
          b.addEventListener('click', () => this.go(to));
          return b;
        };
        row.append(btn(prev, 'ph-caret-left', 'Previous change'),
          h('span', 'min-w-[9ch] text-center', k >= 0 ? `change ${k + 1} of ${list.length}` : `${list.length} changes`),
          btn(next, 'ph-caret-right', 'Next change'));
        return row;
      };
      // Seen as a change, the card opens on it: what kind of change this
      // step is and the arrows that step from change to change, then one
      // sentence saying what the change does.
      if (this.both && (ch || this.changes.includes(i))) {
        const head = h('div', 'flex items-center gap-2 min-h-6');
        if (ch) {
          const c = CK[ch.kind];
          const tag = h('span', `badge ${c.badge} badge-sm gap-1`);
          tag.append(icon(c.icon), document.createTextNode(c.name));
          head.append(tag);
        } else head.append(h('span', 'text-xs text-base-content/60', 'Branches changed'));
        const n = nav();
        if (n) { n.classList.add('ml-auto'); head.append(n); }
        root.append(head);
        if (ch?.gloss) root.append(inline(h('p', 'font-medium -mt-1'), ch.gloss));
      }

      // The step's sentence. Seen as a change, an edited sentence is the
      // change's inline reading (kits/md-diff.js): words removed struck,
      // words added tinted. A step only one version has is a band in its
      // change color. Seen as one version, the sentence is plain.
      const gloss = vid => Array.isArray(s.gloss) ? (s.gloss.find(x => x.v === vid)?.gloss || '') : (s.gloss || '');
      const st = this.status(s);
      if (st.k === 'changed') {
        // The change container from the diff views (mdDiff.one): it opens on
        // the change marked in place, and swiping it shows the sentence as it
        // stood and as it would read. Its track contains its own overscroll,
        // so a swipe inside it does not move the strip of steps.
        const [a, b] = this.variants.map(x => gloss(x.id));
        const slot = h('div', 'min-w-0');
        slot.append(inline(h('p', 'border-l-4 border-warning pl-3'), b));
        root.append(slot);
        window.mdDiff?.one(a, b).then(c => {
          if (!c) return;
          c.style.paddingTop = '0.5rem';   // room under the stops pill, which sits on the top edge
          c.classList.add('mt-2');
          slot.replaceChildren(c);
        }).catch(() => {});
      } else if (st.k === 'only') {
        root.append(inline(h('p', `${st.hue.band} ${st.hue.strike}`), gloss(st.vid)));
      } else root.append(inline(h('p'), gloss(this.v || this.variants[0]?.id)));

      // The branches the reader can take from here, one row each.
      const exits = (s.exits || []).filter(x => this.active().some(vid => this.inV(x, vid)) && this.vis.some(y => y.id === x.to));
      if (exits.length) {
        const ul = h('div', 'grid divide-y divide-base-300 border-y border-base-300');
        exits.forEach(x => {
          const j = this.vis.findIndex(y => y.id === x.to), back = j <= i;
          const hue = this.both && x.in && x.in.length < this.variants.length ? this.hue(x.in[0]) : null;
          const b = h('button', `w-full text-left grid grid-cols-[auto_auto_minmax(0,1fr)] items-baseline gap-x-2 py-1.5 hover:bg-base-200 ${hue ? hue.band.replace('pl-3', 'pl-2') : ''}`);
          b.type = 'button';
          b.append(icon(back ? 'ph-arrow-u-up-left' : 'ph-arrow-bend-down-right', 'self-start mt-1'));
          b.append(h('span', 'badge badge-neutral badge-sm', x.label || (back ? 'loop' : 'branch')));
          const t = inline(h('span', 'min-w-0'), x.when || '');
          t.append(h('span', 'ml-2 text-xs text-base-content/60 whitespace-nowrap', (back ? '↺ ' : '→ ') + (j + 1) + '. ' + this.vis[j].label));
          if (hue && x.change?.gloss) t.append(inline(h('span', 'block text-sm text-base-content/70'), x.change.gloss));
          b.append(t);
          b.addEventListener('click', () => this.take(x));
          ul.append(b);
        });
        root.append(ul);
      }

      // The scripts, skills and records the step touches, a line each.
      if (s.artifacts?.length) {
        const ul = h('ul', 'grid gap-1');
        s.artifacts.forEach(x => {
          const repo = x.repo || this.repo, ref = x.repo && x.repo !== this.repo ? 'main' : this.ref;
          const href = /^https?:/.test(x.path) ? x.path : window.RepoAddress.github.blob(repo, ref, x.path);
          const kd = kindOf(x.kind);
          const li = h('li', 'flex items-baseline gap-2 min-w-0');
          li.append(icon(kd.icon, 'self-center text-lg ' + kd.color), h('span', 'font-semibold shrink-0', x.label));
          const link = h('a', 'link link-hover font-mono text-xs text-base-content/60 truncate', (repo !== this.repo ? repo.split('/')[1] + ': ' : '') + x.path);
          link.href = href; link.target = '_blank'; link.rel = 'noopener';
          const at = this.addr(x);
          if (at) link.dataset.peek = at;
          li.append(link);
          ul.append(li);
        });
        root.append(ul);
      }

      el.append(root);
    },
  }));
});
</script>
</head>
<body class="bg-base-100 text-base-content [--fab-bottom:4.5rem]">
<div x-data="flow()" class="fixed inset-0 grid grid-cols-[minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)_auto]">

  <header class="border-b border-base-300 px-4 py-2 grid gap-1">
    <div class="grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-3">
      <i class="ph ph-flow-arrow text-xl"></i>
      <h1 class="font-semibold text-lg truncate" x-text="F ? F.title : 'Flow'"></h1>
      <span x-show="F" class="flex items-center gap-2 text-sm text-base-content/70 tabular-nums">
<nav x-show="F" aria-label="Lanes" class="join shrink-0">
      <button type="button" class="btn btn-xs join-item" :class="o === 'h' ? 'btn-neutral' : 'btn-ghost'" @click="setO('h')" aria-label="Lanes across"><i class="ph ph-rows text-sm"></i></button>
      <button type="button" class="btn btn-xs join-item" :class="o === 'v' ? 'btn-neutral' : 'btn-ghost'" @click="setO('v')" aria-label="Lanes down"><i class="ph ph-columns text-sm"></i></button>
    </nav>
        <span x-show="passes" class="badge badge-ghost gap-1 min-w-[4ch]"><i class="ph ph-arrow-u-up-left"></i><span x-text="passes"></span></span>
        <span class="min-w-[7ch] text-right" x-text="(cur + 1) + ' / ' + n"></span>
      </span>
    </div>
    <nav x-show="variants.length > 1" aria-label="Version" class="flex items-center gap-2 overflow-x-auto text-xs min-w-0">
      <span class="text-base-content/60 shrink-0">Version</span>
      <button type="button" class="btn btn-xs rounded-full shrink-0 gap-1" :class="!v ? 'btn-neutral' : 'btn-ghost'" @click="setV('')">
        Changes <span class="tabular-nums opacity-70" x-text="count('')"></span>
      </button>
      <template x-for="(x, k) in variants" :key="x.id">
        <button type="button" class="btn btn-xs rounded-full shrink-0 gap-1" :class="v === x.id ? 'btn-neutral' : 'btn-ghost'" @click="setV(x.id)">
          <span class="inline-block w-3 h-3 rounded-full border-2" :class="k ? 'border-success' : 'border-error/70 border-dashed'"></span>
          <span x-text="x.label"></span><span class="tabular-nums opacity-70" x-text="count(x.id)"></span>
        </button>
      </template>
    </nav>
  </header>

  <main x-ref="main" class="min-h-0 min-w-0 grid grid-cols-[minmax(0,1fr)]"
        :style="`grid-template-rows: ${mapH ? mapH + 'px' : 'minmax(0,2fr)'} auto minmax(0,3fr)`">
    <div x-show="err" class="px-4 py-3 text-error" x-text="err"></div>
    <div x-show="!F && !err" class="grid place-items-center"><span class="loading loading-dots loading-lg text-primary"></span></div>

    <section x-show="F" x-ref="map" aria-label="Map" class="relative min-h-0 overflow-auto [scrollbar-gutter:stable]">
      <!-- Lanes down: a backdrop under the lane heads, the map's full width, so an edge scrolled beneath them stays hidden. -->
      <div x-show="o === 'v'" class="sticky top-0 z-[5] h-[2.75rem] -mb-[2.75rem] bg-base-100"></div>
      <div x-ref="grid" class="grid" :class="o === 'h' ? 'w-max gap-x-6 gap-y-3 p-3 pl-0' : 'gap-x-3 gap-y-6 px-3 pb-3'" :style="gridStyle">
        <!-- Each lane is a band the height of its steps, headed above by a medallion and a name, so who does a step is read from where it sits. -->
        <template x-for="(a, k) in (F ? F.actors : [])" :key="'band-' + a.id">
          <div class="rounded-box" :style="bandStyle(k)"></div>
        </template>
        <template x-for="(a, k) in (F ? F.actors : [])" :key="a.id">
          <div class="sticky z-10 bg-base-100 grid justify-items-center content-center text-base-content/80"
               :class="o === 'h' ? 'left-0 self-stretch -my-1.5 py-1.5 px-1' : 'top-0 self-start h-[2.75rem]'" :style="headStyle(k) + (o === 'h' && k === F.actors.length - 1 && gutter ? `; margin-bottom: -${gutter * 12 + 14}px; padding-bottom: ${gutter * 12 + 20}px` : '')">
            <span class="grid place-items-center size-7 rounded-full bg-base-100 border shadow-sm"
                  :class="step?.actor === a.id ? 'border-primary text-primary ring-2 ring-primary/30' : 'border-base-300'"><i class="ph text-lg" :class="a.icon"></i></span>
            <span class="text-xs font-semibold leading-tight text-center px-1" :class="step?.actor === a.id ? 'text-primary' : ''" x-text="a.label"></span>
          </div>
        </template>
        <template x-for="(s, i) in vis" :key="s.id + v">
          <button type="button" :data-step="s.id" @click="go(i)" :aria-current="i === cur ? 'step' : null"
                  class="relative z-[1] scroll-my-20 scroll-mx-24 justify-self-center w-fit text-left rounded-box border px-2 py-1.5 text-sm leading-5 grid grid-cols-[auto_minmax(0,1fr)] gap-x-1.5"
                  :class="nodeClass(i) + (o === 'h' ? ' self-center max-w-[10rem]' : ' max-w-full')" :style="nodeAt(s, i) + nodeStyle(i)">
            <span class="tabular-nums text-xs opacity-60 pt-px" x-text="i + 1"></span>
            <span class="grid">
              <span :class="status(s).k === 'only' ? status(s).hue.strike : ''" x-text="s.label"></span>
              <span x-show="files(s).length" class="flex gap-0.5 mt-0.5">
                <template x-for="f in files(s)" :key="f.k">
                  <i class="ph text-sm" :class="f.icon + ' ' + f.color" :data-peek="f.addr" :aria-label="f.name"></i>
                </template>
              </span>
            </span>
          </button>
        </template>
      </div>
      <div x-html="svg"></div>
    </section>

    <div x-show="F" x-ref="seam" class="h-3"></div>

    <section x-show="F" aria-label="Step" class="min-h-0 min-w-0 grid grid-cols-[minmax(0,1fr)]">
      <div x-ref="track" class="min-h-0 min-w-0 h-full"></div>
    </section>
  </main>

  <footer x-show="F" class="border-t border-base-300 px-2 py-1 grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-1">
    <button type="button" class="btn btn-ghost btn-square" aria-label="Previous step" @click="go(cur - 1)" :disabled="cur === 0">
      <i class="ph ph-caret-left text-xl"></i>
    </button>
    <div class="min-w-0 flex justify-center-safe overflow-x-auto">
      <template x-if="n <= 25">
        <div class="flex">
          <template x-for="(s, i) in vis" :key="s.id + v">
            <button type="button" class="h-10 w-6 shrink-0 grid place-items-center" :aria-label="'Step ' + (i + 1) + ', ' + s.label"
                    :aria-current="i === cur ? 'step' : null" @click="go(i)">
              <span class="rounded-full" :class="i === cur ? 'h-4 w-4 bg-neutral' : 'h-2.5 w-2.5 bg-base-content/30'"></span>
            </button>
          </template>
        </div>
      </template>
      <template x-if="n > 25">
        <input type="range" class="range range-xs w-full" min="1" :max="n" :value="cur + 1" aria-label="Step" @input="go($event.target.value - 1)">
      </template>
    </div>
    <button type="button" class="btn btn-ghost btn-square" aria-label="Next step" @click="go(cur + 1)" :disabled="cur === n - 1">
      <i class="ph ph-caret-right text-xl"></i>
    </button>
  </footer>
</div>
</body>
</html>
