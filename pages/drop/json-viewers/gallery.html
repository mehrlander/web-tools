<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Viewers Gallery</title>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
<script defer src="https://unpkg.com/alpinejs"></script>
</head>
<body class="bg-base-100">
<div x-data="gallery()" x-init="boot()" @keydown.window="key($event)"
     class="fixed inset-0 grid grid-rows-[auto_1fr_auto] min-h-0">

  <header class="flex items-center gap-2 px-3 py-2 border-b border-base-300 min-w-0">
    <button class="btn btn-ghost btn-sm btn-square lg:hidden" x-show="pane==='frame'" @click="back()" aria-label="Back to list"><i class="ph ph-arrow-left text-lg"></i></button>
    <span class="font-semibold truncate">JSON viewers</span>
    <select class="select select-sm w-auto" x-model="filter" @change="refilter()">
      <template x-for="f in filters" :key="f.k"><option :value="f.k" x-text="`${f.label} · ${count(f.k)}`"></option></template>
    </select>
    <span class="text-xs font-mono text-base-content/60 shrink-0" x-text="`${i + 1}/${rows.length}`"></span>
    <span class="flex-1"></span>
    <a class="btn btn-ghost btn-sm" :href="alone(cur)" target="_blank" rel="noopener" x-show="cur">Open <i class="ph ph-arrow-square-out"></i></a>
    <a class="btn btn-ghost btn-sm hidden sm:inline-flex" :href="cur?.url" target="_blank" rel="noopener" x-show="cur?.url">Pen <i class="ph ph-arrow-square-out"></i></a>
  </header>

  <main class="grid lg:grid-cols-[minmax(0,24rem)_minmax(0,1fr)] min-h-0 min-w-0">
    <ul class="overflow-y-auto min-h-0 border-r border-base-300" :class="pane==='frame' && 'max-lg:hidden'" x-ref="list">
      <template x-for="(r, n) in rows" :key="r.p">
        <li :data-n="n" @click="go(n, true)"
            class="flex gap-3 p-3 cursor-pointer border-b border-base-200 hover:bg-base-200"
            :class="n===i && 'bg-base-200'">
          <img :src="thumb(r)" loading="lazy" alt="" class="w-28 aspect-[16/10] object-cover object-top rounded border border-base-300 shrink-0 bg-base-200">
          <div class="min-w-0 flex flex-col gap-1">
            <div class="font-medium text-sm flex items-center gap-1">
              <i class="ph-fill ph-star text-warning" x-show="r.pick"></i>
              <span class="truncate" x-text="r.t"></span>
            </div>
            <div class="text-sm text-base-content/70 text-pretty" x-text="r.idea"></div>
            <div class="text-xs text-base-content/50 flex flex-wrap gap-x-2">
              <span x-text="r.s + (r.d ? ' ' + r.d : '') + (r.v ? ' · v' + r.v : '')"></span>
              <span x-text="r.lib"></span>
              <span class="text-warning" x-show="r.needs" x-text="needsLabel[r.needs]"></span>
            </div>
          </div>
        </li>
      </template>
    </ul>
    <section class="min-h-0 min-w-0 bg-white" :class="pane==='list' && 'max-lg:hidden'">
      <iframe x-show="cur" :src="cur ? frameSrc(cur) : 'about:blank'" class="w-full h-full border-0"></iframe>
    </section>
  </main>

  <footer class="flex items-center gap-3 px-3 py-2 border-t border-base-300">
    <button class="btn btn-sm btn-ghost" @click="step(-1)" :disabled="i===0"><i class="ph ph-caret-left"></i></button>
    <progress class="progress flex-1" :value="i + 1" :max="rows.length"></progress>
    <button class="btn btn-sm btn-ghost" @click="step(1)" :disabled="i>=rows.length-1"><i class="ph ph-caret-right"></i></button>
  </footer>
</div>

<script>
const DATA = [{"p": "websim/codemirror-json-and-html-folding-demo.html","t": "CodeMirror JSON and HTML Folding Demo","s": "WebSim","lib": "CodeMirror 5, chroma.js, Tabulator","needs": "net","idea": "Fold widgets shaped by type; one color per key everywhere (golden-angle hues); per-array schema table","pick": 1,"v": 100},{"p": "websim/elegant-tree-view-component-with-api-sel.html","t": "Elegant Tree View Component with API Selection #1","s": "WebSim","lib": "hand-written, Tailwind","needs": "net","idea": "A collapsed array of objects reads as a table: key-union header, aligned value chips, presence counts","pick": 2},{"p": "codepen/renderjson-mdyyxd.html","t": "renderJson","s": "CodePen","lib": "hand-written","needs": "","idea": "Lazy: a collapsed node is \"{12 items}\", built on first click, cached; the output stays valid, copyable JSON","pick": 3,"url": "https://codepen.io/Mark-E/pen/mdYYXdq","d": "28-Jun-24"},{"p": "codepen/tree-display-component-rwowwz.html","t": "Tree display component · rwowwz","s": "CodePen","lib": "web component","needs": "","idea": "Single-child chains fold onto one line; connector lines drawn in CSS alone","pick": 4,"url": "https://codepen.io/Mark-E/pen/RwOWwzJ","d": "5-Mar-24"},{"p": "codepen/chicago-art-institute-tree-view-opyaxg.html","t": "Chicago art institute tree view","s": "CodePen","lib": "Alpine, Tailwind, Lucide","needs": "net","idea": "Open state kept as a Set of paths; children rendered only when open; [n] and {…} summaries","pick": 5,"url": "https://codepen.io/Mark-E/pen/OPyaxGJ","d": "1-Sep-25"},{"p": "websim/json-structure-visualizer.html","t": "JSON Structure Visualizer","s": "WebSim","lib": "D3 (head lost in export)","needs": "broken","idea": "Every node carries its path: clickable breadcrumb, prev/next steps through siblings","pick": 6,"v": 49},{"p": "websim/spacex-json-viewer-with-auto-folding.html","t": "SpaceX JSON Viewer with Auto-Folding","s": "WebSim","lib": "CodeMirror 5","needs": "net","idea": "Fold policies: belo ","s": "WebSim","lib": "CodeMirror 5","needs": "","idea": "First fold-widget version: key chips only","v": 1},{"p": "websim/data-explorer-with-tabulator.html","t": "Data Explorer with Tabulator","s": "WebSim","lib": "Tabulator, Alpine","needs": "broken","idea": "Paged table; calls Alpine 2 API under Alpine 3","v": 3},{"p": "websim/elegant-tree-view-component.html","t": "Elegant Tree View Component #1","s": "WebSim","lib": "hand-written, Tailwind","needs": "net","idea": "Ellipsis rows, tinted open rows"},{"p": "websim/elegant-tree-view-component-2.html","t": "Elegant Tree View Component #2","s": "WebSim","lib": "hand-written, Tailwind","needs": "net","idea": "Simplest of the elegant-tree line"},{"p": "websim/elegant-tree-view-component-3.html","t": "Elegant Tree View Component #3","s": "WebSim","lib": "hand-written, Tailwind","needs": "net","idea": "Colored preview chips under containers"},{"p": "websim/elegant-tree-view-component-4.html","t": "Elegant Tree View Component #4","s": "WebSim","lib": "hand-written, Tailwind","needs": "net","idea": "Array headers show the union of item keys"},{"p": "websim/elegant-tree-view-component-5.html","t": "Elegant Tree View Component #5","s": "WebSim","lib": "hand-written, Tailwind","needs": "net","idea": "Fixed key gutter, role borders, measured column widths"},{"p": "websim/elegant-tree-view-component-with-api-sel-2.html","t": "Elegant Tree View Component with API Selection #2","s": "WebSim","lib": "hand-written, Tailwind","needs": "net","idea": "Adds a raw JSON pane and array legend cards"},{"p": "websim/elegant-tree-view-component-with-expanda.html","t": "Elegant Tree View Component with Expandable Containers","s": "WebSim","lib": "hand-written, Tailwind","needs": "net","idea": "Accent legend and key stats popup","v": 1},{"p": "websim/html-tree-viewer.html","t": "HTML Tree Viewer","s": "WebSim","lib": "FancyTree","needs": "cors","idea": "DOM tree with unwrapping and empty-node pruning","v": 25},{"p": "websim/infinite-tree-demo function gallery() {
  const hosted = /(^|\.)github\.io$|^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  const ref = window.__ref || 'main';
  const REPO = 'mehrlander/web-tools', DIR = 'pages/drop/json-viewers/';
  return {
    all: DATA, rows: [], i: 0, filter: 'pick', pane: 'list',
    filters: [
      { k: 'pick', label: 'Picks' }, { k: 'all', label: 'All' },
      { k: 'CodePen', label: 'CodePen' }, { k: 'WebSim', label: 'WebSim' },
      { k: 'offline', label: 'Runs offline' },
    ],
    needsLabel: { net: 'live API', cors: 'CORS-blocked fetch', input: 'paste input', broken: 'broken as extracted' },
    get cur() { return this.rows[this.i]; },
    test(k, r) {
      return k === 'all' || (k === 'pick' ? !!r.pick : k === 'offline' ? !r.needs : r.s === k);
    },
    count(k) { return this.all.filter(r => this.test(k, r)).length; },
    boot() {
      const h = new URLSearchParams(location.hash.slice(1));
      if (h.get('f')) this.filter = h.get('f');
      this.refilter(h.get('p'));
      if (h.get('p') && window.innerWidth < 1024) this.pane = 'frame';
      addEventListener('popstate', () => { if (this.pane === 'frame') this.pane = 'list'; });
    },
    refilter(p) {
      this.rows = this.all.filter(r => this.test(this.filter, r));
      const n = this.rows.findIndex(r => r.p === p);
      this.go(n < 0 ? 0 : n, false);
    },
    go(n, open) {
      this.i = Math.max(0, Math.min(n, this.rows.length - 1));
      if (this.cur) try { history.replaceState(null, '', `#f=${this.filter}&p=${this.cur.p}`); } catch {}
      if (open && window.innerWidth < 1024 && this.pane === 'list') { this.pane = 'frame'; try { history.pushState('frame', '', location.hash); } catch {} }
      this.$nextTick(() => this.$refs.list.querySelector(`[data-n="${this.i}"]`)?.scrollIntoView({ block: 'nearest' }));
    },
    step(d) { this.go(this.i + d, false); },
    back() { if (history.state === 'frame') history.back(); this.pane = 'list'; },
    key(e) {
      if (e.target.closest('select,input,textarea')) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); this.step(1); }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); this.step(-1); }
      if (e.key === 'Escape' && this.pane === 'frame') this.back();
    },
    frameSrc(r) {
      return hosted ? r.p : `https://mehrlander.github.io/web-tools/pages/toss-render.html#gh=${REPO}@${ref}:${DIR}${r.p}`;
    },
    alone(r) { return r ? (hosted ? new URL(r.p, location.href).href : this.frameSrc(r)) : '#'; },
    thumb(r) {
      const t = `thumbs/drop/json-viewers/${r.p.replace(/\.html$/, '.png')}`;
      return hosted ? `../../${t}` : `https://raw.githubusercontent.com/${REPO}/${ref}/pages/${t}`;
    },
  };
}
</script>
</body>
</html>
