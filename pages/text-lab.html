<!DOCTYPE html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Lab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔬</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  text-lab.html — the front page of home's Text project (projects/text), the
  estate's text analysis as one reading surface. Six panes over one subject: what we tried, the variants we
  retained, what we read with, what we read against, what came out, and what we write toward.

  Named Text LAB, not Text Instruments. That name collided twice: with Texas
  Instruments on sight, which no amount of context undoes, and with this page's
  own `instruments` tab, so the whole and one of its parts wore one word.
  `-lab` is the suffix the tools themselves already use (termlab, registerlab,
  entitylab, concept-lab), so it names the whole without renaming a part.

    probes       projects/text/probes/probes.csv, the registry docs/probes.md
                 specifies. One row per bounded question, with a recorded
                 standing and four badges (asks, grain, method, checked), each
                 a value from projects/text/vocabulary.csv. The pane is a list
                 with a detail: the probes beside one probe's card, which
                 holds its question, what was found, its particulars, its run
                 and that run's other probes. The list groups by date or by
                 any badge, and a tap on a badge in a card filters by it.
                 Failures are recorded at the same weight as successes, so the
                 standing counts lead the header.
    variants     The shared Text collection, read from its committed files
                 in home (passages.jsonl, variants.jsonl, proposals.jsonl):
                 every variant, as passage, alternative wording, author, and
                 purpose, with a chip naming each file a variant has been
                 proposed for, linked to the proposal's basis.
                 Searchable, filterable by author and purpose, addressable by
                 variant id. A variant does not claim to apply to the
                 document a reader has open, and nothing here applies one.
    instruments  projects/text/INSTRUMENTS.md, rendered. Organised by
                 unit of analysis (word, term of art, named entity, speaker,
                 sentence, document), because that is the question a session
                 actually arrives with: I have text at this grain.
    resources    projects/text/resources.csv, the word lists and norms
                 tables, grouped by whether the estate holds one, fetches it at
                 run time, or does not have it. A coverage grid leads the pane:
                 property by state, so the empty cells read as loudly as the
                 full ones.
    runs         projects/text/runs/runs.csv, one row per dated run of
                 work, with its kind, method, thread and what it left behind.
                 The same list with a detail. A run's card holds what it did,
                 the ways into it (its page, its write-up, its files, and a
                 deck of its documents where its row declares one), the probes
                 it settled and the other runs of the same effort. A probe or
                 a run named in a card is a tap away. The collection is read
                 only when a deck is asked for.
    exemplars    projects/text/exemplars/pieces/, writing others have praised
                 for its clarity, kept whole where the source allows (that
                 folder's README states the format). The same list with a
                 detail, grouped by genre, one line a piece: its `short`
                 title, then the surnames and the year. A piece's card is its
                 reader, with two faces. Text is the piece, from the text
                 proper on, rendered by kits/guide-render.js at reading size.
                 Context holds the full title, who praised it and in their
                 words, the caption an opinion opens with, and where the copy
                 came from. The piece's standoff (<slug>.standoff.json,
                 standoff/1, mapped onto the render by kits/standoff.js) says
                 which paragraphs are the caption and which the focus, the
                 passage to read first, and is read only while it still pins
                 the piece's bytes. The focus is marked with a neutral rule
                 down its edge, since colour here is a standing and a fill is
                 a selected row. The card's head holds the voice, the jump to
                 the focus, which shows Text, and the door to the deck, whose
                 header names the piece in view. Reading aloud
                 (kits/read-aloud.js) speaks Text alone, from the stored
                 Markdown: no front matter, no caption, and none of the spans
                 an optional second standoff, <slug>.citations.standoff.json,
                 labels `citation`. A ref without `short`, `caption` or that
                 file shows the title's head and the whole body, and speaks
                 all of it.

  Reviewing. Under every pair, in the list and in both decks, one line carries
  the variant's facts and a reader's three acts: vote it up, vote it down, and
  comment. Each act is one line appended to home's projects/text/reviews.jsonl
  through the viewer's token, written straight to the ref being read, the way
  approve.html writes a verdict. The details that used to sit behind a row's
  expander are a panel-tip (kits/panel-tip.js), opened from the same line.

  Reading one at a time. The variants list is the index, and a deck is how it
  is read: the house swipe-deck, with the same door (the cards glyph) every
  other list here uses. Two decks. The filtered variants, one pair per slide in
  md-diff's old/both/new swipe, so a variant reads exactly as it does in the
  file viewer. And a text run's documents, one file per slide in md-variants'
  full-document reading (kits/md-variants.js), so a pass is seen where
  it lands rather than as loose pairs.

  Data contract. Everything is read live from mehrlander/home through the
  viewer's token (gh-api + gh-auth). This page holds no copy of the probe
  records or the register, so it cannot drift from them; the cost is that home
  is private, so a tokenless reader meets the auth prompt, exactly as
  links.html does over the same repo.

  Standing is derived here from the first sentence of the verdict, by the same
  rule probes/build-index.py uses to derive it for the generated README. Two
  readings of one field, so the page and the README cannot disagree.

  Colour appears on one thing: a probe's standing. Nothing else takes an
  accent, so any colour on this page is a verdict and nothing else. The four
  values are a scale, not four decorations.

  Address params:
    ?use=<ref>   pins this page's own lib chain to a ref.
    ?data=<ref>  pins which ref of home is read (defaults to main).
    ?pane=<name> opens one pane: probes, variants, instruments, resources,
                 runs or exemplars.
    ?q=<text>    searches the variants.
    ?author=<name> and ?purpose=<word> filter variant rows.
    ?variant=<id> opens one variant and implies the variants pane.
    ?deck=variants, ?deck=run:<dir> or ?deck=exemplars, with ?at=<n>,
                 reopens a deck on a slide. The variants deck reads the
                 filters beside it.
    ?run=<dir>   marks one run in the runs pane and implies that pane.
    ?exemplar=<slug> opens one piece and implies the exemplars pane.
    ?marks=a|b|c|d trials a way through a piece's marks: a, a Marks tab in
                 the FAB's drawer and a count on the launcher; b, a stepper on
                 the FAB; c, a rail down the card's edge; d, a pair of arrows
                 beside the FAB (kits/mark-pad.js), stepping through the caption
                 and focus passages, or the citations once its label is tapped.
                 Without it, nothing.
    ?proposal=<id> and ?pane=proposals are the pre-2026-09-27 names; both are
                 read and the address is rewritten to the new form.
-->

<style>[x-cloak]{display:none!important}</style>

<script type="module">
 try {
  const params = new URLSearchParams(location.search);
  await import('https://mehrlander.github.io/web-tools/lib/entry.js');
  await gh.load('gh-auth.js');

  document.addEventListener('alpine:init', () => {
    const esc = s => window.esc(s);   // lib/vanilla-bundle.js, loaded by the boot chain
    // Each drawn variant's place in the filtered list, for its deck door. Kept
    // outside the component so that rebuilding it does not redraw the list.
    let variantAt = new Map();
    Alpine.data('textInstruments', () => ({
      REPO: 'mehrlander/home',
      ROOT: 'projects/text',
      INSTRUMENTS: 'projects/text/INSTRUMENTS.md',
      TOSS: 'https://mehrlander.github.io/web-tools/pages/toss-render.html',
      // Read-modify-write: this page reads home and saves back to it, so the
      // read stays on the write branch. The selection never moves a file the
      // page writes back; ?data= moves both together.
      DATA_REF: params.get('data') || 'main',

      PANES: ['probes', 'variants', 'instruments', 'resources', 'runs', 'exemplars'],
      PANE_META: {
        probes:      { label: 'Probes',      icon: 'ph-test-tube' },
        variants:    { label: 'Variants',    icon: 'ph-git-diff' },
        instruments: { label: 'Instruments', icon: 'ph-toolbox' },
        resources:   { label: 'Resources',   icon: 'ph-books' },
        runs:        { label: 'Runs',        icon: 'ph-play-circle' },
        exemplars:   { label: 'Exemplars',   icon: 'ph-pen-nib' },
      },

      // The page's only coloured dimension.
      STANDINGS: {
        worked: { bar: 'bg-success', text: 'text-success' },
        mixed:  { bar: 'bg-warning', text: 'text-warning' },
        failed: { bar: 'bg-error',   text: 'text-error'   },
        open:   { bar: 'bg-info',    text: 'text-info'    },
      },

      // Dated runs, newest first. `page` is what a reader can open; a run that
      // produced results and prose but no page carries an empty one, and the
      // row says so rather than linking its folder twice.
      RUNS: [
        { date: '2026-11-10', title: 'Noun chains and long sentences',
          line: 'Where the documentation runs four or more nouns together, and which sentences pass a reading grade of 20.',
          dir: 'projects/text/runs/2026-11-10-noun-stacks',
          page: 'projects/text/runs/2026-11-10-noun-stacks/app/index.html' },
        { date: '2026-08-26', title: 'The scare-quote test',
          line: 'Whether a reader\'s urge to put quotation marks round a term detects the term doing unearned work.',
          dir: 'projects/text/runs/2026-08-26-scare-quote', page: '' },
        { date: '2026-08-19', title: 'Model voice',
          line: 'Which words and phrases each speaker owns, and which phrases every model overuses against a human control corpus.',
          dir: 'projects/text/runs/2026-08-19-model-voice',
          page: 'projects/text/runs/2026-08-19-model-voice/report.html' },
        { date: '2026-08-18', title: 'Claim strength',
          line: 'Measuring how far a claim reaches and how sharply it resolves, and which lexical features carry neither.',
          dir: 'projects/text/runs/2026-08-18-claim-strength',
          page: 'projects/text/runs/2026-08-18-claim-strength/report.html' },
        { date: '2026-06-09', title: 'Document audit',
          line: 'Reading one document unit by unit: redundancy, drift, and what a receipt cannot see.',
          dir: 'projects/text/doc-audit', page: 'projects/text/doc-audit/demo/index.html' },
      ],

      // A resource has coverage to assess and no inference to run, which is the
      // distinction projects/text/README.md draws against a model, and the
      // reason these are a separate register rather than rows in INSTRUMENTS.md.
      // held: committed somewhere in the estate. fetched: depended on and
      // downloaded at run time, so no version is recorded anywhere. absent:
      // named in the field and not used here, which is the shopping list.
      STATES: {
        held:    { text: 'text-success' },
        fetched: { text: 'text-warning' },
        // Muted rather than full-strength: absent has no accent of its own (it
        // is neither good nor bad, just unacquired), and at full weight plain
        // base-content outshouted both coloured states and made the shopping
        // list the loudest thing in the coverage grid.
        absent:  { text: 'text-base-content/60' },
      },

      home: null,
      pane: (params.get('variant') || params.get('proposal')) ? 'variants'
        : params.get('pane') === 'proposals' ? 'variants'
        : (params.get('pane') || (params.get('exemplar') ? 'exemplars' : params.get('run') ? 'runs' : 'probes')),
      probes: [],
      concept: '',
      filterStanding: '',
      runRows: [],
      VARIANT_BATCH: 40,
      variantLimit: 40,
      deckBusy: '',
      probeSel: params.get('probe') || '',
      FACTS: [['method', 'ph-flask', 'Approach'], ['corpus', 'ph-books', 'Corpus'], ['result', 'ph-chart-bar', 'Result'],
              ['opens', 'ph-door-open', 'What it opens'], ['cost', 'ph-timer', 'Cost']],
      badgeFilter: {},
      probeRun: '',
      probeBy: 'date',
      runBy: 'date',
      PROBE_BYS: [['date', 'date'], ['standing', 'standing'], ['asks', 'asks'], ['grain', 'grain'], ['how', 'method'], ['checked', 'checked']],
      RUN_BYS: [['date', 'date'], ['thread', 'thread'], ['kind', 'kind'], ['method', 'method']],
      SEG: {
        box: 'inline-flex items-center gap-0.5 rounded-lg bg-base-200/60 p-0.5',
        item: 'rounded-md px-2.5 py-1 text-sm cursor-pointer whitespace-nowrap',
        on: 'bg-base-100 font-medium shadow-sm',
        off: 'text-base-content/70 hover:text-base-content',
      },
      // A filter is a labelled row of chips, as the Map view draws them
      // (map.js mapChip, mapChipOn, mapChipOff): rounded, the chosen one
      // tinted. The raised segmented control (SEG) is kept for a switch of
      // view, such as how the list is grouped.
      FILTER: {
        row: 'flex items-center gap-2 min-w-0 text-sm',
        label: 'w-16 shrink-0 text-base-content/60',
        strip: 'flex flex-nowrap items-center gap-1 min-w-0 overflow-x-auto py-0.5 whitespace-nowrap [scrollbar-width:none] [&::-webkit-scrollbar]:hidden',
        chip: 'shrink-0 flex items-center gap-1.5 rounded-full px-2.5 py-1 max-sm:px-2 max-sm:py-0.5 text-sm whitespace-nowrap transition-colors cursor-pointer',
        on: 'bg-primary/10 text-primary',
        off: 'bg-base-200/60 text-base-content/70 hover:text-base-content',
      },
      CHIP: 'rounded-md bg-base-200 px-1.5 py-0.5 text-sm text-base-content/80 whitespace-nowrap',
      BADGE_WORDS: {
        asks: { detect: 'detects', compare: 'compares', classify: 'classifies' },
        how: { script: 'by script', readers: 'by readers', both: 'script and readers', none: 'not run' },
        method: { script: 'by script', readers: 'by readers', both: 'script and readers' },
        checked: { gold: 'against gold labels', agreement: 'against a second reader', none: 'no check' },
      },
      open: null,
      guideHtml: '',
      guideClass: '',
      resources: [],
      rate: '',
      filterState: '',
      variantIndex: null,
      variantState: 'idle',
      variantError: '',
      variantQ: params.get('q') || '',
      variantAuthor: params.get('author') || '',
      variantPurpose: params.get('purpose') || '',
      variantOpen: params.get('variant') || params.get('proposal') || '',
      me: '',
      tip: null,
      tipClose: '',
      noteDraft: '',
      reviewBusy: '',
      reviewError: '',
      TEXT_RUNS: 'projects/text/runs',
      textRuns: [],
      textRunState: 'idle',
      runFocus: params.get('run') || '',
      EXEMPLARS: 'projects/text/exemplars/pieces',
      exemplars: [],
      exemplarState: 'idle',
      exemplarError: '',
      exemplarSel: params.get('exemplar') || '',
      exemplarTab: 'text',
      voice: null,
      voiceAt: { state: 'idle', id: '' },
      // ?marks=a|b|c|d, four trials of a way through a piece's marks (its
      // focus, its caption, its citations): a, the FAB's Marks tab; b, a
      // stepper on the FAB; c, a rail down the card's edge; d, the page's own
      // pair of arrows beside the FAB (kits/mark-pad.js). Without it nothing
      // changes.
      marksMode: ['a', 'b', 'c', 'd'].includes(params.get('marks')) ? params.get('marks') : '',
      padKind: 'marks',
      pad: null,
      marksAt: {},
      focusAt: {},
      citeMode: 'show',
      deckParam: params.get('deck') || '',
      deckAt: Math.max(0, parseInt(params.get('at'), 10) || 0),
      loading: true,
      error: '',
      framed: window.self !== window.top,

      async init() {
        document.getElementById('boot')?.remove();
        gh.load('kits/panel-tip.js').then(() => {
          if (!window.PanelTip || !this.$refs?.tip) return;
          this.tipClose = window.PanelTip.closeHTML(true);
          window.PanelTip.wire(this.$refs.tip, { onClose: () => this.closeTip(), except: ['[data-tip-btn]'] });
          if (typeof ResizeObserver === 'function') new ResizeObserver(() => this.placeTip()).observe(this.$refs.tip);
        }).catch(() => {});
        this.migrateLegacyAddress();
        this.normalizeVariantParams();
        this.home = new window.GH({ token: window.TOKEN || '', repo: this.REPO, ref: this.DATA_REF });
        try {
          await gh.load('kits/csv.js');
          this.probes = (await this.readProbes())
            .sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
        } catch (e) {
          this.error = `${e.message || e} (${this.REPO}@${this.DATA_REF})`;
        }
        // The run registry is small and the Probes pane names a probe's run from
        // it, so it loads with the probes. A ref that predates it leaves the
        // list empty and the Runs pane falls back to its old listing.
        try {
          this.runRows = window.Csv.rows((await this.home.get(`${this.ROOT}/runs/runs.csv`)).text)
            .map(r => ({ ...r, name: r.run.split('/').pop(), residue: r.residue.split(';').filter(Boolean) }))
            .sort((a, b) => (b.date + b.run).localeCompare(a.date + a.run));
        } catch (_) { this.runRows = []; }
        this.loading = false;
        // The list-with-a-detail kit. A page that cannot load it still shows a
        // list over a card; it only loses the swipe.
        this.swipers = {};
        try { await gh.load('kits/swipe-deck.js'); await gh.load('kits/linked-swiper.js'); } catch (_) {}
        // A new search or filter starts its list from the first batch again.
        for (const key of ['variantQ', 'variantAuthor', 'variantPurpose'])
          this.$watch(key, () => { this.variantLimit = this.VARIANT_BATCH; });
        for (const key of ['filterStanding', 'concept', 'probeBy', 'badgeFilter', 'probeRun', 'runBy'])
          this.$watch(key, () => this.$nextTick(() => this.mountDetail()));
        if (['a', 'b', 'd'].includes(this.marksMode)) this.$watch('marksSig', () => { this.announceMarks(); this.pad?.refresh(); });
        // Whatever ?pane= asked for, not just the one that used to need it:
        // each pane's own guard makes the call a no-op when it has nothing to
        // fetch, so naming a single pane here was a bug waiting for the second.
        this.showPane(this.pane);
      },

      // probes/probes.csv, the registry web-tools docs/probes.md specifies, with
      // this project's badge columns. A ref that predates it still holds
      // probes.json, whose records carry no title, standing or badges.
      async readProbes() {
        const list = v => (v || '').split(';').filter(Boolean);
        try {
          return window.Csv.rows((await this.home.get(`${this.ROOT}/probes/probes.csv`)).text).map(r => ({
            id: r.probe, date: r.date, title: r.title, question: r.question, concepts: list(r.tags),
            method: r.approach, corpus: r.corpus, result: r.result, verdict: r.summary, opens: r.opens,
            artifacts: list(r.artifacts), cost: r.cost, run: r.run,
            standing: r.standing, asks: r.asks, grain: r.grain, how: r.method, checked: r.checked,
          }));
        } catch (_) {
          return JSON.parse((await this.home.get(`${this.ROOT}/probes/probes.json`)).text).probes;
        }
      },

      // The registry's own standing where it records one. Otherwise the rule
      // the old index used, on the verdict's first word: open wins, then
      // worked, then failed, and anything else is mixed.
      standingOf(p) {
        if (this.STANDINGS[p.standing]) return p.standing;
        const v = (p.verdict || '').split('.')[0].toLowerCase();
        return v.startsWith('open') ? 'open'
             : v.startsWith('work') ? 'worked'
             : v.startsWith('fail') ? 'failed' : 'mixed';
      },

      get counts() {
        const c = { worked: 0, mixed: 0, failed: 0, open: 0 };
        this.probes.forEach(p => c[this.standingOf(p)]++);
        return c;
      },

      // The field's own vocabulary, which is what the log is indexed by, so a
      // term from the literature lands somewhere.
      get concepts() {
        const m = new Map();
        this.probes.forEach(p => p.concepts.forEach(c => m.set(c, (m.get(c) || 0) + 1)));
        return [...m].sort((a, b) => a[0].localeCompare(b[0]));
      },

      get shown() {
        return this.probes.filter(p =>
          (!this.filterStanding || this.standingOf(p) === this.filterStanding)
          && (!this.concept || p.concepts.includes(this.concept))
          && (!this.probeRun || p.run === this.probeRun)
          && Object.entries(this.badgeFilter).every(([dim, value]) => p[dim] === value));
      },

      // A badge is a value from a short list (home projects/text/vocabulary.csv).
      // The words here are how a value reads on a row; an unlisted value shows
      // as itself.
      badgeText(dim, value) {
        return (this.BADGE_WORDS[dim] || {})[value] || value;
      },
      probeBadges(p) {
        return ['asks', 'grain', 'how', 'checked'].filter(dim => p[dim]).map(dim => ({ dim, value: p[dim] }));
      },
      toggleBadge(dim, value) {
        const next = { ...this.badgeFilter };
        if (next[dim] === value) delete next[dim]; else next[dim] = value;
        this.badgeFilter = next;
      },
      runOf(p) { return this.runRows.find(r => r.run === p.run) || null; },
      probesIn(run) { return this.probes.filter(p => p.run === run.run).length; },
      // ── a list with a detail ──────────────────────────────────────────
      // Probes and Runs each draw as a list beside a card. The registry is
      // what makes a pane list-detail; a ref without it keeps the old listing.
      get listDetail() {
        return (this.pane === 'probes' && !this.loading && this.probes.length > 0)
            || (this.pane === 'runs' && this.runRows.length > 0)
            || (this.pane === 'exemplars' && this.exemplars.length > 0);
      },
      goRun(name) { this.runFocus = name; this.showPane('runs'); },
      // A probe the current filters hide is shown by clearing them: the reader
      // asked for the probe, not for the filter.
      goProbe(id) {
        if (!this.shown.some(p => p.id === id)) { this.filterStanding = ''; this.concept = ''; this.badgeFilter = {}; this.probeRun = ''; }
        this.probeSel = id;
        this.showPane('probes');
      },
      showProbesOf(run) { this.probeRun = run.run; this.showPane('probes'); },
      syncSel() {
        const url = new URL(location.href);
        const set = (key, value) => value ? url.searchParams.set(key, value) : url.searchParams.delete(key);
        set('probe', this.pane === 'probes' ? this.probeSel : '');
        set('run', this.pane === 'runs' ? this.runFocus : '');
        set('exemplar', this.pane === 'exemplars' ? this.exemplarSel : '');
        history.replaceState(null, '', url);
      },
      chipHtml(text, attrs = '') {
        return `<span class="${this.CHIP}${attrs ? ' cursor-pointer hover:bg-base-300' : ''}" ${attrs}>${esc(text)}</span>`;
      },
      groupHtml(name, n) {
        return `<div class="sticky top-0 z-[1] flex items-baseline gap-2 bg-base-100 px-3 py-1.5 border-b border-base-200 font-mono text-xs uppercase tracking-wide text-base-content/70" data-part="group">`
          + `<span>${esc(name)}</span><span class="tabular-nums">${n}</span></div>`;
      },
      probeRowHtml(p) {
        const st = this.standingOf(p);
        const line = [st, ...this.probeBadges(p).filter(b => b.dim !== 'checked').map(b => this.badgeText(b.dim, b.value))].join(' · ');
        return `<div data-probe="${esc(p.id)}" role="option" tabindex="-1" data-part="item" class="flex gap-2.5 px-3 py-2.5 cursor-pointer border-b border-base-200 aria-selected:bg-base-200">`
          + `<span class="w-1 self-stretch rounded-sm shrink-0 ${this.STANDINGS[st].bar}"></span>`
          + `<span class="min-w-0 grid gap-0.5"><span class="text-base leading-6 font-medium" data-part="title">${esc(p.title || p.question)}</span>`
          + `<span class="text-sm text-base-content/70 truncate" data-part="meta">${esc(line)}</span></span></div>`;
      },
      probeListHtml() {
        return this.probeGroups().map(g => this.groupHtml(g.date, g.items.length) + g.items.map(p => this.probeRowHtml(p)).join('')).join('');
      },
      // A probe's card: the question as its headline, what was found beside the
      // standing's colour, the badges, then the particulars, each led by an
      // icon in place of a label. Its run and that run's other probes close it,
      // so the reader can step sideways without going back to the list.
      probeCardHtml(id) {
        const p = this.probes.find(x => x.id === id);
        if (!p) return '';
        const st = this.standingOf(p), run = this.runOf(p);
        const badges = this.probeBadges(p).map(b =>
          this.chipHtml(this.badgeText(b.dim, b.value), `role="button" data-badge="${esc(b.dim)}:${esc(b.value)}"`)).join('');
        const facts = this.FACTS.filter(([key]) => p[key]).map(([key, icon, label]) =>
          `<div class="flex gap-3"><i class="ph ${icon} text-lg mt-1 shrink-0 text-base-content/60" role="img" aria-label="${label}"></i>`
          + `<p class="text-base leading-7">${esc(p[key])}</p></div>`).join('');
        const kin = run ? this.probes.filter(x => x.run === p.run && x.id !== p.id) : [];
        const runHtml = !run ? '' :
          `<div class="grid gap-1.5"><button type="button" data-go-run="${esc(run.name)}" class="flex items-center gap-2.5 rounded-lg border border-base-300 px-3 py-2 text-left cursor-pointer hover:bg-base-200">`
          + `<i class="ph ph-play-circle text-xl shrink-0"></i><span class="min-w-0 grow"><span class="block font-semibold">${esc(run.title)}</span>`
          + `<span class="block text-sm text-base-content/70">${esc([run.kind, run.thread, run.date].join(' · '))}</span></span><i class="ph ph-arrow-right shrink-0"></i></button>`
          + kin.map(x => `<button type="button" data-go-probe="${esc(x.id)}" class="flex items-center gap-2.5 rounded-md px-3 py-1.5 text-left cursor-pointer hover:bg-base-200">`
            + `<span class="w-1 h-5 rounded-sm shrink-0 ${this.STANDINGS[this.standingOf(x)].bar}"></span><span class="min-w-0 truncate">${esc(x.title || x.id)}</span></button>`).join('')
          + `</div>`;
        const concepts = !p.concepts.length ? '' : `<div class="flex flex-wrap gap-1.5">` + p.concepts.map(c =>
          `<span role="button" data-concept="${esc(c)}" class="font-mono text-xs text-base-content/70 rounded-md border border-base-300 px-1.5 py-0.5 cursor-pointer hover:bg-base-200">${esc(c)}</span>`).join('') + `</div>`;
        const arts = !p.artifacts.length ? '' : `<div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 font-mono text-xs">` + p.artifacts.map(a =>
          `<a class="link link-hover text-base-content/70" href="${esc(this.artifactUrl(a))}">${esc(this.artifactName(a))}</a>`).join('')
          + `<span class="text-base-content/60">${esc(p.id)}</span></div>`;
        return `<div class="grid gap-4"><p class="text-xl leading-8">${esc(p.question)}</p>`
          + `<div class="flex gap-3"><span class="w-1 rounded-sm shrink-0 ${this.STANDINGS[st].bar}"></span><p class="text-base leading-7 font-medium">${esc(p.verdict || '')}</p></div>`
          + (badges ? `<div class="flex flex-wrap gap-1.5">${badges}</div>` : '')
          + (facts ? `<div class="grid gap-3">${facts}</div>` : '') + runHtml + concepts + arts + `</div>`;
      },
      // A verdict's opening: its first sentence, with the second when the first
      // is only the standing word ("Mixed.").
      gist(text) {
        const parts = (text || '').split(/(?<=\.)\s+/);
        return parts[0].length < 24 && parts[1] ? parts[0] + ' ' + parts[1] : parts[0];
      },
      runRowHtml(r) {
        const n = this.probesIn(r);
        const line = [r.kind, r.thread, r.date, n ? n + (n === 1 ? ' probe' : ' probes') : ''].filter(Boolean).join(' · ');
        return `<div data-run="${esc(r.name)}" role="option" tabindex="-1" data-part="item" class="flex gap-2.5 px-3 py-2.5 cursor-pointer border-b border-base-200 aria-selected:bg-base-200">`
          + `<i class="ph ${r.page ? 'ph-browser' : 'ph-file-text'} text-lg mt-0.5 shrink-0 text-base-content/60"></i>`
          + `<span class="min-w-0 grid gap-0.5"><span class="text-base leading-6 font-medium" data-part="title">${esc(r.title)}</span>`
          + `<span class="text-sm text-base-content/70 truncate" data-part="meta">${esc(line)}</span></span></div>`;
      },
      runListHtml() {
        return this.runGroups().map(g => this.groupHtml(g.name, g.items.length) + g.items.map(r => this.runRowHtml(r)).join('')).join('');
      },
      // A run's card: what it did, its badges, the ways into it, the probes it
      // settled and the other runs of the same effort.
      runCardHtml(name) {
        const r = this.runRows.find(x => x.name === name);
        if (!r) return '';
        const chips = [r.kind, this.badgeText('method', r.method), r.thread, 'left ' + r.residue.join(', ')].map(t => this.chipHtml(t)).join('');
        const readme = `${this.TOSS}#data=${this.REPO}@${this.DATA_REF}:${this.ROOT}/${r.run}/README.md`;
        const acts = (r.page ? `<a class="btn btn-sm btn-primary" href="${esc(this.runUrl(r))}"><i class="ph ph-browser text-lg"></i>Open the page</a>` : '')
          + `<a class="btn btn-sm ${r.page ? 'btn-ghost border-base-300' : 'btn-primary'}" href="${esc(readme)}"><i class="ph ph-file-text text-lg"></i>Read the write-up</a>`
          + (r.deck ? `<button type="button" class="btn btn-sm btn-ghost border-base-300" data-deck="${esc(r.name)}"><i class="ph ph-cards-three text-lg"></i>Its documents, one at a time</button>` : '')
          + `<a class="btn btn-sm btn-ghost border-base-300" href="${esc(this.treeUrl(this.ROOT + '/' + r.run))}"><i class="ph ph-folder text-lg"></i>Files</a>`;
        const mine = this.probes.filter(p => p.run === r.run);
        const probes = !mine.length ? '' : `<div class="grid">` + mine.map(p =>
          `<button type="button" data-go-probe="${esc(p.id)}" class="flex items-start gap-2.5 rounded-md px-3 py-2 text-left cursor-pointer hover:bg-base-200">`
          + `<span class="w-1 self-stretch rounded-sm shrink-0 ${this.STANDINGS[this.standingOf(p)].bar}"></span>`
          + `<span class="min-w-0"><span class="block font-medium">${esc(p.title || p.id)}</span>`
          + `<span class="block text-sm text-base-content/70">${esc(this.gist(p.verdict))}</span></span></button>`).join('') + `</div>`;
        const kin = r.part_of ? this.runRows.filter(x => x.part_of === r.part_of && x.run !== r.run) : [];
        const effort = !kin.length ? '' : `<div class="grid">` + kin.map(x =>
          `<button type="button" data-go-run="${esc(x.name)}" class="flex items-center gap-2.5 rounded-md px-3 py-1.5 text-left cursor-pointer hover:bg-base-200">`
          + `<i class="ph ph-play-circle text-lg shrink-0 text-base-content/60"></i><span class="min-w-0 truncate">${esc(x.title)}</span>`
          + `<span class="text-sm text-base-content/70 shrink-0">${esc(x.kind)}</span></button>`).join('') + `</div>`;
        return `<div class="grid gap-4"><p class="text-xl leading-8">${esc(r.summary)}</p>`
          + `<div class="flex flex-wrap gap-1.5">${chips}</div><div class="flex flex-wrap gap-2">${acts}</div>${probes}${effort}</div>`;
      },
      detailSpec(kind) {
        if (kind === 'exemplar') return {
          box: this.$refs.exemplarBox, list: this.$refs.exemplarList, card: this.$refs.exemplarCard, key: 'exemplar', noun: 'piece',
          ids: () => this.exemplarIds(),
          sel: () => this.exemplarSel, set: id => { this.exemplarSel = id; },
          listHtml: () => this.exemplarListHtml(), body: id => this.exemplarCardHtml(id),
          name: id => { const p = this.exemplarOf(id) || {}; return { when: this.shortYear(p.year), title: this.listTitle(p) }; },
          deck: () => this.openExemplarDeck(Math.max(0, this.exemplarIds().indexOf(this.exemplarSel))),
          head: ({ i, n, tight }) => this.exemplarHead(i, n, tight),
          empty: 'No pieces.',
        };
        return kind === 'probe' ? {
          box: this.$refs.probeBox, list: this.$refs.probeList, card: this.$refs.probeCard, key: 'probe', noun: 'probe',
          ids: () => this.probeGroups().flatMap(g => g.items.map(p => p.id)),
          sel: () => this.probeSel, set: id => { this.probeSel = id; },
          listHtml: () => this.probeListHtml(), body: id => this.probeCardHtml(id),
          name: id => { const p = this.probes.find(x => x.id === id) || {}; return { when: p.date, title: p.title || id }; },
          empty: 'No probe carries that combination.',
        } : {
          box: this.$refs.runBox, list: this.$refs.runList, card: this.$refs.runCard, key: 'run', noun: 'run',
          ids: () => this.runGroups().flatMap(g => g.items.map(r => r.name)),
          sel: () => this.runFocus, set: id => { this.runFocus = id; },
          listHtml: () => this.runListHtml(), body: id => this.runCardHtml(id),
          name: id => { const r = this.runRows.find(x => x.name === id) || {}; return { when: r.date, title: r.title || id }; },
          empty: 'No runs.',
        };
      },
      // Draw the open pane's list and card, or redraw them after a filter or a
      // grouping changed the rows. Without the kit the card still shows the
      // selected row, and a tap on a row still picks it.
      mountDetail() {
        const kind = { probes: 'probe', runs: 'run', exemplars: 'exemplar' }[this.pane] || '';
        if (!kind || !this.listDetail) return;
        const d = this.detailSpec(kind), ids = d.ids();
        if (!ids.includes(d.sel())) d.set(ids[0] || '');
        d.list.innerHTML = d.listHtml();
        this.wireDetail(d);
        const kit = window.linkedSwiper;
        if (!kit) {
          d.box.className = 'h-full grid gap-2 grid-rows-[minmax(0,38%)_minmax(0,1fr)]';
          d.list.className = 'min-h-0 overflow-y-auto rounded-lg border border-base-300';
          d.card.className = 'min-h-0 overflow-y-auto rounded-lg border border-base-300 px-3.5 py-3';
          for (const row of d.list.querySelectorAll(`[data-${d.key}]`)) row.setAttribute('aria-selected', String(row.getAttribute(`data-${d.key}`) === d.sel()));
          d.card.innerHTML = d.body(d.sel());
        } else if (!this.swipers[kind]) {
          this.swipers[kind] = kit.attach({
            root: d.box, list: d.list, card: d.card, key: d.key, noun: d.noun,
            ids: d.ids, sel: d.sel, body: d.body, name: d.name,
            listMax: 'max-h-[36vh]', wide: 'grid-cols-[minmax(0,26rem)_minmax(0,1fr)]',
            empty: `<p class="p-4 text-base-content/70">${d.empty}</p>`,
            onPick: id => {
              d.set(id); this.syncSel();
              if (kind === 'exemplar' && this.voice) this.voice.seek(this.exemplarIds().indexOf(id));
              if (kind === 'exemplar' && this.marksMode === 'c') setTimeout(() => this.railDraw(), 300);
            },
            ...(d.deck ? { deck: d.deck } : {}),
            ...(d.head ? { head: d.head } : {}),
          });
        } else {
          this.swipers[kind].mount();
        }
        this.syncSel();
        requestAnimationFrame(() => this.swipers[kind]?.show(String(d.sel())));
        if (kind === 'exemplar' && this.marksMode === 'c') { this.railMount(d.card); setTimeout(() => this.railDraw(), 300); }
      },
      // One listener per card and per list, for the lifetime of the page: the
      // kit redraws their contents and leaves the elements themselves alone.
      wireDetail(d) {
        if (d.card.dataset.wired) return;
        d.card.dataset.wired = '1';
        d.card.addEventListener('click', e => {
          if (this.exemplarClick(e)) return;
          const hit = name => e.target.closest(`[data-${name}]`)?.getAttribute(`data-${name}`);
          let v;
          if ((v = hit('go-run'))) this.goRun(v);
          else if ((v = hit('go-probe'))) this.goProbe(v);
          else if ((v = hit('badge'))) this.toggleBadge(...v.split(':'));
          else if ((v = hit('concept'))) this.concept = this.concept === v ? '' : v;
          else if ((v = hit('deck'))) this.openDeckFor(this.runRows.find(r => r.name === v));
        });
        d.list.addEventListener('click', e => {
          const row = e.target.closest(`[data-${d.key}]`);
          if (!row || window.linkedSwiper) return;
          d.set(row.getAttribute(`data-${d.key}`));
          this.mountDetail();
        });
      },
      // Where a tap on a run goes: its page when it has one, its README when
      // not. Both open in this view, so Back returns to the list.
      runUrl(run) {
        return run.page ? this.tossUrl(`${this.ROOT}/${run.page}`)
          : `${this.TOSS}#data=${this.REPO}@${this.DATA_REF}:${this.ROOT}/${run.run}/README.md`;
      },
      deckOf(run) { return this.textRuns.find(t => t.name === run.name) || null; },
      async openDeckFor(run) {
        this.deckBusy = run.name;
        await this.loadTextRuns();
        this.deckBusy = '';
        const deck = this.deckOf(run);
        if (deck) this.openRunDeck(deck);
      },
      runGroups() {
        const key = this.runBy, out = new Map();
        for (const r of this.runRows) {
          const k = key === 'date' ? r.date.slice(0, 7) : r[key];
          if (!out.has(k)) out.set(k, []);
          out.get(k).push(r);
        }
        const groups = [...out].map(([name, items]) => ({ name, items }));
        return key === 'date' ? groups : groups.sort((a, b) => b.items.length - a.items.length);
      },

      // Sixteen probes are three working sessions, not sixteen loose questions,
      // and ten of them share one date. Grouping turns that repetition into
      // structure and takes the date off every row, where it was the same
      // string ten times over.
      probeGroups() {
        const out = [];
        if (this.probeBy !== 'date') {
          const by = new Map();
          for (const p of this.shown) {
            const k = this.probeBy === 'standing' ? this.standingOf(p) : (p[this.probeBy] || 'unrecorded');
            if (!by.has(k)) by.set(k, []);
            by.get(k).push(p);
          }
          return [...by].map(([k, items]) => ({ date: this.badgeText(this.probeBy, k), items }))
            .sort((a, b) => b.items.length - a.items.length);
        }
        for (const p of this.shown) {
          const last = out[out.length - 1];
          if (last && last.date === p.date) last.items.push(p);
          else out.push({ date: p.date, items: [p] });
        }
        return out;
      },

      // The two render kits load here rather than in the boot chain. The
      // instrument register is one pane of six, and a kit that fails to arrive must not
      // be able to blank the other five: everything on this page sits inside one
      // x-cloak root, so anything that stops Alpine starting renders as a white
      // page with nothing to read.
      async showPane(name) {
        const pane = this.PANES.includes(name) ? name : 'probes';
        if (pane !== 'exemplars') this.quietCard();
        this.pane = pane;
        this.syncPaneAddress();
        // Six tabs overflow a phone's strip, so the open one is kept in view.
        this.$nextTick(() => document.querySelector('[role="tab"][aria-selected="true"]')
          ?.scrollIntoView({ inline: 'nearest', block: 'nearest' }));
        try {
          if (pane === 'variants') await this.loadVariants();
          if (pane === 'exemplars') await this.loadExemplars();
          // With the registry the pane is already drawn, and the collection is
          // read only when a deck is asked for: by a tap, or by the address.
          if (pane === 'runs' && (!this.runRows.length || this.deckParam.startsWith('run:'))) await this.loadTextRuns();
          if (pane === 'instruments' && !this.guideHtml) {
            await gh.load('kits/guide-render.js');
            await gh.load('kits/source-peek.js');
            const res = await this.home.get(this.INSTRUMENTS);
            await window.GuideRender.needMarked();
            // bodyClass() injects the stylesheet as a side effect, so this
            // assignment is what styles the pane, not just what labels it.
            this.guideClass = window.GuideRender.bodyClass('page');
            this.guideHtml = window.GuideRender.render(
              window.SourcePeek.fenceFrontmatter(res.text),
              { knownRefs: [this.DATA_REF, 'main'] }).html;
          }
          if (pane === 'resources' && !this.resources.length) {
            await gh.load('kits/csv.js');
            const res = await this.home.get(`${this.ROOT}/resources.csv`);
            this.resources = window.Csv.rows(res.text);
          }
        } catch (e) {
          this.error = `${pane}: ${e.message || e}`;
        }
        this.$nextTick(() => this.mountDetail());
      },

      // The collection's two files, read by the shared kit that the FAB and the
      // file viewer also read, so every surface has one answer.
      async loadVariants() {
        if (this.variantState === 'loading' || this.variantState === 'done') return;
        this.variantState = 'loading';
        this.variantError = '';
        try {
          await gh.load('kits/text-collection.js');
          this.variantIndex = await window.TextCollection.load(this.home);
          this.variantState = 'done';
          this.normalizeVariantParams();
          if (this.deckParam === 'variants') {
            this.deckParam = '';
            this.openVariantDeck(this.variantRows, this.deckAt);
          }
          if (this.variantOpen
              && !window.TextCollection.view(this.variantIndex, this.variantOpen)) {
            this.variantOpen = '';
            this.syncVariantAddress();
          }
          // A variant ID is a visible address, not merely an expanded row. Do
          // this only after the initial load, so opening a row by hand does not
          // make the list jump under the reader.
          const addressed = this.variantOpen;
          if (addressed) this.$nextTick(() => {
            if (this.variantOpen !== addressed) return;
            document.getElementById(`variant-${addressed}`)
              ?.scrollIntoView({ block: 'start' });
          });
        } catch (e) {
          this.variantError = `${e.message || e} (${this.REPO}@${this.DATA_REF})`;
          this.variantState = 'error';
        }
      },

      get variantRows() {
        if (!this.variantIndex || !window.TextCollection) return [];
        const rows = window.TextCollection.search(this.variantIndex, {
          q: this.variantQ,
          author: this.variantAuthor,
          purpose: this.variantPurpose,
        });
        // A direct variant address remains visible even when stale filters
        // also rode in the URL. The id is the stronger, exact address.
        if (this.variantOpen && !rows.some(row => row.id === this.variantOpen)) {
          const selected = window.TextCollection.view(this.variantIndex, this.variantOpen);
          if (selected) return [selected, ...rows];
        }
        return rows;
      },

      get variantTotal() {
        if (!this.variantIndex) return 0;
        return this.variantIndex.summary?.variants
          || this.variantIndex.variants?.length || 0;
      },

      // The facets are what the collection holds, counted, most common first.
      variantPick(kind) { return kind === 'purpose' ? this.variantPurpose : this.variantAuthor; },
      variantFacet(kind) {
        const counts = this.variantIndex?.summary?.[kind === 'author' ? 'by_author' : 'by_purpose'] || {};
        return Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .map(([key, n]) => ({ key, n }));
      },
      // A purpose word's definition from purposes.csv, or null when the word
      // has none: the gloss says what the word means, the prompt is the exact
      // instruction its variants were written under, when one was recorded.
      purposeDef(word) {
        return this.variantIndex?.purposes?.[word] || null;
      },
      // The collection runs to thousands of variants, and drawing every one
      // made some 80,000 elements, which a phone does not survive. The groups
      // are drawn up to a budget (variantLimit) that grows as the reader
      // nears the end. `all` is the whole group, for its count and its deck;
      // `items` is what is drawn. An addressed variant is always drawn.
      variantGroups() {
        const rows = this.variantRows;
        variantAt = new Map(rows.map((row, i) => [row.id, i]));
        let left = this.variantLimit;
        return this.variantFacet('purpose')
          .map(({ key }) => {
            const all = rows.filter(row => row.purpose === key);
            const items = all.slice(0, Math.max(0, left));
            const open = this.variantOpen && all.find(row => row.id === this.variantOpen);
            if (open && !items.includes(open)) items.unshift(open);
            left -= items.length;
            return { purpose: key, all, items };
          })
          .filter(group => group.items.length);   // a group past the budget waits its turn; its pill above still filters to it
      },
      variantPlace(p) { return variantAt.get(p.id) ?? 0; },
      get variantDrawn() { return Math.min(this.variantLimit, this.variantRows.length); },
      // Draw the next batch when the end of the list comes near the viewport.
      watchVariantEnd(el) {
        if (typeof IntersectionObserver !== 'function') { this.variantLimit = Infinity; return; }
        new IntersectionObserver(entries => {
          if (entries.some(e => e.isIntersecting) && this.variantLimit < this.variantRows.length) this.variantLimit += this.VARIANT_BATCH;
        }, { rootMargin: '600px' }).observe(el);
      },

      variantPreview(value, limit = 190) {
        const text = String(value || '').replace(/\s+/g, ' ').trim();
        if (text.length <= limit) return text;
        const cut = text.slice(0, limit).replace(/\s+\S*$/, '');
        return `${cut || text.slice(0, limit)}…`;
      },

      // A basis is a PR or commit URL; anything else gets no link.
      safeHref(value) {
        return /^https?:\/\//.test(String(value || '')) ? value : null;
      },

      toggleVariant(id) {
        this.variantOpen = this.variantOpen === id ? '' : id;
        this.syncVariantAddress();
      },

      setVariantFilter(kind, value) {
        if (kind === 'author') this.variantAuthor = value;
        if (kind === 'purpose') this.variantPurpose = value;
        this.variantOpen = '';
        this.syncVariantAddress();
        this.shut();
      },

      // A facet the collection does not hold is dropped, so a stale address
      // shows the whole list rather than an empty one. Before the load, only a
      // blank is known to be valid.
      normalizeVariantParams() {
        if (!this.variantIndex) return;
        const author = this.variantFacet('author').some(row => row.key === this.variantAuthor)
          ? this.variantAuthor : '';
        const purpose = this.variantFacet('purpose').some(row => row.key === this.variantPurpose)
          ? this.variantPurpose : '';
        if (author === this.variantAuthor && purpose === this.variantPurpose) return;
        this.variantAuthor = author;
        this.variantPurpose = purpose;
        const url = new URL(location.href);
        if (!author) url.searchParams.delete('author');
        if (!purpose) url.searchParams.delete('purpose');
        history.replaceState(null, '', url);
      },

      // The rows were called proposals until 2026-09-27, and addresses minted
      // then still arrive. The pane and the open row are already read from
      // either name above; this rewrites the address to the new one.
      migrateLegacyAddress() {
        const url = new URL(location.href);
        const legacy = url.searchParams.get('proposal');
        if (!legacy && url.searchParams.get('pane') !== 'proposals') return;
        url.searchParams.delete('proposal');
        if (legacy && !url.searchParams.get('variant')) url.searchParams.set('variant', legacy);
        url.searchParams.set('pane', 'variants');
        history.replaceState(null, '', url);
      },

      syncPaneAddress() {
        const url = new URL(location.href);
        if (this.pane === 'probes') url.searchParams.delete('pane');
        else url.searchParams.set('pane', this.pane);
        if (this.pane !== 'variants') url.searchParams.delete('variant');
        history.replaceState(null, '', url);
      },

      syncVariantAddress() {
        const url = new URL(location.href);
        url.searchParams.set('pane', 'variants');
        const set = (key, value) => value
          ? url.searchParams.set(key, value)
          : url.searchParams.delete(key);
        set('q', this.variantQ.trim());
        set('author', this.variantAuthor);
        set('purpose', this.variantPurpose);
        set('variant', this.variantOpen);
        history.replaceState(null, '', url);
      },

      // ── Reading one at a time ─────────────────────────────────────────────
      // Both decks keep their place in the address, so a slide can be linked
      // and a reload lands where the reader was.
      syncDeckAddress(deck, at = 0) {
        const url = new URL(location.href);
        if (deck) {
          url.searchParams.set('deck', deck);
          url.searchParams.set('at', String(at));
        } else {
          url.searchParams.delete('deck');
          url.searchParams.delete('at');
        }
        history.replaceState(null, '', url);
      },

      // The filters in words, for the deck's subtitle.
      variantScope() {
        return [this.variantPurpose || 'every purpose', this.variantAuthor || 'every author',
                this.variantQ.trim() && `"${this.variantQ.trim()}"`].filter(Boolean).join(' · ');
      },

      wordCount(s) { return (String(s || '').match(/\S+/g) || []).length },

      // "owner/name:path" as the reader says it, and as an app address that
      // opens the file in Files, where its paragraphs carry their variant marks.
      shortLoc(loc) {
        const i = String(loc).indexOf(':');
        return `${loc.slice(0, i).split('/').pop()}/${loc.slice(i + 1)}`;
      },
      fileHref(loc) {
        const i = String(loc).indexOf(':');
        return `https://mehrlander.github.io/web-tools/app/?repo=${encodeURIComponent(loc.slice(0, i))}`
          + `&file=${encodeURIComponent(loc.slice(i + 1))}`;
      },

      // A pair drawn by md-diff, the renderer the file viewer uses, so the
      // three readings and the marks are the same everywhere.
      async renderPair(host, v) {
        host.textContent = '';
        try {
          await gh.load('kits/md-diff.js');
          await window.mdDiff.render(host, v.from?.text || '', v.to?.text || '', { strip: false });
        } catch (e) {
          host.textContent = `${e.message || e}`;
        }
      },

      // ── Reviews ───────────────────────────────────────────────────────────
      async whoami() {
        if (this.me) return this.me;
        try { this.me = (await this.home.req('/user'))?.login || ''; } catch (_) { this.me = ''; }
        return this.me;
      },

      reviewsOf(v) {
        const T = window.TextCollection;
        return T && this.variantIndex ? T.reviewsFor(this.variantIndex, v.from.passage_id, v.to.passage_id)
          : { up: [], down: [], notes: [], voteOf: () => '' };
      },

      // One act, one appended line. A vote repeated takes itself back.
      async review(v, patch) {
        if (this.reviewBusy) return false;
        this.reviewBusy = v.id;
        this.reviewError = '';
        this.refreshActions(v.id);
        try {
          await this.whoami();
          if (!this.me) throw new Error('Reviewing needs a GitHub token that can write to mehrlander/home.');
          await gh.load('gh-store.js');
          const T = window.TextCollection;
          const row = { from: v.from.passage_id, to: v.to.passage_id, by: this.me, at: new Date().toISOString() };
          if ('vote' in patch) row.vote = this.reviewsOf(v).voteOf(this.me) === patch.vote ? '' : patch.vote;
          if (patch.note) row.note = patch.note;
          const path = T.PATHS.reviews;
          let text = '', sha;
          try {
            const cur = await this.home.get(path, window.GH.FRESH);
            text = cur.text; sha = cur.sha;
          } catch (e) { if (e?.status !== 404) throw e; }
          if (text && !text.endsWith('\n')) text += '\n';
          const what = row.vote !== undefined ? (row.vote || 'withdraw vote') : 'note';
          await this.home.save(path, text + T.reviewLine(row) + '\n',
            `Text review: ${what} on variant ${v.id.slice(0, 12)}`, sha ? { sha } : {});
          T.addReview(this.variantIndex, row);
          return true;
        } catch (e) {
          this.reviewError = e.message || String(e);
          return false;
        } finally {
          this.reviewBusy = '';
          this.refreshActions(v.id);
        }
      },

      async saveNote(v) {
        const note = this.noteDraft.trim();
        if (!note) return;
        if (await this.review(v, { note })) this.noteDraft = '';
      },

      // The line under a pair: its facts, then the three acts and the details.
      // Built as DOM rather than template because the decks are DOM, so the
      // list and both decks draw one line from one function.
      variantFoot(v, { deckAt = null } = {}) {
        const h = window.swipeDeck?.h || ((tag, attrs = {}, ...kids) => {
          const e = document.createElement(tag);
          for (const [k, val] of Object.entries(attrs)) e.setAttribute(k, val);
          for (const k of kids.flat()) if (k) e.append(k);
          return e;
        });
        const foot = h('div', { class: 'mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-base text-base-content/60' },
          h('span', { class: 'font-medium text-base-content/80' }, v.purpose || ''),
          h('span', {}, v.author || ''),
          h('span', { class: 'tabular-nums' }, `${this.wordCount(v.from?.text)} → ${this.wordCount(v.to?.text)} words`));
        if (v.at && v.at.length) {
          foot.append(h('a', { class: 'link link-hover font-mono text-sm truncate max-w-[18rem]', href: this.fileHref(v.at[0]),
                               target: '_blank', rel: 'noopener' },
            this.shortLoc(v.at[0]) + (v.at.length > 1 ? ` +${v.at.length - 1}` : '')));
        }
        // A chip per file this variant is proposed for, linking the proposal's basis.
        for (const q of v.proposals || []) {
          foot.append(h('a', { class: 'badge badge-outline gap-1 font-mono', href: this.safeHref(q.basis) || '',
                               target: '_blank', rel: 'noopener' }, h('i', { class: 'ph ph-seal-question' }), q.path));
        }
        foot.append(h('span', { class: 'grow' }), this.variantActions(v, { deckAt }));
        return foot;
      },

      variantActions(v, o = {}) {
        const h = window.swipeDeck?.h;
        const r = this.reviewsOf(v);
        const mine = this.me ? r.voteOf(this.me) : '';
        const busy = this.reviewBusy === v.id;
        const box = document.createElement('span');
        box.className = 'inline-flex items-center gap-0.5';
        box.dataset.actions = v.id;
        box._v = v; box._o = o;
        const btn = (icon, label, n, on, fn, extra = '') => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = `btn btn-ghost btn-sm gap-1 px-2 max-sm:h-10 ${extra}`;
          b.setAttribute('aria-label', label);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
          b.dataset.tipBtn = '';
          b.innerHTML = `<i class="${on ? 'ph-fill' : 'ph'} ${icon} text-lg"></i>`
            + (n ? `<span class="tabular-nums">${n}</span>` : '');
          if (busy) b.disabled = true;
          b.addEventListener('click', (e) => fn(e.currentTarget));
          return b;
        };
        box.append(
          btn('ph-thumbs-up', 'Vote up', r.up.length, mine === 'up', () => this.review(v, { vote: 'up' })),
          btn('ph-thumbs-down', 'Vote down', r.down.length, mine === 'down', () => this.review(v, { vote: 'down' })),
          btn('ph-chat-circle', 'Comment', r.notes.length, false, (b) => this.openTip('note', v, b)),
          btn('ph-info', 'Details', 0, false, (b) => this.openTip('info', v, b)));
        if (o.deckAt != null) {
          box.append(btn('ph-cards-three', 'Read from here, one at a time', 0, false,
            () => this.openVariantDeck(this.variantRows, o.deckAt), 'text-primary'));
        }
        if (this.reviewError && this.reviewTarget === v.id) {
          box.append(Object.assign(document.createElement('span'), { className: 'text-sm text-error ml-2', textContent: this.reviewError }));
        }
        return box;
      },

      refreshActions(id) {
        this.reviewTarget = id;
        for (const el of document.querySelectorAll(`[data-actions="${id}"]`)) {
          el.replaceWith(this.variantActions(el._v, el._o));
        }
      },

      // The details and the notes open as a pinned panel-tip beside the
      // button, clamped to the screen and flipped above when there is no
      // room below.
      openTip(kind, v, btn) {
        if (this.tip && this.tip.kind === kind && this.tip.v.id === v.id) return this.closeTip();
        const r = btn.getBoundingClientRect();
        const w = Math.min(320, innerWidth - 16);
        this.noteDraft = '';
        this.tip = { kind, v, x: Math.max(8, Math.min(r.right - w, innerWidth - w - 8)), y: r.bottom + 6, w };
        this._tipRect = r;
        if (kind === 'note') this.$nextTick(() => this.$refs.tip?.querySelector('textarea')?.focus({ preventScroll: true }));
      },

      // Below the button when it fits, above when it does not, and inside the
      // screen either way. Run by a ResizeObserver, since the panel's body
      // arrives after the open and its height is not known until it has.
      placeTip() {
        const el = this.$refs.tip, r = this._tipRect;
        if (!el || !this.tip || !r) return;
        const hgt = el.offsetHeight;
        const below = r.bottom + 6;
        const y = below + hgt <= innerHeight - 8 ? below
          : r.top - 6 - hgt >= 8 ? r.top - 6 - hgt : Math.max(8, innerHeight - hgt - 8);
        if (y !== this.tip.y) this.tip.y = y;
      },
      closeTip() { this.tip = null; this.noteDraft = ''; },

      // A row draws its pair when it comes within a screen of the viewport,
      // once. One observer serves the whole list.
      lazyPair(host, v) {
        if (typeof IntersectionObserver !== 'function') return this.renderPair(host, v);
        if (!this._pairObserver) {
          this._pairObserver = new IntersectionObserver(entries => {
            for (const e of entries) {
              if (!e.isIntersecting) continue;
              this._pairObserver.unobserve(e.target);
              const row = e.target._variant;
              if (row) this.renderPair(e.target, row);
            }
          }, { rootMargin: '800px 0px' });
        }
        host._variant = v;
        this._pairObserver.observe(host);
      },

      async openVariantDeck(rows, start = 0, label = '') {
        if (!rows || !rows.length) return;
        await gh.load('kits/swipe-deck.js');
        const at = Math.min(Math.max(0, start), rows.length - 1);
        window.swipeDeck.open({
          count: rows.length,
          start: at,
          title: 'Variants',
          subtitle: label || this.variantScope(),
          icon: 'ph-flask',
          innerClass: 'w-full min-w-0 mx-auto',
          index: i => ({ title: this.variantPreview(rows[i].from?.text, 70),
                         subtitle: `${rows[i].purpose} · ${rows[i].author}`,
                         group: rows[i].purpose }),
          render: (i, slide) => {
            const doc = document.createElement('div');
            slide.append(doc, this.variantFoot(rows[i]));
            this.renderPair(doc, rows[i]);
          },
          onSlide: i => this.syncDeckAddress('variants', i),
          onClose: () => this.syncDeckAddress(''),
        });
        this.syncDeckAddress('variants', at);
      },

      // Text collection runs: folders under projects/text/runs/ that name their
      // documents in files.jsonl, and folders the collection's proposals cite
      // as their basis, whose documents are counted from those proposals (a
      // filing run writes no files.jsonl). A folder that is neither is a run of
      // another kind and is not listed here.
      async loadTextRuns() {
        if (this.textRunState !== 'idle') return;
        this.textRunState = 'loading';
        try {
          // The run registry already names every run, its title, and which runs
          // hold a files.jsonl, so with it there is no folder listing to read
          // and no file to try in each of two dozen folders.
          const known = this.runRows.filter(r => r.run.startsWith('runs/'));
          const dirs = known.length ? known.map(r => r.name)
            : (await this.home.req(`contents/${this.TEXT_RUNS}?ref=${encodeURIComponent(this.DATA_REF)}`))
              .filter(d => d.type === 'dir').map(d => d.name).sort().reverse();
          const withFiles = known.length ? known.filter(r => r.deck === 'files').map(r => r.name) : dirs;
          const titled = async (name) => {
            const row = known.find(r => r.name === name);
            if (row) return row.title;
            try {
              const readme = await this.home.get(`${this.TEXT_RUNS}/${name}/README.md`);
              return (/^#\s+(.+)$/m.exec(readme.text) || [])[1] || name.slice(11).replace(/-/g, ' ');
            } catch (_) { return name.slice(11).replace(/-/g, ' '); }   // a run without a README keeps its folder name
          };
          const found = await Promise.all(withFiles.map(async name => {
            const dir = `${this.TEXT_RUNS}/${name}`;
            try {
              const res = await this.home.get(`${dir}/files.jsonl`);
              const files = res.text.split('\n').filter(l => l.trim()).map(l => JSON.parse(l));
              return { name, dir, date: name.slice(0, 10), title: await titled(name), files, unit: 'variants',
                       variants: files.reduce((n, f) => n + (f.variants || 0), 0) };
            } catch (_) { return null; }
          }));
          const runs = found.filter(Boolean);
          this.textRuns = runs;
          this.textRunState = 'done';
          // Drawn first, extended second: the collection verifies every passage
          // on read, and one that cannot be read leaves the list as it is.
          await this.loadVariants();
          const cited = this.variantIndex && window.TextCollection.bases ? window.TextCollection.bases(this.variantIndex) : new Map();
          for (const b of cited.values()) {
            if (!b.run || !dirs.includes(b.run) || runs.some(r => r.name === b.run)) continue;
            runs.push({ name: b.run, dir: `${this.TEXT_RUNS}/${b.run}`, date: b.date, title: await titled(b.run), unit: 'proposals',
                        files: b.files.map(f => ({ repo: f.repo, path: f.path, variants: f.proposals })), variants: b.proposals });
          }
          this.textRuns = [...runs].sort((x, y) => y.name.localeCompare(x.name));
          const want = this.deckParam.startsWith('run:') ? this.deckParam.slice(4) : '';
          const run = want && this.textRuns.find(r => r.name === want);
          if (run) { this.deckParam = ''; this.openRunDeck(run, this.deckAt); }
          else if (this.runFocus) this.$nextTick(() => document.getElementById(`run-${this.runFocus}`)?.scrollIntoView({ block: 'center' }));
        } catch (e) {
          this.textRunState = 'error';
          this.error = `runs: ${e.message || e}`;
        }
      },

      // One document per slide, drawn by md-variants' full-document reading
      // against the document as it stands on main, so the slide shows every
      // variant the collection holds for it, this run's and any other's.
      async openRunDeck(run, start = 0) {
        await gh.load('kits/swipe-deck.js');
        await gh.load('kits/md-variants.js');
        await this.loadVariants();
        const h = window.swipeDeck.h;
        const files = run.files;
        const at = Math.min(Math.max(0, start), files.length - 1);
        window.swipeDeck.open({
          count: files.length,
          start: at,
          title: run.title,
          subtitle: `${run.date} · ${files.length} files · ${run.variants.toLocaleString()} ${run.unit}`,
          icon: 'ph-flask',
          innerClass: 'w-full min-w-0 mx-auto',
          index: i => ({ title: files[i].path.split('/').pop(),
                         subtitle: `${files[i].repo.split('/').pop()}/${files[i].path}`,
                         group: files[i].repo }),
          render: (i, slide) => {
            const f = files[i];
            const head = h('div', { class: 'flex flex-wrap items-baseline gap-x-3 gap-y-1 font-mono text-xs mb-4' },
              h('span', { class: 'font-medium' }, `${f.repo.split('/').pop()}/${f.path}`),
              h('span', { class: 'opacity-60 tabular-nums' }, (f.words_before
                ? `${f.words_before.toLocaleString()} → ${(f.words_after || 0).toLocaleString()} words · ` : '')
                + `${f.variants} ${run.unit}`));
            const notes = (f.drafter || f.audit) && h('details', { class: 'mb-5 text-base leading-7' },
              h('summary', { class: 'cursor-pointer font-mono text-xs opacity-60' }, 'What changed, and what the audit restored'),
              h('p', { class: 'mt-2 text-pretty' }, f.drafter || ''),
              h('p', { class: 'mt-2 text-pretty opacity-70' }, f.audit ? `Audit: ${f.audit}` : ''));
            const doc = h('div', {}, h('span', { class: 'loading loading-dots loading-md opacity-60' }));
            slide.append(...[head, notes, doc].filter(Boolean));
            this.renderRunFile(doc, f);
          },
          onSlide: i => this.syncDeckAddress(`run:${run.name}`, i),
          onClose: () => this.syncDeckAddress(''),
        });
        this.syncDeckAddress(`run:${run.name}`, at);
      },

      async renderRunFile(host, f) {
        try {
          // Read-only, so no ref: the file follows the page's selection.
          const repo = new window.GH({ token: window.TOKEN || '', repo: f.repo });
          // The frontmatter is stripped, as the file viewer's Preview
          // strips it, or a skill's YAML renders as one bold heading.
          const md = (await repo.get(f.path)).text.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, '');
          host.textContent = '';
          await window.mdVariants.render(host, md, this.variantIndex, {
            file: { repo: f.repo, path: f.path }, strip: false,
            actions: v => this.variantActions(v),
          });
          if (!host.querySelector('.md-diff-change')) host.prepend(Object.assign(document.createElement('p'), {
            className: 'font-mono text-xs opacity-60 mb-3',
            textContent: 'No variant matches a paragraph of this file as it stands on main.' }));
        } catch (e) {
          host.textContent = `${f.repo}:${f.path}: ${e.message || e}`;
        }
      },

      // ── Exemplars ─────────────────────────────────────────────────────────
      // home's projects/text/exemplars: a piece is pieces/<slug>.md, front
      // matter then the text verbatim, with pieces/<slug>.standoff.json beside
      // it where the piece names a focus. All of it is read on the pane's
      // first open, since the list needs every piece's front matter and the
      // card reads the rest.
      async loadExemplars() {
        if (this.exemplarState !== 'idle') return;
        this.exemplarState = 'loading';
        this.exemplarError = '';
        try {
          await Promise.all(['kits/guide-render.js', 'kits/standoff.js', 'kits/read-aloud.js'].map(k => gh.load(k)));
          await window.GuideRender.needMarked();
          const dir = this.EXEMPLARS;
          const names = (await this.home.req(`contents/${dir}?ref=${encodeURIComponent(this.DATA_REF)}`))
            .filter(f => f.type === 'file').map(f => f.name);
          const pieces = await Promise.all(names.filter(n => n.endsWith('.md')).map(async name => {
            const id = name.slice(0, -3);
            const { bytes } = await this.home.bytes(`${dir}/${name}`);
            const text = new TextDecoder().decode(bytes);
            const { fields, bodyAt } = this.exemplarFields(text);
            const so = names.includes(`${id}.standoff.json`)
              ? JSON.parse((await this.home.get(`${dir}/${id}.standoff.json`)).text) : null;
            // The citations are a second standoff, optional, at a finer grain
            // than the paragraphs: what reading aloud leaves out.
            const cso = names.includes(`${id}.citations.standoff.json`)
              ? JSON.parse((await this.home.get(`${dir}/${id}.citations.standoff.json`)).text) : null;
            const digest = await this.sha256(bytes);
            const { spans, captions, stale } = this.exemplarFocus(so, text, digest, bytes.length);
            const cites = this.standoffRuns(cso, text, digest, bytes.length);
            const textAt = this.textStart(bodyAt, captions);
            return { ...fields, id, text, bodyAt, textAt, focusSpans: spans, captionSpans: captions, stale, standoff: !!so,
                     citationSpans: cites.runs.citation || [], citations: !!cso,
                     words: this.wordCount(text.slice(textAt)), doc: '', captionDoc: '', speech: '' };
          }));
          this.exemplars = pieces;
          if (!this.exemplarOf(this.exemplarSel)) this.exemplarSel = '';
          this.exemplarState = 'done';
          this.announceMarks();
          if (this.marksMode === 'd') { await gh.load('kits/mark-pad.js'); this.mountPad(); }
          if (this.deckParam === 'exemplars') {
            this.deckParam = '';
            this.$nextTick(() => this.openExemplarDeck(this.deckAt));
          }
        } catch (e) {
          this.exemplarError = `${e.message || e} (${this.REPO}@${this.DATA_REF})`;
          this.exemplarState = 'error';
        }
      },

      // A piece's front matter: one `key: value` a line, each value a YAML
      // double-quoted scalar (whose escapes are JSON's), a single-quoted one,
      // or plain. `bodyAt` is where the text after it starts in the file.
      exemplarFields(text) {
        const m = /^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(String(text || ''));
        if (!m) return { fields: {}, bodyAt: 0 };
        const fields = {};
        for (const line of m[1].split(/\r?\n/)) {
          const kv = /^([A-Za-z0-9_]+):[ \t]*(.*?)[ \t]*$/.exec(line);
          if (!kv) continue;
          let v = kv[2];
          if (v.startsWith('"')) { try { v = JSON.parse(v); } catch (_) { v = v.slice(1, -1); } }
          else if (v.startsWith("'")) v = v.slice(1, -1).replace(/''/g, "'");
          fields[kv[1]] = String(v);
        }
        return { fields, bodyAt: m[0].length };
      },

      async sha256(bytes) {
        try {
          const d = await crypto.subtle.digest('SHA-256', bytes);
          return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (_) { return ''; }   // no SubtleCrypto outside a secure context; the byte count still checks
      },

      // A standoff's runs by label, as spans of the index this page slices by.
      // The standoff's offsets count code points, as Python does, and
      // kits/standoff.js adopts them into UTF-16; consecutive units of one
      // label are one run, adjacent units included. A standoff that no longer
      // pins these bytes, or does not partition them, yields nothing and says
      // so (`stale`), rather than marking the wrong text.
      standoffRuns(so, text, digest = '', size = null) {
        const S = window.Standoff, none = stale => ({ runs: {}, stale });
        if (!so || !S) return none(false);
        const t = so.target || {};
        if ((digest && t.sha256 && t.sha256 !== digest) || (size != null && t.bytes != null && t.bytes !== size)) return none(true);
        const adopted = S.adopt(so, text);
        if (S.check(adopted, text).length) return none(true);
        const runs = {};
        let prev = '';
        for (const u of [...adopted.units].sort((a, b) => a.start - b.start)) {
          const list = (runs[u.label] ||= []);
          if (prev === u.label) list[list.length - 1].end = u.end;
          else list.push({ start: u.start, end: u.end });
          prev = u.label;
        }
        return { runs, stale: false };
      },
      // The focus standoff's two runs: `focus`, the passage to read first, and
      // `caption`, a source's notices and caption ahead of the text proper.
      exemplarFocus(so, text, digest = '', size = null) {
        const { runs, stale } = this.standoffRuns(so, text, digest, size);
        return { spans: (runs.focus || []).map(s => ({ ...s, words: this.wordCount(text.slice(s.start, s.end)) })),
                 captions: runs.caption || [], stale };
      },
      // Where the text proper starts: past the captions that open the body.
      // Without them, the body is the text.
      textStart(bodyAt, captions) {
        let at = bodyAt;
        for (const c of captions) if (c.start <= at + 2 && c.end > at) at = c.end;
        return at;
      },

      exemplarOf(id) { return this.exemplars.find(p => p.id === id) || null; },
      // By genre, the kind of writing a session arrives to imitate, largest
      // first; oldest first inside one.
      exemplarGroups() {
        const by = new Map();
        for (const p of this.exemplars) {
          const k = p.genre || 'other';
          if (!by.has(k)) by.set(k, []);
          by.get(k).push(p);
        }
        return [...by].map(([name, items]) => ({ name, items: items.sort((a, b) =>
            String(a.year).localeCompare(String(b.year)) || String(a.title).localeCompare(String(b.title))) }))
          .sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name));
      },
      exemplarIds() { return this.exemplarGroups().flatMap(g => g.items.map(p => p.id)); },
      // The title a list shows: the piece's own `short`, or, on a ref that
      // predates it, the full title up to its first clause break.
      shortTitle(t) { return String(t || '').split(/: | \(/)[0]; },
      listTitle(p) { return p.short || this.shortTitle(p.title || p.id); },
      shortAuthor(a) { return String(a || '').split(/ \(|, |; /)[0]; },
      // Surnames, for a row: a person's last name (two words, or a name with
      // initials), an organisation's name whole.
      surnames(a) {
        return this.shortAuthor(a).split(/ and | & /).map(name => {
          const w = name.trim().split(/\s+/).filter(x => !/^(Jr|Sr|II|III|IV)\.?$/.test(x));
          return w.length === 2 || w.some(x => /^([A-Z]\.)+$/.test(x)) ? w[w.length - 1] : name.trim();
        }).join(' & ');
      },
      shortYear(y) {
        const m = /^(\d{4})(?:-(\d{4}))?/.exec(String(y || ''));
        return !m ? String(y || '') : m[2] ? `${m[1]} → ${m[2]}` : m[1];
      },
      shortExtent(p) { return /^whole\b/i.test(p.extent || '') ? '' : String(p.extent || '').split(/ \(|: |; |, /)[0]; },

      // Who praised a piece, in their words, and where. A field naming several
      // keeps them in order, `|` between quotations and between sources and
      // `;` between names, and is read as pairs only where the three counts
      // agree; otherwise the words stand once, with every source after them.
      // "none found" is a placeholder and draws nothing.
      recognitions(p) {
        const none = v => !v || /^none found$/i.test(String(v).trim());
        if (none(p.recognition)) return [];
        const split = (v, sep) => none(v) ? [] : String(v).split(sep).map(s => s.trim()).filter(Boolean);
        const words = split(p.recognition, ' | '), hrefs = split(p.recognition_source, ' | ');
        const names = hrefs.length > 1 ? split(p.recognized_by, '; ') : [String(p.recognized_by || '').trim()];
        if (words.length === hrefs.length && names.length === hrefs.length)
          return words.map((w, i) => ({ words: w, by: names[i], links: this.links(hrefs[i]) }));
        return [{ words: words.join(' '), by: none(p.recognized_by) ? '' : p.recognized_by, links: this.links(hrefs.join(' ')) }];
      },
      // The addresses in a field, each named by its host, or by its file
      // where the host has already been named.
      links(text) {
        const seen = new Set();
        return (String(text || '').match(/https?:\/\/[^\s)|]+/g) || []).map(href => {
          let label = href;
          try {
            const u = new URL(href);
            label = seen.has(u.hostname) ? (u.pathname.split('/').filter(Boolean).pop() || u.hostname) : u.hostname;
            seen.add(u.hostname);
          } catch (_) {}
          return { href, label: label.replace(/^www\./, '') };
        });
      },
      exemplarFiles(p) {
        const md = `${this.EXEMPLARS}/${p.id}.md`, so = `${this.EXEMPLARS}/${p.id}.standoff.json`;
        const files = [{ name: `${p.id}.md`, href: window.RepoAddress.github.blob(this.REPO, this.DATA_REF, md) }];
        if (p.standoff) files.push({ name: `${p.id}.standoff.json`,
          href: `https://mehrlander.github.io/web-tools/pages/audit-render.html?src=${this.REPO}${this.DATA_REF === 'main' ? '' : '@' + this.DATA_REF}:${so}` });
        return files;
      },

      // One line a piece: its short title, then the surnames and the year,
      // quieter. The rest is the card's.
      exemplarRowHtml(p) {
        const by = [this.surnames(p.author), this.shortYear(p.year)].filter(Boolean).join(' · ');
