        return `<div data-exemplar="${esc(p.id)}" role="option" tabindex="-1" data-part="item" class="flex px-3 py-2.5 cursor-pointer border-b border-base-200 aria-selected:bg-base-200">`
          + `<span class="min-w-0 truncate text-base leading-6"><span class="font-medium" data-part="title">${esc(this.listTitle(p))}</span>`
          + `<span class="ml-2 text-sm text-base-content/60" data-part="meta">${esc(by)}</span></span></div>`;
      },
      exemplarListHtml() {
        return this.exemplarGroups().map(g => this.groupHtml(g.name, g.items.length)
          + g.items.map(p => this.exemplarRowHtml(p)).join('')).join('');
      },

      // A piece's card has two faces, switched by a control that stays at the
      // top of the card as it scrolls. Text is the piece itself, from the text
      // proper on. Context is everything about it: the full title and its
      // facts, who praised it and in what words, the caption a court opinion
      // opens with, and where the copy came from. Which face shows is one
      // choice for every card and the deck, so a swipe compares like with like.
      exemplarCardHtml(id) {
        const p = this.exemplarOf(id);
        if (!p) return '';
        const face = this.exemplarTab;
        const tab = (key, label) => `<button type="button" role="tab" data-exemplar-tab="${key}" aria-selected="${face === key}"`
          + ` class="${this.SEG.item} text-base-content/70 group-data-[tab=${key}]:bg-base-100 group-data-[tab=${key}]:font-medium`
          + ` group-data-[tab=${key}]:text-base-content group-data-[tab=${key}]:shadow-sm">${label}</button>`;
        return `<div class="group pb-[calc(var(--fab-bottom,1.5rem)+4rem)]${this.marksMode === 'c' ? ' pr-6' : ''}" data-exemplar-body="${esc(p.id)}" data-tab="${face}" data-cites="${this.citeMode}">`
          // Stuck above the slide's own top padding, so no line shows through it.
          + `<div class="sticky -top-8 z-[1] -mt-8 pt-8 -mx-1 px-1 pb-3 bg-base-100 flex items-center justify-between gap-2"><div class="${this.SEG.box}" role="tablist" aria-label="Show">`
          + tab('text', 'Text') + tab('context', 'Context') + `</div>${this.citesControl(p)}</div>`
          + `<div data-pane="text" class="min-w-0 pt-2 group-data-[tab=context]:hidden">${this.exemplarDoc(p)}</div>`
          + `<div data-pane="context" class="hidden group-data-[tab=context]:grid gap-8 min-w-0">${this.exemplarContextHtml(p)}</div></div>`;
      },
      // Trial c's way to the citations' look, which a and b keep in the FAB's
      // list: three ways to draw them, beside the faces, while Text shows.
      citesControl(p) {
        if (this.marksMode !== 'c' || !(p.citationSpans || []).length) return '';
        const one = (key, icon, label) => `<button type="button" data-exemplar-cites="${key}" aria-pressed="${this.citeMode === key}"`
          + ` aria-label="${label}" data-title-tip="${label}" class="${this.SEG.item} px-2 text-base-content/70 group-data-[cites=${key}]:bg-base-100`
          + ` group-data-[cites=${key}]:text-base-content group-data-[cites=${key}]:shadow-sm"><i class="ph ${icon} text-base"></i></button>`;
        return `<div class="${this.SEG.box} group-data-[tab=context]:hidden" role="group" aria-label="Citations">`
          + one('show', 'ph-eye', 'Citations shown') + one('dim', 'ph-circle-half', 'Citations dimmed') + one('hide', 'ph-eye-slash', 'Citations hidden') + `</div>`;
      },
      // Context: each part led by an icon, its sentences at the text's size and
      // its names, links and dates at the size of a label.
      exemplarContextHtml(p) {
        const read = this.readClass();
        const out = '<i class="ph ph-arrow-square-out ml-1"></i>';
        const a = (href, label, cls = '') => `<a class="link link-hover ${cls}" href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}${out}</a>`;
        const part = (icon, label, body) => `<div class="flex gap-3"><i class="ph ${icon} text-xl mt-1 self-start shrink-0 text-base-content/60" role="img" aria-label="${label}"></i>`
          + `<div class="min-w-0 grid gap-2 grow">${body}</div></div>`;
        const facts = [p.author, this.shortYear(p.year), p.genre, `${p.words.toLocaleString()} words`].filter(Boolean).join(' · ');
        const head = `<div class="grid gap-1"><h3 class="text-2xl leading-9 font-medium">${esc(p.title || p.id)}</h3>`
          + `<p class="text-sm leading-6 text-base-content/70">${esc(facts)}</p></div>`;
        const praise = this.recognitions(p).map(r => part('ph-quotes', 'Praised',
          `<div class="${read}"><p>${esc(r.words)}</p></div>`
          + `<p class="text-sm text-base-content/70">${r.links.length === 1 ? a(r.links[0].href, r.by || r.links[0].label)
            : esc(r.by) + r.links.map(l => ' ' + a(l.href, l.label, 'ml-2')).join('')}</p>`)).join('');
        const caption = p.captionSpans.length ? part('ph-scroll', 'Caption', this.exemplarCaption(p)) : '';
        const where = [...this.links(p.source_page).map(l => a(l.href, l.label)),
                       p.acquired ? `<span class="text-base-content/60">acquired ${esc(p.acquired)}</span>` : '']
          .filter(Boolean).join('<span class="text-base-content/40"> · </span>');
        const files = this.exemplarFiles(p).map(f => a(f.href, f.name, 'text-base-content/70')).join('');
        const sentences = [/\(/.test(p.year || '') ? p.year : '', p.extent && p.extent !== 'whole' ? p.extent : '', p.note]
          .filter(Boolean).map(s => `<p>${esc(s)}</p>`).join('');
        const source = part('ph-archive', 'Source',
          `<p class="text-base leading-7 font-medium">${esc(p.publisher || '')}</p>`
          + `<p class="flex flex-wrap items-center gap-x-1 gap-y-1 text-sm">${where}</p>`
          + (sentences ? `<div class="${read}">${sentences}</div>` : '')
          + `<p class="flex flex-wrap gap-x-4 gap-y-1 font-mono text-xs">${files}</p>`);
        return head + praise + caption + source;
      },
      // The caption, rendered as the source sets it, for Context.
      exemplarCaption(p) {
        if (p.captionDoc) return p.captionDoc;
        const G = window.GuideRender;
        if (!G || !window.marked) return '';
        const md = p.captionSpans.map(c => p.text.slice(c.start, c.end)).join('\n\n');
        p.captionDoc = `<div class="${this.readClass()}">${G.render(md, { knownRefs: [this.DATA_REF, 'main'] }).html}</div>`;
        return p.captionDoc;
      },
      // One face for every card: the attribute each body carries is what its
      // panes and its control read. The face being left keeps its scroll, so
      // Text reopens where the reader was.
      setExemplarTab(face) {
        if (face !== 'text' && face !== 'context') return;
        this.exemplarTab = face;
        for (const body of document.querySelectorAll('[data-exemplar-body]')) {
          if (body.getAttribute('data-tab') === face) continue;
          const box = this.scrollerOf(body);
          if (box) { (body._at ||= {})[body.getAttribute('data-tab')] = box.scrollTop; }
          body.setAttribute('data-tab', face);
          for (const b of body.querySelectorAll('[data-exemplar-tab]')) b.setAttribute('aria-selected', String(b.getAttribute('data-exemplar-tab') === face));
          if (box) box.scrollTop = (body._at || {})[face] || 0;
        }
        if (this.marksMode === 'c') requestAnimationFrame(() => this.railDraw());
      },
      // ── Reading aloud ──────────────────────────────────────────────────────
      // What Text shows, spoken: the stored Markdown with the front matter and
      // the caption cut out, and each span the citations standoff labels
      // `citation`. kits/read-aloud.js's speechText takes the syntax off. A
      // citation cut mid-sentence leaves a mark (CUT, a private-use
      // character speechText carries through), so the tidy that follows
      // touches only the places a cut was: a comma doubled across it, a
      // parenthesis it emptied, a comma it stranded before a full stop. A
      // footnote marker, `[^1]`, is apparatus too, and is not spoken.
      CUT: '\uE000',
      speechMarkdown(p) {
        const cuts = [{ start: 0, end: p.bodyAt, block: true },
                      ...p.captionSpans.map(c => ({ ...c, block: true })),
                      ...(p.citationSpans || []).map(c => ({ ...c, block: false }))]
          .sort((a, b) => a.start - b.start);
        let out = '', at = 0;
        for (const c of cuts) {
          if (c.end <= at) continue;
          if (c.start > at) out += p.text.slice(at, c.start);
          out += c.block ? '\n\n' : this.CUT;
          at = c.end;
        }
        return out + p.text.slice(at);
      },
      tidySpeech(s) {
        const C = this.CUT;
        return String(s)
          .replace(/\[\^[^\]\s]+\]/g, '')
          .replace(new RegExp(`[(\\[][\\s,;:]*(?:${C}[\\s,;:]*)+[)\\]]`, 'g'), C)
          // Punctuation on both sides of a cut, closing quotes allowed between:
          // the first comma stands for a second, and a full stop after it
          // takes its place, so "turpitude,” ⌧, and" and "decisionmaking,” ⌧."
          // read "turpitude,” and" and "decisionmaking.”".
          .replace(new RegExp(`([,;:])([”’"'\\s]*?)\\s*${C}\\s*[,;:]`, 'g'), `$1$2${C}`)
          .replace(new RegExp(`[,;:]([”’"'\\s]*?)\\s*${C}\\s*([.!?])`, 'g'), `$2$1${C}`)
          .replace(new RegExp(`[,;:]\\s*${C}(?=\\s*[)\\]])`, 'g'), C)
          // A sentence ended before the cut, so a comma after it is stray;
          // after an abbreviation ("Inc.") the sentence goes on and keeps it.
          .replace(new RegExp(`([.!?(\\[])\\s*${C}\\s*[,;:]+(?=\\s*(?:[A-Z“"]|$))`, 'gm'), `$1${C}`)
          .replace(new RegExp(`[ \\t]*${C}[ \\t]*(?=[—–])|(?<=[—–])[ \\t]*${C}[ \\t]*`, 'g'), '')
          .replace(new RegExp(`[ \\t]*${C}[ \\t]*`, 'g'), ' ')
          .replace(/[ \t]+([,;:.!?)\]])/g, '$1')
          .replace(/([(\[])[ \t]+/g, '$1')
          .replace(/[ \t]{2,}/g, ' ')
          .replace(/ ?\n ?/g, '\n')
          .trim();
      },
      speech(p) {
        if (!p.speech && window.readAloud) p.speech = this.tidySpeech(window.readAloud.speechText(this.speechMarkdown(p)));
        return p.speech || '';
      },
      speechItems(ids) {
        return ids.map((id, i) => { const p = this.exemplarOf(id); return { key: i, label: this.listTitle(p), md: this.speech(p) }; });
      },
      readRate() { try { return Number(localStorage.getItem('wt:readRate')) || 1; } catch (_) { return 1; } },
      // The card's voice: one player over the list, item `i` being row `i`,
      // started at the piece in view. As in the deck, the voice drives the
      // list when it moves on, and a pick in the list re-points the voice.
      speakCard(id) {
        const R = window.readAloud;
        if (!R || !R.supported) return;
        const ids = this.exemplarIds(), i = ids.indexOf(id);
        if (i < 0) return;
        if (!this.voice) {
          this.voice = R.player({ rate: this.readRate(), onState: s => {
            this.voiceAt = { state: s.state, id: ids[s.i] || '' };
            if (s.state !== 'idle' && ids[s.i] && ids[s.i] !== this.exemplarSel) this.swipers?.exemplar?.pick(ids[s.i]);
            this.swipers?.exemplar?.paint();
          } });
          this.voice.load(this.speechItems(ids));
        }
        if (this.voice.index === i && this.voice.state !== 'idle' && this.voice.state !== 'done') this.voice.toggle();
        else this.voice.play(i);
      },
      quietCard() { this.voice?.stop(); this.voice = null; this.voiceAt = { state: 'idle', id: '' }; },
      speakButton(p) {
        if (!window.readAloud?.supported) return '';
        const on = this.voiceAt.id === p.id && this.voiceAt.state === 'speaking';
        const label = on ? 'Pause' : 'Read the text aloud';
        return `<button type="button" data-exemplar-speak="${esc(p.id)}" aria-pressed="${on}" aria-label="${label}" data-title-tip="${label}"`
          + ` class="btn btn-ghost btn-xs btn-square flex-none -my-1 max-sm:h-8 max-sm:w-8"><i class="ph ${on ? 'ph-pause' : 'ph-speaker-high'} text-base"></i></button>`;
      },

      // Reading size, set on the pane's own text boxes over guide-render's
      // smaller default, with the headings, paragraph gaps and rules scaled
      // to match. The `!` is needed because the kit's sheet is unlayered.
      readClass() {
        const G = window.GuideRender;
        return (G ? G.bodyClass('page') + ' ' : '')
          + '!text-xl !leading-8 [&_p]:!my-4 [&_h1]:!text-2xl [&_h2]:!text-2xl [&_h3]:!text-xl [&_h4]:font-semibold'
          + ' [&_h2]:!mt-6 [&_h3]:!mt-5 [&_hr]:!my-8 [&_blockquote]:!pl-4 [&>:first-child]:!mt-0 [&>:last-child]:!mb-0';
      },
      // The card's head: the kit's own row, with the voice and the jump to the
      // focus beside the counter, in one place on every piece.
      exemplarHead(i, n, tight) {
        const id = this.exemplarIds()[i], p = this.exemplarOf(id) || {};
        const html = window.linkedSwiper.head({ when: this.shortYear(p.year), title: this.listTitle(p) },
          i, n, 'piece', { deck: true, tight });
        const at = html.indexOf('</h2>') + 5;
        const own = this.speakButton(p) + this.focusButton(p);
        return at > 4 ? html.slice(0, at) + own + html.slice(at) : html + own;
      },
      focusButton(p) {
        if (!p.focusSpans || !p.focusSpans.length) return '';
        return `<button type="button" data-exemplar-focus="${esc(p.id)}" class="btn btn-ghost btn-xs gap-1 px-1.5 font-normal flex-none -my-1 max-sm:h-8"`
          + ` aria-label="Jump to the focus" data-title-tip="${esc(this.focusLine(p))}">`
          + `<i class="ph ph-bookmark-simple text-base"></i><span class="font-mono text-xs tabular-nums">${this.marksMode === 'c'
            ? `focus ${(this.focusAt[p.id] || 0) + 1}/${p.focusSpans.length}` : 'focus'}</span></button>`;
      },
      focusLine(p) {
        const n = p.focusSpans.length, fw = p.focusSpans.reduce((s, f) => s + f.words, 0);
        return [p.focus, `${fw.toLocaleString()} of ${p.words.toLocaleString()} words`, n > 1 ? `${n} passages` : '']
          .filter(Boolean).join(' · ');
      },

      // The text proper, rendered once a piece and kept; the caption ahead of
      // it is Context's. The focus is marked over the render rather than cut
      // out of the source, so a passage cannot split a list or strand a
      // footnote: kits/standoff.js maps each text node back to its offset in
      // the file, a top-level block takes the offset of its first text, and a
      // run of blocks inside one focus span is wrapped. A block with no text of
      // its own (a rule, an image) joins a passage only from inside one. The
      // mark is a neutral rule down the passage's edge, with no fill: a fill
      // here is what a selected row wears.
      exemplarDoc(p) {
        if (p.doc) return p.doc;
        const G = window.GuideRender, S = window.Standoff;
        if (!G || !window.marked) return '';
        const box = document.createElement('div');
        box.className = this.readClass();
        box.innerHTML = G.render(p.text.slice(p.textAt), { knownRefs: [this.DATA_REF, 'main'] }).html;
        const cites = this.marksMode && S ? p.citationSpans || [] : [];
        if ((p.focusSpans.length || cites.length) && S) S.mapText(box, p.text, p.textAt);
        if (p.focusSpans.length && S) {
          const blocks = [...box.children];
          const own = blocks.map(b => {
            const s = b.matches('[data-src]') ? b : b.querySelector('[data-src]');
            return s ? p.focusSpans.findIndex(f => +s.dataset.src >= f.start && +s.dataset.src < f.end) : null;
          });
          const near = (i, d) => { for (let j = i + d; j >= 0 && j < own.length; j += d) if (own[j] != null) return own[j]; return -1; };
          const which = own.map((k, i) => k != null ? k : near(i, -1) === near(i, 1) ? near(i, -1) : -1);
          const total = p.focusSpans.length;
          for (let i = 0; i < blocks.length;) {
            const k = which[i];
            if (k < 0) { i++; continue; }
            let j = i;
            while (j < blocks.length && which[j] === k) j++;
            const wrap = document.createElement('section');
            wrap.dataset.focus = String(k);
            wrap.className = 'my-8 border-l-2 border-base-content/40 pl-5';
            wrap.innerHTML = `<div class="flex items-baseline gap-1.5 text-sm leading-6 text-base-content/60"><i class="ph ph-bookmark-simple self-center"></i><span>`
              + esc([p.focus || 'focus', total > 1 ? `${k + 1} of ${total}` : '', `${p.focusSpans[k].words.toLocaleString()} words`].filter(Boolean).join(' · '))
              + `</span></div>`;
            blocks[i].before(wrap);
            wrap.append(...blocks.slice(i, j));
            i = j;
          }
        }
        if (cites.length) this.wrapCitations(box, cites);
        p.doc = box.outerHTML;
        return p.doc;
      },
      // Each citation's text wrapped where the render drew it, cut at its own
      // edges inside the mapped text nodes, so it can be found, dimmed or
      // hidden in Text. One citation across an italic is several pieces with
      // one index.
      wrapCitations(box, cites) {
        for (const sp of [...box.querySelectorAll('[data-src]')]) {
          const node = sp.firstChild;
          if (!node || node.nodeType !== 3) continue;
          const s = +sp.dataset.src, raw = node.data, e = s + raw.length;
          const hits = cites.map((c, k) => ({ ...c, k })).filter(c => c.start < e && c.end > s);
          if (!hits.length) continue;
          const frag = document.createDocumentFragment();
          let cur = s;
          for (const c of hits) {
            const a = Math.max(s, c.start), b = Math.min(e, c.end);
            if (a > cur) frag.append(raw.slice(cur - s, a - s));
            const w = document.createElement('span');
            w.dataset.cite = String(c.k);
            w.className = 'transition-opacity group-data-[cites=dim]:opacity-40 group-data-[cites=hide]:hidden';
            w.textContent = raw.slice(a - s, b - s);
            frag.append(w);
            cur = b;
          }
          if (cur < e) frag.append(raw.slice(cur - s));
          sp.replaceChildren(frag);
        }
      },

      // A tap on a piece's own controls: its face, or the voice or the focus
      // control in the head, which is outside the piece's body and so names
      // the piece.
      exemplarClick(e) {
        const tab = e.target.closest('[data-exemplar-tab]');
        if (tab) { this.setExemplarTab(tab.getAttribute('data-exemplar-tab')); return true; }
        const cites = e.target.closest('[data-exemplar-cites]');
        if (cites) { this.setCiteMode(cites.getAttribute('data-exemplar-cites')); return true; }
        const voice = e.target.closest('[data-exemplar-speak]');
        if (voice) { this.speakCard(voice.getAttribute('data-exemplar-speak')); return true; }
        const focus = e.target.closest('[data-exemplar-focus]');
        if (!focus) return false;
        const id = focus.getAttribute('data-exemplar-focus');
        const scope = focus.closest('[data-part="detail"]') || document;
        this.jumpToFocus([...scope.querySelectorAll('[data-exemplar-body]')].find(el => el.getAttribute('data-exemplar-body') === id));
        return true;
      },
      scrollerOf(el) {
        let box = el && el.parentElement;
        while (box && box !== document.body
          && !(/auto|scroll/.test(getComputedStyle(box).overflowY) && box.scrollHeight > box.clientHeight)) box = box.parentElement;
        return box && box !== document.body ? box : null;
      },
      // Scroll a piece's body, in a card's slide or the deck's, to its next
      // focus passage, and back to the first after the last. The focus is in
      // Text, so the jump shows Text first.
      jumpToFocus(body) {
        const marks = [...(body?.querySelectorAll('[data-focus]') || [])];
        if (!marks.length) return;
        if (body.getAttribute('data-tab') !== 'text') {
          this.setExemplarTab('text');
          return requestAnimationFrame(() => this.jumpToFocus(body));
        }
        const k = (Number(body.dataset.next) || 0) % marks.length;
        body.dataset.next = String(k + 1);
        this.scrollToMark(body, marks[k]);
        this.noteFocus(body.getAttribute('data-exemplar-body'), k);
      },
      noteFocus(id, k) {
        this.focusAt = { ...this.focusAt, [id]: k };
        if (this.marksMode === 'c') this.swipers?.exemplar?.paint();
      },
      // Below the stuck face toggle, with a little room. On a phone the list
      // stands above the card and the card starts halfway down, so the page
      // brings the card up first: the mark is what the reader asked to read,
      // and a look link's dock covers the lower half of the screen.
      scrollToMark(body, el) {
        const box = this.scrollerOf(el);
        if (!box) return el.scrollIntoView({ block: 'start', behavior: 'smooth' });
        const card = this.$refs?.exemplarCard;
        if (card?.contains(box) && card.getBoundingClientRect().top > 8)
          window.scrollTo({ top: window.scrollY + card.getBoundingClientRect().top - 8, behavior: 'smooth' });
        const top = box.getBoundingClientRect().top;
        const bar = body.querySelector('[role="tablist"]')?.parentElement;
        const under = bar ? Math.max(0, bar.getBoundingClientRect().bottom - top) : 0;   // below the stuck toggle
        box.scrollTo({ top: box.scrollTop + el.getBoundingClientRect().top - top - under - 12, behavior: 'smooth' });
      },

      // ── Marks: three trials (?marks=a|b|c) ────────────────────────────────
      // A piece's marks, one row a kind, in the order the file has them: the
      // caption (shown in Context), each focus passage, and the citations as
      // one row, since an opinion carries seventy to a hundred and twenty.
      markItems(p) {
        if (!p) return [];
        const items = [], n = p.focusSpans.length, c = p.citationSpans || [];
        const prose = (a, b) => this.variantPreview(window.readAloud ? window.readAloud.speechText(p.text.slice(a, b)) : p.text.slice(a, b), 90);
        if (p.captionSpans.length) items.push({ key: 'caption', at: p.captionSpans[0].start, icon: 'ph-scroll', label: 'Caption', short: 'caption',
          sub: prose(p.captionSpans[0].start, p.captionSpans[0].end), go: () => this.goMark(p.id, 'caption') });
        p.focusSpans.forEach((f, k) => items.push({ key: 'focus' + k, at: f.start, icon: 'ph-bookmark-simple',
          label: n > 1 ? `Focus ${k + 1} of ${n}` : 'Focus', short: `focus ${k + 1}/${n}`,
          sub: [p.focus, `${f.words.toLocaleString()} words`].filter(Boolean).join(' · '), go: () => this.goMark(p.id, 'focus', k) }));
        if (c.length && this.marksMode) items.push({ key: 'citations', at: c[0].start, icon: 'ph-paperclip', label: 'Citations',
          short: `citations ${c.length}`, count: c.length, sub: prose(c[0].start, c[0].end),
          choice: { value: this.citeMode, options: [['show', 'Show'], ['dim', 'Dim'], ['hide', 'Hide']], set: v => this.setCiteMode(v) },
          go: () => this.goMark(p.id, 'cite', 0) });
        return items.sort((a, b) => a.at - b.at);
      },
      // The FAB's word that the marks changed, to this window and to the one
      // framing it: in a toss the FAB on screen is the renderer's, outside the
      // frame, and cannot watch this page's state (fab.js, "the toss").
      announceMarks() {
        if (this.marksMode !== 'a' && this.marksMode !== 'b') return;
        const say = w => { try { w.dispatchEvent(new w.CustomEvent('fab:marks')); } catch (_) {} };
        say(window);
        try { if (window.parent && window.parent !== window) say(window.parent); } catch (_) {}
      },
      get marksSig() {
        return [this.pane, this.exemplarSel, this.exemplars.length, JSON.stringify(this.marksAt), this.citeMode, this.padKind].join('|');
      },
      // Trial d: the arrows step through the piece's marked passages, the
      // caption and each focus, in the order the file has them; a tap on the
      // label turns them to the citations, one at a time, since an opinion's
      // hundred are a different walk from its two passages.
      padItems() {
        const p = this.pane === 'exemplars' ? this.exemplarOf(this.exemplarSel) : null;
        if (!p) return [];
        const c = p.citationSpans || [];
        if (this.padKind === 'citations' && c.length)
          return c.map((_, k) => ({ label: `citation ${k + 1} of ${c.length}`, go: () => this.goMark(p.id, 'cite', k) }));
        return this.markItems(p).filter(m => m.key !== 'citations')
          .map(m => ({ label: m.key === 'caption' ? 'caption' : m.short.replace(/ (\d+)\/(\d+)$/, ' $1 of $2'), go: m.go }));
      },
      mountPad() {
        if (this.marksMode !== 'd' || this.pad || !window.MarkPad) return;
        this.pad = window.MarkPad.mount({
          at: 'marks',
          items: () => this.padItems(),
          go: (i, item) => item.go(),
          scope: () => [this.pane, this.exemplarSel, this.padKind].join('|'),
          idle: n => this.padKind === 'citations' ? `${n} citations` : `${n} ${n === 1 ? 'mark' : 'marks'}`,
          kinds: () => (this.exemplarOf(this.exemplarSel)?.citationSpans || []).length
            ? [{ key: 'marks', label: 'the marked passages', icon: 'ph-bookmark-simple' },
               { key: 'citations', label: 'the citations', icon: 'ph-paperclip' }] : [],
          kind: () => this.padKind,
          choose: k => { this.padKind = k; },
        });
      },
      // What the FAB reads (its `marks` contract), in trials a and b only.
      get marks() {
        if ((this.marksMode !== 'a' && this.marksMode !== 'b') || this.pane !== 'exemplars') return null;
        const p = this.exemplarOf(this.exemplarSel);
        if (!p) return null;
        const items = this.markItems(p);
        return { title: this.listTitle(p), style: this.marksMode === 'b' ? 'stepper' : 'tab', items,
                 at: items[this.marksAt[p.id]] || null, step: d => this.stepMark(d) };
      },
      stepMark(d) {
        const p = this.exemplarOf(this.exemplarSel), items = this.markItems(p);
        if (!items.length) return;
        const i = this.marksAt[p.id] ?? -1;
        const to = i < 0 ? (d > 0 ? 0 : items.length - 1) : Math.max(0, Math.min(items.length - 1, i + d));
        items[to].go();
      },
      // The body on screen for a piece: the deck's when one is open over the
      // card, else the card's.
      visibleBody(id) {
        const all = [...document.querySelectorAll('[data-exemplar-body]')]
          .filter(b => b.getAttribute('data-exemplar-body') === id && b.getClientRects().length);
        const inView = b => { const r = b.getBoundingClientRect(); return r.right > 1 && r.left < innerWidth - 1; };
        return all.find(b => b.closest('.sd-overlay') && inView(b)) || all.find(inView) || all[0] || null;
      },
      // Show the mark's face, scroll to it, and ring it a moment, in the base
      // colour: colour on this page is a standing.
      goMark(id, kind, k = 0) {
        const body = this.visibleBody(id);
        if (!body) return;
        const key = kind === 'focus' ? 'focus' + k : kind === 'cite' ? 'citations' : 'caption';
        this.marksAt = { ...this.marksAt, [id]: this.markItems(this.exemplarOf(id)).findIndex(m => m.key === key) };
        if (kind === 'cite' && this.citeMode === 'hide') this.setCiteMode('dim');
        const go = () => {
          // A citation across an italic is several pieces, and all of them ring.
          const els = kind === 'caption' ? [body.querySelector('[aria-label="Caption"]')?.parentElement]
            : kind === 'focus' ? [body.querySelectorAll('[data-focus]')[k]] : [...body.querySelectorAll(`[data-cite="${k}"]`)];
          if (!els[0]) return;
          this.scrollToMark(body, els[0]);
          this.ringMark(kind === 'cite' ? els : [this.ringable(body, els[0])]);
          if (kind === 'focus') { body.dataset.next = String(k + 1); this.noteFocus(id, k); }
          setTimeout(() => this.railDraw(), 400);
        };
        const face = kind === 'caption' ? 'context' : 'text';
        if (body.getAttribute('data-tab') !== face) { this.setExemplarTab(face); requestAnimationFrame(go); } else go();
      },
      // A block mark rings. A citation runs inside a sentence and across
      // italics in several pieces, where a ring a piece is a row of boxes, so
      // it is underlined instead, one line through all of its pieces.
      RING: ['ring-2', 'ring-base-content/40', 'ring-offset-4', 'ring-offset-base-100', 'rounded-sm'],
      UNDERLINE: ['underline', 'decoration-2', 'decoration-base-content/60', 'underline-offset-[6px]'],
      // A RING THE READER SEES WHOLE. A block taller than the card's view
      // cannot be ringed whole, and a ring the card's edge cuts off reads as
      // a fault, so such a block is ringed at its opening instead: a focus
      // passage at its heading line, whose rule still shows how far it runs,
      // and a caption at its first paragraph, or at its own icon where even
      // that is taller than the view, as the notice that opens an opinion is
      // on a phone.
      ringable(body, el) {
        const box = this.scrollerOf(el), row = body.querySelector('[role="tablist"]')?.parentElement;
        if (!box) return el;
        const under = row ? Math.max(0, row.getBoundingClientRect().bottom - box.getBoundingClientRect().top) : 0;
        const room = box.clientHeight - under - 24;
        if (el.offsetHeight <= room) return el;
        const open = el.matches('[data-focus]') ? el.firstElementChild : el.querySelector('.guide-body > :first-child, p');
        if (open && open.offsetHeight <= room) return open;
        return el.querySelector(':scope > [aria-label]') || el;
      },
      ringMark(els) {
        clearTimeout(this._ringT);
        const off = () => { for (const [e, c] of this._ringEls || []) e.classList.remove(...c); };
        off();
        this._ringEls = [].concat(els).filter(Boolean).map(e => [e, e.matches('[data-cite]') ? this.UNDERLINE : this.RING]);
        for (const [e, c] of this._ringEls) e.classList.add(...c);
        this._ringT = setTimeout(off, 2400);
      },
      setCiteMode(v) {
        this.citeMode = v;
        for (const b of document.querySelectorAll('[data-exemplar-body]')) b.setAttribute('data-cites', v);
        for (const b of document.querySelectorAll('[data-exemplar-cites]')) b.setAttribute('aria-pressed', String(b.getAttribute('data-exemplar-cites') === v));
        setTimeout(() => this.railDraw(), 50);
      },

      // Trial c: a rail down the card's right edge, a tick at each mark where
      // the render has it (a bar the length of a focus passage, a short tick a
      // citation) and a box for the part in view, as a diff's minimap draws
      // one. A tick takes the reader to its mark; anywhere else on the rail
      // to that point of the piece. Drawn over the card from outside the
      // slides, so it stays put while the piece scrolls.
      //
      // A FINGER, NOT A POINTER. Each mark is a target the rail's full width
      // across, out into the gutter on its left and to the card's edge on its
      // right, its visible bar or tick drawn inside it: a focus passage owns
      // its stretch of the rail and a little more, and a citation reaches
      // halfway to its neighbours. Drawn only as wide as they look (six
      // pixels), a tap a few pixels off the bar went to a citation inside the
      // passage, so the card scrolled near the passage and a walkthrough
      // waiting for the bar never saw it tapped (owner, iPhone, 2026-11-18).
      railMount(card) {
        if (this.marksMode !== 'c' || !card || card.querySelector('[data-rail]')) return;
        card.classList.add('relative');
        const rail = document.createElement('div');
        rail.dataset.rail = '';
        rail.setAttribute('aria-label', 'Marks in this piece');
        rail.className = 'absolute z-[2] w-5 rounded-sm bg-base-200/70 cursor-pointer';
        rail.hidden = true;
        card.append(rail);
        rail.addEventListener('click', e => this.railClick(e));
        card.addEventListener('scroll', () => this.railView(), true);
        if (typeof ResizeObserver === 'function') new ResizeObserver(() => this.railDraw()).observe(card);
      },
      railParts() {
        const card = this.$refs?.exemplarCard, rail = card?.querySelector('[data-rail]');
        const p = this.exemplarOf(this.exemplarSel);
        const body = rail && p ? [...card.querySelectorAll('[data-exemplar-body]')].find(b => b.getAttribute('data-exemplar-body') === p.id) : null;
        return { card, rail, p, body, box: body && this.scrollerOf(body) };
      },
      railDraw() {
        const { card, rail, p, body, box } = this.railParts();
        if (!rail) return;
        if (!body || !box || body.getAttribute('data-tab') !== 'text' || !(p.focusSpans.length || (p.citationSpans || []).length)) { rail.hidden = true; return; }
        rail.hidden = false;
        rail.style.top = ((card.querySelector('[data-ls="head"]')?.offsetHeight || 0) + 8) + 'px';
        rail.style.bottom = '8px';
        rail.style.right = (box.offsetWidth - box.clientWidth + 2) + 'px';
        // Positions in the rail's own pixels, a point of the piece to a point
        // of the rail; a resize redraws.
        const b = body.getBoundingClientRect(), H = rail.getBoundingClientRect().height || 1;
        const y = v => (v - b.top) / (b.height || 1) * H, px = v => v.toFixed(1) + 'px';
        const n = p.focusSpans.length, PAD = 6, CAP = 12, seen = new Set();
        const bars = [...body.querySelectorAll('[data-focus]')].map((el, k) => {
          const r = el.getBoundingClientRect(), t = y(r.top), h = Math.max(4, y(r.bottom) - t);
          return { k, t, h, top: t - PAD, bot: t + h + PAD };
        });
        const inBar = v => bars.some(f => v >= f.top && v <= f.bot);
        // A hidden citation has no place in the text, so it has none on the
        // rail. A citation whose tick would touch the one above it gets none
        // either: its place is the neighbour's, a scroll away.
        let last = -Infinity;
        const ticks = [];
        for (const el of body.querySelectorAll('[data-cite]')) {
          if (!el.getClientRects().length || seen.has(el.dataset.cite)) continue;
          seen.add(el.dataset.cite);
          const v = y(el.getBoundingClientRect().top);
          if (v - last < 5) continue;
          last = v;
          ticks.push({ k: +el.dataset.cite, v });
        }
        const free = ticks.filter(t => !inBar(t.v));
        const zones = free.map((t, i) => {
          let top = Math.max(t.v - CAP, i ? (free[i - 1].v + t.v) / 2 : -Infinity);
          let bot = Math.min(t.v + CAP, i < free.length - 1 ? (t.v + free[i + 1].v) / 2 : Infinity);
          for (const f of bars) { if (f.bot > top && f.bot <= t.v) top = f.bot; if (f.top < bot && f.top > t.v) bot = f.top; }
          return { ...t, top: Math.max(0, top), bot: Math.min(H, bot) };
        });
        const TICK = 'pointer-events-none absolute right-1 h-[3px] w-1.5 rounded-full bg-base-content/30';
        const cites = zones.map(z => `<button type="button" data-rail-go="cite:${z.k}" aria-label="Citation ${z.k + 1}"`
            + ` class="group/tick pointer-events-auto absolute inset-x-0" style="top:${px(z.top)};height:${px(z.bot - z.top)}">`
            + `<span class="${TICK} group-hover/tick:bg-base-content/70" style="top:${px(z.v - z.top)}"></span></button>`)
          .concat(ticks.filter(t => inBar(t.v)).map(t => `<span aria-hidden="true" class="${TICK}" style="top:${px(t.v)}"></span>`));
        const focus = bars.map(f => `<button type="button" data-rail-go="focus:${f.k}" aria-label="${n > 1 ? `Focus ${f.k + 1} of ${n}` : 'Focus'}"`
          + ` class="group/bar absolute -left-2 -right-0.5" style="top:${px(f.top)};height:${px(f.bot - f.top)}">`
          + `<span class="pointer-events-none absolute left-2.5 w-1.5 rounded-sm bg-base-content/50 group-hover/bar:bg-base-content/80" style="top:${px(PAD)};height:${px(f.h)}"></span></button>`);
        // The citations in one layer a walkthrough can name ("any tick"), the
        // focus bars over it, so a passage's own stretch of the rail is its.
        const html = (ticks.length ? `<div data-rail-cites class="pointer-events-none absolute inset-y-0 -left-2 -right-0.5">${cites.join('')}</div>` : '') + focus.join('');
        // Rebuilt only when a tick moved, so a tick a reader (or a look link)
        // is about to tap is still the element on screen when they do.
        if (rail._ticks !== html) {
          rail.innerHTML = `<div data-rail-view class="absolute inset-x-0 rounded-sm bg-base-content/10 pointer-events-none"></div>` + html;
          rail._ticks = html;
        }
        this.railView();
      },
      railView() {
        const { rail, body, box } = this.railParts();
        const v = rail?.querySelector('[data-rail-view]');
        if (!v || !box) return;
        const b = body.getBoundingClientRect(), r = box.getBoundingClientRect();
        v.style.top = Math.max(0, (r.top - b.top) / b.height * 100) + '%';
        v.style.height = Math.min(100, r.height / b.height * 100) + '%';
      },
      railClick(e) {
        const { rail, p, body, box } = this.railParts();
        if (!p || !box) return;
        const hit = e.target.closest('[data-rail-go]');
        if (hit) { const [kind, k] = hit.getAttribute('data-rail-go').split(':'); return this.goMark(p.id, kind, +k); }
        const r = rail.getBoundingClientRect(), f = (e.clientY - r.top) / r.height;
        box.scrollTo({ top: Math.max(0, f * body.offsetHeight - box.clientHeight / 2), behavior: 'smooth' });
      },

      // The pieces one at a time, the card in a takeover. Its place follows
      // the list, so closing it returns to the piece last read. The header
      // names the piece in view and is set again on every slide (the snag
      // swipe-deck-generic-header); the icon says what kind of slide it is.
      // The voice is read-aloud's deck action: it starts at the slide in view
      // and drives the deck, and a swipe re-points it.
      async openExemplarDeck(start = 0) {
        const ids = this.exemplarIds();
        if (!ids.length) return;
        await gh.load('kits/swipe-deck.js');
        this.quietCard();
        const at = Math.min(Math.max(0, start), ids.length - 1);
        const name = i => { const p = this.exemplarOf(ids[i]) || {};
          return { title: this.listTitle(p), sub: [this.surnames(p.author), this.shortYear(p.year), p.genre].filter(Boolean).join(' · ') }; };
        const speaker = window.readAloud?.supported ? window.readAloud.deckAction({
          items: this.speechItems(ids), title: 'Read the text aloud from this piece' }) : null;
        let handle = null;
        handle = window.swipeDeck.open({
          count: ids.length,
          start: at,
          title: name(at).title,
          subtitle: name(at).sub,
          icon: this.PANE_META.exemplars.icon,
          innerClass: 'w-full min-w-0 mx-auto',
          actions: speaker ? [speaker.action] : [],
          index: i => {
            const p = this.exemplarOf(ids[i]);
            return { title: this.listTitle(p), subtitle: [this.shortAuthor(p.author), this.shortYear(p.year)].join(' · '), group: p.genre };
          },
          // The focus control is the slide's, so it shows while that piece is
          // the one in view.
          render: (i, slide, chrome = {}) => {
            const p = this.exemplarOf(ids[i]);
            const el = document.createElement('div');
            el.innerHTML = this.exemplarCardHtml(ids[i]);
            el.addEventListener('click', e => this.exemplarClick(e));
            slide.append(el);
            chrome.setChrome?.({
              actions: p.focusSpans.length ? [{ icon: 'ph-bookmark-simple', title: `Jump to the focus: ${this.focusLine(p)}`,
                onClick: () => this.jumpToFocus(el.querySelector('[data-exemplar-body]')) }] : [],
            });
          },
          onSlide: i => {
            const n = name(i);
            handle?.setTitle?.(n.title);
            handle?.setSubtitle?.(n.sub);
            speaker?.onSlide(i);
            this.exemplarSel = ids[i];
            this.swipers?.exemplar?.show(ids[i]);
            this.syncSel();
            this.syncDeckAddress('exemplars', i);
          },
          onClose: () => { speaker?.stop(); this.syncDeckAddress(''); },
        });
        this.syncDeckAddress('exemplars', at);
        return handle;
      },

      get resCounts() {
        const c = { held: 0, fetched: 0, absent: 0 };
        this.resources.forEach(r => c[r.state]++);
        return c;
      },
      // What each resource rates: the question a session arrives with is "what
      // do we have that carries concreteness", not "what is in concept-lab".
      get rates() {
        const m = new Map();
        this.resources.forEach(r => this.list(r.rates).forEach(x => m.set(x, (m.get(x) || 0) + 1)));
        return [...m].sort((a, b) => a[0].localeCompare(b[0]));
      },
      get shownResources() {
        return this.resources.filter(r =>
          (!this.filterState || r.state === this.filterState)
          && (!this.rate || this.list(r.rates).includes(this.rate)));
      },
      resGroups() {
        return ['held', 'fetched', 'absent']
          .map(state => ({ state, items: this.shownResources.filter(r => r.state === state) }))
          .filter(g => g.items.length);
      },

      // What the pane is actually for, in one grid: for each property a word
      // can be rated on, how many resources carry it and in which state. It
      // answers "can we rate valence" (no) and "how many ways can we rate
      // frequency" (four) without reading twenty-three rows. A matrix rather
      // than a row of tiles, because the comparison across two axes IS the
      // finding: the absent column is where the shopping list lives.
      get matrix() {
        return this.rates.map(([name]) => {
          const of = s => this.resources.filter(r =>
            r.state === s && this.list(r.rates).includes(name)).length;
          return { name, held: of('held'), fetched: of('fetched'), absent: of('absent') };
        });
      },
      list(s) { return window.Csv ? window.Csv.list(s) : [] },

      // Four locator forms, and one of them deliberately has no link: an nltk
      // download id names a corpus, not a page.
      resourceUrl(loc) {
        if (!loc) return '';
        if (/^https?:/.test(loc)) return loc;
        if (loc.startsWith('npm:')) return `https://www.npmjs.com/package/${loc.slice(4)}`;
        if (loc.startsWith('pip:')) return `https://pypi.org/project/${loc.slice(4)}/`;
        if (loc.startsWith('nltk:')) return '';
        const [repo, path] = loc.split(':');
        const ref = repo === this.REPO ? this.DATA_REF : (window.GH?.refFor?.(repo, path) || 'main');
        return window.RepoAddress.github.blob(repo, ref, path);
      },
      resourceLabel(loc) {
        if (!loc) return '';
        if (/^https?:/.test(loc)) return new URL(loc).hostname;
        if (/^(npm|pip|nltk):/.test(loc)) return loc;
        return loc.split('/').pop();
      },

      // An artifact is either an absolute URL or a path relative to probes/.
      // The relative form resolves into a blob at the ref being read, so the
      // link is correct from wherever the page was opened.
      artifactUrl(a) {
        if (/^https?:/.test(a)) return a;
        const out = [];
        for (const seg of `${this.ROOT}/probes/${a}`.split('/')) {
          if (seg === '..') out.pop();
          else if (seg && seg !== '.') out.push(seg);
        }
        return window.RepoAddress.github.blob(this.REPO, this.DATA_REF, out.join('/'));
      },
      artifactName(a) { return a.split('/').filter(Boolean).pop() },

      tossUrl(path) { return `${this.TOSS}#gh=${this.REPO}@${this.DATA_REF}:${path}` },
      treeUrl(path) { return window.RepoAddress.github.tree(this.REPO, this.DATA_REF, path) },
      shut() { document.activeElement?.blur() },
    }));
  });

  await gh.load('alpine-bundle.js');   // starts Alpine
 } catch (e) {
  // Without this the page has no way to say anything. The boot chain runs
  // before Alpine, and every element is inside the x-cloak root, so a rejected
  // await left a blank white page carrying no clue as to which step failed.
  const b = document.getElementById('boot');
  if (b) b.textContent = `boot failed at ${location.hostname}: ${e.message || e}`;
  throw e;
 }
</script>
</head>

<body class="bg-base-100 min-h-dvh text-base-content">

<!-- Sits outside the cloaked root and is removed by init(), so the page always
     says something: booting, or which step failed. -->
<div id="boot" class="p-6 font-mono text-sm opacity-70">loading…</div>

<div x-data="textInstruments" x-cloak class="h-dvh grid grid-cols-[minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)]">

  <!-- ── chrome ───────────────────────────────────────────────────────────
       The Web Tools app views' idiom (Search, Map): a pill strip of tabs with
       icons, then the pane's own controls as ordinary form controls, a
       bordered search box, a count, a badge rail for the one facet worth
       switching often, and a bordered select for the rest. Normal flow, not
       fixed: this page is a tenant, framed as an app view. The title shows
       only when the page stands alone; framed, the app's header names it. -->
  <header class="px-4 sm:px-6 pb-2 flex flex-col gap-2 border-b border-base-200" :class="framed ? 'pt-1' : 'pt-3'">
    <div x-show="!framed" class="flex items-center gap-2">
      <i class="ph ph-flask text-xl text-base-content/50"></i>
      <h1 class="text-lg font-semibold">Text Lab</h1>
    </div>

    <div class="flex items-center gap-0.5 rounded-lg bg-base-200/60 p-0.5 w-fit max-w-full overflow-x-auto" role="tablist" data-slot="frame:tabs">
      <template x-for="key in PANES" :key="key">
        <button role="tab" @click="showPane(key)" :aria-selected="pane === key"
                class="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-sm font-medium transition-colors whitespace-nowrap shrink-0"
                :class="pane === key ? 'bg-base-100 text-primary shadow-sm' : 'text-base-content/60 hover:text-base-content'">
          <i class="ph text-base" :class="PANE_META[key].icon"></i><span x-text="PANE_META[key].label"></span>
        </button>
      </template>
    </div>

    <!-- variants: search with the count and the deck door, then one row of
         filter chips for purpose and one for author, each with its label at
         the left. A row's chips scroll sideways beside the label; nothing
         wraps on a phone. -->
    <div x-show="pane === 'variants'" class="flex items-center gap-2 min-w-0">
      <label class="input input-sm input-bordered flex items-center gap-2 grow min-w-0 max-w-md">
        <i class="ph ph-magnifying-glass opacity-70"></i>
        <input type="search" class="grow min-w-0" data-find-box
               aria-label="Search variants" placeholder="search variants"
               x-model="variantQ"
               @input.debounce.250ms="variantOpen = ''; syncVariantAddress()"
               @keydown.escape="variantQ = ''; variantOpen = ''; syncVariantAddress()">
      </label>
      <span class="text-sm whitespace-nowrap shrink-0">
        <span class="font-semibold tabular-nums" x-text="variantRows.length.toLocaleString()"></span>
        <span class="text-base-content/70"
              x-text="variantRows.length === variantTotal ? '' : ' of ' + variantTotal.toLocaleString()"></span>
      </span>
      <button x-show="variantRows.length" class="btn btn-square btn-sm btn-ghost text-primary shrink-0 max-sm:h-10 max-sm:w-10"
              :aria-label="'Read ' + variantRows.length.toLocaleString() + ' variants one at a time'"
              @click="openVariantDeck(variantRows)">
        <i class="ph ph-cards-three text-lg"></i>
      </button>
    </div>

    <template x-for="kind in ['purpose', 'author']" :key="kind">
      <div x-show="pane === 'variants' && variantIndex" :class="FILTER.row" data-slot="frame:count-chips">
        <span :class="FILTER.label" x-text="kind === 'purpose' ? 'Purpose' : 'Author'"></span>
        <div :class="FILTER.strip" role="group" :aria-label="kind">
          <button type="button" :class="[FILTER.chip, !variantPick(kind) ? FILTER.on : FILTER.off]" @click="setVariantFilter(kind, '')">All</button>
          <template x-for="row in variantFacet(kind)" :key="row.key">
            <button type="button" :class="[FILTER.chip, variantPick(kind) === row.key ? FILTER.on : FILTER.off]"
                    @click="setVariantFilter(kind, variantPick(kind) === row.key ? '' : row.key)">
              <span x-text="row.key"></span><span class="opacity-60 tabular-nums" x-text="row.n.toLocaleString()"></span>
            </button>
          </template>
        </div>
      </div>
    </template>

    <!-- probes: the standings are the filter, then concepts -->
    <!-- probes: the standing counts with the concept picker held in view
         beside them, then the grouping on a row of its own with any filter a
         card's badge has set. Each strip scrolls sideways inside itself, so
         the picker never leaves the viewport. -->
    <div x-show="pane === 'probes'" :class="FILTER.row">
      <span :class="FILTER.label">Standing</span>
      <div :class="FILTER.strip" role="group" aria-label="Standing" data-slot="frame:count-chips">
        <button type="button" :class="[FILTER.chip, !filterStanding ? FILTER.on : FILTER.off]" @click="filterStanding = ''">All</button>
        <template x-for="key in ['worked','mixed','failed','open']" :key="key">
          <button type="button" :class="[FILTER.chip, filterStanding === key ? FILTER.on : FILTER.off]"
                  @click="filterStanding = filterStanding === key ? '' : key">
            <span class="w-2 h-2 rounded-full" :class="STANDINGS[key].bar"></span>
            <span x-text="key"></span><span class="opacity-60 tabular-nums" x-text="counts[key]"></span>
          </button>
        </template>
      </div>
      <select id="probe-concept" class="select select-bordered select-sm shrink-0 w-36 sm:w-56 ml-auto" aria-label="Concept" data-slot="frame:filter-switch"
              x-model="concept">
        <option value="">Every concept</option>
        <template x-for="[name, n] in concepts" :key="name">
          <option :value="name" x-text="name + ' (' + n + ')'"></option>
        </template>
      </select>
    </div>
    <div x-show="pane === 'probes'" :class="FILTER.row">
      <span :class="FILTER.label">Group by</span>
      <div :class="FILTER.strip">
        <div class="shrink-0" :class="SEG.box">
          <template x-for="[key, label] in PROBE_BYS" :key="key">
            <button type="button" :class="[SEG.item, probeBy === key ? SEG.on : SEG.off]" @click="probeBy = key" x-text="label"></button>
          </template>
        </div>
        <template x-for="[dim, value] in Object.entries(badgeFilter)" :key="dim">
          <button type="button" :class="[FILTER.chip, FILTER.on]" @click="toggleBadge(dim, value)">
            <span x-text="badgeText(dim, value)"></span><i class="ph ph-x"></i>
          </button>
        </template>
        <button type="button" x-show="probeRun" :class="[FILTER.chip, FILTER.on]" @click="probeRun = ''">
          <i class="ph ph-play-circle"></i><span x-text="(runRows.find(r => r.run === probeRun) || {}).title || probeRun"></span><i class="ph ph-x"></i>
        </button>
      </div>
    </div>
    <div x-show="pane === 'runs' && runRows.length" :class="FILTER.row">
      <span :class="FILTER.label">Group by</span>
      <div :class="FILTER.strip">
        <div class="shrink-0" :class="SEG.box">
          <template x-for="[key, label] in RUN_BYS" :key="key">
            <button type="button" :class="[SEG.item, runBy === key ? SEG.on : SEG.off]" @click="runBy = key" x-text="label"></button>
          </template>
        </div>
      </div>
    </div>

    <!-- resources: the states are the filter, then properties -->
    <div x-show="pane === 'resources'" :class="FILTER.row">
      <span :class="FILTER.label">State</span>
      <div :class="FILTER.strip" role="group" aria-label="State" data-slot="frame:count-chips">
        <button type="button" :class="[FILTER.chip, !filterState ? FILTER.on : FILTER.off]" @click="filterState = ''">All</button>
        <template x-for="key in ['held','fetched','absent']" :key="key">
          <button type="button" :class="[FILTER.chip, filterState === key ? FILTER.on : FILTER.off]"
                  @click="filterState = filterState === key ? '' : key">
            <span x-text="key"></span><span class="opacity-60 tabular-nums" x-text="resCounts[key]"></span>
          </button>
        </template>
      </div>
      <select id="resource-rate" class="select select-bordered select-sm shrink-0 w-36 sm:w-56 ml-auto" aria-label="Property"
              x-model="rate">
        <option value="">Every property</option>
        <template x-for="[name, n] in rates" :key="name">
          <option :value="name" x-text="name + ' (' + n + ')'"></option>
        </template>
      </select>
    </div>
  </header>

  <main class="min-h-0" :class="listDetail ? 'overflow-hidden' : 'overflow-y-auto'">

   <!-- ── probes and runs: a list with a detail ─────────────────────────
        html-style rule 11, drawn by kits/linked-swiper.js: the list beside
        the card when the pane is wide, over it when narrow, each scrolling
        inside itself. The rows and the cards are built in script
        (probeListHtml, probeCardHtml and the run pair), since the kit fills
        the card itself. data-pattern declares the unit
        (data/ui-units/codebook.md); nothing at runtime reads it. -->
   <div x-show="listDetail" class="h-full p-2" data-pattern="list-detail">
     <div x-show="pane === 'probes'" class="h-full">
       <div x-ref="probeBox" class="h-full">
         <div x-ref="probeList" role="listbox" aria-label="Probes" data-part="list"></div>
         <div x-ref="probeCard" class="min-h-0" data-part="detail"></div>
       </div>
     </div>
     <div x-show="pane === 'runs'" class="h-full">
       <div x-ref="runBox" class="h-full">
         <div x-ref="runList" role="listbox" aria-label="Runs" data-part="list"></div>
         <div x-ref="runCard" class="min-h-0" data-part="detail"></div>
       </div>
     </div>
     <div x-show="pane === 'exemplars'" class="h-full">
       <div x-ref="exemplarBox" class="h-full">
         <div x-ref="exemplarList" role="listbox" aria-label="Exemplars" data-part="list"></div>
         <div x-ref="exemplarCard" class="min-h-0" data-part="detail"></div>
       </div>
     </div>
   </div>

   <div x-show="!listDetail" class="px-4 sm:px-6 py-5 mx-auto"
        :class="pane === 'variants' ? 'max-w-[96rem]' : 'max-w-[72rem]'">

    <div x-show="pane === 'probes' && loading" class="py-24 text-center">
      <span class="loading loading-dots loading-md opacity-60"></span>
    </div>
    <div x-show="error && pane !== 'variants'" class="font-mono text-sm text-error py-6" x-text="error"></div>

    <!-- ── variants ─────────────────────────────────────────────────────
         The collection, one row per variant: text, variant, author,
         purpose, and a chip per file it has been proposed for. It can be
         inspected here; applying one remains a separate decision against a
         current occurrence. -->
    <section x-show="pane === 'variants'">
      <div x-show="variantState === 'idle' || variantState === 'loading'" class="py-24 text-center">
        <span class="loading loading-dots loading-md opacity-60"></span>
      </div>

      <div x-show="variantState === 'error'"
           class="font-mono text-sm text-error py-6 break-words" x-text="variantError"></div>

      <template x-for="g in variantGroups()" :key="g.purpose">
        <section class="mb-10">
          <div class="flex items-end gap-2 border-b border-base-300">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-base-content/50 pb-1 grow flex items-baseline gap-2 min-w-0">
              <span x-text="g.purpose"></span>
              <span class="tabular-nums" x-text="g.all.length"></span>
              <span class="normal-case tracking-normal truncate" x-show="purposeDef(g.purpose)?.gloss"
                    x-text="purposeDef(g.purpose)?.gloss"></span>
            </h2>
            <button class="btn btn-square btn-sm btn-ghost text-primary max-sm:h-10 max-sm:w-10"
                    :aria-label="'Read the ' + g.purpose + ' variants one at a time'"
                    :data-title-tip="'Read the ' + g.all.length.toLocaleString() + ' ' + g.purpose + ' variants one at a time'"
                    @click="openVariantDeck(g.all, 0, g.purpose + ' · ' + (variantAuthor || 'every author'))">
              <i class="ph ph-cards-three text-lg"></i>
            </button>
          </div>

          <!-- Each row IS the pair, drawn by md-diff as the deck and the file
               viewer draw it, so the list reads as a long document of changes
               rather than as previews to open. Rows render as they near the
               viewport, since the collection runs to thousands. -->
          <template x-for="p in g.items" :key="p.id">
            <article class="py-4 border-b border-base-200 scroll-mt-24"
                     :id="'variant-' + p.id"
                     :class="variantOpen === p.id && 'bg-base-200/30'">
              <div class="min-w-0" x-init="lazyPair($el, p)">
                <div class="text-lg leading-7 text-pretty text-base-content/50" x-text="variantPreview(p.from.text, 300)"></div>
              </div>
              <!-- The facts and the acts, under the pair, as in both decks. A
                   proposal chip rides this line too (data-variant-proposals). -->
              <div data-variant-proposals x-init="$el.replaceWith(variantFoot(p, { deckAt: variantPlace(p) }))"></div>
            </article>
          </template>
        </section>
      </template>

      <!-- The end of what is drawn: nearing it draws the next batch. -->
      <div x-show="variantState === 'done' && variantDrawn < variantRows.length" x-init="watchVariantEnd($el)"
           class="py-6 text-center font-mono text-xs text-base-content/70">
        <span x-text="variantDrawn.toLocaleString() + ' of ' + variantRows.length.toLocaleString() + ' drawn'"></span>
        <button type="button" class="btn btn-xs btn-ghost border-base-300 ml-2" @click="variantLimit += VARIANT_BATCH * 5">more</button>
      </div>

      <p x-show="variantState === 'done' && !variantRows.length"
         class="py-16 text-center font-mono text-xs opacity-70">
        no variant carries that combination
      </p>
    </section>

    <!-- ── exemplars, until the pieces are read ──────────────────────────── -->
    <section x-show="pane === 'exemplars'">
      <div x-show="exemplarState === 'idle' || exemplarState === 'loading'" class="py-24 text-center">
        <span class="loading loading-dots loading-md opacity-60"></span>
      </div>
      <div x-show="exemplarState === 'error'" class="font-mono text-sm text-error py-6 break-words" x-text="exemplarError"></div>
      <p x-show="exemplarState === 'done' && !exemplars.length" class="py-16 text-center font-mono text-xs opacity-70">
        no pieces at this ref
      </p>
    </section>

    <!-- ── instruments ────────────────────────────────────────────────── -->
    <section x-show="pane === 'instruments'">
      <div x-show="!guideHtml" class="py-24 text-center">
        <span class="loading loading-dots loading-md opacity-60"></span>
      </div>
      <div :class="guideClass" x-html="guideHtml"></div>
    </section>

    <!-- ── resources ──────────────────────────────────────────────────────
         Grouped by state, so the state word appears once per group instead of
         once per row. That is also why no row carries a coloured bar the way a
         probe does: inside a group every row would wear the same one, and
         colour that repeats a heading is decoration. -->
    <section x-show="pane === 'resources'">
      <div x-show="!resources.length" class="py-24 text-center">
        <span class="loading loading-dots loading-md opacity-60"></span>
      </div>

      <!-- Coverage, before the list. One row per property a word can be rated
           on, one column per state, so the empty cells are as legible as the
           full ones: the absent column read down is the shopping list. Tapping
           a row filters the list below to that property. -->
      <div x-show="resources.length" class="mb-10 overflow-x-auto">
        <table class="font-mono text-xs">
          <thead>
            <tr class="opacity-70">
              <th class="text-left font-normal pb-1 pr-6">property</th>
              <template x-for="s in ['held','fetched','absent']" :key="s">
                <th class="font-normal pb-1 px-3 w-16" x-text="s"></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="row in matrix" :key="row.name">
              <tr class="border-t border-base-200 cursor-pointer hover:bg-base-200"
                  @click="rate = rate === row.name ? '' : row.name">
                <td class="py-1.5 pr-6 whitespace-nowrap"
                    :class="rate === row.name ? 'font-medium' : 'opacity-70'" x-text="row.name"></td>
                <template x-for="s in ['held','fetched','absent']" :key="s">
                  <td class="py-1.5 px-3 text-center tabular-nums"
                      :class="row[s] ? STATES[s].text : 'opacity-60'"
                      x-text="row[s] || '·'"></td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <template x-for="g in resGroups()" :key="g.state">
        <section class="mb-10">
          <h2 class="font-mono text-xs uppercase tracking-wide mb-1" :class="STATES[g.state].text">
            <span x-text="g.state"></span>
            <span class="opacity-70" x-text="g.items.length"></span>
          </h2>

          <template x-for="r in g.items" :key="r.id">
            <article class="border-t border-base-300 py-4">
              <div class="flex items-baseline gap-4">
                <div class="text-lg leading-7 font-medium grow min-w-0" x-text="r.name"></div>
                <div class="font-mono text-xs opacity-70 shrink-0" x-show="!!r.rows" x-text="(+r.rows).toLocaleString() + ' rows'"></div>
                <a class="font-mono text-xs opacity-70 hover:opacity-100 transition-opacity shrink-0"
                   x-show="!!resourceUrl(r.locator)" :href="resourceUrl(r.locator)" target="_blank" rel="noopener">
                  <span x-text="resourceLabel(r.locator)"></span><i class="ph ph-arrow-square-out ml-1"></i>
                </a>
                <span class="font-mono text-xs opacity-70 shrink-0"
                      x-show="!!r.locator && !resourceUrl(r.locator)" x-text="r.locator"></span>
              </div>

              <p class="text-lg leading-7 text-pretty mt-0.5" x-text="r.note"></p>

              <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 font-mono text-xs mt-2">
                <template x-for="p in list(r.rates)" :key="p">
                  <button class="opacity-70 hover:opacity-100 underline decoration-dotted underline-offset-2 transition-opacity"
                          @click="rate = p" x-text="p"></button>
                </template>
                <span class="opacity-70" x-text="list(r.unit).join(', ')"></span>
                <span class="opacity-70" x-show="!!r.source" x-text="r.source"></span>
              </div>
            </article>
          </template>
        </section>
      </template>

      <p x-show="resources.length && !shownResources.length" class="py-16 text-center font-mono text-xs opacity-70">
        no resource carries that combination
      </p>
    </section>

    <!-- ── runs ───────────────────────────────────────────────────────── -->
    <!-- A ref that predates runs/runs.csv: the text collection's runs, then the
         few listed by hand. -->
    <section x-show="pane === 'runs' && !runRows.length">
      <template x-if="textRuns.length">
        <section class="mb-10">
          <h2 class="font-mono text-xs uppercase tracking-wide opacity-70 pb-1 border-b border-base-300">
            text collection<span class="ml-2 tabular-nums" x-text="textRuns.length"></span>
          </h2>
          <template x-for="r in textRuns" :key="r.name">
            <article :id="'run-' + r.name" class="border-b border-base-300 py-5 flex items-start gap-5"
                     :class="r.name === runFocus && 'bg-primary/5'">
              <div class="grow min-w-0">
                <div class="text-lg leading-7 font-medium text-balance" x-text="r.title"></div>
                <div class="mt-1 font-mono text-xs opacity-70 tabular-nums"
                     x-text="r.date + ' · ' + r.files.length + ' files · ' + r.variants.toLocaleString() + ' ' + r.unit"></div>
              </div>
              <div class="flex items-center gap-3 font-mono text-xs shrink-0">
                <a class="opacity-70 hover:opacity-100 transition-opacity"
                   :href="treeUrl(r.dir)" target="_blank" rel="noopener">files<i class="ph ph-arrow-square-out ml-1"></i></a>
                <button class="btn btn-square btn-sm btn-ghost text-primary max-sm:h-11 max-sm:w-11"
                        :aria-label="'Read ' + r.files.length + ' files one at a time'"
                        :data-title-tip="'Read ' + r.files.length + ' files one at a time'"
                        @click="openRunDeck(r)">
                  <i class="ph ph-cards-three text-lg"></i>
                </button>
              </div>
            </article>
          </template>
        </section>
      </template>
      <h2 x-show="textRuns.length" class="font-mono text-xs uppercase tracking-wide opacity-70 pb-1 border-b border-base-300">
        other runs<span class="ml-2 tabular-nums" x-text="RUNS.length"></span>
      </h2>
      <template x-for="r in RUNS" :key="r.dir">
        <article class="border-b border-base-300 py-5 flex items-start gap-5">
          <div class="grow min-w-0">
            <div class="text-lg leading-7 font-medium text-balance" x-text="r.title"></div>
            <div class="text-lg leading-7 text-pretty" x-text="r.line"></div>
            <div class="mt-1 font-mono text-xs opacity-70" x-text="r.date"></div>
          </div>
          <div class="flex flex-col items-end gap-1 font-mono text-xs shrink-0">
            <a class="opacity-70 hover:opacity-100 transition-opacity"
               :href="treeUrl(r.dir)" target="_blank" rel="noopener">files<i class="ph ph-arrow-square-out ml-1"></i></a>
            <a x-show="!!r.page" class="opacity-70 hover:opacity-100 transition-opacity"
               :href="tossUrl(r.page)" target="_blank" rel="noopener">open<i class="ph ph-arrow-square-out ml-1"></i></a>
            <span x-show="!r.page" class="opacity-70">no page</span>
          </div>
        </article>
      </template>
    </section>

   </div>
  </main>

  <!-- The one panel-tip: a variant's details, or its notes and a box to add
       one. Pinned by the click that opens it; panel-tip.js owns the ways out. -->
  <div x-ref="tip" x-show="tip" x-cloak role="dialog" aria-label="Variant"
       class="fixed z-[1000] rounded-xl border border-base-300 bg-base-100 shadow-lg px-4 py-3 text-base leading-6 max-h-[60vh] overflow-y-auto"
       :style="tip ? `left:${tip.x}px;top:${tip.y}px;width:${tip.w}px` : ''">
    <div x-html="tipClose"></div>
    <template x-if="tip && tip.kind === 'info'">
      <div class="pr-6 grid gap-1.5">
        <div><span class="font-medium" x-text="tip.v.purpose"></span><span class="text-base-content/50" x-text="' · ' + tip.v.author"></span></div>
        <p class="text-base-content/70 text-pretty" x-show="purposeDef(tip.v.purpose)?.gloss" x-text="purposeDef(tip.v.purpose)?.gloss"></p>
        <p class="text-base-content/70 text-pretty italic" x-show="purposeDef(tip.v.purpose)?.prompt" x-text="purposeDef(tip.v.purpose)?.prompt"></p>
        <!-- Where the original stands, from home's occurrences snapshot. -->
        <div class="grid gap-0.5 mt-1" x-show="tip.v.at && tip.v.at.length">
          <template x-for="loc in (tip.v.at || [])" :key="loc">
            <a class="link link-hover font-mono text-sm" :href="fileHref(loc)" target="_blank" rel="noopener"
               x-text="shortLoc(loc).replace(/\//g, '/\u200b')"></a>
          </template>
        </div>
        <p class="text-sm text-base-content/50" x-show="tip.v.at && !tip.v.at.length">Not found on main when last scanned.</p>
      </div>
    </template>
    <template x-if="tip && tip.kind === 'note'">
      <div class="grid gap-2 pr-7">
        <template x-for="(n, k) in reviewsOf(tip.v).notes" :key="k">
          <div>
            <span class="text-base-content/50" x-text="n.by + ':'"></span>
            <span class="whitespace-pre-wrap" x-text="n.note"></span>
          </div>
        </template>
        <textarea id="variant-note" class="textarea textarea-bordered w-full text-base leading-6 min-h-0" rows="2"
                  placeholder="Comment" x-model="noteDraft"
                  @keydown.meta.enter="saveNote(tip.v)" @keydown.ctrl.enter="saveNote(tip.v)"></textarea>
        <div class="flex items-center justify-end gap-3">
          <span class="text-sm text-error grow" x-show="reviewError" x-text="reviewError"></span>
          <button class="btn btn-primary btn-sm" :disabled="!noteDraft.trim() || !!reviewBusy" @click="saveNote(tip.v)">
            <span x-show="!reviewBusy">Save</span>
            <span x-show="reviewBusy" class="loading loading-spinner loading-xs"></span>
          </button>
        </div>
      </div>
    </template>
  </div>
</div>

</body>
</html>
