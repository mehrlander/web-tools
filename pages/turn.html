<!DOCTYPE html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turn</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🥏</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  turn.html — one turn of a recorded session: what the owner asked, how the
  reply closed, and every page and document the turn changed, as cards to
  swipe through and write a note on.

  The per-turn counterpart of session.html, and the replacement for the list
  of render links that closed each reply: one link here opens all of them in
  one frame, and a note on any card goes to the estate's notes store, where
  the session reads it (skills/notes).

  Address, fragment preferred and query accepted:

    #id=<short>&turn=<n>[&card=<i>]
    #id=<stem>&at=<ISO instant>      the turn whose window holds the instant

  `turn` is 1-based and is the Turns tab's numbering: turn n is the card
  session.html opens with `card=<n-1>`, labelled "Exchange n". `card` is the
  0-based card to land on, stamped as the reader swipes.

  What the page reads: the record, through session-brief's SessionRecords
  (the same memoized read and store listing session.html uses); the turn's
  window and files, through kits/turn-views.js, from the record alone; and
  for each file one GitHub commits read, for the commit it stood at when the
  turn ended. turn-views.js's header states what the record cannot say.

  Notes: a draft is kept in this browser per session and turn until Send,
  which appends one note per draft through kits/notes.js. Each note is about
  the file on its branch (owner/repo@branch:path, the locator session-brief's
  Views tab gives its selection) and names the session and turn in its text.

  Boot is session.html's: the pre-build, then the kits by name; the ready gate
  is the same promise for the same reason (pages/branch.html has the account).
-->
<script>
  window.__depsReady = new Promise(r => { window.__depsDone = r; });
</script>
<script type="module">
  const bootFailed = (e) => {
    document.body?.removeAttribute('x-cloak');
    const box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'margin:2rem 1rem;padding:1rem 1.25rem;border:1px solid #d9dee3;border-radius:.75rem;'
      + 'background:#fff;font:14px/1.55 system-ui,sans-serif;color:#1f2937';
    box.textContent = 'This page could not start: ' + (e?.message || String(e));
    document.body?.replaceChildren(box);
  };
  try {
    const ref = new URLSearchParams(location.search).get('use');
    if (ref) {
      const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/dist/web-tools.js`, { cache: 'no-store' });
      if (!src.ok) throw new Error(`?use=${ref}: could not fetch the bundle (HTTP ${src.status})`);
      const url = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
      try { await import(url); } finally { URL.revokeObjectURL(url); }
    } else {
      await import('../dist/web-tools.js');
    }
    try {
      for (const k of ['kits/repo-address.js', 'kits/closing-state.js', 'kits/proof.js', 'kits/swipe-deck.js',
                       'kits/chat-render.js', 'kits/session-render.js', 'kits/turn-views.js',
                       'kits/guide-render.js', 'kits/linked-swiper.js', 'kits/title-tip.js']) {
        await gh.load(k);
      }
    } finally { window.__depsDone(); }
  } catch (e) {
    bootFailed(e);
    throw e;
  }
</script>
<style>
  [x-cloak]{display:none!important}
</style>
</head>
<!-- An h-dvh root for a list over a strip (house style rule 5): the page may
     be framed by a toss, so nothing here is fixed. -->
<body class="h-dvh flex flex-col bg-base-100 text-base-content [--fab-bottom:4.5rem]" x-data="turnPage()" x-cloak>

  <div x-show="!want" class="shrink-0 border-b border-base-300 px-4 py-2 flex items-center gap-2">
    <span class="text-lg">&#129359;</span>
    <input x-model="input" @keydown.enter="go()" placeholder="short id and turn, as abc12345 3"
           class="input input-sm input-bordered font-mono flex-1 min-w-0">
    <button @click="go()" class="btn btn-sm btn-primary">Open</button>
  </div>

  <div x-show="err" class="px-4 pt-3"><div class="alert alert-warning" x-text="err"></div></div>

  <div x-show="busy" class="flex justify-center py-16">
    <span class="loading loading-spinner loading-lg text-primary"></span>
  </div>

  <template x-if="turn">
  <div class="flex min-h-0 grow flex-col">

    <!-- THE TURN: where it sits in the session, the ask, the close. -->
    <header class="shrink-0 border-b border-base-300 px-4 pt-2 pb-2.5 flex flex-col gap-1.5" data-at="turn-head">
      <div class="flex items-center gap-1 min-w-0">
        <a :href="sessionUrl" class="flex min-w-0 items-center gap-1.5 hover:text-primary cursor-pointer" data-at="session-link"
           data-title-tip="This turn in the session page">
          <i class="ph ph-chat-circle-text text-lg shrink-0"></i>
          <span class="truncate text-sm font-semibold" x-text="title"></span>
        </a>
        <div class="ml-auto flex shrink-0 items-center">
          <a class="btn btn-xs btn-ghost btn-square" :class="turn.n <= 1 && 'btn-disabled'" :href="turnUrl(turn.n - 1)"
             aria-label="Previous turn" data-title-tip="Previous turn"><i class="ph ph-caret-left"></i></a>
          <span class="px-1 font-mono text-xs tabular-nums text-base-content/60" x-text="'turn ' + turn.n + '/' + turn.total"></span>
          <a class="btn btn-xs btn-ghost btn-square" :class="turn.n >= turn.total && 'btn-disabled'" :href="turnUrl(turn.n + 1)"
             aria-label="Next turn" data-title-tip="Next turn"><i class="ph ph-caret-right"></i></a>
        </div>
      </div>
      <button type="button" @click="askOpen = !askOpen" data-at="ask"
              class="flex items-start gap-2 text-left cursor-pointer hover:text-primary">
        <i class="ph ph-user text-base mt-0.5 shrink-0 text-base-content/50"></i>
        <span class="min-w-0 flex-1 whitespace-pre-wrap [overflow-wrap:anywhere] text-base leading-6"
              :class="askOpen ? 'max-h-[40vh] overflow-y-auto' : 'line-clamp-2'" x-text="ask"></span>
      </button>
      <div x-show="turn.closing" class="flex items-start gap-2 text-base leading-6" data-at="closing">
        <span class="shrink-0" x-text="turn.closing?.glyph"></span>
        <span class="min-w-0 flex-1 line-clamp-2 [overflow-wrap:anywhere] [&_a]:link" x-html="closingHtml"></span>
      </div>
    </header>

    <div x-show="!turn.files.length" class="px-4 py-8 text-base text-base-content/60" data-at="empty">
      <span>No page or document changed in this turn</span><span x-show="otherCount" x-text="' · ' + plural(otherCount, 'other file')"></span>
    </div>

    <!-- THE CARDS: the files over a strip, one card per file (rule 11). -->
    <div x-show="turn.files.length" class="flex min-h-0 grow flex-col px-2 pt-2">
      <div x-ref="root" class="min-h-0 grow">
        <div x-ref="list" role="listbox" aria-label="Pages and documents this turn changed" data-at="files"></div>
        <div x-ref="card" data-at="card"></div>
      </div>
    </div>

    <!-- THE NOTE, on the card in view: one line and a check, as the look kit's
         dock has it; drafts wait here until Send. -->
    <footer x-show="turn.files.length" class="shrink-0 border-t border-base-300 px-3 py-2 flex flex-col gap-1.5" data-at="composer">
      <div x-show="cardDrafts.length || cardSent.length" class="flex max-h-24 flex-col gap-1.5 overflow-y-auto">
      <template x-for="d in cardDrafts" :key="d.id">
        <div class="flex items-start gap-2 rounded-lg bg-info/10 py-1 pl-2 pr-1 text-base">
          <i class="ph ph-chat-circle-text mt-0.5 opacity-60"></i>
          <span class="min-w-0 flex-1 whitespace-pre-wrap [overflow-wrap:anywhere]" x-text="d.text"></span>
          <button type="button" class="btn btn-ghost btn-xs btn-square" @click="drop(d.id)" aria-label="Remove this note"><i class="ph ph-x"></i></button>
        </div>
      </template>
      <template x-for="s in cardSent" :key="s.id">
        <div class="flex items-start gap-2 rounded-lg bg-success/10 py-1 px-2 text-base">
          <i class="ph ph-check-circle mt-0.5 text-success"></i>
          <span class="min-w-0 flex-1 line-clamp-2 [overflow-wrap:anywhere]" x-text="s.text.split('\n\n')[0]"></span>
          <span class="shrink-0 font-mono text-xs text-base-content/50" x-text="s.at.slice(5, 10)"></span>
        </div>
      </template>
      </div>
      <div class="flex items-center gap-2">
        <input x-ref="field" x-model="typing" @keydown.enter.prevent="add()" @keydown.stop
               :placeholder="'Note on ' + (current ? current.name : 'this card')" aria-label="A note on the card in view"
               class="input input-sm input-bordered min-w-0 flex-1 text-base">
        <button type="button" @click="add()" aria-label="Add the note"
                class="btn btn-sm btn-square" :class="typing.trim() ? 'btn-success' : 'btn-ghost opacity-40'"><i class="ph ph-check"></i></button>
        <button type="button" @click="send()" :disabled="sending || !drafts.length" data-at="send"
                class="btn btn-sm btn-primary min-w-20 tabular-nums">
          <span x-show="sending" class="loading loading-spinner loading-xs"></span>
          <span x-text="drafts.length ? 'Send ' + drafts.length : 'Send'"></span>
        </button>
      </div>
      <div x-show="status" class="text-xs text-base-content/70" role="status" x-text="status"></div>
    </footer>
  </div>
  </template>

<script>
  const STORE = 'mehrlander/web-tools-private';
  const SITE = 'https://mehrlander.github.io/web-tools/';

  document.addEventListener('alpine:init', () => {
    Alpine.data('turnPage', () => ({
      input: '', want: null, busy: false, err: '', askOpen: false,
      record: null, turn: null, path: '', views: [], at: 0, typing: '', drafts: [], sent: [], sending: false, status: '',
      _swiper: null,

      async init() {
        await window.__depsReady;
        this.want = this.address();
        if (!this.want) return;
        this.input = this.want.id + (this.want.n ? ' ' + this.want.n : '');
        await this.open();
      },

      // Read through URLSearchParams: inside a toss, the renderer's shim
      // patches get() and leaves location.search empty (session.html's note).
      address() {
        const q = new URLSearchParams(location.search);
        const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
        const pick = k => h.get(k) || q.get(k);
        const id = (pick('id') || '').trim();
        const n = parseInt(pick('turn'), 10);
        const at = (pick('at') || '').trim();
        if (!id || !(n >= 1 || at)) return null;
        const card = parseInt(pick('card'), 10);
        return { id, n: n >= 1 ? n : 0, at, card: card >= 0 ? card : 0 };
      },

      go() {
        const [id, n] = String(this.input || '').trim().split(/\s+/);
        if (!id || !(parseInt(n, 10) >= 1)) { this.err = 'Give the short id, a space, and the turn number.'; return; }
        location.hash = 'id=' + encodeURIComponent(id) + '&turn=' + parseInt(n, 10);
        location.reload();
      },

      async open() {
        this.busy = true; this.err = '';
        try {
          const SR = window.SessionRecords;
          if (!SR) throw new Error('session-brief did not load, so no record reader is here');
          this.path = await SR.pathOf(this.want.id, STORE);
          if (!this.path) throw new Error('No record for ' + this.want.id + ' in ' + STORE + '.');
          const rec = await SR.read(STORE, this.path);
          this.record = rec;
          if (!this.want.n) this.want.n = window.TurnViews.at(rec, this.want.at);
          const t = window.TurnViews.of(rec, this.want.n);
          if (!t) throw new Error('Session ' + this.want.id + ' has ' + window.TurnViews.count(rec) + ' turns; there is no turn ' + this.want.n + '.');
          this.turn = t;
          this.drafts = this.loadDrafts();
          this.views = t.files.map((f) => ({ ...f, name: f.path.split('/').pop(), ref: '', pin: '', url: '' }));
          this.at = Math.min(this.want.card, Math.max(0, this.views.length - 1));
          document.title = 'Turn ' + t.n + ' · ' + this.short;
          this.$nextTick(() => this.mount());
          this.resolveRefs();
          this.loadSent();
        } catch (e) {
          this.err = e?.message || String(e);
        } finally { this.busy = false; }
      },

      get short() { return String(this.record?.short || this.want?.id || '').slice(0, 8); },
      get owner() { return STORE.split('/')[0]; },
      get title() {
        const r = this.record || {};
        return (r.repos || []).map((x) => x.name).filter(Boolean).slice(0, 2).join(', ') + ' · ' + this.short
          + (this.turn?.from ? ' · ' + this.turn.from.slice(5, 16).replace('T', ' ') : '');
      },
      get ask() {
        // A wake's prompt is the harness's envelope; its first line names it.
        return String(this.turn?.ask || '').replace(/^\s*<[^>]+>\s*/, '').trim() || '(no prompt captured)';
      },
      get closingHtml() {
        const s = window.esc(String(this.turn?.closing?.text || ''));
        return s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      },
      get sessionUrl() { return SITE + 'pages/session.html#id=' + this.short + '&pane=turns&card=' + ((this.turn?.n || 1) - 1); },
      turnUrl(n) { return '#id=' + this.short + '&turn=' + n; },
      get otherCount() { return (this.turn?.other || []).length; },
      plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); },
      get current() { return this.views[this.at] || null; },
      get cardDrafts() { const v = this.current; return v ? this.drafts.filter((d) => d.key === v.key) : []; },
      get cardSent() { const v = this.current; return v ? this.sent.filter((s) => s.about === this.aboutOf(v)) : []; },

      // ── Each file's commit at the turn's end ─────────────────────────────
      // The last commit on the branch touching the path before the next turn
      // opened. One that predates this turn means the edit was not committed
      // by then, and the card shows the branch as it is now.
      async resolveRefs() {
        const confs = new Map();
        await Promise.all(this.views.map(async (v) => {
          const slug = this.owner + '/' + v.repo;
          const g = new window.GH({ token: window.TOKEN, repo: slug, ref: v.branch || 'main' });
          const q = 'commits?per_page=1&path=' + encodeURIComponent(v.path)
            + (this.turn.to ? '&until=' + encodeURIComponent(this.turn.to) : '');
          let c = null, ref = v.branch || 'main';
          try { c = (await g.req(q + '&sha=' + encodeURIComponent(ref)))?.[0]; }
          catch { ref = 'main'; c = (await g.req(q + '&sha=main').catch(() => null))?.[0]; }
          const when = c?.commit?.committer?.date || '';
          if (c && when >= this.turn.from.slice(0, 19)) { v.ref = c.sha; v.pin = c.sha.slice(0, 7); }
          else { v.ref = ref; v.pin = ref === 'main' ? 'main' : 'head'; }
          if (!confs.has(slug)) confs.set(slug, g.get('.web-tools.json').then((r) => JSON.parse(r.text)).catch(() => null));
          const conf = await confs.get(slug);
          v.url = v.kind === 'page'
            ? ((window.GuideRender?.pageTargets?.(slug, v.ref, [v.path], conf?.showing) || [])[0]?.url || '')
            : SITE + 'pages/data-view.html?src=' + slug + '@' + v.ref + ':' + v.path;
          this._swiper?.mount();
          if (this.$refs.list) this.$refs.list.innerHTML = this.rows();
          window.linkedSwiper?.mark(this.$refs.list, 'view', this.current?.key);
        }));
      },

      // ── The list over the strip ──────────────────────────────────────────
      rows() {
        const esc = window.esc;
        return this.views.map((v) => {
          const n = this.drafts.filter((d) => d.key === v.key).length;
          const dir = v.path.includes('/') ? v.path.slice(0, v.path.lastIndexOf('/') + 1) : '';
          return '<div data-view="' + esc(v.key) + '" role="option" tabindex="-1" class="flex cursor-pointer items-center gap-2 border-b border-base-200 px-3 py-1.5 last:border-0 hover:bg-base-200/60 aria-selected:bg-primary/10">'
            + '<i class="ph ' + (v.kind === 'page' ? 'ph-browser' : 'ph-file-text') + ' shrink-0 text-base text-base-content/50"></i>'
            + '<span class="min-w-0 flex-1 truncate text-sm"><span class="text-base-content/50">' + esc(dir) + '</span>' + esc(v.name) + '</span>'
            + (n ? '<span class="badge badge-info badge-sm shrink-0 gap-1"><i class="ph ph-chat-circle-text"></i>' + n + '</span>' : '')
            // The commit shows in the card's head; a row speaks only when its
            // card is not the file as the turn left it.
            + (v.pin === 'head' || v.pin === 'main' ? '<span class="shrink-0 font-mono text-xs text-warning">now</span>' : '')
            + '</div>';
        }).join('');
      },
      mount() {
        const root = this.$refs.root, list = this.$refs.list, card = this.$refs.card;
        if (!root || !this.views.length || !window.linkedSwiper) return;
        list.innerHTML = this.rows();
        this._swiper = window.linkedSwiper.attach({
          root, list, card, key: 'view', noun: 'card', listMax: 'max-h-[22vh]',
          ids: () => this.views.map((v) => v.key),
          sel: () => this.current?.key,
          head: ({ i, n, tight }) => this.head(i, n, tight),
          body: (id, el) => this.body(id, el),
          innerClass: 'h-full w-full', slidePad: 'p-0',
          onPick: (id) => {
            const i = this.views.findIndex((v) => v.key === id);
            if (i >= 0) { this.at = i; this.stamp(); }
          },
          deck: () => this.deck(),
        });
      },
      head(i, n, tight) {
        const v = this.views[i], esc = window.esc;
        if (!v) return '';
        const link = (href, icon, tip) => href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener" class="btn btn-xs btn-ghost btn-square"'
          + ' data-title-tip="' + esc(tip) + '" aria-label="' + esc(tip) + '"><i class="ph ' + icon + ' text-base"></i></a>' : '';
        return window.linkedSwiper.head({ code: v.pin === 'head' || v.pin === 'main' ? 'now' : v.pin, title: v.path.split('/').slice(-2).join('/') }, i, n, 'card', { deck: true, tight })
          + link(window.RepoAddress.github.blob(this.owner + '/' + v.repo, v.ref || v.branch || 'main', v.path), 'ph-github-logo', 'On GitHub')
          + link(v.url, 'ph-arrow-square-out', 'Open in a new tab');
      },
      body(id, el) {
        const v = this.views.find((x) => x.key === id);
        if (!v) return '';
        if (!v.url) { el.innerHTML = '<div class="flex h-full items-start justify-center pt-12"><span class="loading loading-dots loading-md opacity-40"></span></div>'; return; }
        const f = document.createElement('iframe');
        f.src = v.url;
        f.className = 'block h-full w-full border-0 bg-base-100';
        f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms');
        f.setAttribute('aria-label', v.path);
        el.replaceChildren(f);
      },
      // The cards full screen, the swipe deck's takeover; closing returns to
      // the strip at the card last read (rule 11).
      deck() {
        if (!window.swipeDeck) return;
        const host = this, list = this.views;
        let h = null;
        h = window.swipeDeck.open({
          count: list.length, start: this.at, innerClass: 'h-full w-full min-w-0',
          index: (i) => ({ title: list[i].path.split('/').slice(-2).join('/'), subtitle: list[i].pin,
                           icon: list[i].kind === 'page' ? 'ph-browser' : 'ph-file-text' }),
          icon: 'ph-cards-three', title: list[this.at].name, subtitle: 'turn ' + this.turn.n + ' · ' + this.short,
          onSlide: (i) => { h?.setTitle?.(list[i].name); host.at = i; host._swiper?.show(list[i].key); host.stamp(); },
          render: (i, slide) => host.body(list[i].key, slide),
        });
      },
      stamp() {
        if (!/^https?:$/.test(location.protocol)) return;
        const h = new URLSearchParams(location.hash.replace(/^#/, ''));
        h.set('card', String(this.at));
        history.replaceState(history.state, '', '#' + h.toString());
      },

      // ── Notes ────────────────────────────────────────────────────────────
      draftKey() { return 'turn-notes:' + this.short + ':' + this.turn.n; },
      loadDrafts() { try { return JSON.parse(localStorage.getItem(this.draftKey()) || '[]'); } catch { return []; } },
      keep() {
        try { localStorage.setItem(this.draftKey(), JSON.stringify(this.drafts)); this.status = ''; }
        catch { this.status = 'This browser would not keep the note; Send before leaving.'; }
        if (this.$refs.list) { this.$refs.list.innerHTML = this.rows(); window.linkedSwiper?.mark(this.$refs.list, 'view', this.current?.key); }
      },
      add() {
        const text = this.typing.trim(), v = this.current;
        if (!text || !v) { this.$refs.field?.focus(); return; }
        this.drafts = [...this.drafts, { id: 'd' + Date.now().toString(36), key: v.key, text, at: new Date().toISOString() }];
        this.typing = '';
        this.keep();
      },
      drop(id) { this.drafts = this.drafts.filter((d) => d.id !== id); this.keep(); },
      aboutOf(v) { return this.owner + '/' + v.repo + (v.branch ? '@' + v.branch : '') + ':' + v.path; },
      where(v) {
        const i = this.views.indexOf(v);
        return 'Written on turn ' + this.turn.n + ' of session ' + this.short + ' (' + STORE + ':' + this.path + ')'
          + ', card ' + (i + 1) + ' of ' + this.views.length + (v.pin ? ', at ' + v.pin : '') + '.';
      },
      async notesApi() {
        if (!window.TOKEN) throw new Error('no GitHub token is saved in this browser');
        if (!window.GH.toBase64) await gh.load('gh-store.js');
        if (!window.Notes) await gh.load('kits/notes.js');
        return new window.GH({ token: window.TOKEN, repo: STORE, ref: 'main' });
      },
      // The notes this turn already sent, found by the turn's own words in
      // their text, so a card shows what it was told.
      async loadSent() {
        try {
          const reg = await this.notesApi();
          const tag = 'turn ' + this.turn.n + ' of session ' + this.short + ' ';
          this.sent = (await window.Notes.load(reg)).filter((n) => String(n.text).includes(tag));
        } catch { this.sent = []; }
      },
      async send() {
        if (this.sending || !this.drafts.length) return;
        this.sending = true; this.status = 'Sending…';
        try {
          const reg = await this.notesApi();
          const author = await window.Notes.author(reg);
          const list = this.drafts.slice();
          const notes = list.map((d) => {
            const v = this.views.find((x) => x.key === d.key);
            return window.Notes.make({ about: this.aboutOf(v), author, text: d.text + '\n\n' + this.where(v) });
          });
          const all = await window.Notes.append(reg, notes);
          this.drafts = this.drafts.filter((d) => !list.some((x) => x.id === d.id));
          this.keep();
          const ids = new Set(notes.map((n) => n.id));
          this.sent = [...this.sent, ...all.filter((n) => ids.has(n.id))];
          this.status = 'Sent ' + this.plural(list.length, 'note') + '.';
        } catch (e) {
          this.status = 'Not sent: ' + (e?.message || String(e));
        } finally { this.sending = false; }
      },
    }));
  });
</script>
