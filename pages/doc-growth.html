<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doc Growth</title>
<!-- Gapminder-style animated bubble chart of a repo's markdown over time: every
     file is a bubble whose area is its words, x is its edits to date and y is
     the sessions that opened it to date, so the cloud drifts right as files are
     edited and up as they are read. Data comes from python/doc-growth.py as one
     JSON payload and python/doc-reads.py as the session counts; see
     docs/doc-growth.md.

     Colors are the dataviz reference palette. A bubble chart is scored on the
     ALL-PAIRS pairlist, where only three categorical slots clear the floors, so
     three groups carry hue at a time and the rest fold into a recessive "Other"
     gray. The light-mode aqua slot sits under 3:1, which obliges relief: the
     table view and the always-on tooltip are it. -->

<meta name="shot-query" content="src=self">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/alpinejs@3/dist/cdn.min.js,npm/@phosphor-icons/web,npm/fflate/umd/index.js" defer></script>
<script src="../lib/kits/doc-growth.js"></script>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
</head>
<body class="min-h-screen bg-base-200" x-data="growth()" x-init="boot()">

<div class="max-w-6xl mx-auto p-3 sm:p-5 space-y-3">

  <!-- header -->
  <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
    <h1 class="text-xl sm:text-2xl font-semibold">Doc Growth</h1>
    <span class="text-sm opacity-60" x-text="data ? data.repo : ''"></span>
    <span class="text-sm opacity-40" x-show="data"
          x-text="data ? `${data.files.length} files · ${data.frames.length} weeks` + (data.reads ? '' : ' · no session counts') : ''"></span>
    <div class="grow"></div>
    <div class="join" x-show="data">
      <button class="join-item btn btn-xs" :class="view==='chart' && 'btn-active'" @click="setView('chart')">
        <i class="ph ph-chart-scatter"></i>Chart</button>
      <button class="join-item btn btn-xs" :class="view==='table' && 'btn-active'" @click="setView('table')">
        <i class="ph ph-table"></i>Table</button>
    </div>
  </div>

  <div x-show="err" x-cloak class="alert alert-warning text-sm" x-text="err"></div>
  <div x-show="!data && !err" class="card bg-base-100 shadow-sm">
    <div class="card-body items-center py-16 gap-3">
      <span class="loading loading-dots loading-lg text-primary"></span>
      <p class="text-sm opacity-60">Reading the history…</p>
    </div>
  </div>

  <!-- chart -->
  <div x-show="data && view==='chart'" class="card bg-base-100 shadow-sm">
    <div class="card-body p-2 sm:p-4 gap-3">

      <div class="relative">
        <canvas x-ref="cv" class="w-full block rounded-lg touch-none"
                style="height:clamp(360px,58vh,620px)"
                @pointermove="hover($event)" @pointerleave="hovered = null"
                @pointerdown="pick($event)"></canvas>
        <div x-show="visible === 0" x-cloak
             class="pointer-events-none absolute inset-0 grid place-content-center">
          <p class="text-sm opacity-50">No file this size existed yet.</p>
        </div>
        <div x-show="hovered" x-cloak
             class="pointer-events-none absolute z-10 rounded-md bg-neutral text-neutral-content
                    text-xs px-2 py-1.5 shadow-lg max-w-[16rem]"
             :style="`left:${tipX}px; top:${tipY}px`">
          <div class="font-mono break-all" x-text="hovered?.p"></div>
          <div class="opacity-70 mt-0.5" x-text="tipMeta"></div>
        </div>
      </div>

      <!-- transport -->
      <div class="flex items-center gap-2">
        <button class="btn btn-sm btn-primary btn-circle" @click="toggle()">
          <i class="ph" :class="playing ? 'ph-pause' : 'ph-play'"></i>
        </button>
        <input type="range" class="range range-xs range-primary grow" min="0"
               :max="(data?.frames.length ?? 1) - 1" step="0.01"
               x-model.number="t" @input="playing = false; draw()">
        <span class="text-xs font-mono opacity-60 w-20 text-right" x-text="frameLabel"></span>
      </div>

      <!-- controls -->
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <span class="opacity-60">area: words</span>
        <label class="label cursor-pointer gap-1.5 py-0">
          <input type="checkbox" class="checkbox checkbox-xs" x-model="trails" @change="draw()">
          <span class="opacity-60">trails</span>
        </label>
      </div>

      <!-- legend: three hue slots, everything else recessive -->
      <div class="flex flex-wrap gap-1.5">
        <template x-for="g in data?.groups ?? []" :key="g">
          <button class="badge badge-sm gap-1 cursor-pointer"
                  :class="slot(g) < 0 && 'badge-ghost opacity-50'"
                  :style="slot(g) >= 0 ? `background:${HUE[slot(g)]};border-color:${HUE[slot(g)]};color:#fff` : ''"
                  @click="toggleGroup(g)" x-text="g"></button>
        </template>
      </div>

    </div>
  </div>

  <!-- table view: the relief the light-mode contrast warn obliges -->
  <div x-show="data && view==='table'" class="card bg-base-100 shadow-sm">
    <div class="card-body p-2 sm:p-4">
      <div class="overflow-x-auto">
        <table class="table table-xs table-pin-rows">
          <thead><tr>
            <th>File</th><th>Group</th><th class="text-right">Words</th>
            <th class="text-right">Edits</th><th class="text-right">Opened</th>
          </tr></thead>
          <tbody>
            <template x-for="r in tableRows" :key="r.p">
              <tr>
                <td class="font-mono text-[11px] break-all" x-text="r.p"></td>
                <td class="opacity-60" x-text="r.g"></td>
                <td class="text-right tabular-nums" x-text="r.w.toLocaleString()"></td>
                <td class="text-right tabular-nums" x-text="r.e"></td>
                <td class="text-right tabular-nums font-medium" x-text="data.reads ? r.o : ''"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<style type="text/tailwindcss">[x-cloak]{display:none}</style>

<script>
// The chart and its arithmetic are kits/doc-growth.js, which the Map's Docs →
// Growth tab draws with too; this page holds the state and the controls.
function growth() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  return {
    HUE: dark ? DocGrowth.DARK : DocGrowth.LIGHT,
    data: null, err: '', t: 0, playing: false, raf: 0, trails: true,
    picked: null, hovered: null, tipX: 0, tipY: 0, view: 'chart',
    visible: 0, groups: [], _pts: [],

    async boot() {
      const q = new URLSearchParams(location.search);
      let data;
      try {
        [data, this.reads] = await Promise.all([loadPayload(q), loadReads(q)]);
      } catch (e) {
        this.err = `Could not load data: ${e.message}`;
        return;
      }
      this.data = DocGrowth.join(data, this.reads?.repos?.[data.repo] || null, this.reads?.from);
      this.groups = DocGrowth.groups(this.data);
      if (q.get('view') === 'table') this.view = 'table';
      this.t = this.data.frames.length - 1;
      addEventListener('resize', () => this.draw());
      this.$nextTick(() => this.draw());
    },

    setView(v) { this.view = v; if (v === 'chart') this.$nextTick(() => this.draw()); },
    slot(g) { return this.groups.indexOf(g); },
    toggleGroup(g) {
      const i = this.groups.indexOf(g);
      if (i >= 0) this.groups.splice(i, 1);
      else { this.groups.push(g); if (this.groups.length > 3) this.groups.shift(); }
      this.draw();
    },

    get frameLabel() { return this.data?.frames[Math.round(this.t)] ?? ''; },
    get tipMeta() {
      const f = this.hovered; if (!f) return '';
      const k = Math.round(this.t);
      return `${(f.w[k] ?? 0).toLocaleString()} words · ${f.ec[k]} edits${this.data.reads ? ` · opened in ${f.o[k]} sessions` : ''} · ${this.data.groups[f.g]}`;
    },
    get tableRows() { return this.data ? DocGrowth.rank(this.data) : []; },

    toggle() {
      this.playing = !this.playing;
      cancelAnimationFrame(this.raf);
      if (!this.playing) return;
      if (this.t >= this.data.frames.length - 1) this.t = 0;
      let prev = performance.now();
      const tick = (now) => {
        this.t = Math.min(this.data.frames.length - 1, this.t + (now - prev) / 1000 * 4);
        prev = now;
        this.draw();
        if (this.t >= this.data.frames.length - 1) { this.playing = false; return; }
        this.raf = requestAnimationFrame(tick);
      };
      this.raf = requestAnimationFrame(tick);
    },

    draw() {
      if (!this.data || !this.$refs.cv) return;
      this._pts = DocGrowth.draw(this.$refs.cv, this.data, {
        t: this.t, groups: this.groups, picked: this.picked, hovered: this.hovered, trails: this.trails });
      this.visible = this._pts.length;
    },
    nearest(ev) {
      const r = this.$refs.cv.getBoundingClientRect();
      return DocGrowth.nearest(this._pts, ev.clientX - r.left, ev.clientY - r.top);
    },
    hover(ev) {
      const p = this.nearest(ev);
      this.hovered = p?.f ?? null;
      if (p) {
        const r = this.$refs.cv.getBoundingClientRect();
        this.tipX = Math.min(p.x + 10, r.width - 200);
        this.tipY = Math.max(4, p.y - 46);
      }
    },
    pick(ev) {
      const p = this.nearest(ev);
      this.picked = p && p.f !== this.picked ? p.f : null;
      this.draw();
    },
  };
}

// The viewer's stored GitHub token, the one place this page reads it: this page
// boots without the library, so window.ghAuth is not there to ask.
function savedToken() {
  try { return localStorage.getItem('ghToken') || ''; } catch { return ''; }
}

// Three ways in, cheapest first: an inline payload, a plain URL, or a repo path
// read through the viewer's stored token (the only route that reaches a private
// repo, and the reason a fresh browser may need one pasted in first).
async function loadPayload(q) {
  const gz = new URLSearchParams(location.hash.slice(1)).get('gz');
  if (gz) {
    const bin = atob(gz.replace(/-/g, '+').replace(/_/g, '/'));
    const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(fflate.gunzipSync(bytes)));
  }
  if (q.get('url')) return (await fetch(q.get('url'))).json();

  const src = q.get('src');
  if (!src || src === 'self') {
    const r = await fetch('../data/doc-growth/web-tools.json');
    if (!r.ok) throw new Error(`web-tools.json (HTTP ${r.status})`);
    return r.json();
  }
  return readRepoJson(src);
}

// One JSON file from `owner/repo[@ref]:path`, through the stored token when
// there is one.
async function readRepoJson(src) {
  const [repoRef, path] = src.split(':');
  // No @ref: the selection's ref for that file (a renderer stamps
  // __refFor), else main.
  const [repo, named] = repoRef.split('@');
  const ref = named || (window.__refFor && window.__refFor(repo, path)) || 'main';
  const token = savedToken();
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${ref}`, {
    headers: { Accept: 'application/vnd.github.raw', ...(token && { Authorization: `Bearer ${token}` }) },
  });
  if (!r.ok) throw new Error(`${src} (HTTP ${r.status}${r.status === 404 && !token ? ', no stored token' : ''})`);
  // The raw media type is a request, not a guarantee: anything that does not
  // honor it answers with the contents envelope instead, and the payload is
  // then base64 inside `content` rather than the body. Both shapes are normal.
  const d = await r.json();
  if (d && d.content && d.encoding === 'base64') {
    const bin = atob(String(d.content).replace(/\s/g, ''));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
  }
  return d;
}

// The session counts the y axis reads: `?reads=owner/repo[@ref]:path`, else
// the private registry's at main, through the viewer's stored token. Any
// failure is null, and every file sits at zero up the chart.
async function loadReads(q) {
  if (!savedToken()) return null;
  return readRepoJson(q.get('reads') || 'mehrlander/web-tools-private@background:state/doc-reads.json').catch(() => null);
}
</script>

<script>
// A dead Alpine is otherwise silent: x-show leaves everything visible, x-text
// leaves everything empty, and the result looks like a page mid-load forever.
addEventListener('load', () => setTimeout(() => {
  if (window.Alpine) return;
  document.body.innerHTML =
    '<div class="max-w-xl mx-auto p-6 text-sm">' +
    '<h1 class="text-lg font-semibold mb-2">Doc Growth could not start</h1>' +
    '<p class="opacity-70">Alpine.js did not load, so nothing on this page is wired up. ' +
    'Usually the CDN bundle was blocked or served the wrong build.</p></div>';
}, 3000));
</script>
</body>
</html>
