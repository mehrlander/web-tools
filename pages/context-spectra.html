<!doctype html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Spectra — Web Tools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎯</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
<script defer src="https://unpkg.com/alpinejs"></script>

<!--
  context-spectra.html — The architecture of context delivery across three spectra:
  Scope (where it lives), Discretion (who decides), and Triggers (the moment it fires).
  Built to the HTML house style (skills/html-style/SKILL.md): no stat cards, no prose,
  no reading-column caps, full viewport grid layout, one semantic accent per concern.
-->
<style>
  [x-cloak] { display: none !important; }
  .grid-matrix {
    display: grid;
    grid-template-columns: minmax(130px, 160px) repeat(4, minmax(210px, 1fr));
  }
  .card-node {
    transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .card-node:hover {
    border-color: var(--color-primary);
  }
</style>
</head>
<body class="bg-base-200 min-h-dvh flex flex-col text-base-content antialiased" x-data="spectra()" x-init="boot()">

  <!-- ── Top Chrome / Header ─────────────────────────────────────────────── -->
  <header class="bg-base-100 border-b border-base-300 px-4 sm:px-6 py-2.5 shrink-0 flex flex-wrap items-center justify-between gap-y-2 gap-x-4">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <i class="ph-bold ph-circles-three text-xl text-primary"></i>
        <h1 class="text-base sm:text-lg font-bold tracking-tight">Context Spectra</h1>
      </div>
      <span class="text-base-content/30">/</span>
      <!-- Compact Counts Strip (No stat cards, per House Style Rule 1 & Rule 2) -->
      <div class="flex items-center gap-2 text-xs font-mono text-base-content/60">
        <span x-text="visible.length + ' mechanisms'"></span>
        <span>·</span>
        <span x-text="scopes.length + ' scopes'"></span>
        <span>·</span>
        <span x-text="discretions.length + ' tiers'"></span>
        <span>·</span>
        <span x-text="triggers.length + ' triggers'"></span>
      </div>
    </div>

    <!-- Controls: Lenses & Environment -->
    <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
      <!-- Lens Switcher -->
      <div class="flex items-center p-0.5 rounded-lg bg-base-200 border border-base-300 text-xs font-medium">
        <button type="button" @click="lens = 'matrix'" class="px-2.5 py-1 rounded-md transition-colors flex items-center gap-1.5"
                :class="lens === 'matrix' ? 'bg-base-100 text-primary shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          <i class="ph ph-squares-four"></i><span>Matrix</span>
        </button>
        <button type="button" @click="lens = 'scales'" class="px-2.5 py-1 rounded-md transition-colors flex items-center gap-1.5"
                :class="lens === 'scales' ? 'bg-base-100 text-primary shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          <i class="ph ph-sliders"></i><span>Spectra</span>
        </button>
        <button type="button" @click="lens = 'table'" class="px-2.5 py-1 rounded-md transition-colors flex items-center gap-1.5"
                :class="lens === 'table' ? 'bg-base-100 text-primary shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          <i class="ph ph-table"></i><span>Registry</span>
        </button>
      </div>

      <!-- Environment Filter -->
      <div class="flex items-center p-0.5 rounded-lg bg-base-200 border border-base-300 text-xs">
        <button type="button" @click="env = 'all'" class="px-2 py-1 rounded-md transition-colors"
                :class="env === 'all' ? 'bg-base-100 text-primary shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          All <span class="opacity-60 text-[10px]" x-text="mechanisms.length"></span>
        </button>
        <button type="button" @click="env = 'claude'" class="px-2 py-1 rounded-md transition-colors"
                :class="env === 'claude' ? 'bg-base-100 text-warning shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          Claude <span class="opacity-60 text-[10px]" x-text="countEnv('claude')"></span>
        </button>
        <button type="button" @click="env = 'gemini'" class="px-2 py-1 rounded-md transition-colors"
                :class="env === 'gemini' ? 'bg-base-100 text-info shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          Gemini <span class="opacity-60 text-[10px]" x-text="countEnv('gemini')"></span>
        </button>
      </div>

      <a href="../app/?view=map&tab=context" class="btn btn-xs btn-ghost gap-1 text-base-content/70 hover:text-primary">
        <span>Map Context</span><i class="ph ph-arrow-square-out"></i>
      </a>
    </div>
  </header>

  <!-- ── Main Workspace ──────────────────────────────────────────────────── -->
  <main class="grow flex flex-col lg:flex-row overflow-hidden">

    <!-- Primary Canvas (Full width, no reading column cap) -->
    <div class="grow overflow-auto p-4 sm:p-5">

      <!-- ── LENS 1: Matrix (Scope vs. Discretion) ────────────────────────── -->
      <div x-show="lens === 'matrix'" class="flex flex-col gap-4">
        <div class="overflow-x-auto border border-base-300 rounded-xl bg-base-100 shadow-xs">
          <div class="grid-matrix min-w-[960px] divide-x divide-y divide-base-300">

            <!-- Top Header Row: Corner + Scope Columns -->
            <div class="p-3 bg-base-200/60 flex items-center justify-between text-xs font-semibold uppercase tracking-wider text-base-content/60">
              <span>Discretion \ Scope</span>
            </div>
            <template x-for="s in scopes" :key="s.id">
              <div class="p-3 bg-base-200/60 flex flex-col gap-0.5">
                <span class="text-xs font-semibold uppercase tracking-wider text-base-content" x-text="s.label"></span>
                <span class="text-[11px] text-base-content/50" x-text="s.gloss"></span>
              </div>
            </template>

            <!-- Matrix Rows: Each Discretion Tier -->
            <template x-for="d in discretions" :key="d.id">
              <div class="contents">
                <!-- Row Header: Discretion Tier -->
                <div class="p-3.5 bg-base-200/30 flex flex-col justify-start gap-1">
                  <span class="text-xs font-bold text-base-content" x-text="d.label"></span>
                  <span class="text-[11px] text-base-content/50 leading-relaxed" x-text="d.gloss"></span>
                  <span class="badge badge-sm font-mono text-[10px] mt-1" :class="d.badgeClass" x-text="d.cost"></span>
                </div>

                <!-- 4 Scope Cells for this Discretion Tier -->
                <template x-for="s in scopes" :key="s.id">
                  <div class="p-2.5 flex flex-col gap-2 min-h-[110px]"
                       :class="hasItems(s.id, d.id) ? 'bg-base-100' : 'bg-base-200/10'">
                    
                    <template x-for="m in cellItems(s.id, d.id)" :key="m.id">
                      <div class="card-node border rounded-lg p-2.5 bg-base-100 cursor-pointer shadow-xs select-none"
                           :class="selectedId === m.id ? 'border-primary ring-2 ring-primary/20 bg-primary/5' : 'border-base-300'"
                           @click="select(m.id)">
                        <div class="flex items-start justify-between gap-1.5">
                          <div class="flex items-center gap-1.5 min-w-0">
                            <span class="text-base" x-text="m.icon"></span>
                            <span class="font-semibold text-xs truncate" x-text="m.title"></span>
                          </div>
                          <span class="badge badge-xs font-mono shrink-0" :class="envBadge(m.env)" x-text="m.env.toUpperCase()"></span>
                        </div>

                        <div class="mt-2 flex items-center justify-between gap-1 text-[11px] text-base-content/55 font-mono">
                          <span class="truncate flex items-center gap-1">
                            <i class="ph" :class="triggerIcon(m.trigger)"></i><span x-text="m.trigger"></span>
                          </span>
                          <span class="shrink-0 font-medium" :class="m.evidence === '●' ? 'text-success' : 'text-base-content/40'" x-text="m.evidence"></span>
                        </div>
                      </div>
                    </template>

                    <div x-show="!hasItems(s.id, d.id)" class="grow flex items-center justify-center">
                      <span class="text-[11px] text-base-content/20 font-mono">—</span>
                    </div>

                  </div>
                </template>
              </div>
            </template>

          </div>
        </div>
      </div>

      <!-- ── LENS 2: Parallel Spectra Scales ──────────────────────────────── -->
      <div x-show="lens === 'scales'" class="flex flex-col gap-6" x-cloak>
        <template x-for="sc in spectraAxes" :key="sc.id">
          <div class="border border-base-300 rounded-xl bg-base-100 p-4 sm:p-5 flex flex-col gap-3 shadow-xs">
            <div class="flex items-baseline justify-between">
              <div>
                <h3 class="font-bold text-sm tracking-wide uppercase" x-text="sc.title"></h3>
                <p class="text-xs text-base-content/60" x-text="sc.question"></p>
              </div>
              <span class="text-xs font-mono text-base-content/40" x-text="sc.poleLeft + ' ➔ ' + sc.poleRight"></span>
            </div>

            <!-- The Scale Track -->
            <div class="relative py-4 border-t border-base-200">
              <div class="h-2 rounded-full bg-base-200 w-full relative">
                <!-- Scale Stops -->
                <div class="absolute inset-0 flex justify-between items-center px-2">
                  <template x-for="st in sc.stops" :key="st">
                    <span class="w-1.5 h-1.5 rounded-full bg-base-300"></span>
                  </template>
                </div>
              </div>

              <!-- Markers for each mechanism -->
              <div class="relative w-full h-8 mt-1">
                <template x-for="m in visible" :key="m.id">
                  <button type="button" @click="select(m.id)"
                          class="absolute -translate-x-1/2 top-0 px-2 py-0.5 rounded-md border text-xs font-medium transition-all shadow-xs flex items-center gap-1"
                          :style="'left:' + scalePosition(sc.id, m) + '%;'"
                          :class="selectedId === m.id ? 'border-primary bg-primary text-primary-content z-20 scale-105' : 'border-base-300 bg-base-100 text-base-content/75 hover:border-primary/50 z-10'">
                    <span x-text="m.icon"></span>
                    <span class="hidden sm:inline font-mono text-[10px]" x-text="m.short"></span>
                  </button>
                </template>
              </div>

              <!-- Stop Labels -->
              <div class="flex justify-between text-[11px] font-mono text-base-content/50 pt-1">
                <template x-for="st in sc.stops" :key="st">
                  <span x-text="st"></span>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- ── LENS 3: Registry Table ──────────────────────────────────────── -->
      <div x-show="lens === 'table'" class="border border-base-300 rounded-xl bg-base-100 overflow-x-auto shadow-xs" x-cloak>
        <table class="table table-sm w-full text-left">
          <thead class="bg-base-200/60 text-xs text-base-content/70 uppercase">
            <tr>
              <th>Mechanism</th>
              <th>Env</th>
              <th>Scope (Boundary)</th>
              <th>Discretion Tier</th>
              <th>Trigger (When)</th>
              <th>Proof</th>
              <th>Token Footprint</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-base-200 text-xs">
            <template x-for="m in visible" :key="m.id">
              <tr class="hover:bg-base-200/40 cursor-pointer transition-colors"
                  :class="selectedId === m.id ? 'bg-primary/5 font-semibold text-primary' : ''"
                  @click="select(m.id)">
                <td class="font-medium flex items-center gap-2">
                  <span x-text="m.icon"></span>
                  <span x-text="m.title"></span>
                </td>
                <td>
                  <span class="badge badge-xs font-mono" :class="envBadge(m.env)" x-text="m.env.toUpperCase()"></span>
                </td>
                <td class="font-mono text-base-content/70" x-text="m.scopeLabel"></td>
                <td x-text="m.discretionLabel"></td>
                <td class="font-mono text-base-content/70 flex items-center gap-1">
                  <i class="ph" :class="triggerIcon(m.trigger)"></i><span x-text="m.trigger"></span>
                </td>
                <td class="font-mono" :class="m.evidence === '●' ? 'text-success' : 'text-base-content/40'" x-text="m.evidence"></td>
                <td class="text-base-content/60" x-text="m.tokenCost"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

    </div>

    <!-- ── Right-Side Inspector Rail ──────────────────────────────────────── -->
    <aside class="w-full lg:w-80 lg:shrink-0 border-t lg:border-t-0 lg:border-l border-base-300 bg-base-100 p-4 sm:p-5 flex flex-col gap-4 overflow-y-auto">
      <div class="flex items-baseline justify-between border-b border-base-300 pb-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-base-content/60">Inspector</span>
        <span class="badge badge-xs font-mono" :class="envBadge(active.env)" x-text="active.env.toUpperCase()"></span>
      </div>

      <!-- Selected Mechanism Card -->
      <div class="flex flex-col gap-3">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl p-2 rounded-xl bg-base-200 border border-base-300" x-text="active.icon"></span>
          <div class="min-w-0">
            <h2 class="font-bold text-base leading-tight" x-text="active.title"></h2>
            <code class="text-[11px] text-base-content/50 font-mono break-all" x-text="active.file"></code>
          </div>
        </div>

        <p class="text-xs text-base-content/75 leading-relaxed text-pretty" x-text="active.gloss"></p>
      </div>

      <!-- Coordinates on the 3 Spectra -->
      <div class="flex flex-col gap-2 pt-3 border-t border-base-200">
        <span class="text-[11px] font-bold uppercase tracking-wider text-base-content/50">Spectra Coordinates</span>

        <div class="bg-base-200/50 p-2.5 rounded-lg border border-base-300 flex flex-col gap-0.5">
          <span class="text-[10px] text-base-content/50 uppercase font-mono">1. Scope Boundary</span>
          <span class="text-xs font-semibold" x-text="active.scopeLabel"></span>
          <span class="text-[11px] text-base-content/60" x-text="active.scopeGloss"></span>
        </div>

        <div class="bg-base-200/50 p-2.5 rounded-lg border border-base-300 flex flex-col gap-0.5">
          <span class="text-[10px] text-base-content/50 uppercase font-mono">2. Discretion Tier</span>
          <span class="text-xs font-semibold" x-text="active.discretionLabel"></span>
          <span class="text-[11px] text-base-content/60" x-text="active.discretionGloss"></span>
        </div>

        <div class="bg-base-200/50 p-2.5 rounded-lg border border-base-300 flex flex-col gap-0.5">
          <span class="text-[10px] text-base-content/50 uppercase font-mono">3. Lifecycle Trigger</span>
          <span class="text-xs font-semibold" x-text="active.trigger"></span>
          <span class="text-[11px] text-base-content/60" x-text="active.triggerGloss"></span>
        </div>
      </div>

      <!-- Architecture Rationale & Trade-offs -->
      <div class="flex flex-col gap-1.5 pt-3 border-t border-base-200 text-xs">
        <span class="text-[11px] font-bold uppercase tracking-wider text-base-content/50">Architectural Rationale</span>
        <p class="text-base-content/80 leading-relaxed text-pretty" x-text="active.rationale"></p>
      </div>

      <div class="flex flex-col gap-1 pt-2 text-xs">
        <span class="text-[11px] font-bold uppercase tracking-wider text-base-content/50">Token Footprint</span>
        <p class="text-base-content/80 font-mono text-[11px]" x-text="active.tokenCost"></p>
      </div>
    </aside>

  </main>

<script>
function spectra() {
  return {
    env: 'all',
    lens: 'matrix',
    selectedId: 'invoke-default',

    scopes: [
      { id: 'universal', label: 'Universal', gloss: 'Every session under account' },
      { id: 'host-plugin', label: 'Host / Plugin', gloss: 'Shared tools and ecosystem' },
      { id: 'repo', label: 'Repo-Specific', gloss: 'Checked-out codebase' },
      { id: 'task-turn', label: 'Task / Turn', gloss: 'Active conversation step' }
    ],

    discretions: [
      { id: 'injected', label: 'Forced Injected', gloss: 'Platform mandatory, zero choice', cost: 'Highest token burden', badgeClass: 'badge-error' },
      { id: 'reactive', label: 'Event-Reactive', gloss: 'Idles until condition met', cost: 'Zero idle cost', badgeClass: 'badge-warning' },
      { id: 'prodded', label: 'System-Prodded', gloss: 'Hook advises, model accepts', cost: '1-line directive', badgeClass: 'badge-info' },
      { id: 'pulled', label: 'User / Model Pulled', gloss: 'Explicit on-demand invocation', cost: 'Targeted pay-on-use', badgeClass: 'badge-success' }
    ],

    triggers: ['Daemon / Build', 'Session Start', 'Event Juncture', 'Per Turn', 'On Demand'],

    spectraAxes: [
      {
        id: 'scope',
        title: 'Scope Spectrum',
        question: 'What boundary does this context govern?',
        poleLeft: 'Universal (Global)',
        poleRight: 'Ephemeral (Turn)',
        stops: ['Universal', 'Host / Plugin', 'Repo-Bound', 'Task / Turn']
      },
      {
        id: 'discretion',
        title: 'Discretion Spectrum',
        question: 'Who decides to load the material into context?',
        poleLeft: 'Platform Mandatory',
        poleRight: 'Autonomous Choice',
        stops: ['Forced Injected', 'Event-Reactive', 'System-Prodded', 'User / Model Pulled']
      },
      {
        id: 'trigger',
        title: 'Lifecycle Trigger Spectrum',
        question: 'At what point in execution does the payload arrive?',
        poleLeft: 'Build / Boot',
        poleRight: 'On Demand',
        stops: ['Daemon / Build', 'Session Start', 'Event Juncture', 'Per Turn', 'On Demand']
      }
    ],

    mechanisms: [
      {
        id: "sys-prompt",
        title: "Personal Preferences & Preamble",
        short: "Prefs",
        env: "claude",
        icon: "👤",
        file: "claude.ai/settings/preferences",
        scopeId: "universal",
        scopeLabel: "Universal (Account)",
        scopeGloss: "Injected into every single prompt across all repositories.",
        discretionId: "injected",
        discretionLabel: "Forced Injected",
        discretionGloss: "Zero model discretion: baked into system prompt preamble.",
        trigger: "Session Start",
        triggerGloss: "Present from turn 1 before any user interaction.",
        evidence: "●",
        tokenCost: "~150 tokens every turn",
        gloss: "User-wide directives and core identity instructions.",
        rationale: "Ensures base persona and formatting rules hold universally without needing per-repo configuration."
      },
      {
        id: "skill-manifest",
        title: "Plugin Skill Listing",
        short: "Manifest",
        env: "claude",
        icon: "📋",
        file: "skills/manifest.csv",
        scopeId: "universal",
        scopeLabel: "Universal (Ecosystem)",
        scopeGloss: "Reaches every session where the portable plugin is installed.",
        discretionId: "injected",
        discretionLabel: "Forced Injected",
        discretionGloss: "Short descriptions are mandatory so model knows tools exist.",
        trigger: "Session Start",
        triggerGloss: "Injected during plugin session initialization.",
        evidence: "●",
        tokenCost: "1 line per skill (~25 tokens)",
        gloss: "Concise 1-line stubs defining available skills.",
        rationale: "Provides awareness without payload. The agent knows a tool exists without paying for full instructions upfront."
      },
      {
        id: "antigravity-state",
        title: "Antigravity Host State",
        short: "AGYState",
        env: "gemini",
        icon: "⚡",
        file: "~/.gemini/antigravity/antigravity_state.pbtxt",
        scopeId: "universal",
        scopeLabel: "Universal (Host Machine)",
        scopeGloss: "Governs all Antigravity agent interactions on this workstation.",
        discretionId: "injected",
        discretionLabel: "Forced Injected",
        discretionGloss: "Supplied automatically by the language_server daemon.",
        trigger: "Daemon / Build",
        triggerGloss: "Established when language_server_windows_x64.exe boots.",
        evidence: "●",
        tokenCost: "Engine internal",
        gloss: "Machine installation UUID, loopback RPC port, and host config.",
        rationale: "Establishes device identity and isolates the desktop GUI from headless background workers."
      },
      {
        id: "event-guards",
        title: "Safety & Quality Guards",
        short: "Guards",
        env: "claude",
        icon: "🛡️",
        file: "skills/hooks/*-guard.sh",
        scopeId: "host-plugin",
        scopeLabel: "Host / Plugin",
        scopeGloss: "Enforced across all checkouts adopting the plugin.",
        discretionId: "reactive",
        discretionLabel: "Event-Reactive",
        discretionGloss: "Fires only when an edit or commit touches guarded invariants.",
        trigger: "Event Juncture",
        triggerGloss: "Executes immediately on PreToolUse or commit-msg.",
        evidence: "●",
        tokenCost: "0 idle tokens; ~60 tokens only when triggered",
        gloss: "reading-column-guard, send-later-guard, and governing-docs warner.",
        rationale: "Zero idle context cost. Sits completely dormant until an edit or commit violates a known failure pattern."
      },
      {
        id: "invoke-default",
        title: "Conventions Directive",
        short: "invoke-default",
        env: "claude",
        icon: "🧭",
        file: "skills/hooks/invoke-default.sh",
        scopeId: "host-plugin",
        scopeLabel: "Host / Plugin",
        scopeGloss: "Universal delivery prod across the estate.",
        discretionId: "prodded",
        discretionLabel: "System-Prodded",
        discretionGloss: "Hook prints a directive; model executes /portable:default.",
        trigger: "Session Start",
        triggerGloss: "Fires at session startup and again after compaction.",
        evidence: "●",
        tokenCost: "1 directive line until invoked",
        gloss: "Dynamic prod to load SURFACING.md and QUALIFIED-WRITING.md.",
        rationale: "Replaces static monolithic imports with a verified load directive, preventing stale cached doctrine."
      },
      {
        id: "pr-course",
        title: "Surfacing Course",
        short: "PRCourse",
        env: "claude",
        icon: "🚀",
        file: "skills/default/surfacing-course.md",
        scopeId: "repo",
        scopeLabel: "Repo / PR Context",
        scopeGloss: "Tied to pull request branch lifecycle.",
        discretionId: "reactive",
        discretionLabel: "Event-Reactive",
        discretionGloss: "Idles until pr-subscribe-hint detects an open pull request.",
        trigger: "Event Juncture",
        triggerGloss: "Delivered at the exact moment a PR is opened.",
        evidence: "●",
        tokenCost: "0 tokens before PR; ~1,200 tokens once opened",
        gloss: "Step-by-step guide for PR description and review upkeep.",
        rationale: "Eliminates premature cognitive load by keeping review procedures dormant until work is actually published."
      },
      {
        id: "repo-claude",
        title: "Repository Contract",
        short: "CLAUDE.md",
        env: "claude",
        icon: "📖",
        file: "CLAUDE.md",
        scopeId: "repo",
        scopeLabel: "Repo-Specific",
        scopeGloss: "Bounded strictly to this git checkout.",
        discretionId: "prodded",
        discretionLabel: "System-Prodded",
        discretionGloss: "Platform loads it automatically when checkout is root.",
        trigger: "Session Start",
        triggerGloss: "Loaded at session start or directory navigation.",
        evidence: "●",
        tokenCost: "Varies by repo (~1,500 - 3,000 tokens)",
        gloss: "Repository-specific build commands, test suites, and invariants.",
        rationale: "Prototypical repo level: keeps repo-specific tooling isolated so commands never bleed into other projects."
      },
      {
        id: "slash-commands",
        title: "Interactive Slash Utilities",
        short: "SlashUtils",
        env: "claude",
        icon: "⚡",
        file: "scripts/showing.py, skills/tasks/",
        scopeId: "task-turn",
        scopeLabel: "Task / Session",
        scopeGloss: "Scoped to the immediate task at hand.",
        discretionId: "pulled",
        discretionLabel: "User / Model Pulled",
        discretionGloss: "User explicitly types /markers, /showing, or /plan.",
        trigger: "On Demand",
        triggerGloss: "Runs only upon human command entry.",
        evidence: "●",
        tokenCost: "0 idle; output only appears upon execution",
        gloss: "Advisory tools for showing links, frozen zones, and goals.",
        rationale: "High discretion: specialized utilities run only when the operator explicitly requests verification or planning."
      },
      {
        id: "antigravity-skills",
        title: "Antigravity Domain Skills",
        short: "AGYSkills",
        env: "gemini",
        icon: "🧠",
        file: "~/.gemini/antigravity/builtin/skills/*",
        scopeId: "task-turn",
        scopeLabel: "Task / Domain",
        scopeGloss: "Specialized knowledge packs.",
        discretionId: "pulled",
        discretionLabel: "User / Model Pulled",
        discretionGloss: "Model autonomously reads SKILL.md when domain is triggered.",
        trigger: "On Demand",
        triggerGloss: "Loaded via view_file upon task relevance.",
        evidence: "●",
        tokenCost: "0 idle; ~1,000 - 4,000 tokens when consulted",
        gloss: "Deep skills (BigQuery, GCS basics, Chrome DevTools, Generative UI).",
        rationale: "Heaviest documentation is kept in local disk folders, leaving 100% of context free until needed."
      },
      {
        id: "agent-tools",
        title: "Autonomous File & Search Tools",
        short: "FileTools",
        env: "all",
        icon: "🔍",
        file: "view_file, grep, run_command",
        scopeId: "task-turn",
        scopeLabel: "File / Symbol",
        scopeGloss: "Targeted to specific files and lines.",
        discretionId: "pulled",
        discretionLabel: "User / Model Pulled",
        discretionGloss: "Model exercises real-time autonomous agency.",
        trigger: "Per Turn",
        triggerGloss: "Dispatched dynamically during tool-calling steps.",
        evidence: "●",
        tokenCost: "Exact byte cost of lines requested",
        gloss: "Read tools, search commands, and trajectory records.",
        rationale: "Maximum flexibility: agent pulls only the exact character ranges needed to solve the specific request."
      }
    ],

    get visible() {
      if (this.env === 'all') return this.mechanisms;
      return this.mechanisms.filter(m => m.env === 'all' || m.env === this.env);
    },

    get active() {
      return this.mechanisms.find(m => m.id === this.selectedId) || this.visible[0] || this.mechanisms[0];
    },

    countEnv(e) {
      return this.mechanisms.filter(m => m.env === e || m.env === 'all').length;
    },

    cellItems(scopeId, discretionId) {
      return this.visible.filter(m => m.scopeId === scopeId && m.discretionId === discretionId);
    },

    hasItems(scopeId, discretionId) {
      return this.cellItems(scopeId, discretionId).length > 0;
    },

    select(id) {
      this.selectedId = id;
    },

    envBadge(env) {
      if (env === 'gemini') return 'badge-info';
      if (env === 'claude') return 'badge-warning';
      return 'badge-primary';
    },

    triggerIcon(trig) {
      if (trig.includes('Daemon')) return 'ph-terminal';
      if (trig.includes('Start')) return 'ph-play';
      if (trig.includes('Event')) return 'ph-bell';
      if (trig.includes('Turn')) return 'ph-arrows-clockwise';
      return 'ph-hand-pointing';
    },

    scalePosition(axisId, m) {
      if (axisId === 'scope') {
        const map = { universal: 10, 'host-plugin': 38, repo: 68, 'task-turn': 92 };
        return map[m.scopeId] || 50;
      }
      if (axisId === 'discretion') {
        const map = { injected: 10, reactive: 38, prodded: 66, pulled: 92 };
        return map[m.discretionId] || 50;
      }
      if (axisId === 'trigger') {
        if (m.trigger.includes('Daemon')) return 8;
        if (m.trigger.includes('Start')) return 28;
        if (m.trigger.includes('Event')) return 52;
        if (m.trigger.includes('Turn')) return 74;
        return 92;
      }
      return 50;
    },

    boot() {
      if (!this.visible.some(m => m.id === this.selectedId)) {
        this.selectedId = this.visible[0]?.id || 'invoke-default';
      }
    }
  };
}
