<!doctype html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Delivery — Web Tools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2'><circle cx='12' cy='12' r='10'/><circle cx='12' cy='12' r='6'/><circle cx='12' cy='12' r='2'/></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
<script defer src="https://unpkg.com/alpinejs"></script>

<!--
  context-spectra.html — The architecture of context delivery:
  Scope (where it lives), Discretion (who decides), and Triggers (the moment it fires).
  Built to the HTML house style (skills/html-style/SKILL.md): no stat cards, no prose,
  no reading-column caps, full viewport grid layout, one semantic accent per concern.
-->
<style>
  [x-cloak] { display: none !important; }
  .grid-matrix {
    display: grid;
    grid-template-columns: minmax(75px, 95px) repeat(4, minmax(115px, 1fr));
  }
</style>
</head>
<body class="bg-base-200 min-h-dvh flex flex-col text-base-content antialiased" x-data="spectra()" x-init="boot()">

  <!-- ── Top Chrome / Header ─────────────────────────────────────────────── -->
  <header class="bg-base-100 border-b border-base-300 px-3 sm:px-5 py-2 shrink-0 flex flex-wrap items-center justify-between gap-y-2 gap-x-4">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <i class="ph-bold ph-tray text-lg text-primary"></i>
        <h1 class="text-sm sm:text-base font-bold tracking-tight">Context Delivery</h1>
      </div>
      <span class="text-base-content/30">/</span>
      <!-- Compact Counts Strip (House Style Rule 1 & Rule 2: structural counts, no KPI cards) -->
      <div class="flex items-center gap-2 text-xs font-mono text-base-content/60">
        <span x-text="visible.length + ' mechanisms'"></span>
        <span>·</span>
        <span x-text="scopes.length + ' scopes'"></span>
        <span>·</span>
        <span x-text="discretions.length + ' tiers'"></span>
        <span>·</span>
        <span x-text="triggers.length + ' triggers'"></span>
      </div>
    </div>

    <!-- Controls: Estate & Discretion Filters -->
    <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
      <!-- Estate Filter -->
      <div class="flex items-center p-0.5 rounded-md bg-base-200 border border-base-300 text-xs">
        <button type="button" @click="env = 'all'" class="px-2 py-0.5 rounded transition-colors flex items-center gap-1"
                :class="env === 'all' ? 'bg-base-100 text-primary shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          <span>All</span> <span class="opacity-60 text-[10px]" x-text="mechanisms.length"></span>
        </button>
        <button type="button" @click="env = 'claude'" class="px-2 py-0.5 rounded transition-colors flex items-center gap-1"
                :class="env === 'claude' ? 'bg-base-100 text-warning shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          <span class="inline-flex items-center" x-html="assistantIcon('claude', 'w-3 h-3')"></span>
          <span class="hidden sm:inline">Claude</span> <span class="opacity-60 text-[10px]" x-text="countEnv('claude')"></span>
        </button>
        <button type="button" @click="env = 'gemini'" class="px-2 py-0.5 rounded transition-colors flex items-center gap-1"
                :class="env === 'gemini' ? 'bg-base-100 text-info shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          <span class="inline-flex items-center" x-html="assistantIcon('gemini', 'w-3 h-3')"></span>
          <span class="hidden sm:inline">Gemini</span> <span class="opacity-60 text-[10px]" x-text="countEnv('gemini')"></span>
        </button>
        <button type="button" @click="env = 'chatgpt'" class="px-2 py-0.5 rounded transition-colors flex items-center gap-1"
                :class="env === 'chatgpt' ? 'bg-base-100 text-success shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          <span class="inline-flex items-center" x-html="assistantIcon('chatgpt', 'w-3 h-3')"></span>
          <span class="hidden sm:inline">ChatGPT</span> <span class="opacity-60 text-[10px]" x-text="countEnv('chatgpt')"></span>
        </button>
      </div>

      <!-- Discretion Filter -->
      <div class="flex items-center p-0.5 rounded-md bg-base-200 border border-base-300 text-xs">
        <button type="button" @click="filterDiscretion = ''" class="px-2 py-0.5 rounded transition-colors"
                :class="!filterDiscretion ? 'bg-base-100 text-primary shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
          All Tiers
        </button>
        <template x-for="d in discretions" :key="d.id">
          <button type="button" @click="filterDiscretion = (filterDiscretion === d.id ? '' : d.id)"
                  class="px-2 py-0.5 rounded transition-colors"
                  :class="filterDiscretion === d.id ? 'bg-base-100 text-primary shadow-xs font-semibold' : 'text-base-content/60 hover:text-base-content'">
            <span x-text="d.short"></span>
          </button>
        </template>
      </div>

      <a href="../app/?view=map&tab=context&ctxlens=delivery" class="btn btn-xs btn-ghost gap-1 text-base-content/70 hover:text-primary">
        <span>Map Context</span><i class="ph ph-arrow-square-out"></i>
      </a>
    </div>
  </header>

  <!-- ── Main Workspace: Compact Matrix (Top) + Spectra Barometer (Bottom) ─ -->
  <main class="grow overflow-auto p-2 sm:p-3 flex flex-col gap-2.5">

    <!-- 1. Top Section: Ultra-Compact Scope x Discretion Matrix -->
    <div class="overflow-x-auto border border-base-300 rounded-md bg-base-100 shadow-xs">
      <div class="grid-matrix min-w-[540px] sm:min-w-[680px] divide-x divide-y divide-base-300">

        <!-- Top Header Row -->
        <div class="px-2 py-1.5 bg-base-200/60 flex items-center justify-between text-xs font-semibold uppercase tracking-wider text-base-content/50" title="Discretion vs Scope Matrix">
          <span class="truncate text-[10px] sm:text-xs">Discr. \ Scope</span>
        </div>
        <template x-for="s in scopes" :key="s.id">
          <div class="px-2 py-1.5 bg-base-200/60 flex items-center justify-between min-w-0" :title="s.label + ': ' + s.gloss">
            <span class="text-xs font-bold uppercase tracking-wider text-base-content truncate" x-text="s.label"></span>
          </div>
        </template>

        <!-- Discretion Rows (Ultra-Compact) -->
        <template x-for="d in filteredDiscretions" :key="d.id">
          <div class="contents">
            <!-- Row Header -->
            <div class="px-2 py-1.5 bg-base-200/30 flex items-center justify-between gap-1 min-w-0" :title="d.label + ': ' + d.gloss + ' (' + d.cost + ')'">
              <span class="text-xs font-bold text-base-content truncate" x-text="d.short"></span>
              <span class="w-1.5 h-1.5 rounded-full shrink-0" :class="d.dotClass"></span>
            </div>

            <!-- 4 Scope Cells (Compact single-line chips) -->
            <template x-for="s in scopes" :key="s.id">
              <div class="p-1 flex flex-col gap-1 min-h-[30px]"
                   :class="hasItems(s.id, d.id) ? 'bg-base-100' : 'bg-base-200/10'">
                
                <template x-for="m in cellItems(s.id, d.id)" :key="m.id">
                  <button type="button" @click="select(m.id)"
                          class="w-full text-left flex items-center justify-between gap-1 px-1.5 py-0.5 rounded border text-xs transition-all cursor-pointer min-w-0"
                          :class="selectedId === m.id ? 'border-primary bg-primary/10 text-primary font-semibold shadow-xs ring-1 ring-primary' : 'border-base-300 bg-base-100 hover:border-primary/50 text-base-content/85'"
                          :title="m.title + ' (' + assistantLabel(m.env) + ') — ' + m.gloss">
                    <div class="flex items-center gap-1 min-w-0 truncate">
                      <i class="ph text-xs shrink-0 text-base-content/60" :class="m.icon"></i>
                      <span class="truncate text-[11px]" x-text="m.title"></span>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                      <i class="ph text-base-content/40 text-[10px]" :class="triggerIcon(m.trigger)" :title="m.trigger"></i>
                      <span class="shrink-0 flex items-center" :title="assistantLabel(m.env)" x-html="assistantIcon(m.env, 'w-3 h-3')"></span>
                    </div>
                  </button>
                </template>

                <div x-show="!hasItems(s.id, d.id)" class="grow flex items-center justify-center">
                  <span class="text-[10px] text-base-content/20 font-mono">—</span>
                </div>

              </div>
            </template>
          </div>
        </template>

      </div>
    </div>

    <!-- 2. Bottom Section: Spectra Barometer & Detailed Inspector -->
    <div class="border border-base-300 rounded-md p-2.5 sm:p-3 bg-base-100 flex flex-col gap-2.5 shadow-xs">
      <!-- Selected Mechanism Header -->
      <div class="flex items-baseline justify-between flex-wrap gap-2 border-b border-base-300 pb-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="p-1 rounded-md bg-base-200 border border-base-300 flex items-center justify-center shrink-0 w-7 h-7">
            <i class="ph text-base text-primary" :class="active.icon"></i>
          </div>
          <div class="min-w-0">
            <div class="flex items-baseline gap-1.5 flex-wrap">
              <h2 class="font-bold text-sm sm:text-base leading-tight" x-text="active.title"></h2>
              <div class="flex items-center gap-1 px-1.5 py-0.5 rounded bg-base-200 border border-base-300 text-[10px] font-mono">
                <span class="inline-flex items-center" x-html="assistantIcon(active.env, 'w-3 h-3')"></span>
                <span x-text="assistantLabel(active.env)"></span>
              </div>
            </div>
            <code class="text-[10px] text-base-content/50 font-mono break-all" x-text="active.file"></code>
          </div>
        </div>
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="badge badge-xs sm:badge-sm font-mono text-[9px] sm:text-[10px]" :class="activeDiscretionBadge()" x-text="active.discretionLabel"></span>
          <span class="badge badge-xs sm:badge-sm badge-ghost font-mono text-[9px] sm:text-[10px]" x-text="'Footprint: ' + active.tokenCost"></span>
        </div>
      </div>

      <!-- Gloss Description -->
      <p class="text-xs text-base-content/75 leading-relaxed" x-text="active.gloss"></p>

      <!-- Spectra Barometer: Interactive 3-Axis Gauges -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 pt-0.5">
        <!-- 1. Scope Gauge -->
        <div class="bg-base-200/50 p-2 rounded-md border border-base-300 flex flex-col gap-1">
          <div class="flex items-baseline justify-between text-[11px]">
            <span class="font-semibold uppercase tracking-wider text-base-content/60">1. Scope</span>
            <span class="font-mono text-primary font-bold text-xs" x-text="active.scopeLabel"></span>
          </div>
          <div class="relative py-1">
            <div class="h-1.5 rounded-full bg-base-300 w-full relative">
              <div class="absolute -top-1 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-primary ring-2 ring-primary/20 shadow-xs transition-all duration-200"
                   :style="'left:' + scalePosition('scope', active) + '%;'"></div>
            </div>
          </div>
          <div class="flex justify-between text-[9px] font-mono text-base-content/40 pt-0.5">
            <span>Universal</span>
            <span>Plugin</span>
            <span>Repo</span>
            <span>Turn</span>
          </div>
          <p class="text-[10px] text-base-content/65 leading-tight mt-0.5" x-text="active.scopeGloss"></p>
        </div>

        <!-- 2. Discretion Gauge -->
        <div class="bg-base-200/50 p-2.5 rounded-md border border-base-300 flex flex-col gap-1.5">
          <div class="flex items-baseline justify-between text-[11px]">
            <span class="font-semibold uppercase tracking-wider text-base-content/60">2. Discretion</span>
            <span class="font-mono text-primary font-bold text-xs" x-text="active.discretionLabel"></span>
          </div>
          <div class="relative py-1">
            <div class="h-1.5 rounded-full bg-base-300 w-full relative">
              <div class="absolute -top-1 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-primary ring-2 ring-primary/20 shadow-xs transition-all duration-200"
                   :style="'left:' + scalePosition('discretion', active) + '%;'"></div>
            </div>
          </div>
          <div class="flex justify-between text-[9px] font-mono text-base-content/40 pt-0.5">
            <span>Injected</span>
            <span>Prodded</span>
            <span>Reactive</span>
            <span>Pulled</span>
          </div>
          <p class="text-[10px] text-base-content/65 leading-tight mt-0.5" x-text="active.discretionGloss"></p>
        </div>

        <!-- 3. Lifecycle Trigger Gauge -->
        <div class="bg-base-200/50 p-2.5 rounded-md border border-base-300 flex flex-col gap-1.5">
          <div class="flex items-baseline justify-between text-[11px]">
            <span class="font-semibold uppercase tracking-wider text-base-content/60">3. Trigger</span>
            <span class="font-mono text-primary font-bold text-xs" x-text="active.trigger"></span>
          </div>
          <div class="relative py-1">
            <div class="h-1.5 rounded-full bg-base-300 w-full relative">
              <div class="absolute -top-1 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-primary ring-2 ring-primary/20 shadow-xs transition-all duration-200"
                   :style="'left:' + scalePosition('trigger', active) + '%;'"></div>
            </div>
          </div>
          <div class="flex justify-between text-[9px] font-mono text-base-content/40 pt-0.5">
            <span>Build</span>
            <span>Start</span>
            <span>Event</span>
            <span>Turn</span>
            <span>Demand</span>
          </div>
          <p class="text-[10px] text-base-content/65 leading-tight mt-0.5" x-text="active.triggerGloss"></p>
        </div>
      </div>

      <!-- Bottom Details: Architectural Rationale & Token Economics -->
      <div class="grid grid-cols-1 md:grid-cols-[1fr_16rem] gap-3 pt-2 border-t border-base-200 text-xs">
        <div class="flex flex-col gap-0.5">
          <span class="text-[10px] font-bold uppercase tracking-wider text-base-content/50">Architectural Rationale</span>
          <p class="text-base-content/80 leading-relaxed text-pretty text-[11px]" x-text="active.rationale"></p>
        </div>
        <div class="flex flex-col gap-0.5">
          <span class="text-[10px] font-bold uppercase tracking-wider text-base-content/50">Token Footprint & Idle Cost</span>
          <p class="text-base-content/80 font-mono text-[11px]" x-text="active.tokenCost"></p>
        </div>
      </div>
    </div>

  </main>

<script>
function spectra() {
  return {
    env: 'all',
    filterDiscretion: '',
    selectedId: 'invoke-default',

    scopes: [
      { id: 'universal', label: 'Universal', gloss: 'Every session under account / machine' },
      { id: 'host-plugin', label: 'Host / Plugin', gloss: 'Shared tools and ecosystem' },
      { id: 'repo', label: 'Repo-Specific', gloss: 'Checked-out codebase / PR' },
      { id: 'task-turn', label: 'Task / Turn', gloss: 'Active conversation step / symbol' }
    ],

    discretions: [
      { id: 'injected', label: 'Forced Injected', short: 'Injected', gloss: 'Platform mandatory, zero choice', cost: 'Highest token burden', badgeClass: 'badge-error', dotClass: 'bg-error' },
      { id: 'prodded', label: 'System-Prodded', short: 'Prodded', gloss: 'Hook advises, model accepts', cost: '1-line directive', badgeClass: 'badge-info', dotClass: 'bg-info' },
      { id: 'reactive', label: 'Event-Reactive', short: 'Reactive', gloss: 'Idles until condition met', cost: 'Zero idle cost', badgeClass: 'badge-warning', dotClass: 'bg-warning' },
      { id: 'pulled', label: 'User / Model Pulled', short: 'Pulled', gloss: 'Explicit on-demand invocation', cost: 'Targeted pay-on-use', badgeClass: 'badge-success', dotClass: 'bg-success' }
    ],

    triggers: ['Daemon / Build', 'Session Start', 'Event Juncture', 'Per Turn', 'On Demand'],

    mechanisms: [
      {
        id: "chatgpt-custom",
        title: "Custom Instructions & Memory",
        short: "Custom Inst.",
        env: "chatgpt",
        icon: "ph-chat-circle-dots",
        file: "chatgpt.com/settings/custom-instructions",
        scopeId: "universal",
        scopeLabel: "Universal (Account)",
        scopeGloss: "Pre-pended to system prompt across all ChatGPT chat sessions.",
        discretionId: "injected",
        discretionLabel: "Forced Injected",
        discretionGloss: "Zero model discretion: automatically included in conversation preamble.",
        trigger: "Session Start",
        triggerGloss: "Injected at session initialization.",
        evidence: "●",
        tokenCost: "~100 tokens per message",
        gloss: "Account-level custom instructions and biographical memory profile.",
        rationale: "Ensures user persona, style preferences, and profile persist across sessions automatically."
      },
      {
        id: "sys-prompt",
        title: "Personal Preferences & Preamble",
        short: "Prefs",
        env: "claude",
        icon: "ph-user",
        file: "claude.ai/settings/preferences",
        scopeId: "universal",
        scopeLabel: "Universal (Account)",
        scopeGloss: "Injected into every single prompt across all repositories.",
        discretionId: "injected",
        discretionLabel: "Forced Injected",
        discretionGloss: "Zero model discretion: baked into system prompt preamble.",
        trigger: "Session Start",
        triggerGloss: "Present from turn 1 before any user interaction.",
        evidence: "●",
        tokenCost: "~150 tokens every turn",
        gloss: "User-wide directives and core identity instructions.",
        rationale: "Ensures base persona and formatting rules hold universally without needing per-repo configuration."
      },
      {
        id: "skill-manifest",
        title: "Plugin Skill Listing",
        short: "Manifest",
        env: "claude",
        icon: "ph-list-checks",
        file: "skills/manifest.csv",
        scopeId: "universal",
        scopeLabel: "Universal (Ecosystem)",
        scopeGloss: "Reaches every session where the portable plugin is installed.",
        discretionId: "injected",
        discretionLabel: "Forced Injected",
        discretionGloss: "Short descriptions are mandatory so model knows tools exist.",
        trigger: "Session Start",
        triggerGloss: "Injected during plugin session initialization.",
        evidence: "●",
        tokenCost: "1 line per skill (~25 tokens)",
        gloss: "Concise 1-line stubs defining available skills.",
        rationale: "Provides awareness without payload. The agent knows a tool exists without paying for full instructions upfront."
      },
      {
        id: "antigravity-state",
        title: "Antigravity Host State",
        short: "AGYState",
        env: "gemini",
        icon: "ph-cpu",
        file: "~/.gemini/antigravity/antigravity_state.pbtxt",
        scopeId: "universal",
        scopeLabel: "Universal (Host Machine)",
        scopeGloss: "Governs all Antigravity agent interactions on this workstation.",
        discretionId: "injected",
        discretionLabel: "Forced Injected",
        discretionGloss: "Supplied automatically by the language_server daemon.",
        trigger: "Daemon / Build",
        triggerGloss: "Established when language_server_windows_x64.exe boots.",
        evidence: "●",
        tokenCost: "Engine internal",
        gloss: "Machine installation UUID, loopback RPC port, and host config.",
        rationale: "Establishes device identity and isolates the desktop GUI from headless background workers."
      },
      {
        id: "invoke-default",
        title: "Conventions Directive",
        short: "invoke-default",
        env: "claude",
        icon: "ph-compass",
        file: "skills/hooks/invoke-default.sh",
        scopeId: "host-plugin",
        scopeLabel: "Host / Plugin",
        scopeGloss: "Universal delivery prod across the estate.",
        discretionId: "prodded",
        discretionLabel: "System-Prodded",
        discretionGloss: "Hook prints a directive; model executes /portable:default.",
        trigger: "Session Start",
        triggerGloss: "Fires at session startup and again after compaction.",
        evidence: "●",
        tokenCost: "1 directive line until invoked",
        gloss: "Dynamic prod to load SURFACING.md and QUALIFIED-WRITING.md.",
        rationale: "Replaces static monolithic imports with a verified load directive, preventing stale cached doctrine."
      },
      {
        id: "event-guards",
        title: "Safety & Quality Guards",
        short: "Guards",
        env: "claude",
        icon: "ph-shield",
        file: "skills/hooks/*-guard.sh",
        scopeId: "host-plugin",
        scopeLabel: "Host / Plugin",
        scopeGloss: "Enforced across all checkouts adopting the plugin.",
        discretionId: "reactive",
        discretionLabel: "Event-Reactive",
        discretionGloss: "Fires only when an edit or commit touches guarded invariants.",
        trigger: "Event Juncture",
        triggerGloss: "Executes immediately on PreToolUse or commit-msg.",
        evidence: "●",
        tokenCost: "0 idle tokens; ~60 tokens only when triggered",
        gloss: "reading-column-guard, send-later-guard, and governing-docs warner.",
        rationale: "Zero idle context cost. Sits completely dormant until an edit or commit violates a known failure pattern."
      },
      {
        id: "project-settings",
        title: "Project Settings",
        short: "Settings",
        env: "claude",
        icon: "ph-gear",
        file: ".claude/settings.json",
        scopeId: "repo",
        scopeLabel: "Repo-Specific",
        scopeGloss: "Read only when this repository is the session root.",
        discretionId: "injected",
        discretionLabel: "Forced Injected",
        discretionGloss: "Platform injects settings into the root session harness.",
        trigger: "Session Start",
        triggerGloss: "Established during workspace initialization.",
        evidence: "●",
        tokenCost: "Harness internal",
        gloss: "Tool permissions, AskUserQuestion denials, and enabled extensions.",
        rationale: "Deterministic environment controls applied at repository root."
      },
      {
        id: "repo-claude",
        title: "Repository Contract",
        short: "CLAUDE.md",
        env: "claude",
        icon: "ph-book-open",
        file: "CLAUDE.md",
        scopeId: "repo",
        scopeLabel: "Repo-Specific",
        scopeGloss: "Bounded strictly to this git checkout.",
        discretionId: "prodded",
        discretionLabel: "System-Prodded",
        discretionGloss: "Platform loads it automatically when checkout is root.",
        trigger: "Session Start",
        triggerGloss: "Loaded at session start or directory navigation.",
        evidence: "●",
        tokenCost: "Varies by repo (~1,500 - 3,000 tokens)",
        gloss: "Repository-specific build commands, test suites, and invariants.",
        rationale: "Prototypical repo level: keeps repo-specific tooling isolated so commands never bleed into other projects."
      },
      {
        id: "pr-course",
        title: "Surfacing Course",
        short: "PRCourse",
        env: "claude",
        icon: "ph-git-pull-request",
        file: "skills/default/surfacing-course.md",
        scopeId: "repo",
        scopeLabel: "Repo / PR Context",
        scopeGloss: "Tied to pull request branch lifecycle.",
        discretionId: "reactive",
        discretionLabel: "Event-Reactive",
        discretionGloss: "Idles until pr-subscribe-hint detects an open pull request.",
        trigger: "Event Juncture",
        triggerGloss: "Delivered at the exact moment a PR is opened.",
        evidence: "●",
        tokenCost: "0 tokens before PR; ~1,200 tokens once opened",
        gloss: "Step-by-step guide for PR description and review upkeep.",
        rationale: "Eliminates premature cognitive load by keeping review procedures dormant until work is actually published."
      },
      {
        id: "conversation-continuity",
        title: "Context Continuity & History",
        short: "Continuity",
        env: "all",
        icon: "ph-arrows-clockwise",
        file: "transcript.jsonl / summary",
        scopeId: "task-turn",
        scopeLabel: "Task / Turn",
        scopeGloss: "Carried turn-to-turn in the active conversation.",
        discretionId: "injected",
        discretionLabel: "Forced Injected",
        discretionGloss: "Platform maintains conversation history and compactions.",
        trigger: "Per Turn",
        triggerGloss: "Delivered on every conversation exchange.",
        evidence: "●",
        tokenCost: "Rolling context window",
        gloss: "Session memory, user turns, and tool results.",
        rationale: "Preserves reasoning steps across multi-turn interactions."
      },
      {
        id: "slash-commands",
        title: "Interactive Slash Utilities",
        short: "SlashUtils",
        env: "claude",
        icon: "ph-terminal-window",
        file: "scripts/showing.py, skills/tasks/",
        scopeId: "task-turn",
        scopeLabel: "Task / Session",
        scopeGloss: "Scoped to the immediate task at hand.",
        discretionId: "pulled",
        discretionLabel: "User / Model Pulled",
        discretionGloss: "User explicitly types /markers, /showing, or /plan.",
        trigger: "On Demand",
        triggerGloss: "Runs only upon human command entry.",
        evidence: "●",
        tokenCost: "0 idle; output only appears upon execution",
        gloss: "Advisory tools for showing links, frozen zones, and goals.",
        rationale: "High discretion: specialized utilities run only when the operator explicitly requests verification or planning."
      },
      {
        id: "antigravity-skills",
        title: "Antigravity Domain Skills",
        short: "AGYSkills",
        env: "gemini",
        icon: "ph-sparkle",
        file: "~/.gemini/antigravity/builtin/skills/*",
        scopeId: "task-turn",
        scopeLabel: "Task / Domain",
        scopeGloss: "Specialized knowledge packs.",
        discretionId: "pulled",
        discretionLabel: "User / Model Pulled",
        discretionGloss: "Model autonomously reads SKILL.md when domain is triggered.",
        trigger: "On Demand",
        triggerGloss: "Loaded via view_file upon task relevance.",
        evidence: "●",
        tokenCost: "0 idle; ~1,000 - 4,000 tokens when consulted",
        gloss: "Deep skills (BigQuery, GCS basics, Chrome DevTools, Generative UI).",
        rationale: "Heaviest documentation is kept in local disk folders, leaving 100% of context free until needed."
      },
      {
        id: "agent-tools",
        title: "Autonomous File & Search Tools",
        short: "FileTools",
        env: "all",
        icon: "ph-magnifying-glass",
        file: "view_file, grep, run_command",
        scopeId: "task-turn",
        scopeLabel: "File / Symbol",
        scopeGloss: "Targeted to specific files and lines.",
        discretionId: "pulled",
        discretionLabel: "User / Model Pulled",
        discretionGloss: "Model exercises real-time autonomous agency.",
        trigger: "Per Turn",
        triggerGloss: "Dispatched dynamically during tool-calling steps.",
        evidence: "●",
        tokenCost: "Exact byte cost of lines requested",
        gloss: "Read tools, search commands, and trajectory records.",
        rationale: "Maximum flexibility: agent pulls only the exact character ranges needed to solve the specific request."
      }
    ],

    get visible() {
      let list = this.mechanisms;
      if (this.env !== 'all') list = list.filter(m => m.env === 'all' || m.env === this.env);
      if (this.filterDiscretion) list = list.filter(m => m.discretionId === this.filterDiscretion);
      return list;
    },

    get filteredDiscretions() {
      if (!this.filterDiscretion) return this.discretions;
      return this.discretions.filter(d => d.id === this.filterDiscretion);
    },

    get active() {
      return this.mechanisms.find(m => m.id === this.selectedId) || this.visible[0] || this.mechanisms[0];
    },

    countEnv(e) {
      return this.mechanisms.filter(m => m.env === e || m.env === 'all').length;
    },

    cellItems(scopeId, discretionId) {
      return this.visible.filter(m => m.scopeId === scopeId && m.discretionId === discretionId);
    },

    hasItems(scopeId, discretionId) {
      return this.cellItems(scopeId, discretionId).length > 0;
    },

    select(id) {
      this.selectedId = id;
    },

    assistantIcon(env, cls = 'w-3.5 h-3.5 shrink-0') {
      if (window.assistantMark?.svg) {
        if (env === 'claude') return window.assistantMark.svg('claude', { cls });
        if (env === 'gemini') return window.assistantMark.svg('gemini', { cls });
        if (env === 'chatgpt' || env === 'codex') return window.assistantMark.svg('codex', { cls });
      }
      if (env === 'claude') {
        return '<svg viewBox="0 0 24 24" class="' + cls + '" style="stroke:#d97757" stroke-width="2.2" stroke-linecap="round" fill="none" aria-hidden="true"><path d="M12,12 L12.0,1.6 M12,12 L17.62,3.25 M12,12 L21.46,7.68 M12,12 L22.29,13.48 M12,12 L19.86,18.81 M12,12 L14.93,21.98 M12,12 L9.07,21.98 M12,12 L4.14,18.81 M12,12 L1.71,13.48 M12,12 L2.54,7.68 M12,12 L6.38,3.25"/></svg>';
      }
      if (env === 'gemini') {
        return '<svg viewBox="0 0 24 24" class="' + cls + '" style="stroke:#1a73e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true"><path d="M12,2 C12,8.5 15.5,12 22,12 C15.5,12 12,15.5 12,22 C12,15.5 8.5,12 2,12 C8.5,12 12,8.5 12,2 Z"/></svg>';
      }
      if (env === 'chatgpt' || env === 'codex') {
        return '<svg viewBox="0 0 24 24" class="' + cls + '" style="stroke:#10a37f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true"><path d="M12,4 A8,8 0 0,1 18.9,16 M18.9,16 A8,8 0 0,1 7.1,16 M7.1,16 A8,8 0 0,1 12,4"/></svg>';
      }
      if (env === 'all') {
        return '<i class="ph ph-globe text-base-content/60 ' + cls + ' text-[12px] flex items-center justify-center" aria-hidden="true"></i>';
      }
      return '';
    },

    assistantLabel(env) {
      if (env === 'claude') return 'Claude Code';
      if (env === 'gemini') return 'Gemini';
      if (env === 'chatgpt' || env === 'codex') return 'ChatGPT';
      if (env === 'all') return 'Universal / All';
      return env;
    },

    envBadge(env) {
      if (env === 'gemini') return 'badge-info';
      if (env === 'claude') return 'badge-warning';
      if (env === 'chatgpt') return 'badge-success';
      return 'badge-primary';
    },

    activeDiscretionBadge() {
      const d = this.discretions.find(x => x.id === this.active.discretionId);
      return d ? d.badgeClass : 'badge-ghost';
    },

    triggerIcon(trig) {
      if (trig.includes('Daemon')) return 'ph-terminal';
      if (trig.includes('Start')) return 'ph-play';
      if (trig.includes('Event')) return 'ph-bell';
      if (trig.includes('Turn')) return 'ph-arrows-clockwise';
      return 'ph-hand-pointing';
    },

    scalePosition(axisId, m) {
      if (axisId === 'scope') {
        const map = { universal: 8, 'host-plugin': 36, repo: 66, 'task-turn': 92 };
        return map[m.scopeId] || 50;
      }
      if (axisId === 'discretion') {
        const map = { injected: 8, prodded: 36, reactive: 66, pulled: 92 };
        return map[m.discretionId] || 50;
      }
      if (axisId === 'trigger') {
        if (m.trigger.includes('Daemon')) return 8;
        if (m.trigger.includes('Start')) return 28;
        if (m.trigger.includes('Event')) return 52;
        if (m.trigger.includes('Turn')) return 74;
        return 92;
      }
      return 50;
    },

    boot() {
      if (!this.visible.some(m => m.id === this.selectedId)) {
        this.selectedId = this.visible[0]?.id || 'invoke-default';
      }
    }
  };
}
</script>
