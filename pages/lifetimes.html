<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifetimes</title>
<!-- Lifetimes: the layers a Claude Code web session runs on, how long each one
     lasts, and what each event does to each of them. One control picks the
     event, and every section answers for it: the layer bands take the event's
     effect, the worked week lights the marks the event owns, and the copies of
     one skill take the effect of the layer each copy lives in.

     Colour is the effect and nothing else: kept, partly kept, lost, new, read,
     untouched. With no event picked the page is neutral, so a colour on screen
     always means "this is what the picked event does here".

     Data: docs/environment/lifetimes.json, which cites docs/environment/
     container.md for every effect; node/test/lifetimes.test.mjs holds the
     citations to real headings and the effect table to every layer.

     The week is SVG built as a string and set through x-html, since an x-for
     inside <svg> draws nothing (html-style mechanics). Its colours ride on
     currentColor under daisyUI text classes, the one family that compiles on a
     theme colour. A tenant page: normal flow, sticky header, no fixed root. -->
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="../lib/kits/title-tip.js"></script>
<script>
function lifetimes() {
  const DATA = '../docs/environment/lifetimes.json';
  const BLOB = 'https://github.com/mehrlander/web-tools/blob/main/';

  // One entry per effect state: the band, the icon, and the SVG tone.
  const STATE = {
    kept:      { icon: 'ph-check-circle', band: 'border-success bg-success/10', ink: 'text-success' },
    partial:   { icon: 'ph-circle-half',  band: 'border-warning bg-warning/10', ink: 'text-warning' },
    lost:      { icon: 'ph-x-circle',     band: 'border-error bg-error/10',     ink: 'text-error' },
    new:       { icon: 'ph-plus-circle',  band: 'border-info bg-info/10',       ink: 'text-info' },
    used:      { icon: 'ph-copy',         band: 'border-base-content/40',        ink: 'text-base-content' },
    untouched: { icon: 'ph-minus-circle', band: 'border-base-300 opacity-50',    ink: 'text-base-content/40' },
  };

  // The lifetime ruler: a log scale from 15 minutes to a month across 80% of
  // the track, and "lasting" pinned at the right end.
  const pos = h => h === 'lasting' ? 100
    : Math.max(0, Math.log(h / 0.25) / Math.log(720 / 0.25) * 80);

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  return {
    data: null,
    err: '',
    mode: 'layers',
    AXIS: [
      { at: 1, label: 'hour' }, { at: 24, label: 'day' }, { at: 168, label: 'week' },
      { at: 720, label: 'month' }, { at: 'lasting', label: 'lasting' },
    ],

    async boot() {
      try {
        const r = await fetch(DATA);
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
        this.data = await r.json();
      } catch (e) {
        this.err = 'docs/environment/lifetimes.json did not load: ' + e.message;
        return;
      }
      const q = new URLSearchParams(location.search).get('event');
      if (q && this.modes.some(m => m.id === q)) this.mode = q;
    },

    get layers() { return this.data?.layers || []; },
    get copies() { return this.data?.copies || []; },
    get levers() { return this.data?.levers || []; },
    get modes() {
      return [{ id: 'layers', name: 'Layers', short: 'Layers', icon: 'ph-stack' }, ...(this.data?.events || [])];
    },
    get ev() { return this.data?.events.find(e => e.id === this.mode) || null; },
    get position() { return this.modes.findIndex(m => m.id === this.mode) + 1; },

    pick(id) {
      this.mode = id;
      const u = new URL(location.href);
      if (id === 'layers') u.searchParams.delete('event'); else u.searchParams.set('event', id);
      try { history.replaceState(null, '', u); } catch (e) { /* a sandboxed frame may refuse */ }
    },
    step(d) {
      const ids = this.modes.map(m => m.id);
      this.pick(ids[(ids.indexOf(this.mode) + d + ids.length) % ids.length]);
    },
    key(e) {
      if (e.target.closest('select, input, textarea')) return;
      if (e.key === 'ArrowRight') this.step(1);
      else if (e.key === 'ArrowLeft') this.step(-1);
      else if (e.key === 'Escape') this.pick('layers');
    },

    eff(layerId) { return this.ev?.effects[layerId] || null; },
    layer(id) { return this.layers.find(l => l.id === id) || {}; },
    band(layerId) { const e = this.eff(layerId); return e ? STATE[e.state].band : 'border-base-300'; },
    copyEff(c) { return this.ev ? c.effects[this.ev.id] : null; },
    copyBand(c) { const e = this.copyEff(c); return e ? STATE[e.state].band : 'border-base-300'; },
    stateIcon(e) { return e ? STATE[e.state].icon + ' ' + STATE[e.state].ink : ''; },
    glyph(e) { return e?.evidence ? this.data.evidence[e.evidence].glyph : ''; },
    tip(e) {
      if (!e?.evidence) return '';
      return this.data.evidence[e.evidence].label + ' · ' + this.data.sources[e.source].title;
    },
    href(sourceId) {
      const s = this.data.sources[sourceId];
      return BLOB + s.path + (s.anchor ? '#' + s.anchor : '');
    },
    get evSources() {
      if (!this.ev) return [];
      const ids = [...new Set(Object.values(this.ev.effects).map(e => e.source).filter(Boolean))];
      return ids.map(id => ({ id, title: this.data.sources[id].title, href: this.href(id) }));
    },

    pos,
    spanStyle(s) { const a = pos(s.from), b = pos(s.to); return `left:${a}%;width:${b - a}%`; },
    spanClass(s) {
      return {
        solid: 'top-5 h-2 rounded-full bg-base-content/50',
        dashed: 'top-6 h-0 border-t-2 border-dashed border-base-content/40',
        fade: 'top-5 h-2 rounded-r-full bg-linear-to-r from-[var(--color-base-content)]/50 to-transparent',
      }[s.style];
    },
    // A tick's label hangs left of its line unless it is the last tick on a
    // ruler with room to its right, so two ticks never write over each other.
    tickSide(t, L) {
      const last = L.ticks[L.ticks.length - 1] === t;
      return (!last || pos(t.at) > 60) ? '-translate-x-full text-right pr-1' : 'pl-1';
    },

    // The worked week, as one SVG string. Lanes are rows, days are columns;
    // every bar, mark and link carries `ev`, a map from event id to the state
    // it shows under that event. Under the picked event an element in the map
    // takes its state's tone and the rest dim; under Layers all are neutral.
    get weekSvg() {
      const w = this.data?.week;
      if (!w) return '';
      const X0 = 120, DAY = 120, W = X0 + DAY * 8 + 20, H = 356, HALF = 12;
      const Y = { github: 34, settings: 86, snapshot: 138, a: 206, b: 266, c: 326 };
      const x = d => X0 + d * DAY;
      const m = this.mode;
      const lit = el => m !== 'layers' && el.ev && el.ev[m];
      const tone = el => lit(el) ? STATE[el.ev[m]].ink : 'text-base-content/60';
      const dim = el => (m === 'layers' || lit(el)) ? '' : 'opacity-25';
      const out = [];
      out.push(`<svg viewBox="0 0 ${W} ${H}" class="w-full block" font-family="inherit" role="img" aria-label="A week in one environment">`);

      // Day columns.
      w.days.forEach((d, i) => {
        out.push(`<line x1="${x(i)}" y1="22" x2="${x(i)}" y2="${H - 6}" stroke="currentColor" class="text-base-content/10"/>`);
        out.push(`<text x="${x(i) + 6}" y="14" font-size="12" fill="currentColor" class="text-base-content/50">${esc(d)}</text>`);
      });
      // Lane names.
      w.lanes.forEach(l => {
        out.push(`<text x="8" y="${Y[l.id] + 5}" font-size="14" font-weight="600" fill="currentColor" class="text-base-content">${esc(l.name)}</text>`);
      });
      // Settings is a line, not a bar: it holds until you edit it.
      out.push(`<line x1="${x(0)}" y1="${Y.settings}" x2="${x(8)}" y2="${Y.settings}" stroke="currentColor" stroke-width="2" class="text-base-content/30"/>`);

      // Seed links go under the bars, so a seed passing a lane reads as
      // passing behind it; push, fetch and never go over, since they are the
      // point when Push and fetch is picked.
      const link = l => {
        const down = Y[l.to] > Y[l.from];
        const y1 = Y[l.from] + (down ? HALF : -HALF);
        const y2 = Y[l.to] + (down ? -HALF - 1 : HALF + 1);
        const xx = x(l.at);
        const dash = l.kind === 'seed' ? '' : ' stroke-dasharray="5 4"';
        const head = down
          ? `M${xx - 5},${y2 - 8} L${xx},${y2} L${xx + 5},${y2 - 8} z`
          : `M${xx - 5},${y2 + 8} L${xx},${y2} L${xx + 5},${y2 + 8} z`;
        out.push(`<g class="${tone(l)} ${dim(l)}">`);
        out.push(`<line x1="${xx}" y1="${y1}" x2="${xx}" y2="${down ? y2 - 6 : y2 + 6}" stroke="currentColor" stroke-width="1.6"${dash}/>`);
        out.push(`<path d="${head}" fill="currentColor"/>`);
        if (l.kind === 'never') {
          const ym = (y1 + y2) / 2;
          out.push(`<path d="M${xx - 7},${ym - 7} L${xx + 7},${ym + 7} M${xx + 7},${ym - 7} L${xx - 7},${ym + 7}" stroke="currentColor" stroke-width="2.4"/>`);
        }
        if (l.label) {
          const ly = l.kind === 'never' ? Y.c - 30 : Y.settings + 28;
          const anchor = l.kind === 'push' ? 'end' : 'start';
          const lx = l.kind === 'push' ? xx - 7 : xx + 7;
          out.push(`<text x="${lx}" y="${ly}" font-size="13" text-anchor="${anchor}" fill="currentColor">${esc(l.label)}</text>`);
        }
        out.push(`</g>`);
      };
      w.links.filter(l => l.kind === 'seed').forEach(link);

      // Bars.
      w.bars.forEach(b => {
        const x1 = x(b.from), x2 = x(b.to), y = Y[b.lane] - HALF;
        const idle = b.kind === 'idle';
        out.push(`<g class="${dim(b)}">`);
        out.push(`<rect x="${x1}" y="${y}" width="${x2 - x1}" height="${HALF * 2}" rx="${idle ? 0 : 5}" fill="currentColor" class="text-base-100"/>`);
        out.push(`<g class="${tone(b)}"><rect x="${x1}" y="${y}" width="${x2 - x1}" height="${HALF * 2}" rx="${idle ? 0 : 5}" fill="currentColor" fill-opacity="${idle ? 0.05 : 0.14}" stroke="currentColor" stroke-opacity="0.7"${idle ? ' stroke-dasharray="4 3"' : ''}/></g>`);
        out.push(`<text x="${x1 + 9}" y="${y + 17}" font-size="13" fill="currentColor" class="text-base-content">${esc(b.label)}</text>`);
        out.push(`</g>`);
      });

      w.links.filter(l => l.kind !== 'seed').forEach(link);

      // Marks.
      w.marks.forEach(k => {
        const xx = x(k.at), y = Y[k.lane];
        out.push(`<g class="${tone(k)} ${dim(k)}">`);
        if (k.kind === 'edit') {
          out.push(`<path d="M${xx},${y - 10} L${xx + 10},${y} L${xx},${y + 10} L${xx - 10},${y} z" fill="currentColor"/>`);
          out.push(`<text x="${xx + 16}" y="${y - 12}" font-size="13" fill="currentColor">${esc(k.label)}</text>`);
        } else if (k.kind === 'restart') {
          out.push(`<path d="M${xx + 4},${y - 20} L${xx - 4},${y - 4} L${xx + 6},${y + 2} L${xx - 2},${y + 20}" fill="none" stroke="currentColor" stroke-width="3"/>`);
          out.push(`<text x="${xx + 10}" y="${y + 32}" font-size="13" fill="currentColor">${esc(k.label)}</text>`);
        } else if (k.kind === 'reclaim') {
          out.push(`<path d="M${xx - 8},${y - 14} L${xx + 8},${y + 14} M${xx + 8},${y - 14} L${xx - 8},${y + 14}" stroke="currentColor" stroke-width="3"/>`);
          out.push(`<text x="${xx + 14}" y="${y + 5}" font-size="13" fill="currentColor">${esc(k.label)}</text>`);
        }
        out.push(`</g>`);
      });

      out.push('</svg>');
      return out.join('');
    },
  };
}
</script>
<script defer src="https://unpkg.com/alpinejs"></script>
</head>
<body class="min-h-dvh bg-base-200 text-base-content" x-data="lifetimes()" x-init="boot()" @keydown.window="key($event)">

<header class="sticky top-0 z-20 bg-base-100/90 backdrop-blur border-b border-base-300">
  <div class="px-3 sm:px-5 py-2 flex items-center gap-2">
    <h1 class="text-lg font-semibold flex items-center gap-2 shrink-0"><i class="ph ph-hourglass-medium text-primary"></i>Lifetimes</h1>
    <div class="grow"></div>
    <button type="button" class="btn btn-sm btn-ghost btn-square" @click="step(-1)" aria-label="Previous event" title="Previous (←)"><i class="ph ph-caret-left text-lg"></i></button>
    <div class="hidden lg:flex items-center gap-0.5 rounded-lg bg-base-200 p-0.5" role="tablist" aria-label="Event">
      <template x-for="m in modes" :key="m.id">
        <button type="button" role="tab" @click="pick(m.id)" :aria-selected="mode === m.id"
                class="flex items-center gap-1.5 px-3 py-1 rounded-md text-sm font-medium transition-colors cursor-pointer"
                :class="mode === m.id ? 'bg-base-100 text-primary shadow-sm' : 'text-base-content/60 hover:text-base-content'">
          <i class="ph" :class="m.icon"></i><span x-text="m.short"></span>
        </button>
      </template>
    </div>
    <select class="select select-sm lg:hidden w-44" aria-label="Event" :value="mode" @change="pick($event.target.value)">
      <template x-for="m in modes" :key="m.id">
        <option :value="m.id" :selected="mode === m.id" x-text="m.short"></option>
      </template>
    </select>
    <button type="button" class="btn btn-sm btn-ghost btn-square" @click="step(1)" aria-label="Next event" title="Next (→)"><i class="ph ph-caret-right text-lg"></i></button>
    <span class="hidden sm:inline font-mono text-xs text-base-content/50 w-8 text-right" x-text="position + '/' + modes.length"></span>
  </div>
  <div x-show="ev" class="px-3 sm:px-5 pb-2 flex flex-wrap items-baseline gap-x-5 gap-y-1">
    <span class="font-semibold flex items-center gap-2"><i class="ph text-primary" :class="ev?.icon"></i><span x-text="ev?.name"></span></span>
    <span class="flex items-baseline gap-2"><span class="text-xs uppercase tracking-wide text-base-content/50">trigger</span><span x-text="ev?.trigger"></span></span>
    <span class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
      <span class="text-xs uppercase tracking-wide text-base-content/50">sources</span>
      <template x-for="s in evSources" :key="s.id">
        <a :href="s.href" target="_blank" rel="noopener" class="link link-hover text-sm" x-text="s.title + ' ↗'"></a>
      </template>
    </span>
  </div>
</header>

<main class="px-3 sm:px-5 py-4 space-y-8">
  <p x-show="err" class="alert alert-warning" x-text="err"></p>
  <div x-show="!data && !err" class="flex justify-center py-16"><span class="loading loading-dots loading-md opacity-30"></span></div>

  <template x-if="data">
    <div class="space-y-8">

      <!-- Layers: one band per layer, longest-lived first. -->
      <section aria-labelledby="h-layers">
        <div class="hidden lg:grid lg:grid-cols-[16rem_minmax(0,1fr)_minmax(0,24rem)] gap-4 px-3 mb-1 items-end">
          <h2 id="h-layers" class="text-xs font-semibold uppercase tracking-wide text-base-content/50">Layers</h2>
          <span class="text-xs font-semibold uppercase tracking-wide text-base-content/50" x-text="ev ? 'What it does here' : 'Holds'"></span>
          <div class="relative h-4">
            <template x-for="a in AXIS" :key="a.label">
              <span class="absolute bottom-0 text-xs text-base-content/50 -translate-x-1/2" :class="a.at === 'lasting' ? '-translate-x-full' : ''" :style="'left:' + pos(a.at) + '%'" x-text="a.label"></span>
            </template>
          </div>
        </div>
        <h2 class="lg:hidden text-xs font-semibold uppercase tracking-wide text-base-content/50 mb-2">Layers</h2>
        <div class="grid gap-2">
          <template x-for="L in layers" :key="L.id">
            <div class="rounded-xl border-2 bg-base-100 p-3 grid gap-3 lg:grid-cols-[16rem_minmax(0,1fr)_minmax(0,24rem)] lg:gap-4 items-start transition-colors" :class="band(L.id)">
              <div class="flex items-start gap-3">
                <i class="ph text-3xl shrink-0" :class="L.icon"></i>
                <div class="min-w-0">
                  <div class="font-semibold text-lg leading-tight" x-text="L.name"></div>
                  <div class="text-base-content/60 text-balance" x-text="L.lifetime"></div>
                </div>
              </div>
              <div class="min-w-0 space-y-2">
                <div x-show="ev" class="flex items-start gap-2 text-lg">
                  <i class="ph text-2xl shrink-0" :class="stateIcon(eff(L.id))"></i>
                  <span class="font-medium text-pretty" x-text="eff(L.id)?.label"></span>
                  <span x-show="eff(L.id)?.evidence" class="font-mono text-sm text-base-content/50 shrink-0" :data-title-tip="tip(eff(L.id))" data-title-tip-bare x-text="glyph(eff(L.id))"></span>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="h in L.holds" :key="h">
                    <span class="rounded-md border border-base-300 bg-base-200/60 px-2 py-0.5" x-text="h"></span>
                  </template>
                </div>
              </div>
              <div class="relative h-14" :aria-label="L.name + ' lifetime'">
                <div class="absolute inset-x-0 top-5 h-2 rounded-full bg-base-200"></div>
                <template x-for="a in AXIS" :key="a.label">
                  <div class="absolute top-4 h-4 border-l border-base-content/10" :style="'left:' + pos(a.at) + '%'"></div>
                </template>
                <template x-for="(s, i) in L.span" :key="i">
                  <div class="absolute" :class="spanClass(s)" :style="spanStyle(s)"></div>
                </template>
                <template x-for="t in L.ticks" :key="t.label">
                  <div class="absolute top-3 h-6 border-l-2 border-base-content/70" :style="'left:' + pos(t.at) + '%'">
                    <span class="absolute top-6 whitespace-nowrap text-xs text-base-content/70" :class="tickSide(t, L)">
                      <span x-text="t.label"></span> <span class="font-mono text-base-content/50" :data-title-tip="tip(t)" data-title-tip-bare x-text="glyph(t)"></span>
                    </span>
                  </div>
                </template>
                <div class="lg:hidden absolute inset-x-0 top-0 h-4">
                  <template x-for="a in AXIS" :key="a.label">
                    <span class="absolute top-0 text-xs text-base-content/40 -translate-x-1/2" :class="a.at === 'lasting' ? '-translate-x-full' : ''" :style="'left:' + pos(a.at) + '%'" x-text="a.label"></span>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
      </section>

      <!-- The worked week: one environment, three sessions. -->
      <section aria-labelledby="h-week">
        <h2 id="h-week" class="text-xs font-semibold uppercase tracking-wide text-base-content/50 mb-2">A week in one environment</h2>
        <div class="rounded-xl border-2 border-base-300 bg-base-100 p-3 overflow-x-auto">
          <div class="min-w-[1100px]" x-html="weekSvg"></div>
        </div>
      </section>

      <!-- Copies of one skill, each tinted by the layer it lives in. -->
      <section aria-labelledby="h-copies">
        <h2 id="h-copies" class="text-xs font-semibold uppercase tracking-wide text-base-content/50 mb-2">Copies of one skill</h2>
        <div class="grid gap-2 md:grid-cols-2 xl:grid-cols-5">
          <template x-for="c in copies" :key="c.id">
            <div class="rounded-xl border-2 bg-base-100 p-3 space-y-2 transition-colors" :class="copyBand(c)">
              <div class="flex items-center gap-2"><i class="ph text-2xl" :class="c.icon"></i><span class="font-semibold text-lg" x-text="c.name"></span></div>
              <div class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-base-content/50">
                <i class="ph text-sm" :class="layer(c.layer).icon"></i><span x-text="layer(c.layer).name"></span>
              </div>
              <div x-show="ev" class="flex items-start gap-2">
                <i class="ph text-xl shrink-0" :class="stateIcon(copyEff(c))"></i>
                <span class="font-medium" x-text="copyEff(c)?.label"></span>
              </div>
              <div x-text="c.version"></div>
              <div class="text-base-content/70"><span class="text-xs uppercase tracking-wide text-base-content/50">read by</span> <span x-text="c.readBy"></span></div>
            </div>
          </template>
        </div>
      </section>

      <!-- Levers: what you can move, and where it lands. -->
      <section aria-labelledby="h-levers">
        <h2 id="h-levers" class="text-xs font-semibold uppercase tracking-wide text-base-content/50 mb-2">Levers</h2>
        <div class="grid gap-2 md:grid-cols-3">
          <template x-for="v in levers" :key="v.goal">
            <div class="rounded-xl border-2 border-base-300 bg-base-100 p-3 flex items-start gap-3">
              <i class="ph text-3xl shrink-0" :class="layer(v.layer).icon"></i>
              <div class="min-w-0">
                <div class="text-base-content/60 text-balance" x-text="v.goal"></div>
                <div class="font-semibold text-lg text-balance" x-text="v.act"></div>
              </div>
            </div>
          </template>
        </div>
      </section>

    </div>
  </template>
</main>

<footer x-show="data" class="px-3 sm:px-5 pb-6 flex flex-wrap items-baseline gap-x-5 gap-y-1 text-xs text-base-content/50">
  <template x-for="(v, k) in (data?.evidence || {})" :key="k">
    <span><span class="font-mono" x-text="v.glyph"></span> <span x-text="v.label"></span></span>
  </template>
  <span class="grow"></span>
  <a class="link link-hover" href="https://github.com/mehrlander/web-tools/blob/main/docs/environment/lifetimes.json" target="_blank" rel="noopener">lifetimes.json ↗</a>
  <a class="link link-hover" href="https://github.com/mehrlander/web-tools/blob/main/docs/environment/container.md" target="_blank" rel="noopener">container.md ↗</a>
</footer>

</body>
</html>
