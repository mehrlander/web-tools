<!DOCTYPE html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User call</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⚖️</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  user-call.html — one user call, on its own.

  A user call is one decision a session needs from the owner (user-call/1;
  web-tools-private user-calls/user-call.py writes them). The form is
  alpineComponents/user-call-form.js, which
  the session page's deck of calls mounts once per slide; this page mounts the
  same component at an address a chat reply can hand over, the way branch.html
  mounts branchBrief.

    #src=owner/repo[@ref]:user-calls/<session>-<slug>.json

  Read through the viewer's stored token, since calls usually live in the
  private store. Also read from ?query, for a context that strips fragments.
  ?use=<ref> pins this page's lib chain to a ref, as session.html's does.
-->
<script>
  window.__depsReady = new Promise(r => { window.__depsDone = r; });
</script>
<script type="module">
  const bootFailed = (e) => {
    document.body?.removeAttribute('x-cloak');
    const box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'margin:2rem auto;max-width:34rem;padding:1rem 1.25rem;border:1px solid #d9dee3;'
      + 'border-radius:.75rem;background:#fff;font:14px/1.55 system-ui,sans-serif;color:#1f2937';
    box.textContent = 'This page could not start: ' + (e?.message || e);
    document.body?.replaceChildren(box);
  };
  try {
    const ref = new URLSearchParams(location.search).get('use');
    if (ref) {
      const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/dist/web-tools.js`, { cache: 'no-store' });
      if (!src.ok) throw new Error(`?use=${ref}: could not fetch the bundle (HTTP ${src.status})`);
      const url = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
      try { await import(url); } finally { URL.revokeObjectURL(url); }
    } else {
      await import('../dist/web-tools.js');
    }
    try {
      await gh.load('kits/guide-render.js');
      await gh.load('kits/chat-render.js');
    } finally { window.__depsDone(); }
  } catch (e) {
    bootFailed(e);
    throw e;
  }
</script>
<style>
  [x-cloak]{display:none!important}
</style>
</head>
<body class="h-[100dvh] flex flex-col bg-base-100 text-base-content" x-data="userCallPage()" x-cloak>
  <div x-show="!src" class="mx-auto p-8 text-center opacity-60 text-sm">
    Link to a user call: <code class="text-xs">#src=owner/repo[@ref]:user-calls/&lt;session&gt;-&lt;slug&gt;.json</code>
  </div>
  <div id="mount" class="flex-1 min-h-0 flex flex-col"></div>
<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('userCallPage', () => ({
      src: '',
      async init() {
        await window.__depsReady;
        const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
        this.src = hash.get('src') || new URLSearchParams(location.search).get('src') || '';
        if (!this.src) return;
        window.__callTarget = { src: this.src };
        this.$nextTick(() => {
          // A fresh element: Alpine will not re-initialise a node it has
          // already walked, which is session.html's note too.
          const old = document.getElementById('mount');
          const el = document.createElement('div');
          el.id = 'mount';
          el.className = old.className;
          el.setAttribute('x-data', 'userCallForm(window.__callTarget)');
          old.replaceWith(el);
          Alpine.initTree(el);
        });
      },
    }));
  });
</script>
</body>
</html>
