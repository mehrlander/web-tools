<!--
  dictate.html — the blank page you talk at.

  Every other caller of kits/dictate.js attaches the voice buffer to something:
  the annotator pins a note to a passage, the stage makes a file out of it, the
  FAB's menu stages a note about the page you are reading. All three are right
  and none of them answers "I want to say a thing." That address did not exist,
  which is why the dictation stack could be complete and still not be reached
  for. This page is the missing address and nothing else: a full viewport of
  text, a pad under your thumb, and somewhere for the words to go.

  IT IS A PHONE PAGE FIRST. Not responsive-so-it-also-works: the shell is the
  viewport (h-dvh, no document scroll, so no pull-to-refresh and no rubber
  band), the controls sit at the bottom where a thumb already is, the type runs
  large enough to read at arm's length while speaking, and the bottom row
  clears the home indicator. A desktop gets the same thing centred, which costs
  nothing and is the honest way round: the hard constraints are the phone's.

  THE GESTURE LAYER IS THE NOTES COMPOSER'S (kits/annotate.js), not the
  stage's. The first cut of this page took the stage's dictation card, which
  is a version behind: it keeps the painter's arrow cluster because it has no
  cursor pad, and it still carries a pencil into the keyboard. What came
  across on 2026-08-23 is the composer's answer to both. The PAD is held and
  dragged, the caret moves and the button does not, so placing one no longer
  means putting a thumb over the two words either side of it; `arrows: false`
  follows, since an armed pin is dragged the same way. A DOUBLE TAP opens the
  keyboard where it landed, and the pencil is gone. What did NOT come across
  is the composer's vertical mark column, for a reason measured rather than
  preferred: see "The text" below.

  WHAT IT ADDS TO THE KIT, since the kit is where the composition rules live:

    THE ENGINE IS KEPT ALIVE. Not here, in the kit, but this page is why it
    was fixed. `continuous` is a request WebKit does not honor past its own
    silence timeout, so the microphone switched itself off at every thinking
    pause. Survivable for a one-sentence note; fatal for the thing this page
    is for. See "Keeping the engine alive" in kits/dictate.js.

    THE DRAFT SURVIVES THE PAGE. Every change writes the buffer to
    localStorage, and it is restored on the next load. A phone call, a swipe
    to another app that comes back cold, a stray reload: none of them should
    cost ten minutes of talking. The draft is cleared when the words reach
    somewhere durable, so a session that ENDED properly opens blank and only
    an INTERRUPTED one comes back.

    THE SCREEN IS HELD AWAKE while listening, because a phone that dims and
    locks takes the microphone with it, and nothing about that failure tells
    the reader what happened.

    TWO MODIFIER TAPS, for the desk rather than the phone, where the hands are
    free and idle. Both say something only the reader can know, because it is
    about words not yet spoken: CONTROL un-ends the sentence the pause just
    closed, so the words still coming belong to it; SHIFT capitalizes the next
    word, or recases the selected one. Tapped alone, acted on release, so a
    chord is not mistaken for one. See "The two modifier taps" below.

    IT COMES BACK FROM THE BACKGROUND. Switching apps kills the recognition
    outright, past anything a relaunch timer can see, so returning to a
    visible page restarts it if the reader never asked to stop.

    THE WORDS GO SOMEWHERE. This is the half that makes it a tool rather than
    a textarea. Copy and Share read the buffer; Jot files it in the estate's
    pile (the registry's lists/jots.json, which the app already renders at
    ?view=jots) and Drop writes a dated markdown file into home's chron/dump/,
    the tray /drain reads. The two that file it durably clear the buffer; the
    two that only read it leave it alone.

    AND SEND, WHICH IS THE ONE THAT DOES NOT FILE THE WORDS AT ALL. It reads
    them as an INSTRUCTION and hands them somewhere that can act on it: the
    system share sheet, a new Claude Code session with repositories
    preselected, or a chat. It stands where Share stood, because Share is one
    of those rows rather than a peer of them.

    THAT ALSO FIXES WHAT SHARE COULD NOT SAY. The button carried
    `x-show="canShare"`, so on a browser without navigator.share, which is
    most desktops, it was simply absent: no reason given, and no pointer at
    Copy. The button is unconditional now and the share ROW carries the
    absence, greyed with its reason, exactly as an unreachable link target
    does.

    IT IS ALSO WHY THIS PAGE IS THE ONE THAT CAN DO IT. The composer on a page
    (kits/annotate.js) has room for the words and nowhere to put the aiming;
    the estate's session rows have the repositories and nowhere to write. Here
    both fit, which is the whole reason the annotator's expand button points at
    this page rather than growing a target picker of its own.

    NOTHING IS SENT BY SENDING. The link prefills a composer at the far end and
    the reader still presses the button there, which is the documented
    behaviour for Claude Code and the reason a one-tap control is safe. The one
    target that does submit on arrival is named as such in the sheet, on the row
    itself, because a reader cannot be expected to know which is which.

    AUTOCORRECT, and the plain word is the right one: it is find and replace
    over a list, whole words, longest first, applied to each segment as it
    lands (kits/dictate.js `opts.fix`). It earns its place only because iOS
    Text Replacement reaches the keyboard and not a page's speech results,
    and because the Web Speech API's own SpeechGrammarList does nothing in
    WebKit. The list lives in the registry and the menu row adds to it from
    whatever is selected, so it gets better the more it is wrong. What it
    cannot do is context: homophones are out of its reach entirely, and only
    a model reading the sentence around a word would go further.

  WHERE THE CONTROLS SIT. The HEADER is a three-column grid: the session on
  the left (record, and how long it has run), the TARGET on the centre line,
  and the history plus the menu on the right (undo, redo, the keyboard). The
  BOTTOM is two rows, and they are split by what a tap DOES rather than by
  how it looks: the KEYS that compose (the marks, the shift, backspace) and
  the DESTINATIONS that end it (Copy, Share, Jot, Drop). Record doubles as
  the state readout, since red and pulsing answers "is it hearing me" from
  across the room and the page then needs no word for it.

  BACKSPACE IS A KEY, and its two earlier homes were both reasoned from
  something other than how often it is tapped. In the header it sat beside
  undo and redo, on the reading that the three all take something back: true,
  and beside the point, since undo is reached for a handful of times in a
  session and backspace is reached for mid-sentence, over and over. Moved
  down on 2026-08-25 it landed in the row that ends the note, which was the
  only room there was, so the key that removes a word sat against the button
  that filed it. It is the fifth key now, at the right end, where every
  keyboard the reader has ever used puts it. Five across a phone is 73px
  each, still half again the composer's column key.

  THE DESTINATIONS ARE FOUR BUTTONS, not a Save that opens four. The sheet
  they were in was a CHOOSER and never a confirmation: tapping Jot in it
  filed the note there and then, so the extra tap bought no safety, only
  distance. Flattened 2026-08-27.

  AND THE FOURTH OF THEM IS A CHOOSER AGAIN, which is not a reversal. Send
  took Share's slot on 2026-09-06 and Share became one row inside it, beside
  the two that start a session somewhere. The rule above forbids a sheet
  wrapping choices already MADE; which destination, and for a session which
  repositories, are choices nobody has made yet. Share was always a chooser
  with a single option, opened by the operating system rather than here. What the sheet carried and the row cannot
  is a line of description under each name; those are titles now, and the one
  that says something a reader cannot infer, where Drop writes, is also in
  the toast that lands after it writes.

  THE TARGET IS TWO GESTURES ON ONE BUTTON, because they are one job: this is
  the control that aims. DRAG it and the caret moves (the pad, below). TAP it
  and the caret becomes one end of a selection whose other end is your next
  tap in the text. Two taps for an arbitrary range, where the long press gives
  only a word and the pins give one edge at a time.

  AND THE TARGET IS RED WHENEVER A PIN IS. There is one armed state, not two:
  arming a pinhead lights the target, tapping the target puts any pin down,
  and the second tap of the two-tap selection disarms rather than leaving one
  lit. So the red target means one thing, "the next tap in the text moves
  something", and the reader gets a full-size button for the exit that the
  12px pinhead was: a near miss there used to clear the selection outright.

  AND NO HAPTIC ON THE LONG PRESS, though the platform's own long-press
  selection answers with one. Measured on the device rather than assumed:
  docs/ios-haptics.md. The reachable buzz belongs to a real user activation of
  a native control, a scripted one earns nothing, and navigator.vibrate has
  never existed in WebKit. There is no way for this page to fire one at the
  moment its own gesture does.

  ADDRESSING
    ?to=copy|jot|drop|send    which destination is painted as the lead
                              (share is read as send, where it moved)
    ?dest=owner/repo[@ref]:dir   where Drop writes, overriding home/chron/dump
    ?repo=owner/repo,owner/repo2 preselected for Send, in the order given
    ?target=code|chat            which of Send's rows opens selected
    ?lang=en-US               recognition language, default the browser's
    ?use=<ref>                pin the lib chain to a branch for previewing
    ?file=owner/repo[@ref]:path  open that file into the buffer (file mode)

  FILE MODE opens an existing file instead of a blank page, so the same pad,
  voice and keyboard revise a document rather than start a note. Added
  2026-09-24, because nothing in the estate opened an arbitrary markdown file,
  took edits, and committed it back. Five things change and nothing else does:

    THE BOTTOM ROW IS COPY AND SEND. Jot and Drop file a note somewhere new,
    which is the wrong act for words that already have a home. Send opens the
    same sheet as ever with two things added: WHAT GOES (the edit as a patch,
    or the whole file) above the rows, and SAVE TO GITHUB as the first row, so
    committing is one destination among the places the edit can go rather than
    a button of its own.

    SAVE WRITES WITH THE SHA IT LOADED, AND NOTHING ELSE. It does not go
    through GH.prototype.save, whose recovery answers a 409 by fetching the
    current sha and writing again: right for the estate's own JSON, and a
    silent overwrite of somebody else's edit here. A conflict is reported, the
    buffer stays, and Reload is the way back to what GitHub holds.

    THE DRAFT IS KEYED TO THE FILE and carries the sha it was begun from, so an
    interrupted edit reopens in the file it belongs to, and a save of it still
    conflicts if the file moved in the meantime.

    NOTHING STARTS LISTENING ON ARRIVAL. The remembered grant opens a blank
    page into the microphone, which is what a blank page is for; a document is
    opened to be read first, and words landing at its end unasked are damage.

    THE TYPE IS SMALLER, 17px against 21, since a document is read at reading
    distance and a note is spoken at arm's length.

    AND IT HAS TWO FACES, on a toggle in the header. SOURCE is the buffer as
    this page has always drawn it. RENDERED is the document as it reads, and
    it is not a preview: kits/md-surface.js answers the same three questions
    Dictate.paint does (draw, point to offset, on the words or not) over the
    rendered markdown, so every gesture here works on it and every edit is still
    an edit to the markdown string. A markdown file opens Rendered. A third,
    read-only CHANGES face (kits/md-diff.js) was retired on 2026-09-29: with
    the change cards below it showed the same edit a second time, and what it
    alone had, a count and next and previous, moved onto the Rendered face.

    TYPING WORKS IN THE RENDERED FACE TOO, through an invisible textarea that
    holds the caret's line of source (see startTyping). A wrapper such as
    `**…**` stays while one character of it remains and goes with the last;
    backspace at the start of a heading or item drops its marker; Enter makes a
    paragraph, or the next list item.

    AND IT TRACKS CHANGES IN PLACE, the way a word processor does. Each run
    of blocks that differs from GitHub's copy is drawn as one CARD in the flow,
    open to typing: removed words struck, added words green, both where they
    stand, and a block taken out struck whole. Deleting an original word strikes it; typing shows green; deleting
    your own green text simply removes it, since the changes are the difference
    between the buffer and the base rather than a log. Struck words are drawn
    and never mapped, so the caret cannot land in them; tapping one offers it
    back. A card's stops pill reads original, marked and new: original is
    GitHub's text, read-only; new is the text clean, still open to typing. A
    tap on a stop or a sideways swipe picks one, a tap on the original returns
    to marked, and an edit forgets every original; its number wears an × that
    discards the change. A pill in the pane's corner counts the cards and
    steps between them. Track changes in the menu turns the cards off. kits/md-surface.js (tracked) draws them.

    PARAGRAPHS ARE JOINED, SPLIT AND CARRIED BY HAND. Backspace at a
    paragraph's start joins it to the one above; a long press on the space
    between two sentences offers Split; a long press inside a selection (a
    drag, under a mouse) carries it, to between two words or onto a gap as a
    paragraph of its own. Each is one undo step, in kits/dictate.js (join,
    split, move); the methods beside paintExtras below say how they are drawn.
    In a change card, a gray bar in the text marks where a paragraph break was
    closed, or in the original, where one will be opened.

    NATIVE SELECTION, a menu option (or ?sel=native), hands selecting in the
    Rendered face to the platform: its long press, handles and callout. The
    buffer's range follows the platform's selection, a tap still places the
    caret, and a Move pill under a selection carries it to the next place
    tapped. Split then comes from the shifted ¶ at a caret. See nativeSync.

    A CHANGE IS DISCARDED FROM ITS OWN CARD, the × on its number, which puts
    that block back as GitHub has it (mdDiff.revert). The whole edit leaves by
    Send: a Claude Code session gets the patch with a line saying
    where it belongs, Share and Copy in the sheet's foot get the bare patch
    (`git apply` takes it). Copy in the bottom row copies the whole buffer.

  THE ONE TAP ON ARRIVAL is not a design choice. WebKit needs a user gesture
  before it will raise the microphone prompt, so a page cannot start listening
  on its own the first time. Once the reader has allowed it, the grant is
  remembered here and the next arrival starts listening with no tap at all;
  a refusal or a throw falls back to the tap target rather than asking again.
-->

<style>
[x-cloak]{display:none!important}

/* ── The selection lock ──────────────────────────────────────────────────
   A STYLESHEET, not an inline style, which is the composer's rule and the
   reason it has one. `-webkit-touch-callout` is absent from the CSSOM's
   property list, so inline it survives only as authored attribute text and
   ANY later `.style.foo =` on that element re-serializes the attribute from
   the parsed declarations and drops it, silently. A rule here is parsed once
   and cannot be clobbered.

   And it covers the WHOLE surface, not just the painted text. Measured
   2026-08-24 after the field report: the text host read user-select:none and
   the scroll box around it read auto, so every press in the padding and in
   the empty canvas below the last line, which is most of the screen, raised
   the platform's own selection and its callout bubble over the words.

   touch-action rides along because it does NOT inherit: the host and the
   painted spans both computed `auto` under a layer set to manipulation, and
   a phone reads a double tap on auto as a request to zoom. That is now the
   gesture that opens the keyboard, so the reader got both. Inline values win
   on specificity, which is how the pad keeps its `none`. */
[data-dictate-ui], [data-dictate-ui] * {
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
[data-dictate-ui] textarea, [data-dictate-ui] input {
  -webkit-touch-callout: default; -webkit-user-select: text; user-select: text;
}
/* NATIVE SELECTION (the menu's option) hands the Rendered face's words back to
   the platform: its long press, its handles, its callout. Controls in the
   cards stay out of it, so a selection never picks up a pill's label. */
[data-dictate-ui] [data-native-sel], [data-dictate-ui] [data-native-sel] * {
  -webkit-touch-callout: default; -webkit-user-select: text; user-select: text;
}
[data-dictate-ui] [data-native-sel] [data-md-ui], [data-dictate-ui] [data-native-sel] [data-md-ui] * {
  -webkit-user-select: none; user-select: none;
}

/* A PIN IS FURNITURE WHILE ANYTHING IS DRIVING IT, the pad or the pin's own
   drag. A pin's hit box is 32px wide, so caret-from-point keeps answering with
   the pin rather than with the word under it, and the edge does not move until
   the aim point has cleared it. The composer measured the cost at a 32px dead
   band per pin, stepping 13, 15, 17 across a 120px sweep. Taps still arm a
   pin; only for the length of a drag is it transparent, and a pin dragging
   ITSELF needs this most of all, since the aim point tracks the pin. */
[data-dictate-pad] [data-edge] { pointer-events: none; }

/* THE PANE HAD ONE MORE RULE HERE AND NO LONGER NEEDS IT. It read
   `touch-action: pan-y pinch-zoom`, taking the horizontal axis off the
   browser so that a sideways drag could select. That drag is now the mouse's
   alone (see "A PLAIN DRAG IS THE MOUSE'S" in the move handler), so the axis
   went back and `manipulation` above covers the pane like everything else.

   The measurement that settled it: with 300 words in the buffer the pane's
   scrollWidth was 390 against a clientWidth of 390. There is no horizontal
   overflow and there never was, so the axis the page had taken was one the
   browser had nothing to do with. Giving it back costs nothing and removes
   the one gesture on this page whose behaviour depended on its direction. */
</style>

<script type="module">
  const q = new URLSearchParams(location.search);
  // NO FOCUS ZOOM. Safari zooms the page when the keyboard opens on a field it
  // judges too small, and reported 2026-09-24 on file mode's 17px textarea
  // inside a toss. The cause at that size is not established; the remedy is
  // the one kits/annotate.js settled on for the same report at 16px:
  // maximum-scale=1 on the TOP document's viewport meta, which stops the focus
  // zoom and leaves pinch zoom alone (iOS ignores it for gestures since iOS 10).
  // This page's own meta carries it statically; a same-origin shell around it
  // (the toss) gets it here. A cross-origin top is left alone.
  try {
    if (window.top !== window) {
      const top = window.top.document;
      let m = top.querySelector('meta[name=viewport]');
      if (!m) { m = top.createElement('meta'); m.name = 'viewport'; top.head.appendChild(m); }
      const parts = (m.getAttribute('content') || 'width=device-width, initial-scale=1')
        .split(',').map((x) => x.trim()).filter((x) => x && !/^maximum-scale/.test(x));
      m.setAttribute('content', parts.concat('maximum-scale=1').join(', '));
    }
  } catch {}
  const ref = q.get('use');
  // THE PAGE ADOPTS ITS OWN PRE-BUILD (dist/dictate.js), and the reason is
  // arrival time on a phone rather than bytes. The gh.load chain below is a
  // WATERFALL: each await is a round trip that cannot start until the one
  // before it ends, and gh-boot's own eight sit inside the first of them.
  // Measured 2026-09-08 on this page: 25 requests, fourteen of them serial
  // contents-API calls to api.github.com, which is uncached and rate-limited.
  // On a phone that is seconds of pure serialization, and it is exactly what
  // "slow the first time, fast on the second" describes: nothing was wrong but
  // the cache was cold.
  //
  // The build is the same loader with GH.prototype.get served from an inlined
  // cache, so every gh.load below still runs and simply costs no network. One
  // same-origin request of 189k (64k over the wire) replaces the fourteen.
  //
  // It is walked from THIS page's reach (tools/build/build.mjs), not the whole
  // library: dist/web-tools.js would be 1.4 MB gzipped for a page that touches
  // a tenth of it. Tracked, refreshed by the commit hook, and held to its
  // sources by tools/test/derived-artifacts.test.mjs.
  //
  // ?use=<ref> keeps working the way the app's does: the build is fetched from
  // raw.githubusercontent at that ref and blob-imported, since jsDelivr's /gh/
  // cache holds a branch name for hours and a preview has to be the tip.
  if (ref) {
    let sha = /^[0-9a-f]{40}$/.test(ref) ? ref : '';
    if (!sha) {
      try {
        const r = await fetch(`https://api.github.com/repos/mehrlander/web-tools/commits/${encodeURIComponent(ref)}`,
                              { headers: { Accept: 'application/vnd.github.sha' } });
        if (r.ok) sha = (await r.text()).trim();
      } catch {}
    }
    const at = sha || ref;
    const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${at}/dist/dictate.js`, sha ? {} : { cache: 'no-store' });
    if (!src.ok) throw new Error(`?use=${ref}: could not fetch the build (HTTP ${src.status})`);
    const u = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
    try { await import(u); } finally { URL.revokeObjectURL(u); }
  } else {
    await import('../dist/dictate.js');
  }
  await gh.load('gh-auth.js');
  await gh.load('gh-store.js');
  await gh.load('kits/dictate.js');
  // The fifth destination's link minter (window.PromptLink). Not in BOOT: the
  // only other consumer is app/index.html, and neither is on the chain every
  // page carries.
  await gh.load('kits/prompt-link.js');
  // The composer-to-page handoff, read once at init. See kits/dictate-handoff.js.
  await gh.load('kits/dictate-handoff.js');
  // File mode's Unwrap lines (window.mdUnwrap). Loaded for every arrival, since
  // a literal path is what lets the pre-build carry it; it is 5k and does nothing
  // until asked.
  await gh.load('kits/md-unwrap.js');

  const REGISTRY = 'mehrlander/web-tools-private';
  const JOTS = 'lists/jots.json';
  const AUTOCORRECT = 'lists/autocorrect.json';
  const DRAFT = 'dictate:draft';
  // What a handoff displaced, kept so replacing is not discarding. One slot,
  // overwritten by the next arrival and spent by restoring it: a queue here
  // would be a second draft store nobody asked for.
  const ASIDE = 'dictate:aside';
  const GRANT = 'dictate:granted';
  const VIEW = 'dictate:view';

  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // A destination address: "owner/repo[@ref]:dir". The same grammar every
  // envelope here uses, so ?dest= reads like a stage item rather than like a
  // third way of naming a place.
  const parseDest = (s) => {
    const m = /^([^/\s]+\/[^@:\s]+)(?:@([^:\s]+))?:(.*)$/.exec(String(s || '').trim());
    return m ? { repo: m[1], ref: m[2] || '', dir: m[3].replace(/^\/|\/$/g, '') } : null;
  };
  const DEST = parseDest(q.get('dest')) || { repo: 'mehrlander/home', ref: '', dir: 'chron/dump' };
  // File mode's address, in the same grammar with a file where the directory
  // was. Null is the blank page, which is every arrival without ?file=.
  const FILE = ((f) => f && f.dir ? { repo: f.repo, ref: f.ref, path: f.dir } : null)(parseDest(q.get('file')));
  const FILE_DRAFT = FILE ? `dictate:file:${FILE.repo}@${FILE.ref}:${FILE.path}` : '';

  // Base64 of UTF-8, chunked: a spread of a whole document's bytes into
  // String.fromCharCode overruns the argument limit somewhere past 100 KB.
  const b64 = (s) => {
    const u = new TextEncoder().encode(s);
    let bin = '';
    for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(bin);
  };

  document.addEventListener('alpine:init', () => {
    Alpine.data('dictate', () => ({
      // The buffer is the kit's. Everything below is a mirror it writes
      // through onText, so there is one answer to "what has been said" and
      // this component is a view of it, never a second copy.
      d: null,
      text: '', interim: '', armed: null, beat: 0,
      // A REAL PIN, as against 'anchor', which is armed with nothing drawn.
      // Everything that reaches into the overlay for a handle asks this
      // rather than `armed`, since 'anchor' would send it looking for an
      // element that does not exist.
      get pinned() { return this.armed === 'start' || this.armed === 'end'; },
      listening: false, err: '',
      started: false,           // has the reader ever begun (the tap target)
      elapsed: 0, since: 0,
      edit: false, draft: '',
      breaks: false,
      menu: false, autoOpen: false,
      // ?to=share still paints this row, which is where Share went. An address
      // written before the fold should not stop naming anything.
      dest: (q.get('to') === 'share' ? 'send' : q.get('to')) || 'copy',
      // ── Send: state ────────────────────────────────────────────────────
      // The sheet is closed and the selection is empty until asked for, so a
      // page that is only ever dictated into pays nothing for this at all. The
      // repo list is fetched on first open and never again.
      sendOpen: false,
      sendTarget: q.get('target') || 'code',
      sendRepos: (q.get('repo') || '').split(',').map((x) => x.trim()).filter(Boolean),
      repoList: null,           // null = never fetched, [] = fetched and empty
      repoErr: '',
      autoFrom: '', autoTo: '',
      corrections: [], autoRe: null,
      restored: 0,              // how many characters came back from a draft
      // Of those, how many arrived from a composer on another page, and what
      // that page was. Reported rather than merged silently: a buffer that
      // gained words the reader did not speak here has to say so.
      arrived: 0, arrivedFrom: '',
      // The draft a handoff displaced, offered back in the band. Empty is the
      // ordinary case: nothing was here, or it has already been brought back.
      aside: '',
      saving: '',
      canShare: typeof navigator !== 'undefined' && !!navigator.share,
      destName: DEST.repo.split('/')[1] + '/' + DEST.dir,
      _wake: null,
      // ── File mode ───────────────────────────────────────────────────────
      // `fileBase` is the text GitHub holds at `fileSha`, as far as this page
      // knows, and `dirty` is the buffer measured against it.
      file: FILE,
      fileSha: '', fileBase: null, fileErr: '', fileLoading: false,
      get fileName() { return FILE ? FILE.path.split('/').pop() : ''; },
      // The line under the name on a phone: the repository and the folders.
      get fileDir() { return FILE ? [FILE.repo.split('/')[1], ...FILE.path.split('/').slice(0, -1)].join('/') : ''; },
      get fileWhere() { return FILE ? FILE.repo.split('/')[1] + (FILE.ref ? '@' + FILE.ref : '') + ':' + FILE.path : ''; },
      get fileUrl() { return FILE ? `https://github.com/${FILE.repo}/blob/${FILE.ref || 'HEAD'}/${FILE.path}` : ''; },
      // Which face of the file the pane shows. Rendered is where a markdown file
      // opens: the document as it reads, still aimed at by offset into its source
      // through kits/md-surface.js, so the pad, the pins, the long press and the
      // voice all work on it. Source is the markdown itself; Changes is the
      // document against what GitHub holds, read-only.
      // A stored 'changes' is from before that face was retired, and opens Rendered.
      view: FILE ? ((/\.(md|markdown)$/i.test(FILE.path) && ['source', 'rendered'].includes(ls.get(VIEW)) && ls.get(VIEW)) || (/\.(md|markdown)$/i.test(FILE.path) ? 'rendered' : 'source')) : 'source',
      mdReady: false, changesCount: 0,
      // Typing into the Rendered face: the sink has focus and the keyboard is up.
      typing: false, composing: false,
      // Marks for what changed since GitHub's copy, drawn over the Rendered
      // face (kits/md-surface.js). On unless the reader turned them off.
      showMarks: ls.get('dictate:marks') !== '0',
      // THE PLATFORM'S OWN SELECTION, as an option: Native selection in the
      // menu, or ?sel=native. See nativeSync. Rendered face only, and not
      // while typing, where the sink owns the keyboard and a selection gesture
      // on the words would take focus from it.
      nativeSel: q.get('sel') ? q.get('sel') === 'native' : ls.get('dictate:sel') === 'native',
      moveArm: null,            // native: the range the target picked up to move
      moveAim: null,            // native: where a tap on the text aimed the held words
      dnd: null,                // native: words the platform is dragging, and where they would land
      get moveReady() { this.beat; const r = this.d && this.d.range; return !!(this.native && !this.moveArm && r && r.start !== r.end); },
      _lastNative: '',          // native: the platform's selection as last seen, "a:b"
      get native() { return this.nativeSel && this.rendered && !this.typing && !this.edit; },
      wordPop: null,            // a tapped mark's undo: { text, a, b, x, y, t }
      cardInfo: null,           // a card's Info panel: { i, old, now, ow, nw, x, y }
      hoverCard: null,          // the card a mouse is over, for its bar
      selCard: null,            // a card picked by its number: { i, at }, while the caret stays at `at`
      patchMenu: false,
      // File mode's Send: what rides, the edit as a patch or the whole file.
      sendWhat: 'patch',
      get rendered() { return !!FILE && this.view === 'rendered' && this.mdReady; },
      get dirty() {
        this.beat;
        return !!FILE && this.fileBase !== null && (this.edit ? this.draft : this.text) !== this.fileBase;
      },

      get token() { return window.TOKEN || ls.get('ghToken') || ''; },
      get words() { const t = (this.text + ' ' + this.interim).trim(); return t ? t.split(/\s+/).length : 0; },
      get clock() {
        const s = Math.floor(this.elapsed / 1000);
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      },
      get empty() { return !this.text.trim() && !this.interim.trim(); },
      // Nothing to send, which is not the same as an empty BUFFER: in the
      // keyboard half the words are in the draft and the buffer is behind it.
      // A getter because four destinations read it, where Save read it once
      // inline and the fifth reader would have got it wrong.
      get blank() { return this.empty && !this.draft.trim(); },
      get sel() { this.beat; return !!(this.d && this.d.hasSelection); },
      get stitchable() { this.beat; return !!(this.d && this.d.canStitch); },
      // The key says which of the three repairs it would make (kits/dictate.js
      // `stitchAim`), because they are not the same act and the reader cannot
      // see which applies. Read on hover and on a long press, which is where a
      // title is read at all; the key itself stays a glyph.
      get stitchNote() {
        this.beat;
        const aim = this.d && this.d.stitchAim;
        if (aim === 'caret') return 'Close the break your caret is on: the full stop goes and the capital comes down';
        if (aim === 'back') return 'Close the most recent sentence break: the full stop goes and the capital comes down';
        return 'No sentence break to close. A full stop at the very end is the backspace\u2019s job.';
      },
      get jumpable() { this.beat; return !!(this.d && this.d.canJumpBack); },
      // ARMED, NOT DONE. The first tap on the stitch shows where it would
      // happen and commits nothing; the second one does it. A repair that
      // rewrites a sentence somewhere off screen is the one edit on this page
      // worth a look before it lands, and the marker is a preview of the edit
      // rather than a highlight over it, so the look is worth the tap.
      //
      // The seam itself is not held here: it is read from the kit each paint,
      // so the step-back key moves the marker by moving the caret and no second
      // notion of "where" can drift from the first.
      mendArmed: false,
      get breakable() { this.beat; return !this.edit && !!this.text && !!(this.d && this.d.segments.length); },
      get canUndo() { this.beat; return !!(this.d && this.d.canUndo); },
      get canRedo() { this.beat; return !!(this.d && this.d.canRedo); },
      get capsArmed() { this.beat; return !!(this.d && this.d.capitalArmed); },

      // THE PAD, ported from the notes composer (kits/annotate.js) rather than
      // from the stage's card, which is where this page's first cut came from
      // and which is a version behind. Three keys and a shift, four faces:
      //
      //   PRIMARY   . , ?          the marks ordinary prose runs on
      //   SHIFTED   ; ! ¶          reached for deliberately, worth a second tap
      //   CASING    AB ab Ab       while a selection is live, since a selection
      //                            is made to fix a word far more often than to
      //                            punctuate one
      // The page's own six-across row is retired with the arrow cluster: it was
      // reasoned from the width a page has and the composer does not, which was
      // true and beside the point once the composer had moved on.
      //
      // THE STITCH IS NO LONGER ONE OF THESE FACES. It used to replace the full
      // stop whenever a caret sat in a sentence gap, on the reasoning that a
      // full stop cannot be wanted where one already sits. That reasoning held
      // for a caret and broke the moment the key learned to reach back on its
      // own (kits/dictate.js): a buffer with any invented break in it can now
      // be repaired, which is nearly always, and a key that swallowed the full
      // stop nearly always would leave no way to type one. So it has a slot of
      // its own in the row below, always there, and this face is a full stop
      // again.
      get pad() {
        // FILE MODE TRADES TWO MARKS FOR FORMATTING. A document is headed,
        // listed, bolded and coded far more than it is exclaimed at: measured
        // across this repo's markdown, inline code is 69% of inline marks and
        // bold 22%, and headings and list items with paragraphs are 91% of
        // blocks. Heading and list act on the caret's line, so they need no
        // selection and take the shifted face; bold and code wrap a selection,
        // so they take the selection face, and casing moves behind its shift.
        if (FILE) {
          if (this.sel && this.shift) return [
            { k: 'AB', t: 'Upper case' }, { k: 'ab', t: 'Lower case' }, { k: 'Ab', t: 'Capitalise' },
          ];
          if (this.sel) return [
            { k: 'B', t: 'Bold: wrap the selection in **, or unwrap it' },
            { k: '`', t: 'Code: wrap the selection in backticks, or unwrap it' },
            { k: 'H', t: 'Heading: the line becomes ##, then ###, then plain' },
          ];
          if (this.shift) return [
            { k: 'H', t: 'Heading: the line becomes ##, then ###, then plain' },
            { k: '•', t: 'List: the line, or every selected line, gains or loses its - marker' },
            { k: '¶', t: 'New paragraph' },
          ];
        }
        if (this.sel) return [
          { k: 'AB', t: 'Upper case' }, { k: 'ab', t: 'Lower case' }, { k: 'Ab', t: 'Capitalise' },
        ];
        if (this.shift) return [
          { k: ';', t: 'Semicolon' }, { k: '!', t: 'Exclamation point' }, { k: '¶', t: 'New paragraph' },
        ];
        return [
          { k: '.', t: 'Full stop' },
          { k: ',', t: 'Comma' }, { k: '?', t: 'Question mark' },
        ];
      },

      init() {
        document.addEventListener('selectionchange', () => this.nativeSync());
        // THE PLATFORM'S OWN DRAG, under native selection: a phone lifts held
        // selected words and a desktop drags them. The Rendered face is not a
        // text field, so nothing would take the drop, and it is taken here:
        // the dragover says where the words would land (the carry's marker),
        // the drop moves them through the kit, one undo step.
        this.$nextTick(() => {
          const md = this.$refs.md;
          if (!md) return;
          md.addEventListener('dragstart', (e) => {
            const r = this.d && this.d.range;
            if (!this.native || !r || r.start === r.end) return;
            this.dnd = { a: r.start, b: r.end, target: null };
            try { e.dataTransfer.effectAllowed = 'copyMove'; } catch {}
          });
          md.addEventListener('dragover', (e) => {
            if (!this.dnd) return;
            e.preventDefault();
            try { e.dataTransfer.dropEffect = 'move'; } catch {}
            this.dnd.target = this.dropAt(e.clientX, e.clientY, this.dnd);
            this.dnd.x = e.clientX; this.dnd.y = e.clientY;
            this.paintExtras();
          });
          md.addEventListener('drop', (e) => {
            if (!this.dnd) return;
            e.preventDefault();
            const m = this.dnd, tg = this.dropAt(e.clientX, e.clientY, m);
            this.dnd = null;
            if (tg) this.d.move(m.a, m.b, tg.at, tg.para);
            this.paint();
          });
          md.addEventListener('dragend', () => { if (this.dnd) { this.dnd = null; this.paint(); } });
          // WHILE WORDS ARE HELD FOR A MOVE, NOTHING ELSE MAY TAKE A DRAG, and
          // above all not the sheet an iPhone presents this page in, which
          // closes on a downward drag (docs/ios-sheet-drags.md). Holding is a
          // deliberate opening act, the one thing that note says a scrolling
          // pane needs before it can hold a drag at all, so here the whole page
          // takes variant D: a cancelled touchstart, so no scroll begins, and a
          // cancelled touchmove on the node the touch started on, since a
          // listener on an ancestor goes quiet if that node is rebuilt. A
          // control keeps its touchstart, or its tap would be lost with it, and
          // loses only its touchmove, which a tap does not need.
          this.$el.addEventListener('touchstart', (ev) => {
            if (!this.moveArm || !this.native) return;
            const t = ev.target;
            if (!t?.closest?.('button, input, textarea, select, a, [data-md-ui]')) ev.preventDefault();
            const hold = (m) => m.preventDefault();
            const off = () => { t.removeEventListener('touchmove', hold); t.removeEventListener('touchend', off); t.removeEventListener('touchcancel', off); };
            t.addEventListener('touchmove', hold, { passive: false });
            t.addEventListener('touchend', off);
            t.addEventListener('touchcancel', off);
          }, { passive: false });
        });
        this.d = window.Dictate.create({
          lang: q.get('lang') || undefined,
          fix: (s) => this.autocorrect(s),
          // WORDS landing end the armed state: the seam they were aimed at may
          // not be the newest any more, and a marker that survived the change
          // would point at a break the reader has stopped thinking about.
          //
          // A CHANGE IN THE TEXT, not any call. The kit reports through onText
          // after a caret move too, and the step-back key IS a caret move: a
          // blanket disarm here would put the marker out on the very tap meant
          // to re-aim it. Moving the caret re-derives the marker instead, which
          // is why nothing here has to special-case the jump.
          onText: (t) => {
            if (t !== this.text) this.mendArmed = false;
            // Words held for Move name offsets, and an edit moves them.
            if (t !== this.text) { this.moveArm = null; this.moveAim = null; this.cardInfo = null; this.wordPop = null; }
            // A CARRY IS OVER WHEN THE TEXT MOVES UNDER IT: its range names
            // the words it picked up, and a final result from the microphone
            // replaces exactly those. The drop's own edit arrives after the
            // carry has ended, so it never cancels itself.
            // Only a change that reaches the carried words ends it: words
            // appended further on leave the range naming what it named.
            const mv = this.mover;
            if (mv && t !== this.text && t.slice(mv.a, mv.b) !== this.text.slice(mv.a, mv.b)) { this.mover = null; this.stopEdgeScroll(); }
            this.text = t; this.heard(); this.save(); this.paint();
          },
          onInterim: (t) => { this.interim = t; this.heard(); this.paint(); },
          onState: () => {
            this.listening = !!(this.d && this.d.listening);
            if (this.listening) this.wake(); else this.unwake();
          },
          onError: (m) => {
            this.err = m;
            // A refusal invalidates the remembered grant, so the next arrival
            // asks with a tap rather than starting into a denied microphone.
            if (/not-allowed/.test(m)) ls.del(GRANT);
          },
        });

        // An interrupted session comes back. A finished one does not: `save`
        // is cleared wherever the words reach somewhere durable, so a blank
        // page here means the last note was filed, not that one was lost.
        // A HANDOFF REPLACES A STORED DRAFT, and does not join it. Both are
        // "words that were here before", but one was sent HERE, deliberately,
        // seconds ago, and the other is whatever this page was last left
        // holding.
        //
        // IT USED TO JOIN THEM, on the reasoning that nothing should be lost
        // and the reader could cut what they did not want. What that missed is
        // that this page SAVES what it is shown: an arrival was joined, saved
        // over the draft key, and then joined again by the next arrival, so
        // expanding a second note opened on the first one stacked above it and
        // a third opened on both. The pile grows by one note per expand, which
        // is what "it is showing content it held from storage" describes.
        //
        // NOTHING IS SILENTLY DISCARDED EITHER. The draft that was here is set
        // aside under its own key and offered back in the band above the words,
        // one tap, above whatever is there by then. That is the same join, made
        // when the reader asks for it rather than guessed on their behalf.
        // File mode takes neither: the buffer is the file, and a handoff left
        // untaken stays in its slot for the next blank page.
        const sent = FILE ? null : (window.dictateHandoff?.take?.() || null);
        const held = FILE ? '' : (ls.get(DRAFT) || '').replace(/\s+$/, '');
        this.aside = FILE ? '' : (ls.get(ASIDE) || '').replace(/\s+$/, '');
        if (FILE) {
          this.loadFile();
        } else if (sent) {
          this.d.text = sent.text.replace(/\s+$/, '');
          // The newest set-aside wins: an older one the reader has walked past
          // twice is not what "bring back what was here" means to them.
          this.aside = held;
          if (held) ls.set(ASIDE, held); else ls.del(ASIDE);
          this.restored = this.d.text.length;
          this.started = true;
          this.arrived = sent.text.length;
          this.arrivedFrom = sent.at;
        } else if (held) {
          this.d.text = held;
          this.restored = this.d.text.length;
          this.started = true;
        }

        // A TARGET THE SHEET NO LONGER HAS falls back rather than stranding it.
        // `?target=share` was valid until 2026-09-06 and is a link somebody may
        // have saved; left alone it selected no row, disabled the primary
        // button, and printed "unknown target" as though the reader had done
        // something wrong. Caught by a screenshot, which is the only place a
        // dead address of this kind shows itself.
        const keys = (window.PromptLink?.targets || []).map((t) => t.key);
        if (keys.length && !keys.includes(this.sendTarget)) this.sendTarget = keys[0];

        this.loadCorrections();
        // Paint AFTER binding, not only from onText. A restored draft is
        // assigned in init(), which runs before $refs.body exists, so its
        // paint had nowhere to land and the page came back blank with the
        // words sitting in the buffer behind it. Found by the browser check.
        this.$nextTick(() => { this.bind(this.$refs.body); this.paint(); });
        setInterval(() => { if (this.listening) this.elapsed = Date.now() - this.since; }, 500);

        // Backgrounding kills the recognition outright, below anything the
        // kit's relaunch timer can see: the page is frozen, so the timer does
        // not run either. Coming back visible is the only moment that can
        // notice, and it restarts only what the reader never stopped.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible') return;
          if (this.listening) { this.d.start(); this.wake(); }
        });

        this.bindKeys();

        // The remembered grant. WebKit will not raise the microphone prompt
        // outside a user gesture, so the first arrival must be tapped; after
        // that the permission is the site's and the page can simply begin.
        if (!FILE && ls.get(GRANT) && this.d.available()) this.begin();
      },

      // ── File mode: load and save ──────────────────────────────────────
      // A held draft wins over the file, with the sha it was begun from, so
      // saving it conflicts if the file moved since. `fresh` discards it,
      // which is what Reload and the band's Start fresh mean here.
      async loadFile(fresh = false) {
        if (!FILE) return;
        this.fileLoading = true; this.fileErr = '';
        if (fresh) ls.del(FILE_DRAFT);
        let held = null;
        try { held = JSON.parse(ls.get(FILE_DRAFT) || 'null'); } catch {}
        try {
          const gh2 = new window.GH({ token: this.token, repo: FILE.repo, ref: FILE.ref || '' });
          const res = await gh2.get(FILE.path, window.GH.FRESH);
          this.fileBase = res.text;
          if (held && typeof held.text === 'string' && held.text !== res.text) {
            this.fileSha = held.sha || res.sha;
            this.d.text = held.text;
            this.restored = held.text.length;
          } else {
            this.fileSha = res.sha;
            this.d.text = res.text;
            this.restored = 0;
          }
          // A document opens at its top with the caret there, so the first
          // spoken word lands where the reader is looking. The painter follows
          // growth to the end when no range is set, which is right for a note
          // and would open every file on its last line.
          this.d.caretAt(0);
          this.started = true;
        } catch (e) {
          this.fileErr = e?.status === 404
            ? 'Not found, or this browser’s token cannot read it: ' + this.fileWhere
            : 'Could not open ' + this.fileWhere + ': ' + (e?.message || e);
        }
        this.fileLoading = false;
        this.menu = false;
        if (this.view !== 'source' && !this.fileErr) await this.setView(this.view);
        this.$nextTick(() => { this.paint(); if (this.$refs.view) this.$refs.view.scrollTop = 0; });
      },

      // ── File mode: the two faces ──────────────────────────────────────
      // The renderers load on first use, so a blank page and a source-only
      // session pay nothing for them. Literal paths, so the pre-build carries
      // them all the same.
      async ensureMd() {
        if (this.mdReady) return true;
        try {
          await gh.load('kits/md-doc.js');
          await gh.load('kits/guide-render.js');
          await gh.load('kits/standoff.js');
          await gh.load('kits/md-surface.js');
          await window.GuideRender.needMarked();
          // jsdiff, for the change marks, through md-diff's own loader so the
          // Changes face and the marks share one copy. Without it the marks are
          // simply absent.
          await gh.load('kits/md-diff.js');
          await window.mdDiff.needDiff();
          await gh.load('kits/row-menu.js');
          // NOT content-visibility:auto, though it halved a re-render on a 160k
          // file: fresh blocks lay out at their placeholder height for a frame,
          // so the caret and the selection were measured a line off, and blocks
          // above the fold kept the placeholder and moved the text under the
          // reader. Correct first; kits/md-surface.js notes the cost.
          this.$refs.md.className = window.GuideRender.bodyClass() + ' min-h-full';
          this.mdReady = true;
        } catch (e) {
          Alpine.store('toast')('warning', 'Rendered view unavailable: ' + (e?.message || e), 'alert-error', 5000);
        }
        return this.mdReady;
      },
      async setView(v) {
        if (!FILE) return;
        if (this.edit) this.editClose();
        if (this.typing) this.stopTyping();
        if (v === 'rendered' && !(await this.ensureMd())) v = 'source';
        // Each face draws its own furniture into the shared layer, so the one
        // being left takes its marks with it.
        const layer = this.$refs.layer;
        if (layer) for (const n of [...layer.querySelectorAll('[data-md-surface],[data-edge],[data-mend]')]) n.remove();
        this.view = v;
        ls.set(VIEW, v);
        this.$nextTick(() => this.paint());
      },
      // One rewrite of the whole buffer, so one undo takes it back, and unsaved
      // until Save, so the reader looks before anything is committed. The rule
      // and what it leaves alone are in kits/md-unwrap.js.
      unwrapLines() {
        this.menu = false;
        if (this.edit) this.editClose();
        this.d.flush();
        const r = window.mdUnwrap.unwrap(this.d.text);
        if (!r.joined) {
          Alpine.store('toast')('info', 'No wrapped lines to join', 'alert-info', 2500);
          return;
        }
        this.d.text = r.text;
        this.d.caretAt(0);
        this.$nextTick(() => { this.paint(); if (this.$refs.view) this.$refs.view.scrollTop = 0; });
        Alpine.store('toast')('check', `Joined ${r.joined} line break${r.joined === 1 ? '' : 's'}. Undo reverses it.`, 'alert-success', 3500);
      },
      async saveFile() {
        if (!FILE || !this.dirty) return;
        if (!this.token) {
          Alpine.store('toast')('warning', 'No token on this browser: Copy instead', 'alert-error', 5000);
          return;
        }
        if (this.edit) this.editClose();
        const text = this.outgoing();
        this.saving = FILE.repo;
        try {
          const gh2 = new window.GH({ token: this.token, repo: FILE.repo, ref: FILE.ref || '' });
          const body = { message: `Edit ${this.fileName} via dictate`, content: b64(text), sha: this.fileSha };
          if (FILE.ref) body.branch = FILE.ref;
          const res = await gh2.req('contents/' + FILE.path, { method: 'PUT', body: JSON.stringify(body) });
          this.fileSha = res.content.sha;
          this.fileBase = text;
          this.restored = 0;
          ls.del(FILE_DRAFT);
          this.paint();             // the base moved, so the change marks clear
          Alpine.store('toast')('check', 'Saved ' + this.fileWhere, 'alert-success', 3200);
        } catch (e) {
          const conflict = e?.status === 409 || e?.status === 422;
          Alpine.store('toast')('warning', conflict
            ? 'Not saved: the file changed on GitHub after you opened it. Copy your text, then Reload.'
            : 'Not saved: ' + (e?.message || e), 'alert-error', 8000);
        }
        this.saving = '';
        this.beat++;
      },

      // ── The two modifier taps ─────────────────────────────────────────
      // A desk is not this page's home, but it is where a long note actually
      // gets dictated, and there the two hands are free and idle. Both keys
      // say the same kind of thing, which is why they are a pair: the engine
      // is about to guess a sentence boundary wrong, and only the reader knows
      // it, because only the reader knows what they are about to say.
      //
      //   CONTROL   this is not a new sentence. The pause wrote a full stop
      //             and the words still to come belong to what came before.
      //   SHIFT     the next word is a capital: a name, a product, an
      //             initialism the recognizer has no way to hear as one.
      //
      // A TAP, NOT A CHORD, and that is the whole difficulty. The reader's
      // hands are not on the keys and there is no second key to press, so the
      // gesture is press-and-release with nothing in between. `keydown` alone
      // cannot serve: it fires as the first half of Ctrl+C, it repeats while

      // release is what acts. That is the standard read of a bare modifier and
      // it is the reason this is fifteen lines rather than two.

      // Shift cannot, since the word it capitalizes has not been said, so it
      // arms the kit and the header wears the indicator until a word spends it.
      bindKeys() {

        // and any focus leaving the page clears it: all three mean the press
        // was part of something else.
        let tap = null;
        const cancel = () => { tap = null; };
        const mine = (e) => !this.edit
          && !e.target?.closest?.('input, textarea, select, [contenteditable]');

        addEventListener('keydown', (e) => {
          if (mine(e) && this.shortcut(e)) return;
          // A character typed at the Rendered face with no keyboard open opens

          if (this.rendered && !this.typing && this.d && mine(e) && e.key.length === 1

      capitalize() {

      // ── Starting ──────────────────────────────────────────────────────

      heard() {

        // speech wrote a microphone grant nobody had given and cleared the

        if (this._heard || !this.listening) return;

      save() {

      // ── The painted surface and its gestures ──────────────────────────
      // The notes composer's set, which is a version on from the stage's and
      // differs in what the reader is given to aim WITH:
      //
      //   long press ON the words   take the word under the finger
      //   ...and keep dragging      extend from that word, arming as it goes
      //   long press OFF them       open the keyboard, caret where it was
      //   double tap                open the keyboard, caret where it landed
      //   single tap                place the caret, or move an armed edge
      //   tap a pinhead             arm that edge, or put it down
      //   drag a pinhead            move that edge, one to one
      //   drag a finger anywhere    scroll, and only scroll
      //   mouse drag                select, for a pointer that has no problem
      //
      // THE LAST TWO ARE ONE DECISION. A finger has exactly one way to scroll
      // this pane, so a finger drag cannot also mean select; a cursor has a
      // wheel, so a cursor drag can. The page spent two days trying to split
      // the difference by direction, sideways selecting and vertical
      // scrolling, and the rule worked without ever being legible: nothing on
      // screen could teach it, and the reader who dragged the wrong way found
      // a surface that looked broken. On touch the long press is the way in,
      // which is what the phone already means by it on a page you are reading.
      //
      // No triple, and no arrow cluster. The triple's select-all cannot
      // survive the double opening a keyboard: the second tap swaps the read
      // surface for a textarea and the third lands somewhere this listener
      // cannot hear. The arrows are retired by the pad below, which drags an
      // armed pin with the same gesture it drags the caret.
      // A CLIENT POINT AS AN OFFSET INTO THE BUFFER, which is the one question
      // every gesture here asks. Three of them used to carry their own copy of
      // this, differing only in which local named the host.
      pointOffset(cx, cy) {
        if (this.rendered) return window.MdSurface.offsetAt(this.$refs.md, cx, cy);
        const host = this._host;
        if (!host) return null;
        const doc = host.ownerDocument;
        const r = doc.caretRangeFromPoint ? doc.caretRangeFromPoint(cx, cy) : null;
        const pt = !r && doc.caretPositionFromPoint ? doc.caretPositionFromPoint(cx, cy) : null;
        const node = r ? r.startContainer : pt ? pt.offsetNode : null;
        const off = r ? r.startOffset : pt ? pt.offset : 0;
        return node ? window.Dictate.offsetAt(host, node, off) : null;
      },

      // ── THE VERTICAL AIM OF A THUMB'S DRAG ────────────────────────────
      // Horizontal is always the finger, one to one. Vertical is HELD BACK
      // until the thumb has cleared the words, then resumes, quantized to
      // lines and measured from where the hold ended rather than from the
      // grab. So placing an edge a line down costs about two lines of thumb,
      // and the first is spent getting the hand off the text.
      //
      // `lead` is how far the grip sits from the line it marks: a pin's ball,
      // signed, positive below and negative above. ZERO when the finger is on
      // the text itself, which is the long-press extend. A grip already below
      // the line spends the base hold; one above spends that plus twice its
      // own offset, which is exactly the travel that carries it down across
      // the line to where the other one started.
      //
      // Upward is immediate in every case. That direction is clearance for
      // none of them, and a hold there only makes the drag feel stuck.
      //
      // ONE RULE FOR THE TWO DRAGS A THUMB DRIVES, the long-press extend and
      // the pin, because they are one question: where is the reader aiming,
      // given that their thumb is in the way of the answer. It was three until
      // the plain drag became the mouse's alone; a cursor occludes nothing, so
      // it aims with the raw pointer and this is not in its path. The extend
      // went without it at first, on the reading that a finger on the text IS
      // the aim point and holding back would read as lag. It reads as the
      // thumb covering the boundary instead.
      // On the words, in whichever face is showing.
      hits(x, y) {
        return this.rendered ? window.MdSurface.hitsText(this.$refs.md, x, y)

      },
      DEAD_LINES: 1.5,
      dragY(y0, py, cy, lineH, lead = 0) {

      // presented in a sheet the reader dismisses by dragging down, and the
      // host decides that from the web view's SCROLL rather than from touches,
      // so a handle carrying only touch-action still lets the sheet go. This
      // is variant D of five measured on device (docs/ios-sheet-drags.md):
      // touch-action, plus a cancelled touchstart and touchmove.

      // cancel anything and browsers default both events to passive. Nothing
      // is lost: preventDefault on a TOUCH event suppresses the compatibility

      // It does suppress the compatibility CLICK, which costs nothing here
      // because the pad and the pins are driven from pointerdown.

            const i = at(x, y);
            if (i == null) return;

            // platform does: the words follow the finger until it lifts.
            const cur = this.d.range;

          const far = Math.abs(e.clientX - x) > 10 || Math.abs(e.clientY - y) > 10;

          if (carry && far) {

          // ── A LONG PRESS THAT KEEPS GOING IS ONE GESTURE ────────────────

          // press, a lift, and a second gesture to widen what it found. This
          // is the platform's own reading, and it was half here already: the
          // ordinary drag below would fire and select from the raw character
          // under the press, which threw the word away and lit no pin, so the

          // every text surface does and there is nothing to weigh it against:
          // a mouse does not scroll by dragging, so the gesture is free.

          // rather than shared. The pane has to scroll, and a drag is the only
          // way to scroll it, so a drag that also selects has to be told apart
          // from one that scrolls. The page tried the one discriminator there

          // it was still wrong. Nothing on screen can teach a rule like that,
          // a refused vertical drag fell through to the tap path and moved the
          // caret to wherever the finger lifted, and the reader who tried the

          //

          // the phone already uses for a page you are reading rather than

          // a press floors the anchor at a word, so a selection can no longer
          // BEGIN mid-word on a finger. Everything after stays character-level,
          // the far end as it extends and either edge afterwards by pin drag,

          const onText = this.hits(e.clientX, e.clientY);
          const i = onText ? at(e.clientX, e.clientY) : null;
          // The double opens the keyboard from the canvas too: tapping the
          // empty space under the words is the most obvious way of saying
          // "let me type here", and it used to be the one place that did
          // nothing, because the canvas won before the count.
          if (taps >= 2) { taps = 0; this.editOpen(i == null ? this.d.text.length : i); return; }
          // The armed anchor takes the tap first, canvas included: a tap past
          // the last word means the end of the buffer there as everywhere.
          if (this.anchorTo(i == null ? this.d.text.length : i)) return;
          if (i == null) { this.d.caretAt(this.d.text.length); this.armed = null; this.paint(); return; }
          // AND THE PLACEMENT SPENDS THE ARMING. An armed pin takes this tap,
          // moves its edge to it, and goes back to blue: the arming asked
          // "where should this edge go", the tap answered, and there is
          // nothing left for it to be live for. Wanting to move it again is
          // one tap on the pinhead, which is the same cost as leaving it lit
          // and cheaper than the alternative, since a pin left live turns the
          // NEXT tap anywhere in the text into a move nobody asked for.
          //
          // Completes the one rule the rest of the page already follows: every
          // drag ends put down, the two-tap maneuver ends put down, and now so
          // does this. An arming is spent by the action it enables.
          if (this.pinned) { this.d.moveEdge(this.armed, i); this.armed = null; }
          else this.d.caretAt(i);
          this.paint();
          if (this.typing) { try { this.$refs.sink.focus({ preventScroll: true }); } catch {} }
        });
      },
      // ── A pinhead is tapped OR dragged ────────────────────────────────
      // Tapping arms the edge so the pad can walk it, which is the gesture
      // this surface was built around: a finger dragging a selection edge
      // covers the words it is aiming at. But the BALL sits off the line, one
      // diameter above it or below it, so a finger on the ball is not over the
      // text either. The objection never applied to the handle itself, and
      // dragging one is what every reader already expects a handle to do. So
      // both, and neither costs the other anything.
      //
      // The aim point is the BAR's centre carried by the finger's delta, not
      // the finger. One to one, so what moves under the ball is what the ball
      // was already marking, and the offset between thumb and line is whatever
      // the reader chose by where they grabbed it.
      pinDown(e) {
        // THE WAY OUT OF THE ARMED STATE, and it is the thing you are looking
        // at. A confirm step with no cancel is a trap, and this one had none:
        // the stitch key commits on its second tap, so it cannot also be the
        // escape. Tapping the badge dismisses it and changes nothing.
        if (e.target?.closest?.('[data-mend]')) {
          e.preventDefault(); e.stopPropagation();

        if (!box) return;
        e.preventDefault(); e.stopPropagation();
        let which = box.getAttribute('data-edge');
        const was = this.armed === which;
        // MEASURED BEFORE ANYTHING IS PAINTED. The bar is the pin's first
        // child and it IS the text line, its last is the ball, and paint()
        // replaces the whole element, so reading either afterwards reads a
        // detached node, whose getBoundingClientRect is all zeroes and reports
        // no failure.
        const bar = box.firstElementChild, dot = box.lastElementChild;
        const br = bar?.getBoundingClientRect?.();
        const dr = dot?.getBoundingClientRect?.();
        const from = br && br.height
          ? { x: br.left + br.width / 2, y: br.top + br.height / 2, px: e.clientX, py: e.clientY }
          : null;

        // negative above. This is the whole difference between the two pins.
        const lead = from && dr && dr.height ? (dr.top + dr.height / 2) - from.y : 0;

        // Armed on the way DOWN, so the ring is under the finger before it
        // moves, and a drag never has to be told apart from a tap to paint it.
        this.armed = which;
        this.pinDrag = which;
        this.paint();
        const EDGE = 6;
        // The vertical aim is `dragY`, shared with the other two drags. What
        // this one supplies is `lead`, the ball's own offset from its stem,
        // which is why the two pins hold back by different amounts: the end's
        // ball hangs below the line so its thumb starts clear, the start's
        // hangs above so its buffer must carry the thumb down across the line
        // first. Measured at the grab rather than set as a constant, so both
        // arrive at the same thumb-below-the-aim distance.
        //
        // It also fixes the commoner accident, which is not aiming at the
        // wrong line but drifting onto one. A thumb sliding along a line to
        // place an edge does not travel straight, and without the hold a few
        // pixels of wander step the edge into the line above.

        // Fixed at the grab, not read per frame. Which pin you hold can change
        // mid-drag when the edges cross, and where your thumb physically is
        // cannot, so recomputing would jump the aim at the crossing.
        const lineH = parseFloat(getComputedStyle(this.$refs.view).lineHeight) || 26;
        let moved = false;

          if (!from || !this.d) return;
          ev.preventDefault();
          if (!moved && Math.abs(ev.clientX - from.px) < 6 && Math.abs(ev.clientY - from.py) < 6) return;
          moved = true;

          let ay = this.dragY(from.y, from.py, ev.clientY, lineH, lead);

          // to the bottom of a buffer longer than the screen would otherwise
          // stop at whatever happens to be visible.
          const v = this.$refs.view;
          if (ay >= b.bottom - EDGE && v.scrollTop + v.clientHeight < v.scrollHeight) v.scrollTop += EDGE;

          ay = Math.min(b.bottom - EDGE, Math.max(b.top + EDGE, ay));
          const i = this.pointOffset(ax, ay);
          if (i == null) return;
          const r = this.d.range;
          if (!r) return;
          const other = which === 'start' ? r.end : r.start;
          // LANDING EXACTLY ON THE OTHER EDGE IS SKIPPED, not clamped. A
          // zero-width range takes both pins off the screen mid-drag, and a
          // clamp one character short means the edges can never cross at all.
          // Skipping the frame keeps a live selection and lets the next move
          // land past it.
          if (i === other) return;
          this.d.moveEdge(which, i);
          // AND A CROSSING RENAMES THE PIN UNDER THE FINGER. setRange sorts,
          // so dragging start past end makes the dragged edge the end; follow
          // it, or the label the rest of the page is holding quietly lies.
          if (which === 'start' && i > other) which = 'end';
          else if (which === 'end' && i < other) which = 'start';
          this.armed = which;
          this.pinDrag = which;
          this.paint();
        };
        const up = () => {
          // CLEARED ON THE NEXT TICK, not here. These listeners are on the
          // document in the CAPTURE phase, so they run before the same
          // pointerup reaches the text box's own handler, and the pin is
          // destroyed and rebuilt on every paint, so that handler hit-tests
          // fresh and sees the WORDS rather than the pin it started on. The
          // pad has no such trouble: its button survives the drag and holds
          // pointer capture, so the release never reaches the text at all.
          setTimeout(() => { this.pinDrag = null; }, 0);
          // A TAP IS A DRAG THAT WENT NOWHERE, and it toggles, which is the
          // behaviour the pinheads have always had: tap to arm, tap again to
          // put down.
          //
          // A DRAG PUTS IT DOWN, and so does every other drag on this page
          // (see the text box's own release). The arming is what says which
          // end is moving WHILE it moves; letting go ends that, leaving the
          // selection and a blue pin. Same shape as the two-tap maneuver,
          // which also sets rather than staying live.
          if (moved || was) this.armed = null;
          this.paint();
          d.removeEventListener('pointermove', move, true);
          d.removeEventListener('pointerup', up, true);
          d.removeEventListener('pointercancel', up, true);
          d.body.style.userSelect = ''; d.body.style.webkitUserSelect = ''; d.body.style.touchAction = '';
        };
        d.body.style.userSelect = 'none';
        d.body.style.webkitUserSelect = 'none';
        d.body.style.touchAction = 'none';
        d.addEventListener('pointermove', move, true);
        d.addEventListener('pointerup', up, true);
        d.addEventListener('pointercancel', up, true);
      },

      // ── The cursor pad ────────────────────────────────────────────────
      // Press it and drag: the button does not move, the CARET does. On a
      // phone the only way to place a caret was to touch the text at the place
      // you were aiming at, which puts a thumb over the two words either side
      // of it, and a second tap there takes the word instead of moving
      // anything. So the one gesture for "put it between these two" hid its
      // own target and had a homonym. Here the finger is somewhere else and
      // the eye stays on the text.
      //
      // Ported from kits/annotate.js, constants and all, because the feel IS
      // the three numbers: crawl and the caret creeps at well under 1:1, flick
      // and it runs ahead of the thumb, so a short button reaches a long
      // buffer and the overshoot is walked back without lifting.
      padDrag: false, pinDrag: null,
      // A fine pointer from the start, so a desktop never sees the pins it would
      // only lose at the first click; any mouse press sets it too.
      precise: !!(window.matchMedia && matchMedia('(pointer: fine)').matches),
      // A DESK: a mouse that hovers, read once at load. Unlike `precise`,
      // which a single mouse press turns on, this does not change under the
      // reader, so the on-screen keys do not vanish mid-session on a phone.
      // A desk has a keyboard, which types every key of the upper row, so
      // that row is not drawn and the formats move to shortcuts (shortcut).
      desk: !!(window.matchMedia && matchMedia('(pointer: fine) and (hover: hover)').matches),

      // ── One armed state, three ways in ────────────────────────────────
      // `armed` is the whole aiming state and it has four values: null, the
      // two pin names, and 'anchor'. That is a merge, not a widening. The
      // page used to carry a separate `anchoring` flag beside it, and the two
      // said the same thing in different words: SOMETHING IS LIVE AND POINTED
      // AT THE TEXT, so the next tap in the buffer moves it rather than
      // placing a caret. Two flags for one fact meant the target could be red
      // while a pin was red, or neither, and the reader had to learn which
      // red meant what.
      //
      // So: the target is red exactly when `armed` is set, whichever way it
      // got set, and tapping it walks the state rather than reaching into the
      // text. That gives the tiny pinhead a large, safe control, which is the
      // thing that was missing: a miss near a pinhead used to clear the
      // selection outright, and no tap on the target ever can.
      //
      //   tap a pinhead                arms that edge
      //   tap the target, selected     end → start → null → end (toggleAnchor)
      //   tap the target, not          null → 'anchor' → null
      //
      // ARMING IS ALWAYS MOMENTARY. Whatever lit it, the thing it enables puts
      // it out again: a drag ends put down, the two-tap maneuver ends put
      // down, and a tap that places an armed edge ends put down. Nothing here
      // leaves a mode behind for the next tap to fall into.
      //
      // 'anchor' is the special case with no pin to show, since there is no
      // range yet. It needs none: the target itself is the affordance, and
      // painting a lone red pin at the caret would be a fourth thing to read.

      // the far end is what shift-click does everywhere, which makes the one
      // rule cover the collapsed case, the selected case and the empty case
      // without a branch for any of them.
      caretOffset() {
        const r = this.d && this.d.range;

      },
      // TAPPING THE HEADER'S OWN BACKGROUND PUTS ANY PIN DOWN. The target
      // cycles and the pinheads toggle, so both are ways of CHANGING which
      // edge is live; this is the way of simply ending it, and the header is
      // the largest piece of nothing on the screen that is not the text. A tap
      // in the text would move something, which is exactly what a reader who
      // is done does not want.
      //

      // header's controls each own their own tap and this must not eat any.
      headerTap(e) {

      },

      // The target's tap half, and it reads the buffer rather than being one
      // switch. WITH A SELECTION it cycles the two pins and off, since that is
      // the only question left to ask: which edge am I about to move. WITHOUT
      // one there are no pins to cycle, so it arms an anchor at the caret and
      // the next tap in the text is the other end.
      //
      //   selected      null → end → start → null
      //   not selected  null → anchor → null

      // END FIRST, because the far end of a selection is the active one
      // everywhere else here: `caretOffset` returns it, and the anchor extends
      // from it. One rule, not a second convention for this control.
      //
      // The anchor is not lost by this. Arming a pin and tapping the text does
      // exactly what the anchor did, extending from the other edge to where
      // you tapped, so with a selection the cycle is the same tool with the

      // The completing tap. Returns whether it consumed the tap, so the
      // gesture handler can fall through to its ordinary reading when the
      // anchor was never armed.

      // pad can be dragged to the exact start and only then tapped shut. An
      // arm-time capture made that flow silently wrong, selecting from
      // wherever the caret had been before the drag.

        // so leaving a pin lit would mean a third tap to close it, on a target
        // 12px across, with the selection lost if that tap missed. Refining an
        // edge afterwards is still one tap on its pinhead.
        this.armed = null;
        if (a === i) this.d.caretAt(i); else this.d.select(a, i);

      },

      // What the pad is aiming, in client coordinates: the armed pin if one is
      // armed, the caret otherwise. One gesture, two subjects, and which is a
      // state the reader set by tapping a pinhead. That is what let the arrows
      // go: an armed edge is dragged exactly the way the caret is. 'anchor' is
      // not a pin, so it aims the caret like the unarmed case.
      padPoint() {

          const hr = h?.getBoundingClientRect?.();
          if (hr && (hr.width || hr.height)) return { x: hr.left + hr.width / 2, y: hr.top + hr.height / 2 };

        const r = c?.getBoundingClientRect?.();
        if (r && (r.width || r.height)) return { x: r.left, y: r.top + r.height / 2 };

      },

      bindPad(btn) {

        const noSelect = (e) => e.preventDefault();
        const box = () => this.$refs.view.getBoundingClientRect();
        const move = (e) => {
          if (!from || !this.d) return;
          e.preventDefault();
          const b = box();
          // The virtual point ACCUMULATES, one move at a time, each step scaled
          // by how fast that move was. An absolute mapping cannot accelerate:
          // the gain would be a property of the whole drag rather than of the
          // moment, and "flick then creep" is two moments.
          const t = (typeof e.timeStamp === 'number' && e.timeStamp) || 0;
          const dx = e.clientX - from.lx, dy = e.clientY - from.ly;
          from.travel += Math.abs(dx) + Math.abs(dy);
          const dt = Math.max(8, t - from.lt);
          const k = Math.min(1, Math.max(0, (Math.hypot(dx, dy) / dt - V0) / (V1 - V0)));
          const gain = SLOW + (FAST - SLOW) * k;

          // accumulator drifts outside the box on a flick, and the drag back

          from.x = Math.min(b.right - EDGE, Math.max(b.left + EDGE, from.x + dx * gain));

          // steps one line at a time and a flick crosses several.

          // Held against an edge, SCROLL rather than stop: the buffer runs
          // longer than the screen, and a pad that could only reach what
          // happens to be visible would be worst on exactly the long notes.
          const v = this.$refs.view;
          if (from.y >= b.bottom - EDGE && v.scrollTop + v.clientHeight < v.scrollHeight) v.scrollTop += EDGE;

          if (i == null) return;
          if (this.pinned) this.d.moveEdge(this.armed, i); else this.d.caretAt(i);

          // the pad moves the caret off to the side of the finger, so nothing

          if (this.moveArm) this.moveAim = null;
