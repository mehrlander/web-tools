          if (!from) return;

          // this button. Measured against the raw thumb travel rather than the
          // accumulated virtual point, since the gain would call a 6px twitch
          // a 14px move at a flick.
          const tapped = from.travel < 8, onTap = from.onTap, el = from.el;

        };
        // `el` is what took the press and `onTap` what a press that went
        // nowhere means: the target's own tap for the button, nothing for the
        // text (whose own tap handler has the release). See padFrom.
        const start = (e, el, onTap) => {
          if (this.edit || !this.d) return false;  // the keyboard brings its own caret
          const p = this.padPoint();
          if (!p) return false;
          e.preventDefault();
          const cs = getComputedStyle(this.$refs.view);
          from = { x: p.x, y: p.y, y0: p.y, lx: e.clientX, ly: e.clientY, travel: 0,

                   line: parseFloat(cs.lineHeight) || 26, el, onTap };
          // The flag the text box reads to stand down. It has to: a capture can
          // be lost mid-gesture (a browser deciding the touch was a scroll) and
          // the box would then read the tail of a drag as a tap.
          this.padDrag = true;
          const d = document;
          d.body.style.userSelect = 'none';
          d.body.style.webkitUserSelect = 'none';
          // And the document holds still. A pad drag is not a scroll, but the
          // page under it will happily take one, and a page that scrolls at its
          // top edge inside a sheet-presented in-app browser is the gesture
          // that dismisses the sheet.
          d.body.style.touchAction = 'none';
          // Listeners on the DOCUMENT rather than the button: pointer capture
          // is best-effort and a lost one must not strand the drag.
          d.addEventListener('pointermove', move, true);
          d.addEventListener('pointerup', up, true);
          d.addEventListener('pointercancel', up, true);
          d.addEventListener('selectstart', noSelect, true);
          try { el.setPointerCapture(e.pointerId); } catch {}
          return true;
        };
        btn.addEventListener('pointerdown', (e) => { start(e, btn, () => this.padTap()); });
        this._padFrom = start;
      },

      // `retry` is not a caller's parameter: it is how this defers itself once.
      // EVERY POSITION HERE IS MEASURED, off `getClientRects` on the painted
      // spans, and a hidden element measures zero, so a paint that runs while
      // the read pane is `display:none` puts both pins at the layer's origin
      // and leaves them there. Nothing about that looks like a measurement
      // failure on screen: it looks like two pins stuck in the corner.
      //
      // `editClose` is how it happened. It sets the flag and paints in the
      // same breath, and Alpine does not clear `display:none` until the
      // reactive flush, so the paint measured the pane one tick before it came
      // back. Measured 2026-08-25: pins at 34,88 and 82,88 before a trip
      // through the keyboard and both at -16,71 after it, with the pane
      // computing `none` at the paint and `block` at `$nextTick`.
      //
      // Guarded HERE rather than at that one call site, because the trap
      // belongs to painting and not to the keyboard: any caller that repaints
      // across a visibility change has it. The deferral is a FRAME, not a
      // tick, and up to three of them: once the FAB mounted on this page (its
      // selection listener hears the textarea let go) Alpine's flush could
      // outlast one $nextTick, and a trip through the keyboard came back with
      // no pins about half the time. Bounded, so a host that is hidden for
      // good costs three frames rather than a loop.
      paint(retry = 3) {
        this.beat++;
        if (this.rendered) {
          const md = this.$refs.md;
          if (!md.getClientRects().length) { if (retry > 0) requestAnimationFrame(() => this.paint(retry - 1)); return; }
          window.MdSurface.paint(md, {
            text: this.text, interim: this.interim,
            range: this.d ? this.d.range : null, armed: this.pinned ? this.armed : null,
            overlay: this.$refs.layer, handles: !this.precise && !this.edit && !this.mover && !this.native, reach: 0,
            base: this.fileBase, marks: false, track: this.showMarks, cardActions: this.CARD_ACTIONS,
            // Under the native option the platform draws the selection, unless
            // Move has picked it up, when the page holds it until the drop.
            selection: !this.native || !!this.moveArm,
            // Red is the phone's precision caret; a mouse gets the text's own color.
            caret: this.precise ? 'var(--color-base-content)' : null,
            // Wider than the kit's 2px on a phone: at 2px, fading on the pulse,
            // the caret was hard to find in running text.
            caretWidth: this.precise ? 2 : 3,
          });
          const n = this.showMarks ? md.querySelectorAll('[data-md-card]').length : 0;
          if (n !== this.changesCount) this.changesCount = n;
          const layer = this.$refs.layer;
          if (layer) for (const pin of layer.querySelectorAll('[data-edge]')) this.holdTouch(pin);
          if (this.typing) this.syncSink();
          if (!this.native) this.moveArm = null;
          if (this.nativeSel) this.nativeReflect();
          this.paintExtras();
          return;
        }
        if (!this._host) return;
        if (!this._host.getClientRects().length) {
          if (retry > 0) requestAnimationFrame(() => this.paint(retry - 1));
          return;
        }
        window.Dictate.paint(this._host, {
          text: this.text, interim: this.interim,
          range: this.d ? this.d.range : null, armed: this.pinned ? this.armed : null,
          // Read fresh rather than stored: the caret may have moved under the
          // armed state (the step-back key), and the marker has to follow.
          mend: this.mendArmed && this.d ? this.d.stitchSeam : null,
          overlay: this.$refs.layer,
          // NO ARROW CLUSTER. The pad drags an armed pin the same way it drags
          // the caret, so a pair of arrows chasing the pin around is furniture
          // for a job already done. This page carried them because its first
          // cut came from the stage's card, which keeps them for the good
          // reason that it has no pad.
          arrows: false,
          // And no pins once a mouse or a keyboard is in play: drag and
          // shift-click do the extending. The selection stays painted; only
          // the thing you would have tapped goes.

          const text = this.outgoing();
          const now = new Date();
          const stamp = now.toISOString().slice(0, 10);
          const hhmm = String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
          const path = `${DEST.dir}/${stamp}-${hhmm}-${this.slug(text)}.md`;
          await gh2.save(path, text.replace(/\s*$/, '') + '\n', `Dictated ${stamp} ${hhmm}`);
          return path;
        }, DEST.repo, DEST.ref);
      },
      async commit(work, repo, ref) {
        if (!this.token) {
          Alpine.store('toast')('warning', 'No token on this browser: Copy or Share instead', 'alert-error', 5000);
          return;
        }
        this.saving = repo;
        try {
          const inst = new window.GH({ token: this.token, repo, ref: ref || '' });
          const where = await work(inst);
          this.clear();
          Alpine.store('toast')('check', 'Filed in ' + where, 'alert-success', 3200);
        } catch (e) {
          Alpine.store('toast')('warning', 'Not saved: ' + (e?.message || e), 'alert-error', 6000);
        }
        this.saving = '';
      },
      // ── Send: the fifth destination ────────────────────────────────────
      // It reads the buffer and leaves it standing, like Copy and Share and
      // unlike Jot and Drop: nothing durable has happened here either. The
      // words are still on this page when you come back, which matters more
      // for this one than for the other two, since the far end may refuse
      // them (over the cap) or the reader may change their mind about where.
      openSend() {
        // FILE MODE SENDS A FILE, not a note: the edit or the whole of it, and
        // one of the places it can go is back to GitHub. With changes, the
        // sheet opens on the edit and on Save; without, on the file and on a
        // session, since there is nothing to save.
        if (FILE) {
          this.d.flush();
          this.sendWhat = this.dirty ? 'patch' : 'file';
          this.sendTarget = this.dirty ? 'save' : 'code';
          if (!this.sendRepos.length) this.sendRepos = [FILE.repo];
        }
        this.sendOpen = true; this.loadRepos();
      },

      // The account's repositories, most recently updated first. Fetched once,
      // on the first open, because a page that is usually only dictated into
      // should not spend a call on a sheet nobody opens.
      //
      // CAPPED, and the cap is a phone rather than an API limit: a bottom
      // sheet holding a scrolling list of a hundred repositories is a worse
      // control than one holding the dozen you have touched this month.
      // Anything preselected by ?repo= is pinned above the cap, so a link can
      // always name a repository this list would not have reached.
      async loadRepos() {
        if (this.repoList || !this.token) return;
        try {
          const inst = new window.GH({ token: this.token });
          const acct = await inst.repos();
          this.repoList = (Array.isArray(acct) ? acct : [])
            .map((r) => r && r.full_name).filter(Boolean).slice(0, 15);
        } catch (e) {
          // Named rather than swallowed: with no list and no message the sheet
          // reads as "you have no repositories", which is a different and
          // wrong claim.
          this.repoList = [];
          this.repoErr = e?.message || String(e);
        }
      },

      // Preselected first and in the order given, then the rest of the
      // account's. A link's repositories are the ones its author meant.
      get sendRepoRows() {
        const seen = new Set();
        const rows = [];
        for (const slug of this.sendRepos.concat(this.repoList || []))
          if (slug && !seen.has(slug)) { seen.add(slug); rows.push(slug); }
        return rows;
      },
      toggleRepo(slug) {
        this.sendRepos = this.sendRepos.includes(slug)
          ? this.sendRepos.filter((x) => x !== slug)
          : [...this.sendRepos, slug];
      },

      // SHARE IS NOT A ROW, IT IS THE OTHER BUTTON. It was a row for one
      // commit, which made reaching the system sheet two taps: pick the row,
      // then confirm. That is a confirm step over a choice already made, and
      // the sheet it opens is itself a chooser, so the second tap bought
      // nothing at all.
      //
      // It belongs at the foot beside the primary because that is what it is:
      // a second way to finish, not a third destination. The rows above are
      // the ones that need a repository or a warning read first; Share needs
      // neither and should cost what Copy costs.
      get sendTargets() {
        const rows = (window.PromptLink?.targets) || [];
        if (!FILE) return rows;
        const save = {
          key: 'save', label: 'Save to GitHub', icon: 'ph-floppy-disk', submits: false,
          hint: 'Commit to ' + this.fileWhere,
          available: this.dirty && !!this.token && !this.fileLoading,
          reason: !this.dirty ? 'Nothing to save: the file is as GitHub has it'
                : !this.token ? 'No token on this browser' : 'Still loading',
        };
        return [save, ...rows];
      },
      // What rides. A session or a chat gets the patch WITH a line saying where
      // it belongs; Share and Copy get the bare patch, which is what git and a
      // paste want. The whole file is the buffer either way.
      get sendPayload() {
        if (FILE && this.sendWhat === 'patch') return this.patchPrompt;
        return this.outgoing();
      },
      get sharePayload() {
        if (FILE && this.sendWhat === 'patch') return this.patchText;
        return this.outgoing();
      },
      get sendTargetRow() { return this.sendTargets.find((t) => t.key === this.sendTarget) || null; },

      // The link, and what it could not carry. Recomputed on every change
      // rather than stored, so the sheet's own summary line cannot drift from
      // the button beside it.
      get sendLink() {
        const P = window.PromptLink;
        if (!P) return { url: '', carried: [], dropped: ['prompt-link kit not loaded'] };
        if (this.sendTarget === 'save') return { url: '', carried: [], dropped: [] };
        return P.url(this.sendTarget, {
          prompt: this.sendPayload,
          repos: this.sendTarget === 'code' ? this.sendRepos : [],
        });
      },

      // Over the cap is a REFUSAL, not a truncation: a prompt cut at a
      // character boundary reads as a complete instruction and gets acted on.
      // The sheet says the number so the reader can cut it themselves, which is
      // the only edit that knows which sentence matters.
      // The cap belongs to the query string. Share hands the buffer over as
      // text with no address to fit it into, so it is never over.
      get sendOver() {
        const P = window.PromptLink;
        return !!P && this.sendTarget !== 'save' && this.sendPayload.length > P.PROMPT_MAX;
      },
      get sendReady() {
        if (this.sendTarget === 'save') return this.dirty && !this.saving && !this.fileLoading;
        return !!this.sendLink.url && !this.sendOver;
      },

      send() {
        if (this.sendTarget === 'save') { this.sendOpen = false; this.saveFile(); return; }
        const link = this.sendLink;
        if (!link.url) {
          Alpine.store('toast')('warning', link.dropped[0] || 'Nowhere to send this', 'alert-error', 5000);
          return;
        }
        this.sendOpen = false;
        // A new tab, never this one. The words are still here and the draft is
        // still in storage, so navigating away would be recoverable, but a page
        // you are dictating into should not vanish because you aimed it.
        window.open(link.url, '_blank', 'noopener');
      },

      // BRING BACK WHAT THE ARRIVAL DISPLACED, above whatever is here now.
      // It is the join the arrival used to make by itself, and the difference
      // is the whole point: asked for rather than guessed. Spent on use, so
      // the band stops offering something that is already in the buffer.
      restoreAside() {
        if (!this.aside) return;
        const now = this.d.text.replace(/\s+$/, '');
        this.d.text = now ? this.aside + '\n\n' + now : this.aside;
        this.aside = '';
        ls.del(ASIDE);
        this.save();
        this.paint();
      },

      // Back to blank, and still listening if it was. The buffer goes through
      // the kit's setter, so undo can bring it back for one step, which is
      // the whole safety net a clear needs here.
      clear() {
        this.d.text = '';
        this.draft = ''; this.interim = ''; this.armed = null; this.pinDrag = null;
        this.breaks = false; this.restored = 0;
        // Starting fresh means the set-aside too: a reader clearing the page
        // is not asking to be offered an older draft on the next line.
        this.aside = '';
        ls.del(DRAFT);
        ls.del(ASIDE);
        this.elapsed = 0; this.since = Date.now();
        this.menu = false;
        this.paint();
      },
    }));
  });

  await gh.load('alpine-bundle.js');   // starts Alpine
</script>
</head>

<body class="bg-base-200 text-base-content overscroll-none [--fab-bottom:calc(env(safe-area-inset-bottom)+8.5rem)]">

<div x-data="dictate" x-cloak data-dictate-ui
     :data-dictate-pad="(padDrag || pinDrag) ? '' : null"
     class="h-dvh w-full flex flex-col mx-auto bg-base-100 sm:border-x border-base-300">

  <!-- ── The status bar ──────────────────────────────────────────────────
       Three facts and a menu, because a capture surface has to answer "is it
       hearing me" without being asked, and answer it from across the room. -->
  <!-- ── The header ──────────────────────────────────────────────────────
       A THREE-COLUMN GRID, so the target lands on the viewport's centre line
       rather than on the midpoint of whatever space the two side groups leave
       over. In file mode the target is in the bottom row instead, between
       Copy and Send, and the centre column stands empty.

       Left is the session (record, and how long it has run). Centre is the one
       control that AIMS. Right is the history and the menu. Backspace joins
       undo and redo rather than staying in the bottom row: it undoes a word
       the way undo undoes an act, and the three read as one group.

       IN FILE MODE THE FILE LINE LIVES HERE TOO, rather than in a second band
       under the header. The empty centre column takes the file's name and
       whether it is unsaved, and the two faces join the right group. On a
       phone the name is the file's own (SKILL.md), with the repository and
       its folders on a small second line, and unsaved is a dot; from
       the sm breakpoint up, the whole repo@ref:path and the badge. The clock
       and word count give way on a phone, and the count moves to the menu. -->
  <div @pointerdown="headerTap($event)"
       class="shrink-0 grid items-center gap-1 px-1 min-h-14
              border-b border-base-300 pt-[env(safe-area-inset-top)]"
       :class="file ? 'grid-cols-[auto_minmax(0,1fr)_auto]' : 'grid-cols-[1fr_auto_1fr]'">

    <div class="flex items-center gap-1 justify-self-start">
      <!-- RECORD, and the state readout as well as the switch: red and pulsing
           while live, so the one question a capture surface has to answer
           without being asked is answered by the control that changes it. -->
      <button @click="mic()" :disabled="edit"
              class="btn btn-md btn-square shrink-0"
              :class="listening ? 'btn-error' : 'btn-ghost'"
              :title="listening ? 'Recording. Tap to stop.' : 'Start listening'">
        <i class="ph text-xl" :class="(listening ? 'ph-microphone animate-pulse' : 'ph-microphone-slash')"></i>
      </button>
      <span class="font-mono text-sm opacity-40 tabular-nums" :class="file && 'hidden sm:inline'" x-text="started ? clock : ''"></span>
      <span class="font-mono text-sm opacity-40 tabular-nums" :class="file && 'hidden sm:inline'" x-text="words + 'w'"></span>
      <!-- The armed capital has nothing on screen to show yet: the word it
           applies to has not been said. So it wears the ring red the pins and
           the target wear, which is this page's one word for "live". -->
      <i x-show="capsArmed" x-cloak class="ph ph-text-aa text-lg text-error"
         title="The next word you say will be capitalised (tap Shift again to cancel)"></i>
    </div>

    <!-- The target in the header, for a note; in file mode it is in the
         bottom row. See the one there for what it does. -->
    <button x-show="!file" x-init="bindPad($el)" :disabled="edit" style="touch-action:none"
            class="btn btn-md btn-square justify-self-center"
            :class="armed ? 'btn-error btn-outline' : (padDrag ? 'btn-info' : 'btn-ghost')"
            :title="armed === 'anchor' ? 'Now tap where the selection should end (tap here again to cancel)'
                    : armed ? 'The ' + armed + ' of the selection is armed. Tap here to put it down.'
                    : 'Drag to move the cursor. Tap to start a selection from it.'">
      <i class="ph ph-crosshair text-xl"></i>
    </button>
    <!-- Which file, and whether the buffer differs from it. The name links to
         GitHub, the only place a reader can check what Save would overwrite. -->
    <div x-show="file" class="flex items-center gap-1.5 min-w-0 px-1">
      <a :href="fileUrl" target="_blank" rel="noopener" :title="fileWhere"
         class="link link-hover truncate min-w-0 text-sm sm:font-mono">
        <span class="sm:hidden flex flex-col min-w-0 leading-tight">
          <span class="truncate" data-file-name x-text="fileName"></span>
          <!-- Cut from the LEFT when it does not fit, so the folder nearest the
               file is the part that shows: right-to-left for the ellipsis,
               the path itself isolated left-to-right so its order holds. -->
          <span class="truncate text-[11px] opacity-60 [direction:rtl] text-left" data-file-dir><bdi x-text="fileDir"></bdi></span>
        </span><span class="hidden sm:inline" x-text="fileWhere"></span>
      </a>
      <span x-show="fileLoading" class="loading loading-spinner loading-xs shrink-0"></span>
      <button x-show="dirty && !fileLoading" @click="unsavedTap($event)" data-unsaved
              class="sm:hidden shrink-0 p-1.5 -m-1.5" title="Unsaved. Tap to clear all edits.">
        <span class="block size-2 rounded-full bg-warning"></span>
      </button>
      <button x-show="dirty && !fileLoading" @click="unsavedTap($event)"
              class="hidden sm:inline-flex badge badge-warning badge-sm shrink-0 cursor-pointer" title="Unsaved. Click to clear all edits.">unsaved</button>
    </div>

    <div class="flex items-center gap-0.5 justify-self-end col-start-3">
      <!-- The two faces. On a phone ONE BUTTON that flips between them and
           wears the face on screen, since a pair took room the file's name
           needs on a 360px header. From sm up, the pair side by side. -->
      <button x-show="file" @click="setView(view === 'rendered' ? 'source' : 'rendered')" data-faces
              class="sm:hidden btn btn-ghost btn-md btn-square"
              :title="view === 'rendered' ? 'Rendered. Tap for the markdown source.' : 'Source. Tap for the rendered document.'">
        <i class="ph text-xl" :class="view === 'rendered' ? 'ph-eye' : 'ph-code'"></i>
      </button>
      <div x-show="file" class="join shrink-0 mr-1 hidden sm:inline-flex">
        <button @click="setView('source')" class="join-item btn btn-sm btn-square" :class="view === 'source' ? 'btn-active' : 'btn-ghost'"
                title="Source: the markdown itself"><i class="ph ph-code text-base"></i></button>
        <button @click="setView('rendered')" class="join-item btn btn-sm btn-square" :class="view === 'rendered' ? 'btn-active' : 'btn-ghost'"
                title="Rendered: the document as it reads, still editable by tap and voice"><i class="ph ph-eye text-base"></i></button>
      </div>
      <button @click="undo()" :disabled="!canUndo" class="btn btn-ghost btn-md btn-square" title="Undo">
        <i class="ph ph-arrow-counter-clockwise text-xl"></i>
      </button>
      <button @click="redo()" :disabled="!canRedo" class="btn btn-ghost btn-md btn-square" title="Redo">
        <i class="ph ph-arrow-clockwise text-xl"></i>
      </button>
      <!-- THE KEYBOARD, on a button rather than only on a double tap. The
           double tap stays and is still the better aim, since it says WHERE
           as well as that you want to type. What it cannot do is carry a
           selection: it lands on a point, and a point collapses one. This
           does the other thing, and it is the reason it exists rather than
           being a second route to the same place: whatever is selected comes
           across selected, so the first thing typed replaces it. -->
      <button @click="editOpen()" @pointerdown.prevent :disabled="edit"
              class="btn btn-md btn-square" :class="typing ? 'btn-info' : 'btn-ghost'"
              title="Type. Anything selected comes across selected, so typing replaces it.">
        <i class="ph ph-keyboard text-xl"></i>
      </button>
      <!-- The menu is a DROPDOWN, not a band. As a band it inserted itself
           between the header and the text and pushed the words down the screen
           to show controls that are not about the words at all. -->
      <div class="relative" @click.outside="menu = false">
        <button @click="menu = !menu" class="btn btn-ghost btn-md btn-square" title="More">
          <i class="ph ph-dots-three-vertical text-xl"></i>
        </button>
        <div x-show="menu" x-cloak
             class="absolute right-0 top-full mt-1 z-50 w-56 rounded-box border border-base-300 bg-base-100 shadow-xl py-1 flex flex-col">
          <button x-show="!file" @click="clear(); menu = false"
                  class="flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-base-200">
            <i class="ph ph-file-dashed text-lg opacity-60"></i>New
          </button>
          <!-- File mode's New: back to what GitHub holds, the local edit discarded.
               One step of undo still reaches the edit, as it does for New. -->
          <button x-show="file" @click="clearEdits(); menu = false" :disabled="fileLoading"
                  class="flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-base-200 disabled:opacity-40"
                  :title="dirty ? 'Discard every edit and reopen the file as GitHub holds it' : 'Reopen the file as GitHub holds it now'">
            <i class="ph text-lg opacity-60" :class="dirty ? 'ph-x-circle' : 'ph-arrow-clockwise'"></i>
            <span x-text="dirty ? 'Clear all edits' : 'Reload'"></span>
          </button>
          <button x-show="file" @click="unwrapLines()" :disabled="!!(fileLoading || blank)"
                  class="flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-base-200 disabled:opacity-40"
                  title="Join hard-wrapped lines so each paragraph is one line. The rendered markdown does not change.">
            <i class="ph ph-text-align-left text-lg opacity-60"></i>Unwrap lines
          </button>
          <button x-show="file" @click="toggleMarks()"
                  class="flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-base-200"
                  title="Show each changed block as a card: the change marked in place, swipe for the original or the clean text">
            <i class="ph ph-highlighter text-lg opacity-60"></i>Track changes
            <i x-show="showMarks" class="ph ph-check ml-auto text-lg text-success"></i>
          </button>
          <button x-show="file" @click="toggleNativeSel()"
                  class="flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-base-200"
                  title="Select words with the phone's own long press and handles, instead of the page's pins. Rendered view only.">
            <i class="ph ph-cursor-text text-lg opacity-60"></i>Native selection
            <i x-show="nativeSel" class="ph ph-check ml-auto text-lg text-success"></i>
          </button>
          <button @click="breaks = !breaks" :disabled="!breakable"
                  class="flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-base-200 disabled:opacity-40"
                  :title="breakable ? 'Break into paragraphs where you paused longest' : 'Needs the pause record, which typing replaces'">
            <i class="ph ph-paragraph text-lg opacity-60"></i>Breaks
            <i x-show="breaks" class="ph ph-check ml-auto text-lg text-success"></i>
          </button>
          <button @click="openAuto()"
                  class="flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-base-200">
            <i class="ph ph-book-open text-lg opacity-60"></i>Autocorrect
            <span class="ml-auto font-mono text-sm opacity-40" x-text="corrections.length"></span>
          </button>
          <div x-show="file" class="sm:hidden px-3 pt-1.5 pb-0.5 font-mono text-[11px] opacity-30"
               x-text="words + ' words'"></div>
          <!-- On a desk the upper keys are not drawn, so their shortcuts are
               listed where the rest of the page's options are. -->
          <div x-show="desk && file" data-shortcuts
               class="mx-3 mt-1 pt-2 border-t border-base-300 grid grid-cols-[auto_1fr] gap-x-3 gap-y-1 pb-1 text-xs">
            <template x-for="[c, what] in [['⌘B', 'Bold'], ['⌘E', 'Code'], ['⌘⌥1-3', 'Heading'], ['⌘⌥0', 'Paragraph'], ['⌘⇧8', 'List'], ['⌘↵', 'Send']]">
              <div class="contents"><span class="font-mono opacity-60" x-text="chord(c)"></span><span x-text="what"></span></div>
            </template>
          </div>
          <div x-show="d && d.relaunches" class="px-3 pt-1.5 pb-0.5 font-mono text-[11px] opacity-30"
               x-text="(d ? d.relaunches : 0) + ' relaunches'"></div>
        </div>
      </div>
    </div>
  </div>

  <div x-show="err" class="shrink-0 px-4 py-1.5 text-sm bg-error/10 text-error" x-text="err"></div>
  <!-- TWO ARRIVALS, ONE BAND, and they are told apart because they mean
       different things. A restored draft is this page's own history; words
       handed over by a composer on another page are somebody's sentence from
       somewhere else, and a buffer that gained those without saying so is a
       buffer the reader cannot trust. Same band, same Start fresh, different
       first clause.
       "Bring back" appears only on the second, and only where the arrival
       displaced something: it is the way back to the draft this page was
       holding, which an arrival replaces rather than joins (see init). -->
  <!-- NOT IN FILE MODE: there the unsaved mark in the header already says the
       words on screen are an edit, and tapping it clears them. -->
  <div x-show="restored && !file" class="shrink-0 px-4 py-1.5 text-sm bg-warning/10 flex items-center gap-2">
    <i class="ph" :class="arrived ? 'ph-arrows-out' : 'ph-clock-counter-clockwise'"></i>
    <span x-show="!arrived">Picked up where you left off.</span>
    <span x-show="arrived" class="min-w-0 truncate"
          :title="arrivedFrom ? 'Sent from ' + arrivedFrom : 'Sent from a composer on another page'"
          x-text="'Carried over from ' + (arrivedFrom ? arrivedFrom.split('/').pop() : 'another page') + '.'"></span>
    <button x-show="aside" @click="restoreAside()" class="link link-hover font-medium shrink-0"
            title="Put the draft this page was holding back above these words">Bring back</button>
    <button @click="clear()" class="link link-hover font-medium shrink-0">Start fresh</button>
  </div>
  <div x-show="fileErr" class="shrink-0 px-4 py-1.5 text-sm bg-error/10 text-error" x-text="fileErr"></div>
  <!-- ── The text ────────────────────────────────────────────────────────
       The whole width and the whole remaining height. THE COMPOSER'S MARK
       COLUMN DID NOT COME ACROSS, and it is the one piece of that card's
       shape that could not: a column beside the text holds 56px of the width
       for the full height in order to carry four keys at the bottom of it,
       which on a 390px phone is 14% of the measure spent on whitespace. The
       composer can afford it because its text box is capped at 172px, so the
       column is the height of the keys; here the box is the height of a
       phone. Shot both ways before deciding.

       What DID come across is everything that is behavior rather than
       geometry: the key set and its four faces, the cursor pad, the retired
       arrows, the retired pencil, and the bottom row.

       The LAYER is the handles' home: outside the scroll box and unclipped,
       so a pin may hang above the first line rather than being cut in half. -->
  <div class="grow min-h-0 relative touch-manipulation flex" x-ref="layer"
       @pointerdown="pinDown($event)" @click="delTap($event)" data-no-swipe>

    <div class="relative grow min-w-0">
      <!-- ALWAYS RENDERED, hidden by opacity rather than by `x-show`, and the
           reason is the phone's and not a style preference. WebKit raises the
           keyboard for a programmatic `focus()` only from inside the call
           stack of a user gesture, so the focus has to happen in the tap
           itself. `x-show` writes `display:none`, a `display:none` element
           cannot take focus, and Alpine does not clear it until the reactive
           flush, which is after the handler has returned. The field therefore
           has to exist and be focusable at the moment the button is pressed,
           which is what this costs and what it buys. Measured 2026-08-25:
           display was `none` synchronously after setting the flag and `block`
           by `$nextTick`, and focus landed there, which is why the button
           opened the textarea and left the keyboard down.

           It sits UNDER the read pane, and by DOM ORDER rather than by a
           z-index: it is written first, so the pane paints over it, and the
           pin layer above them both keeps painting over the pane. A `z-10` on
           the pane did the same job for the pane and hid the pins behind it,
           since they are the layer's own children with no z-index of their
           own. Order costs nothing and disturbs nothing.

           It takes no taps while it is invisible, and `tabindex` goes to -1 so
           a keyboard user does not land in a field they cannot see; -1 still
           permits the programmatic focus this is all for. -->
      <textarea x-ref="ta" x-model="draft" :tabindex="edit ? 0 : -1"
                @blur="editClose()" @keydown.escape="editClose()"
                class="absolute inset-0 w-full h-full resize-none textarea rounded-none border-0 leading-[1.65] tracking-[-0.01em] break-words px-4 py-3 focus:outline-none"
                :class="(edit ? 'opacity-100' : 'opacity-0 pointer-events-none') + (file ? ' text-[17px]' : ' text-[21px]')"
                placeholder="Type instead"></textarea>

      <div x-show="!edit" x-ref="view" data-dictate-view class="absolute inset-0 overflow-y-auto px-4 py-3" @scroll="paint()">
        <div x-show="!rendered" class="whitespace-pre-wrap break-words leading-[1.65] tracking-[-0.01em]" :class="file ? 'text-[17px]' : 'text-[21px]'"
             x-ref="body" @contextmenu.prevent></div>
        <!-- File mode's Rendered face. Its classes are set once from
             GuideRender.bodyClass() when the renderer loads, so the document
             reads in the house markdown type. -->
        <div x-show="rendered" x-ref="md" :class="precise && 'cursor-text'" :data-native-sel="native ? '' : null"
             :style="moveArm ? 'touch-action:none' : ''"
             @md-card-reading="setCardReading($event.detail.i, $event.detail.mode)"
             @pointermove="cardHover($event)" @pointerleave="cardHover(null)"
             @contextmenu="native || $event.preventDefault()" @click="cardTap($event)"></div>

        <!-- Nothing said yet. The whole empty surface IS the start button,
             which is the one tap WebKit's gesture requirement makes
             unavoidable and the largest target a page can offer for it. -->
        <button x-show="!text && !interim && !(file && (fileLoading || fileErr))" @click="started ? mic() : begin()"
                class="absolute inset-0 w-full flex flex-col items-center justify-center gap-3 text-center px-8">
          <i class="ph text-6xl opacity-20" :class="listening ? 'ph-waveform' : 'ph-microphone'"></i>
          <span class="text-lg opacity-50" x-text="listening ? 'Go ahead.' : (started ? 'Paused. Tap to carry on.' : 'Tap anywhere to start talking.')"></span>
          <span x-show="!started" class="text-sm opacity-30">Your phone will ask for the microphone once.</span>
        </button>
      </div>

      <!-- THE SINK: the Rendered face's keyboard input. Invisible, 16px so a
           phone does not zoom to it, and holding the caret's line of source so
           autocorrect has context (see startTyping). -->
      <textarea x-ref="sink" tabindex="-1" rows="1" aria-hidden="true"
                autocapitalize="sentences" autocomplete="off" spellcheck="true"
                class="absolute top-0 left-0 w-px h-px opacity-0 pointer-events-none resize-none text-[16px] p-0 border-0"
                @beforeinput="sinkBefore($event)" @input="sinkInput()" @keydown="sinkKey($event)"
                @compositionstart="composing = true" @compositionend="composing = false; sinkInput()"
                @blur="if (typing) stopTyping()"></textarea>

      <!-- A REMOVAL, SHOWN AGAIN. The marks can only point at where words went,
           since the buffer no longer holds them; this is where they are read. -->
      <!-- A card's Info: what the change was. -->
      <div x-show="cardInfo" x-cloak @click.outside="cardInfo = null" data-card-info
           class="fixed z-50 w-72 card card-sm bg-base-100 border border-base-300 shadow-xl"
           :style="cardInfo ? 'left:' + cardInfo.x + 'px;top:' + cardInfo.y + 'px' : ''">
        <div class="card-body gap-2">
          <div class="flex items-baseline gap-2 text-sm">
            <span class="font-medium" x-text="'Change ' + (cardInfo ? cardInfo.i + 1 : '')"></span>
            <span class="opacity-60 tabular-nums" x-text="cardInfo ? cardInfo.ow + ' → ' + cardInfo.nw + ' words' : ''"></span>
          </div>
          <div class="text-xs opacity-60">GitHub's copy</div>
          <div class="text-sm bg-error/10 rounded px-1.5 py-1 max-h-32 overflow-y-auto whitespace-pre-wrap break-words" data-info-old
               x-text="cardInfo && (cardInfo.old || 'None: this text is new.')"></div>
          <div class="text-xs opacity-60">Now</div>
          <div class="text-sm bg-success/15 rounded px-1.5 py-1 max-h-32 overflow-y-auto whitespace-pre-wrap break-words" data-info-now
               x-text="cardInfo && (cardInfo.now || 'None: this text was removed.')"></div>
          <div class="card-actions justify-end">
            <button class="btn btn-sm btn-ghost" @click="cardInfo = null">Close</button>
          </div>
        </div>
      </div>
      <!-- A tapped mark's undo, struck or added: one word in the cards' pill
           style, under the mark. The tap that opened it is ignored by the
           outside-click, which otherwise arrives as the same gesture. -->
      <div x-show="wordPop" x-cloak data-word-pop
           @click.outside="if (wordPop && Date.now() - wordPop.t > 400) wordPop = null"
           class="fixed z-50 -translate-x-1/2 flex items-center rounded-full border border-base-300 bg-base-100 shadow-sm text-[13px] leading-none select-none"
           :style="wordPop ? 'left:' + wordPop.x + 'px;top:' + wordPop.y + 'px' : ''">
        <button type="button" @pointerdown.prevent @click="undoWord()" title="Undo this change"
                class="relative px-2.5 py-[3.5px] text-error/70 cursor-pointer before:absolute before:-inset-x-1 before:-inset-y-3 before:content-['']">undo</button>
      </div>

      <!-- THE CHANGES, COUNTED: how many cards the edit makes, and a step to
           the next or the previous one, wrapping at the ends. It is what the
           retired Changes face had that the cards did not. Bottom left, since
           the launcher holds the bottom right. -->
      <div x-show="file && rendered && showMarks && changesCount && !edit" x-cloak data-jump
           class="absolute bottom-2 left-2 z-20 join rounded-full shadow-sm border border-base-300 bg-base-100/95">
        <button @click="jumpCard(-1)" class="join-item btn btn-xs btn-ghost rounded-l-full px-1.5" title="Previous change"><i class="ph ph-caret-up"></i></button>
        <span class="px-1 text-xs tabular-nums self-center" x-text="changesCount + (changesCount === 1 ? ' change' : ' changes')"></span>
        <button @click="jumpCard(1)" class="join-item btn btn-xs btn-ghost rounded-r-full px-1.5" title="Next change"><i class="ph ph-caret-down"></i></button>
      </div>

      <!-- The keyboard half, and it has no controls of its own: blur or
           Escape is the way out, which is the keyboard's own gesture and the
           one a reader already reaches for.
           
           ITS TYPE CLASSES MATCH THE READ PANE'S EXACTLY, and the list has to
           be read as one thing rather than tidied per side: the same size,
           the same leading, the same tracking, the same wrap rule, the same
           padding, over the same 358px content box. A word wrapping one
           character earlier here than there is the whole paragraph reflowing
           under the reader at the moment they switch, and it reads as the
           text having moved rather than as a font detail.
           
           Measured 2026-08-25, when it did not match: the read pane carried
           `tracking-[-0.01em]` and this did not, so 21px type ran 0.21px wider
           per character, 16.8px over a 79-character line. Everything else was
           already identical, which is what made it hard to see and easy to
           fix. `break-words` went the other way, onto the read pane, so a URL
           too long for the measure breaks in both rather than scrolling in
           one. -->

    </div>

  </div>

  <!-- ── The keys ────────────────────────────────────────────────────────
       TWO GROUPS PAST A HAIRLINE. On the left the composer's three marks and
       its shift, laid across instead of down: the keys that WRITE. On the
       right the three that take something back: step to a break, close it,
       delete a word. The rule between them is what a thumb reaching without
       looking reads first, and it is why the backspace no longer has to be
       found by counting cells from the end.

       Seven keys measure 50px each at 390 and 48 at 375, and every one holds a
       single glyph, so what each needs is a touch target rather than a label.
       At 320 they are 40px wide, under the platform's 44, and that is accepted
       rather than fixed: the row is 56px tall, so the target is 40 by 56 and
       generous in the axis a thumb actually misses in. Tapped over and over
       inside one note, so they are the tall row, and being the tall row is
       what qualifies a control to be here. -->
  <div x-show="!edit && !desk" class="shrink-0 flex items-stretch gap-1 px-1 pt-1">
    <template x-for="k in pad" :key="k.k">
      <button @pointerdown.prevent="key(k.k)" :title="k.t"
              class="btn h-14 min-h-0 grow basis-0 px-0 text-2xl font-semibold"
              :class="k.k === 'stitch' ? 'btn-warning' : 'btn-ghost bg-base-200'">
        <i x-show="k.k === 'stitch'" class="ph ph-arrows-in-line-horizontal"></i>
        <span x-show="k.k !== 'stitch'" x-text="k.k"></span>
      </button>
    </template>
    <!-- Sticky in fact, momentary in feel: a shifted mark drops the shift the
         way a phone keyboard does. It used to become a ✕ that dropped the
         selection, on the composer's reasoning that the pad and the selection
         are one state and a mode needs an exit. The exit was already there,
         since a tap anywhere outside the selection collapses it to a caret,
         so the key does one thing. -->
    <button @pointerdown.prevent="shift = !shift"
            class="btn h-14 min-h-0 grow basis-0 px-0 font-mono text-sm"
            :class="shift ? 'btn-warning' : 'btn-ghost bg-base-200'"
            :title="file ? (sel ? 'Casing' : 'Heading, list, paragraph') : 'The other three marks'"
            x-text="shift ? 'abc' : (file ? (sel ? 'Aa' : 'H•¶') : '·!¶')"></button>
    <!-- ── THE REPAIRS, past a rule ───────────────────────────────────────
         Four keys write and three take back, and until this rule they sat in
         one undifferentiated run where a thumb had to count cells to find the
         backspace. The line says which half of the row it is in before the
         glyph says what the key does, which is what a thumb reaching without
         looking actually reads.

         It is a hairline WITH room either side rather than one or the other. A
         gap alone at this size reads as a layout accident; a line alone was
         drawn in base-300 between two base-200 keys and disappeared into
         them, which a shot showed before this comment was written. Inset from
         top and bottom too, so it separates the keys without drawing a box
         around either group. -->
    <div class="w-px shrink-0 my-3 mx-1 bg-base-content/20" aria-hidden="true"></div>

    <!-- STEP BACK, the key that changes nothing. It walks the caret to the
         previous sentence break so the reader can SEE which one they are about
         to close, and tapping again walks past it to the one before.

         IT EXISTS BECAUSE THE STITCH CANNOT GUESS. For a few hours on
         2026-09-06 the stitch reached backwards by itself, and no ordering of
         its targets was right: during dictation the buffer almost always ends
         in the full stop the pause just wrote, so "the most recent break" is
         that one. Taking it back is exactly right when the sentence should
         keep running and exactly wrong when the reader meant to keep it and
         repair an earlier break, and nothing in the buffer tells the two
         apart, since the difference is in what they are about to say.

         BACKWARDS ONLY. Forwards is a tap on the text, which every reader of
         this surface already knows and which lands anywhere rather than on a
         break, so a key for it would spend a cell duplicating a gesture.
         Getting back is the hard direction and the one worth a key.

         The caret it places is a LOAN: the stitch hands it back to the end, so
         the next thing said still lands where the reader is speaking. See
         `jumpBack` in kits/dictate.js. -->
    <button @pointerdown.prevent="key('jump')" :disabled="!jumpable"
            class="btn h-14 min-h-0 grow basis-0 px-0 text-2xl"
            :class="jumpable ? 'btn-ghost bg-base-200' : 'btn-ghost bg-base-200 opacity-40'"
            title="Step the caret back to the previous sentence break, without changing anything">
      <i class="ph ph-caret-double-left"></i>
    </button>
    <!-- THE STITCH, IN TWO TAPS. The first shows where it would happen and
         changes nothing; the second does it. This is the one edit on the page
         that rewrites a sentence somewhere other than where the reader is
         looking, so it is the one worth a glance before it lands, and the
         marker is a badge hovering over the spot with a stem down to the line,
         drawn in the overlay and changing nothing in the text: a first cut
         previewed the edit in place, which read well and reflowed the whole
         paragraph, since a capital and its lower-case twin are different
         widths.

         Step back between the two taps and the marker re-aims, since it is
         derived from the caret rather than stored. Tap the badge, or anywhere
         in the words, to back out.

         IT LOOKS LIKE THE OTHER KEYS UNTIL IT IS ARMED. It wore a warning tint
         whenever it was live, which at 20% over a ghost button read as a
         disabled control rather than an available one, and it was reported as
         a glitch. There is nothing to distinguish anyway now that it is out in
         the open with a cell of its own; the tint is worth something only for
         the armed state, where it means "this tap commits".

         DIMMED RATHER THAN GONE where there is no break to close. A key that
         came and went in the middle of a row would move the ones beside it
         under a thumb that had already learned where they are. -->
    <button @pointerdown.prevent="key('stitch')" :disabled="!stitchable && !mendArmed"
            class="btn h-14 min-h-0 grow basis-0 px-0 text-2xl"
            :class="mendArmed ? 'btn-warning' : (stitchable ? 'btn-ghost bg-base-200' : 'btn-ghost bg-base-200 opacity-40')"
            :title="stitchNote">
      <i class="ph ph-arrows-in-line-horizontal"></i>
    </button>
    <!-- BACKSPACE, at the right end, where every keyboard the reader has ever
         used puts it. It is red because it is
         the one key here that takes a WORD away, and the tint is the aim: the
         marks are reached for by position and this one has to be found in a
         hurry, mid-sentence, without reading. The stitch beside it takes
         something away too and wears the warning tint rather than this one,
         which is the same distinction the pad's shift already draws: amber is
         a state or a repair, red is a deletion. It needs no
         `:disabled` for the keyboard half, since the row it is in is hidden
         there and the software keyboard has its own. -->
    <button @pointerdown.prevent="back()"
            class="btn btn-ghost bg-base-200 h-14 min-h-0 grow basis-0 px-0 text-error"
            title="Delete the last word, or the selection (dictation keeps running)">
      <i class="ph ph-backspace text-2xl"></i>
    </button>
  </div>

  <!-- ── The destinations ────────────────────────────────────────────────
       Four buttons, one tap each, in the row that used to hold one button
       that opened a sheet holding these four. The row is the same rhythm as
       the keys above it and half a step shorter, which is the whole visual
       statement that it is a different kind of control: keys compose, these
       end it. Copy and Share leave the words standing, Jot and Drop file
       them and clear the page, and the pair that needs a token is the pair
       that writes to a repository.

       A phone at 390px gives each of four 92px, so the name fits beside the
       icon and neither has to go. The row lays out `grow basis-0`, so
       Share dropping out on a browser with no `navigator.share` widens the
       other three rather than leaving a hole.

       NO TOKEN DOES NOT DISABLE Jot and Drop, which is the one place this row
       departs from the sheet it replaces. The sheet could afford to grey them
       out because it had a paragraph underneath saying why; a row has nowhere
       to put that sentence except a permanent line between these buttons and
       the keys, costing 34px on every screen to explain a state most readers
       are never in. So the tap is left live and `commit()` answers it with the
       toast it already carried and the sheet made unreachable: no token here,
       use Copy or Share. The explanation arrives when it is asked for. -->
  <div class="shrink-0 flex items-stretch gap-1 px-1 pb-1 pt-1"
       style="padding-bottom:calc(env(safe-area-inset-bottom) + 0.25rem)">
    <button @click="copy()" :disabled="blank"
            class="btn h-12 min-h-0 grow basis-0 px-0 gap-1.5 text-sm"
            :class="lead('copy')" title="Copy the words, to paste into a chat">
      <i class="ph ph-clipboard-text text-lg"></i>Copy
    </button>
    <!-- THE TARGET, IN FILE MODE, small and on the centre line between Copy
         and Send, where a thumb rests. A note's row has four destinations and
         no room for a fifth, so there it stays in the header. Two gestures on one button, because they are one job:
         drag it and the caret moves, tap it and the caret becomes one end of
         a selection whose other end is your next tap. Armed it wears the ring
         an armed pin wears, which is this page's one word for "live and
         pointed at the text". touch-action:none inline is what makes the drag
         work rather than scrolling the page under it.

         UNDER NATIVE SELECTION it is also the Move, in two steps that say
         what they are. With words selected it lights, and a tap holds them:
         the held words stay washed, a cancel appears beside the target, and
         yellow wedges above and below the caret point at where the words
         would go, with a small Move here tag (markAim). Then aim: drag the
         target, or drag or tap anywhere on the text, and the caret and its
         markers follow. Nothing lands until Move here is tapped, on the tag
         or on the target. Tapped without aiming, the words stay where they
         were. -->
    <!-- Two buttons side by side, not a daisyUI join: a join squares its
         members' inner corners by DOM position, and with the cancel hidden
         the target was still its second member, square on one side.
         NOT ON A DESK: a mouse points at the text itself, drags a selection
         to move it, and has the arrow keys, so the pad has nothing to add. -->
    <div x-show="file && !desk" class="flex gap-1 shrink-0">
      <button x-show="moveArm" @click="cancelMove()" data-move-cancel
              class="btn h-12 min-h-0 w-10 px-0 btn-ghost bg-base-200" title="Leave the words where they were">
        <i class="ph ph-x text-lg"></i>
      </button>
      <button x-init="bindPad($el)" :disabled="edit" style="touch-action:none" data-target
              class="btn h-12 min-h-0 shrink-0"
              :class="'w-12 px-0 ' + (moveArm ? 'btn-primary' : moveReady ? 'btn-primary btn-outline'
                      : armed ? 'btn-error btn-outline' : (padDrag ? 'btn-info' : 'btn-ghost'))"
              :title="moveArm ? 'Drag here or on the text to aim, then tap to move the words there'
                      : moveReady ? 'Tap to pick up the selected words and move them'
                      : armed === 'anchor' ? 'Now tap where the selection should end (tap here again to cancel)'
                      : armed ? 'The ' + armed + ' of the selection is armed. Tap here to put it down.'
                      : 'Drag to move the cursor. Tap to start a selection from it.'">
        <i class="ph text-xl" :class="moveArm || moveReady ? 'ph-arrows-out-cardinal' : 'ph-crosshair'"></i>
      </button>
    </div>
    <!-- SEND, IN THE SLOT SHARE HELD, and it is the same button rather than a
         sixth one. Share was one destination among four and is now one row
         inside this one, beside the two that start a session somewhere. That
         is what it always was: a chooser with a single option, opened by the
         operating system instead of by this page.

         It also fixes what Share could not say. `x-show="canShare"` meant the
         button simply was not there on a browser without navigator.share,
         which is most desktops, with nothing on screen to say why or what the
         alternative was. This button is unconditional and the SHARE ROW inside
         it carries the absence, greyed with its reason, the way the sheet
         already treats a target with no link.

         A separate icon-only Send sat at the end of this row for one commit.
         It was narrower than the four beside it, which read as an afterthought
         because it was one, and it took the row to five across and cost the
         other four their labels under 375px. Folding it in gives all of that
         back: four buttons, four labels, one width. -->
    <!-- IN FILE MODE SEND IS THE DESTINATION BUTTON, and Save is one of the
         places it goes: back to GitHub, to a Claude Code session, to the
         system sheet. It is lit while the edit is unsaved, so its colour still
         answers "is this saved" the way Save's did. -->
    <button @click="openSend()" :disabled="blank && !file"
            class="btn h-12 min-h-0 grow basis-0 px-0 gap-1.5 text-sm"
            :class="file ? (dirty ? 'btn-primary' : 'btn-ghost bg-base-200') : lead('send')"
            :title="(file ? 'Save it, share it, or send the edit somewhere that can act on it' : 'Share it, or send it somewhere that can act on it') + (desk ? ' (' + chord('⌘↵') + ')' : '')">
      <i class="ph ph-paper-plane-tilt text-lg"></i>Send
    </button>
    <button x-show="!file" @click="jot()" :disabled="blank || !!saving"
            class="btn h-12 min-h-0 grow basis-0 px-0 gap-1.5 text-sm"
            :class="lead('jot')" title="File it in the estate's jots pile, beside the others">
      <i class="ph ph-note-pencil text-lg"></i>Jot
    </button>
    <button x-show="!file" @click="drop()" :disabled="blank || !!saving"
            class="btn h-12 min-h-0 grow basis-0 px-0 gap-1.5 text-sm"
            :class="lead('drop')" :title="'Write a dated markdown file into ' + destName + ', for the next drain'">
      <i class="ph ph-tray-arrow-down text-lg"></i>Drop
    </button>
  </div>

  <!-- ── Send ─────────────────────────────────────────────────────────────
       The aiming, which is the thing this page has room for and the composer
       on a page does not. Three bands: where it goes, what goes with it, and
       one line saying what will not ride.

       THE UNAVAILABLE TARGET IS ON SCREEN, greyed, carrying its reason. Gemini
       accepts no prompt parameter and AI Studio takes only model and
       grounding, so there is nothing to link; omitting the row would make that
       look like an oversight every time somebody went looking for it. The
       estate dims a session that names no id for the same reason rather than
       dropping the row, and the Share button at the foot carries its own
       absence the same way on a browser with no share sheet.

       AND THE FOOT HOLDS TWO BUTTONS, NOT ONE. Share was a row here for one
       commit, which made the system sheet cost two taps: pick it, then
       confirm. That is a confirm over a choice already made, and the thing it
       opens is itself a chooser. The rows are the links, which need a
       repository or a warning read first; Share needs neither and costs what
       Copy costs.

       AND THE ROW SAYS WHETHER IT SUBMITS. Claude Code prefills a composer and
       waits; ChatGPT is reported to send on arrival. That difference is the
       whole safety story of a one-tap control and cannot live in a doc. -->
  <div x-show="sendOpen" x-cloak class="fixed inset-0 z-[90] flex items-end justify-center">
    <div class="absolute inset-0 bg-black/40" @click="sendOpen = false"></div>
    <!-- THE HEIGHT IS ESTABLISHED, NOT DERIVED FROM THE SELECTION. Measured at
         390px before this was written: 389 for Share and ChatGPT, 433 for
         Gemini's greyed reason, 523 with the repository chips, 611 with the
         over-cap line too. A sheet that resizes by 222px as a thumb moves down
         four rows puts the button that acts somewhere new each time, which is
         the one control that must not move.

         So the variable half below sits in a box with a floor under it, and the
         panel scrolls rather than growing past the viewport. The floor is in
         rem so it tracks the type rather than the screen; the cap is in vh
         because what it is protecting against IS the screen.

         Measured again after: 537 at every row on a 390 screen, 569 at every
         row on a 320 one. The one state that still grows is the over-cap
         refusal, which is an error with something to say and not a selection,
         and it is what the scroll is for. -->
    <div class="relative w-full sm:max-w-md max-h-[85vh] overflow-y-auto bg-base-100 rounded-t-2xl border-t border-base-300 p-4 flex flex-col gap-3"
         style="padding-bottom:calc(env(safe-area-inset-bottom) + 1.5rem)">
      <div class="flex items-center gap-2">
        <span class="font-medium">Send</span>
        <span class="font-mono text-xs opacity-40"
              x-text="file ? (sendWhat === 'patch' ? (patchText.split('\n').length + ' patch lines') : (words + ' words')) : (words + ' words')"></span>
        <div class="grow"></div>
        <button @click="sendOpen = false" class="btn btn-ghost btn-sm btn-square"><i class="ph ph-x text-lg"></i></button>
      </div>

      <!-- WHAT GOES, in file mode, above where: the edit as a patch, which is
           what a reviewer or a session wants, or the whole file. Save commits
           the file either way; the choice is for the other rows and the foot. -->
      <div x-show="file" class="join w-full">
        <button @click="sendWhat = 'patch'" :disabled="!dirty" class="join-item btn btn-sm grow"
                :class="sendWhat === 'patch' ? 'btn-active' : 'btn-ghost bg-base-200'">
          <i class="ph ph-git-diff"></i>The edit
        </button>
        <button @click="sendWhat = 'file'" class="join-item btn btn-sm grow"
                :class="sendWhat === 'file' ? 'btn-active' : 'btn-ghost bg-base-200'">
          <i class="ph ph-file-text"></i>The whole file
        </button>
      </div>
      <div class="flex flex-col gap-1">
        <template x-for="t in sendTargets" :key="t.key">
          <button @click="t.available && (sendTarget = t.key)" :disabled="!t.available"
                  class="flex items-center gap-2.5 rounded-lg border px-3 py-2 text-left transition-colors"
                  :class="!t.available ? 'border-base-300 opacity-40'
                          : sendTarget === t.key ? 'border-primary bg-primary/10' : 'border-base-300 hover:bg-base-200'">
            <i class="ph text-xl shrink-0" :class="t.icon"></i>
            <span class="min-w-0">
              <span class="block text-sm font-medium" x-text="t.label"></span>
              <span class="block text-xs opacity-60" x-text="t.available ? t.hint : t.reason"></span>
            </span>
            <span x-show="t.submits" class="ml-auto shrink-0 text-xs text-warning"
                  title="This one sends on arrival rather than waiting for you">sends</span>
          </button>
        </template>
      </div>

      <!-- ── The part that varies, over a floor ────────────────────────────
           Everything whose presence depends on which row is selected lives in
           here: the repository chips, and the lines saying what will not ride.
           The floor is the tallest of them, so moving between rows moves
           nothing on screen but the ring around the row. -->
      <div class="min-h-[8.5rem] flex flex-col gap-1.5">
      <!-- The repositories, for the one target that takes them. A session
           clones what it is given, so this is the difference between a prompt
           that can read the code and one that can only talk about it. -->
      <div x-show="sendTargetRow && sendTargetRow.takesRepos" class="flex flex-col gap-1.5">
        <div class="flex items-center gap-2">
          <span class="text-xs uppercase tracking-wide opacity-50">Repositories</span>
          <span x-show="sendRepos.length" class="font-mono text-xs opacity-40" x-text="sendRepos.length"></span>
        </div>
        <p x-show="!token" class="text-xs opacity-60">
          No token on this browser, so the list cannot be read. A ?repo= in the address still works.</p>
        <p x-show="repoErr" class="text-xs text-error" x-text="'Could not read the list: ' + repoErr"></p>
        <div class="flex flex-wrap gap-1.5 max-h-40 overflow-y-auto">
          <template x-for="slug in sendRepoRows" :key="slug">
            <button @click="toggleRepo(slug)"
                    class="badge badge-lg gap-1 cursor-pointer font-mono text-xs"
                    :class="sendRepos.includes(slug) ? 'badge-primary' : 'badge-ghost'">
              <i class="ph text-sm" :class="sendRepos.includes(slug) ? 'ph-check' : 'ph-plus'"></i>
              <span x-text="slug.split('/')[1] || slug"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- WHAT WILL NOT RIDE, in the sheet rather than in a doc, because it is
           different on every send. The over-cap case is a refusal and says the
           number: a prompt cut at a character boundary reads as a complete
           instruction and gets acted on, so the only edit worth making is the
           reader's own. -->
      <p x-show="sendOver" class="text-xs text-error"
         x-text="'Too long to carry: ' + outgoing().length + ' characters against a '
                 + (window.PromptLink ? window.PromptLink.PROMPT_MAX : 0) + ' limit. Shorten it, or Copy instead.'"></p>
      <template x-for="d in sendLink.dropped" :key="d">
        <p class="text-xs opacity-60" x-text="'Not carried: ' + d"></p>
      </template>
      </div>

      <!-- TWO WAYS TO FINISH, both one tap. The rows above choose between the
           links; Share is not one of them and never needed choosing, so it
           stands beside the primary rather than above it. It carries its own
           absence the way an unreachable row does: disabled with the reason in
           its title on a browser that has no sheet, rather than vanishing and
           leaving three buttons where there were four. -->
      <div class="flex items-stretch gap-2">
        <button @click="sendOpen = false; share()" :disabled="!canShare"
                class="btn h-12 min-h-0 gap-2 shrink-0 px-4"
                :title="canShare ? 'The system sheet: any app on this device'
                                 : 'This browser has no share sheet. Copy the words instead.'">
          <i class="ph ph-share-network text-lg"></i>
          <span>Share</span>
        </button>
        <button x-show="file" @click="copyPayload()"
                class="btn h-12 min-h-0 grow basis-0 gap-1.5 btn-ghost bg-base-200"
                :title="sendWhat === 'patch' ? 'Copy the patch: git apply takes it' : 'Copy the whole file'">
          <i class="ph ph-clipboard-text text-lg"></i><span>Copy</span>
        </button>
        <button @click="send()" :disabled="!sendReady"
                class="btn btn-primary h-12 min-h-0 gap-2 grow">
          <i class="ph text-lg" :class="sendTarget === 'save' ? 'ph-floppy-disk' : 'ph-paper-plane-tilt'"></i>
          <span x-text="sendTarget === 'save' ? (saving ? 'Saving\u2026' : 'Save') : (sendTargetRow && sendTargetRow.submits) ? 'Open and send' : 'Open, prefilled'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Autocorrect ─────────────────────────────────────────────────────
       The list AND the way to add to it, in one sheet, because they were one
       thing pretending to be two: a form in the page and the list itself
       behind a link out to GitHub, which is a place you cannot get back from
       with a note half spoken. Nothing explains itself: heard, meant, Add,
       and the rows underneath. -->
  <div x-show="autoOpen" x-cloak class="fixed inset-0 z-[90] flex items-end justify-center">
    <div class="absolute inset-0 bg-black/40" @click="autoOpen = false"></div>
    <div class="relative w-full bg-base-100 rounded-t-2xl border-t border-base-300 p-4 flex flex-col gap-3"
         style="padding-bottom:calc(env(safe-area-inset-bottom) + 1.5rem)">
      <div class="flex items-center gap-2">
        <span class="font-medium">Autocorrect</span>
        <span class="font-mono text-xs opacity-40" x-text="corrections.length"></span>
        <div class="grow"></div>
        <button @click="autoOpen = false" class="btn btn-ghost btn-sm btn-square"><i class="ph ph-x text-lg"></i></button>
      </div>

      <input x-model="autoFrom" placeholder="heard" class="input input-bordered w-full text-lg">
      <input x-model="autoTo" x-ref="autoTo" placeholder="meant" class="input input-bordered w-full text-lg">
      <button @click="saveAuto()" :disabled="!autoFrom.trim() || !autoTo.trim() || !token"
              class="btn btn-primary w-full">Add</button>

      <!-- The rows, newest first, so a correction just added is the one you
           are looking at. Capped and scrolling: the list grows without bound
           and the sheet must not. -->
      <div x-show="corrections.length" class="max-h-56 overflow-y-auto -mx-1 px-1 divide-y divide-[var(--color-base-200)]">
        <template x-for="c in [...corrections].reverse()" :key="c.from">
          <div class="flex items-center gap-2 py-2">
            <span class="min-w-0 truncate opacity-60" x-text="c.from"></span>
            <i class="ph ph-arrow-right text-sm opacity-30 shrink-0"></i>
            <span class="min-w-0 truncate" x-text="c.to"></span>
            <div class="grow"></div>
            <button @click="dropAuto(c.from)" :disabled="!token"
                    class="btn btn-ghost btn-xs btn-square opacity-40 hover:opacity-100 hover:text-error">
              <i class="ph ph-x"></i>
            </button>
          </div>
        </template>
      </div>
      <p x-show="!token" class="text-sm opacity-50">This browser has no GitHub token, so the list is read-only.</p>
    </div>
  </div>

<div class="toast toast-top toast-center z-[95]" x-data x-show="$store.toasts && $store.toasts.length">
  <template x-for="t in ($store.toasts || [])" :key="t.id">
    <div class="alert text-base gap-2" :class="t.cls">
      <i class="ph" :class="'ph-'+t.icon"></i>
      <span x-text="t.msg"></span>
    </div>
  </template>
</div>

</body>
</html>
