<!doctype html>
<html lang="en" data-theme="emerald">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Walkthrough</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧹</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

<!--
  walkthrough.html — a branch-review/1 surface read as a walkthrough of a large
  documentation change across repositories: what each document was judged, what
  left it and why, and what is left for the owner.

    #src=owner/repo[@ref]:path     the surface, fetched with the stored token
    &lens=documents|findings|questions   &item=<item id>   &tab=summary|compare
    &repo= &outcome=               the Documents filters

  The surface is the one the builder beside the data writes (for the first use,
  home projects/text/runs/2026-10-22-doc-survey/build-walkthrough.py). A file
  item's metadata carries words before and after, the outcome, the cuts and
  the survey's verdict; `context.compares` pins each repository's base and head.

  The Documents list has three levels in one run of rows: the whole estate,
  then each area, then the area's documents, so the totals are the first card
  rather than a page of their own. A document's Comparison mounts the same
  file card the file deck and the Review page use (alpineComponents/
  file-review.js), whose readings are the file, the source diff and the
  rendered comparison.

  Lists are html-style rule 12 (kits/linked-swiper.js): one root, re-mounted
  with the rows of the lens in view.
-->
<script>window.__depsReady = new Promise(r => { window.__depsDone = r; });</script>
<script type="module">
  const q = new URLSearchParams(location.search);
  const ref = q.get('use') || (q.getAll('refs').map(v => (String(v).match(/^mehrlander\/web-tools@([^:]+)$/) || [])[1]).find(Boolean));
  if (ref) {
    const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/dist/web-tools.js`, { cache: 'no-store' });
    if (!src.ok) throw new Error(`?use=${ref}: could not fetch the bundle (HTTP ${src.status})`);
    const url = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
    try { await import(url); } finally { URL.revokeObjectURL(url); }
  } else {
    await import('../dist/web-tools.js');
  }
  try {
    await gh.load('kits/gz-payload.js');
    await gh.load('gh-store.js');
    await gh.load('kits/swipe-deck.js');
    await gh.load('kits/dock-split.js');
    await gh.load('kits/linked-swiper.js');
    await gh.load('kits/subject-channel.js');
    await gh.load('kits/file-deck.js');
    await gh.load('kits/cm6-merge.js');
    await gh.load('alpineComponents/file-review.js');
  } finally { window.__depsDone(); }
</script>
</head>
<body class="h-dvh flex flex-col bg-base-200 text-base-content overflow-hidden [&[x-cloak]]:hidden"
      x-data="walkthrough()" x-cloak @click="act($event)">

<header class="flex-none border-b border-base-300 bg-base-100">
  <div class="flex items-center gap-2 px-3 pt-2">
    <i class="ph ph-broom text-lg text-base-content/60"></i>
    <h1 class="min-w-0 flex-1 truncate text-base font-bold" x-text="env?.manifest?.name || 'Walkthrough'"></h1>
    <button type="button" class="btn btn-ghost btn-sm btn-square" x-show="env" @click="$refs.info.showModal()"
            aria-label="Pull requests and sources"><i class="ph ph-info text-lg"></i></button>
  </div>
  <div class="text-balance px-3 pb-1 font-mono text-xs tabular-nums text-base-content/70" x-show="env" x-text="headline"></div>
  <div role="tablist" class="tabs tabs-border flex-nowrap overflow-x-auto px-1" x-show="env">
    <template x-for="l in lenses" :key="l.id">
      <button type="button" role="tab" class="tab flex-none gap-1.5 text-sm" :class="lens === l.id && 'tab-active'" @click="setLens(l.id)">
        <span x-text="l.label"></span><span class="font-mono text-xs text-base-content/50" x-show="l.n" x-text="l.n"></span>
      </button>
    </template>
  </div>
</header>

<div x-show="loading" class="flex items-center gap-2 px-3 py-3 opacity-70">
  <span class="loading loading-spinner loading-sm"></span> Loading
</div>
<div x-show="error" class="alert alert-error m-3 px-3 py-2">
  <i class="ph ph-warning-circle"></i><span x-text="error"></span>
</div>
<form x-show="!loading && !env" class="flex gap-2 p-3" @submit.prevent="openSrc()">
  <input x-model="srcInput" class="input input-sm min-w-0 flex-1 font-mono" placeholder="owner/repo@ref:path.surface.json" aria-label="Surface address" />
  <button class="btn btn-sm">Open</button>
</form>

<main x-show="env" class="flex min-h-0 flex-1 flex-col">
  <div x-show="lens === 'documents'" class="flex-none space-y-1 border-b border-base-300 bg-base-100 px-3 py-1.5">
    <template x-for="f in filterRows" :key="f.key">
      <div class="flex items-center gap-2">
        <span class="w-14 flex-none text-xs text-base-content/60" x-text="f.label"></span>
        <div class="flex min-w-0 flex-1 gap-1 overflow-x-auto whitespace-nowrap">
          <template x-for="o in f.options" :key="o.value">
            <button type="button" class="btn btn-xs rounded-full font-normal" :class="filters[f.key] === o.value ? 'btn-neutral' : 'btn-ghost'"
                    @click="setFilter(f.key, o.value)">
              <span x-text="o.label"></span><span class="font-mono opacity-60" x-show="o.n != null" x-text="o.n"></span>
            </button>
          </template>
        </div>
      </div>
    </template>
  </div>
  <div class="flex min-h-0 flex-1 flex-col p-2.5">
    <div x-ref="root">
      <div x-ref="list" role="listbox" aria-label="Items"></div>
      <div x-ref="card"></div>
    </div>
  </div>
</main>

<dialog x-ref="info" class="modal">
  <div class="modal-box max-w-3xl text-sm">
    <h2 class="mb-2 text-base font-bold">Repositories</h2>
    <table class="table table-sm mb-4">
      <tbody>
        <template x-for="c in ctx.compares || []" :key="c.repository">
          <tr>
            <td class="font-mono text-xs" x-text="c.repository"></td>
            <td><a class="underline" target="_blank" :href="gh().compare(c.repository, c.base.revision, c.head.ref)">compare</a></td>
            <td><a class="underline" target="_blank" x-show="c.pr" :href="gh().pull(c.repository, c.pr)" x-text="'#' + c.pr"></a></td>
            <td class="font-mono text-xs text-base-content/60" x-text="c.base.revision.slice(0, 7) + ' → ' + c.head.revision.slice(0, 7)"></td>
          </tr>
        </template>
      </tbody>
    </table>
    <div class="font-mono text-xs text-base-content/60">
      <a class="underline" target="_blank" :href="srcUrl" x-text="src"></a>
      <div x-text="env?.manifest?.created_at"></div>
    </div>
    <div class="modal-action"><form method="dialog"><button class="btn btn-sm">Close</button></form></div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script>
document.addEventListener('alpine:init', () => {
  const esc = (s) => window.esc(s);
  const md = (s, inline) => {
    if (!s) return '';
    if (!window.marked) return esc(s);
    return inline ? marked.parseInline(String(s)) : marked.parse(String(s));
  };
  const MD = 'text-pretty [&_a]:underline [&_code]:rounded [&_code]:bg-base-200 [&_code]:px-1 [&_code]:font-mono [&_p]:mb-2 [&_ul]:mb-2 [&_ul]:list-disc [&_ul]:pl-5 [&_ol]:mb-2 [&_ol]:list-decimal [&_ol]:pl-5';
  const label = t => `<div class="mb-1 text-xs font-semibold uppercase tracking-wide text-base-content/60">${esc(t)}</div>`;
  const LENSES = [['documents', 'Documents'], ['findings', 'Findings'], ['questions', 'Questions']];
  const ESTATE = 'estate';
  // The compare API's word for a file the branch deleted, which the file card reads.
  const STATUS = { deleted: 'removed' };
  let SEQ = 0;

  Alpine.data('walkthrough', () => ({
    env: null, src: '', srcInput: '', loading: true, error: '',
    lens: 'documents', sel: {}, filters: { repo: '', outcome: '' }, tab: 'summary',
    _swiper: null, _deck: null, _index: new Map(),

    get token() { return window.TOKEN || window.ghAuth?.resolve() || ''; },
    gh() { return window.RepoAddress.github; },
    get ctx() { return this.env?.context || {}; },
    get docs() { return (this.env?.items || []).filter(i => i.type === 'file'); },
    get findings() { return (this.env?.items || []).filter(i => i.role === 'finding'); },
    get questions() { return (this.env?.items || []).filter(i => i.role === 'question'); },
    // Counted: a living document, before or after. Records and supporting files
    // are listed but kept out of the word totals.
    get prose() { return this.docs.filter(d => this.m(d).counted); },
    m(d) { return d.metadata || {}; },
    repoOf(d) { return (d.target?.source?.repository || '').split('/')[1] || ''; },
    plain(t) { return String(t || '').replace(/`/g, ''); },
    get srcUrl() {
      const a = this.src && window.RepoAddress?.parse(this.src);
      return a ? this.gh().blob(a.repo, a.ref || 'main', a.path) : '';
    },

    // Figures --------------------------------------------------------------
    fmt(n) { return (n || 0).toLocaleString('en-US'); },
    pct(b, a) {
      if (!b) return a ? 'new' : '';
      const p = Math.round(100 * (a - b) / b);
      return (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p) + '%';
    },
    // One scale per table. The kept share is neutral and the removed share is
    // the page's one accent, red as removed text is in the comparison.
    bar(before, after, max) {
      const w = max ? 100 * Math.max(before, after) / max : 100;
      const keep = Math.min(before, after), cut = Math.max(0, before - after), grew = Math.max(0, after - before);
      const tot = Math.max(before, after) || 1;
      return `<div class="flex h-2 overflow-hidden rounded-sm" style="width:${w}%">`
        + `<div class="bg-base-content/25" style="width:${100 * keep / tot}%"></div>`
        + (cut ? `<div class="bg-error" style="width:${100 * cut / tot}%"></div>` : '')
        + (grew ? `<div class="bg-base-content/60" style="width:${100 * grew / tot}%"></div>` : '')
        + '</div>';
    },
    get key() {
      const dot = c => `<span class="inline-block size-2 rounded-sm ${c}"></span>`;
      return `<span class="inline-flex items-center gap-1 font-normal">${dot('bg-base-content/25')}kept${dot('ml-2 bg-error')}cut</span>`;
    },
    estOf(d) { const v = parseFloat(String(this.m(d).survey?.cut_pct ?? '')); return isNaN(v) ? null : v; },
    weightedEst(list) {
      let w = 0, s = 0;
      for (const d of list) { const e = this.estOf(d); if (e != null) { w += this.m(d).words_before; s += e * this.m(d).words_before; } }
      return w ? Math.round(s / w) : null;
    },
    sum(list, k) { return list.reduce((t, d) => t + (this.m(d)[k] || 0), 0); },
    removed(d) { return this.m(d).words_before - this.m(d).words_after; },
    stats(list) {
      const outcomes = {};
      for (const d of list) {
        const o = this.m(d).outcome || 'not in a wave';
        (outcomes[o] ||= { outcome: o, docs: 0, removed: 0 }).docs++;
        outcomes[o].removed += Math.max(0, this.removed(d));
      }
      return {
        docs: list.length, changed: list.filter(d => d.change).length,
        deleted: list.filter(d => d.change?.status === 'deleted').length,
        before: this.sum(list, 'words_before'), after: this.sum(list, 'words_after'),
        est: this.weightedEst(list), counted: list.some(d => this.m(d).counted),
        outcomes: Object.values(outcomes).sort((a, b) => b.removed - a.removed || b.docs - a.docs),
      };
    },
    get totals() { return this.stats(this.prose); },
    get headline() {
      const t = this.totals, open = this.questions.filter(q => this.m(q).status !== 'applied').length;
      return `${this.fmt(t.before)} → ${this.fmt(t.after)} words (${this.pct(t.before, t.after)}) · `
        + `${t.changed} of ${t.docs} living documents changed · ${t.deleted} deleted · ${open} open questions`;
    },
    areaDocs(area) { return this.docs.filter(d => d.facet === area); },

    // Lenses and filters -----------------------------------------------------
    get lenses() {
      const n = { documents: this.docs.length, findings: this.findings.length, questions: this.questions.length };
      return LENSES.map(([id, label]) => ({ id, label, n: n[id] })).filter(l => l.n);
    },
    get filterRows() {
      const count = (key, v) => this.filtered({ ...this.filters, [key]: v }).length;
      const opts = (key, values) => [{ value: '', label: 'All', n: null }, ...values.map(v => ({ value: v, label: v, n: count(key, v) }))];
      return [
        { key: 'repo', label: 'Repo', options: opts('repo', [...new Set(this.docs.map(d => this.repoOf(d)))]) },
        { key: 'outcome', label: 'Outcome', options: opts('outcome', [...new Set(this.docs.map(d => this.m(d).outcome))].sort()) },
      ];
    },
    filtered(f = this.filters) {
      return this.docs.filter(d => (!f.repo || this.repoOf(d) === f.repo) && (!f.outcome || this.m(d).outcome === f.outcome));
    },
    // The Documents list in three levels: the estate, then each area, then the
    // area's documents, largest cut first. An area no filtered document is in
    // drops out with its rows.
    rows() {
      if (this.lens === 'findings') return this.findings;
      if (this.lens === 'questions') return this.questions;
      const shown = this.filtered(), out = [this._index.get(ESTATE)];
      for (const area of this.ctx.areas || []) {
        const ds = shown.filter(d => d.facet === area)
          .sort((a, b) => this.removed(b) - this.removed(a) || a.title.localeCompare(b.title));
        if (ds.length) out.push(this._index.get('area:' + area), ...ds);
      }
      return out;
    },
    byId(id) { return this._index.get(id); },

    setLens(l) {
      this._deck?.close?.();
      this.lens = l;
      this.address();
      this.$nextTick(() => this.mountList());
    },
    setFilter(key, v) {
      this.filters[key] = v;
      this.address();
      this.$nextTick(() => this.mountList());
    },
    // Within the list in view, a move is a pick: the strip and the list follow
    // and nothing else changes. Only an item of another lens changes the lens.
    goto(id) {
      const it = this.byId(id);
      if (!it) return;
      const lens = it.role === 'finding' ? 'findings' : it.role === 'question' ? 'questions' : 'documents';
      if (lens === this.lens && this.rows().some(r => r.id === id)) { this._swiper?.pick(id); return; }
      if (lens === 'documents' && it.type === 'file' && !this.filtered().includes(it)) this.filters = { repo: '', outcome: '' };
      this.sel[lens] = id;
      this.setLens(lens);
    },
    address() {
      const h = new URLSearchParams();
      if (this.src) h.set('src', this.src);
      if (this.lens !== 'documents') h.set('lens', this.lens);
      for (const k of ['repo', 'outcome']) if (this.lens === 'documents' && this.filters[k]) h.set(k, this.filters[k]);
      if (this.sel[this.lens]) h.set('item', this.sel[this.lens]);
      if (this.tab !== 'summary') h.set('tab', this.tab);
      history.replaceState(null, '', '#' + h.toString().replace(/%2F/g, '/').replace(/%3A/g, ':').replace(/%40/g, '@'));
    },

    // The list and the strip ------------------------------------------------
    // The folder gives way before the filename does: it truncates, and the
    // name keeps its width.
    pathHtml(d) {
      const p = d.title, i = p.lastIndexOf('/');
      return `<span class="flex min-w-0">`
        + (i >= 0 ? `<span class="min-w-0 truncate text-base-content/50">${esc(p.slice(0, i + 1))}</span>` : '')
        + `<span class="min-w-0 shrink-0 truncate">${esc(p.slice(i + 1))}</span></span>`;
    },
    rowHtml(it) {
      const sel = this.sel[this.lens] === it.id;
      const base = 'flex cursor-pointer items-baseline gap-2 border-b px-2.5 py-1.5 text-sm aria-selected:bg-base-300';
      const row = (cls, name, right) => `<div role="option" tabindex="0" data-item="${esc(it.id)}" aria-selected="${sel}"
        class="${base} ${cls}">${name}${right}</div>`;
      const mono = t => `<span class="flex-none font-mono text-xs text-base-content/60">${esc(t)}</span>`;
      const delta = r => `<span class="w-16 flex-none text-right tabular-nums">${r ? (r > 0 ? '−' : '+') + this.fmt(Math.abs(r)) : ''}</span>`;
      if (it.type === 'estate' || it.type === 'area') {
        const s = it.type === 'estate' ? this.totals : this.stats(this.areaDocs(it.title));
        return row('border-base-300 bg-base-200 font-semibold hover:bg-base-300',
          `<span class="min-w-0 flex-1 truncate">${esc(it.title)}</span>`,
          mono(`${s.docs} docs`) + `<span class="w-16 flex-none text-right tabular-nums">${s.counted ? this.pct(s.before, s.after) : ''}</span>`);
      }
      if (it.type === 'file')
        return row('border-base-200 hover:bg-base-200', `<span class="min-w-0 flex-1">${this.pathHtml(it)}</span>`,
          mono(this.m(it).outcome) + delta(this.removed(it)));
      return row('border-base-200 hover:bg-base-200', `<span class="min-w-0 flex-1 truncate">${esc(this.plain(it.title))}</span>`,
        mono(this.m(it).status || ''));
    },
    listHtml(rows) {
      if (this.lens === 'documents') return rows.map(it => this.rowHtml(it)).join('');
      let group = null;
      return rows.map(it => {
        const g = it.facet || '';
        const head = g !== group ? `<div class="sticky top-0 z-10 bg-base-200 px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider text-base-content/60">${esc(group = g)}</div>` : '';
        return head + this.rowHtml(it);
      }).join('');
    },
    mountList() {
      const rows = this.rows();
      const ids = rows.map(r => r.id);
      if (!ids.includes(this.sel[this.lens])) this.sel[this.lens] = ids[0];
      this.$refs.list.innerHTML = this.listHtml(rows);
      if (!this._swiper) {
        this._swiper = linkedSwiper.attach({
          root: this.$refs.root, list: this.$refs.list, card: this.$refs.card, key: 'item',
          ids: () => this.rows().map(r => r.id), sel: () => this.sel[this.lens],
          noun: 'item', seam: 'walkthrough-list', listMax: 'max-h-[38vh]',
          name: id => this.nameOf(id),
          body: id => this.cardHtml(id),
          drawn: el => this.showTab(el),
          release: (i, el) => this.releaseReview(el),
          empty: '<div class="p-4 text-sm text-base-content/60">Nothing matches.</div>',
          onPick: (id, via) => {
            this.sel[this.lens] = id;
            this.address();
            if (this._deck && via !== 'deck') this._deck.deck.go(this.rows().findIndex(r => r.id === id), 'instant');
          },
          deck: () => this.openDeck(),
        });
      } else {
        this._swiper.mount();
      }
      // Marked again after the kit has stacked the layout, which shortens the
      // list under a phone's width after the first mark measured it.
      const keep = () => linkedSwiper.mark(this.$refs.list, 'item', this.sel[this.lens]);
      this.$nextTick(() => requestAnimationFrame(() => requestAnimationFrame(keep)));
    },
    nameOf(id) {
      const it = this.byId(id) || {};
      if (it.type === 'estate') return { title: it.title };
      if (it.type === 'area') return { code: 'area', title: it.title };
      if (it.type !== 'file') return { code: it.facet, title: this.plain(it.title) };
      const p = it.title, i = p.lastIndexOf('/');
      return { code: this.repoOf(it) + ' ' + p.slice(0, i + 1), title: p.slice(i + 1) };
    },
    openDeck() {
      const rows = this.rows();
      this._deck = swipeDeck.open({
        count: rows.length, start: Math.max(0, rows.findIndex(r => r.id === this.sel[this.lens])),
        title: LENSES.find(l => l[0] === this.lens)[1], icon: 'ph-broom', innerClass: 'w-full',
        index: i => ({ title: this.plain(rows[i].title), group: rows[i].facet }),
        render: (i, el) => {
          el.innerHTML = `<h2 class="mb-1 text-2xl font-bold text-balance break-words">${esc(this.plain(rows[i].title))}</h2>`
            + `<div class="mb-3 font-mono text-xs text-base-content/60">${esc(rows[i].facet || '')}</div>` + this.cardHtml(rows[i].id, true);
          this.showTab(el);
        },
        release: (i, el) => this.releaseReview(el),
        onSlide: i => this._swiper?.pick(rows[i].id),
        onClose: () => { this._deck = null; },
      });
    },

    // Cards -----------------------------------------------------------------
    // `big` is the takeover's reading size; the strip's card is a working surface.
    cardHtml(id, big) {
      const it = this.byId(id);
      if (!it) return '';
      const size = big ? 'text-xl leading-8' : 'text-sm';
      const card = it.type === 'estate' ? this.estateCard(size) : it.type === 'area' ? this.areaCard(it, size)
        : it.type === 'file' ? this.docCard(it, size) : this.noteCard(it, size);
      return `<div class="space-y-4 ${size}">${card}</div>`;
    },
    // daisyUI sizes a table's cells, not the table, so the takeover sizes them too.
    table(size) { return size === 'text-sm' ? 'table table-sm text-sm' : 'table [&_td]:text-xl [&_td]:leading-8 [&_th]:text-base'; },
    figure(before, after, est) {
      const delta = before - after;
      return `<div><div class="mb-1 text-balance tabular-nums">${this.fmt(before)} → ${this.fmt(after)} words`
        + (delta ? ` · ${delta > 0 ? '−' : '+'}${this.fmt(Math.abs(delta))} (${this.pct(before, after)})` : '')
        + (est != null && est !== '' ? `<span class="text-base-content/60"> · survey est. −${esc(String(est).replace(/^−/, ''))}%</span>` : '') + '</div>'
        + this.bar(before, after, 0) + '</div>';
    },
    status(parts) { return `<div class="font-mono text-xs text-base-content/60">${esc(parts.filter(Boolean).join(' · '))}</div>`; },
    // Questions and findings open where they are read, rather than sending the
    // reader to another lens.
    inline(title, notes) {
      if (!notes.length) return '';
      return `<div>${label(`${title} (${notes.length})`)}<div class="space-y-1">` + notes.map(n => {
        const m = this.m(n);
        return `<details class="rounded-md border border-base-300 bg-base-100">`
          + `<summary class="flex cursor-pointer items-baseline gap-2 px-2.5 py-1.5"><span class="min-w-0 flex-1">${esc(this.plain(n.title))}</span>`
          + `<span class="flex-none font-mono text-xs text-base-content/60">${esc(m.status || '')}</span></summary>`
          + `<div class="border-t border-base-200 px-2.5 py-2 ${MD}">${md(n.content)}`
          + (n.commentary ? `${label('Recommended')}${md(n.commentary)}` : '') + '</div></details>';
      }).join('') + '</div></div>';
    },
    concerning(ids) {
      const set = new Set(ids);
      const touch = n => (n.related || []).some(r => set.has(r.item));
      return { questions: this.questions.filter(touch), findings: this.findings.filter(touch) };
    },
    estateCard(size) {
      const t = this.totals, out = [];
      out.push(this.status([`${t.docs} living documents`, `${t.changed} changed`, `${t.deleted} deleted`]));
      out.push(this.figure(t.before, t.after, t.est));
      const areas = (this.ctx.areas || []).map(a => ({ area: a, ...this.stats(this.areaDocs(a)) })).filter(a => a.docs);
      const max = Math.max(1, ...areas.filter(a => a.counted).map(a => Math.max(a.before, a.after)));
      out.push(`<div>${label('Areas')}<div class="overflow-x-auto"><table class="${this.table(size)}">`
        + `<thead><tr class="text-xs"><th>Area</th><th class="w-1/4 min-w-16">${this.key}</th><th class="text-right">Cut</th><th class="text-right">Survey est.</th></tr></thead><tbody>`
        + areas.map(a => `<tr class="cursor-pointer hover:bg-base-200 ${a.counted ? '' : 'text-base-content/60'}" data-act="goto" data-id="${esc('area:' + a.area)}">`
          + `<td>${esc(a.area)}</td><td>${a.counted ? this.bar(a.before, a.after, max) : ''}</td>`
          + `<td class="text-right tabular-nums">${a.counted ? this.pct(a.before, a.after) : `${a.docs} files`}</td>`
          + `<td class="text-right tabular-nums text-base-content/60">${a.counted && a.est != null ? '−' + a.est + '%' : ''}</td></tr>`).join('')
        + '</tbody></table></div></div>');
      out.push(`<div>${label('Stages')}<div class="overflow-x-auto"><table class="${this.table(size)}"><tbody>`
        + (this.ctx.stages || []).map(st => `<tr class="align-top"><td>${esc(st.name)}</td>`
          + `<td class="whitespace-nowrap text-right tabular-nums">${this.fmt(st.count)}</td>`
          + `<td>${esc(st.unit)}<span class="block text-base-content/60">${esc(st.detail || '')}</span></td></tr>`).join('')
        + '</tbody></table></div></div>');
      out.push(this.outcomes(t.outcomes, size));
      const estate = this.findings.filter(f => !(this.ctx.areas || []).includes(f.facet));
      out.push(this.inline('Findings across the estate', estate));
      return out.join('');
    },
    outcomes(list, size) {
      const max = Math.max(1, ...list.map(o => o.removed));
      return `<div>${label('Outcomes')}<div class="overflow-x-auto"><table class="${this.table(size)}">`
        + `<thead><tr class="text-xs"><th>Outcome</th><th class="text-right">Docs</th><th class="text-right" colspan="2">Words removed</th></tr></thead><tbody>`
        + list.map(o => `<tr class="cursor-pointer hover:bg-base-200" data-act="filter" data-key="outcome" data-value="${esc(o.outcome)}">`
          + `<td>${esc(o.outcome)}</td><td class="text-right tabular-nums">${o.docs}</td>`
          + `<td class="text-right tabular-nums">${o.removed ? this.fmt(o.removed) : ''}</td>`
          + `<td class="w-1/3">${o.removed ? `<div class="h-2 rounded-sm bg-error" style="width:${100 * o.removed / max}%"></div>` : ''}</td></tr>`).join('')
        + '</tbody></table></div></div>';
    },
    areaCard(it, size) {
      const ds = this.areaDocs(it.title), s = this.stats(ds), out = [];
      out.push(this.status([s.counted ? `${s.docs} living documents` : `${s.docs} files`, `${s.changed} changed`, s.deleted && `${s.deleted} deleted`]));
      if (s.counted) out.push(this.figure(s.before, s.after, s.est));
      const top = ds.filter(d => this.removed(d) > 0).sort((a, b) => this.removed(b) - this.removed(a)).slice(0, 8);
      if (top.length) out.push(`<div>${label('Largest reductions')}<div class="overflow-x-auto"><table class="${this.table(size)}"><tbody>`
        + top.map(d => `<tr class="cursor-pointer hover:bg-base-200" data-act="goto" data-id="${esc(d.id)}">`
          + `<td class="max-w-0">${this.pathHtml(d)}</td><td class="w-1/4 min-w-16">${this.bar(this.m(d).words_before, this.m(d).words_after, this.m(top[0]).words_before)}</td>`
          + `<td class="whitespace-nowrap text-right tabular-nums">${this.pct(this.m(d).words_before, this.m(d).words_after)}</td></tr>`).join('')
        + '</tbody></table></div></div>');
      out.push(this.outcomes(s.outcomes, size));
      const repairs = ds.reduce((n, d) => n + (this.m(d).audit?.length || 0), 0);
      const fixes = ds.reduce((n, d) => n + (this.m(d).wave1?.length || 0), 0);
      const reports = [...new Set(ds.map(d => this.m(d).survey?.report).filter(Boolean))];
      out.push(`<div>${label('Stages')}<div>${fixes} wave 1 fixes · ${repairs} audit repairs`
        + (reports.length ? `<span class="text-base-content/60"> · survey ${esc(reports.join(', '))}</span>` : '') + '</div></div>');
      const c = this.concerning(ds.map(d => d.id));
      out.push(this.inline('Findings', this.findings.filter(f => f.facet === it.title || c.findings.includes(f))));
      out.push(this.inline('Questions', c.questions));
      return out.join('');
    },
    // A document's card has two readings, kept across cards as the reader moves:
    // what the cleanup did to it, and the document itself against its base.
    docCard(it, size) {
      const m = this.m(it);
      const tabs = [['summary', 'Summary'], ['compare', it.change ? 'Comparison' : 'Document']];
      const strip = `<div role="tablist" class="tabs tabs-box tabs-sm w-fit" data-tabs>`
        + tabs.map(([t, l]) => `<button type="button" role="tab" class="tab" data-act="tab" data-tab="${t}">${l}</button>`).join('') + '</div>';
      const head = this.status([this.repoOf(it), it.change ? it.change.status + (it.change.previous_path ? ' from ' + it.change.previous_path : '') : 'unchanged', m.outcome])
        + (m.words_before || m.words_after ? this.figure(m.words_before, m.words_after, m.survey?.cut_pct ? parseFloat(m.survey.cut_pct) || null : null) : '');
      return head + strip
        + `<div class="space-y-4" data-pane="summary">${this.docSummary(it, size)}</div>`
        + `<div class="hidden" data-pane="compare"><div data-review="${esc(it.id)}"></div></div>`;
    },
    docSummary(it, size) {
      const m = this.m(it), s = m.survey, out = [];
      if (it.commentary) out.push(`<div>${label('Now')}<div class="${MD}">${md(it.commentary)}</div></div>`);
      if (m.cuts?.length) {
        out.push(`<div>${label('Removed')}<div class="overflow-x-auto"><table class="${this.table(size)}"><tbody>`
          + m.cuts.map(c => `<tr class="align-top"><td class="w-1/4 min-w-28 ${MD}">${md(c.section, true)}</td>`
            + `<td class="whitespace-nowrap text-right tabular-nums">${c.words ? this.fmt(c.words) : ''}</td>`
            + `<td class="whitespace-nowrap font-mono text-xs text-base-content/60">${esc(c.kind || '')}</td>`
            + `<td class="${MD}">${md(c.why, true)}${c.owner ? ` <span class="text-base-content/60">→ ${md('`' + c.owner + '`', true)}</span>` : ''}</td></tr>`).join('')
          + '</tbody></table></div></div>');
      }
      if (m.moved_to) out.push(`<div>${label('Moved to')}<div class="${MD}">${md('`' + m.moved_to + '`', true)}</div></div>`);
      if (m.kept_on_purpose) out.push(`<div>${label('Kept on purpose')}<div class="${MD}">${md(m.kept_on_purpose)}</div></div>`);
      if (m.audit?.length) out.push(`<div>${label('Audit repairs')}<ul class="space-y-1 ${MD}">`
        + m.audit.map(a => `<li><span class="mr-1 font-mono text-xs text-base-content/60">${esc(a.kind || '')}</span>${md(a.what, true)}`
          + `${a.why ? ` <span class="text-base-content/60">${md(a.why, true)}</span>` : ''}</li>`).join('') + '</ul></div>');
      if (m.wave1?.length) out.push(`<div>${label('Wave 1 fixes')}<ul class="space-y-1 ${MD}">`
        + m.wave1.map(w => `<li><span class="mr-1 font-mono text-xs text-base-content/60">${esc(w.kind)}</span>${md(w.summary, true)}</li>`).join('') + '</ul></div>');
      if (s) out.push(`<div>${label('Survey')}<div class="mb-1"><span class="font-semibold">${esc(s.verdict)}</span>`
        + (s.issues?.length ? `<span class="ml-2 font-mono text-xs text-base-content/60">${esc(s.issues.join(' · '))}</span>` : '')
        + `</div><div class="${MD}">${md(s.note, true)}</div><div class="mt-1 font-mono text-xs text-base-content/50">${esc(s.report)}</div></div>`);
      const c = this.concerning([it.id]);
      out.push(this.inline('Questions', c.questions));
      out.push(this.inline('Findings', c.findings));
      return out.join('');
    },
    noteCard(it, size) {
      const m = this.m(it), out = [];
      out.push(this.status([it.facet, m.status]));
      if (it.content) out.push(`<div class="${MD}">${md(it.content)}</div>`);
      if (it.commentary) out.push(`<div>${label('Recommended')}<div class="${MD}">${md(it.commentary)}</div></div>`);
      const rel = (it.related || []).map(r => this.byId(r.item)).filter(Boolean);
      if (rel.length) out.push(`<div>${label('Documents')}<div class="flex flex-col items-start gap-1">${rel.map(r => this.gotoBtn(r)).join('')}</div></div>`);
      return out.join('');
    },
    gotoBtn(r) {
      return `<button type="button" class="btn btn-ghost btn-sm h-auto min-h-0 justify-start py-1 text-left font-normal" data-act="goto" data-id="${esc(r.id)}">`
        + `<i class="ph ph-file-text"></i><span class="break-all">${esc(`${this.repoOf(r)} ${r.title}`)}</span></button>`;
    },

    // The comparison -------------------------------------------------------
    // Show the reading the reader last chose in a card just drawn, and mount the
    // file card the first time its comparison is shown.
    showTab(root) {
      for (const strip of root.querySelectorAll('[data-tabs]'))
        for (const b of strip.querySelectorAll('[data-tab]')) b.classList.toggle('tab-active', b.dataset.tab === this.tab);
      for (const pane of root.querySelectorAll('[data-pane]')) pane.classList.toggle('hidden', pane.dataset.pane !== this.tab);
      if (this.tab === 'compare') for (const box of root.querySelectorAll('[data-review]')) this.mountReview(box);
    },
    // The same card the file deck mounts, with the same handoff: options through
    // a keyed global, so a path or a patch never has to survive an attribute.
    mountReview(box) {
      if (box.dataset.mounted) return;
      const it = this.byId(box.dataset.review), s = it?.target?.source;
      const cmp = (this.ctx.compares || []).find(c => c.repository === s?.repository);
      if (!s || !cmp || !window.Alpine) return;
      const key = box.dataset.mounted = '__walkthrough_' + (SEQ++);
      window[key] = {
        repo: s.repository, ref: cmp.head.ref, base: cmp.base.revision, baseName: 'main',
        path: s.path, prevPath: it.change?.previous_path || '', status: STATUS[it.change?.status] || it.change?.status || '',
        additions: this.m(it).lines_added ?? null, deletions: this.m(it).lines_removed ?? null,
        open: true, read: true, fill: true, openOn: it.change ? 'mddiff' : '',
      };
      const el = document.createElement('div');
      el.setAttribute('x-data', `fileReview(window.${key})`);
      box.append(el);
      window.Alpine.initTree(el);
    },
    releaseReview(root) {
      for (const box of root?.querySelectorAll?.('[data-mounted]') || []) delete window[box.dataset.mounted];
    },

    act(e) {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'goto') { if (this._deck && this.lens !== 'documents') this._deck.close?.(); this.goto(b.dataset.id); }
      if (b.dataset.act === 'filter') this.setFilter(b.dataset.key, b.dataset.value);
      if (b.dataset.act === 'tab') {
        this.tab = b.dataset.tab;
        this.address();
        this.showTab(document);
      }
    },

    // Loading -----------------------------------------------------------------
    param(key) {
      const h = new URLSearchParams(location.hash.slice(1)).get(key);
      return h || new URLSearchParams(location.search).get(key);
    },
    openSrc() {
      if (!this.srcInput.trim()) return;
      location.hash = 'src=' + this.srcInput.trim();
      location.reload();
    },
    // Every item by id, with the estate and one item per area beside the
    // surface's own, so the three levels of the list are rows like any other.
    index() {
      const ix = new Map((this.env.items || []).map(i => [i.id, i]));
      ix.set(ESTATE, { id: ESTATE, type: 'estate', title: 'All living documents', facet: '' });
      for (const a of this.ctx.areas || []) ix.set('area:' + a, { id: 'area:' + a, type: 'area', title: a, facet: a });
      this._index = ix;
    },
    async init() {
      await window.__depsReady;
      this.src = this.param('src') || '';
      try {
        if (!this.src) return;
        const a = window.RepoAddress.parse(this.src);
        this.env = JSON.parse((await new GH({ token: this.token, repo: a.repo, ...(a.ref ? { ref: a.ref } : {}) }).get(a.path)).text);
        this.index();
        const lens = LENSES.some(l => l[0] === this.param('lens')) ? this.param('lens') : 'documents';
        for (const k of ['repo', 'outcome']) this.filters[k] = this.param(k) || '';
        if (this.param('tab') === 'compare') this.tab = 'compare';
        this.sel[lens] = this.param('item') || undefined;
        this.setLens(lens);
      } catch (e) {
        this.error = `${this.src}: ${e.message || e}`;
      } finally {
        this.loading = false;
      }
    },
  }));
});
</script>
</body>
</html>
