<!doctype html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shortcut Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧾</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  shortcut-log.html — what the phone reported, as installation evidence.

  Promoted as the Web Tools app view `shortcut-log` by shortcut-tools'
  .web-tools.json, so the address the dumpers bake in is the slug, not this
  path: app/?app=shortcut-log&shell=full. The page can move without a
  reinstall on the phone; the slug cannot.

  ONE SURFACE, BOTH READERS. The session reads shortcuts/log/ from git; the
  person who tapped reads it here. Show Result clips a payload and does not
  scroll, which is why this page exists at all.

  THE SAME SHAPE AS THE POWERSHELL OVERVIEW. A list of one-line rows, a state
  icon per row taken from installation-view.js (check for current, up-arrow for
  an update pending, drawn from kits/sync-status.js), and the detail on tap: in place of the list on a phone,
  beside it on a wide screen. The derivation is lib/kits/shortcut-evidence.js,
  which says which build a row is about and what it is scored against.

  WHY A HOSTED URL AND NOT AN HTML PAYLOAD. Show Web View given HTML text lands
  at a file:// origin, where localStorage.ghToken is not. An https URL keeps the
  page on mehrlander.github.io and the stored token with it (measured 2026-08-26
  by Probe-WebViewCaps). The app frames this page with allow-same-origin, so the
  token the app reads is the token this page reads.

  THE TOKEN SCREEN IS gh-auth.js's, raised explicitly: a private repo with no
  token answers 404, which gh-auth's 401/403 takeover never sees.

  UNKNOWN IS SILENT. A row gets a verdict icon only when both the installed
  build and the baseline's build are in hand.
-->
</head>
<body class="min-h-dvh bg-base-100">

<div id="log" x-data="shortcutLog()" x-init="boot()" class="@container min-h-dvh flex flex-col">

  <header class="sticky top-0 z-20 bg-base-100/95 backdrop-blur border-b border-base-300 px-3 py-2 flex items-center gap-2">
    <i class="ph ph-list-checks text-xl text-base-content/50"></i>
    <h1 class="font-semibold whitespace-nowrap">Shortcut log</h1>
    <span class="min-w-0 text-xs font-mono text-base-content/50 truncate" x-text="tally" data-tally></span>
    <button x-show="only" @click="only = ''" class="badge badge-primary badge-soft gap-1 shrink-0" data-only>
      <span class="max-w-32 truncate" x-text="only"></span><i class="ph ph-x"></i></button>
    <div class="grow"></div>
    <select x-model="filter" class="select select-sm w-auto" aria-label="Show">
      <option value="all">All</option>
      <option value="installs">Installs</option>
      <option value="runs">Runs</option>
      <option value="stale">Behind</option>
    </select>
    <button @click="load(true)" class="btn btn-ghost btn-sm btn-square" aria-label="Refresh">
      <i class="ph ph-arrows-clockwise text-lg" :class="loading && 'animate-spin'"></i></button>
  </header>

  <p x-show="err" class="text-error px-3 py-2" x-text="err"></p>

  <!-- data-pattern and data-part declare a List and detail and name its parts
       (data/ui-units/codebook.md, "Declaring a pattern in markup"); nothing at
       runtime reads them. aria-current marks the open row beside the class
       that tints it. A day and a sitting are both group headings. -->
  <div class="grow grid @3xl:grid-cols-[minmax(0,28rem)_minmax(0,1fr)]" data-pattern="list-detail">

    <!-- The list: one line per entry, grouped by day. -->
    <div class="min-w-0 @3xl:border-r border-base-300" :class="sel ? 'hidden @3xl:block' : 'block'" data-list data-part="list">
      <template x-for="g in groups" :key="g.day">
        <section>
          <h2 class="sticky top-12 z-10 bg-base-200/95 px-3 py-1 text-xs font-mono uppercase tracking-widest text-base-content/50" x-text="g.day" data-part="group"></h2>
          <template x-for="st in g.sittings" :key="st.key">
          <div>
          <div x-show="st.rows.length > 1" class="px-3 pt-2 pb-0.5 text-xs font-mono text-base-content/40" data-sitting x-text="st.label" data-part="group"></div>
          <template x-for="e in st.rows" :key="e.stem">
            <button @click="open(e.stem)" data-row data-part="item"
                    class="w-full flex items-center gap-3 px-3 py-2.5 text-left border-b border-base-200 hover:bg-base-200 transition-colors"
                    :class="[sel === e.stem && 'bg-primary/10', fresh[e.stem] && 'bg-info/10']"
                    :aria-current="sel === e.stem ? 'true' : 'false'">
              <i class="ph text-xl shrink-0" :class="[iconOf(e), e.install ? 'text-primary' : 'text-base-content/40']"></i>
              <span class="min-w-0 grow flex items-baseline gap-2">
                <span class="shrink-0 max-w-full truncate" :class="e.name ? 'font-medium' : 'text-base-content/70'" x-text="titleOf(e)" data-part="title"></span>
                <span class="min-w-0 truncate text-xs font-mono" :class="anomaly(e) ? 'text-warning' : 'text-base-content/50'" x-text="tagOf(e)" data-tag data-part="meta"></span>
              </span>
              <span class="shrink-0 flex items-center gap-1" data-verdict data-part="meta">
                <template x-if="v(e)">
                  <span class="flex items-center gap-0.5">
                    <i class="text-xl" :class="stateIcon(v(e))"></i>
                    <span x-show="v(e).against.kind === 'pr'" class="text-xs font-mono text-base-content/50" x-text="'#' + v(e).against.pr"></span>
                  </span>
                </template>
              </span>
              <span class="shrink-0 w-16 text-right text-xs font-mono" :class="recent(e) ? 'text-info font-semibold' : 'text-base-content/50'" x-text="timeOf(e)" data-part="meta"></span>
            </button>
          </template>
          </div>
          </template>
        </section>
      </template>
      <div x-show="!groups.length && !loading" class="px-3 py-10 text-center text-base-content/40">Nothing matches.</div>
      <div x-show="loading && !entries.length" class="flex justify-center py-16"><span class="loading loading-dots loading-md opacity-30"></span></div>
      <div x-show="files.length > limit" class="p-3 flex justify-center">
        <button @click="more()" class="btn btn-sm btn-ghost" :disabled="loading">
          <span x-text="'Older · ' + (files.length - limit)"></span></button>
      </div>
    </div>

    <!-- The detail: in place of the list on a phone, beside it when there is room. -->
    <div class="min-w-0" :class="sel ? 'block' : 'hidden @3xl:block'" data-detail data-part="detail">
      <template x-if="!item">
        <div class="hidden @3xl:flex justify-center py-16 text-base-content/30"><i class="ph ph-cursor-click text-4xl"></i></div>
      </template>
      <template x-if="item">
        <div class="p-3 flex flex-col gap-4 @3xl:sticky @3xl:top-12">
          <div class="flex items-start gap-2">
            <button @click="close()" class="btn btn-ghost btn-sm btn-square @3xl:hidden" aria-label="Back"><i class="ph ph-arrow-left text-lg"></i></button>
            <div class="min-w-0 grow">
              <div class="flex flex-wrap items-center gap-x-2">
                <i class="ph text-xl" :class="[iconOf(item), item.install ? 'text-primary' : 'text-base-content/40']"></i>
                <h2 class="text-lg font-semibold break-all" x-text="titleOf(item)"></h2>
                <span class="badge badge-sm badge-ghost font-mono" x-text="item.verb"></span>
              </div>
              <div class="text-xs font-mono text-base-content/50" x-text="fullTime(item)"></div>
              <p class="mt-1" :class="anomaly(item) && 'text-warning'" x-text="sentenceOf(item)" data-sentence></p>
            </div>
            <a :href="fileUrl(item)" target="_blank" rel="noopener" class="btn btn-ghost btn-sm btn-square" aria-label="Open on GitHub"><i class="ph ph-github-logo text-lg"></i></a>
          </div>

          <dl class="grid grid-cols-[auto_minmax(0,1fr)] gap-x-4 gap-y-1.5 items-baseline" data-facts>
            <template x-for="f in facts(item)" :key="f.k">
              <div class="contents">
                <dt class="text-xs font-mono uppercase tracking-wider text-base-content/50" x-text="f.k"></dt>
                <dd class="min-w-0 break-all flex flex-wrap items-center gap-x-1.5">
                  <i x-show="f.icon" :class="f.icon"></i>
                  <template x-if="f.href"><a :href="f.href" target="_blank" rel="noopener" class="link link-hover font-mono" x-text="f.v"></a></template>
                  <template x-if="!f.href"><span :class="f.mono && 'font-mono'" x-text="f.v"></span></template>
                  <span x-show="f.note" class="text-xs font-mono text-base-content/50" x-text="f.note"></span>
                </dd>
              </div>
            </template>
          </dl>

          <div x-show="item.name" class="flex flex-wrap gap-2">
            <button @click="only = item.name; close()" class="btn btn-sm"><i class="ph ph-funnel"></i><span x-text="'Only ' + item.name"></span></button>
            <a :href="'shortcuts.html?name=' + encodeURIComponent(item.name)" class="btn btn-sm btn-ghost"><i class="ph ph-link"></i>Chain</a>
          </div>

          <template x-if="item.op === 'dump' && item.fields.file">
            <div class="flex flex-col gap-1" data-contents>
              <div class="flex items-center gap-2">
                <span class="text-xs font-mono uppercase tracking-wider text-base-content/50">contents</span>
                <span class="text-xs font-mono text-base-content/40" x-text="zip.note"></span>
              </div>
              <button x-show="zip.stem !== item.stem" @click="openZip(item)" class="btn btn-sm self-start"><i class="ph ph-file-zip"></i>Open the zip</button>
              <span x-show="zip.stem === item.stem && zip.loading" class="loading loading-dots loading-sm opacity-40"></span>
              <p x-show="zip.stem === item.stem && zip.err" class="text-error text-sm" x-text="zip.err"></p>
              <template x-for="s in (zip.stem === item.stem ? zip.list : [])" :key="s.name">
                <div class="border-b border-base-200">
                  <button @click="openSketch(s)" class="w-full flex items-center gap-2 py-2 text-left" data-zip-row>
                    <i class="ph ph-lightning text-base-content/40"></i>
                    <span class="grow min-w-0 truncate font-medium" x-text="s.name"></span>
                    <span class="text-xs font-mono text-base-content/50" x-text="s.actions === null ? 'unreadable' : s.actions + ' actions'"></span>
                    <i class="ph" :class="s.open ? 'ph-caret-up' : 'ph-caret-down'"></i>
                  </button>
                  <div x-show="s.open" class="pb-2 flex flex-col gap-1" data-sketch>
                    <span x-show="s.loading" class="loading loading-dots loading-sm opacity-40"></span>
                    <p x-show="s.note" class="text-xs font-mono text-base-content/50" x-text="s.note"></p>
                    <pre x-show="s.lines.length" class="bg-base-200 rounded-box p-2 text-xs overflow-x-auto max-h-[60dvh] overflow-y-auto"><template x-for="(l, i) in s.lines" :key="i"><div :class="l.t === '+' ? 'bg-success/15' : l.t === '-' ? 'bg-error/15 line-through opacity-70' : l.t === '…' ? 'text-base-content/40 italic' : ''" x-text="l.s"></div></template></pre>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="item.payload || !item.name">
            <div class="flex flex-col gap-1" data-payload>
              <div class="flex items-center gap-2">
                <span class="text-xs font-mono uppercase tracking-wider text-base-content/50">payload</span>
                <span class="text-xs font-mono text-base-content/40" x-text="size(item.payload || item.raw)"></span>
                <div class="grow"></div>
                <button x-show="pretty(item)" @click="raw = !raw" class="btn btn-xs btn-ghost" x-text="raw ? 'pretty' : 'raw'"></button>
                <button @click="copy(item.payload || item.raw)" class="btn btn-xs btn-ghost"><i class="ph ph-copy"></i></button>
              </div>
              <pre class="bg-base-200 rounded-box p-3 text-sm whitespace-pre-wrap break-all max-h-[70dvh] overflow-y-auto" x-text="raw || !pretty(item) ? (item.payload || item.raw) : pretty(item)"></pre>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>

<script type="module">
// The repo's standard boot. ?use=<ref> pins the chain to a branch for
// previewing edits, exactly as the other loader pages do.
const q = new URLSearchParams(location.search);
await import('https://mehrlander.github.io/web-tools/lib/entry.js');
await gh.load('gh-auth.js');
await gh.load('kits/shortcut-evidence.js');
await gh.load('kits/sync-status.js');

const LOG = 'mehrlander/web-tools-private';
const DIR = 'shortcuts/log';
const TOOLS = 'mehrlander/shortcut-tools';
const PAGE = 30;
const RECENT = 5 * 60 * 1000;
// A gap longer than this starts a new sitting: the unit a reader remembers
// ("the installs this morning"), where a day is too coarse and a row too fine.
const SITTING = 15 * 60 * 1000;
// Shortcuts that run from a Shortcuts automation, not a tap. Nothing in a log
// row says who started it, so this is a list, and a name missing from it reads
// as a person's action. Probe-Unattended is the 02:00 automation.
const SCHEDULED = new Set(['Probe-Unattended']);
const SE = window.ShortcutEvidence;

const NEED_TOKEN =
  'The device log lives in a private repo, so this page needs a GitHub token with repo scope. '
  + 'Storage here is per-app: a token saved in Safari is not visible inside the Shortcuts sheet, '
  + 'so this may need entering once in each place you open the page.';

// main: the device log folder is written there by the phone, not previewed.
const log = new window.GH({ repo: LOG, ref: 'main' });

// The number of actions in one workflow plist, or null when it will not parse
// (the device exports at least one shortcut as invalid XML).
const countActions = xml => {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.querySelector('parsererror')) return null;
  const keys = [...doc.querySelectorAll('plist > dict > key')];
  const k = keys.find(n => n.textContent === 'WFWorkflowActions');
  const arr = k && k.nextElementSibling;
  return arr && arr.tagName === 'array' ? arr.children.length : 0;
};

// The changed lines of a diff with `k` lines of context each side; each run
// of unchanged lines beyond that becomes one marker saying how many.
const around = (d, k) => {
  const near = d.map((x, i) => d.slice(Math.max(0, i - k), i + k + 1).some(y => y.t !== ' '));
  const out = [];
  for (let i = 0; i < d.length; i++) {
    if (near[i]) { out.push(d[i]); continue; }
    let j = i; while (j < d.length && !near[j]) j++;
    out.push({ t: '…', s: `  … ${j - i} unchanged line${j - i === 1 ? '' : 's'}` });
    i = j - 1;
  }
  return out;
};

// A line diff by longest common subsequence: small inputs only, which a
// sketch is (a few hundred lines at most).
const lineDiff = (a, b) => {
  const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push({ t: ' ', s: a[i] }); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push({ t: '-', s: a[i++] });
    else out.push({ t: '+', s: b[j++] });
  }
  while (i < n) out.push({ t: '-', s: a[i++] });
  while (j < m) out.push({ t: '+', s: b[j++] });
  return out;
};
// main: the build scoring compares each logged ref against main deliberately.
const tools = new window.GH({ repo: TOOLS, ref: 'main' });
const p2 = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;

document.addEventListener('alpine:init', () => Alpine.data('shortcutLog', () => ({
  files: [],          // every log file name, newest first
  bodies: {},         // stem -> raw text, fetched once
  entries: [],        // parsed, newest first, the loaded window
  limit: PAGE,
  filter: 'all',
  only: q.get('name') || '',   // ?name= opens on one shortcut; Chains links here that way
  sel: '',
  raw: false,
  loading: false,
  err: '',
  fresh: {},          // stems that arrived since the previous poll
  at: {},             // ref -> builds.json at that ref (null: unreadable)
  base: {},           // source ref -> baseOf() answer (null: unanswered)
  verdicts: {},       // stem -> verdict
  scrollY: 0,
  zip: { stem: '', loading: false, err: '', note: '', list: [], fold: null, folded: false },

  async boot() {
    await this.load(false);
    window.ghAuth.bootDone();
    setInterval(() => { if (!document.hidden) this.load(false); }, 15000);
  },

  async load(force) {
    if (!window.ghAuth.resolve()) { window.ghAuth.prompt(NEED_TOKEN); return; }
    if (this.loading) return;
    this.loading = true; this.err = '';
    try {
      let list;
      try { list = await log.req(`contents/${DIR}`, { cache: 'no-store' }); }
      catch (e) { if (e && e.status === 404) { window.ghAuth.prompt(NEED_TOKEN); return; } throw e; }
      const had = this.files.length ? new Set(this.files) : null;
      this.files = list.filter(f => f.name.endsWith('.json')).map(f => f.name)
                       .sort((a, b) => b.localeCompare(a));
      const want = this.files.slice(0, this.limit).map(n => n.replace(/\.json$/, ''));
      const missing = want.filter(s => !(s in this.bodies));
      const got = await Promise.all(missing.map(s =>
        log.get(`${DIR}/${s}.json`).then(r => r.text).catch(() => '')));
      missing.forEach((s, i) => { this.bodies[s] = got[i]; });
      this.fresh = had ? Object.fromEntries(want.filter(s => !had.has(s + '.json')).map(s => [s, true])) : {};
      this.entries = SE.link(want.map(s => SE.parse(s, this.bodies[s])));
      await this.score(force);
    } catch (e) {
      this.err = String(e.message || e);
    } finally {
      this.loading = false;
    }
  },

  more() { this.limit += PAGE; this.load(false); },

  // The lookups a verdict needs: builds.json on main, at every source ref, and
  // at the head of every open PR a source ref belongs to. A commit's builds
  // never change, so a sha stays cached; main and PR membership are re-read
  // on Refresh.
  async score(force) {
    if (force) {
      this.base = {};
      this.at = Object.fromEntries(Object.entries(this.at).filter(([k]) => /^[0-9a-f]{40}$/.test(k)));
    }
    const refs = SE.refs(this.entries).filter(r => !(r in this.base));
    await Promise.all(refs.map(async r => {
      const path = /^[0-9a-f]{40}$/.test(r) ? `commits/${r}/pulls`
                 : `pulls?head=${TOOLS.split('/')[0]}:${encodeURIComponent(r)}&state=all`;
      let pulls = null;
      if (r !== 'main') { try { pulls = await tools.req(path); } catch {} }
      this.base[r] = SE.baseOf(r, pulls);
    }));
    const need = new Set(['main', ...SE.refs(this.entries)]);
    for (const b of Object.values(this.base)) if (b && b.kind === 'pr') need.add(b.head);
    await Promise.all([...need].filter(r => !(r in this.at)).map(async r => {
      try { this.at[r] = JSON.parse((await new window.GH({ repo: TOOLS, ref: r }).get('plists/builds.json')).text); }
      catch { this.at[r] = null; }
    }));
    const ctx = { at: this.at, base: this.base };
    this.verdicts = Object.fromEntries(this.entries.map(e => [e.stem, SE.verdict(e, ctx)]));
  },

  get shown() {
    return this.entries.filter(e => {
      if (this.only && e.name !== this.only) return false;
      if (this.filter === 'installs') return e.install;
      if (this.filter === 'runs') return !e.install;
      if (this.filter === 'stale') return this.verdicts[e.stem]?.state === 'stale';
      return true;
    });
  },
  get groups() {
    const today = dayKey(new Date()), yest = dayKey(new Date(Date.now() - 864e5));
    const out = [];
    for (const e of this.shown) {
      const k = e.when ? dayKey(e.when) : '?';
      const day = k === today ? 'Today' : k === yest ? 'Yesterday'
        : e.when ? e.when.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) : 'Undated';
      if (!out.length || out[out.length - 1].day !== day) out.push({ day, rows: [] });
      out[out.length - 1].rows.push(e);
    }
    // Within a day, rows closer than SITTING belong to one sitting. Rows are
    // newest first, so a sitting's span reads from its last row to its first.
    for (const g of out) {
      g.sittings = [];
      for (const e of g.rows) {
        const cur = g.sittings[g.sittings.length - 1], prev = cur && cur.rows[cur.rows.length - 1];
        if (cur && prev.when && e.when && prev.when - e.when <= SITTING) cur.rows.push(e);
        else g.sittings.push({ key: e.stem, rows: [e] });
      }
      for (const st of g.sittings) {
        const a = st.rows[st.rows.length - 1].when, b = st.rows[0].when, hm = d => `${p2(d.getHours())}:${p2(d.getMinutes())}`;
        const who = st.rows.every(e => this.scheduled(e)) ? ' · scheduled' : '';
        st.label = a && b ? `${hm(a)}${hm(a) === hm(b) ? '' : '–' + hm(b)} · ${this.summary(st.rows)}${who}` : '';
      }
    }
    return out;
  },
  get tally() {
    const behind = this.entries.filter(e => this.verdicts[e.stem]?.state === 'stale').length;
    return `${this.entries.length}` + (behind ? ` · ${behind} behind` : '');
  },
  get item() { return this.entries.find(e => e.stem === this.sel) || null; },

  v(e) { return this.verdicts[e.stem] || null; },
  open(stem) {
    if (!this.sel) this.scrollY = window.scrollY;
    this.sel = stem; this.raw = false;
    window.scrollTo(0, 0);
  },
  close() {
    this.sel = '';
    this.$nextTick(() => window.scrollTo(0, this.scrollY));
  },

  scheduled(e) { return SCHEDULED.has(e.name); },
  // A dump that found more shortcuts than it was given names has matched
  // something it should not have. 2026-09-26: names=2 found=685.
  anomaly(e) {
    const n = Number(e.fields.names), f = Number(e.fields.found);
    return e.op === 'dump' && n > 0 && f > n;
  },
  // What a sitting held, in words: "3 installs, 1 dump".
  summary(rows) {
    const c = {};
    for (const e of rows) { const k = e.install ? 'install' : e.op === 'dump' ? 'dump' : 'run'; c[k] = (c[k] || 0) + 1; }
    return ['install', 'dump', 'run'].filter(k => c[k]).map(k => `${c[k]} ${k}${c[k] > 1 ? 's' : ''}`).join(', ');
  },
  // One sentence for the detail: what happened, said the way a person would.
  sentenceOf(e) {
    const who = this.scheduled(e) ? 'An automation ran' : 'You ran';
    if (e.install) {
      const from = e.source ? (this.base[e.source.ref]?.kind === 'pr' ? `PR #${this.base[e.source.ref].pr}` : 'main') : '';
      return `You installed ${e.name}${from ? ' from ' + from : ''} through ${e.installer?.name || 'a paste'}.`;
    }
    if (e.op === 'dump') {
      const f = e.fields.found, n = e.fields.names;
      const got = f ? `zipped ${f} shortcut${f == 1 ? '' : 's'}` : 'zipped shortcuts';
      const warn = this.anomaly(e) ? ` It was given ${n} name${n == 1 ? '' : 's'}, so it matched more than it should have.` : '';
      return `${who} ${e.name}, which ${got} into ${e.fields.file || 'a zip'}.${warn}`;
    }
    if (e.name) return `${who} ${e.name}.`;
    return '';
  },
  iconOf(e) {
    if (this.scheduled(e)) return 'ph-clock';
    if (e.install) return 'ph-download-simple';
    if (e.op === 'dump') return 'ph-archive';
    if (!e.name) return 'ph-note';
    return 'ph-play';
  },
  // The small mono word after the title: what happened, or for a row with no
  // name, the short values it carried.
  tagOf(e) {
    if (this.anomaly(e)) return `${e.fields.found} for ${e.fields.names} name${e.fields.names == 1 ? '' : 's'}`;
    if (e.op === 'dump' && e.fields.found) return `zipped ${e.fields.found}`;
    if (this.scheduled(e)) return 'scheduled';
    if (e.name) return e.op === e.name.toLowerCase() ? '' : e.verb;
    return Object.entries(e.fields).filter(([k, x]) => k !== 'build' && typeof x === 'string' && x && x.length <= 24)
      .slice(0, 2).map(([, x]) => x).join(' · ');
  },
  titleOf(e) {
    if (e.name) return e.name;
    const first = (e.payload || '').split('\n')[0].trim();
    return first ? (first.length > 80 ? first.slice(0, 80) + '…' : first) : e.op;
  },
  stateIcon(v) {
    return window.SyncStatus.ICON[v.state === 'current' ? 'current' : 'behind'];
  },
  recent(e) { return e.when && Date.now() - e.when < RECENT; },
  timeOf(e) {
    if (!e.when) return '';
    const s = (Date.now() - e.when) / 1000;
    if (s >= 0 && s * 1000 < RECENT) return s < 45 ? 'just now' : `${Math.round(s / 60)}m ago`;
    return `${p2(e.when.getHours())}:${p2(e.when.getMinutes())}`;
  },
  fullTime(e) { return e.when ? e.when.toLocaleString() : e.stem; },
  fileUrl(e) { return `https://github.com/${LOG}/blob/main/${DIR}/${e.stem}.json`; },
  size(t) { const n = (t || '').length; return n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB'; },
  pretty(e) { return SE.pretty(e.payload || e.raw); },
  copy(t) { navigator.clipboard?.writeText(t); },

  // A dump's zip: every entry is one shortcut's workflow, an XML plist. It is
  // fetched only on request, since a whole-library snapshot runs to megabytes.
  // The phone commits it to incoming/, and the fold moves it unchanged to
  // dumps/<stem>-dump.zip, so the folded name is tried first.
  async openZip(e) {
    const file = e.fields.file, stem = file.replace(/\.zip$/, '');
    this.zip = { stem: e.stem, loading: true, err: '', note: '', list: [], fold: null, folded: false };
    const raw = async path => {
      const r = await fetch(`https://api.github.com/repos/${LOG}/contents/${path}`,
        { headers: { ...log.headers, Accept: 'application/vnd.github.raw' }, cache: 'no-store' });
      if (!r.ok) throw Object.assign(new Error(`${r.status} ${path}`), { status: r.status });
      // The raw media type answers with bytes. An answer in the JSON envelope
      // (the headless render's stand-in for the API gives only that) carries
      // them base64'd, so read either.
      if (!/json/.test(r.headers.get('content-type') || '')) return r.arrayBuffer();
      const j = await r.json();
      return Uint8Array.from(atob((j.content || '').replace(/\n/g, '')), c => c.charCodeAt(0)).buffer;
    };
    try {
      const folded = `shortcuts/dumps/${stem}-dump.zip`;
      let buf, where;
      try { buf = await raw(folded); where = folded; }
      catch (err) { if (err.status !== 404) throw err; where = `shortcuts/incoming/${file}`; buf = await raw(where); }
      const JSZip = window.JSZip ?? (await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm')).default;
      const z = await JSZip.loadAsync(buf);
      const list = [];
      for (const f of Object.values(z.files)) {
        if (f.dir) continue;
        const name = f.name.replace(/\.wflow$/, '');
        list.push({ name, actions: countActions(await f.async('string')), open: false, loading: false, note: '', lines: [] });
      }
      list.sort((a, b) => a.name.localeCompare(b.name));
      if (where === folded) {
        this.zip.folded = true;
        const c = await log.req(`commits?path=${encodeURIComponent(folded)}&per_page=1`).catch(() => null);
        if (c && c[0]) this.zip.fold = { sha: c[0].sha, parent: c[0].parents?.[0]?.sha || '' };
      }
      this.zip.note = `${list.length} shortcut${list.length === 1 ? '' : 's'} · ${where === folded ? 'folded into the corpus' : 'waiting in incoming/'}`;
      this.zip.list = list;
    } catch (err) {
      this.zip.err = String(err.message || err);
    } finally {
      this.zip.loading = false;
    }
  },

  // One shortcut's listing, as the fold wrote it to sketches/. Against the
  // commit before the fold it shows what this dump changed; with no fold on
  // record it shows the listing as it stands now, and says so.
  async openSketch(s) {
    s.open = !s.open;
    if (!s.open || s.lines.length || s.loading) return;
    s.loading = true;
    const path = `shortcuts/sketches/${s.name.replace('/', ':')}.txt`;
    const at = ref => new window.GH({ repo: LOG, ref }).get(path).then(r => r.text).catch(() => null);
    try {
      const f = this.zip.fold;
      const after = await at(f ? f.sha : 'main');
      if (after === null) { s.note = 'no listing: the fold could not read this shortcut'; return; }
      if (!f) {
        s.note = this.zip.folded ? 'as it stands now; the commit that folded this zip was not found'
                                 : 'as it stands now; this zip is not folded yet';
        s.lines = after.split('\n').map(x => ({ t: ' ', s: x }));
        return;
      }
      const before = f.parent ? await at(f.parent) : null;
      if (before === null) { s.note = 'new with this dump'; s.lines = after.split('\n').map(x => ({ t: ' ', s: x })); return; }
      const d = lineDiff(before.split('\n'), after.split('\n'));
      const add = d.filter(x => x.t === '+').length, del = d.filter(x => x.t === '-').length;
      s.note = add || del ? `changed with this dump: +${add} −${del} lines` : 'unchanged since the previous dump';
      s.lines = add || del ? around(d, 2) : [];
    } finally {
      s.loading = false;
    }
  },

  // The rows of the detail's definition list: the verdict first, then what the
  // row carried, with the install fields read for what they mean.
  facts(e) {
    const out = [], v = this.v(e), short = r => /^[0-9a-f]{40}$/.test(r) ? r.slice(0, 7) : r;
    if (v) {
      const against = v.against.kind === 'pr' ? `PR #${v.against.pr}` : 'main';
      const title = v.against.kind === 'pr' ? Object.values(this.base).find(b => b && b.pr === v.against.pr)?.title : '';
      out.push({ k: 'verdict', v: v.state === 'current' ? `current with ${against}` : `behind ${against}`,
                 icon: this.stateIcon(v), note: title || '' });
      out.push({ k: 'build', v: v.build, mono: true, note: v.inferred ? `as published at ${short(v.ref)}` : '' });
      if (v.state === 'stale') out.push({ k: against, v: v.target, mono: true, note: 'publishes' });
    } else if (e.build) {
      out.push({ k: 'build', v: e.build, mono: true });
    }
    if (e.source) {
      const b = this.base[e.source.ref];
      out.push({ k: 'from', v: `${short(e.source.ref)} · ${e.source.dir}/${e.source.file}`,
                 href: `https://github.com/${TOOLS}/blob/${e.source.ref}/${e.source.dir}/${e.source.file}`,
                 note: b && b.kind === 'pr' ? `PR #${b.pr}` : '' });
    }
    if (e.installer && e.installer.build) out.push({ k: 'by', v: `${e.installer.name} ${e.installer.build}`, mono: true });
    const skip = e.install ? ['from', 'target', 'build'] : ['build'];
    for (const [k, x] of Object.entries(e.fields)) {
      if (skip.includes(k)) continue;
      const s = typeof x === 'string' ? x : JSON.stringify(SE.elide(x));
      out.push({ k, v: s, mono: s.length < 60 });
    }
    return out;
  },
})));

await gh.load('alpine-bundle.js');
</script>
