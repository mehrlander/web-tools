<!doctype html>
<html lang="en" data-theme="emerald">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Approve</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔏</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  approve.html — renders an `approval/1` surface: a request for a DECISION.

  inquiry.html collects answers; this collects a verdict. The difference is not
  the form but the reader's licence: the expected outcome includes "no", and
  the page has to make refusing as cheap as agreeing or it is a rubber stamp
  with extra steps.

  Three layers, as in inquiry:
    the OBJECT     an approval/1 surface, self-addressed via context.reply_to
    the RENDERING  this page: the diff first, the author's reason beside it
    the CONSTRAINT the profile schema, which names what the author owed

  What it writes back is <reply_to>/<id>.verdict.json, through the viewer's own
  token. That file is the point of the whole envelope: "did the user approve
  this" stops being a claim a session types into a commit message and becomes a
  file a commit hook resolves. Contract: docs/envelopes/approval.md.

  Addressing, the same grammar every envelope here uses:
    #src=owner/repo[@ref]:path     fetch the envelope through the stored token
    #gz=<base64url gzip>           carry it inline, for a token-less reader
  Both also read from ?query, for a context that strips fragments.

  THE TOKEN IS NOT SPECIAL HERE, and two drafts of this page treated it as
  though it were. The first refused whenever it was framed; the second kept a
  pre-flight probe, a flag, dimmed buttons and a banner about sandboxes. A
  verdict is a commit like any other commit this estate makes: the page reads
  the token the way kits/annotate.js reads it for a jot, writes, and reports
  what the write said. Nothing is asked in advance.

  Diff cards are alpineComponents/file-review.js, the same component
  pages/review.html mounts per changed file, so a reviewer here sees exactly
  what a reviewer there sees. Notes are kits/annotate.js enabled over this
  document: a selection in a diff pane becomes a note, and the set rides out on
  the verdict rather than saving as its own jot, since here a note is part of a
  decision rather than a standalone reading.
-->
<script>window.__depsReady = new Promise(r => { window.__depsDone = r; });</script>
<script type="module">
  const ref = new URLSearchParams(location.search).get('use');
  if (ref) {
    const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/dist/web-tools.js`, { cache: 'no-store' });
    if (!src.ok) throw new Error(`?use=${ref}: could not fetch the bundle (HTTP ${src.status})`);
    const url = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
    try { await import(url); } finally { URL.revokeObjectURL(url); }
  } else {
    await import('../dist/web-tools.js');
  }
  try {
    await gh.load('gh-store.js');
    await gh.load('kits/swipe-deck.js');
    await gh.load('kits/cm6-merge.js');
    await gh.load('alpineComponents/file-review.js');
    await gh.load('kits/annotate.js');
  } finally { window.__depsDone(); }
</script>
<style>[x-cloak]{display:none!important}</style>
</head>
<!-- NO PAGE HEADER, AND THE SET IS A DECK. The page used to open on a strip of
     its own chrome (a seal, the request's name, its kind and occasion, a notes
     button), then the id and branch, then the rationale, then a bordered frame
     holding every item stacked. On a phone that is most of a screen before the
     first thing anyone came to read, and the frame put a second box around
     cards that already have edges.
     The house format for a set you go THROUGH is the swipe deck, so the set is
     one: the ask is slide one and each item is its own after it. Nothing is
     nested, so a change container gets the full width, and the only chrome left
     is the row of decisions at the foot, which is what the page is for.
     `h-dvh` with the deck growing, not `min-h-dvh`: a track has to be given a
     height to snap inside. Normal flow rather than `fixed inset-0`, since this
     page is framed as an app view and rule 5 of the house style is that a fixed
     child measures against the OUTER viewport. -->
<body class="h-dvh flex flex-col bg-base-100 text-base-content overflow-hidden"
      x-data="approveApp()" x-cloak>

<div x-show="loading" class="flex items-center gap-2 opacity-70 px-3 py-3">
  <span class="loading loading-spinner loading-sm"></span> Loading
</div>
<div x-show="error" class="alert alert-error py-2 px-3 m-3">
  <i class="ph ph-warning-circle"></i><span x-text="error"></span>
</div>

<!-- grid-cols-[minmax(0,1fr)], not a bare `grid`. A grid item defaults to
     min-width:auto, so one wide descendant (a code fence with long lines) sizes
     the track to max-content and EVERY block inside lays out at that width:
     measured at 390px, the whole rendered document was 1398px wide, so ordinary
     paragraphs did not wrap and the card clipped them with overflow-hidden.
     Letting the column shrink below its content is what hands the overflow back
     to the objects that know how to scroll. -->
<div x-ref="pool" class="hidden">

  <!-- A PLAIN TEMPLATE, NOT x-for. The first version generated the item
       sections with x-for and moved the nodes into the deck's slides; Alpine
       owns an x-for's output, re-created it in the pool behind the move, and
       the slides ended up holding detached copies with nothing in them.
       Measured: three slides, zero change containers. So the deck clones this
       template per item and gives each clone its own `it` before Alpine
       initialises it, which is the ordinary way to hand one record to one
       subtree. -->
  <!-- A SLIDE IS THE DOCUMENT, AND NOTHING ELSE IS ON IT.
       It carried four things above the file: the item's title and change
       status, its `commentary`, a `deferred_because` note, and its `related`
       links under "Answers to". Every one of them is the REQUEST talking about
       the change rather than the change itself, and a reader arriving to judge
       wording met a paragraph of justification before the first line of it.
       Reported 2026-09-18: "we don't want to read a discussion of your
       justification there, we just want to see the thing."

       The envelope still carries all four. This page stops drawing them, which
       is a presentation decision rather than a schema one: the fields are the
       record of why the request was made, and the place to argue about a
       request is the conversation that produced it.

       What the title said is now the deck's header, which is where a reader
       looks for the name of what they are reading, and it follows the slide so
       it names the file in front of them rather than the set. -->
  <template x-ref="itemTpl">
    <!-- THE GUTTER IS RESERVED ON BOTH EDGES, and that is what keeps the
         document centred. This section is the scroller, so where the browser
         draws a CLASSIC scrollbar it takes the space out of the right side of
         the content box: the changed blocks' left ring sat 4px from the
         viewport and the right ring 4px plus the scrollbar's width, which
         reads as one wide margin rather than as a scrollbar. Reported
         2026-09-18 from a desktop browser; headless Chromium here draws
         OVERLAY scrollbars, which take no space at all, so the asymmetry does
         not reproduce in a shot and was measured off the reader's screen.
         AND IT IS GATED AT `sm:`, because `stable` reserves the gutter whether
         or not the scrollbar would have taken it. Measured here: unconditional,
         it cost 20px of width at every size, so a phone whose scrollbar
         overlays and takes nothing would have paid 10 a side for a bar that
         does not exist. There is no media query for "this browser draws
         classic scrollbars", so the width stands in for it: overlay below 640,
         classic above, which is how these two populations actually divide.
         `thin` applies at every size and is the other half, since a reserved
         gutter is only tolerable when it is narrow. -->
    <section data-slide class="h-full overflow-y-auto [scrollbar-width:thin]
                               sm:[scrollbar-gutter:stable_both-edges]
                               px-2 py-2 grid grid-cols-[minmax(0,1fr)] gap-2 content-start">

        <!-- read: true, which is the card's READING mode. Its own design note
             says the four source tabs are four readings of one fixed pair,
             right for scanning thirty rows in a list and wrong for reading one
             file, where the question is not which rendering but against what.
             A reading host hands that question up and the strip collapses to
             the document plus one Compare pane. Mounted without it, an
             approval showed five tabs and opened on Patch, which is the rawest
             view of a change someone is being asked to judge.

             openOn: 'mddiff' is the second half of that. A reading card lands
             on the document, which is right for a deck you are browsing and
             wrong here: this page exists to judge a CHANGE, and a reviewer
             handed the finished document has to find what moved before they
             can weigh it. The rendered comparison is that document with the
             change marked in it, so it is the same reading with the question
             answered. The card falls back to the document where the file has
             no rendered comparison to offer. -->
        <div x-show="ctx.kind === 'documentation' && pathOf(it)"
             x-data="fileReview({
               repo: repoOf(), ref: ctx.branch, base: baseOf(), baseName: baseOf(),
               path: pathOf(it), prevPath: it.change?.previous_path,
               status: it.change?.status, patch: it.change?.patch,
               open: true, bare: true, read: true, openOn: 'mddiff' })"></div>

    </section>
  </template>
</div>

<!-- The sent notice is all the page still draws of the decision. The verdict
     itself is one button in the deck's header, built in `approveBtn`. -->
<div x-ref="sent" class="w-full">
  <div x-show="sent" class="alert alert-success py-2 px-3">
    <i class="ph ph-check-circle"></i>
    <span>Recorded as <span class="font-mono" x-text="decision"></span>.
      <a :href="sent" target="_blank" class="link" x-text="sentPath"></a></span>
  </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('approveApp', () => ({
    env: null, items: [], notes: [], _deck: null,
    loading: true, error: '', sending: false, sent: '', sentPath: '', decision: '',
    // THE TOKEN, THE WAY EVERY OTHER WRITER HERE GETS IT. The global a shell
    // sets, else this origin's store, and a write that finds neither fails at
    // the write. It is kits/annotate.js's three lines for a jot, and a verdict
    // is not a different kind of act.
    //
    // It used to be a pre-flight probe, a `canPost` flag, dimmed buttons and a
    // banner about sandboxes. All of it was answering a question no other page
    // asks, and answering it wrong: the flag was set from `window.TOKEN`, which
    // only app/index.html and pages/repo-atlas.html ever define, so a reader
    // holding a perfectly good token was told there was none. Measured
    // 2026-09-18, tossed with a token in the store: readable, `window.TOKEN`
    // undefined, buttons dead. The surface had never been usable.
    get token() {
      if (window.TOKEN) return window.TOKEN;
      try { return localStorage.getItem('ghToken') || ''; } catch (e) { return ''; }
    },

    get ctx() { return this.env?.context || {}; },
    itemAt(i) { return this.items[i] || {}; },

    // ONE BUTTON, IN THE DECK'S HEADER. The page used to carry a row of three
    // verdicts plus a notes toggle plus the reply address, under the header and
    // above every item, which is four controls and a line of chrome in front of
    // the thing being judged. Two of them had other owners already: the
    // annotator is started from the FAB (its launcher menu, its take grid, or a
    // text selection), and `approved-with-edits` is not a separate decision but
    // the same one taken with notes attached, which this can read for itself.
    //
    // A FILLED GREEN CIRCLE, and the word is gone. It read `✓ Approve` until
    // the header had to hold a second control; the label is the widest thing
    // in the row and the only one a reader does not need, since a green check
    // on a page called Approve is not ambiguous. An Element rather than an
    // {icon,title,onClick} spec, because the deck draws that shape as a GHOST
    // circle and a decision is not ghost chrome.
    approveBtn() {
      const b = document.createElement('button');
      b.className = 'btn btn-sm btn-circle btn-success shrink-0';
      b.innerHTML = '<i class="ph ph-check text-lg"></i>';
      b.title = 'Approve';
      b.setAttribute('aria-label', 'Approve');
      b.addEventListener('click', () => {
        if (this.sending || this.sent) return;
        b.disabled = true;
        const notes = (window.Annotate && window.Annotate.items) || [];
        this.notes = notes;
        this.send(notes.length ? 'approved-with-edits' : 'approved')
          .finally(() => { b.disabled = !!this.sent; });
      });
      return b;
    },
    // THE JUMP, IN THE HEADER RATHER THAN IN THE DOCUMENT. Stepping change to
    // change is what a reader does most on this page, and the control for it
    // sat in md-diff's own strip, which scrolls away with the prose. The deck
    // header does not, so it is where a control used on every change belongs.
    //
    // It reaches the document by element, not by handle. The comparison is
    // rendered by kits/md-diff.js inside alpineComponents/file-review.js
    // inside a deck slide, so this page never sees what render() returned;
    // what it can see is the active slide and the one stable class on the
    // document inside it. The count stays in md-diff's own readout, which is
    // already on the page, rather than being drawn a second time here.
    jumpBtn() {
      const b = document.createElement('button');
      // AN EDGE AND A GAP, because a bare glyph beside a filled green circle
      // reads as part of it. The deck's own {icon,title,onClick} spec draws a
      // ghost circle with no border, which is right where an action stands
      // among other actions and wrong where the only thing beside it is a
      // decision. Reported 2026-09-18: the arrow sat uncomfortably close to
      // the check with no visible boundary of its own.
      b.className = 'btn btn-sm btn-circle btn-ghost border border-base-300 shrink-0 mr-1';
      b.innerHTML = '<i class="ph ph-arrow-down text-base"></i>';
      b.title = 'Next change';
      b.setAttribute('aria-label', 'Next change');
      b.addEventListener('click', () => {
        const core = this._deck && this._deck.deck;
        const slide = core && core.track.children[core.active()];
        const doc = slide && slide.querySelector('.md-diff-doc');
        if (doc) doc.dispatchEvent(new CustomEvent('md-diff:jump', { detail: { d: 1 } }));
      });
      return b;
    },
    // THE HEADER NAMES THE FILE, split the way the file cards split a path:
    // the name carries the weight and the folders sit under it, dimmed. One
    // request has one `manifest.name`, so a header carrying that read the same
    // on every slide and told a reader nothing about the document in front of
    // them. The request's own name and id are in the envelope and on the link;
    // the header is for what is on screen.
    nameOf(it) { const p = this.pathOf(it) || ''; return p.split('/').pop() || p; },
    // THE REPO IS PART OF THE ADDRESS, not a detail. A reader working across
    // several repositories in one afternoon meets a header saying SKILL.md and
    // has no way to tell which estate it belongs to, and the request names one
    // repo for the whole set so the answer is always available. Folder after
    // it, since the repo is the coarser half.
    dirOf(it) {
      const p = this.pathOf(it) || '';
      const i = p.lastIndexOf('/');
      // The repo NAME, not owner/name. At 390px the full address left
      // "mehrlander/web-tools · .claude/…", which spends the width on the half
      // that never varies and truncates away the half that does. Every repo a
      // reader meets here is one of a handful under one owner, so the name
      // alone identifies it, and the full address is one tap away in the mark
      // beside the title.
      const repo = (this.repoOf() || '').split('/').pop();
      return [repo, i < 0 ? '' : p.slice(0, i)].filter(Boolean).join(' · ');
    },
    // THE FILE'S LINKS, BESIDE THE FILE'S NAME. The estate's convention is that
    // a filename pointing at GitHub carries this dropdown next to it; in the
    // card's control row it sat nowhere near the name, and the name is in the
    // deck header now. `setTitleMark` is the deck's slot for a mark belonging
    // to the NAME rather than to the header's controls, which is exactly what
    // this is, so the card stands its own copy down under `bare`.
    //
    // Built from what the page already holds rather than read off the card:
    // the request names the repo, the branch and the base, and the item names
    // the path. That is three of the card's five rows. The two it cannot build
    // are Last commit, which costs a fetch, and Render, which the card drops
    // here anyway since its first view icon opens exactly that.
    ghMark(it) {
      const path = this.pathOf(it);
      if (!path) return null;
      const repo = this.repoOf(), br = this.ctx.branch || 'HEAD', base = this.baseOf();
      const rows = [
        ['ph-file', 'This version', '', `https://github.com/${repo}/blob/${br}/${path}`],
        ['ph-git-branch', 'Base version', base, `https://github.com/${repo}/blob/${base}/${path}`],
        ['ph-file-text', 'Raw', '', `https://raw.githubusercontent.com/${repo}/${br}/${path}`],
      ];
      const d = document.createElement('details');
      d.className = 'dropdown dropdown-start shrink-0';
      d.innerHTML = '<summary class="btn btn-ghost btn-xs gap-0.5 px-1 cursor-pointer" '
        + 'title="This file on GitHub"><i class="ph ph-github-logo text-base"></i>'
        + '<i class="ph ph-caret-down text-[10px] opacity-50"></i></summary>'
        + '<ul class="dropdown-content menu menu-sm z-30 mt-1 w-56 rounded-box border '
        + 'border-base-300 bg-base-100 p-1 shadow-lg">'
        + rows.map(([icon, label, hint, url]) =>
            `<li><a href="${url}" target="_blank" rel="noopener" class="gap-2 flex-nowrap">`
            + `<i class="ph ${icon} shrink-0"></i><span class="shrink-0">${label}</span>`
            + '<span class="grow"></span>'
            + `<span class="font-mono text-xs opacity-40 shrink-0">${hint}</span></a></li>`).join('')
        + '</ul>';
      d.addEventListener('click', (e) => { if (e.target.closest('a')) d.open = false; });
      return d;
    },
    // Where the items live. The request names one repo for the set, since a
    // decision spanning two repos is two decisions.
    repoOf() { return this.ctx.repo || (this.ctx.reply_to || '').split(':')[0]; },
    baseOf() { return this.ctx.base || 'main'; },
    pathOf(it) { return it.target?.path || it.title; },

    // hash first, then query: the fragment is the private form, the query is
    // what survives a context that strips fragments.
    param(key) {
      const h = new URLSearchParams(location.hash.slice(1)).get(key);
      return h || new URLSearchParams(location.search).get(key);
    },

    async init() {
      await window.__depsReady;
      try {
        const gz = this.param('gz');
        const src = this.param('src');
        if (gz) {
          const bin = Uint8Array.from(atob(gz.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
          const ds = new DecompressionStream('gzip');
          this.env = JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(ds)).text());
        } else if (src) {
          const [addr, ...rest] = src.split(':');
          const [repo, ref] = addr.split('@');
          this.env = JSON.parse((await new GH({ token: this.token, repo, ref: ref || '' }).get(rest.join(':'))).text);
        } else {
          this.error = 'No request. Address one with #src=owner/repo[@ref]:path or #gz=…';
        }
        this.items = this.env?.items || [];
        // A reading card asks its host what to compare against. The request
        // already names the pair, so publish it before the cards mount rather
        // than leaving each one to pick, which is the choice the card says it
        // has no business making.
        if (this.ctx.branch) {
          window.__compareRef = {
            repo: this.repoOf(), ref: this.ctx.branch,
            base: this.baseOf(), baseName: this.baseOf(),
          };
        }
      } catch (e) {
        this.error = e.message;
      }
      this.loading = false;
      // After the sections exist, not before: x-for has to have run for there
      // to be anything to move.
      this.$nextTick(() => this.deck());
    },

    // THE SET IS A DECK, AND THE STANDARD ONE. The first version mounted the
    // bare track, `swipeDeck.core`, which is the format without its chrome: a
    // short first slide, a screen of white below it, and nothing anywhere
    // saying there were two more to the right. A reader met it and asked
    // whether it was working. It was, and that is the point: a deck with no
    // pager is a deck nobody knows they can move.
    //
    // `swipeDeck.open` is the format WITH its chrome, and the kit's own header
    // says why a second consumer must not rebuild it: the title, the contents
    // list behind the mark, and the footer's dots and arrows all come from one
    // place so they cannot fork. The decisions ride in the `subheader`, the row
    // the kit places and the caller fills, because the deck owns the foot.
    //
    // THE SLIDES ARE THE ITEMS AND NOTHING ELSE. A first slide carrying the
    // request's reason put a page of prose in front of the two files someone
    // came to judge, and read as instructions rather than as the thing. The
    // deck is one of two, two of two. `index` names each slide by its path,
    // which is what the header mark's contents list shows.
    deck() {
      if (!window.swipeDeck || this._deck) return;
      const tpl = this.$refs.itemTpl;
      if (!tpl || !this.items.length) return;
      this._deck = window.swipeDeck.open({
        count: this.items.length,
        title: this.nameOf(this.itemAt(0)) || 'Approve',
        subtitle: this.dirOf(this.itemAt(0)),
        icon: 'ph-seal-check',
        index: (i) => this.pathOf(this.itemAt(i)) || `Item ${i + 1}`,
        actions: [this.jumpBtn(), this.approveBtn()],
        // NO SUBHEADER UNTIL THERE IS ONE. The notice used to be passed here
        // at open, and `empty:hidden` never fired: the slot holds whatever
        // element it is given, and this one is a wrapper whose alert is
        // `x-show`-ed, so the slot had a child, was not `:empty`, and drew an
        // empty bordered band under the header for the whole session. The
        // kit's contract is that a filled slot is a shown slot; the caller
        // decides when it is filled, so `send()` fills it.
        slideScroll: false,
        innerClass: 'w-full h-full min-w-0',
        snapStop: true,
        render: (n, slide) => {
          const node = tpl.content.firstElementChild.cloneNode(true);
          node.setAttribute('x-data', `{ it: itemAt(${n}) }`);
          slide.append(node);
          window.Alpine.initTree(node);
        },
        // Dismissing leaves the page with nothing on it, since the deck IS the
        // page. Re-opening on the next tick is what makes ✕ a no-op here rather
        // than a way to empty the screen; a reader closing an app view uses the
        // shell's own chrome.
        // The header follows the reader. `_deck` is not assigned until open()
        // returns, so the guard is not defensive dressing: a slide event during
        // construction would otherwise land on null.
        onSlide: (i) => {
          if (!this._deck) return;
          const it = this.itemAt(i);
          this._deck.setTitle(this.nameOf(it) || 'Approve');
          this._deck.setSubtitle(this.dirOf(it));
          this._deck.setTitleMark(this.ghMark(it));
        },
        onClose: () => { this._deck = null; this.$nextTick(() => this.deck()); },
      });
      // `title` and `subtitle` are open() options and the mark is not, so the
      // first slide's gets set here. onSlide only fires on a scroll.
      this._deck.setTitleMark(this.ghMark(this.itemAt(0)));
    },

    async send(decision) {
      this.sending = true;
      try {
        // Whatever the annotator holds when the verdict is taken rides out with
        // it. It is started from the FAB, so there is nothing here to switch off.
        if (window.Annotate && window.Annotate.disable) { try { window.Annotate.disable(); } catch (e) {} }
        const [repo, dir] = (this.ctx.reply_to || '').split(':');
        const gh2 = new GH({ token: this.token, repo, ref: this.ctx.reply_ref || '' });
        const path = `${dir ? dir.replace(/\/$/, '') + '/' : ''}${this.ctx.id}.verdict.json`;
        // paths comes from the request, never from a field: the decision has to
        // cover exactly what was shown, and a typed list is a second chance to
        // get that wrong.
        const body = {
          id: this.ctx.id,
          kind: this.ctx.kind,
          decision,
          decided_at: new Date().toISOString(),
          paths: this.items.map(it => this.pathOf(it)),
          notes: (window.Annotate?.items || []).map(n => ({
            anchor: n.quote || n.address || '', note: n.note || '',
          })),
        };
        const res = await gh2.save(path, body, `Approval ${decision}: ${this.ctx.id}`);
        this.decision = decision;
        this.sentPath = path;
        this.sent = res?.content?.html_url || `https://github.com/${repo}/blob/HEAD/${path}`;
        // Now there is something to show, so the slot gets filled. `$nextTick`
        // because the alert inside it is `x-show`-ed on `sent`, which Alpine
        // has not applied yet at this line.
        this.$nextTick(() => this._deck && this._deck.setSubheader(this.$refs.sent));
      } catch (e) {
        this.error = e.message;
      }
      this.sending = false;
    },
  }));
});
</script>
</body>
</html>
