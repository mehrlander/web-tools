<!doctype html>
<html lang="en" data-theme="emerald">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Approve</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔏</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  approve.html — renders an `approval/1` surface: a request for a DECISION.

  inquiry.html collects answers; this collects a verdict. The difference is not
  the form but the reader's licence: the expected outcome includes "no", and
  the page has to make refusing as cheap as agreeing or it is a rubber stamp
  with extra steps.

  Three layers, as in inquiry:
    the OBJECT     an approval/1 surface, self-addressed via context.reply_to
    the RENDERING  this page: the diff first, the author's reason beside it
    the CONSTRAINT the profile schema, which names what the author owed

  What it writes back is <reply_to>/<id>.verdict.json, through the viewer's own
  token. That file is the point of the whole envelope: "did the user approve
  this" stops being a claim a session types into a commit message and becomes a
  file a commit hook resolves. Contract: docs/envelopes/approval.md.

  Addressing, the same grammar every envelope here uses:
    #src=owner/repo[@ref]:path     fetch the envelope through the stored token
    #gz=<base64url gzip>           carry it inline, for a token-less reader
  Both also read from ?query, for a context that strips fragments.

  THE TOKEN IS NOT SPECIAL HERE, and two drafts of this page treated it as
  though it were. The first refused whenever it was framed; the second kept a
  pre-flight probe, a flag, dimmed buttons and a banner about sandboxes. A
  verdict is a commit like any other commit this estate makes: the page reads
  the token the way kits/annotate.js reads it for a jot, writes, and reports
  what the write said. Nothing is asked in advance.

  Diff cards are alpineComponents/file-review.js, the same component
  pages/review.html mounts per changed file, so a reviewer here sees exactly
  what a reviewer there sees. Notes are kits/annotate.js enabled over this
  document: a selection in a diff pane becomes a note, and the set rides out on
  the verdict rather than saving as its own jot, since here a note is part of a
  decision rather than a standalone reading.
-->
<script>window.__depsReady = new Promise(r => { window.__depsDone = r; });</script>
<script type="module">
  const ref = new URLSearchParams(location.search).get('use');
  if (ref) {
    const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/dist/web-tools.js`, { cache: 'no-store' });
    if (!src.ok) throw new Error(`?use=${ref}: could not fetch the bundle (HTTP ${src.status})`);
    const url = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
    try { await import(url); } finally { URL.revokeObjectURL(url); }
  } else {
    await import('../dist/web-tools.js');
  }
  try {
    await gh.load('gh-store.js');
    await gh.load('kits/swipe-deck.js');
    await gh.load('kits/cm6-merge.js');
    await gh.load('alpineComponents/file-review.js');
    await gh.load('kits/annotate.js');
  } finally { window.__depsDone(); }
</script>
<style>[x-cloak]{display:none!important}</style>
</head>
<!-- NO PAGE HEADER, AND THE SET IS A DECK. The page used to open on a strip of
     its own chrome (a seal, the request's name, its kind and occasion, a notes
     button), then the id and branch, then the rationale, then a bordered frame
     holding every item stacked. On a phone that is most of a screen before the
     first thing anyone came to read, and the frame put a second box around
     cards that already have edges.
     The house format for a set you go THROUGH is the swipe deck, so the set is
     one: the ask is slide one and each item is its own after it. Nothing is
     nested, so a change container gets the full width, and the only chrome left
     is the row of decisions at the foot, which is what the page is for.
     `h-dvh` with the deck growing, not `min-h-dvh`: a track has to be given a
     height to snap inside. Normal flow rather than `fixed inset-0`, since this
     page is framed as an app view and rule 5 of the house style is that a fixed
     child measures against the OUTER viewport. -->
<body class="h-dvh flex flex-col bg-base-100 text-base-content overflow-hidden"
      x-data="approveApp()" x-cloak>

<div x-show="loading" class="flex items-center gap-2 opacity-70 px-3 py-3">
  <span class="loading loading-spinner loading-sm"></span> Loading
</div>
<div x-show="error" class="alert alert-error py-2 px-3 m-3">
  <i class="ph ph-warning-circle"></i><span x-text="error"></span>
</div>

<!-- The track lives here and the slides are filled from the pool below. Alpine
     builds each section once, with its bindings; the deck MOVES the node rather
     than re-rendering it, so nothing is built twice and nothing loses state. -->
<main class="grow min-h-0" x-ref="deck"></main>

<!-- grid-cols-[minmax(0,1fr)], not a bare `grid`. A grid item defaults to
     min-width:auto, so one wide descendant (a code fence with long lines) sizes
     the track to max-content and EVERY block inside lays out at that width:
     measured at 390px, the whole rendered document was 1398px wide, so ordinary
     paragraphs did not wrap and the card clipped them with overflow-hidden.
     Letting the column shrink below its content is what hands the overflow back
     to the objects that know how to scroll. -->
<div x-ref="pool" class="hidden">

  <section data-slide class="h-full overflow-y-auto px-3 py-3 grid grid-cols-[minmax(0,1fr)] gap-2 content-start">
    <div class="flex items-baseline gap-2 flex-wrap">
      <i class="ph ph-seal-check text-primary"></i>
      <span class="font-semibold" x-text="env?.manifest?.name || 'Approve'"></span>
    </div>
    <div class="flex items-center gap-3 flex-wrap font-mono text-xs opacity-60">
      <span x-text="ctx.id"></span>
      <span x-show="ctx.occasion" x-text="ctx.occasion"></span>
      <a x-show="ctx.branch" :href="'https://github.com/' + repoOf() + '/tree/' + ctx.branch"
         target="_blank" class="link link-hover" x-text="ctx.branch"></a>
      <a x-show="ctx.session" :href="ctx.session" target="_blank" class="link link-hover">session</a>
    </div>
    <p class="text-pretty" x-text="ctx.rationale"></p>
  </section>

  <!-- The author's reason, first. It is what the decision is about; the diffs
       below are the evidence for it. Labelled rather than boxed, so the page
       reads as one document instead of a stack of cards. -->
  <section x-show="ctx.rationale">
    <div class="flex items-center gap-3 flex-wrap font-mono text-xs opacity-60 mb-1">
      <span x-text="ctx.id"></span>
      <a x-show="ctx.branch" :href="'https://github.com/' + repoOf() + '/tree/' + ctx.branch"
         target="_blank" class="link link-hover" x-text="ctx.branch"></a>
      <a x-show="ctx.session" :href="ctx.session" target="_blank" class="link link-hover">session</a>
    </div>
    <p class="text-pretty" x-text="ctx.rationale"></p>
  </section>

  <!-- One item per slide, so no frame around the set and no box inside one: the
       item IS the screen. The bordered frame that used to hold them made the
       page read as a stack of tiles and cost the change container its width. -->
  <!-- A PLAIN TEMPLATE, NOT x-for. The first version generated the item
       sections with x-for and moved the nodes into the deck's slides; Alpine
       owns an x-for's output, re-created it in the pool behind the move, and
       the slides ended up holding detached copies with nothing in them.
       Measured: three slides, zero change containers. So the deck clones this
       template per item and gives each clone its own `it` before Alpine
       initialises it, which is the ordinary way to hand one record to one
       subtree. -->
  <template x-ref="itemTpl">
    <section data-slide class="h-full overflow-y-auto px-2 py-2 grid grid-cols-[minmax(0,1fr)] gap-2 content-start">

        <div class="flex items-baseline gap-2 flex-wrap">
          <span class="font-medium font-mono" x-text="it.title"></span>
          <span class="text-xs opacity-60" x-show="it.change?.status" x-text="it.change?.status"></span>
        </div>

        <p class="text-pretty" x-text="it.commentary"></p>

        <div x-show="it.metadata?.deferred_because" class="border-l-2 border-primary pl-3">
          <div class="text-xs opacity-60">Not done in that session because</div>
          <p class="text-pretty" x-text="it.metadata?.deferred_because"></p>
        </div>

        <div x-show="(it.related || []).length" class="flex items-baseline gap-2 flex-wrap">
          <span class="text-xs opacity-60">Answers to</span>
          <template x-for="r in (it.related || [])" :key="r.item">
            <a class="link link-hover font-mono" target="_blank"
               :href="'https://github.com/' + repoOf() + '/blob/' + (ctx.branch || 'HEAD') + '/' + r.item"
               x-text="r.item"></a>
          </template>
        </div>

        <!-- read: true, which is the card's READING mode. Its own design note
             says the four source tabs are four readings of one fixed pair,
             right for scanning thirty rows in a list and wrong for reading one
             file, where the question is not which rendering but against what.
             A reading host hands that question up and the strip collapses to
             the document plus one Compare pane. Mounted without it, an
             approval showed five tabs and opened on Patch, which is the rawest
             view of a change someone is being asked to judge.

             openOn: 'mddiff' is the second half of that. A reading card lands
             on the document, which is right for a deck you are browsing and
             wrong here: this page exists to judge a CHANGE, and a reviewer
             handed the finished document has to find what moved before they
             can weigh it. The rendered comparison is that document with the
             change marked in it, so it is the same reading with the question
             answered. The card falls back to the document where the file has
             no rendered comparison to offer. -->
        <div x-show="ctx.kind === 'documentation' && pathOf(it)"
             x-data="fileReview({
               repo: repoOf(), ref: ctx.branch, base: baseOf(), baseName: baseOf(),
               path: pathOf(it), prevPath: it.change?.previous_path,
               status: it.change?.status, patch: it.change?.patch,
               open: true, bare: true, read: true, openOn: 'mddiff' })"></div>

    </section>
  </template>
</div>

<footer class="sticky bottom-0 z-30 bg-base-100 border-t border-base-300 px-3 py-2 grid gap-2">

  <div x-show="sent" class="alert alert-success py-2 px-3">
    <i class="ph ph-check-circle"></i>
    <span>Recorded as <span class="font-mono" x-text="decision"></span>.
      <a :href="sent" target="_blank" class="link" x-text="sentPath"></a></span>
  </div>

  <!-- Refusing is one tap, in the same row and the same size as agreeing. A
       decision surface whose "no" is harder to reach than its "yes" collects
       agreement rather than decisions. -->
  <div class="flex gap-2 items-center" x-show="env && !sent">
    <button class="btn btn-ghost btn-sm shrink-0" @click="toggleNotes()" :class="noting && 'text-primary'"
            title="Take notes on this request" aria-label="Take notes on this request">
      <i class="ph ph-note-pencil"></i><span x-text="notes.length || ''"></span>
    </button>
    <button class="btn btn-sm grow" @click="send('returned')" :disabled="sending">
      <i class="ph ph-arrow-u-up-left"></i> Return
    </button>
    <button class="btn btn-sm grow" @click="send('approved-with-edits')" :disabled="sending || !notes.length">
      <i class="ph ph-pencil-simple"></i> With edits
    </button>
    <button class="btn btn-sm btn-primary grow" @click="send('approved')" :disabled="sending">
      <i class="ph ph-check"></i> Approve
    </button>
  </div>

  <div class="text-xs opacity-60 font-mono truncate" x-show="ctx.reply_to" x-text="ctx.reply_to"></div>
</footer>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('approveApp', () => ({
    env: null, items: [], notes: [],
    loading: true, error: '', sending: false, sent: '', sentPath: '', decision: '',
    noting: false,
    // THE TOKEN, THE WAY EVERY OTHER WRITER HERE GETS IT. The global a shell
    // sets, else this origin's store, and a write that finds neither fails at
    // the write. It is kits/annotate.js's three lines for a jot, and a verdict
    // is not a different kind of act.
    //
    // It used to be a pre-flight probe, a `canPost` flag, dimmed buttons and a
    // banner about sandboxes. All of it was answering a question no other page
    // asks, and answering it wrong: the flag was set from `window.TOKEN`, which
    // only app/index.html and pages/repo-atlas.html ever define, so a reader
    // holding a perfectly good token was told there was none. Measured
    // 2026-09-18, tossed with a token in the store: readable, `window.TOKEN`
    // undefined, buttons dead. The surface had never been usable.
    get token() {
      if (window.TOKEN) return window.TOKEN;
      try { return localStorage.getItem('ghToken') || ''; } catch (e) { return ''; }
    },

    get ctx() { return this.env?.context || {}; },
    itemAt(i) { return this.items[i] || {}; },
    // Where the items live. The request names one repo for the set, since a
    // decision spanning two repos is two decisions.
    repoOf() { return this.ctx.repo || (this.ctx.reply_to || '').split(':')[0]; },
    baseOf() { return this.ctx.base || 'main'; },
    pathOf(it) { return it.target?.path || it.title; },

    // hash first, then query: the fragment is the private form, the query is
    // what survives a context that strips fragments.
    param(key) {
      const h = new URLSearchParams(location.hash.slice(1)).get(key);
      return h || new URLSearchParams(location.search).get(key);
    },

    toggleNotes() {
      if (!window.Annotate) return;
      if (this.noting) { this.notes = window.Annotate.items; window.Annotate.disable(); }
      else window.Annotate.enable({ subject: { title: this.env?.manifest?.name, url: location.href } });
      this.noting = !this.noting;
    },

    async init() {
      await window.__depsReady;
      try {
        const gz = this.param('gz');
        const src = this.param('src');
        if (gz) {
          const bin = Uint8Array.from(atob(gz.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
          const ds = new DecompressionStream('gzip');
          this.env = JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(ds)).text());
        } else if (src) {
          const [addr, ...rest] = src.split(':');
          const [repo, ref] = addr.split('@');
          this.env = JSON.parse((await new GH({ token: this.token, repo, ref: ref || '' }).get(rest.join(':'))).text);
        } else {
          this.error = 'No request. Address one with #src=owner/repo[@ref]:path or #gz=…';
        }
        this.items = this.env?.items || [];
        // A reading card asks its host what to compare against. The request
        // already names the pair, so publish it before the cards mount rather
        // than leaving each one to pick, which is the choice the card says it
        // has no business making.
        if (this.ctx.branch) {
          window.__compareRef = {
            repo: this.repoOf(), ref: this.ctx.branch,
            base: this.baseOf(), baseName: this.baseOf(),
          };
        }
      } catch (e) {
        this.error = e.message;
      }
      this.loading = false;
      // After the sections exist, not before: x-for has to have run for there
      // to be anything to move.
      this.$nextTick(() => this.deck());
    },

    // THE SET IS A DECK, and the slides are the sections Alpine already built.
    // `render` MOVES a node out of the pool rather than constructing one, so
    // every binding, every mounted card and every bit of state comes with it
    // and nothing is built twice. The deck builds lazily, so a request with
    // twenty items still costs three slides on open.
    //
    // `slideScroll: false` because each section owns its own vertical scroll:
    // the deck's own padding is what would inset a change container from the
    // edge, and the whole point of moving to a deck was to stop nesting.
    // `snapStop` for the reason the change containers have it: a set is stepped
    // through, not flicked past.
    deck() {
      const host = this.$refs.deck, pool = this.$refs.pool;
      if (!host || !pool || !window.swipeDeck) return;
      const ask = pool.querySelector('[data-slide]');
      const tpl = this.$refs.itemTpl;
      if (!ask || !tpl) return;
      host.textContent = '';
      const d = window.swipeDeck.core(1 + this.items.length, (n, slide) => {
        if (n === 0) { slide.append(ask); return; }
        const node = tpl.content.firstElementChild.cloneNode(true);
        node.setAttribute('x-data', `{ it: itemAt(${n - 1}) }`);
        slide.append(node);
        window.Alpine.initTree(node);
      }, { slideScroll: false, innerClass: 'w-full h-full min-w-0', snapStop: true });
      host.append(d.track);
    },

    async send(decision) {
      this.sending = true;
      try {
        if (this.noting) this.toggleNotes();
        const [repo, dir] = (this.ctx.reply_to || '').split(':');
        const gh2 = new GH({ token: this.token, repo, ref: this.ctx.reply_ref || '' });
        const path = `${dir ? dir.replace(/\/$/, '') + '/' : ''}${this.ctx.id}.verdict.json`;
        // paths comes from the request, never from a field: the decision has to
        // cover exactly what was shown, and a typed list is a second chance to
        // get that wrong.
        const body = {
          id: this.ctx.id,
          kind: this.ctx.kind,
          decision,
          decided_at: new Date().toISOString(),
          paths: this.items.map(it => this.pathOf(it)),
          notes: (window.Annotate?.items || []).map(n => ({
            anchor: n.quote || n.address || '', note: n.note || '',
          })),
        };
        const res = await gh2.save(path, body, `Approval ${decision}: ${this.ctx.id}`);
        this.decision = decision;
        this.sentPath = path;
        this.sent = res?.content?.html_url || `https://github.com/${repo}/blob/HEAD/${path}`;
      } catch (e) {
        this.error = e.message;
      }
      this.sending = false;
    },
  }));
});
</script>
</body>
</html>
