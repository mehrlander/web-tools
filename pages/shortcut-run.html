<!doctype html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Shortcut</title>
<script>
{ // Before anything loads or paints: a valid link leaves for the log at once.
  const SCHEME = /^shortcuts:\/\//i;
  let link = location.hash.slice(1);
  if (!SCHEME.test(link)) { try { link = decodeURIComponent(link); } catch {} }
  if (SCHEME.test(link)) location.replace('shortcut-log.html#run=' + link);
}
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>▶️</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  shortcut-run.html — an https address for a shortcuts:// link.

  The Claude iPhone app stopped treating a shortcuts:// address as a link
  (measured 2026-10-18: the tap does nothing and a long-press offers no link
  menu, while an https link beside it opens). So a session hands over
  shortcut-run.html#<the shortcuts:// link>, and tools/run.py in shortcut-tools
  prints that form.

  This page only redirects. It replaces itself with shortcut-log.html#run=<link>
  before it draws, and the log page makes the hand-off and stays open on the
  log, where the run's row lands. Measured 2026-10-21: a hand-off made on
  arrival works from the Claude app with no tap.

  Only a shortcuts:// link is followed, so the address cannot send a reader
  anywhere else; anything else gets the line below.
-->
</head>
<body class="min-h-dvh bg-base-200 p-4">
<main class="card bg-base-100 shadow-sm">
  <div class="card-body">
    <h1 class="text-2xl font-bold text-balance">No shortcuts:// link in this address</h1>
  </div>
</main>
</body>
</html>
