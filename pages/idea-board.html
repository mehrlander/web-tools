<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea board</title>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  idea-board.html — one idea board in its own window. The board is
  lib/alpineComponents/idea-board.js, the same component the app's content
  program opens in a takeover; its header says what it reads and how a card is
  drawn, and docs/idea-board.md states the address grammar and the fields.
  This page brings the window and the address (#gh=, #gz=, #user-call=); with
  none it draws demos/idea-board.json. The component loads the kits it draws
  with, so the module below imports the pre-build and nothing else.
-->
<script type="module">
  const q = new URLSearchParams(location.search);
  const ref = q.get('use') || (q.getAll('refs').map(v => (String(v).match(/^mehrlander\/web-tools@([^:]+)$/) || [])[1]).find(Boolean));
  if (ref) {
    const src = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${ref}/dist/web-tools.js`, { cache: 'no-store' });
    if (!src.ok) throw new Error(`?use=${ref}: could not fetch the bundle (HTTP ${src.status})`);
    const url = URL.createObjectURL(new Blob([await src.text()], { type: 'text/javascript' }));
    try { await import(url); } finally { URL.revokeObjectURL(url); }
  } else {
    await import('../dist/web-tools.js');
  }
</script>
<style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-base-100 text-base-content">
<div x-data="ideaBoard()" x-cloak class="h-dvh"></div>
</body>
</html>
