<!doctype html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shortcuts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧩</text></svg>">
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>

<!--
  shortcuts.html — home base for the shortcut estate.

  WHAT WAS MISSING. Three surfaces existed and none of them was an entry point.
  shortcut-log.html answers "what ran"; library.html in web-tools-private answers
  "what is on the phone", all 606 of them; workflows/README.md answers "what have
  we built", in 12,500 words ordered by the date each thing was discovered. The
  question a reader actually opens with, "what do we maintain and is the phone
  carrying the current copy", had no surface at all, and could not have one while
  the answer lived in 75 separate chain files.

  So shortcut-tools publishes catalog.json, one row per chain, and this page is
  its reader. The two are the same split every other page here runs: the
  structured stage is committed and checked in the repo that owns the data, and
  the render holds no judgment of its own.

  THE JOIN IS THIS PAGE'S JOB, AND ONLY THIS PAGE'S. catalog.json carries what
  the chain files state and nothing about any device, deliberately, so it stays
  deterministic and its --check can be exact. Whether a chain is installed, which
  build ran, and when, are facts about a phone. They live in web-tools-private,
  they need a token, and they are layered on here.

  WHICH MEANS THE PAGE HAS TO WORK WITHOUT THEM. catalog.json is public, so the
  table renders with no token at all and the Device column stays empty. That is
  the repo's standing rule about unknown answers: "current" and "not looked up"
  must never render the same, so an unread device is blank rather than green.

  THREE SOURCES SAY "ON DEVICE" AND ALL THREE ARE PARTIAL. index.json is a
  snapshot of the last dump, so anything installed since is missing from it. The
  newest manifest is the device's own list and is newer, but still a moment in
  time. The log holds installs and runs and only for chains that report. Reading
  all three together is what run.py's own audit does, and it is the reason a name
  installed yesterday does not read as absent.

  NO STAT CARDS. The counts are one compact line in the header, per the house
  style. The figure that would deserve room is "how many are stale", and it earns
  its place by being a filter rather than a tile.
-->
</head>
<body class="bg-base-200">
<div class="fixed inset-0 grid grid-rows-[auto_1fr_auto]">

  <header class="bg-base-100 border-b border-base-300 px-3 py-2 flex flex-col gap-2">
    <div class="flex items-center gap-2 flex-wrap">
      <h1 class="text-lg font-bold">Shortcuts</h1>
      <span id="tally" class="text-xs opacity-60 font-mono">loading</span>
      <span id="status" class="badge badge-ghost badge-sm ml-auto">…</span>
      <button id="refresh" class="btn btn-xs btn-ghost" aria-label="Refresh">
        <i class="ph ph-arrows-clockwise"></i>
      </button>
    </div>
    <div class="flex flex-col sm:flex-row sm:items-center gap-2">
      <input id="q" type="search" placeholder="filter by name"
             class="input input-sm input-bordered w-full sm:flex-1 sm:min-w-0">
      <select id="view" class="select select-sm select-bordered w-full sm:w-auto">
        <option value="installable">Installable</option>
        <option value="stale">Needs installing</option>
        <option value="device">On device</option>
        <option value="absent">Not on device</option>
        <option value="probes">Not installable</option>
        <option value="all">All</option>
      </select>
    </div>
  </header>

  <!-- pb-14 keeps the last row clear of the boot chain's floating button,
       which is fixed and therefore sits over the end of a scrolling table. -->
  <main class="overflow-auto pb-14">
    <table class="table table-pin-rows">
      <thead>
        <tr class="text-xs">
          <th>Chain</th>
          <th class="text-right hidden sm:table-cell">Cards</th>
          <th class="hidden sm:table-cell">Build</th>
          <th>Device</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <footer class="bg-base-100 border-t border-base-300 px-3 py-2 flex items-center gap-3 text-xs">
    <span id="count" class="opacity-60 font-mono"></span>
    <a class="link link-hover ml-auto" href="shortcut-log.html">Log</a>
    <a class="link link-hover"
       href="https://github.com/mehrlander/shortcut-tools/tree/main/workflows">Chains</a>
    <a class="link link-hover"
       href="https://github.com/mehrlander/web-tools-private/blob/main/shortcuts/library.html">Library</a>
  </footer>
</div>

<script type="module">
// The repo's standard boot, same as shortcut-log.html: gh-api.js, then
// gh-auth.js, which owns token resolution and the token screen. ?use=<ref> pins
// the library chain to a branch for previewing edits.
const q = new URLSearchParams(location.search);
const useRef = q.get('use');
if (useRef) {
  window.__ghBlobBoot = { repo: 'mehrlander/web-tools', ref: useRef };
  const r = await fetch(`https://raw.githubusercontent.com/mehrlander/web-tools/${useRef}/lib/gh-api.js`,
                        { cache: 'no-store' });
  if (!r.ok) throw new Error(`?use=${useRef}: could not fetch gh-api.js (HTTP ${r.status})`);
  const u = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
  try { await import(u); } finally { URL.revokeObjectURL(u); }
} else {
  await import('https://cdn.jsdelivr.net/gh/mehrlander/web-tools@main/lib/gh-api.js');
}
await gh.load('gh-auth.js');

// ?ref= points the catalog and the install links at a branch of shortcut-tools,
// so a chain can be reviewed here before it reaches main. It is separate from
// ?use=, which pins this page's own library chain; the two repos move apart.
const REF     = q.get('ref') || 'main';
const CHAINS  = 'mehrlander/shortcut-tools';
const PRIVATE = 'mehrlander/web-tools-private';
// jsDelivr for main and raw for any other ref, the same split the ?use= boot
// above runs: jsDelivr caches hard, which is right for a pinned tag and wrong
// for a branch being reviewed a commit at a time.
const CATALOG = REF === 'main'
  ? `https://cdn.jsdelivr.net/gh/${CHAINS}@main/catalog.json`
  : `https://raw.githubusercontent.com/${CHAINS}/${REF}/catalog.json`;
const PLIST   = n => `https://raw.githubusercontent.com/${CHAINS}/${REF}/plists/${n}.plist`;
const BLOB    = f => `https://github.com/${CHAINS}/blob/${REF}/workflows/${f}`;
const LOGS    = 40;   // enough history for build freshness; older runs say nothing new

const el = id => document.getElementById(id);
const priv = new window.GH({ repo: PRIVATE, ref: 'main' });

// A private repo you cannot see answers 404, not 401, and gh-auth only takes
// over on 401/403. So the device half is attempted, and a failure leaves the
// Device column blank rather than stranding the page: the catalog is public and
// the table is worth reading on its own.
const NEED_TOKEN =
  'Device state lives in a private repo, so it needs a GitHub token with repo scope. '
  + 'Storage is per-app: a token saved in Safari is not visible inside the Shortcuts sheet.';

const node = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;   // never innerHTML
  return n;
};
const link = (cls, href, text) => {
  const a = node('a', cls, text);
  a.href = href;
  return a;
};

// ---- data -----------------------------------------------------------------

let catalog = null;        // { meta, external_targets, rows }
let device  = null;        // null while unread: unknown is not "absent"

const runLink = n => `shortcuts://run-shortcut?name=${encodeURIComponent(n)}`;
// Library-Import splits Shortcut Input on newlines and reads two: the name it
// should land under, then where to fetch the plist. Emitting the address form
// rather than an embedded payload is the repo's rule: a wrong character 404s
// instead of quietly delivering less than it claims.
const installLink = n =>
  'shortcuts://run-shortcut?name=Library-Import&input=text&text='
  + encodeURIComponent(n + '\n' + PLIST(n));

// A missing file does not always arrive as a status: a CDN can answer 200 with
// an empty body, and `await r.json()` then fails with a parser message naming
// neither the file nor the ref. Both failures say the same useful thing here.
async function loadCatalog() {
  const r = await fetch(CATALOG, { cache: 'no-store' });
  if (!r.ok) throw new Error(`catalog.json at ${REF}: HTTP ${r.status}`);
  const text = await r.text();
  try {
    catalog = JSON.parse(text);
  } catch {
    throw new Error(`catalog.json not readable at ${REF} (${text.length} bytes)`);
  }
}

// The manifest is the device's own list, written in sections headed ==name==.
// Only the name section is read; the others describe other properties and a
// blind parse would fold them in as shortcut names.
function manifestNames(text) {
  const out = new Set();
  let inNames = false;
  for (const raw of text.split('\n')) {
    const l = raw.trim();
    if (/^==.*==$/.test(l)) { inNames = l === '==name=='; continue; }
    if (inNames && l) out.add(l);
  }
  return out;
}

async function loadDevice() {
  if (!window.ghAuth.resolve()) return null;
  const have = new Set();            // every name the device is known to hold
  const ran  = new Map();            // name -> build id of its newest logged run

  // index.json, the last dump. A snapshot, so it misses anything newer.
  try {
    const idx = JSON.parse((await priv.get('shortcuts/index.json')).text);
    for (const r of idx) if (r && r.name) have.add(r.name);
  } catch (e) { if (e && e.status === 404) { window.ghAuth.prompt(NEED_TOKEN); return null } }

  // The newest manifest, which is newer than the dump and settles the names
  // installed since it.
  try {
    const list = await priv.req('contents/shortcuts/manifests');
    const newest = list.filter(f => f.name.endsWith('.txt'))
                       .sort((a, b) => b.name.localeCompare(a.name))[0];
    if (newest) {
      const t = await (await fetch(newest.download_url, { cache: 'no-store' })).text();
      for (const n of manifestNames(t)) have.add(n);
    }
  } catch {}

  // The log: installs prove arrival, runs carry the build id that decides
  // whether the copy on the phone is the copy that was published.
  try {
    const list = await priv.req('contents/shortcuts/log');
    const newest = list.filter(f => f.name.endsWith('.json'))
                       .sort((a, b) => b.name.localeCompare(a.name)).slice(0, LOGS);
    const bodies = await Promise.all(newest.map(f =>
      fetch(f.download_url, { cache: 'no-store' }).then(r => r.text()).catch(() => '')));
    for (const raw of bodies) {                 // newest first, so the first wins
      let j; try { j = JSON.parse(raw) } catch { continue }
      if (!j || typeof j !== 'object' || !j.name) continue;
      have.add(j.name);
      if (j.build && !ran.has(j.name)) ran.set(j.name, String(j.build));
    }
  } catch {}

  return { have, ran };
}

// ---- state ----------------------------------------------------------------

// Five answers, and the fifth is silence. A chain with no name is never
// installed, so it has no device state to report and is not counted as absent.
function state(row) {
  if (!row.name) return null;
  if (!device) return null;
  const ran = device.ran.get(row.name);
  if (ran) return ran === row.build ? 'current' : 'stale';
  if (device.have.has(row.name)) return 'on device';
  return 'not on device';
}

const TONE = {
  'current':      'badge-success',
  'stale':        'badge-primary',
  'on device':    'badge-ghost',
  'not on device':'badge-outline',
};

function matches(row, view, needle) {
  const hay = `${row.name || ''} ${row.label || ''} ${row.file}`.toLowerCase();
  if (needle && !hay.includes(needle)) return false;
  const s = state(row);
  switch (view) {
    case 'installable': return !!row.name;
    case 'probes':      return !row.name;
    case 'stale':       return s === 'stale' || s === 'not on device';
    case 'device':      return s === 'current' || s === 'stale' || s === 'on device';
    case 'absent':      return s === 'not on device';
    default:            return true;
  }
}

// ---- render ---------------------------------------------------------------

// A label reads "Name: what it does (N actions)". The name is already the first
// column and the count is already a column, so the row shows the middle.
function gist(row) {
  let t = row.label || row.file;
  if (row.name) t = t.replace(new RegExp('^' + row.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ':\\s*'), '');
  return t.replace(/\s*\(\d+ actions?\)\s*$/, '');
}

function paint() {
  const view = el('view').value;
  const needle = el('q').value.trim().toLowerCase();
  const shown = catalog.rows.filter(r => matches(r, view, needle));
  const body = el('rows');
  body.textContent = '';

  for (const row of shown) {
    const tr = node('tr', 'hover');

    const first = node('td', 'align-top');
    first.append(node('div', 'font-medium', row.name || row.file.replace(/\.json$/, '')));
    first.append(node('div', 'text-xs opacity-60 text-pretty', gist(row)));
    if (row.targets.length)
      first.append(node('div', 'text-xs opacity-40 font-mono', '→ ' + row.targets.join(' · ')));
    // A phone has no room for a column per figure, so the two that are only
    // reference material ride here instead of scrolling off the right edge.
    first.append(node('div', 'text-xs opacity-40 font-mono sm:hidden',
      [row.actions + ' cards', row.name ? row.build : null].filter(Boolean).join(' · ')));
    tr.append(first);

    tr.append(node('td', 'align-top text-right font-mono text-xs hidden sm:table-cell',
                   String(row.actions)));
    tr.append(node('td', 'align-top font-mono text-xs opacity-60 hidden sm:table-cell',
                   row.name ? row.build : ''));

    const dev = node('td', 'align-top');
    const s = state(row);
    if (s) dev.append(node('span', 'badge badge-sm whitespace-nowrap ' + TONE[s], s));
    tr.append(dev);

    const acts = node('td', 'align-top');
    const bar = node('div', 'flex flex-col sm:flex-row items-end sm:items-center gap-1 sm:justify-end');
    const act = (cls, href, label, icon) => {
      const a = link(cls + ' whitespace-nowrap', href, null);
      a.append(node('i', 'ph ' + icon));
      a.append(node('span', 'hidden sm:inline', label));
      a.setAttribute('aria-label', label);
      return a;
    };
    if (row.name) {
      bar.append(act('btn btn-xs', installLink(row.name), 'Install', 'ph-download-simple'));
      bar.append(act('btn btn-xs btn-ghost', runLink(row.name), 'Run', 'ph-play'));
    }
    bar.append(act('btn btn-xs btn-ghost', BLOB(row.file), 'Source', 'ph-file-code'));
    acts.append(bar);
    tr.append(acts);

    body.append(tr);
  }

  el('count').textContent = `${shown.length} of ${catalog.rows.length}`;
}

// The header's one compact line, which is where the figures go instead of a row
// of tiles. The device half is only stated once it has been read.
function tally() {
  const rows = catalog.rows;
  const named = rows.filter(r => r.name);
  const parts = [`${rows.length} chains`, `${named.length} installable`];
  if (device) {
    const s = named.map(state);
    parts.push(`${s.filter(x => x === 'current').length} current`,
               `${s.filter(x => x === 'stale').length} stale`,
               `${s.filter(x => x === 'not on device').length} not installed`);
  }
  if (REF !== 'main') parts.push(REF);
  el('tally').textContent = parts.join(' · ');
}

async function load() {
  el('status').className = 'badge badge-ghost badge-sm';
  el('status').textContent = 'loading';
  try {
    await loadCatalog();
    paint(); tally();                       // the public half paints immediately
    device = await loadDevice();
    paint(); tally();
    el('status').className = device ? 'badge badge-success badge-sm' : 'badge badge-warning badge-sm';
    el('status').textContent = device ? 'device read' : 'no token';
  } catch (e) {
    el('status').className = 'badge badge-error badge-sm';
    el('status').textContent = String(e.message || e);
  }
}

el('refresh').onclick = load;
el('view').onchange = () => paint();
el('q').oninput = () => paint();
await load();
window.ghAuth.bootDone();
</script>
</body>
</html>
