name: Windows desktop
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check activity interpretation and Git isolation
        run: dotnet run --project desktop/Checks/DesktopChecks.csproj
      - name: Check Windows file locations
        run: dotnet run --project desktop/MachineChecks/FileRootsChecks.csproj
      - name: Build the Windows app
        run: ./desktop/build.ps1
      - name: Check published provenance and installer preflight
        run: |
          ./desktop/build.ps1 -Publish
          ./desktop/Checks/package-checks.ps1 -PublishedPackageRoot ./desktop/output/app
      - name: Check laptop view interactions
        run: node desktop/Checks/ui-checks.mjs
      - name: Check phone interactions
        run: |
          node desktop/Checks/phone-ui-checks.mjs
          node desktop/Checks/navigation-ui-checks.mjs
          node desktop/Checks/phone-usage-checks.mjs
          node desktop/Checks/phone-info-checks.mjs
          node desktop/Checks/errands-ui-checks.mjs
          node desktop/Checks/computer-ui-checks.mjs
          node desktop/Checks/devices-ui-checks.mjs
          node desktop/Checks/files-ui-checks.mjs
          node desktop/Checks/file-content-ui-checks.mjs
          node desktop/Checks/offline-checks.mjs
      - name: Check repository update details on the phone
        run: node desktop/Checks/repositories-ui-checks.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local work evidence and summaries
        run: |
          python desktop/Checks/work-summary-checks.py
          python desktop/Checks/local-activity-checks.py
          python desktop/Checks/local-file-checks.py
          python desktop/Checks/laptop-inventory-checks.py
          python desktop/Checks/folder-explorer-checks.py
      - name: Check real Git fetch and update integration
        run: python desktop/Checks/repository-checks.py
      - name: Check repository observation caching
        run: python desktop/Checks/repository-cache-checks.py
      - name: Check automatic default-folder update safety
        run: python desktop/Checks/repository-sync-checks.py
      - name: Check fresh-fetch authorization and update results
        run: python desktop/Checks/repository-update-flow-checks.py
      - name: Check owned subprocess deadlines
        run: python desktop/Checks/repository-process-checks.py
      - name: Check account allowance normalization and display
        run: |
          python desktop/Checks/usage-checks.py
          python desktop/Checks/usage-events-checks.py
          python desktop/Checks/daily-allowance-checks.py
          python desktop/Checks/session-usage-checks.py
          python desktop/Checks/usage-history-checks.py
          python desktop/Checks/claude-token-checks.py
          python desktop/Checks/usage-archive-checks.py
          node desktop/Checks/usage-ui-checks.mjs
          node desktop/Checks/recent-usage-checks.mjs
      - name: Check companion access and API
        run: |
          node desktop/Checks/companion-checks.mjs
          node desktop/Checks/usage-archive-api-checks.mjs
