name: Windows desktop
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check activity interpretation and Git isolation
        run: dotnet run --project desktop/Checks/DesktopChecks.csproj
      - name: Build the Windows app
        run: ./desktop/build.ps1
      - name: Check laptop view interactions
        run: node desktop/Checks/ui-checks.mjs
      - name: Check phone interactions
        run: |
          node desktop/Checks/phone-ui-checks.mjs
          node desktop/Checks/computer-ui-checks.mjs
          node desktop/Checks/offline-checks.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local work evidence and summaries
        run: python desktop/Checks/work-summary-checks.py
      - name: Check account allowance normalization and display
        run: |
          python desktop/Checks/usage-checks.py
          node desktop/Checks/usage-ui-checks.mjs
      - name: Check companion access and API
        run: node desktop/Checks/companion-checks.mjs
