name: Page measures

# Renders every page a pull request touches in headless Chromium and reports
# what tools/render/measure.mjs reads off it: sideways scroll at phone width and
# the element causing it, blank icons, empty tables, text the design system
# never reached, house-style markup, and how far the page moved from its
# committed thumbnail. The report is the run's job summary; the desktop and
# phone shots are its `page-measures` artifact.
#
# A workflow of its own because it drives a browser, and test.yml is
# browser-free by construction. The two run side by side, so on a PR that
# touches a page this adds no wall-clock time: about a minute against the
# suite's three to four (measured 2026-10-06 in the sandbox; the Chromium
# download here was not).
#
# REPORT ONLY. Findings never turn this red. Under this repo's PR rules a red
# check on a session's own PR is work that session must come back for, and the
# measures are signals, not verdicts: a page may scroll sideways on purpose, a
# table may be empty because the render could not reach its data. It goes red
# only when the pass itself is broken, and the first thing it does is prove it
# is not: tools/test/page-measures.mjs runs every measure against a page with
# known defects, so a "none" in the report comes from detectors shown to fire
# on this same run.

on:
  pull_request:
    paths:
      - 'pages/**/*.html'
      - 'lib/kits/demos/**/*.html'
      - 'tools/render/**'
      - 'tools/test/page-measures.mjs'
      - 'tools/test/fixtures/page-measures.html'
      - '.github/workflows/page-measures.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-measures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Depth 2 is the PR's merge commit and its first parent, the base branch
      # tip, which is all `--base HEAD^1` needs to name the changed pages.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove every measure fires
        run: node tools/test/page-measures.mjs

      # A manual run has no merge commit to diff against, so it measures every page.
      - name: Measure the pages
        run: >-
          node tools/render/page-measures.mjs
          ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '--all' }}
          --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-measures
          path: tools/.preview/page-measures/
          if-no-files-found: ignore
