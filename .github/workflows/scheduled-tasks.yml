name: Scheduled tasks

# Runs the estate's scheduled tasks that are due, by progressive action
# (python/scheduled-tasks.py, whose header carries the design). The tasks are
# rows in web-tools-private's data/design/scheduled-tasks.csv whose entry is
# this file; each row's `every` is its cadence and its stages are rows in
# scheduled-task-stages.csv. This workflow fires daily and the script's gate
# decides, per task, whether anything is due, so a day with nothing due costs a
# date comparison and writes nothing. Rows whose entry is another file
# (activity-cache.yml, wsl-fetch.yml, a session hook) keep their own schedules.
#
# WHY IT LIVES IN THE PUBLIC REPO: activity-cache.yml's reason. Actions minutes
# are free on a public repository and billed on a private one. The registry, the
# state and the findings all live in web-tools-private and are reached through
# the two tokens below. The cost is that this run's log is public, so the script
# logs counts and never content.

on:
  # Daily, off the hour: scheduled runs queue behind everyone else's :00, and
  # GitHub starts them late anyway (10 to 17 minutes measured on 2026-10-09).
  schedule:
    - cron: '41 13 * * *'

  workflow_dispatch:
    inputs:
      task:
        description: 'One task id to run (blank runs every task that is due).'
        required: false
        default: ''
      force:
        description: 'Run past the gate even when the task is not yet due (an off task stays off).'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Run every stage and write nothing.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One run at a time: two runs would race to write the same state file.
concurrency:
  group: scheduled-tasks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: python
          sparse-checkout-cone-mode: true

      - name: Run what is due
        env:
          # The estate read token (registry, state, watched files) and the
          # registry write token (state and notes), as activity-cache.yml holds
          # them: two tokens, because one would carry write access everywhere.
          GH_TOKEN: ${{ secrets.ESTATE_CRAWL_TOKEN }}
          GH_WRITE_TOKEN: ${{ secrets.REGISTRY_WRITE_TOKEN }}
          # Untrusted input reaches the script through the environment and is
          # validated there, never interpolated into this shell.
          INPUT_TASK: ${{ inputs.task }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Scheduled tasks::No ESTATE_CRAWL_TOKEN secret, so nothing ran."
            exit 0
          fi
          ARGS=()
          if [ -n "$INPUT_TASK" ]; then ARGS+=(--task "$INPUT_TASK"); fi
          if [ "$INPUT_FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python3 python/scheduled-tasks.py "${ARGS[@]}"
