name: Tests

# One of the repo's two VERIFICATION workflows; page-measures.yml is the other.
# Everything else under
# .github/workflows/ is an errand (a cron or a button), and an errand's run has
# no commit under review to attach to, so it lives in the Actions tab and nowhere
# else. This one is triggered by a pull request, so its result attaches to the
# PR's head commit and becomes a check: the green or red mark in the merge box,
# the Checks tab, and the tick beside the commit wherever GitHub lists it.
#
# Why it exists: the configured git hooks regenerate deterministic artifacts
# during ordinary commits and local merge completion, but checkout setup can be
# skipped, --no-verify can bypass the hooks, and GitHub API/MCP/server-side
# writes cannot run them. node/test/derived-artifacts.test.mjs is deliberately
# independent of that refresh path. Here it runs on every PR, so stale output is
# caught by the platform rather than accepted because local setup looked ready.
#
# The suite is browser-free: `node --test` globs node/test/**/*.test.mjs, and
# every Playwright-driven check (subject-actions, render-copy, the pdf probes) is
# deliberately named without `.test.` and stays a manual run. That is what lets
# the install below skip the browser download.
#
# The one thing this cannot promise: that it ran. Observed 2026-08-06 on PR #362,
# a push to the branch produced NO synchronize run at all, so that commit sat in
# an open PR with zero checks and nothing said so. The next push to the same PR
# ran normally, so the trigger is not broken; what correlated was pushing the
# branch and then its base branch inside the same minute, which moves the merge
# ref the pull_request event is computed against.
#
# Seen again 2026-08-13 on PR #413, and this time the cause was measured rather
# than guessed: main had moved under the branch and the merge conflicted, so the
# PR's mergeable_state was `dirty`. A pull_request run is computed against the
# MERGE ref, and a PR that cannot be merged has none, so no run starts. Nothing
# reports this: the PR shows the previous commit's green check, the new commit
# shows no check at all, and the conflict notice is elsewhere in the UI. Two
# pushes in a row produced no run for exactly this reason and both looked, from
# the checks alone, like a trigger that had misfired.
#
# That confirms the 2026-08-06 reading rather than retiring it. Pushing the base
# branch inside the same minute is one way to leave the merge ref unavailable;
# an outright conflict is the durable way. The general statement covers both: no
# usable merge ref, no run.
#
# The move: after a push you care about, look for a run on the new head sha
# rather than assuming the trigger fired, and when none appears, check
# mergeable_state before anything else. A workflow that exists so the platform
# catches what memory does not is worth exactly nothing on the commit where it
# silently did not start.

on:
  pull_request:
  push:
    # Session branches too: GitHub builds no merge ref for a conflicted pull
    # request, so its pull_request run never starts and its newest commit would
    # otherwise carry no check at all (the snag ci-run-silently-not-started).
    branches: [main, 'claude/**', 'codex/**', 'gemini/**', 'agent/**']
    # The monthly WSL snapshot commits data and touches no code, so there is
    # nothing for the suite to say about it.
    paths-ignore: ['pages/wsl-sync/data/**']
  workflow_dispatch:
    inputs:
      preflight:
        description: Run checkout setup, generated-file refresh and the full suite; require unchanged tracked output.
        type: boolean
        default: false
      observe:
        description: Collect dependency and timing observations from one full run.
        type: boolean
        default: false

# Verification jobs read only. The main-only publication job below has its
# own grant to retain captured dependency observations.
permissions:
  contents: read

# A second push to a branch supersedes the first, so cancel the run it
# obsoleted instead of paying for both.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in about 100 seconds, so ten minutes is slack rather than a
    # budget. It exists because the failure it catches is not a slow test, it is
    # a test that never ENDS: `node --test` waits on the event loop, so one
    # jsdom component left un-destroyed (the State view starts a 60s interval to
    # age its rows) keeps the runner alive after every assertion has passed.
    # Measured 2026-08-22 on PR #472, where exactly that left the check sitting
    # in_progress and, with no timeout here, it would have run to GitHub's
    # six-hour default before reporting. Ten minutes turns six wasted hours into
    # a fast red, and a red is what a hung suite should be.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.preflight || inputs.observe) && 20 || 10 }}
    steps:
      - uses: actions/checkout@v5

      # 22, not 20, and not by preference: `node --test` only expands a glob
      # pattern from 22 on, so on 20 the test script looks for a directory
      # literally named ** and exits 1 before running anything. It also matches
      # the sandbox (22.22.2), which is the version the suite is written against.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # package-lock.json is gitignored in this repo, so there is no lockfile to
      # `npm ci` against or to key setup-node's cache with. The env var stops the
      # playwright dev dependency's postinstall from fetching browsers the suite
      # never launches, which is most of the install time.
      - name: Install
        # Deliberately not `npm run setup`: CI does not configure or exercise
        # local hooks, and must verify the committed artifacts without repairing
        # them first. Browser installation remains separate from this suite.
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run the suite
        # The reporter is the spec one, set in the npm script rather than here so
        # a contributor and the runner see the same output. It matters most
        # exactly when this step is red: node's TAP reporter emits a YAML block
        # per PASSING test and names a failure only where it happened, so a
        # failure early in a 2,280-test run sits ~250k characters above the end
        # and the logs API serves only the tail. Measured 2026-08-23, when three
        # rounds could not read why this check was failing. The spec reporter is
        # a third the size and repeats every failure, with its error, in a
        # summary at the very bottom.
        env:
          OBSERVE_FULL_RUN: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.observe) }}
          PREFLIGHT_FULL_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight }}
        run: |
          if [ "$PREFLIGHT_FULL_RUN" = true ]; then
            npm run preflight
            git diff --exit-code HEAD --
          elif [ "$OBSERVE_FULL_RUN" = true ]; then
            npm run test:observe -- --out node/.test-observations/run.json
          else
            npm test
          fi

      - name: Keep full-run observations
        if: ${{ always() && hashFiles('node/.test-observations/run.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-observations-${{ github.run_attempt }}
          path: node/.test-observations/run.json
          include-hidden-files: true
          retention-days: 30

      - name: Summarize full-run observations
        if: ${{ always() && hashFiles('node/.test-observations/run.json') != '' }}
        run: node node/testing/summary.mjs node/.test-observations/run.json >> "$GITHUB_STEP_SUMMARY"

      - name: Check bounded repository subprocesses
        run: python3 desktop/Checks/repository-process-checks.py

      - name: Check repository observation caching
        run: python3 desktop/Checks/repository-cache-checks.py

  publish-observations:
    needs: test
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read the observed run
        id: observations
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-observations-${{ github.run_attempt }}
          path: node/.test-observations
      - name: Retain the run in the private testing record
        if: ${{ steps.observations.outcome == 'success' }}
        continue-on-error: true
        env:
          REGISTRY_WRITE_TOKEN: ${{ secrets.REGISTRY_WRITE_TOKEN }}
        run: |
          if [ -n "$REGISTRY_WRITE_TOKEN" ]; then
            node node/testing/publish.mjs node/.test-observations/run.json
          else
            echo '::notice::Run observations remain available in the workflow artifact.'
          fi
      - name: Publish observed reach for fresh checkouts
        if: ${{ steps.observations.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node node/testing/publish.mjs node/.test-observations/run.json --public-reach

  edit-policy:
    # A job of its own because it needs what the suite's checkout leaves out:
    # history back to the merge base with main, which the default depth-one
    # checkout does not reach. The full repository is about 590 MiB, so the
    # history comes without file contents (filter blob:none), and git fetches
    # only the few blobs the check reads: each changed file at the base, and the
    # base's .gitattributes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Hold each changed file to its edit policy
        # The same engine .githooks/commit-msg runs on each commit, here over
        # every commit the branch adds, so a commit made with --no-verify or
        # through the API is held too.
        run: python3 skills/hooks/check-edit-policy.py --range
