<!-- Setups for crumbBar (../crumb-bar.js), mounted by the component stage
     (index.html?c=crumb-bar). Each template is one mount as a host writes it. -->

<template data-setup="A short trail">
  <div x-data="{ at: 'docs' }" class="rounded-lg border border-base-300 px-1">
    <nav x-data="crumbBar({ items: () => [
      { key: 'home', icon: 'ph-house', title: 'Home', action: () => at = 'home' },
      { key: 'repo', label: 'web-tools', mono: true, action: () => at = 'web-tools' },
      { key: 'dir', label: 'docs', mono: true, action: () => at = 'docs' },
    ] })" class="flex min-w-0"></nav>
  </div>
</template>

<template data-setup="A long trail, with a menu on the last crumb">
  <div x-data="{ menu: false }" class="rounded-lg border border-base-300 px-1">
    <nav x-data="crumbBar({ items: () => [
      { key: 'home', icon: 'ph-house', title: 'Home', action: () => {} },
      { key: 'owner', label: 'mehrlander', mono: true, action: () => {} },
      { key: 'repo', label: 'web-tools', mono: true, action: () => {} },
      { key: 'dir', label: 'lib/alpineComponents', mono: true, action: () => {} },
      { key: 'file', label: 'powershell-outpost-view.js', mono: true, menu: true, action: open => menu = open },
    ] })" class="flex min-w-0"></nav>
    <p x-show="menu" class="px-2 pb-2 text-base text-base-content/60">The host opens its menu here.</p>
  </div>
</template>
