<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deck-host: a page that docks its decks</title>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
<script type="module">
  // The chain boot, so the FAB arrives and the kits are fetched at the previewed ref.
  await import('https://mehrlander.github.io/web-tools/lib/entry.js');
  await gh.load('kits/swipe-deck.js');
  // The one line that makes this page a host. It loads kits/dock-split.js
  // itself, which is what draws the seam.
  await gh.load('kits/deck-host.js');
  // The header stays in view above a docked deck.
  deckHost.install({ top: document.getElementById('chrome') });
  await deckHost.ready;

  const STATIONS = [
    ['GR-11', 'Ridge cut, mile 4', 'Ground'], ['GR-14', 'Bench above the fork', 'Ground'],
    ['GR-19', 'Talus fan, east side', 'Ground'], ['WA-02', 'Culvert at the switchback', 'Water'],
    ['WA-05', 'Spring box, upper meadow', 'Water'], ['WA-09', 'Gauge at the footbridge', 'Water'],
    ['AI-01', 'Mast on the saddle', 'Air'], ['AI-03', 'Shelter roof', 'Air'],
    ['AI-07', 'Clearing below the lookout', 'Air'], ['SN-04', 'Snow course, north aspect', 'Snow'],
    ['SN-06', 'Pillow at the trailhead', 'Snow'], ['SN-08', 'Depth stake by the lake', 'Snow'],
  ];
  const list = document.getElementById('list');
  list.innerHTML = STATIONS.map(([id, name, kind], i) => `<button type="button" data-i="${i}"
      class="flex w-full items-baseline gap-3 border-b border-base-200 px-4 py-2 text-left hover:bg-base-200 aria-selected:bg-base-200">
      <span class="w-14 shrink-0 font-mono text-xs text-base-content/50">${id}</span>
      <span class="min-w-0 flex-1 truncate">${name}</span><span class="badge badge-sm badge-ghost">${kind}</span></button>`).join('');
  // The row the deck is on stays marked beside it, which is what a dock is for.
  const markRow = (i) => list.querySelectorAll('[data-i]').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.i === i)));
  list.addEventListener('click', (e) => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    markRow(+b.dataset.i);
    swipeDeck.open({
      count: STATIONS.length, start: +b.dataset.i, title: 'Stations', icon: 'ph-map-pin',
      index: i => ({ title: `${STATIONS[i][0]} · ${STATIONS[i][1]}`, group: STATIONS[i][2] }),
      onSlide: markRow,
      render: (i, slide) => {
        const [id, name, kind] = STATIONS[i];
        slide.innerHTML = `<div class="space-y-3"><div class="flex items-baseline gap-2"><span class="font-mono text-sm text-base-content/50">${id}</span>
          <span class="text-lg font-semibold">${name}</span><span class="badge badge-sm badge-ghost">${kind}</span></div>
          ${Array.from({ length: 6 }, (_, k) => `<p class="text-[15px] leading-7">Reading ${k + 1} at ${id}: the logger held its battery, the probe stayed level, and the record for the week is complete.</p>`).join('')}</div>`;
      },
    });
  });
  document.body.dataset.ready = '1';
</script>
</head>
<body class="bg-base-100 text-base-content">
<div id="chrome" class="sticky top-0 z-10 flex flex-wrap items-baseline gap-x-4 gap-y-1 border-b border-base-300 bg-base-100 px-4 py-3">
  <h1 class="text-xl font-semibold">deck-host</h1>
  <code class="rounded border border-base-300 bg-base-200 px-1.5 py-0.5 font-mono text-[13px]">await gh.load('kits/deck-host.js')</code>
  <span class="text-[13px] text-base-content/50">tap a row · docked from 1024px · drag the edge · the toggle fills the window</span>
</div>
<main>
  <div id="list" role="listbox" aria-label="Stations"></div>
</main>
</body>
</html>
