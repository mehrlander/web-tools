<!doctype html>
<html lang="en" data-theme="emerald">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Courier message probe</title>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/@phosphor-icons/web"></script>
<script defer src="https://unpkg.com/alpinejs"></script>
<!--
  courier/probe.html: the receiving half of a throwaway test. Does a page a
  session cannot reach hand data to a signed-in Web Tools window by
  postMessage, and can that window hand a script back to run there?

  Opened as a popup by the probe bookmarklet in courier/probe.md, rendered
  through toss-render's address mode, which mounts it same-origin with the toss
  shell. The shell is the popup's top window, so that is where messages from
  the opener land, and this frame listens there.

  The exchange: this page posts `ready` to the opener; the opener posts
  `probe` (title, URL, links); this page replies `run` with a small script; the
  opener runs it and posts `ran`; this page replies `done`. Nothing is written
  anywhere, and nothing leaves this window except the `run` script.
-->
</head>
<body class="min-h-screen bg-base-200">
<main x-data="probe" class="w-full p-4 flex flex-col gap-4">
  <h1 class="text-2xl font-semibold flex items-center gap-2"><i class="ph ph-envelope-simple-open"></i>Courier message probe</h1>

  <div class="flex flex-wrap gap-2">
    <span class="badge badge-lg" :class="opener ? 'badge-success' : 'badge-error'" x-text="opener ? 'Opener present' : 'No opener'"></span>
    <span class="badge badge-lg" :class="signedIn ? 'badge-success' : 'badge-warning'" x-text="signedIn ? 'Signed in' : 'Not signed in'"></span>
    <span class="badge badge-lg badge-ghost" x-text="'This window: ' + here"></span>
  </div>

  <div x-show="privateNote" x-cloak class="card bg-base-100 shadow-sm">
    <div class="card-body p-4 gap-1">
      <div class="text-sm uppercase tracking-wide text-base-content/50">Private context, read here with your token</div>
      <div class="whitespace-pre-wrap" x-text="privateNote"></div>
    </div>
  </div>

  <div x-show="!log.length" class="text-base-content/60">Waiting for the opener to send something.</div>

  <template x-for="m in log" :key="m.n">
    <div class="card bg-base-100 shadow-sm">
      <div class="card-body p-4 gap-2">
        <div class="flex flex-wrap items-center gap-2">
          <span class="badge badge-primary" x-text="m.type"></span>
          <span class="font-mono text-sm" x-text="'from ' + m.origin"></span>
          <span class="text-sm text-base-content/50" x-text="m.at"></span>
        </div>
        <template x-if="m.type === 'probe'">
          <div class="flex flex-col gap-1">
            <div class="font-semibold" x-text="m.data.title"></div>
            <a class="link font-mono text-sm break-all" :href="m.data.url" x-text="m.data.url"></a>
            <div class="text-sm" x-text="m.data.links.length + ' links, page HTML ' + m.data.htmlBytes.toLocaleString() + ' characters'"></div>
            <div class="max-h-96 overflow-auto border border-base-300 rounded">
              <table class="table table-xs">
                <tbody>
                  <template x-for="(l, i) in m.data.links" :key="i">
                    <tr><td x-text="l.text || '(no text)'"></td><td class="font-mono break-all" x-text="l.href"></td></tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
        <template x-if="m.type === 'ran'">
          <pre class="bg-base-200 rounded p-2 text-sm overflow-auto" x-text="JSON.stringify(m.data.error ? { error: m.data.error } : m.data.result, null, 2)"></pre>
        </template>
      </div>
    </div>
  </template>
</main>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('probe', () => ({
    top: window.top,
    opener: null,
    here: '',
    signedIn: false,
    privateNote: '',
    log: [],
    n: 0,

    // The script sent back to run in the opener's page. It stands in for a
    // private errand script: this window chose it, the opener only runs it.
    RUN: "return { h1: document.querySelector('h1')?.textContent?.trim() || null, forms: document.forms.length, pdfLinks: [...document.links].filter(a => /\\.pdf($|\\?)/i.test(a.href)).length }",

    init() {
      this.opener = this.top.opener;
      this.here = this.top.location.origin;
      let token = '';
      try { token = localStorage.getItem('ghToken') || ''; } catch {}
      this.signedIn = !!token;
      if (token) this.readPrivate(token);
      this.top.addEventListener('message', e => this.receive(e));
      if (this.opener) this.opener.postMessage({ type: 'ready' }, '*');
    },

    async readPrivate(token) {
      try {
        const r = await fetch('https://api.github.com/repos/mehrlander/web-tools-private/contents/mailbox/requests/ask-2026-09-23-demo.json',
          { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.raw' }, cache: 'no-store' });
        this.privateNote = r.ok ? (await r.json()).note : 'Private read failed: HTTP ' + r.status;
      } catch (e) { this.privateNote = 'Private read failed: ' + e.message; }
    },

    receive(e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !['probe', 'ran'].includes(d.type)) return;
      if (e.source !== this.opener) return;
      this.log.unshift({ n: ++this.n, type: d.type, origin: e.origin, at: new Date().toLocaleTimeString(), data: d });
      if (d.type === 'probe') e.source.postMessage({ type: 'run', code: this.RUN }, e.origin);
      if (d.type === 'ran') e.source.postMessage({ type: 'done', links: this.log.find(m => m.type === 'probe')?.data.links.length ?? 0 }, e.origin);
    },
  }));
});
</script>
</body>
</html>
