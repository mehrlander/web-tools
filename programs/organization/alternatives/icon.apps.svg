<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.75 29 29" role="img" aria-label="organization program">
  <title>organization program</title>
  <desc>Three cells in an L, outlined, and a fourth lifted out and turned, cut from a blue-600 tile. Drawn on the drawn-mark box and rules (docs/favicons/README.md): solid fills, no strokes, and every gap at least 2.5 units, which is about 1.4 CSS pixels at 16. Chosen 2026-11-07, the owner's first favorite: redrawn after the apps icon of Fluent UI System Icons (Microsoft, MIT), with its gaps widened to the rules; the ideas it was chosen from are in docs/prototypes/program-mark-ideas.html.</desc>
